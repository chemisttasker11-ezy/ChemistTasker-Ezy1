appId: com.chemisttasker.app
---
- openLink: "frontendmobile://pharmacist/invoice"
- runFlow:
    when:
      visible: 'Open in .*ChemistTasker.*'
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Invoices & finances"
    timeout: 30000
- tapOn: "Create invoice"
- extendedWaitUntil:
    visible: "Choose accepted shift"
    timeout: 30000
- tapOn: "Choose accepted shift"
- tapOn: "Native Pharmacy A(, .*)?"
- scrollUntilVisible:
    element:
      id: "invoice-quantity-1"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "invoice-quantity-1"
- eraseText: 20
- inputText: "7.5"
- assertVisible: "7.5"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Items & services"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      text: ".*577.50.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Save invoice"
- extendedWaitUntil:
    visible: "View invoice"
    timeout: 30000
- tapOn: "View invoice"
- tapOn: "Edit invoice"
- scrollUntilVisible:
    element:
      id: "invoice-quantity-1"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "invoice-quantity-1"
- eraseText: 20
- inputText: "8"
- assertVisible: "8"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Items & services"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Save revision"
- extendedWaitUntil:
    visible: "View invoice"
    timeout: 30000
- tapOn: "View invoice"
- assertVisible: "Revision 2.*"
- scrollUntilVisible:
    element:
      text: "Send email"
    direction: DOWN
    timeout: 30000
- tapOn: "Send email"
- tapOn: "Confirm"
- extendedWaitUntil:
    visible: "View invoice"
    timeout: 30000
- tapOn: "View invoice"
- assertVisible: "Sent"
- assertVisible: ".*616.00.*"
- scrollUntilVisible:
    element:
      text: "Share PDF"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Share PDF"
    index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Copy|Save to Files|Quick Share|Bluetooth|Nearby Share"
          timeout: 30000
# iOS verifies the same system sheet with NativeShareAcceptance immediately
# after this flow. Maestro's foreground hierarchy omits SharingUIService.

