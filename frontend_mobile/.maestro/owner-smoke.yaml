appId: com.chemisttasker.app
env:
  MAESTRO_OWNER_EMAIL: ${MAESTRO_OWNER_EMAIL}
  MAESTRO_OWNER_PASSWORD: ${MAESTRO_OWNER_PASSWORD}
---
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn: "Work email"
- inputText: ${MAESTRO_OWNER_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_OWNER_PASSWORD}
- tapOn: "Sign in"
- runFlow:
    when:
      visible: "Use biometrics for this account?"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- tapOn: "Shifts tab"
- assertVisible: "Shifts"
- tapOn: "Post shift tab"
- assertVisible: "Post"
- tapOn: "Hub tab"
- assertVisible: "Hub"
- tapOn: "Chat tab"
- assertVisible: "Chat"
- tapOn: "Open owner menu"
- assertVisible: "Owner menu"
- assertVisible: "Weekly Roster"
- assertVisible: "Attendance Approvals"
- assertVisible: "Timesheets"
- assertVisible: "Workforce & Payroll"
- tapOn: "Logout"
- assertVisible: "Welcome back"
