appId: com.chemisttasker.app
env:
  MAESTRO_ADMIN_EMAIL: ${MAESTRO_ADMIN_EMAIL}
  MAESTRO_ADMIN_PASSWORD: ${MAESTRO_ADMIN_PASSWORD}
---
- launchApp:
    clearState: true
- tapOn: "Work email"
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- tapOn: "Sign in"
- runFlow:
    when:
      visible: "Use biometrics for this account?"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "Open admin menu"
    timeout: 20000
- tapOn: "Open admin menu"
- assertVisible: "Admin workspace"
- assertVisible: "ACTIVE PHARMACY"
- tapOn: "Switch admin scope"
- extendedWaitUntil:
    visible: "Open admin menu"
    timeout: 20000
- tapOn: "Open admin menu"
- assertVisible: "Current admin scope"
- tapOn: "Return to pharmacist workspace"
- extendedWaitUntil:
    visible: "Open pharmacist menu"
    timeout: 20000
- tapOn: "Open pharmacist menu"
- tapOn: "Admin workspace"
- extendedWaitUntil:
    visible: "Open admin menu"
    timeout: 20000
- tapOn: "Open admin menu"
- tapOn: "Logout"
- assertVisible: "Welcome back"
