name: chemisttasker_staging

x-backend-environment: &backend-environment
  SECRET_KEY: "${STAGING_DJANGO_SECRET_KEY:?STAGING_DJANGO_SECRET_KEY is required}"
  ADMIN_URL: "admin/"
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "core.settings"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "${STAGING_PUBLIC_URL:-https://preview.invalid}"
  CSRF_TRUSTED_ORIGINS: "${STAGING_PUBLIC_URL:-https://preview.invalid},https://*.trycloudflare.com"
  SECURE_SSL_REDIRECT: "True"
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  JWT_COOKIE_SECURE: "True"
  APP_ENV: "staging"
  FRONTEND_BASE_URL: "${STAGING_PUBLIC_URL:-https://preview.invalid}"
  BACKEND_BASE_URL: "${STAGING_PUBLIC_URL:-https://preview.invalid}"
  USE_PROD_DB: "False"
  LOCAL_DB_NAME: "chemisttasker_staging"
  LOCAL_DB_USER: "chemisttasker_staging"
  LOCAL_DB_PASSWORD: "${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}"
  LOCAL_DB_HOST: "postgres"
  LOCAL_DB_PORT: "5432"
  USE_AZURE_STORAGE: "False"
  REDIS_URL: "redis://redis:6379/0"
  CHANNEL_REDIS_URL: "redis://redis:6379/1"
  CELERY_BROKER_URL: "redis://redis:6379/2"
  CELERY_RESULT_BACKEND: "redis://redis:6379/3"
  DJANGO_CACHE_URL: "redis://redis:6379/4"
  REDIS_KEY_PREFIX: "chemisttasker:staging"
  USE_REDIS_CHANNEL_LAYER: "True"
  PUBLIC_COMMUNITY_ENABLED: "True"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: "staging@chemisttasker.invalid"
  RECAPTCHA_SECRET_KEY: "${STAGING_RECAPTCHA_SECRET_KEY:?STAGING_RECAPTCHA_SECRET_KEY is required}"
  AZURE_OCR_ENDPOINT: ""
  AZURE_OCR_KEY: ""
  SCRAPINGBEE_API_KEY: ""
  MOBILEMESSAGE_USERNAME: ""
  MOBILEMESSAGE_PASSWORD: ""
  MOBILEMESSAGE_SENDER: "ChemistTasker"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  LOG_LEVEL: "INFO"
  CELERY_LOG_LEVEL: "INFO"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chemisttasker_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: "chemisttasker_staging"
      POSTGRES_USER: "chemisttasker_staging"
      POSTGRES_PASSWORD: "${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemisttasker_staging -d chemisttasker_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: chemisttasker_redis_staging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - staging_redis_data:/data
    networks:
      - staging_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: chemisttasker_backend_staging:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chemisttasker_backend_staging
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COLLECT_STATIC: "1"
      RUN_MIGRATIONS: "1"
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "core.asgi:application"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging_network
    volumes:
      - staging_static_data:/app/staticfiles
      - staging_media_data:/app/media
      - staging_verification_data:/app/verification_outputs
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery_worker:
    image: chemisttasker_backend_staging:latest
    container_name: chemisttasker_celery_staging
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COLLECT_STATIC: "0"
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "core", "worker", "-l", "INFO", "-Q", "email,default,notifications,ocr,billing", "--concurrency=2"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - staging_network
    volumes:
      - staging_media_data:/app/media
      - staging_verification_data:/app/verification_outputs

  celery_beat:
    image: chemisttasker_backend_staging:latest
    container_name: chemisttasker_celery_beat_staging
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COLLECT_STATIC: "0"
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "core", "beat", "-l", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - staging_network

  frontend:
    build:
      context: .
      dockerfile: frontend_web/Dockerfile
      args:
        REQUIRE_WEB_INTEGRATIONS: "1"
        VITE_PUBLIC_SITE_ENABLED: "1"
        VITE_API_URL: "/api"
        VITE_Maps_API_KEY: "${STAGING_WEB_MAPS_API_KEY:?STAGING_WEB_MAPS_API_KEY is required}"
        VITE_RECAPTCHA_SITE_KEY: "${STAGING_RECAPTCHA_SITE_KEY:?STAGING_RECAPTCHA_SITE_KEY is required}"
    container_name: chemisttasker_frontend_staging
    restart: unless-stopped
    networks:
      - staging_network

  landing:
    build:
      context: ./frontend_web/landing_next
      args:
        REQUIRE_WEB_INTEGRATIONS: "1"
        NEXT_PUBLIC_SITE_URL: "${STAGING_PUBLIC_URL:-https://preview.invalid}"
        NEXT_PUBLIC_PLATFORM_URL: "${STAGING_PUBLIC_URL:-https://preview.invalid}"
        NEXT_PUBLIC_Maps_API_KEY: "${STAGING_WEB_MAPS_API_KEY:?STAGING_WEB_MAPS_API_KEY is required}"
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${STAGING_RECAPTCHA_SITE_KEY:?STAGING_RECAPTCHA_SITE_KEY is required}"
    container_name: chemisttasker_public_staging
    restart: unless-stopped
    environment:
      PLATFORM_API_URL: "http://web:8000/api"
      HUB_API_URL: "http://web:8000/api"
      NEXT_PUBLIC_SITE_URL: "${STAGING_PUBLIC_URL:-https://preview.invalid}"
      NEXT_PUBLIC_PLATFORM_URL: "${STAGING_PUBLIC_URL:-https://preview.invalid}"
      NEXT_PUBLIC_Maps_API_KEY: "${STAGING_WEB_MAPS_API_KEY:?STAGING_WEB_MAPS_API_KEY is required}"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${STAGING_RECAPTCHA_SITE_KEY:?STAGING_RECAPTCHA_SITE_KEY is required}"
      DASHBOARD_INTERNAL_URL: "http://frontend:80"
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - staging_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gateway:
    image: nginx:1.27-alpine
    container_name: chemisttasker_gateway_staging
    restart: unless-stopped
    depends_on:
      landing:
        condition: service_healthy
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - staging_network
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_static_data:/app/staticfiles:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: chemisttasker_cloudflared_staging
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://gateway:8080"]
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - staging_network

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_static_data:
  staging_media_data:
  staging_verification_data:

networks:
  staging_network:
    name: chemisttasker_staging_network
    driver: bridge
