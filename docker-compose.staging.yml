name: chemisttasker_staging

# Bounded json-file logs so staging cannot fill the disk shared with production.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  SECRET_KEY: "${STAGING_DJANGO_SECRET_KEY:?STAGING_DJANGO_SECRET_KEY is required}"
  ADMIN_URL: "admin/"
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "core.settings"
  ALLOWED_HOSTS: "${STAGING_ALLOWED_HOSTS:-staging.chemisttasker.com.au},localhost,127.0.0.1,web"
  CORS_ALLOWED_ORIGINS: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au},http://localhost:3000,http://localhost:5173"
  CSRF_TRUSTED_ORIGINS: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au},http://localhost:3000,http://localhost:5173"
  SECURE_SSL_REDIRECT: "True"
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  JWT_COOKIE_SECURE: "True"
  JWT_COOKIE_PATH: "/"
  APP_ENV: "staging"
  FRONTEND_BASE_URL: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au}"
  BACKEND_BASE_URL: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au}"
  STAGING_TEST_DATA_ENABLED: "1"
  USE_PROD_DB: "False"
  LOCAL_DB_NAME: "chemisttasker_staging"
  LOCAL_DB_USER: "chemisttasker_staging"
  LOCAL_DB_PASSWORD: "${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}"
  LOCAL_DB_HOST: "postgres"
  LOCAL_DB_PORT: "5432"
  USE_AZURE_STORAGE: "${STAGING_USE_AZURE_STORAGE:-False}"
  AZURE_ACCOUNT_NAME: "${AZURE_ACCOUNT_NAME:-}"
  AZURE_ACCOUNT_KEY: "${AZURE_ACCOUNT_KEY:-}"
  AZURE_CONTAINER: "${AZURE_CONTAINER:-}"
  REDIS_URL: "redis://redis:6379/0"
  CHANNEL_REDIS_URL: "redis://redis:6379/1"
  CELERY_BROKER_URL: "redis://redis:6379/2"
  CELERY_RESULT_BACKEND: "redis://redis:6379/3"
  DJANGO_CACHE_URL: "redis://redis:6379/4"
  REDIS_KEY_PREFIX: "chemisttasker:staging"
  USE_REDIS_CHANNEL_LAYER: "True"
  CELERY_TASK_DEFAULT_QUEUE: "default"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
  CELERY_RESULT_EXPIRES: "3600"
  CELERY_TASK_IGNORE_RESULT: "True"
  EMAIL_TASK_RATE_LIMIT: "30/m"
  PUBLIC_COMMUNITY_ENABLED: "True"
  EMAIL_BACKEND: "${STAGING_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-staging@chemisttasker.invalid}"
  SUPPORT_EMAIL: "${SUPPORT_EMAIL:-${DEFAULT_FROM_EMAIL:-staging@chemisttasker.invalid}}"
  RECAPTCHA_SECRET_KEY: "${RECAPTCHA_SECRET_KEY:?RECAPTCHA_SECRET_KEY is required}"
  AZURE_OCR_ENDPOINT: "${AZURE_OCR_ENDPOINT:-}"
  AZURE_OCR_KEY: "${AZURE_OCR_KEY:-}"
  SCRAPINGBEE_API_KEY: "${SCRAPINGBEE_API_KEY:-}"
  AHPRA_SOURCE: "${STAGING_AHPRA_SOURCE:-scrapingbee}"
  AHPRA_TEST_LOOKUP_ENABLED: "${STAGING_AHPRA_TEST_LOOKUP_ENABLED:-0}"
  AHPRA_TEST_LOOKUP_KEY: "${AHPRA_TEST_LOOKUP_KEY:-}"
  AHPRA_VERIFIER_TOKEN_SHA256: "${AHPRA_VERIFIER_TOKEN_SHA256:-}"
  ADMIN_EMAILS: "${STAGING_ADMIN_EMAILS:-}"
  MOBILEMESSAGE_USERNAME: "${MOBILEMESSAGE_USERNAME:-}"
  MOBILEMESSAGE_PASSWORD: "${MOBILEMESSAGE_PASSWORD:-}"
  MOBILEMESSAGE_SENDER: "${MOBILEMESSAGE_SENDER:-ChemistTasker}"
  MOBILE_OTP_DISPLAY_IN_APP: "${STAGING_MOBILE_OTP_DISPLAY_IN_APP:-True}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
  LOG_LEVEL: "INFO"
  CELERY_LOG_LEVEL: "INFO"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chemisttasker_postgres_staging
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: "chemisttasker_staging"
      POSTGRES_USER: "chemisttasker_staging"
      POSTGRES_PASSWORD: "${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemisttasker_staging -d chemisttasker_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.2-alpine
    container_name: chemisttasker_redis_staging
    logging: *default-logging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - staging_redis_data:/data
    networks:
      - staging_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: chemisttasker_backend_staging:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chemisttasker_backend_staging
    logging: *default-logging
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COLLECT_STATIC: "1"
      RUN_MIGRATIONS: "${STAGING_RUN_MIGRATIONS:-1}"
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "core.asgi:application"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging_network
    volumes:
      - staging_static_data:/app/staticfiles
      - staging_media_data:/app/media
      - staging_verification_data:/app/verification_outputs
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery_worker:
    profiles: ["workers"]
    image: chemisttasker_backend_staging:latest
    container_name: chemisttasker_celery_staging
    logging: *default-logging
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COLLECT_STATIC: "0"
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "core", "worker", "-l", "INFO", "-Q", "email,default,notifications,ocr,billing", "--concurrency=2"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - staging_network
    volumes:
      - staging_media_data:/app/media
      - staging_verification_data:/app/verification_outputs
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$(hostname)"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery_beat:
    profiles: ["workers"]
    image: chemisttasker_backend_staging:latest
    container_name: chemisttasker_celery_beat_staging
    logging: *default-logging
    restart: unless-stopped
    environment:
      <<: *backend-environment
      COLLECT_STATIC: "0"
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "core", "beat", "-l", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - staging_network

  frontend:
    build:
      context: .
      dockerfile: frontend_web/Dockerfile
      args:
        REQUIRE_WEB_INTEGRATIONS: "1"
        VITE_PUBLIC_SITE_ENABLED: "1"
        VITE_API_URL: "/api/v1"
        VITE_Maps_API_KEY: "${VITE_Maps_API_KEY:?VITE_Maps_API_KEY is required}"
        VITE_RECAPTCHA_SITE_KEY: "${VITE_RECAPTCHA_SITE_KEY:?VITE_RECAPTCHA_SITE_KEY is required}"
    container_name: chemisttasker_frontend_staging
    logging: *default-logging
    restart: unless-stopped
    networks:
      - staging_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  landing:
    build:
      context: .
      dockerfile: frontend_web/landing_next/Dockerfile
      args:
        REQUIRE_WEB_INTEGRATIONS: "1"
        NEXT_PUBLIC_SITE_URL: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au}"
        NEXT_PUBLIC_PLATFORM_URL: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au}"
        NEXT_PUBLIC_Maps_API_KEY: "${VITE_Maps_API_KEY:?VITE_Maps_API_KEY is required}"
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${VITE_RECAPTCHA_SITE_KEY:?VITE_RECAPTCHA_SITE_KEY is required}"
    container_name: chemisttasker_public_staging
    logging: *default-logging
    restart: unless-stopped
    environment:
      PLATFORM_API_URL: "http://web:8000/api/v1"
      HUB_API_URL: "http://web:8000/api/v1"
      NEXT_PUBLIC_SITE_URL: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au}"
      NEXT_PUBLIC_PLATFORM_URL: "${STAGING_PUBLIC_URL:-https://staging.chemisttasker.com.au}"
      NEXT_PUBLIC_Maps_API_KEY: "${VITE_Maps_API_KEY:?VITE_Maps_API_KEY is required}"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${VITE_RECAPTCHA_SITE_KEY:?VITE_RECAPTCHA_SITE_KEY is required}"
      DASHBOARD_INTERNAL_URL: "http://frontend:80"
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - staging_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Keep this definition stable: shared Nginx (production-owned) resolves the
  # gateway address only when it loads, so recreating the container can break
  # staging routing. deploy-staging.sh restarts it instead.
  gateway:
    image: nginx:1.27.5-alpine
    container_name: chemisttasker_gateway_staging
    restart: unless-stopped
    depends_on:
      landing:
        condition: service_healthy
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - staging_network
      - shared_backend_network
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_static_data:/app/staticfiles:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Cloudflare Quick Tunnel support was removed. Permanent staging traffic
  # reaches gateway through the VPS shared Nginx network and Let's Encrypt.

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_static_data:
  staging_media_data:
  staging_verification_data:

networks:
  staging_network:
    name: chemisttasker_staging_network
    driver: bridge
  shared_backend_network:
    external: true
    name: shared_backend_network
