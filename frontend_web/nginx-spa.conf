server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @retained_asset;
    }
    # Old open tabs can still request public hashed files from the previous release.
    location @retained_asset {
        root /var/cache/chemisttasker-assets;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
