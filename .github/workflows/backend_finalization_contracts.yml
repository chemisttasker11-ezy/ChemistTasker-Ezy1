name: Backend Finalization Contracts

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend_finalization_contracts.yml'
      - 'docs/architecture/BACKEND_FINALIZATION_LIVE_PROGRESS.md'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_finalization_contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-finalization-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-only-finalization-contract-key
  ADMIN_URL: admin/
  EMAIL_HOST_USER: ci@example.test
  EMAIL_HOST_PASSWORD: ci-placeholder
  DEFAULT_FROM_EMAIL: ci@example.test
  RECAPTCHA_SECRET_KEY: ci-placeholder
  AZURE_OCR_ENDPOINT: https://example.test
  AZURE_OCR_KEY: ci-placeholder
  SCRAPINGBEE_API_KEY: ci-placeholder
  MOBILEMESSAGE_USERNAME: ci-placeholder
  MOBILEMESSAGE_PASSWORD: ci-placeholder
  MOBILEMESSAGE_SENDER: ChemistTasker
  LOCAL_DB_NAME: chemisttasker_ci
  LOCAL_DB_USER: postgres
  LOCAL_DB_PASSWORD: postgres
  LOCAL_DB_HOST: 127.0.0.1
  LOCAL_DB_PORT: '5432'

jobs:
  roster-http-contracts:
    name: roster-http-${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            settings: core.contract_test_settings
          - database: postgres
            settings: core.postgres_test_settings
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact tested commit
        run: git rev-parse HEAD
      - name: Archive tracked source for isolated review
        if: matrix.database == 'sqlite'
        run: |
          mkdir -p "${RUNNER_TEMP}/finalization-source"
          git rev-parse HEAD > "${RUNNER_TEMP}/finalization-source/COMMIT"
          git archive --format=tar.gz HEAD > "${RUNNER_TEMP}/finalization-source/source.tar.gz"
          cd "${RUNNER_TEMP}/finalization-source"
          sha256sum source.tar.gz > SHA256SUMS
      - name: Retain exact source (no Git credentials or runtime files)
        if: matrix.database == 'sqlite'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finalization-source
          path: ${{ runner.temp }}/finalization-source/
          retention-days: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend requirements
        run: pip install -r backend/requirements.txt
      - name: Archive isolated test runtime
        if: matrix.database == 'sqlite'
        shell: bash
        run: |
          python - <<'PY_RUNTIME'
          import hashlib, json, os, pathlib, subprocess, sys, tarfile
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'finalization-runtime'
          destination.mkdir(exist_ok=True)
          prefix = pathlib.Path(sys.base_prefix)
          archive = destination / 'python-runtime.tar.gz'
          def keep(info):
              parts = pathlib.PurePosixPath(info.name).parts
              if '__pycache__' in parts or '.cache' in parts:
                  return None
              return info
          with tarfile.open(archive, 'w:gz') as tar:
              for item in ('bin/python3.12', 'lib/libpython3.12.so', 'lib/libpython3.12.so.1.0', 'lib/python3.12'):
                  path = prefix / item
                  if path.exists():
                      tar.add(path, arcname=item, filter=keep)
          (destination / 'SHA256SUMS').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  python-runtime.tar.gz\n')
          (destination / 'COMMIT').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          (destination / 'requirements.freeze').write_text(subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True))
          (destination / 'runtime.json').write_text(json.dumps({'version': sys.version, 'platform': sys.platform}, indent=2))
          PY_RUNTIME
      - name: Retain isolated test runtime (temporary bootstrap)
        if: matrix.database == 'sqlite'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finalization-runtime
          path: ${{ runner.temp }}/finalization-runtime/
          retention-days: 1
      - name: Migration drift
        run: python backend/manage.py makemigrations --check --dry-run --settings=${{ matrix.settings }}
      - name: Roster HTTP identity and publication contracts
        run: >-
          python backend/manage.py test
          workforce.tests.test_roster_slot_http_contract
          workforce.tests.test_roster_shift_republish
          workforce.tests.test_roster_escalation
          --settings=${{ matrix.settings }} --verbosity=2 --noinput
