name: Credential-Free Security Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    name: Python dependency and SAST audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check pip-audit bandit

      - name: Audit backend runtime dependencies
        id: pip_runtime
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt -f json -o pip-audit-runtime.json

      - name: Audit backend development dependencies
        id: pip_dev
        continue-on-error: true
        run: pip-audit -r backend/requirements-dev.txt -f json -o pip-audit-dev.json

      - name: Run Bandit across backend
        id: bandit
        continue-on-error: true
        run: |
          bandit -r backend -f json -o bandit.json             -x backend/.venv,backend/venv,backend/**/migrations || true

      - name: Enforce Python dependency audit
        run: |
          test "${{ steps.pip_runtime.outcome }}" = "success" || {
            echo "::error::pip-audit found vulnerable runtime dependencies."
            exit 1
          }
          test "${{ steps.pip_dev.outcome }}" = "success" || {
            echo "::error::pip-audit found vulnerable development dependencies."
            exit 1
          }

      - name: Enforce high-severity Bandit findings
        run: |
          if [ -f bandit.json ]; then
            high=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit.json)
            echo "Bandit high-severity findings: $high"
            test "$high" -eq 0 || exit 1
          fi

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-reports
          path: |
            pip-audit-runtime.json
            pip-audit-dev.json
            bandit.json
          if-no-files-found: warn

  javascript-dependencies:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - frontend_web
          - frontend_mobile
          - shared-core
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v20
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Audit production dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high

      - name: Save full npm audit report
        if: always()
        working-directory: ${{ matrix.project }}
        run: npm audit --json > npm-audit.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-${{ matrix.project }}
          path: ${{ matrix.project }}/npm-audit.json
          if-no-files-found: warn

  semgrep:
    name: Whole-repository Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Scan application source
        run: |
          semgrep scan             --config auto             --metrics=off             --sarif             --output semgrep.sarif             backend frontend_web frontend_mobile shared-core presentation_web scripts

      - name: Upload Semgrep report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

      - name: Upload Semgrep SARIF to GitHub
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: semgrep.sarif
