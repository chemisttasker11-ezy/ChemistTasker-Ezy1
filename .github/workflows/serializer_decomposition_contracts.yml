name: Serializer Decomposition Contracts

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/architecture/SERIALIZER_SPLIT_REVIEW.json'
      - '.github/workflows/serializer_decomposition_contracts.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/serializer_decomposition_contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serializer-decomposition-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-only-serializer-contract-key
  ADMIN_URL: admin/
  EMAIL_HOST_USER: ci@example.test
  EMAIL_HOST_PASSWORD: ci-placeholder
  DEFAULT_FROM_EMAIL: ci@example.test
  RECAPTCHA_SECRET_KEY: ci-placeholder
  AZURE_OCR_ENDPOINT: https://example.test
  AZURE_OCR_KEY: ci-placeholder
  SCRAPINGBEE_API_KEY: ci-placeholder
  MOBILEMESSAGE_USERNAME: ci-placeholder
  MOBILEMESSAGE_PASSWORD: ci-placeholder
  MOBILEMESSAGE_SENDER: ChemistTasker
  LOCAL_DB_NAME: chemisttasker_ci
  LOCAL_DB_USER: postgres
  LOCAL_DB_PASSWORD: postgres
  LOCAL_DB_HOST: 127.0.0.1
  LOCAL_DB_PORT: '5432'

jobs:
  serializer-contracts:
    name: serializers-${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            settings: core.contract_test_settings
          - database: postgres
            settings: core.postgres_test_settings
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend requirements
        run: pip install -r backend/requirements.txt
      - name: Migration drift
        run: python backend/manage.py makemigrations --check --dry-run --settings=${{ matrix.settings }}
      - name: Serializer contracts and affected domain suites
        run: >-
          python backend/manage.py test
          core.test_serializer_decomposition
          core.test_runtime_contract
          core.test_promoted_model_import_ownership
          core.test_module_size_ratchet
          core.test_backend_ownership_boundaries
          core.test_public_error_surface
          core.test_serializer_lifecycle_ownership
          shifts pharmacy_hub dashboards workforce.tests
          --settings=${{ matrix.settings }} --verbosity=1 --noinput
