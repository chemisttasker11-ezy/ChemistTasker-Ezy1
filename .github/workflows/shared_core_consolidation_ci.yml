name: Shared Core Consolidation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shared-core-consolidation-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-only-shared-core-contract-key
  ADMIN_URL: admin/
  EMAIL_HOST_USER: ci@example.test
  EMAIL_HOST_PASSWORD: ci-placeholder
  DEFAULT_FROM_EMAIL: ci@example.test
  RECAPTCHA_SECRET_KEY: ci-placeholder
  AZURE_OCR_ENDPOINT: https://example.test
  AZURE_OCR_KEY: ci-placeholder
  SCRAPINGBEE_API_KEY: ci-placeholder
  MOBILEMESSAGE_USERNAME: ci-placeholder
  MOBILEMESSAGE_PASSWORD: ci-placeholder
  MOBILEMESSAGE_SENDER: ChemistTasker

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shared-core/package-lock.json
      - run: npm ci
        working-directory: shared-core
      - run: npm run typecheck
        working-directory: shared-core
      - run: npm run test:ci
        working-directory: shared-core
      - run: npm run build
        working-directory: shared-core

  web-vite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_web/package-lock.json
      - name: Build and pack shared core
        run: |
          npm ci
          npm run build
          mkdir -p ../.ci-artifacts
          npm pack --pack-destination ../.ci-artifacts
        working-directory: shared-core
      - run: npm ci
        working-directory: frontend_web
      - name: Use freshly packed shared core
        run: npm install --no-save --package-lock=false --ignore-scripts ../.ci-artifacts/chemisttasker-shared-core-1.1.1.tgz
        working-directory: frontend_web
      - run: npx tsc --noEmit
        working-directory: frontend_web
      - name: Build Vite app
        run: npx vite build
        working-directory: frontend_web
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BASE_URL: http://127.0.0.1:8000

  web-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_web/landing_next/package-lock.json
      - name: Build and pack shared core
        run: |
          npm ci
          npm run build
          mkdir -p ../.ci-artifacts
          npm pack --pack-destination ../.ci-artifacts
        working-directory: shared-core
      - run: npm ci
        working-directory: frontend_web/landing_next
      - name: Use freshly packed shared core
        run: npm install --no-save --package-lock=false --ignore-scripts ../../.ci-artifacts/chemisttasker-shared-core-1.1.1.tgz
        working-directory: frontend_web/landing_next
      - run: npm run typecheck
        working-directory: frontend_web/landing_next
      - run: npm run build
        working-directory: frontend_web/landing_next

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_mobile/package-lock.json
      - name: Build and pack shared core
        run: |
          npm ci
          npm run build
          mkdir -p ../.ci-artifacts
          npm pack --pack-destination ../.ci-artifacts
        working-directory: shared-core
      - run: npm ci
        working-directory: frontend_mobile
      - name: Use freshly packed shared core
        run: npm install --no-save --package-lock=false --ignore-scripts ../.ci-artifacts/chemisttasker-shared-core-1.1.1.tgz
        working-directory: frontend_mobile
      - run: npm run lint
        working-directory: frontend_mobile
      - run: npx tsc --noEmit
        working-directory: frontend_mobile

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django checks
        run: python backend/manage.py check --settings=core.contract_test_settings
      - name: Migration drift check
        run: python backend/manage.py makemigrations --check --dry-run --settings=core.contract_test_settings
      - name: Auth and account contracts
        run: python backend/manage.py test users.tests billing.tests --settings=core.contract_test_settings
      - name: Marketplace contracts
        run: python backend/manage.py test marketplace.tests ethical_marketplace.tests --settings=core.contract_test_settings
      - name: Public content contracts
        run: python backend/manage.py test public_hub.tests --settings=public_hub.test_settings
      - name: Workforce and finance contracts
        run: python backend/manage.py test workforce.tests worker_finance.tests --settings=core.contract_test_settings

  boundary-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/audit-shared-core-boundary.mjs --strict

  kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: frontend_web/src-tauri

  release-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - shared-core
      - web-vite
      - web-next
      - mobile
      - backend
      - boundary-audit
      - kiosk
    steps:
      - name: Require every independent gate
        run: |
          test "${{ needs.shared-core.result }}" = "success"
          test "${{ needs.web-vite.result }}" = "success"
          test "${{ needs.web-next.result }}" = "success"
          test "${{ needs.mobile.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.boundary-audit.result }}" = "success"
          test "${{ needs.kiosk.result }}" = "success"
