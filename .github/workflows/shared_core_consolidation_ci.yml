name: Shared Core Consolidation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-core-consolidation-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-only-shared-core-contract-key
  ADMIN_URL: admin/
  EMAIL_HOST_USER: ci@example.test
  EMAIL_HOST_PASSWORD: ci-placeholder
  DEFAULT_FROM_EMAIL: ci@example.test
  RECAPTCHA_SECRET_KEY: ci-placeholder
  AZURE_OCR_ENDPOINT: https://example.test
  AZURE_OCR_KEY: ci-placeholder
  SCRAPINGBEE_API_KEY: ci-placeholder
  MOBILEMESSAGE_USERNAME: ci-placeholder
  MOBILEMESSAGE_PASSWORD: ci-placeholder
  MOBILEMESSAGE_SENDER: ChemistTasker

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shared-core/package-lock.json
      - run: npm ci
        working-directory: shared-core
      - run: npm run typecheck
        working-directory: shared-core
      - run: npm run test:ci
        working-directory: shared-core
      - run: npm run build
        working-directory: shared-core
      - name: Pack shared core once
        run: |
          mkdir -p ../.ci-artifacts
          npm pack --pack-destination ../.ci-artifacts
          cd ../.ci-artifacts
          sha256sum chemisttasker-shared-core-1.1.1.tgz > shared-core.sha256
        working-directory: shared-core
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-core-package
          path: |
            .ci-artifacts/chemisttasker-shared-core-1.1.1.tgz
            .ci-artifacts/shared-core.sha256
          if-no-files-found: error
          retention-days: 1

  web-vite:
    needs: shared-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_web/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-core-package
          path: .ci-artifacts
      - name: Verify shared-core artifact checksum
        run: sha256sum -c shared-core.sha256
        working-directory: .ci-artifacts
      - run: npm ci
        working-directory: frontend_web
        env:
          CT_SHARED_CORE_SKIP_PREPARE: "1"
      - name: Use freshly packed shared core
        run: npm install --no-save --package-lock=false --ignore-scripts ../.ci-artifacts/chemisttasker-shared-core-1.1.1.tgz
        working-directory: frontend_web
      - run: npx tsc --noEmit
        working-directory: frontend_web
      - name: Cross-frontend auth flow tests
        run: node --test scripts/auth-flow.test.mjs
        working-directory: frontend_web
      - name: Build Vite app
        run: npx vite build
        working-directory: frontend_web
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_API_BASE_URL: http://127.0.0.1:8000

  web-next:
    needs: shared-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_web/landing_next/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-core-package
          path: .ci-artifacts
      - name: Verify shared-core artifact checksum
        run: sha256sum -c shared-core.sha256
        working-directory: .ci-artifacts
      - run: npm ci
        working-directory: frontend_web/landing_next
        env:
          CT_SHARED_CORE_SKIP_PREPARE: "1"
      - name: Use freshly packed shared core
        run: npm install --no-save --package-lock=false --ignore-scripts ../../.ci-artifacts/chemisttasker-shared-core-1.1.1.tgz
        working-directory: frontend_web/landing_next
      - run: npm run typecheck
        working-directory: frontend_web/landing_next
      - run: npm run build
        working-directory: frontend_web/landing_next

  mobile:
    needs: shared-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_mobile/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-core-package
          path: .ci-artifacts
      - name: Verify shared-core artifact checksum
        run: sha256sum -c shared-core.sha256
        working-directory: .ci-artifacts
      - run: npm ci
        working-directory: frontend_mobile
        env:
          CT_SHARED_CORE_SKIP_PREPARE: "1"
      - name: Use freshly packed shared core
        run: npm install --no-save --package-lock=false --ignore-scripts ../.ci-artifacts/chemisttasker-shared-core-1.1.1.tgz
        working-directory: frontend_mobile
      - run: npm run lint
        working-directory: frontend_mobile
      - run: npx tsc --noEmit
        working-directory: frontend_mobile

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django checks
        run: python backend/manage.py check --settings=core.contract_test_settings
      - name: Migration drift check
        run: python backend/manage.py makemigrations --check --dry-run --settings=core.contract_test_settings
      - name: Auth and account contracts
        run: python backend/manage.py test users.tests billing.tests --settings=core.contract_test_settings
      - name: Marketplace contracts
        run: python backend/manage.py test marketplace.tests ethical_marketplace.tests --settings=core.contract_test_settings
      - name: Public content contracts
        run: python backend/manage.py test public_hub.tests --settings=public_hub.test_settings
      - name: Membership, engagement and invoice contracts
        run: python backend/manage.py test client_profile.test_membership_application_integrity client_profile.test_invoice_integrity --settings=core.contract_test_settings
      - name: Workforce and finance contracts
        run: python backend/manage.py test workforce.tests worker_finance.tests --settings=core.contract_test_settings
      - name: Isolated finance API contracts
        run: python backend/manage.py test worker_finance.tests --settings=worker_finance.tests.settings

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCAL_DB_NAME: chemisttasker_ci
      LOCAL_DB_USER: postgres
      LOCAL_DB_PASSWORD: postgres
      LOCAL_DB_HOST: 127.0.0.1
      LOCAL_DB_PORT: 5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: PostgreSQL migration rehearsal
        run: python backend/manage.py migrate --noinput --settings=core.postgres_test_settings
      - name: PostgreSQL concurrency contracts
        run: python backend/manage.py test client_profile.test_postgres_concurrency --settings=core.postgres_test_settings

  boundary-audit:
    runs-on: ubuntu-latest
    env:
      SHARED_CORE_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/audit-shared-core-boundary.mjs

  architecture-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/audit-architecture-boundaries.mjs
      - run: node scripts/audit-shared-core-package.mjs

  kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable pinned 2026-09-22
      - run: cargo test
        working-directory: frontend_web/src-tauri

  release-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - shared-core
      - web-vite
      - web-next
      - mobile
      - backend
      - postgres-concurrency
      - boundary-audit
      - architecture-audit
      - kiosk
    steps:
      - name: Require every independent gate
        run: |
          test "${{ needs.shared-core.result }}" = "success"
          test "${{ needs.web-vite.result }}" = "success"
          test "${{ needs.web-next.result }}" = "success"
          test "${{ needs.mobile.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.postgres-concurrency.result }}" = "success"
          test "${{ needs.boundary-audit.result }}" = "success"
          test "${{ needs.architecture-audit.result }}" = "success"
          test "${{ needs.kiosk.result }}" = "success"
