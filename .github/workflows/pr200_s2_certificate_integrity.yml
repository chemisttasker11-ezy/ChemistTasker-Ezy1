name: PR200 S2 Independent Certificate Integrity
on:
  pull_request:
    paths:
      - "docs/qa/evidence/pr200_finish/S2_INDEPENDENT_CERTIFICATIONS_20261025.json"
      - "docs/qa/evidence/pr200_finish/merge.mjs"
      - "docs/qa/evidence/MAIN_RELEASE_FINISH_LEDGER.csv"
      - ".github/workflows/pr200_s2_certificate_integrity.yml"
permissions:
  contents: read
jobs:
  immutable-main-file-certificate-validation:
    if: github.event.pull_request.number == 200
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify audit merge script syntax
        run: node --check docs/qa/evidence/pr200_finish/merge.mjs
      - name: Rebuild S1 ledger without losing independently certified S2
        run: node docs/qa/evidence/pr200_finish/merge.mjs
      - name: Assert exact S2 count, baseline and no S1 inflation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root='docs/qa/evidence/';
          const report=JSON.parse(fs.readFileSync(root+'pr200_finish/S2_INDEPENDENT_CERTIFICATIONS_20261025.json','utf8'));
          const csv=fs.readFileSync(root+'MAIN_RELEASE_FINISH_LEDGER.csv','utf8');
          const rows=csv.trim().split(/\r?\n/);
          const s2=rows.filter(x=>x.includes('"INDEPENDENT_S2_FULL_FILE_REVIEW"'));
          assert.equal(report.baseline,'b77e9fd296bc2710350ef6f3cd402ce2529ffc06');
          assert.equal(report.denominator,2149);
          assert.equal(report.required_99_percent,2128);
          assert.equal(report.certifications.length,18);
          assert.equal(s2.length,18);
          assert.equal(new Set(report.certifications.map(x=>x.path)).size,18);
          for(const c of report.certifications){
            assert.notEqual(c.first_pass_reviewer,c.independent_second_reviewer);
            assert.ok(c.full_file_read && c.rationale && c.positive_contract && c.negative_contract);
            assert.ok(s2.some(r=>r.startsWith('"'+c.path+'","'+c.blob_sha+'"')));
          }
          assert.equal(rows.length,2152);
          console.log('S2 certified 18/2149, NOT 99%; 2151 source-inventory rows preserved');
          NODE
