name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 18 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: ${{ matrix.language }}

      # Private repositories without GitHub Advanced Security cannot upload to Code Scanning. The analysis
      # still runs; findings are reported as warnings and the SARIF is kept as an artifact for triage
      # (same pass/fail behaviour as the public repository, where findings went to Code Scanning).
      - name: Analyze
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results

      - name: Report CodeQL findings (private repository)
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json
          results = [(r, run) for f in glob.glob('codeql-results/*.sarif') for run in json.load(open(f)).get('runs', []) for r in run.get('results', [])]
          print(f"CodeQL findings: {len(results)}")
          for r, _ in results[:50]:
              loc = r['locations'][0]['physicalLocation']
              print(f"::warning file={loc['artifactLocation']['uri']},line={loc.get('region', {}).get('startLine', 1)}::{r.get('ruleId')} {r['message']['text']}")
          PY

      - name: Keep CodeQL results
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
