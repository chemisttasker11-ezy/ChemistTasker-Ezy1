name: F07 Production Acceptance

# F07 is the one-off production acceptance package for PR #149. Later changes use the
# standard pre-F07 CI; run this manually (workflow_dispatch) only when a release needs it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f07-production-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  F06_BASE_SHA: f1d94df72976a4f8df41e2ee7739401f9762288c
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SECRET_KEY: F07-ci-only-6V9wQ2mL8rP4sT7xY1zA5bC9dE3fG7hJ2kN6qR8uW4yZ
  ADMIN_URL: admin/
  EMAIL_HOST_USER: f07@example.test
  EMAIL_HOST_PASSWORD: f07-placeholder
  DEFAULT_FROM_EMAIL: f07@example.test
  SUPPORT_EMAIL: f07@example.test
  RECAPTCHA_SECRET_KEY: f07-placeholder
  AZURE_OCR_ENDPOINT: https://example.test
  AZURE_OCR_KEY: f07-placeholder
  SCRAPINGBEE_API_KEY: f07-placeholder
  MOBILEMESSAGE_USERNAME: f07-placeholder
  MOBILEMESSAGE_PASSWORD: f07-placeholder
  MOBILEMESSAGE_SENDER: ChemistTasker
  LOCAL_DB_NAME: chemisttasker_f07
  LOCAL_DB_USER: postgres
  LOCAL_DB_PASSWORD: postgres
  LOCAL_DB_HOST: 127.0.0.1
  LOCAL_DB_PORT: "5432"

jobs:
  postgres-schema-upgrade:
    name: PostgreSQL fresh install, populated upgrade and schema
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_f07
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_f07"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact F07 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate identity and migration scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          changed="$(git diff --name-only "$F06_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^backend/.+/migrations/.+\.py$' >/dev/null; then
            echo "F07 must not modify released migration files." >&2
            exit 1
          fi
          # This gate also validates F08 application corrections stacked on F07.
          # Application changes must reach the actual upgrade/schema, concurrency,
          # browser and native checks below rather than fail a milestone file list.
          # Exact identity, migration scope and the F06 schema comparison remain.

      - name: Checkout exact F06 deployment baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.F06_BASE_SHA }}
          path: .f06-baseline
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt

      - name: Fresh-install current migration graph
        shell: bash
        run: |
          set -euo pipefail
          python backend/manage.py migrate --noinput --settings=core.postgres_test_settings
          python backend/manage.py makemigrations --check --dry-run --settings=core.postgres_test_settings
          python backend/manage.py check --settings=core.postgres_test_settings

      - name: Reset database for populated deployment upgrade
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d chemisttasker_f07 -v ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public;
          GRANT ALL ON SCHEMA public TO postgres;
          GRANT ALL ON SCHEMA public TO public;
          SQL

      - name: Build populated F06 database and schema
        shell: bash
        run: |
          set -euo pipefail
          python .f06-baseline/backend/manage.py migrate --noinput --settings=core.postgres_test_settings
          cat > /tmp/f07_seed.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding, Pharmacy, Membership, PharmacyAdmin
          User = get_user_model()
          user = User.objects.create_user(
              email="f07-upgrade@example.test",
              password="F07Upgrade1234!",
              username="f07-upgrade",
              first_name="F07",
              last_name="Upgrade",
              role="PHARMACIST",
              is_otp_verified=True,
              is_mobile_verified=True,
              accepted_terms=True,
          )
          PharmacistOnboarding.objects.create(user=user, verified=True, ahpra_verified=True)
          pharmacy = Pharmacy.objects.create(name="F07 Upgrade Pharmacy", verified=True, timezone="Australia/Brisbane")
          membership = Membership.objects.create(
              user=user,
              pharmacy=pharmacy,
              role="PHARMACIST",
              employment_type="FULL_TIME",
              status=Membership.Status.ACCEPTED,
              is_active=True,
          )
          PharmacyAdmin.objects.create(
              user=user,
              pharmacy=pharmacy,
              membership=membership,
              admin_level=PharmacyAdmin.AdminLevel.MANAGER,
              staff_role="PHARMACIST",
              is_active=True,
          )
          print(f"seeded user={user.pk} pharmacy={pharmacy.pk} membership={membership.pk}")
          PY
          python .f06-baseline/backend/manage.py shell --settings=core.postgres_test_settings < /tmp/f07_seed.py
          python .f06-baseline/backend/manage.py spectacular --file /tmp/f06-openapi.yml --validate --settings=core.postgres_test_settings

      - name: Upgrade populated database and compare schema
        shell: bash
        run: |
          set -euo pipefail
          python backend/manage.py migrate --noinput --settings=core.postgres_test_settings
          cat > /tmp/f07_verify.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding, Pharmacy, Membership, PharmacyAdmin
          User = get_user_model()
          user = User.objects.get(email="f07-upgrade@example.test")
          pharmacy = Pharmacy.objects.get(name="F07 Upgrade Pharmacy")
          membership = Membership.objects.get(user=user, pharmacy=pharmacy)
          admin = PharmacyAdmin.objects.get(user=user, pharmacy=pharmacy)
          onboarding = PharmacistOnboarding.objects.get(user=user)
          assert user.role == "PHARMACIST"
          assert user.is_mobile_verified is True
          assert membership.status == Membership.Status.ACCEPTED
          assert membership.is_active is True
          assert admin.is_active is True
          assert onboarding.verified is True
          print("POPULATED_UPGRADE=PASS")
          PY
          python backend/manage.py shell --settings=core.postgres_test_settings < /tmp/f07_verify.py
          python backend/manage.py spectacular --file /tmp/f07-openapi.yml --validate --settings=core.postgres_test_settings
          diff -u /tmp/f06-openapi.yml /tmp/f07-openapi.yml
          echo "OPENAPI_DIFF=IDENTICAL"

      - name: Final PostgreSQL concurrency contracts
        run: >
          python backend/manage.py test
          client_profile.test_postgres_concurrency
          attendance.test_approval_locking
          workforce.tests.test_roster_slot_concurrency
          workforce.tests.test_publication_contract
          --settings=core.postgres_test_settings

  real-web-stack:
    name: Real Next to Vite to Django journey
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_f07
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_f07"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: core.postgres_test_settings
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://127.0.0.1:4173
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:3000,http://127.0.0.1:4173
      FRONTEND_BASE_URL: http://127.0.0.1:3000
      BACKEND_BASE_URL: http://127.0.0.1:8000
      VITE_API_URL: /api/v1
      VITE_API_BASE_URL: http://127.0.0.1:8000
      PLATFORM_API_URL: http://127.0.0.1:8000/api/v1
      HUB_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_PLATFORM_URL: http://127.0.0.1:3000
      DASHBOARD_INTERNAL_URL: http://127.0.0.1:4173
      DASHBOARD_PUBLIC_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout exact F07 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_web/package-lock.json
            frontend_web/landing_next/package-lock.json
            frontend_web/e2e/package-lock.json

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          python -m pip install -r backend/requirements.txt
          npm ci --prefix shared-core
          npm run build --prefix shared-core
          npm ci --prefix frontend_web
          npm ci --prefix frontend_web/landing_next
          npm ci --prefix frontend_web/e2e
          cd frontend_web/e2e
          npx playwright install --with-deps chromium

      - name: Prepare real PostgreSQL backend
        shell: bash
        run: |
          set -euo pipefail
          python backend/manage.py migrate --noinput
          cat > /tmp/f07_web_seed.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding
          User = get_user_model()
          user = User.objects.create_user(
              email="f07-web@example.test",
              password="F07WebStack1234!",
              username="f07-web",
              first_name="F07",
              last_name="Browser",
              role="PHARMACIST",
              is_otp_verified=True,
              is_mobile_verified=True,
              accepted_terms=True,
          )
          PharmacistOnboarding.objects.create(user=user, verified=True, ahpra_verified=True)
          print(f"seeded browser user={user.pk}")
          PY
          python backend/manage.py shell < /tmp/f07_web_seed.py
          nohup python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/f07-backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/users/mobile/app-config/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/f07-backend.log
          exit 1

      - name: Build and start Vite dashboard
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix frontend_web
          (
            cd frontend_web
            nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/f07-vite.log 2>&1 &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/f07-vite.log
          exit 1

      - name: Build and start production-mode Next
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix frontend_web/landing_next
          (
            cd frontend_web/landing_next
            nohup npm run start > /tmp/f07-next.log 2>&1 &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/f07-next.log
          exit 1

      - name: Run real browser journey
        working-directory: frontend_web/e2e
        env:
          PLAYWRIGHT_PORT: "3000"
        run: npx playwright test real-stack.spec.mjs --config=playwright.config.mjs

      - name: Upload real-stack diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f07-real-web-stack-diagnostics
          path: |
            /tmp/f07-backend.log
            /tmp/f07-vite.log
            /tmp/f07-next.log
            frontend_web/e2e/playwright-report
            frontend_web/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  production-security:
    name: Production deployment and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "False"
      APP_ENV: vps
      ALLOWED_HOSTS: chemisttasker.invalid
      CORS_ALLOWED_ORIGINS: https://chemisttasker.invalid
      CSRF_TRUSTED_ORIGINS: https://chemisttasker.invalid
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      JWT_COOKIE_SECURE: "True"
      JWT_COOKIE_PATH: "/"
      USE_PROD_DB: "False"
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/4
      REDIS_URL: redis://127.0.0.1:6379/0
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: redis://127.0.0.1:6379/2
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/3
      USE_REDIS_CHANNEL_LAYER: "True"
      BACKEND_BASE_URL: https://backend.chemisttasker.invalid
      FRONTEND_BASE_URL: https://chemisttasker.invalid
    steps:
      - name: Checkout exact F07 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install -r backend/requirements.txt

      - name: Audit deployment routing and containers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          node scripts/audit-production-deployment.mjs
          docker compose -f docker-compose.yml config --quiet

      - name: Django production deployment checks
        run: python backend/manage.py check --deploy --tag security --fail-level WARNING --settings=core.settings

      - name: Assert production security invariants
        shell: bash
        run: |
          PYTHONPATH=backend python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings")
          import django
          django.setup()
          from django.conf import settings
          assert settings.DEBUG is False
          assert settings.SECURE_SSL_REDIRECT is True
          assert settings.SECURE_HSTS_SECONDS >= 31536000
          assert settings.SECURE_HSTS_INCLUDE_SUBDOMAINS is True
          assert settings.SESSION_COOKIE_SECURE is True
          assert settings.CSRF_COOKIE_SECURE is True
          assert settings.JWT_COOKIE_SECURE is True
          assert settings.JWT_COOKIE_PATH == "/"
          assert settings.USE_REDIS_CHANNEL_LAYER is True
          assert "rest_framework.permissions.IsAuthenticated" in settings.REST_FRAMEWORK["DEFAULT_PERMISSION_CLASSES"]
          assert settings.ROOT_URLCONF == "composition.urls"
          from composition.urls import urlpatterns as composed_patterns
          from core.urls import urlpatterns as historical_patterns
          from django.urls import get_resolver
          assert composed_patterns is historical_patterns
          assert get_resolver().url_patterns is historical_patterns
          print("PRODUCTION_SECURITY=PASS")
          PY

      - name: Verify historical routes and permission handlers through composition
        run: python backend/manage.py test core.test_client_profile_api_composition --settings=core.contract_test_settings

  native-mobile:
    name: Real Android and iOS native journeys
    uses: ./.github/workflows/native_mobile_acceptance.yml
    with:
      tested_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  release-gate:
    name: F07 release gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - postgres-schema-upgrade
      - real-web-stack
      - production-security
      - native-mobile
    steps:
      - name: Require every F07 acceptance surface
        shell: bash
        run: |
          test "${{ needs.postgres-schema-upgrade.result }}" = "success"
          test "${{ needs.real-web-stack.result }}" = "success"
          test "${{ needs.production-security.result }}" = "success"
          test "${{ needs.native-mobile.result }}" = "success"
