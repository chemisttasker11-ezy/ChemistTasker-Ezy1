name: Phase 6 Ethical Marketplace PostgreSQL Concurrency

on:
  pull_request:
    paths:
      - "backend/ethical_marketplace/**"
      - "backend/qa_release/test_pr201_phase6_ethics_pg.py"
      - ".github/workflows/pr201_phase6_ethics_pg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ethical-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-pr201-ethical-test-key
      ADMIN_URL: admin/
      EMAIL_HOST_USER: ci@example.test
      EMAIL_HOST_PASSWORD: ci-placeholder
      DEFAULT_FROM_EMAIL: ci@example.test
      RECAPTCHA_SECRET_KEY: ci-placeholder
      AZURE_OCR_ENDPOINT: https://example.test
      AZURE_OCR_KEY: ci-placeholder
      SCRAPINGBEE_API_KEY: ci-placeholder
      MOBILEMESSAGE_USERNAME: ci-placeholder
      MOBILEMESSAGE_PASSWORD: ci-placeholder
      MOBILEMESSAGE_SENDER: ChemistTasker
      LOCAL_DB_NAME: chemisttasker_ci
      LOCAL_DB_USER: postgres
      LOCAL_DB_PASSWORD: postgres
      LOCAL_DB_HOST: 127.0.0.1
      LOCAL_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Record immutable source head
        run: git rev-parse HEAD
      - name: Install pinned Django dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Django check and migration drift
        run: |
          python backend/manage.py check --settings=core.postgres_test_settings
          python backend/manage.py makemigrations --check --dry-run --settings=core.postgres_test_settings
      - name: Run real two-connection PostgreSQL exclusive-listing tests
        shell: bash
        run: |
          set -o pipefail
          python backend/manage.py test qa_release.test_pr201_phase6_ethics_pg --settings=core.postgres_test_settings --verbosity=2 --noinput 2>&1 | tee pr201-ethical-postgres.txt
      - name: Publish execution proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr201-ethical-postgres
          path: pr201-ethical-postgres.txt
          retention-days: 14
          if-no-files-found: warn
