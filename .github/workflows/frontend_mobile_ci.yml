name: Mobile Lint

on:
  pull_request:
    paths:
      - "frontend_mobile/**"
  push:
    branches: [ main ]
    paths:
      - "frontend_mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_mobile/package-lock.json
      - name: Install deps
        working-directory: frontend_mobile
        run: npm ci
      - name: Lint
        working-directory: frontend_mobile
        run: npm run lint
