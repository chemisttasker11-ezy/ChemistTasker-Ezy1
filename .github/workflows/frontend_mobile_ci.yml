name: Frontend Static and Mobile Lint

on:
  pull_request:
    paths:
      - "frontend_mobile/**"
      - "frontend_web/src/**"
      - "scripts/audit-native-tab-routes.mjs"
      - "scripts/audit-frontend-static-wiring.mjs"
  push:
    branches: [ main ]
    paths:
      - "frontend_mobile/**"
      - "frontend_web/src/**"
      - "scripts/audit-native-tab-routes.mjs"
      - "scripts/audit-frontend-static-wiring.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_mobile/package-lock.json
      - name: Install deps
        working-directory: frontend_mobile
        run: npm ci
      - name: Audit native tab routes
        run: node scripts/audit-native-tab-routes.mjs
      - name: Audit frontend static wiring
        run: node scripts/audit-frontend-static-wiring.mjs
      - name: Lint
        working-directory: frontend_mobile
        run: npm run lint
