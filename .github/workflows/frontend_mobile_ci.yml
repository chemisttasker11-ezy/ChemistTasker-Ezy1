name: Mobile Lint

on:
  pull_request:
    paths:
      - "frontend_mobile/**"
  push:
    branches: [ main ]
    paths:
      - "frontend_mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_mobile/package-lock.json
      - name: Install deps
        working-directory: frontend_mobile
        run: npm ci
      - name: Lint
        working-directory: frontend_mobile
        run: npm run lint
