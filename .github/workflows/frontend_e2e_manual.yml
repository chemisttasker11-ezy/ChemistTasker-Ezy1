name: Frontend E2E Manual Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend_web/package-lock.json
            frontend_web/e2e/package-lock.json
      - name: Install application dependencies
        working-directory: frontend_web
        run: npm ci
      - name: Install locked Playwright package
        working-directory: frontend_web/e2e
        run: npm ci
      - name: Install Chromium
        working-directory: frontend_web/e2e
        run: npx playwright install --with-deps chromium
      - name: Run Vite Playwright suite
        working-directory: frontend_web/e2e
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: vite-playwright-failure-artifacts
          path: |
            frontend_web/e2e/playwright-report
            frontend_web/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
