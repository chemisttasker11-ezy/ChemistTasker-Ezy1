name: PR200 Focused Tenant Authorization Audit

on:
  pull_request:
    paths:
      - 'backend/qa_release/test_pr200_phase5_p0_authz.py'
      - '.github/workflows/pr200_targeted_p0_authz.yml'

permissions:
  contents: read

jobs:
  focused-p0-authorisation:
    if: github.event.pull_request.number == 200
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-pr200-authz
      ADMIN_URL: admin/
      EMAIL_HOST_USER: ci@example.test
      EMAIL_HOST_PASSWORD: ci-placeholder
      DEFAULT_FROM_EMAIL: ci@example.test
      RECAPTCHA_SECRET_KEY: ci-placeholder
      AZURE_OCR_ENDPOINT: https://example.test
      AZURE_OCR_KEY: ci-placeholder
      SCRAPINGBEE_API_KEY: ci-placeholder
      MOBILEMESSAGE_USERNAME: ci-placeholder
      MOBILEMESSAGE_PASSWORD: ci-placeholder
      MOBILEMESSAGE_SENDER: ChemistTasker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Targeted P0 cross-tenant HTTP contracts
        shell: bash
        run: |
          set -o pipefail
          python backend/manage.py test qa_release.test_pr200_phase5_p0_authz --settings=core.contract_test_settings --noinput --verbosity=2 2>&1 | tee pr200-focused-p0-authz.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr200-focused-p0-authorization-evidence
          path: pr200-focused-p0-authz.txt
          if-no-files-found: warn
          retention-days: 14
