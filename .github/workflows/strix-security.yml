name: Strix Security Assessment

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Strix scan mode for full-project assessment"
        required: true
        default: standard
        type: choice
        options:
          - quick
          - standard
          - deep

permissions:
  contents: read
  security-events: write

jobs:
  strix-pr-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Strix credentials
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          test -n "$STRIX_LLM" || { echo "Missing STRIX_LLM repository secret"; exit 1; }
          test -n "$LLM_API_KEY" || { echo "Missing LLM_API_KEY repository secret"; exit 1; }

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run diff-scoped Strix pentest
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ --scan-mode quick --scope-mode diff --diff-base "origin/${{ github.base_ref }}" --max-budget 20

      - name: Require completed scan
        if: always()
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          test -n "$run_json" || { echo "No Strix run.json produced"; exit 1; }
          status=$(jq -r .status "$run_json")
          test "$status" = "completed" || { echo "Strix scan incomplete: $status"; exit 1; }

      - name: Upload Strix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-pr-results
          path: strix_runs
          if-no-files-found: warn

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs

  strix-full-project:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Strix credentials
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          test -n "$STRIX_LLM" || { echo "Missing STRIX_LLM repository secret"; exit 1; }
          test -n "$LLM_API_KEY" || { echo "Missing LLM_API_KEY repository secret"; exit 1; }

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run whole-repository Strix pentest
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ --scan-mode "${{ inputs.scan_mode }}" --scope-mode full --max-budget 50

      - name: Require completed scan
        if: always()
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          test -n "$run_json" || { echo "No Strix run.json produced"; exit 1; }
          status=$(jq -r .status "$run_json")
          test "$status" = "completed" || { echo "Strix scan incomplete: $status"; exit 1; }

      - name: Upload Strix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-full-project-results
          path: strix_runs
          if-no-files-found: warn

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
