name: Staging QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemisttasker-staging-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout staging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run isolated regression suite
        shell: bash
        run: bash scripts/run-staging-qa.sh

      - name: QA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ChemistTasker staging QA"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "The suite covers shared-core, Vite, Next.js, mobile lint/typecheck, Django checks/tests, PostgreSQL migration/concurrency, architecture boundaries, and Tauri/Rust tests."
          } >> "$GITHUB_STEP_SUMMARY"
