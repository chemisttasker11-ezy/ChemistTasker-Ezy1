name: PR200 Focused Signed Kiosk Clock Integrity

on:
  pull_request:
    paths:
      - 'backend/qa_release/test_pr200_kiosk_clock_audit.py'
      - '.github/workflows/pr200_targeted_kiosk_clock.yml'

permissions:
  contents: read

jobs:
  signed-clock-contracts:
    if: github.event.pull_request.number == 200
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: attendance_tests.settings
      SECRET_KEY: ci-only-pr200-clock-audit
      ADMIN_URL: admin/
      EMAIL_HOST_USER: ci@example.test
      EMAIL_HOST_PASSWORD: ci-placeholder
      DEFAULT_FROM_EMAIL: ci@example.test
      RECAPTCHA_SECRET_KEY: ci-placeholder
      AZURE_OCR_ENDPOINT: https://example.test
      AZURE_OCR_KEY: ci-placeholder
      SCRAPINGBEE_API_KEY: ci-placeholder
      MOBILEMESSAGE_USERNAME: ci-placeholder
      MOBILEMESSAGE_PASSWORD: ci-placeholder
      MOBILEMESSAGE_SENDER: ChemistTasker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Execute real signed-event drift and healthy controls
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            qa_release.test_pr200_kiosk_clock_audit.Phase5KioskClockIntegrity.test_b29_normal_clock_positive_control_applies_attendance \
            qa_release.test_pr200_kiosk_clock_audit.Phase5KioskClockIntegrity.test_b29_properly_signed_anchor_drift_must_not_apply_attendance \
            qa_release.test_pr200_kiosk_clock_audit.Phase5KioskClockIntegrity.test_b29_properly_signed_server_drift_must_not_apply_attendance \
            2>&1 | tee ../pr200-b29-clock-targeted.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b29-signed-clock-integrity-log
          path: pr200-b29-clock-targeted.txt
          retention-days: 14
