name: Backend Runtime Audit

on:
  pull_request:
    paths:
      - 'backend/requirements*.txt'
      - 'scripts/collect_backend_runtime_releases.py'
      - '.github/workflows/backend_runtime_audit.yml'
      - 'docs/architecture/BACKEND_RUNTIME_BASELINE.md'
  push:
    branches: [main]
    paths:
      - 'backend/requirements*.txt'
      - 'scripts/collect_backend_runtime_releases.py'
      - '.github/workflows/backend_runtime_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-runtime-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolved-runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the application runtime in an isolated environment
        run: |
          python -m venv "${RUNNER_TEMP}/application-runtime"
          "${RUNNER_TEMP}/application-runtime/bin/python" -m pip install -r backend/requirements.txt
      - name: Record actual runtime and resolved dependency set
        run: |
          mkdir -p runtime-evidence
          git rev-parse HEAD > runtime-evidence/COMMIT
          "${RUNNER_TEMP}/application-runtime/bin/python" -m pip freeze > runtime-evidence/requirements.resolved.txt
          "${RUNNER_TEMP}/application-runtime/bin/python" -c "import django, sys; print(sys.version); print('Django', django.get_version()); assert django.VERSION[:2] == (5, 2)" > runtime-evidence/runtime.txt
          "${RUNNER_TEMP}/application-runtime/bin/python" -m pip check | tee runtime-evidence/pip-check.txt
      - name: Install a pinned auditor separately from the application
        run: |
          python -m venv "${RUNNER_TEMP}/runtime-auditor"
          "${RUNNER_TEMP}/runtime-auditor/bin/python" -m pip install pip-audit==2.10.1
      - name: Audit the exact resolved application packages
        run: |
          "${RUNNER_TEMP}/runtime-auditor/bin/python" -m pip_audit \
            --requirement runtime-evidence/requirements.resolved.txt \
            --no-deps --disable-pip --strict --progress-spinner off \
            --format json --output runtime-evidence/advisories.json
      - name: Summarize collected advisories
        if: always()
        run: |
          python - <<'PY_AUDIT'
          import json
          from pathlib import Path
          report = Path('runtime-evidence/advisories.json')
          if report.exists():
              for package in json.loads(report.read_text()).get('dependencies', []):
                  findings = package.get('vulns', [])
                  if findings:
                      fixes = sorted({version for finding in findings for version in finding.get('fix_versions', [])})
                      unique_ids = {finding['id'] for finding in findings}
                      print(package['name'], package['version'], 'advisory entries=', len(findings), 'unique IDs=', len(unique_ids), 'reported fixes=', ','.join(fixes))
          else:
              print('No advisory report produced; inspect the failed install/audit step.')
          PY_AUDIT
      - name: Verify release availability and dependency constraints
        if: always()
        run: |
          "${RUNNER_TEMP}/application-runtime/bin/python" scripts/collect_backend_runtime_releases.py
      - name: Retain reviewable evidence even if the audit fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 7
