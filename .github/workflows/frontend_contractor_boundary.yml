name: Frontend Contractor Boundary

on:
  pull_request:
    paths:
      - scripts/frontend-contractor-bridge.mjs
      - scripts/frontend-contractor-bridge.test.mjs
      - scripts/bootstrap-private-frontend.ps1
      - tooling/frontend-contractor/**
      - docs/FRONTEND_REPOSITORY_OWNER_RUNBOOK.md
      - .github/workflows/frontend_contractor_boundary.yml
      - .github/workflows/frontend_contractor_initial_export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-standalone-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Unit-test export, private-key rejection and safe import
        run: node --test scripts/frontend-contractor-bridge.test.mjs
      - name: Create and verify a real frontend-only snapshot from this checkout
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/chemisttasker-frontend-only"
          node scripts/frontend-contractor-bridge.mjs export --source . --dest "$target"
          git -C "$target" init -b main
          git -C "$target" add -A
          git -C "$target" -c user.name=CI -c user.email=ci@example.invalid commit -m 'Frontend snapshot acceptance'
          node "$target/scripts/check-frontend-boundary.mjs"
          test ! -e "$target/backend"
          test -e "$target/frontend_mobile/package.json"
          test ! -e "$target/frontend_web/src-tauri"
          echo 'Fresh-history frontend export verified.'
