name: PR200 Audit-Only Release Blocker Contracts

on:
  pull_request:
    paths:
      - "backend/qa_release/**"
      - ".github/workflows/pr200_release_blocker_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-contracts:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 200
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: ci-only-pr200-audit-contract-key
      ADMIN_URL: admin/
      EMAIL_HOST_USER: ci@example.test
      EMAIL_HOST_PASSWORD: ci-placeholder
      DEFAULT_FROM_EMAIL: ci@example.test
      RECAPTCHA_SECRET_KEY: ci-placeholder
      AZURE_OCR_ENDPOINT: https://example.test
      AZURE_OCR_KEY: ci-placeholder
      SCRAPINGBEE_API_KEY: ci-placeholder
      MOBILEMESSAGE_USERNAME: ci-placeholder
      MOBILEMESSAGE_PASSWORD: ci-placeholder
      MOBILEMESSAGE_SENDER: ChemistTasker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check checkout and Python version
        run: |
          git rev-parse HEAD
          python --version
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Django check and migration drift
        run: |
          python backend/manage.py check --settings=core.contract_test_settings
          python backend/manage.py makemigrations --check --dry-run --settings=core.contract_test_settings
      - name: Execute PR200 negative contracts on disposable SQLite database
        shell: bash
        run: |
          set -o pipefail
          python backend/manage.py test qa_release.test_pr200_blockers --settings=core.contract_test_settings --noinput --verbosity=2 2>&1 | tee pr200-runtime-evidence.txt
      - name: Preserve synthetic CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr200-runtime-evidence
          path: pr200-runtime-evidence.txt
          if-no-files-found: warn
          retention-days: 14
