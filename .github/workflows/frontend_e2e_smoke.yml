name: Frontend E2E Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-native-route-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/audit-native-tab-routes.mjs
      - run: node scripts/audit-frontend-static-wiring.mjs

  playwright-web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_web/package-lock.json
      - run: npm ci
        working-directory: frontend_web
      - name: Install pinned Playwright runner without changing lockfiles
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.55.0
        working-directory: frontend_web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend_web
      - name: Run Vite frontend smoke suite
        run: npx playwright test --config=e2e/playwright.config.mjs
        working-directory: frontend_web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-smoke-report
          path: |
            frontend_web/playwright-report
            frontend_web/test-results
          if-no-files-found: ignore
          retention-days: 7


  playwright-next-public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_web/landing_next/package-lock.json
      - run: npm ci
        working-directory: frontend_web/landing_next
      - name: Install pinned Playwright runner without changing lockfiles
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.55.0
        working-directory: frontend_web/landing_next
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend_web/landing_next
      - name: Run Next public smoke suite
        run: npx playwright test --config=e2e/playwright.config.mjs
        working-directory: frontend_web/landing_next
