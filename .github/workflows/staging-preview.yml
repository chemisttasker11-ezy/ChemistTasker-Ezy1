# Deploy to permanent staging via the OVH self-hosted runner.
name: Staging deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemisttasker-staging-deployment
  cancel-in-progress: false

env:
  STAGING_DIR: "/opt/apps/chemisttasker-staging"

jobs:
  deploy-staging:
    runs-on: [self-hosted, linux, x64, chemisttasker-staging]

    steps:
      - name: Checkout staging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Sync isolated staging source
        shell: bash
        run: |
          mkdir -p "$STAGING_DIR/env"
          find "$STAGING_DIR" -mindepth 1 -maxdepth 1 ! -name env -exec rm -rf -- {} +
          tar --exclude='.git' --exclude='./env' -czf - . | tar -xzf - -C "$STAGING_DIR"

      - name: Deploy isolated staging stack
        id: deploy
        shell: bash
        run: |
          cd "$STAGING_DIR"
          bash scripts/deploy-staging.sh

          staging_url="https://staging.chemisttasker.com.au"
          echo "staging_url=$staging_url" >> "$GITHUB_OUTPUT"

          {
            echo "## ChemistTasker staging deployment"
            echo ""
            echo "Site: $staging_url"
            echo ""
            echo "Deployed on the OVH self-hosted runner."
            echo "Uses staging-only PostgreSQL, Redis, volumes and containers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test deployed staging
        shell: bash
        run: |
          cd "$STAGING_DIR"
          bash scripts/smoke-staging.sh "${{ steps.deploy.outputs.staging_url }}"

      - name: Smoke-test summary
        shell: bash
        run: |
          {
            echo ""
            echo "Smoke tests: PASS"
            echo "- HTTPS security headers"
            echo "- public login/app-config reachability"
            echo "- anonymous protected-route denial"
            echo "- refresh CSRF enforcement"
            echo "- email OTP CSRF enforcement"
          } >> "$GITHUB_STEP_SUMMARY"
