name: Staging Preview

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemisttasker-staging-preview
  cancel-in-progress: true

env:
  STAGING_SSH_HOST: "139.99.148.63"
  STAGING_SSH_USER: "ubuntu"
  STAGING_DIR: "/opt/apps/chemisttasker-staging"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check staging connection
        id: preflight
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        shell: bash
        run: |
          if [[ -n "$STAGING_SSH_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ChemistTasker staging is prepared but not connected"
              echo ""
              echo "Add one repository Actions secret named STAGING_SSH_KEY."
              echo "Use a dedicated deployment key and enter it directly in GitHub; do not paste it into chat."
              echo "Then run this workflow manually once."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout staging
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH
        if: steps.preflight.outputs.configured == 'true'
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync staging source to OVH
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST"             "mkdir -p '$STAGING_DIR/env' && find '$STAGING_DIR' -mindepth 1 -maxdepth 1 ! -name env -exec rm -rf -- {} +"
          tar --exclude='.git' --exclude='./env' -czf - . |             ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "tar -xzf - -C '$STAGING_DIR'"

      - name: Deploy isolated staging stack
        if: steps.preflight.outputs.configured == 'true'
        id: deploy
        shell: bash
        run: |
          output="$(ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "cd '$STAGING_DIR' && bash scripts/deploy-staging.sh")"
          printf '%s\n' "$output"
          preview_url="$(printf '%s\n' "$output" | sed -n 's/^PREVIEW_URL=//p' | tail -n 1)"
          test -n "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "## ChemistTasker staging preview"
            echo ""
            echo "Preview: $preview_url"
            echo ""
            echo "This deployment uses staging-only PostgreSQL, Redis, volumes and containers."
          } >> "$GITHUB_STEP_SUMMARY"
