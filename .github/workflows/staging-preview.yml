name: Staging Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemisttasker-staging-preview
  cancel-in-progress: true

env:
  STAGING_DIR: "/opt/apps/chemisttasker-staging"

jobs:
  deploy-staging:
    runs-on: [self-hosted, linux, x64, chemisttasker-staging]
    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync isolated staging source
        shell: bash
        run: |
          mkdir -p "$STAGING_DIR/env"
          find "$STAGING_DIR" -mindepth 1 -maxdepth 1 ! -name env -exec rm -rf -- {} +
          tar --exclude='.git' --exclude='./env' -czf - . | tar -xzf - -C "$STAGING_DIR"

      - name: Deploy isolated staging stack
        id: deploy
        shell: bash
        run: |
          output="$(cd "$STAGING_DIR" && bash scripts/deploy-staging.sh)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s\n' "$output" | sed -n 's/^PREVIEW_URL=//p' | tail -n 1)"
          test -n "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "## ChemistTasker staging preview"
            echo ""
            echo "Preview: $preview_url"
            echo ""
            echo "This deployment runs on the OVH self-hosted runner and uses staging-only PostgreSQL, Redis, volumes and containers."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Smoke-test deployed staging
        shell: bash
        run: |
          cd "$STAGING_DIR"
          bash scripts/smoke-staging.sh "${{ steps.deploy.outputs.preview_url }}"

      - name: Smoke-test summary
        shell: bash
        run: |
          {
            echo ""
            echo "Smoke tests: PASS"
            echo "- HTTPS security headers"
            echo "- public login/app-config reachability"
            echo "- anonymous protected-route denial"
            echo "- refresh CSRF enforcement"
            echo "- email OTP CSRF enforcement"
          } >> "$GITHUB_STEP_SUMMARY"
