name: Full Isolated QA
on:
  # Up to 120 minutes with Docker builds: on pull requests only when labelled `full-qa`; always on main and on demand.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'backend/**'
      - 'frontend_web/**'
      - 'frontend_mobile/**'
      - 'shared-core/**'
      - 'scripts/run-staging-qa.sh'
      - '.github/workflows/full_isolated_qa.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend_web/**'
      - 'frontend_mobile/**'
      - 'shared-core/**'
      - 'scripts/run-staging-qa.sh'
      - '.github/workflows/full_isolated_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-isolated-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-isolated-qa:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-qa') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Full isolated staging QA on exact source
        shell: bash
        run: bash scripts/run-staging-qa.sh
