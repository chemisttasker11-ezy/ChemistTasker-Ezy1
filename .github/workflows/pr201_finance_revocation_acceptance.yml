name: Phase 6 Finance and Revocation Acceptance

on:
  pull_request:
    paths:
      - "backend/billing/**"
      - "backend/rewards/**"
      - "backend/chat/**"
      - "backend/notifications/**"
      - "backend/qa_release/test_pr201_phase6_finance_pg.py"
      - ".github/workflows/pr201_finance_revocation_acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-and-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: pr201-synthetic-finance-ci-key
      ADMIN_URL: admin/
      EMAIL_HOST_USER: ci@example.test
      EMAIL_HOST_PASSWORD: ci-placeholder
      DEFAULT_FROM_EMAIL: ci@example.test
      RECAPTCHA_SECRET_KEY: ci-placeholder
      AZURE_OCR_ENDPOINT: https://example.test
      AZURE_OCR_KEY: ci-placeholder
      SCRAPINGBEE_API_KEY: ci-placeholder
      MOBILEMESSAGE_USERNAME: ci-placeholder
      MOBILEMESSAGE_PASSWORD: ci-placeholder
      MOBILEMESSAGE_SENDER: ChemistTasker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check immutable source and Django system
        run: |
          git rev-parse HEAD
          python backend/manage.py check --settings=core.contract_test_settings
      - name: Targeted real chat revocation and billing contracts
        shell: bash
        run: |
          set -o pipefail
          python backend/manage.py test \
            chat.test_revocation_contracts chat.test_websocket \
            notifications.test_websocket \
            qa_release.test_pr201_phase6_b53 qa_release.test_pr201_phase6_b57 \
            qa_release.test_pr201_phase6_b69 qa_release.test_pr201_phase6_b10 \
            qa_release.test_pr201_phase6_b02 \
            --settings=core.contract_test_settings --noinput --verbosity=2 \
            2>&1 | tee pr201-security-finance-tests.txt
      - name: Preserve synthetic auth/finance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr201-security-finance-evidence
          path: pr201-security-finance-tests.txt
          if-no-files-found: warn
          retention-days: 14

  finance-postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemisttasker_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d chemisttasker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: pr201-synthetic-finance-ci-key
      ADMIN_URL: admin/
      EMAIL_HOST_USER: ci@example.test
      EMAIL_HOST_PASSWORD: ci-placeholder
      DEFAULT_FROM_EMAIL: ci@example.test
      RECAPTCHA_SECRET_KEY: ci-placeholder
      AZURE_OCR_ENDPOINT: https://example.test
      AZURE_OCR_KEY: ci-placeholder
      SCRAPINGBEE_API_KEY: ci-placeholder
      MOBILEMESSAGE_USERNAME: ci-placeholder
      MOBILEMESSAGE_PASSWORD: ci-placeholder
      MOBILEMESSAGE_SENDER: ChemistTasker
      LOCAL_DB_NAME: chemisttasker_ci
      LOCAL_DB_USER: postgres
      LOCAL_DB_PASSWORD: postgres
      LOCAL_DB_HOST: 127.0.0.1
      LOCAL_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Real PostgreSQL two-connection money contracts
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD
          python backend/manage.py test \
            qa_release.test_pr201_phase6_finance_pg \
            --settings=core.postgres_test_settings --noinput --verbosity=2 \
            2>&1 | tee pr201-finance-postgres-tests.txt
      - name: Preserve real database concurrency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr201-finance-postgres-concurrency
          path: pr201-finance-postgres-tests.txt
          if-no-files-found: warn
          retention-days: 14
