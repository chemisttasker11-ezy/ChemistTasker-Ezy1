              ahpra_verified=True,
          )
          for name in ("Native Pharmacy A", "Native Pharmacy B"):
              pharmacy = Pharmacy.objects.create(
                  name=name,
                  verified=True,
                  timezone="Australia/Brisbane",
              )
              membership = Membership.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  role="PHARMACIST",
                  employment_type="FULL_TIME",
                  status=Membership.Status.ACCEPTED,
                  is_active=True,
              )
              PharmacyAdmin.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  membership=membership,
                  admin_level=PharmacyAdmin.AdminLevel.MANAGER,
                  staff_role="PHARMACIST",
                  is_active=True,
              )
          PY
            python manage.py shell < /tmp/seed_native_smoke.py
            nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/native-backend.log 2>&1 &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/users/mobile/app-config/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/native-backend.log
          exit 1

      - name: Validate native-smoke authority contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Content-Type: application/json" \
            -d '{"email":"native-smoke@example.test","password":"NativeSmoke1234"}' \
            http://127.0.0.1:8000/api/v1/users/login/ > /tmp/native-login.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/native-login.json"))
          user=data["user"]
          assert user["role"] == "PHARMACIST", user
          assignments=user.get("admin_assignments") or []
          assert len(assignments) == 2, assignments
          assert {a.get("pharmacy_name") for a in assignments} == {"Native Pharmacy A", "Native Pharmacy B"}, assignments
          assert all(a.get("admin_level") == "MANAGER" for a in assignments), assignments
          assert all("MANAGE_ROSTER" in (a.get("capabilities") or []) for a in assignments), assignments
          assert data.get("access") and data.get("refresh"), data.keys()
          PY

      - name: Install mobile dependencies and test-only Firebase descriptors
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "chemisttasker-native-smoke",
              "storage_bucket": "chemisttasker-native-smoke.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.chemisttasker.app"}
              },
              "api_key": [{"current_key": "AIzaSyNativeSmokeOnly000000000000000000"}]
            }],
            "configuration_version": "1"
          }
          JSON
          cat > GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>API_KEY</key><string>AIzaSyNativeSmokeOnly000000000000000000</string>
          <key>GCM_SENDER_ID</key><string>1234567890</string>
          <key>PLIST_VERSION</key><string>1</string>
          <key>BUNDLE_ID</key><string>com.chemisttasker.app</string>
          <key>PROJECT_ID</key><string>chemisttasker-native-smoke</string>
          <key>STORAGE_BUCKET</key><string>chemisttasker-native-smoke.appspot.com</string>
          <key>IS_ADS_ENABLED</key><false/>
          <key>IS_ANALYTICS_ENABLED</key><false/>
          <key>IS_APPINVITE_ENABLED</key><false/>
          <key>IS_GCM_ENABLED</key><true/>
          <key>IS_SIGNIN_ENABLED</key><true/>
          <key>GOOGLE_APP_ID</key><string>1:1234567890:ios:0123456789abcdef</string>
          </dict></plist>
          PLIST
          # Retry only transport failures; never conceal lockfile/lifecycle errors.
          for attempt in 1 2 3; do
            install_log="/tmp/native-npm-install-${attempt}.log"
            if npm ci --no-audit --no-fund > "$install_log" 2>&1; then
              cat "$install_log"
              break
            else
              install_status=$?
              cat "$install_log"
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'npm (error|ERR!) code (ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|E502|E503|E504)([[:space:]]|$)' "$install_log"; then
              exit "$install_status"
            fi
            echo "Transient npm transport failure; retrying clean lockfile install ($attempt/3)."
            sleep "$((attempt * 10))"
          done

      - name: Prebuild and compile iOS simulator acceptance build with embedded JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          CI=1 npx expo prebuild --platform ios --clean
          PLIST_PATH="ios/ChemistTasker/Info.plist"
          test -f "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST_PATH"
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME="ChemistTasker"
          xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "ChemistTasker" in data["workspace"]["schemes"], data["workspace"]["schemes"]'
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if "iPhone" in x["name"] and x.get("isAvailable", True)))')
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath /tmp/native-ios-derived CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find /tmp/native-ios-derived/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -s "$APP_PATH/main.jsbundle"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          xcrun simctl uninstall "$SIM_UDID" com.chemisttasker.app 2>/dev/null || true
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Install pinned Maestro
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          export MAESTRO_VERSION=2.11.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | tee /tmp/maestro-version-ios.txt

      - name: Run iOS restart, persona, deep-link and camera smoke
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "=== backend ==="; cat /tmp/native-backend.log || true; fi' EXIT
          curl -fsS http://127.0.0.1:8000/api/v1/users/mobile/app-config/ >/dev/null
          cat > /tmp/native-acceptance.yaml <<'YAML'
          appId: com.chemisttasker.app
          ---
          - launchApp:
              stopApp: true
              permissions:
                all: allow
          - extendedWaitUntil:
              visible: "Go to Login"
              timeout: 120000
          - tapOn: "Go to Login"
          - extendedWaitUntil:
              visible: "Welcome back"
              timeout: 30000
          - tapOn: "Work email"
          - inputText: "native-smoke@example.test"
          - tapOn: "Password"
          - inputText: "NativeSmoke1234"
          - hideKeyboard
          - tapOn: "Sign in"
          - tapOn:
              text: "Not now"
              optional: true
          - extendedWaitUntil:
              visible: "Admin"
              timeout: 30000
          - assertVisible: "Welcome Native,"
          - tapOn: "Admin"
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy A"
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Native Pharmacy B"
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Pharmacist"
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - assertVisible: "Admin"
          - openLink: "frontendmobile://admin/shifts"
          - extendedWaitUntil:
              visible: "Shift Center"
              timeout: 30000
          - openLink: "frontendmobile://attendance/clock"
          - extendedWaitUntil:
              visible: "Clock & breaks"
              timeout: 30000
          - tapOn: "Open camera"
          - extendedWaitUntil:
              visible: "Centre the kiosk QR inside the frame"
              timeout: 30000
          YAML
          export JAVA_HOME="$JAVA_HOME"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          export MAESTRO_CLI_NO_ANALYTICS=1
          maestro --device "$SIM_UDID" test /tmp/native-acceptance.yaml

      - name: Capture iOS diagnostics
        if: always()
        shell: bash
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl io "$SIM_UDID" screenshot /tmp/ios-simulator.png || true
            xcrun simctl spawn "$SIM_UDID" log show --style compact --last 30m --predicate 'process == "ChemistTasker"' > /tmp/chemisttasker-ios.log 2>&1 || true
          else
            echo "SIM_UDID was not set; simulator diagnostics unavailable" > /tmp/chemisttasker-ios.log
          fi

      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ios-diagnostics
          path: |
            /tmp/native-backend.log
            /tmp/native-npm-install-*.log
            /tmp/maestro-version-ios.txt
            /tmp/ios-simulator.png
            /tmp/chemisttasker-ios.log
            ~/.maestro/tests
          if-no-files-found: ignore
