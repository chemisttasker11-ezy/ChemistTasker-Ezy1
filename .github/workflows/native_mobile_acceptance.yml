name: Native Mobile Acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tested_sha:
        required: false
        type: string

concurrency:
  group: native-mobile-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTED_SHA: ${{ inputs.tested_sha || github.event.pull_request.head.sha || github.sha }}
  DJANGO_SETTINGS_MODULE: "core.native_smoke_settings"
  APP_ENV: "test"
  SECRET_KEY: "native-smoke-only-not-production"
  ADMIN_URL: "admin/"
  EMAIL_HOST_USER: "native-smoke@example.test"
  EMAIL_HOST_PASSWORD: "native-smoke"
  DEFAULT_FROM_EMAIL: "native-smoke@example.test"
  RECAPTCHA_SECRET_KEY: "native-smoke"
  AZURE_OCR_ENDPOINT: "https://example.test"
  AZURE_OCR_KEY: "native-smoke"
  SCRAPINGBEE_API_KEY: "native-smoke"
  SUPPORT_EMAIL: "native-smoke@example.test"
  MOBILEMESSAGE_USERNAME: "native-smoke"
  MOBILEMESSAGE_PASSWORD: "native-smoke"
  MOBILEMESSAGE_SENDER: "ChemistTasker"
  STRIPE_SECRET_KEY: "sk_test_native_smoke"
  STRIPE_WEBHOOK_SECRET: "whsec_native_smoke"
  GOOGLE_MAPS_API_KEY: "native-smoke"
  MOBILEMESSAGE_API_USERNAME: "native-smoke"
  MOBILEMESSAGE_API_PASSWORD: "native-smoke"
  MOBILEMESSAGE_API_URL: "https://example.test"
  MOBILEMESSAGE_FROM: "ChemistTasker"
  FRONTEND_BASE_URL: "http://127.0.0.1:8081"
  BACKEND_BASE_URL: "http://127.0.0.1:8000"
  EXPO_PUBLIC_API_URL: "http://127.0.0.1:8000"
  EXPO_PUBLIC_WS_URL: "ws://127.0.0.1:8000"
  EXPO_PUBLIC_WEB_URL: "http://127.0.0.1:8081"
  EXPO_PUBLIC_SSL_PINNING_ENABLED: "false"
  # Also inherited by the shared-core preinstall subprocess.
  npm_config_fetch_retries: "4"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "30000"
  npm_config_fetch_timeout: "120000"

jobs:
  android-native:
    name: Android native acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ env.TESTED_SHA }}"
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare hermetic native-smoke backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cat > backend/core/native_smoke_settings.py <<'PY'
          from .contract_test_settings import *  # noqa
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.sqlite3",
                  "NAME": "/tmp/chemisttasker-native-smoke.sqlite3",
              }
          }
          ALLOWED_HOSTS = ["*"]
          DEBUG = True
          AXES_ENABLED = False
          SECURE_SSL_REDIRECT = False
          CORS_ALLOWED_ORIGINS = ["http://127.0.0.1:8081", "http://localhost:8081"]
          CSRF_TRUSTED_ORIGINS = CORS_ALLOWED_ORIGINS
          EMAIL_BACKEND = "django.core.mail.backends.locmem.EmailBackend"
          USE_AZURE_STORAGE = False
          PY
          rm -f /tmp/chemisttasker-native-smoke.sqlite3
          (
            cd backend
            python manage.py migrate --noinput
            cat > /tmp/seed_native_smoke.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding, Pharmacy, Membership, PharmacyAdmin

          User = get_user_model()
          user = User.objects.create_user(
              email="native-smoke@example.test",
              password="NativeSmoke1234",
              username="native-smoke",
              first_name="Native",
              last_name="Smoke",
              role="PHARMACIST",
              is_otp_verified=True,
              is_mobile_verified=True,
              accepted_terms=True,
          )
          PharmacistOnboarding.objects.create(
              user=user,
              verified=True,
              ahpra_verified=True,
          )
          for name in ("Native Pharmacy A", "Native Pharmacy B"):
              pharmacy = Pharmacy.objects.create(
                  name=name,
                  verified=True,
                  timezone="Australia/Brisbane",
              )
              membership = Membership.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  role="PHARMACIST",
                  employment_type="FULL_TIME",
                  status=Membership.Status.ACCEPTED,
                  is_active=True,
              )
              PharmacyAdmin.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  membership=membership,
                  admin_level=PharmacyAdmin.AdminLevel.MANAGER,
                  staff_role="PHARMACIST",
                  is_active=True,
              )
          PY
            python manage.py shell < /tmp/seed_native_smoke.py
            nohup python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/native-backend.log 2>&1 &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/users/mobile/app-config/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/native-backend.log
          exit 1

      - name: Validate native-smoke authority contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Content-Type: application/json" \
            -d '{"email":"native-smoke@example.test","password":"NativeSmoke1234"}' \
            http://127.0.0.1:8000/api/v1/users/login/ > /tmp/native-login.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/native-login.json"))
          user=data["user"]
          assert user["role"] == "PHARMACIST", user
          assignments=user.get("admin_assignments") or []
          assert len(assignments) == 2, assignments
          assert {a.get("pharmacy_name") for a in assignments} == {"Native Pharmacy A", "Native Pharmacy B"}, assignments
          assert all(a.get("admin_level") == "MANAGER" for a in assignments), assignments
          assert all("MANAGE_ROSTER" in (a.get("capabilities") or []) for a in assignments), assignments
          assert data.get("access") and data.get("refresh"), data.keys()
          PY

      - name: Install mobile dependencies and test-only Firebase descriptors
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "chemisttasker-native-smoke",
              "storage_bucket": "chemisttasker-native-smoke.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.chemisttasker.app"}
              },
              "api_key": [{"current_key": "AIzaSyNativeSmokeOnly000000000000000000"}]
            }],
            "configuration_version": "1"
          }
          JSON
          cat > GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>API_KEY</key><string>AIzaSyNativeSmokeOnly000000000000000000</string>
          <key>GCM_SENDER_ID</key><string>1234567890</string>
          <key>PLIST_VERSION</key><string>1</string>
          <key>BUNDLE_ID</key><string>com.chemisttasker.app</string>
          <key>PROJECT_ID</key><string>chemisttasker-native-smoke</string>
          <key>STORAGE_BUCKET</key><string>chemisttasker-native-smoke.appspot.com</string>
          <key>IS_ADS_ENABLED</key><false/>
          <key>IS_ANALYTICS_ENABLED</key><false/>
          <key>IS_APPINVITE_ENABLED</key><false/>
          <key>IS_GCM_ENABLED</key><true/>
          <key>IS_SIGNIN_ENABLED</key><true/>
          <key>GOOGLE_APP_ID</key><string>1:1234567890:ios:0123456789abcdef</string>
          </dict></plist>
          PLIST
          # Retry only transport failures; never conceal lockfile/lifecycle errors.
          for attempt in 1 2 3; do
            install_log="/tmp/native-npm-install-${attempt}.log"
            if npm ci --no-audit --no-fund > "$install_log" 2>&1; then
              cat "$install_log"
              break
            else
              install_status=$?
              cat "$install_log"
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'npm (error|ERR!) code (ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|E502|E503|E504)([[:space:]]|$)' "$install_log"; then
              exit "$install_status"
            fi
            echo "Transient npm transport failure; retrying clean lockfile install ($attempt/3)."
            sleep "$((attempt * 10))"
          done

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: "false"

      - name: Prebuild and compile Android acceptance build with embedded JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          CI=1 npx expo prebuild --platform android --clean
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if "android:usesCleartextTraffic" in text:
              text = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', text)
          else:
              text = text.replace("<application ", '<application android:usesCleartextTraffic="true" ', 1)
          path.write_text(text)
          PY
          cd android
          # Release embeds the Expo Router bundle. Restart acceptance must not
          # depend on a Metro connection or the development launcher UI.
          # This gate installs on an x86_64 emulator. Avoid compiling three unused
          # ABIs and give release lint enough metaspace for the native module graph.
          ./gradlew assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=x86_64 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8'
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'assets/index.android.bundle'

      - name: Boot Android emulator and install app
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          SDKMANAGER="$(command -v sdkmanager)"
          AVDMANAGER="$(command -v avdmanager)"
          ADB="$(command -v adb)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$(dirname "$(dirname "$ADB")")}}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$ADB"
          # SDK command-line tools and emulator versions may choose different
          # default user directories. Give both the same explicit AVD location.
          export ANDROID_USER_HOME="$RUNNER_TEMP/chemisttasker-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          timeout 300 "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          test -x "$EMULATOR"
          echo no | "$AVDMANAGER" create avd --force -n chemisttasker-native \
            --path "$ANDROID_AVD_HOME/chemisttasker-native.avd" \
            -k "system-images;android-35;google_apis;x86_64"
          test -s "$ANDROID_AVD_HOME/chemisttasker-native.ini"
          test -s "$ANDROID_AVD_HOME/chemisttasker-native.avd/config.ini"
          "$EMULATOR" -list-avds | grep -Fx chemisttasker-native

          dump_android_failure() {
            echo "=== adb devices -l ==="
            timeout 15 "$ADB" devices -l || true
            echo "=== emulator process ==="
            if [ -n "${EMULATOR_PID:-}" ]; then
              ps -p "$EMULATOR_PID" -o pid=,ppid=,stat=,etime=,command= || true
            else
              echo "emulator PID not captured"
            fi
            echo "=== /tmp/android-emulator.log ==="
            cat /tmp/android-emulator.log || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then dump_android_failure; fi' EXIT

          timeout 15 "$ADB" start-server
          nohup "$EMULATOR" -avd chemisttasker-native -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save -gpu swiftshader_indirect -cores 2 -memory 2048 -camera-back virtualscene -camera-front none > /tmp/android-emulator.log 2>&1 &
          EMULATOR_PID=$!
          printf '%s\n' "$EMULATOR_PID" > /tmp/android-emulator.pid

          adb_ready=0
          adb_deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$adb_deadline" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before ADB registration"
              exit 1
            fi
            if [ "$(timeout 5 "$ADB" -s emulator-5554 get-state 2>/dev/null || true)" = "device" ]; then
              adb_ready=1
              break
            fi
            sleep 2
          done
          if [ "$adb_ready" -ne 1 ]; then
            echo "Android emulator did not register with ADB within 180 seconds"
            exit 1
          fi

          boot_ready=0
          boot_deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$boot_deadline" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before sys.boot_completed"
              exit 1
            fi
            if [ "$(timeout 5 "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then
              boot_ready=1
              break
            fi
            sleep 2
          done
          if [ "$boot_ready" -ne 1 ]; then
            echo "Android emulator did not complete boot within 240 seconds after ADB registration"
            exit 1
          fi
          echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
          timeout 30 "$ADB" -s emulator-5554 reverse tcp:8000 tcp:8000
          timeout 30 "$ADB" -s emulator-5554 shell input keyevent 82
          timeout 30 "$ADB" -s emulator-5554 uninstall com.chemisttasker.app >/dev/null 2>&1 || true
          timeout 90 "$ADB" -s emulator-5554 install frontend_mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Install pinned Maestro
        shell: bash
        run: |
          set -euo pipefail
          export MAESTRO_VERSION=2.11.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | tee /tmp/maestro-version-android.txt

      - name: Run Android restart, persona, deep-link and camera smoke
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "=== backend ==="; cat /tmp/native-backend.log || true; echo "=== emulator ==="; cat /tmp/android-emulator.log || true; fi' EXIT
          curl -fsS http://127.0.0.1:8000/api/v1/users/mobile/app-config/ >/dev/null
          cat > /tmp/native-acceptance.yaml <<'YAML'
          appId: com.chemisttasker.app
          ---
          - launchApp:
              stopApp: true
              permissions:
                all: allow
          - extendedWaitUntil:
              visible: "Go to Login"
              timeout: 30000
          - tapOn: "Go to Login"
          - extendedWaitUntil:
              visible: "Welcome back"
              timeout: 30000
          - tapOn: "Work email"
          - inputText: "native-smoke@example.test"
          - tapOn: "Password"
          - inputText: "NativeSmoke1234"
          - hideKeyboard
          - tapOn: "Sign in"
          - tapOn:
              text: "Not now"
              optional: true
          - extendedWaitUntil:
              visible: "Admin"
              timeout: 30000
          - assertVisible: "Welcome Native,"
          - tapOn: "Admin"
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy A"
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Native Pharmacy B"
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Pharmacist"
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - assertVisible: "Admin"
          - openLink: "frontendmobile://admin/shifts"
          - extendedWaitUntil:
              visible: "Shift Center"
              timeout: 30000
          - openLink: "frontendmobile://attendance/clock"
          - extendedWaitUntil:
              visible: "Clock & breaks"
              timeout: 30000
          - tapOn: "Open camera"
          - extendedWaitUntil:
              visible: "Centre the kiosk QR inside the frame"
              timeout: 30000
          YAML
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          export MAESTRO_CLI_NO_ANALYTICS=1
          maestro --device "$ANDROID_SERIAL" test /tmp/native-acceptance.yaml

      - name: Capture Android diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          timeout 15 adb devices -l > /tmp/adb-devices.txt 2>&1 || true
          timeout 30 adb logcat -d > /tmp/android-logcat.txt 2>&1 || true

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-android-diagnostics
          path: |
            /tmp/native-backend.log
            /tmp/native-npm-install-*.log
            /tmp/android-emulator.log
            /tmp/android-emulator.pid
            /tmp/adb-devices.txt
            /tmp/android-logcat.txt
            /tmp/maestro-version-android.txt
            ~/.maestro/tests
          if-no-files-found: ignore

  ios-native:
    name: iOS native acceptance
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Install macOS PDF runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix glib)/lib:$(brew --prefix pango)/lib" >> "$GITHUB_ENV"

      - name: Checkout workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ env.TESTED_SHA }}"
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare hermetic native-smoke backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cat > backend/core/native_smoke_settings.py <<'PY'
          from .contract_test_settings import *  # noqa
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.sqlite3",
                  "NAME": "/tmp/chemisttasker-native-smoke.sqlite3",
              }
          }
          ALLOWED_HOSTS = ["*"]
          DEBUG = True
          AXES_ENABLED = False
          SECURE_SSL_REDIRECT = False
          CORS_ALLOWED_ORIGINS = ["http://127.0.0.1:8081", "http://localhost:8081"]
          CSRF_TRUSTED_ORIGINS = CORS_ALLOWED_ORIGINS
          EMAIL_BACKEND = "django.core.mail.backends.locmem.EmailBackend"
          USE_AZURE_STORAGE = False
          PY
          rm -f /tmp/chemisttasker-native-smoke.sqlite3
          (
            cd backend
            python manage.py migrate --noinput
            cat > /tmp/seed_native_smoke.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding, Pharmacy, Membership, PharmacyAdmin

          User = get_user_model()
          user = User.objects.create_user(
              email="native-smoke@example.test",
              password="NativeSmoke1234",
              username="native-smoke",
              first_name="Native",
              last_name="Smoke",
              role="PHARMACIST",
              is_otp_verified=True,
              is_mobile_verified=True,
              accepted_terms=True,
          )
          PharmacistOnboarding.objects.create(
              user=user,
