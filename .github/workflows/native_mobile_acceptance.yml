name: Native Mobile Acceptance

on:
  push:
    branches:
      - verification/native-mobile-acceptance-cp7
    paths:
      - ".github/workflows/native_mobile_acceptance.yml"
      - "frontend_mobile/**"
      - "backend/**"
      - "shared-core/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: native-mobile-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: "core.native_smoke_settings"
  APP_ENV: "test"
  SECRET_KEY: "native-smoke-only-not-production"
  ADMIN_URL: "admin/"
  EMAIL_HOST_USER: "native-smoke@example.test"
  EMAIL_HOST_PASSWORD: "native-smoke"
  DEFAULT_FROM_EMAIL: "native-smoke@example.test"
  RECAPTCHA_SECRET_KEY: "native-smoke"
  AZURE_OCR_ENDPOINT: "https://example.test"
  AZURE_OCR_KEY: "native-smoke"
  SCRAPINGBEE_API_KEY: "native-smoke"
  SUPPORT_EMAIL: "native-smoke@example.test"
  MOBILEMESSAGE_USERNAME: "native-smoke"
  MOBILEMESSAGE_PASSWORD: "native-smoke"
  MOBILEMESSAGE_SENDER: "ChemistTasker"
  STRIPE_SECRET_KEY: "sk_test_native_smoke"
  STRIPE_WEBHOOK_SECRET: "whsec_native_smoke"
  GOOGLE_MAPS_API_KEY: "native-smoke"
  MOBILEMESSAGE_API_USERNAME: "native-smoke"
  MOBILEMESSAGE_API_PASSWORD: "native-smoke"
  MOBILEMESSAGE_API_URL: "https://example.test"
  MOBILEMESSAGE_FROM: "ChemistTasker"
  FRONTEND_BASE_URL: "http://127.0.0.1:8081"
  BACKEND_BASE_URL: "http://127.0.0.1:8000"
  EXPO_PUBLIC_API_URL: "http://127.0.0.1:8000"
  EXPO_PUBLIC_WS_URL: "ws://127.0.0.1:8000"
  EXPO_PUBLIC_WEB_URL: "http://127.0.0.1:8081"
  EXPO_PUBLIC_SSL_PINNING_ENABLED: "false"

jobs:
  android-native:
    name: Android native acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare hermetic native-smoke backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cat > backend/core/native_smoke_settings.py <<'PY'
          from .contract_test_settings import *  # noqa
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.sqlite3",
                  "NAME": "/tmp/chemisttasker-native-smoke.sqlite3",
              }
          }
          ALLOWED_HOSTS = ["*"]
          DEBUG = True
          AXES_ENABLED = False
          SECURE_SSL_REDIRECT = False
          CORS_ALLOWED_ORIGINS = ["http://127.0.0.1:8081", "http://localhost:8081"]
          CSRF_TRUSTED_ORIGINS = CORS_ALLOWED_ORIGINS
          EMAIL_BACKEND = "django.core.mail.backends.locmem.EmailBackend"
          USE_AZURE_STORAGE = False
          PY
          rm -f /tmp/chemisttasker-native-smoke.sqlite3
          (
            cd backend
            python manage.py migrate --noinput
            cat > /tmp/seed_native_smoke.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding, Pharmacy, Membership, PharmacyAdmin

          User = get_user_model()
          user = User.objects.create_user(
              email="native-smoke@example.test",
              password="NativeSmoke1234",
              username="native-smoke",
              first_name="Native",
              last_name="Smoke",
              role="PHARMACIST",
              is_otp_verified=True,
              is_mobile_verified=True,
              accepted_terms=True,
          )
          PharmacistOnboarding.objects.create(
              user=user,
              verified=True,
              ahpra_verified=True,
          )
          for name in ("Native Pharmacy A", "Native Pharmacy B"):
              pharmacy = Pharmacy.objects.create(
                  name=name,
                  verified=True,
                  timezone="Australia/Brisbane",
              )
              membership = Membership.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  role="PHARMACIST",
                  employment_type="FULL_TIME",
                  status=Membership.Status.ACCEPTED,
                  is_active=True,
              )
              PharmacyAdmin.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  membership=membership,
                  admin_level=PharmacyAdmin.AdminLevel.MANAGER,
                  staff_role="PHARMACIST",
                  is_active=True,
              )
          PY
            python manage.py shell < /tmp/seed_native_smoke.py
            nohup python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/native-backend.log 2>&1 &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/users/mobile/app-config/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/native-backend.log
          exit 1

      - name: Validate native-smoke authority contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Content-Type: application/json" \
            -d '{"email":"native-smoke@example.test","password":"NativeSmoke1234"}' \
            http://127.0.0.1:8000/api/users/login/ > /tmp/native-login.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/native-login.json"))
          user=data["user"]
          assert user["role"] == "PHARMACIST", user
          assignments=user.get("admin_assignments") or []
          assert len(assignments) == 2, assignments
          assert {a.get("pharmacy_name") for a in assignments} == {"Native Pharmacy A", "Native Pharmacy B"}, assignments
          assert all(a.get("admin_level") == "MANAGER" for a in assignments), assignments
          assert all("MANAGE_ROSTER" in (a.get("capabilities") or []) for a in assignments), assignments
          assert data.get("access") and data.get("refresh"), data.keys()
          PY

      - name: Install mobile dependencies and test-only Firebase descriptors
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "chemisttasker-native-smoke",
              "storage_bucket": "chemisttasker-native-smoke.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.chemisttasker.app"}
              },
              "api_key": [{"current_key": "AIzaSyNativeSmokeOnly000000000000000000"}]
            }],
            "configuration_version": "1"
          }
          JSON
          cat > GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>API_KEY</key><string>NativeSmokeOnly</string>
          <key>GCM_SENDER_ID</key><string>1234567890</string>
          <key>PLIST_VERSION</key><string>1</string>
          <key>BUNDLE_ID</key><string>com.chemisttasker.app</string>
          <key>PROJECT_ID</key><string>chemisttasker-native-smoke</string>
          <key>STORAGE_BUCKET</key><string>chemisttasker-native-smoke.appspot.com</string>
          <key>IS_ADS_ENABLED</key><false/>
          <key>IS_ANALYTICS_ENABLED</key><false/>
          <key>IS_APPINVITE_ENABLED</key><false/>
          <key>IS_GCM_ENABLED</key><true/>
          <key>IS_SIGNIN_ENABLED</key><true/>
          <key>GOOGLE_APP_ID</key><string>1:1234567890:ios:0123456789abcdef</string>
          </dict></plist>
          PLIST
          npm ci

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: "false"

      - name: Prebuild and compile Android development build
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          CI=1 npx expo prebuild --platform android --clean
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if "android:usesCleartextTraffic" not in text:
              text = text.replace("<application ", '<application android:usesCleartextTraffic="true" ', 1)
          path.write_text(text)
          PY
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Boot Android emulator and install app
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          SDKMANAGER="$(command -v sdkmanager)"
          AVDMANAGER="$(command -v avdmanager)"
          ADB="$(command -v adb)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$(dirname "$(dirname "$ADB")")}}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$ADB"
          test -x "$EMULATOR"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force -n chemisttasker-native -k "system-images;android-35;google_apis;x86_64"
          nohup "$EMULATOR" -avd chemisttasker-native -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back virtualscene -camera-front none > /tmp/android-emulator.log 2>&1 &
          "$ADB" wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            cat /tmp/android-emulator.log || true
            exit 1
          fi
          "$ADB" reverse tcp:8000 tcp:8000
          "$ADB" reverse tcp:8081 tcp:8081
          "$ADB" uninstall com.chemisttasker.app >/dev/null 2>&1 || true
          "$ADB" install frontend_mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Start Metro and open Android development project
        shell: bash
        run: |
          set -euo pipefail
          (
            cd frontend_mobile
            CI=1 nohup npx expo start --dev-client --localhost --port 8081 > /tmp/metro.log 2>&1 &
          )
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/status 2>/dev/null | grep -q "packager-status:running"; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"

          MANIFEST_URL="http://127.0.0.1:8081?disableOnboarding=1"
          export MANIFEST_URL
          ENCODED_URL=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["MANIFEST_URL"], safe=""))
          PY
          )
          DEV_URL="frontendmobile://expo-development-client/?url=$ENCODED_URL&disableFab=1&disableAutoLaunch=1"
          printf '%s\n' "$DEV_URL" > /tmp/dev-client-url-android.txt

          ADB="$(command -v adb)"
          "$ADB" shell monkey -p com.chemisttasker.app 1 >/dev/null 2>&1 || true
          sleep 3
          ESCAPED_DEV_URL=$(printf '%q' "$DEV_URL")
          "$ADB" shell "am start -W -a android.intent.action.VIEW -d $ESCAPED_DEV_URL"
          sleep 15

      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Android restart, persona, deep-link and camera smoke
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "=== backend ==="; cat /tmp/native-backend.log || true; echo "=== metro ==="; cat /tmp/metro.log || true; echo "=== emulator ==="; cat /tmp/android-emulator.log || true; fi' EXIT
          curl -fsS http://127.0.0.1:8000/api/users/mobile/app-config/ >/dev/null
          curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"
          cat > /tmp/native-acceptance.yaml <<'YAML'
          appId: com.chemisttasker.app
          ---
          - launchApp:
              stopApp: true
              permissions:
                all: allow
          - extendedWaitUntil:
              visible: "Go to Login"
              timeout: 30000
          - tapOn: "Go to Login"
          - extendedWaitUntil:
              visible: "Welcome back"
              timeout: 30000
          - tapOn: "Work email"
          - inputText: "native-smoke@example.test"
          - tapOn: "Password"
          - inputText: "NativeSmoke1234"
          - hideKeyboard
          - tapOn: "Sign in"
          - tapOn:
              text: "Not now"
              optional: true
          - extendedWaitUntil:
              visible: "Admin"
              timeout: 30000
          - assertVisible: "Welcome Native,"
          - tapOn: "Admin"
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy A"
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Native Pharmacy B"
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Pharmacist"
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - assertVisible: "Admin"
          - stopApp
          - openLink: "frontendmobile://admin/shifts"
          - extendedWaitUntil:
              visible: "Shift Center"
              timeout: 30000
          - stopApp
          - openLink: "frontendmobile://attendance/clock"
          - extendedWaitUntil:
              visible: "Clock & breaks"
              timeout: 30000
          - tapOn: "Open camera"
          - extendedWaitUntil:
              visible: "Centre the kiosk QR inside the frame"
              timeout: 30000
          YAML
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          export MAESTRO_CLI_NO_ANALYTICS=1
          maestro test /tmp/native-acceptance.yaml

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-android-diagnostics
          path: |
            /tmp/native-backend.log
            /tmp/android-emulator.log
            /tmp/metro.log
            /tmp/dev-client-url-android.txt
            ~/.maestro/tests
          if-no-files-found: ignore

  ios-native:
    name: iOS native acceptance
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Install macOS PDF runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix glib)/lib:$(brew --prefix pango)/lib" >> "$GITHUB_ENV"

      - name: Checkout workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            shared-core/package-lock.json
            frontend_mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare hermetic native-smoke backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cat > backend/core/native_smoke_settings.py <<'PY'
          from .contract_test_settings import *  # noqa
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.sqlite3",
                  "NAME": "/tmp/chemisttasker-native-smoke.sqlite3",
              }
          }
          ALLOWED_HOSTS = ["*"]
          DEBUG = True
          AXES_ENABLED = False
          SECURE_SSL_REDIRECT = False
          CORS_ALLOWED_ORIGINS = ["http://127.0.0.1:8081", "http://localhost:8081"]
          CSRF_TRUSTED_ORIGINS = CORS_ALLOWED_ORIGINS
          EMAIL_BACKEND = "django.core.mail.backends.locmem.EmailBackend"
          USE_AZURE_STORAGE = False
          PY
          rm -f /tmp/chemisttasker-native-smoke.sqlite3
          (
            cd backend
            python manage.py migrate --noinput
            cat > /tmp/seed_native_smoke.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding, Pharmacy, Membership, PharmacyAdmin

          User = get_user_model()
          user = User.objects.create_user(
              email="native-smoke@example.test",
              password="NativeSmoke1234",
              username="native-smoke",
              first_name="Native",
              last_name="Smoke",
              role="PHARMACIST",
              is_otp_verified=True,
              is_mobile_verified=True,
              accepted_terms=True,
          )
          PharmacistOnboarding.objects.create(
              user=user,
              verified=True,
              ahpra_verified=True,
          )
          for name in ("Native Pharmacy A", "Native Pharmacy B"):
              pharmacy = Pharmacy.objects.create(
                  name=name,
                  verified=True,
                  timezone="Australia/Brisbane",
              )
              membership = Membership.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  role="PHARMACIST",
                  employment_type="FULL_TIME",
                  status=Membership.Status.ACCEPTED,
                  is_active=True,
              )
              PharmacyAdmin.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  membership=membership,
                  admin_level=PharmacyAdmin.AdminLevel.MANAGER,
                  staff_role="PHARMACIST",
                  is_active=True,
              )
          PY
            python manage.py shell < /tmp/seed_native_smoke.py
            nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/native-backend.log 2>&1 &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/users/mobile/app-config/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/native-backend.log
          exit 1

      - name: Validate native-smoke authority contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Content-Type: application/json" \
            -d '{"email":"native-smoke@example.test","password":"NativeSmoke1234"}' \
            http://127.0.0.1:8000/api/users/login/ > /tmp/native-login.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/native-login.json"))
          user=data["user"]
          assert user["role"] == "PHARMACIST", user
          assignments=user.get("admin_assignments") or []
          assert len(assignments) == 2, assignments
          assert {a.get("pharmacy_name") for a in assignments} == {"Native Pharmacy A", "Native Pharmacy B"}, assignments
          assert all(a.get("admin_level") == "MANAGER" for a in assignments), assignments
          assert all("MANAGE_ROSTER" in (a.get("capabilities") or []) for a in assignments), assignments
          assert data.get("access") and data.get("refresh"), data.keys()
          PY

      - name: Install mobile dependencies and test-only Firebase descriptors
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "chemisttasker-native-smoke",
              "storage_bucket": "chemisttasker-native-smoke.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.chemisttasker.app"}
              },
              "api_key": [{"current_key": "AIzaSyNativeSmokeOnly000000000000000000"}]
            }],
            "configuration_version": "1"
          }
          JSON
          cat > GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>API_KEY</key><string>NativeSmokeOnly</string>
          <key>GCM_SENDER_ID</key><string>1234567890</string>
          <key>PLIST_VERSION</key><string>1</string>
          <key>BUNDLE_ID</key><string>com.chemisttasker.app</string>
          <key>PROJECT_ID</key><string>chemisttasker-native-smoke</string>
          <key>STORAGE_BUCKET</key><string>chemisttasker-native-smoke.appspot.com</string>
          <key>IS_ADS_ENABLED</key><false/>
          <key>IS_ANALYTICS_ENABLED</key><false/>
          <key>IS_APPINVITE_ENABLED</key><false/>
          <key>IS_GCM_ENABLED</key><true/>
          <key>IS_SIGNIN_ENABLED</key><true/>
          <key>GOOGLE_APP_ID</key><string>1:1234567890:ios:0123456789abcdef</string>
          </dict></plist>
          PLIST
          npm ci

      - name: Prebuild and compile iOS simulator development build
        shell: bash
        run: |
          set -euo pipefail
          cd frontend_mobile
          CI=1 npx expo prebuild --platform ios --clean
          PLIST_PATH="ios/ChemistTasker/Info.plist"
          test -f "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST_PATH"
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME="ChemistTasker"
          xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "ChemistTasker" in data["workspace"]["schemes"], data["workspace"]["schemes"]'
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if "iPhone" in x["name"] and x.get("isAvailable", True)))')
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild             -workspace "$WORKSPACE"             -scheme "$SCHEME"             -configuration Debug             -sdk iphonesimulator             -destination "platform=iOS Simulator,id=$SIM_UDID"             -derivedDataPath /tmp/native-ios-derived             CODE_SIGNING_ALLOWED=NO             build
          APP_PATH=$(find /tmp/native-ios-derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          xcrun simctl uninstall "$SIM_UDID" com.chemisttasker.app 2>/dev/null || true
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Start Metro and open iOS development project
        shell: bash
        run: |
          set -euo pipefail
          (
            cd frontend_mobile
            CI=1 nohup npx expo start --dev-client --localhost --port 8081 > /tmp/metro.log 2>&1 &
          )
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/status 2>/dev/null | grep -q "packager-status:running"; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"

          MANIFEST_URL="http://127.0.0.1:8081?disableOnboarding=1"
          export MANIFEST_URL
          ENCODED_URL=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["MANIFEST_URL"], safe=""))
          PY
          )
          DEV_URL="frontendmobile://expo-development-client/?url=$ENCODED_URL&disableFab=1&disableAutoLaunch=1"
          printf '%s\n' "$DEV_URL" > /tmp/dev-client-url-ios.txt

          xcrun simctl launch "$SIM_UDID" com.chemisttasker.app >/dev/null 2>&1 || true
          sleep 3
          xcrun simctl openurl "$SIM_UDID" "$DEV_URL"
          sleep 15

      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run iOS restart, persona, deep-link and camera smoke
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "=== backend ==="; cat /tmp/native-backend.log || true; echo "=== metro ==="; cat /tmp/metro.log || true; fi' EXIT
          curl -fsS http://127.0.0.1:8000/api/users/mobile/app-config/ >/dev/null
          curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"
          cat > /tmp/native-acceptance.yaml <<'YAML'
          appId: com.chemisttasker.app
          ---
          - launchApp:
              stopApp: true
              permissions:
                all: allow
          - extendedWaitUntil:
              visible: "Go to Login"
              timeout: 30000
          - tapOn: "Go to Login"
          - extendedWaitUntil:
              visible: "Welcome back"
              timeout: 30000
          - tapOn: "Work email"
          - inputText: "native-smoke@example.test"
          - tapOn: "Password"
          - inputText: "NativeSmoke1234"
          - hideKeyboard
          - tapOn: "Sign in"
          - tapOn:
              text: "Not now"
              optional: true
          - extendedWaitUntil:
              visible: "Admin"
              timeout: 30000
          - assertVisible: "Welcome Native,"
          - tapOn: "Admin"
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy A"
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Native Pharmacy B"
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Admin workspace"
              timeout: 30000
          - assertVisible: "Native Pharmacy B"
          - tapOn: "Pharmacist"
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - stopApp
          - launchApp
          - extendedWaitUntil:
              visible: "Welcome Native,"
              timeout: 30000
          - assertVisible: "Admin"
          - stopApp
          - openLink: "frontendmobile://admin/shifts"
          - extendedWaitUntil:
              visible: "Shift Center"
              timeout: 30000
          - stopApp
          - openLink: "frontendmobile://attendance/clock"
          - extendedWaitUntil:
              visible: "Clock & breaks"
              timeout: 30000
          - assertVisible: "Open camera"
          YAML
          export JAVA_HOME="$JAVA_HOME"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          export MAESTRO_CLI_NO_ANALYTICS=1
          maestro --device "$SIM_UDID" test /tmp/native-acceptance.yaml

      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ios-diagnostics
          path: |
            /tmp/native-backend.log
            /tmp/metro.log
            /tmp/dev-client-url-ios.txt
            ~/.maestro/tests
          if-no-files-found: ignore
