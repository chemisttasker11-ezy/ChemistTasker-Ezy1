name: Inspect native acceptance evidence
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/native_evidence_inspection.yml'
permissions:
  contents: read
  actions: read
env:
  TESTED_SHA: ${{ inputs.tested_sha || github.event.pull_request.head.sha || github.sha }}
  DJANGO_SETTINGS_MODULE: "core.native_smoke_settings"
  APP_ENV: "test"
  SECRET_KEY: "native-smoke-only-not-production"
  ADMIN_URL: "admin/"
  EMAIL_HOST_USER: "native-smoke@example.test"
  EMAIL_HOST_PASSWORD: "native-smoke"
  DEFAULT_FROM_EMAIL: "native-smoke@example.test"
  RECAPTCHA_SECRET_KEY: "native-smoke"
  AZURE_OCR_ENDPOINT: "https://example.test"
  AZURE_OCR_KEY: "native-smoke"
  SCRAPINGBEE_API_KEY: "native-smoke"
  SUPPORT_EMAIL: "native-smoke@example.test"
  MOBILEMESSAGE_USERNAME: "native-smoke"
  MOBILEMESSAGE_PASSWORD: "native-smoke"
  MOBILEMESSAGE_SENDER: "ChemistTasker"
  STRIPE_SECRET_KEY: "sk_test_native_smoke"
  STRIPE_WEBHOOK_SECRET: "whsec_native_smoke"
  GOOGLE_MAPS_API_KEY: "native-smoke"
  MOBILEMESSAGE_API_USERNAME: "native-smoke"
  MOBILEMESSAGE_API_PASSWORD: "native-smoke"
  MOBILEMESSAGE_API_URL: "https://example.test"
  MOBILEMESSAGE_FROM: "ChemistTasker"
  FRONTEND_BASE_URL: "http://127.0.0.1:8081"
  BACKEND_BASE_URL: "http://127.0.0.1:8000"
  EXPO_PUBLIC_API_URL: "http://127.0.0.1:8000"
  EXPO_PUBLIC_WS_URL: "ws://127.0.0.1:8000"
  EXPO_PUBLIC_WEB_URL: "http://127.0.0.1:8081"
  EXPO_PUBLIC_SSL_PINNING_ENABLED: "false"
  # Also inherited by the shared-core preinstall subprocess.
  npm_config_fetch_retries: "4"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "30000"
  npm_config_fetch_timeout: "120000"

jobs:
  inspect:
    if: github.head_ref == 'diagnostics/ios-evidence-7420821-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download recorded iOS evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: chemisttasker11-ezy/ChemistTasker-Ezy1
          run-id: 41038607269
          name: native-ios-diagnostics
          path: ios-evidence
      - name: Summarize failed commands and recorded screens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('ios-evidence')
          assert root.is_dir()
          print('EVIDENCE_SOURCE=742082198b53f67dbafd1392663988b0a35e28d8 RUN=41038607269 ARTIFACT=12971217983')
          count = 0
          for p in sorted(root.rglob('commands.json')):
              for row in json.loads(p.read_text()):
                  m = row.get('metadata', {})
                  if m.get('status') != 'FAILED':
                      continue
                  count += 1
                  print('FAILED_COMMAND=' + json.dumps({'file': str(p), 'command_types': list(row.get('command', {})), 'depth': m.get('depth'), 'sequence': m.get('sequenceNumber'), 'error': m.get('error')}, ensure_ascii=False)[:3500])
                  for artifact in m.get('artifacts', []):
                      if artifact.get('type') != 'SCREEN_HIERARCHY':
                          continue
                      h = p.parent / artifact['path']
                      if not h.is_file():
                          continue
                      labels = []
                      def visit(v):
                          if isinstance(v, dict):
                              a = v.get('attributes', {})
                              label = a.get('accessibilityText') or a.get('text')
                              if label:
                                  labels.append({'label': label, 'bounds': a.get('bounds'), 'id': a.get('resource-id')})
                              for value in v.values():
                                  visit(value)
                          elif isinstance(v, list):
                              for value in v:
                                  visit(value)
                      visit(json.loads(h.read_text()))
                      unique = list({json.dumps(x, ensure_ascii=False): x for x in labels}.values())
                      print('FAILED_SCREEN=' + json.dumps(unique[:120], ensure_ascii=False)[:18000])
          print('FAILED_COMMAND_COUNT=' + str(count))
          for p in sorted(root.rglob('*.log')):
              if p.name not in {'native-backend.log', 'maestro.log', 'chemisttasker-ios.log'}:
                  continue
              lines = p.read_text(errors='replace').splitlines()
              if p.name == 'chemisttasker-ios.log':
                  lines = [s for s in lines if re.search(r'TypeError|ReferenceError|Unhandled|Fatal|Exception', s, re.I)]
              print('LOG=' + str(p))
              print('\n'.join(lines[-35:])[-6000:])
          PY

  macos-send-probe:
    if: github.head_ref == 'diagnostics/ios-evidence-7420821-20261030'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TESTED_SHA: "742082198b53f67dbafd1392663988b0a35e28d8"
    steps:
      - name: Install macOS PDF runtime dependencies
        shell: bash
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix glib)/lib:$(brew --prefix pango)/lib" >> "$GITHUB_ENV"
      - name: Checkout frozen application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "742082198b53f67dbafd1392663988b0a35e28d8"
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Prepare hermetic native-smoke backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cat > backend/core/native_smoke_settings.py <<'PY'
          from .contract_test_settings import *  # noqa
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.sqlite3",
                  "NAME": "/tmp/chemisttasker-native-smoke.sqlite3",
              }
          }
          ALLOWED_HOSTS = ["*"]
          DEBUG = True
          AXES_ENABLED = False
          SECURE_SSL_REDIRECT = False
          CORS_ALLOWED_ORIGINS = ["http://127.0.0.1:8081", "http://localhost:8081"]
          CSRF_TRUSTED_ORIGINS = CORS_ALLOWED_ORIGINS
          EMAIL_BACKEND = "django.core.mail.backends.locmem.EmailBackend"
          USE_AZURE_STORAGE = False
          # Captured test mail must not depend on external runner hostname DNS.
          from django.core.mail.utils import DNS_NAME
          DNS_NAME._fqdn = "native-smoke.localhost"
          import faulthandler
          faulthandler.dump_traceback_later(45, repeat=True)
          PY
          rm -f /tmp/chemisttasker-native-smoke.sqlite3
          (
            cd backend
            python manage.py migrate --noinput
            cat > /tmp/seed_native_smoke.py <<'PY'
          from django.contrib.auth import get_user_model
          from client_profile.models import PharmacistOnboarding, Pharmacy, Membership, PharmacyAdmin

          User = get_user_model()
          user = User.objects.create_user(
              email="native-smoke@example.test",
              password="NativeSmoke1234",
              username="native-smoke",
              first_name="Native",
              last_name="Smoke",
              role="PHARMACIST",
              is_otp_verified=True,
              is_mobile_verified=True,
              accepted_terms=True,
          )
          PharmacistOnboarding.objects.create(
              user=user,
              verified=True,
              ahpra_verified=True,
          )
          for name in ("Native Pharmacy A", "Native Pharmacy B"):
              pharmacy = Pharmacy.objects.create(
                  name=name,
                  verified=True,
                  timezone="Australia/Brisbane",
              )
              membership = Membership.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  role="PHARMACIST",
                  employment_type="FULL_TIME",
                  status=Membership.Status.ACCEPTED,
                  is_active=True,
              )
              PharmacyAdmin.objects.create(
                  user=user,
                  pharmacy=pharmacy,
                  membership=membership,
                  admin_level=PharmacyAdmin.AdminLevel.MANAGER,
                  staff_role="PHARMACIST",
                  is_active=True,
              )
          from testing.invoice_acceptance_fixture import seed_invoice_work
          seed_invoice_work(user, Pharmacy.objects.order_by('pk').first())
          PY
            python manage.py shell < /tmp/seed_native_smoke.py
            nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/native-backend.log 2>&1 &
          )
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/users/mobile/app-config/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/native-backend.log
          exit 1

      - name: Measure real cold PDF preparation and captured send
        shell: bash
        run: |
          cd backend
          python - <<'PY'
          import json, time, uuid, requests
          import django
          django.setup()
          from django.conf import settings
          from django.contrib.auth import get_user_model
          from worker_finance.services import internal_invoice_sources, internal_invoice_prefill
          from testing.invoice_acceptance_fixture import verify_invoice_work
          assert settings.EMAIL_BACKEND == 'django.core.mail.backends.locmem.EmailBackend'
          user = get_user_model().objects.get(email='native-smoke@example.test')
          source = internal_invoice_sources(user)[0]
          draft = internal_invoice_prefill(user, [source['assignment_id']])
          draft['request_key'] = str(uuid.uuid4())
          draft['lines'][0]['quantity'] = '7.5'
          base = 'http://127.0.0.1:8000'
          session = requests.Session()
          login = session.post(base + '/api/v1/users/login/', json={'email': 'native-smoke@example.test', 'password': 'NativeSmoke1234'}, timeout=30)
          login.raise_for_status()
          session.headers['Authorization'] = 'Bearer ' + login.json()['access']
          saved = session.post(base + '/api/v1/finance/invoices/', json=draft, timeout=30)
          assert saved.status_code == 201, (saved.status_code, saved.text[:1000])
          doc = saved.json()
          assert doc['calculation']['payable'] == '577.50', doc['calculation']
          print('SAVE_V1=201 total=577.50', flush=True)
          draft = doc['payload']
          draft['version'] = doc['version']
          draft['lines'][0]['quantity'] = '8'
          revision = session.patch(base + '/api/v1/finance/invoices/' + str(doc['id']) + '/', json=draft, timeout=30)
          assert revision.status_code == 200, (revision.status_code, revision.text[:1000])
          doc = revision.json()
          assert doc['version'] == 2 and doc['calculation']['payable'] == '616.00', doc['calculation']
          print('SAVE_V2=200 total=616.00', flush=True)
          started = time.monotonic()
          print('COLD_SEND_STARTED', flush=True)
          response = session.post(base + '/api/v1/finance/invoices/' + str(doc['id']) + '/send/', json={'version': 2, 'confirmed': True}, timeout=(5, 180))
          print(json.dumps({'cold_send_seconds': round(time.monotonic() - started, 3), 'status': response.status_code, 'detail': response.json().get('detail')}), flush=True)
          assert response.status_code == 200, response.text[:1000]
          verify_invoice_work()
          print('MACOS_COLD_REAL_PDF_CAPTURED_SEND=PASS', flush=True)
          
          PY
      - name: Capture bounded backend phase diagnostics
        if: always()
        run: tail -n 110 /tmp/native-backend.log || true
