name: Fixed Candidate Recovery Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  APP_ENV: test
  SECRET_KEY: disposable-release-rehearsal-only-Q8k4M9p2R7v3A6x5D1c0L8n4H7z9B2w6
  ADMIN_URL: admin/
  EMAIL_HOST_USER: release@example.test
  EMAIL_HOST_PASSWORD: disposable
  DEFAULT_FROM_EMAIL: release@example.test
  RECAPTCHA_SECRET_KEY: disposable
  AZURE_OCR_ENDPOINT: https://example.test
  AZURE_OCR_KEY: disposable
  SCRAPINGBEE_API_KEY: disposable
  MOBILEMESSAGE_USERNAME: disposable
  MOBILEMESSAGE_PASSWORD: disposable
  MOBILEMESSAGE_SENDER: ChemistTasker
  LOCAL_DB_NAME: ct_release_candidate
  LOCAL_DB_USER: postgres
  LOCAL_DB_PASSWORD: postgres
  LOCAL_DB_HOST: 127.0.0.1
  LOCAL_DB_PORT: '5432'

jobs:
  recovery-rehearsal:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ct_release_candidate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ct_release_candidate"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Strict inventory comparison controls
        run: python -m unittest discover -s scripts -p test_recovery_inventory_comparison.py -v
      - name: Historical identity, route and task startup contracts
        run: python backend/manage.py test core.test_encrypted_field_boundary core.test_task_dispatch_registration core.test_task_contracts core.test_client_profile_api_composition core.test_signal_registry_contract --settings=core.postgres_test_settings
      - name: Rehearse main upgrade, candidate restore and pre-upgrade rollback
        env:
          PG_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/rehearse-candidate-recovery.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-recovery-evidence
          path: .qa-artifacts/candidate-recovery
          if-no-files-found: error

  production-security:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-acceptance') }}
    name: Production deployment and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "False"
      APP_ENV: vps
      ALLOWED_HOSTS: chemisttasker.invalid
      CORS_ALLOWED_ORIGINS: https://chemisttasker.invalid
      CSRF_TRUSTED_ORIGINS: https://chemisttasker.invalid
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      JWT_COOKIE_SECURE: "True"
      JWT_COOKIE_PATH: "/"
      USE_PROD_DB: "False"
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/4
      REDIS_URL: redis://127.0.0.1:6379/0
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: redis://127.0.0.1:6379/2
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/3
      USE_REDIS_CHANNEL_LAYER: "True"
      BACKEND_BASE_URL: https://backend.chemisttasker.invalid
      FRONTEND_BASE_URL: https://chemisttasker.invalid
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install -r backend/requirements.txt

      - name: Audit deployment routing and containers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          node scripts/audit-production-deployment.mjs
          docker compose -f docker-compose.yml config --quiet

      - name: Django production deployment checks
        run: python backend/manage.py check --deploy --tag security --fail-level WARNING --settings=core.settings

      - name: Assert production security invariants
        shell: bash
        run: |
          PYTHONPATH=backend python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings")
          import django
          django.setup()
          from django.conf import settings
          assert settings.DEBUG is False
          assert settings.SECURE_SSL_REDIRECT is True
          assert settings.SECURE_HSTS_SECONDS >= 31536000
          assert settings.SECURE_HSTS_INCLUDE_SUBDOMAINS is True
          assert settings.SESSION_COOKIE_SECURE is True
          assert settings.CSRF_COOKIE_SECURE is True
          assert settings.JWT_COOKIE_SECURE is True
          assert settings.JWT_COOKIE_PATH == "/"
          assert settings.USE_REDIS_CHANNEL_LAYER is True
          assert "rest_framework.permissions.IsAuthenticated" in settings.REST_FRAMEWORK["DEFAULT_PERMISSION_CLASSES"]
          assert settings.ROOT_URLCONF == "composition.urls"
          from composition.urls import urlpatterns as composed_patterns
          from core.urls import urlpatterns as historical_patterns
          from django.urls import get_resolver
          assert composed_patterns is historical_patterns
          assert get_resolver().url_patterns is historical_patterns
          print("PRODUCTION_SECURITY=PASS")
          PY

      - name: Verify historical routes and permission handlers through composition
        run: python backend/manage.py test core.test_client_profile_api_composition --settings=core.contract_test_settings

