version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend_web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-security-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend_web/landing_next
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-security-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend_mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-security-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
