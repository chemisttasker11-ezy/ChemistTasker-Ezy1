upstream chemisttasker_backend_staging {
    server web:8000;
}

upstream chemisttasker_frontend_staging {
    server frontend:80;
}

upstream chemisttasker_public_staging {
    server landing:3000;
}

map $http_upgrade $connection_upgrade_staging {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/hub/ {
        proxy_pass http://chemisttasker_public_staging;
    }

    location /api/platform/ {
        proxy_pass http://chemisttasker_public_staging;
    }

    location ~ ^/onboarding/(owner|pharmacist|otherstaff|explorer)(/|$) {
        proxy_pass http://chemisttasker_frontend_staging;
    }

    location /setup/ {
        proxy_pass http://chemisttasker_frontend_staging;
    }

    location /dashboard/ {
        proxy_pass http://chemisttasker_frontend_staging;
    }

    location = /dashboard {
        proxy_pass http://chemisttasker_public_staging;
    }

    location /dashboard-assets/ {
        proxy_pass http://chemisttasker_frontend_staging;
    }

    location /js/ {
        proxy_pass http://chemisttasker_frontend_staging;
    }

    location /_next/ {
        proxy_pass http://chemisttasker_public_staging;
    }

    location /api/ {
        proxy_pass http://chemisttasker_backend_staging;
    }

    location /health/ {
        proxy_pass http://chemisttasker_backend_staging;
    }

    location = /sitemap.xml {
        proxy_pass http://chemisttasker_backend_staging;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        proxy_pass http://chemisttasker_backend_staging;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_staging;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://chemisttasker_backend_staging;
    }

    location / {
        proxy_pass http://chemisttasker_public_staging;
    }
}
