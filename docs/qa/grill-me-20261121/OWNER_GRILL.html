ds cover\" on the calendar: who sees it, and how is it filled without double-booking? (verified this trace)\n\n**Plain English:** a shift needs cover — does it show on the team calendar, and can two people claim it?\n**ACTUAL TODAY — Web and Expo:** there is **no \"needs cover\" state anywhere** — not on the team calendar (events/notes/birthdays only), not as a flag on any model, and not as a roster label. What exists: a `WorkerShiftRequest` in PENDING status, shown on the Vite roster as **\"Cover Request (PENDING)\"** (and APPROVED/REJECTED after decision), in the Expo worker roster's \"Pending cover requests\" section, and in the manager approvals screen. The assignment **stays with the original worker** until a replacement is approved (carried R04) or the worker is released. **Filling:** manager approves one replacement — atomic (`select_for_update`), stale-request guard (requester must still be the assignee), replacement must pass `worker_issues` errors **and** warnings; a second approval attempt fails (\"Request is already approved\"). **Release:** deletes the assignment and reuses the Shift/Slot, optionally escalating visibility (daily PLATFORM limit enforced) — one vacancy, no duplicate (carried R06). **Who sees it:** the requesting worker, the manager (approvals), and — on Vite — anyone viewing the team roster (the cover-request event is visible with its status).\n**RECOMMENDED:** One calendar entry, state \"Needs cover\", linked to the single vacancy; claiming it goes through the R04C fulfilment path (accept + role/conflict checks + manager approval); the entry clears only when the replacement is confirmed.\n**ALTERNATIVE A:** Needs-cover shows only to managers until a vacancy is posted. **Other / Defer.**\n**Edge:** two colleagues accept cover at once — first confirmed wins, second gets a clear \"already filled\" message, no double assignment (guarded by the PENDING-status check + row lock).\n**Sources:** `backend/workforce/roster/worker_actions.py` (`submit_cover_request`, `approve_cover_replacement`, `release_worker_from_assignment`), `frontend_web/src/pages/dashboard/sidebar/RosterWorkerPage.tsx`, `RosterOwnerPage.tsx`, `frontend_mobile/app/my-roster.tsx`, `features/parity/roster.tsx`.\n**Decision status:** OPEN."}, {"id": "GM-23-29", "area": "GM-23", "plat": "Web + Expo", "md": "### GM-23-29 — NEW. Calendar history / audit: can the owner see who changed what, when? (verified this trace — split)\n\n**Plain English:** if a shift time was changed, is there a record of who changed it?\n**ACTUAL TODAY — split:** **Roster actions are audited.** `RosterActionAudit` is append-only and records swap/cover requested/approved/rejected, worker released, shift unpublished/republished (actor, target, slot before/after snapshots, request ids); `RosterPublicationAudit` records every publish as a numbered revision with a validation snapshot; the manager roster has an audit screen (`audit.tsx`). **Calendar events and work notes are NOT audited:** `team_calendar/views.py` writes no audit rows — the only history is `created_by`, `created_at`, `updated_at` on each row (who created it and when it was last touched, not what changed). There is no audit view for calendar events/notes on any client.\n**RECOMMENDED:** Every calendar-affecting change (create, re-time, cancel, cover, publish) writes an audit entry with actor, old/new values, and time; visible to owner/manager for their pharmacy.\n**ALTERNATIVE A:** No audit at launch (rely on chat/email). **Other / Defer.**\n**Edge:** a work note edited by a colleague — today only `updated_at` moves, with no record of who or what. **Wrong tenant:** audit reads must be scoped per pharmacy like everything else (the manager audit screen is pharmacy-scoped).\n**Sources:** `backend/workforce/roster/worker_actions.py`, `backend/workforce/roster/publication.py`, `backend/workforce/models.py` (`RosterActionAudit`, `RosterPublicationAudit` — referenced), `backend/team_calendar/views.py` (no audit writes), `frontend_mobile/app/manager/roster/audit.tsx` (listing).\n**Decision status:** OPEN.\n\n---"}, {"id": "GM-23-W01", "area": "GM-23", "plat": "Web + Expo", "md": "### GM-23-W01: Planner: simplified version (PR #181) vs original (PR #192) (W-17): deferred by the owner\n**Deferred:** the owner will mix the two versions later. Keep both, touch neither until the owner asks. Not asked in this grill."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Worker personal roster view | Worker reviews assigned shifts in personal roster view (`frontend_web/src/pages/dashboard/sidebar/RosterWorkerPage.tsx:77`). | Worker views upcoming shifts on My Roster screen (`frontend_mobile/app/my-roster.tsx:82`). | Yes | |\n| Manager team roster / coverage view | Manager plans and reviews pharmacy shifts in owner roster view (`frontend_web/src/pages/dashboard/sidebar/RosterOwnerPage.tsx:97`). | Manager inspects coverage and assignments in manager roster (`frontend_mobile/app/manager/roster/calendar.tsx:3`). | Yes | |\n| Pharmacy calendar view (month / week / day) | Pharmacy staff view calendar events and shifts (`frontend_web/src/pages/dashboard/sidebar/PharmacyCalendarPage.tsx:73`). | Shared calendar component displays monthly/weekly schedule (`frontend_mobile/roles/shared/calendar/index.tsx:67`). | Yes | |\n| Leave request submission and approval | Worker submits leave and manager reviews approvals (`frontend_web/src/features/workforce/MyLeavePage.tsx:10`). | Worker submits leave and manager approves requests (`frontend_mobile/app/workforce/leave-requests.tsx:185`). | Yes | |\n| Shift cover / replacement request | Worker requests cover from the roster (`frontend_web/src/pages/dashboard/sidebar/RosterWorkerPage.tsx:546`). | Worker requests cover from My Roster (`frontend_mobile/app/my-roster.tsx:280`, `:367`). | Yes | Citation corrected 22 Nov (orchestrator review). |\n| Automated birthday & anniversary events | System generates recurring events displayed on pharmacy calendar (`backend/team_calendar/tasks.py:105`, `backend/core/settings.py:284`). | Birthday events display alongside shift entries on mobile calendar (`frontend_mobile/roles/shared/calendar/index.tsx:233`). | Yes | |\n| Add shift to personal external calendar | Web lacks one-click external calendar intent generator (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/index.tsx`). | Worker taps 'Add to calendar' to open Google/device calendar editor (`frontend_mobile/app/next-shifts.tsx:133`). | Expo only | Intended: Mobile leverages native device calendar integrations (`nextShiftModel.ts`). |", "file": "areas/GM-23-calendars-operations.md"}, {"key": "GM-25", "row": "13", "title": "GM-25 Web/Next/Expo parity", "qs": [{"id": "GM25-C08", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-C08 — LA-Q02 (code, ON-04). Fix before launch? Mobile \"add\n\n> **Also covers (22 Nov):** GM26-Q47 (GM-26). Asked once, here.\npersonal profile\" drops pharmacist data and sends other staff to\nnot-found.** **Verdict: STILL VALID (pharmacist half) / CHANGED\n(other-staff half) — V.** Pharmacist: `roles/pharmacist/onboarding.tsx`\nstill posts `preferred_hourly_rate`, `minimum_rate`,\n`overtime_multiplier`, `weekend_premium` (repo-wide: 1 hit each — this\nfile only — plus `overtime_multiplier` in an award table, not a worker\nprofile), so the rate data is still silently dropped; bank fields\n(`bsb`, `account_number`, `bank_account_name`) — backend has\n`bank_account_name` in invoicing/worker-finance models, but whether the\nonboarding update accepts them is UNKNOWN. Other staff: the card now\nroutes to the existing `/otherstaff/profile-basic-info`; the 404 is gone.\nOptions: A — Before launch; B — Soon after launch (first month);\nC — Not needed. Recommended (Oct 2026): A. **Status: STILL VALID\n(pharmacist data loss), OPEN.**"}, {"id": "GM25-C09", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-C09 — LA-Q03 (code, ON-05). Fix before launch? Reachable mobile\nscreens can dead-end or send unsupported fields.** **Verdict: STILL VALID\n— V (item by item).** Owner onboarding steps 1–3/review still present in\n`app/owner/onboarding/`; hidden `roles/owner/shifts/create.tsx` still\nbuilds a payload with `hourly_rate` (the \"not a backend field\" claim is\nweakened — `hourly_rate` has 42 repo hits — but payload acceptance was NOT\nverified and it remains a parallel legacy create path); explorer shifts\nplaceholder (L17, M); owner hub \"coming soon\" (V); web\n`OrganizationCreate.tsx` unrouted (V). Options: A — Before launch;\nB — Soon after launch; C — Not needed. Recommended (Oct 2026): A.\n**Status: STILL VALID, OPEN.**"}, {"id": "GM25-C10", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-C10 — LA-Q04 (code, ON-10). Fix before launch? Profile progress %\ndoesn't match what Verified needs.** Context (Oct 2026, NOT\nRE-VALIDATED): `onboarding/services/progress.py` counts resume, bio,\nrates, referees and ID, while Verified needs email + mobile + AHPRA. The\n% UI still exists on the mobile screen (V: ProgressBar + `{progress}%`\nchip in `roles/pharmacist/onboarding.tsx`); the counting logic was not\nre-read. Options: A/B/C as above. Recommended (Oct 2026): A. **Status:\nNOT RE-VALIDATED.**"}, {"id": "GM25-C11", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-C11 — LA-Q11 (code, SH-11). Fix before launch? The auto-publish\nsetting contradicts R06/R04B and is missing on mobile.** **Verdict:\nSTILL VALID — V, settled by fresh re-trace (see CG-10).** The #184\n\"current\" note was right that backend handlers do not consult the toggle\n— `worker_requests.py::approve()` publishes in both branches and never\nreads `auto_publish_worker_requests`. But the audit's substance stands:\nthe field's help text still says \"automatically create and publish a new\nshift\" (`organizations/models.py:238`); the toggle exists on web\n(`PharmacyPage.tsx:1613/1950/2117/2508`) and is absent on mobile\n(`PharmacyForm.tsx` carries the value in state, renders no toggle).\nOptions: A/B/C as above. Recommended (Oct 2026): A (correct copy, enforce\nper-pharmacy cover permission). **Status: STILL VALID, OPEN.**"}, {"id": "GM25-Q02", "area": "GM-25", "plat": "Web only", "md": "**GM25-Q02 — Vite vs Next: which routes live where, and is the migration\nfinished, frozen, or rolled back?** Actual today (TRACED, V): the\ncanonical map exists on paper — Next owns public/auth/blog/news/\ncalculator/hubs/content, Vite owns `/dashboard` + private workflows\n(UNIFIED-WEB-EXPERIENCE-PLAN.md, 14 Sep 2026) — but the plan itself\nrecords the split as incomplete (distinct login flows, duplicated\nAuthContext/token helpers, no reliable shared return-path contract,\nlogout revocation unfinished), and PUBLIC-MIGRATION-PLAN.md says\nimplementation awaited source access that 404'd. In the tree, Next\napp-router public pages are thin wrappers (`<PublicEntry\npage=\"PublicJobBoardPage\"/>`) over migrated copies, and 43 of 64 matched\nVite↔Next paths have diverged (VITE_NEXT_TWIN_DRIFT.md). The migration is\ntherefore **neither finished nor cleanly frozen**: the intent is\ndocumented, the implementation is wrappers + divergent twins. Options:\nKEEP — let both serve, Next as public shell, Vite as app (today's apparent\nshape); A — Next owns ALL public routes (shifts/talent/explore/orgs), Vite\nowns app-only routes; B — Freeze the migration: Next is landing/marketing\nonly, all product routes stay on Vite; C — Roll Next back into Vite.\nOther / defer. Recommended: **A, but only after the public-route contract\ntest passes on the exact head and the 43 divergent paths are classified**\n(twin-drift acceptance protocol) — two public implementations of the same\nboard is how the \"Failed to load public shifts\" class of bug happens twice.\nNormal case: visitor lands on a public board. Edge case: a shared link\nopens on the wrong surface. Web/Expo difference: Expo deep-links must\nresolve to one canonical web route. **Status: TRACED — OPEN.**"}, {"id": "GM25-Q03", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q03 — Duplicated public boards: one implementation or tolerated\ntwins?** Actual today (TRACED, V): **confirmed triple implementation.**\nVite `src/pages/PublicJobBoardPage.tsx` (431 lines) and Next migrated\n`landing_next/migrated/pages/PublicJobBoardPage.tsx` (468 lines) are both\nfull implementations sharing `getPublicJobBoard` from shared-core — and\nthey have **diverged in behaviour**: the Next copy has a race guard\n(`latestResultsRequest` — only the latest search/page request may replace\nthe list; Vite lacks it, so stale responses can overwrite), different SEO\ntitle/description/canonical/image, different layout (Vite: PublicLogoTopBar\n+ grey.50; Next: \"Browse first. Apply when ready.\" banner), and drops the\n`?organization=` canonical param. The Next app-router page\n(`app/(public)/shifts/public-board/page.tsx`) is a thin wrapper rendering\nthe migrated page. Expo adds `PublicShiftsView.tsx` /\n`AnonymousShiftBoardScreen.tsx`. Both web copies show the same\n'Failed to load public shifts' error text. The Nov 2026\n`GET /public-shifts/` (login-required) vs `GET /public-job-board/`\n(public) split was NOT re-validated. Options: KEEP — tolerated twins,\neach maintained separately; A — One shared-core implementation, all three\nsurfaces render it; B — Retire the Vite public boards, Next owns public;\nC — Retire Next public boards, Vite owns public. Other / defer.\nRecommended: **A** — the public board is the top of the funnel; a twin\nthat drifts is a lost applicant. Severity: High. **Status: TRACED\n(duplication CONFIRMED), OPEN.**"}, {"id": "GM25-Q04", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q04 — Shared-core scope: which flows must go through shared-core,\nand what happens to direct client API calls?** Actual today (TRACED, V +\nM): Vite public board uses shared-core (`getPublicJobBoard`,\n`expressInterestInPublicShiftService`); Expo active/confirmed shifts went\nthrough shared-core in #249 `96cd52bf`; Expo payment uses shared-core\ncheckout calls. But PARITY_MATRIX L14 (in repo at head) records direct\nAxios remaining in `nativeIdentityTransport.ts` (login/register/OTP) plus\nrefresh/CSRF/WebSocket-ticket/app-config adapters — \"endpoint constants\ncoming from shared-core do not make a locally executed Axios request a\nshared-core operation\". So adoption is **partial**: domain reads/writes\nare moving to shared-core, identity/session transport is not. Options:\nKEEP — shared-core where it exists, direct calls elsewhere (today's\napparent shape); A — All domain calls through shared-core on both\nclients, direct calls fail review; B — Shared-core for new work only,\nlegacy direct calls grandfathered. Other / defer. Recommended: **A** —\nparity cannot be audited if each client can bypass the shared contract;\nthe #249 boundary audit (\"passed after the source ownership repair\")\npoints this way. Severity: High. **Status: TRACED (partial adoption),\nOPEN.**"}, {"id": "GM25-Q05", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q05 — Dead, half-built, and \"coming soon\" screens: delete, hide,\nor fix before launch?** Actual today (TRACED, V): placeholders confirmed\nat head — `HubPlaceholder.tsx` (\"Hub will live here. Coming soon.\"),\n`roles/owner/hub.tsx` (\"Hub coming soon … This is a placeholder.\"),\npharmacist learning \"Coming Soon\" (PARITY_MATRIX L16, M), Explorer shifts\n\"Shifts\" (L17, M), owner onboarding steps 1–3/review still present,\nhidden `create.tsx` still posting `hourly_rate`, `OrganizationCreate.tsx`\nunrouted. Expo also gained `app/explore/hubs/` and `features/parity/` —\nthe placeholders were **not** replaced, they sit beside new surfaces.\nOptions: KEEP — leave reachable placeholders as-is; A — Delete or\nun-route every dead screen before launch; B — Hide behind a flag /\nremove from navigation, fix after launch; C — Fix all before launch.\nOther / defer. Recommended: **A for unrouted/dead screens, B for\ngenuinely post-launch features** — a reachable dead end is worse than a\nmissing feature; a labelled \"coming soon\" inside an existing hub is\nacceptable only if it cannot take input or money. Severity: High\n(first-impression + support load). Normal case: user taps a nav item.\nEdge case: a deep link / QR lands on a dead route. **Status: TRACED,\nOPEN.**"}, {"id": "GM25-Q06", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q06 — Navigation and routing parity: one nav model, or one per\nclient?** Actual today (TRACED, M + V): Vite `src/navigation.tsx`; Expo\n`app/_layout.tsx` + per-role `_layout.tsx` files + PersonaShell route/\ntitle auditing (#249 `3149fbc2`); Expo `utils/notificationNavigation.ts`\nand notification-routing tests (PR249 file list). PARITY_MATRIX (M)\nsupplies the destination-by-destination evidence: L10 (org/admin nav does\nnot mirror capability rules — mobile lists entries unconditionally, admin\n\"Roster\" points at the Shift Centre instead of `/manager/roster`), L13\n(activity URL conversion misses renamed native routes), L15 (admin\nAttendance Approvals web nav target is unrouted — a **web** defect).\nWhether the same role sees the same destinations in the same order on web\nand Expo is therefore **answered in the negative for the L10/L13/L15\ncases**. Options: KEEP — each client keeps its own navigation; A — One\nrole → destination map, implemented per client, covered by route tests;\nB — Expo mirrors web navigation exactly (same order, same labels).\nOther / defer. Recommended: **A** — native need not pixel-mirror web\n(Issue #250), but a role must never find a destination on one client\nthat does not exist on the other without that being a deliberate,\ndocumented cut. Severity: Medium. **Status: TRACED (via PARITY_MATRIX),\nOPEN.**"}, {"id": "GM25-Q07", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q07 — Auth and session parity: same rules on all three surfaces?**\nActual today (TRACED, A01 + V): Expo has login/OTP/mobile-verify/forgot/\nreset routes plus app lock + biometric (`appLock.ts`,\n`biometricAuth.ts`, `AppLockGate.tsx` — PR249 file list); web session\nrules per GM-01 (adopted): remember-me inversion (ticked = 7-day refresh,\nunticked = 90-day), Expo always persistent with no checkbox, biometric\nflag in AsyncStorage not SecureStore, Next migrated `config/api.ts`\npasses `getToken` but NO `refreshToken` callback. Options: KEEP — Expo\nkeeps app lock/biometric, web keeps its own session behaviour; A — One\nsession policy (expiry, stale-session, re-auth, lockout) written once,\napplied on all surfaces, with native biometrics as an *additional* unlock,\nnot a different session; B — Web session rules only; Expo defers to web\nlogin via WebView. Other / defer. Recommended: **A**. Edge cases: stale\nsession mid-booking; session expires during kiosk PIN setup; biometric\nfails. Severity: High (a session that behaves differently per client\nstrands bookings). **Status: TRACED (via GM-01), OPEN.**"}, {"id": "GM25-Q08", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q08 — Logged-out public surfaces: what must a visitor be able to\ndo on each surface?** Actual today (TRACED, V): Expo has a public Explore\ntree (`app/explore/` — article, blog, hubs, learning, news, organization,\ntalent-board — PR249 file list) and anonymous public-shift load-more\nretry was fixed in #249 `79d294d`; Next has public routes under a\ncontract test (read at head); Vite has `PublicShiftsPage.tsx` /\n`PublicTalentBoardPage.tsx`. Whether the three public surfaces show the\nsame content, same filters, and same calls-to-action is UNKNOWN (the two\nweb board copies already differ in layout/SEO/race handling — Q03).\nOptions: KEEP — each public surface shows what it shows today; A — One\npublic content contract: same boards, same cards, same \"sign up to\napply\" gate on all three; B — Next is the only public surface; Vite and\nExpo public boards link out to it. Other / defer. Recommended: **A** —\nthe public board is the funnel; three different funnels is three\ndifferent products. Severity: High. **Status: TRACED (STRUCTURE);\ncontent parity UNKNOWN, OPEN.**"}, {"id": "GM25-Q09", "area": "GM-25", "plat": "Expo only", "md": "**GM25-Q09 — Offline and poor-network behaviour on Expo: what is the\npromise?** Actual today: `features/nextShift/offlineConfirmedShifts.ts`\nexists (PR249 file list); #249 fixed stale-reload/terms-dismissal\nregressions (`d15304b0`). What a worker can see or do offline (view\nconfirmed shifts? clock in? apply?) is UNKNOWN — the file was not opened\nin this trace. Options: KEEP — whatever each screen does today when\noffline; A — Documented offline promise: confirmed shifts + roster\nreadable offline, all writes queued with visible retry, never silently\ndropped; B — Online-only app: clear offline state, no cached writes.\nOther / defer. Recommended: **A** — locums work in hospitals with dead\nzones; silent failure to record a shift is a pay dispute. Edge cases:\nclock-in offline then online; accept offered while offline; stale terms\nshown from cache. Severity: High. **Status: UNKNOWN (not inspected),\nOPEN.**"}, {"id": "GM25-Q10", "area": "GM-25", "plat": "Expo only", "md": "**GM25-Q10 — How does Expo take payment?** Actual today (TRACED, V):\n**resolved — link-out to Stripe Checkout in the system browser.**\n`roles/shared/shifts/ActiveShiftsPage/index.tsx::handlePayWithStripe`\ncalls the shared-core checkout, then `Linking.openURL(res.url)`; 409\nrecovery via `resumeFulfillmentCheckout` / `expireFulfillmentCheckout`\nwith a \"Checkout already in progress\" dialog; `roles/owner/\nsubscription-seats.tsx` does the same for subscriptions\n(`createSubscriptionCheckout` → `Linking.openURL`, reading\n`checkout=success/cancel` params on return). No native payment sheet, no\nWebView. Repo-wide `Stripe` search in `frontend_mobile` returned only 5\nhits (subscription-seats, ActiveShiftsPage ×2, PharmacyForm ×2) — no\nother payment path exists on Expo. NOT verified: the return-to-app leg\n(deep link vs browser tab), behaviour when the app is backgrounded during\nCheckout, and duplicate-payment handling on retry. Options: KEEP — n/a\n(no longer applicable); A — Expo hands payment to the web Checkout\n(link/WebView) and returns to the app on completion (**the implemented\npath — confirm it**); B — Native payment sheet (Stripe SDK) inside Expo;\nC — Expo cannot pay: reservations made on Expo must be paid on web,\nstated in-app before acceptance. Other / defer. Recommended: **A as\nimplemented, with the return leg proven before any Expo launch** (never\nlet a worker accept a reservation on Expo that the pharmacy cannot pay\nfor inside the D02 window). Severity: **launch-gate; financial.**\nNormal case: owner accepts → pays in 30 min (urgent shift). Edge case:\npayment link expires mid-handoff; app backgrounded during Checkout;\nduplicate payment on retry. **Status: TRACED, OPEN (confirm + prove\nreturn leg).**"}, {"id": "GM25-Q11", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q11 — Notification parity: email vs push — same events, same\ntiming?** Actual today (TRACED, V structure): web reminders are email\n(Oct 2026, NOT re-validated); Expo has a notifications inbox, push-preference\ntests, and hub/membership routing tests (PR249 file list). Whether the\nsame event produces email on web and push on Expo, and whether a user\nwith both gets two copies, is UNKNOWN. Cross-ref: GM-26 Q44 — notifications\npersist kiosk codes/PIN OTPs (confirmed at head), so the notification\nchannel itself is a privacy surface. Options: KEEP — email on web,\npush on Expo, no defined mapping; A — One event catalogue: every event\nhas defined web + Expo channels, one copy per user across devices;\nB — Push only on Expo, email only on web, duplicates accepted. Other /\ndefer. Recommended: **A**. Covers: reservation expiry, offer received/\nexpired, escalation, reminders (AG-Q11), cancellation, incident notices.\nSeverity: High (a missed payment-expiry notice is a lost booking).\n**Status: UNKNOWN, OPEN.**"}, {"id": "GM25-Q12", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q12 — Kiosk: web-only, or does Expo do kiosk too?** Actual today\n(TRACED): Vite has `src/kiosk/`, `kiosk.html`, `src-tauri/` (desktop\nkiosk); Expo has `app/kiosk-link.tsx` and `app/attendance-pin.tsx`\n(verified dirs) — a link/route, not necessarily a kiosk; the pairing code\nis delivered to Expo via a notification containing a `kiosk_link_route`\n(see GM-26 Q44). Options: KEEP — kiosk is a Vite/desktop surface; Expo\nonly links to it; A — Expo is a full kiosk client (PIN + QR clock-in on a\nshared device); B — Kiosk is web-only and Expo carries no kiosk routes at\nall. Other / defer. Recommended: **KEEP (A only if a pharmacy asks for\ntablet kiosk)** — kiosk on a shared personal phone raises session/privacy\nquestions the grill has not settled (Issue #250: existing QR scanning\nunchanged unless separately approved). Severity: Medium. **Status:\nTRACED (STRUCTURE); Expo kiosk behaviour UNKNOWN, OPEN.**"}, {"id": "GM25-Q13", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q13 — Accessibility and text scaling: is 1.6× text a launch gate\nfor both clients?** Actual today (verified, PR #249 body + ledger):\nsigning off the three native reference screens at normal and **1.6× text**\nis listed as next work, not done. No web equivalent standard was found in\nthis trace. Options: KEEP — 1.6× sign-off for the three native screens only,\nweb unmeasured; A — Same bar both clients: reference screens at 1.6×\ntext on web and Expo before launch; B — 1.6× is post-launch polish on\nboth. Other / defer. Recommended: **A for the same three flows on web**\n(Post Shift, worker Shift/Offer, owner Shift Centre) — the flows are\nthe product; if they break at large text, the users who need large text\ncannot book or pay. Severity: Medium. **Status: TRACED (PR #249 body +\nledger); web standard UNKNOWN, OPEN.**"}, {"id": "GM25-Q14", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q14 — Error, retry, and crash UX: one standard across clients?**\nActual today (TRACED): Expo has branded root crash recovery UI\n(#249 `d36927af`), anonymous public-shift load-more retry preserving\nresults (#249 `79d294d`), Shift Centre Retry with scope-bound cache\ninvalidation (#249 `a7ad728e`), fail-closed pharmacy filters\n(#249 `d15304b0`). Web/Next equivalents were not inspected. Ledger\ninvariant: \"A failure is not empty\" — every network load has loading,\ncontent, empty and error with Retry. Options: KEEP — each client keeps\nits own error/retry behaviour; A — One standard: every list keeps its\nresults on error with retry; every failed write says what happened and\nwhat to do; no silent drops; crashes land on a branded recovery screen\non all surfaces. B — Expo standard only; web follows later. Other /\ndefer. Recommended: **A**. Severity: Medium-High (failed payment/\nacceptance retries are money). Edge cases: retry after payment\n(idempotency); retry after terms changed (409 `TERMS_CHANGED` — PR #249\nbody: reload, re-agree). **Status: TRACED (Expo, PR #249 body + ledger);\nweb UNKNOWN, OPEN.**"}, {"id": "GM25-Q15", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q15 — \"Coming soon\" policy: what may ship labelled coming-soon?**\nActual today (TRACED, V): placeholders confirmed at head (see Q05):\nHubPlaceholder, owner hub, pharmacist learning (L16), Explorer shifts\n(L17). Options: KEEP — placeholders may ship wherever they exist today;\nA — Nothing ships as \"coming soon\" in navigation; unbuilt features are\nabsent until built; B — \"Coming soon\" allowed only for non-core,\nnon-money features, clearly labelled, never taking input. Other / defer.\nRecommended: **B** — deleting everything unfinished is cleaner, but a\nlabelled hub teaser is honest marketing; a \"coming soon\" button that\naccepts a tap and does nothing is not. Severity: Medium. **Status:\nTRACED, OPEN.**"}, {"id": "GM25-Q16", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q16 — Web ↔ app install handoff: where does web send phone\nusers, and does the app link back?** Actual today (TRACED): landing_next\nhas `components/app-install-banner.tsx` and\n`shared/mobile-store-links.ts` (+ test) touched by #249; Expo has\n`app/welcome.tsx` and `app/index.tsx`. Store listing state, deep links,\nand whether a phone user on Vite web is pushed to the store are UNKNOWN.\nOptions: KEEP — banner + store links as they are; A — Defined handoff:\nweb detects phone → offers app, deep-links back to the same content;\napp links out to web for anything it cannot do (e.g. payment);\nB — No install prompts until Expo is launched (GM25-Q01 B). Other /\ndefer. Recommended: **B if GM25-Q01 = B; otherwise A**. Severity:\nMedium (a banner pointing at an unlaunched store is a dead end).\n**Status: TRACED (STRUCTURE); behaviour UNKNOWN, OPEN.**"}, {"id": "GM25-Q17", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q17 — Launch sign-off evidence: what proves each surface ready?**\nActual today (verified, PR #249 body + ledger): for Expo — no device\nscreenshots, no real SDK 58 builds, no authenticated real-backend\nacceptance, no store readiness; shared-core suite needs reverification\non latest head (447/1 on the handover head, test-only fix since);\nlatest CI unchecked; W3b exact-head CI must pass before W3b closes;\nSenior Package Testing not done. Web evidence standard was not found in\nthis trace. Options: KEEP — each surface ships on its existing CI (web) /\nPR review (Expo); A — One sign-off checklist per surface: exact-head CI\ngreen + authenticated staging acceptance on real devices (Expo) / real\nbrowsers (web) + the three reference screens at 1.6× + no known\nlaunch-gate code gap open; B — Owner sign-off on demo only. Other /\ndefer. Recommended: **A** — Issue #250's progress labels (NOT VERIFIED →\n… → WEB VERIFIED → EXPO VERIFIED → LAUNCH SIGNED OFF) require\nper-surface verification, not a single demo. Severity: launch-gate.\n**Status: TRACED (PR #249 body + ledger for Expo; web UNKNOWN), OPEN.**"}, {"id": "GM25-Q18", "area": "GM-25", "plat": "Web + Expo", "md": "**GM25-Q18 — Twin-drift prevention after launch: who owns parity?**\nActual today (TRACED, V): contract tests exist in places — landing_next\n`lib/public-route-contract.test.mjs` (read at head), `shared/mobile-store-links.test.mjs`\n(PR249 file list), shared-core domain tests. A twin-drift report exists\nwith an acceptance protocol (`VITE_NEXT_TWIN_DRIFT.md` — classify each\ntwin, assert routes/auth/error behaviour before removal) but its\nchecklist boxes are unchecked and no owner or process was found.\nPARITY_MATRIX.md (L1–L17) is itself a drift inventory with no owner.\nOptions: KEEP — no owner; drift found by users; A — Shared-core contract\n+ public-route contract tests are launch gates, and one named owner\nreviews every cross-client change for parity; B — Quarterly parity audit\nonly. Other / defer. Recommended: **A** — the #184 twins (TB-07,\nduplicate hooks, duplicate boards) were all born from unowned drift, and\nthis re-run found the `useTalentFeed` twins already diverged. Severity:\nMedium (prevents the next GM-25). **Status: TRACED, OPEN.**"}, {"id": "GM-25-OD-18", "area": "GM-25", "plat": "Web only", "md": "### GM-25-OD-18: Owner and organisation \"public\" and \"community\" shift boards: web pages with no menu links (OD-18, decisions-for-owner 26)\n**Platforms:** Web only\n**What happens today:** Web has these owner/organisation pages but no menu leads to them. Expo matches what web users can reach, so it has none.\n**Already implemented:** pr257\n**Recommendation:** Keep as today for launch; decide later whether to add menu links on both or remove the hidden web pages.\n**Other option:** Add menu links and Expo screens now.\n**Status:** OPEN, confirm or change."}, {"id": "GM-25-OD-19", "area": "GM-25", "plat": "Expo only", "md": "### GM-25-OD-19: iPhones older than iOS 16.4 cannot install the app (OD-19, decisions-for-owner 7)\n**Platforms:** Expo only\n**What happens today:** Expo SDK 58 needs iOS 16.4 or later (before: 15.1). iPhones stuck on older iOS (iPhone 6s/7 era) cannot install new versions. The only other way is staying on an old SDK, which has a known memory bug.\n**Already implemented:** pr257 (SDK 58)\n**Recommendation:** Accept.\n**Other option:** Stay on an older SDK.\n**Status:** OPEN, confirm or change."}, {"id": "GM-25-OD-20", "area": "GM-25", "plat": "Expo only", "md": "### GM-25-OD-20: App landing: no auto-rotating carousel; picking a persona preselects the role (OD-20, decisions-for-owner 14, 15)\n**Platforms:** Expo only\n**What happens today:** The app landing borrows the website's hero, persona chips and value strip, but not the auto-rotating persona carousel (it moves while you read on a phone). Tapping a persona preselects that role on Create account; the user can change it.\n**Already implemented:** pr257\n**Recommendation:** Keep.\n**Other option:** Add the rotating carousel.\n**Status:** OPEN, confirm or change."}, {"id": "GM-25-OD-21", "area": "GM-25", "plat": "Web + Expo", "md": "### GM-25-OD-21: Tab rows and stronger grey text (OD-21, decisions-for-owner 37, 39 (after your 38))\n**Platforms:** Web + Expo\n**What happens today:** Following your rule (no sideways swipe), I chose the look: a dropdown anchored to the pill, a soft violet fill and a check on the current choice. I also made the two grey text colours darker on mobile. Web was to get the same two greys as a small follow-up; not confirmed done.\n**Already implemented:** pr257 (mobile)\n**Recommendation:** Keep, and give web the same greys.\n**Other option:** Keep the old greys.\n**Status:** OPEN, confirm or change."}, {"id": "GM-25-OD-22", "area": "GM-25", "plat": "Web + Expo", "md": "### GM-25-OD-22: Error wording (OD-22, D25, D158/D163)\n**Platforms:** Web + Expo\n**What happens today:** Expo keeps web's wording \"Failed to escalate shift\". Raw server text such as \"No Pharmacy matches the given query.\" is replaced by friendly not-found copy in the shared error path, on both web and Expo.\n**Already implemented:** commits 172622e8 and cc5f2787\n**Recommendation:** Keep.\n**Other option:** Show the server's own text.\n**Status:** OPEN, confirm or change."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Sign up / login / email OTP | Vite handles registration (`frontend_web/src/pages/register.tsx:28`) and Next handles landing login (`frontend_web/landing_next/app/(public)/login/page.tsx:4`). | Mobile provides native email/password and OTP login screens (`frontend_mobile/app/login.tsx:143`). | Yes | |\n| Worker onboarding & credential verification | Pharmacist submits AHPRA and ID in multi-step wizard (`frontend_web/src/pages/onboarding/onboarding_pharmacist/PharmacistOnboardingV2Layout.tsx:20`). | Pharmacist completes credentials via profile basic info redirect (`frontend_mobile/app/pharmacist/onboarding.tsx:5`). | Yes | |\n| Owner / pharmacy onboarding & setup gate | Owner registers pharmacy details with setup checklist (`frontend_web/src/pages/onboarding/OwnerOnboarding.tsx:837`). | Owner completes pharmacy setup in native step wizard (`frontend_mobile/app/owner/onboarding/step1.tsx:1`). | Yes | |\n| Shift posting flow (single / multi-slot) | Owner creates shift via multi-step wizard (`frontend_web/src/pages/dashboard/sidebar/PostShiftPage.tsx:10`). | Owner creates shift with duplicate draft recovery and escalation settings (`frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:79`). | Yes | |\n| Public shift discovery (logged out) | Next renders landing board (`frontend_web/landing_next/app/(public)/shifts/public-board/page.tsx:5`) and Vite renders discovery page (`frontend_web/src/pages/PublicJobBoardPage.tsx:74`). | Native anonymous shift board renders public shift cards (`frontend_mobile/app/shifts/public-board.tsx:4`). | Yes | |\n| Shift offer negotiation and acceptance | Worker reviews offer terms and confirms booking reservation (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:468`). | Worker reviews offer and accepts with reservation prompt (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:356`). | Yes | |\n| Talent board discovery & booking request | Authenticated users search talent cards and request bookings (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/components/TalentCardV2.tsx:278`). | Mobile users browse candidate cards and submit booking proposals (`frontend_mobile/roles/shared/talent-board/components/AvailabilitySidebar.tsx:22`). | Yes | |\n| Goods & Ethical marketplace | Managed on Next web ; missing from Vite (`frontend_web/landing_next/app/(public)/marketplace/page.tsx:15`, `frontend_web/src/main.tsx`). | Supported natively in mobile marketplace screens (`frontend_mobile/features/parity/marketplace.tsx:31`). | Yes | Parity question: Marketplace operates on Next web and Expo, completely omitted from Vite web. |", "file": "areas/GM-25-web-next-expo-parity-ux.md"}, {"key": "GM-27", "row": "13", "title": "GM-27 Mobile-only flows", "qs": [{"id": "GM27-Q01", "area": "GM-27", "plat": "Expo only", "md": "### GM27-Q01 — Should unfinished shift posts also appear on the dashboard? (W-11)\n**Scenario:** Tom's phone closes while he posts Saturday's shift. In one case he has not seen a result. In another, the shift was created but a later edit failed.\n**What happens today:** With no saved result ID, the next submit retries the original payload with its saved key. With a saved recovery result ID, reopening Post Shift prefills the form and explains that his changes did not save. The server can replay the original result without creating another shift (`pr257:frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:686`, `:1393`, `pr257:backend/shifts/base.py:177`).\n**Recommendation first: KEEP.** Keep both recovery paths in Post Shift.\n- **KEEP (recommended):** Tom opens Post Shift to resume. An unresolved create uses the saved payload and key. A saved edit resumes on the existing shift.\n- **A:** Tom sees a Continue link on the dashboard. It opens the appropriate recovery path with the same safeguards.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM27-Q02", "area": "GM-27", "plat": "Expo only", "md": "### GM27-Q02 — How long may the phone keep Sara's confirmed shifts for offline use?\n**Scenario:** Sara uses the shared phone in Tom's dispensary to check her next shifts, then signs out. Ali signs in on the same phone.\n**What happens today:** Sara's last confirmed list stays on the device with no expiry. It is stored under her account ID, so Ali does not see it in the app.\n**Recommendation first: A.** Give Sara up to 14 days of offline access. Engineering: see BL-05 for clearing the cache at sign-out.\n- **A (recommended):** Sara's offline copy lasts up to 14 days or until sign-out.\n- **B:** Each shift stays until its end time or sign-out.\n- **C:** Sara sees confirmed shifts only after a live refresh.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM27-Q03", "area": "GM-27", "plat": "Expo only", "md": "### GM27-Q03 — Should app lock stay off by default?\n**Scenario:** Lina opens payroll, then switches to another app. She hands the phone to Tom a minute later. He returns to ChemistTasker.\n**What happens today:** The return lock is off by default. If Lina enables it, the default delay is 60 seconds while the app is inactive or in the background. An idle app left on screen has no foreground countdown (`pr257:frontend_mobile/components/security/AppLockGate.tsx:172`).\n**Recommendation first: A.** Prompt owners and admins once when they first sign in. Let workers opt in from Settings.\n- **A (recommended):** Lina gets a prompt and can enable the return lock or skip it.\n- **KEEP:** Lina and other users turn it on themselves in Settings.\n- **B:** The return lock starts on for everyone with a supported device lock.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM27-Q04", "area": "GM-27", "plat": "Web + Expo", "md": "### GM27-Q04 — Which workspace opens when someone has more than one role?\n**Scenario:** Grace is a region admin who also works as a pharmacist. Tom owns one pharmacy and manages Nadia's. Each leaves a secondary workspace, then opens the app later.\n**What happens today:** With a restored session, organisation access can route Grace to the organisation dashboard and an owner goes to setup or the owner dashboard. Other eligible users can resume a saved staff or admin persona. Fresh sign-in resets the persona. Mobile verification, required owner setup and approved return links can take priority (`pr257:frontend_mobile/app/login.tsx:71`, `pr257:frontend_mobile/app/index.tsx:24`, `pr257:frontend_mobile/utils/mobilePersona.ts:117`).\n**Recommendation first: A.** Remember the last eligible workspace for Grace and Tom too. Keep the existing verification, setup and return-link priorities.\n- **A (recommended):** Grace and Tom return to their last eligible workspace when opening the app or signing in again. First use or a lost role takes them to their default.\n- **KEEP:** Grace and Tom follow today's role routing. Fresh sign-in resets the persona.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM27-Q05", "area": "GM-27", "plat": "Expo only", "md": "### GM27-Q05 — Should an invitation from a worker's QR be single-use?\n**Scenario:** Tom scans Sara's worker QR at a CPD event and taps “Invite to my pharmacy”.\n**What happens today:** Sara must have a currently public worker listing. With staff-management permission, Tom can share a reusable 14-day link. Any eligible recipient can apply through it. The pharmacy still approves each application (`pr257:frontend_mobile/features/share/InviteFromWorkerQr.tsx:44`, `:89`, `pr257:backend/memberships/views.py:252`).\n**Recommendation first: A.** Make that link single-use for Sara. Keep pharmacy approval.\n- **A (recommended):** Sara alone can use the link to submit one application within seven days. Tom's pharmacy still approves it.\n- **KEEP:** Sara or another eligible recipient can apply during the 14-day window. The pharmacy approves each application.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM27-Q06", "area": "GM-27", "plat": "Expo only", "md": "### GM27-Q06 — Can Sara use calendar and map links from a cached shift?\n**Scenario:** Sara opens My next shifts on her phone. The booking cannot be re-verified. The saved list shows a shift at Tom's pharmacy this afternoon.\n**What happens today:** The app warns Sara that the saved booking may have changed. She can still open the Google Calendar editor and, if the address is saved, Google Maps. The calendar draft calls it a confirmed shift (`pr257:frontend_mobile/app/next-shifts.tsx:133`, `pr257:frontend_mobile/features/nextShift/nextShiftModel.ts:90`).\n**Recommendation first: A.** Keep the saved list readable. Require a live confirmation before sharing the details with Calendar or Maps.\n- **A (recommended):** Sara can read the saved details. Calendar and directions become available after the booking is re-verified.\n- **B:** Sara can use both links from cached data after acknowledging that it may be stale. The calendar draft identifies the details as unverified.\n- **KEEP:** Sara can use the existing links from the cached card with its current warning.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM27-Q07", "area": "GM-27", "plat": "Expo only", "md": "### GM27-Q07 — Should public QR contacts sync and when should private invitation codes clear?\n**Scenario:** Tom saves Sara's public contact on a shared dispensary phone and wants it on his own phone. Mia saves a private pharmacy invitation code on the shared phone before signing out.\n**What happens today:** Public contacts are saved in AsyncStorage and sync to the account when saved online. Offline drafts can be synced manually. Up to five invitation codes are kept in device-only SecureStore. The saved list has no age or sign-out limit for those codes (`pr257:frontend_mobile/app/share/saved.tsx:77`, `pr257:frontend_mobile/features/share/savedContacts.ts:85`).\n**Recommendation first: A and C.** Keep online sync for public contacts and clear private codes at sign-out or link expiry.\n- **A (recommended, public contacts):** Tom's public contacts appear on his other phone after online save. He chooses when to sync offline drafts.\n- **B (public contacts):** Tom chooses whether to sync each contact. Otherwise it stays on the original phone.\n- **C (recommended, private codes):** Mia's saved invitation disappears at sign-out or link expiry, whichever comes first.\n- **D (private codes):** Mia gets the saved invitation back when she signs in on the same phone. The app keeps it until she removes it or it is displaced by newer codes.\n- **DEFER**\n\n**Status:** OPEN. Choose one public-contact outcome and one private-code outcome."}, {"id": "GM-27-OD-01", "area": "GM-27", "plat": "Expo only", "md": "### GM-27-OD-01: Opening the app with no network keeps you signed in (OD-01, D161/D174)\n**Platforms:** Expo only\n**What happens today:** Before the fix, a cold start with no network signed the user out and deleted the saved sign-in. Now the app keeps the saved session, shows saved data, and checks the account again the next time the app comes to the front. It signs out only when the server refuses the session.\n**Already implemented:** commit 172622e8, `frontend_mobile/context/AuthContext.tsx`\n**Recommendation:** Keep.\n**Other option:** Sign out on any failed check (safer on a lost phone, but locks out workers with weak signal).\n**Status:** OPEN, confirm or change."}, {"id": "GM-27-OD-02", "area": "GM-27", "plat": "Expo only", "md": "### GM-27-OD-02: A saved, unsent change that the phone cannot read is never overwritten silently (OD-02, D99/D131)\n**Platforms:** Expo only\n**What happens today:** If a change saved for resending is unreadable, the app blocks a new attempt and offers \"Discard saved change\" or \"Clear unreadable saved change\".\n**Already implemented:** `frontend_mobile/features/parity/marketplace.tsx:518` and the shared saved-request store\n**Recommendation:** Keep, including the wording.\n**Other option:** Discard it automatically without asking.\n**Status:** OPEN, confirm or change."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Post-shift draft recovery and idempotency | Web lacks offline draft recovery and auto-retry on reload (`frontend_web/src/pages/dashboard/sidebar/PostShiftPage.tsx:10`). | Interrupted shift creation restores payload and replays submission key (`frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:686`). | Expo only | Intended: Mobile app provides offline form preservation and idempotent crash recovery. |\n| Offline access to confirmed upcoming shifts | Active shifts view requires live network connection (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/index.tsx`). | Confirmed shifts cached in AsyncStorage display when offline (`frontend_mobile/app/next-shifts.tsx:83`). | Expo only | Intended: Mobile provides persistent offline shift access for workers in low-connectivity dispensaries. |\n| External calendar and map intent launch | Shift cards do not provide direct external map/calendar intent buttons (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/index.tsx`). | One-tap button opens Google Calendar editor or Google Maps directions (`frontend_mobile/app/next-shifts.tsx:133`). | Expo only | Intended: Mobile leverages native device URL schemes for navigation and scheduling. |\n| App lock / biometric return protection | Web has no client-side inactivity lock or biometric gate (`frontend_web/src/App.tsx`). | Configurable app lock protects screen after 60s background delay (`frontend_mobile/components/security/AppLockGate.tsx:172`). | Expo only | Intended: Mobile app provides device PIN/biometric privacy protection for shared dispensary devices. |\n| Multi-role workspace switching and session restore | Role switching handled via layout dropdown and URL routes (`frontend_web/src/layouts/WorkspaceSwitcher.tsx:11`). | Worker or manager switches workspace from the switcher in the app shell (`frontend_mobile/components/shell/WorkspaceSwitch.tsx:63`). | Yes | Parity question: Expo persists and restores persona state locally, while web relies on session cookies and route prefixes. |\n| Worker QR contact invitation and scanning | Profile generates public profile URL without camera scanner (`frontend_web/src/pages/PublicTalentBoardPage.tsx`). | Owner scans worker QR to generate 14-day invitation link (`frontend_mobile/features/share/InviteFromWorkerQr.tsx:44`). | Expo only | Intended: Mobile app uses camera hardware to scan worker contact QRs. |", "file": "areas/GM-27-mobile-only-flows.md"}, {"key": "GM-26", "row": "14", "title": "GM-26 Admin/privacy/security/release", "qs": [{"id": "GM26-Q37", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q37 — [P0 · decision] Who is a platform admin, how do they get the power, and what can they do that nobody else can?\n- **ACTUAL TODAY (V, at head):** There is **no `platform_admin` role** — 0 hits in every permission/access file read directly at head, and 0 hits repo-wide. Platform administration = Django `is_staff` / `is_superuser`, granted through Django's user management (creation sets both flags, `backend/users/models.py:19–29`). Powers evidenced: staff/superuser bypass in membership access (`memberships/access.py:17`); superuser bypass in workforce permissions (`workforce/permissions.py:6`); superuser-only kiosk gate (`attendance/kiosk_api.py:112`); superuser branch in attendance credentials (`credentials.py:88`); Django admin per-app registrations (10 apps + billing), including billing reconciliation (`FulfillmentCheckoutAdmin.mark_expired_after_reconciliation`, permission `reconcile`). **No in-product platform-admin console exists** in Vite/Next/Expo — `/admin` on both clients is the pharmacy-admin persona, not platform administration. How a person *gets* staff/superuser (who grants it, two-person rule, shared accounts) is **not documented anywhere found** — no grant process was evidenced.\n- **RECOMMENDED:** Name the role explicitly: platform admin = a named person granted Django staff/superuser through a documented, two-person process; list every power (refund/credit approval, sanction, suspension, dispute review, data deletion, AHPRA override) in one permission matrix; no shared admin accounts; every admin action logged with actor, time, reason and before/after.\n- **ALTERNATIVE A:** Keep Django-admin-only (no in-product admin screens at launch; support works in Django admin). **ALTERNATIVE B:** Build a minimal in-product admin console (users, disputes, refunds, sanctions) before launch. **ALTERNATIVE C:** Outsource first-line support/admin to a named external party with scoped access.\n- **Edge / denial:** A pharmacy manager must never gain admin powers by role confusion (cf. PR #200 B62 Region Admin mismatch); a staff account that is deactivated must lose access immediately; concurrent admin edits to the same dispute must not overwrite each other.\n- **Status:** TRACED (V). **Re-validated at:** `backend/users/models.py`, `backend/memberships/access.py`, `backend/workforce/permissions.py`, `backend/attendance/kiosk_api.py`, `backend/attendance/credentials.py`, `backend/billing/admin.py` at refs/pull/249/head."}, {"id": "GM26-Q38", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q38 — [P1 · decision] What is the audit trail for admin actions, and who can read it?\n- **ACTUAL TODAY (V, absence confirmed):** Repo-scoped search `audit_log`: **0 hits**. No app-level audit-logging code was found anywhere in the repo. Django admin's built-in `LogEntry` was not verified in this repo. Oct 2026 text implies refunds/sanctions/disputes have no workflow at all, so there is currently nothing to audit — and no log to prove anything with. The deletion flow does write `deleted_at` and revokes sessions/tokens, but that is a state change, not an audit trail (no actor/reason/before-after record).\n- **RECOMMENDED:** Every admin action (sanction, suspension, refund, credit, dispute decision, deletion, AHPRA override, terms change) writes an immutable log entry (actor, target, reason, timestamp, before/after); the log is readable by platform admins and, on request, by the affected user for their own case.\n- **ALTERNATIVES:** A — Django admin history only. B — Dedicated append-only audit table + admin viewer. C — No audit log at launch (accept the risk; disputes become unprovable).\n- **Status:** TRACED (absence — V)."}, {"id": "GM26-Q39", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q39 — [P1 · decision] What personal data is shown to whom — the full data-sharing map?\n- **ACTUAL TODAY (partly traced, V + A18):** Known leaks/exposures now evidenced at head: talent names leak to any signed-in user (Q01–Q04, A18); pricing preview lets any authenticated caller derive a pharmacy's guide rates (Q45/B65, permission half confirmed); kiosk codes and PIN OTPs persist in notifications readable via the per-user notification API, WebSocket and push (Q44/B64, V); internal-roster ratings feed the public talent-board average (Q27, A18); availability is private to the worker, pharmacies see copied talent-post dates (O). **Never traced end to end:** chat, hubs, kiosk, emails, invoices, payroll exports — the full field × viewer-role × client map does not exist.\n- **RECOMMENDED:** Publish one data-sharing map (field × viewer role × client) as a launch document; every new field added later must state its viewers before it ships.\n- **ALTERNATIVES:** A — Map it now, fix leaks before launch. B — Fix the known talent leak only; map the rest after launch. C — No map; rely on per-screen judgement.\n- **Status:** PARTLY TRACED — full map UNKNOWN; needs a field-by-field trace of serializers + clients."}, {"id": "GM26-Q40", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q40 — [P1 · decision] Account deletion: what is deleted, what is kept (and why), and how long does it take?\n- **ACTUAL TODAY (V, traced at head):** `DeleteAccountView.delete` (`backend/users/api_account.py`): authenticated user, idempotent if already `deleted_at`. In one transaction: `_anonymize_user` (sets `is_active=False`, `deleted_at=now`, unusable password, email → `deleted+{id}@chemisttasker.invalid`, clears first/last name, mobile number, OTP code/timestamps, `is_mobile_verified=False`; **deletes talent posts via `user_features().delete_talent_posts(user)`**), deletes device tokens + WS tickets, revokes sessions/tokens, deletes verification-doc files (`_delete_verification_docs_for_user`: clears `government_id`, `identity_secondary_file`, `government_id_type`, `identity_meta` on all four onboarding models and deletes the stored objects on commit). Then sends the `account_deleted` email. The Vite deletion page states: immediate deactivation and sign-in blocked; verification documents removed within 7 days; shift history, invoices and audit logs retained \"without personal identifiers where possible\". **No grace period exists** — anonymization is immediate. **NOT traced:** availability rows, chat messages, ratings, memberships on deletion; admin-initiated deletion; re-registration with the same email; whether `delete_user_posts` in `talent/account_cleanup.py` is the function the feature port calls (likely path, not confirmed).\n- **RECOMMENDED:** Soft-delete with a stated grace period (e.g. 30 days), then hard-delete personal data; retain only what law requires (tax/invoice records, AHPRA audit result — not ID images) with a named retention per class (see Q06); confirm by email; deletion must cascade to talent posts, availability, chat history handling, and notification records — or state explicitly what survives and why. (Note: the code currently deletes immediately with no grace — the recommendation is a change, not a description.)\n- **ALTERNATIVE A:** Immediate hard delete (simplest; destroys dispute/audit evidence). **B:** Soft-delete only, never hard-delete (APP 11 risk). **C:** Manual support-handled deletion at launch.\n- **Edge:** A worker with a live booking or an open dispute deletes their account mid-case; a pharmacy deletes while owing a booking fee; a deleted user re-registers with the same email.\n- **Status:** TRACED (V). **Re-validated at:** `backend/users/api_account.py`, `backend/users/account_deletion.py`, `backend/talent/account_cleanup.py`, `frontend_web/src/pages/AccountDeletionPage.tsx` at refs/pull/249/head."}, {"id": "GM26-Q41", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q41 — [P1 · decision] Privacy policy / terms: are they APP-compliant, versioned, and shown on Expo as well as web?\n- **ACTUAL TODAY (V, traced at head):** Pages exist on Vite and Next (`PrivacyPolicyPage.tsx` eff. 15 Jan 2026; `TermsOfServicePage.tsx` eff. 15 June 2025; Next app-router pages are thin wrappers rendering the migrated copies via `PublicEntry`). **Vite vs Next-migrated privacy bodies are byte-identical in substance** (diff is shell/SEO only: `PublicLogoTopBar`+`Container` vs `LegalDocumentShell`, different social image) — the twin-drift doc correctly lists the file as divergent, but the divergence is presentation, not policy text. **Gaps:** no version numbers (effective dates only); **no APP citations** in the policy text (grep found no \"APP\" references); retention section is vague (see Q06); policy changes are announced only by \"a revised effective date\"; **acceptance logging not evidenced** — the register flow requires `accepted_terms` (GM-01), but versioned acceptance (which terms version, when, by whom) is not evidenced, and D2 (immutable terms snapshot) is OPEN per the ledger. **Expo parity UNKNOWN** — whether Expo links/shows the same documents was not verified (Expo `welcome.tsx` / `register.tsx` matched the `privacy` search in the blocked trace; content not inspected).\n- **RECOMMENDED:** One versioned policy + terms set, identical substance on Vite, Next and Expo; acceptance logged with version + timestamp for both sides (worker and pharmacy — see Q32); material changes trigger re-acceptance; the collection notice (APP 5) is shown at sign-up, not buried.\n- **ALTERNATIVES:** A — Web only at launch; Expo links out to web. B — Same documents in-app on all three clients. C — Launch with the current pages as-is (content unreviewed).\n- **Status:** TRACED (V, web) — Expo UNKNOWN; APP-compliance review NOT done (needs qualified review, not a code trace)."}, {"id": "GM26-Q42", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q42 — [P0 · security, decision + code gap] Secrets, DEBUG and ALLOWED_HOSTS: what is the production configuration, and who can see it?\n- **ACTUAL TODAY (V, `backend/core/settings.py` at head, 723 lines):** `SECRET_KEY = env('SECRET_KEY')` (`:23`) — env-only, no committed default. `DEBUG = env.bool(\"DEBUG\", default=False)` (`:26`) — safe default. `ALLOWED_HOSTS = env.list(\"ALLOWED_HOSTS\", default=[\"localhost\", \"127.0.0.1\"])` (`:28`) — **but `if DEBUG: … ALLOWED_HOSTS = [\"*\"]`** (`:86–89`), with dev CORS/CSRF origins widened alongside. `STRIPE_SECRET_KEY = env('STRIPE_SECRET_KEY', default='')` (`:671`). `MOBILE_OTP_DISPLAY_IN_APP` is code-gated (`:655–657`): `env.bool(...) and APP_ENV in {local, dev, development, test, staging}` — cannot be on in production via the default (GM-01 senior-review correction). `AHPRA_SOURCE` default `scrapingbee` (`:642`). Non-production `APP_ENV` values raise unless `DJANGO_CACHE_URL` is set (`:197`). **What the repo cannot show:** the actual production env values — whether production really runs `DEBUG=False` with a real `SECRET_KEY` and a host allow-list is UNKNOWN and needs a deploy-time check, not a code read. No committed secrets were found in the files read (no `.env` was read; none was sought — see Q43 note).\n- **RECOMMENDED:** `SECRET_KEY`, Stripe keys, email credentials and AHPRA lookup credentials come from the deployment environment / secret store only — never committed; `DEBUG=False` in production; `ALLOWED_HOSTS` lists only the real hosts; a pre-deploy checklist asserts all three and fails the deploy otherwise.\n- **ALTERNATIVES:** A — Env/secret-store only (recommended). B — Committed defaults with production overrides (risky; one missed override exposes DEBUG). C — Defer to first deploy review (not recommended for a product handling ID documents).\n- **Status:** TRACED (V — repo side). Production values UNKNOWN."}, {"id": "GM26-Q43", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q43 — [P1 · security, decision] Has anyone pentested this, and what is the vulnerability-handling process?\n- **ACTUAL TODAY:** UNKNOWN — no pentest, security review, or vulnerability-disclosure process evidenced in fetched material. PR #200 is a code audit (not a pentest) and is explicitly NOT a production exploit proof. WAVE_13 is semantic source review with no HTTP execution. No dependency-scanning evidence was found in the fetched material (CI workflows were not read in this re-run).\n- **RECOMMENDED:** Before handling real ID/bank/AHPRA data at scale: an authenticated security review of the public API surface (auth, tenant isolation, IDOR on talent/shift/invoice reads, Stripe webhook verification); a named security contact and a 90-day fix SLA for critical findings; dependency scanning in CI.\n- **ALTERNATIVES:** A — Full external pentest before launch. B — Internal authenticated review + dependency scanning at launch; external pentest within 3 months. C — No security review (accept the risk).\n- **Status:** UNKNOWN."}, {"id": "GM26-Q44", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q44 — [P1 · security, code gap] Kiosk codes and worker PIN OTPs in notifications (PR #200 B64)\n- **ACTUAL TODAY (V — CONFIRMED PRESENT at head, upgraded from audit candidate):** `backend/attendance/credentials.py:345–362` — the manager pairing code is placed verbatim in the notification **body** (\"Your single-use pairing code for {pharmacy} is {code}. Valid for 15 minutes.\") **and** `payload.pairing_code`, plus a `kiosk_link_route` containing the code (`/kiosk-link?source=kiosk&pharmacy_id=…&pairing_code={code}`). `credentials.py:881–889` — the worker PIN setup OTP is likewise placed in the notification **body** (\"Your verification code to set your counter PIN is {otp_code}.\") **and** `payload={\"otp\": otp_code, \"pharmacy_id\": …}`. Both go through `notify_users` (Expo push + WebSocket + durable DB in-app notification). Per WAVE_13, `Notification` stores body and JSON payload without expiry, the serializer exposes both through the per-user authenticated REST endpoint, WebSocket consumers forward them unchanged, and the Expo notification screen consumes that content. Code expiry still guards redemption — the code cannot be *used* after expiry — but it remains *readable* in notification history, on previously registered devices, and on existing sockets. Existing test `test_kiosk_pairing_code.py:143–170` explicitly asserts the raw pairing code in a durable notification, so fixing this is an intentional test change requiring product policy.\n- **RECOMMENDED:** Secrets must never persist in notification records or logs; kiosk codes and PIN OTPs are single-use, short-lived, and shown only on the device/session that requested them; rotation on suspected exposure.\n- **ALTERNATIVES:** A — Remove secrets from notifications entirely (show \"code ready — open the app\"). B — Keep, but expire notification records within minutes and exclude them from history APIs. C — Defer (accept the exposure).\n- **Edge:** A shared tablet shows a notification with a live kiosk code; a worker's phone is lost with notification history intact.\n- **Status:** CONFIRMED PRESENT (V). **Source:** PR #200 B64; WAVE_13; `backend/attendance/credentials.py:345–362, 881–889` at refs/pull/249/head."}, {"id": "GM26-Q45", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q45 — [P1 · security, code gap] Region Admin cross-tenant shift actions; native pairing-code downgrade; pricing-preview leakage (PR #200 B62/B63/B65)\n- **ACTUAL TODAY (V — adjudicated at source level at head; no runtime tests run):**\n  - **B62 — CHANGED.** At frozen main `b77e9fd2…` (WAVE_13), `organizations.access.user_can_manage_pharmacy` granted any assigned `REGION_ADMIN` regardless of `admin_level`, while `managed_pharmacies` omitted all region-admin scopes. At head `97c4543e…` the function has been rewritten: \"A Region Admin's M2M assignment alone cannot grant roster authority. Workforce remains the sole capability/organization boundary.\" — it delegates to `pharmacy_features().can_manage_roster_pharmacy(user, pharmacy)` (`organizations/access.py:163–173`); `managed_pharmacies` (`:175–219`) now includes a REGION_ADMIN only if `OrgCapability.MANAGE_ROSTER in membership_capabilities(membership)`. The broad grant is gone from this function. **Residual:** the docstring (\"a chief/region admin assigned to it\") is stale; `can_manage_roster_pharmacy`'s implementation was NOT read; **no negative test has been run** — the WAVE_13 negative test (communication-only Region Admin must be denied POST `/api/v1/shifts/`, accept-user, manual-assign, templates, PATCH) still needs executing.\n  - **B63 — CONFIRMED PRESENT.** `redeem_kiosk_pairing_code` (`credentials.py:370–468` at head): `native` is decided solely by the caller-supplied `platform` string; Ed25519 proof is required only when native; `allowed_client_kind` is checked **only if native**; a non-native redemption stores `client_kind=\"WEB_ONLINE\"`. A caller with a valid code may redeem a NATIVE_OFFLINE authorization as WEB_ONLINE without proof. Caveat (WAVE_13): the six-digit code is still required, securely generated, single-use and globally rate-limited; legacy/web redemption is explicitly expected by `test_kiosk_pairing_code.py:186–213`. Conditional policy mismatch only if native-offline authorizations are intended to be native-only.\n  - **B65 — CONFIRMED (permission half); pricing half per WAVE_13.** `BaseShiftViewSet.check_permissions` (`shifts/base.py:129–138` at head) explicitly exempts `calculate_rates` from the manage-pharmacy requirement (only `IsAuthenticated`, `:115`). Per WAVE_13, the calculator accepts arbitrary `pharmacyId`, loads the real `Pharmacy`, and returns computed rates from its persisted defaults — a signed-in unrelated account may probe guide rates. `lifecycle.py` / `pricing.py` were NOT re-read at head. Caveat: whether pharmacy default guide rates are private is product policy; if public, record an accepted-design verdict.\n- **RECOMMENDED:** Each candidate gets a yes/no adjudication with a negative test (wrong-tenant Region Admin denied; downgraded pairing rejected; pricing preview returns only the caller's scope) before launch; any confirmed one is a launch blocker. (B62's negative test is still required despite the mechanism change; B63/B64 are confirmed present and need the policy decision + fix.)\n- **ALTERNATIVES:** A — Adjudicate all three before launch (recommended). B — Adjudicate B62 only; defer B63/B65. C — Accept as candidates without testing.\n- **Status:** B62 CHANGED (V, mechanism) / B63 CONFIRMED (V) / B65 CONFIRMED permission-half (V), pricing-half WAVE_13 only."}, {"id": "GM26-Q46", "area": "GM-26", "plat": "Web + Expo", "md": "#### GM26-Q46 — [P1 · release, decision] Staging, migration rehearsal and rollback: what is the deploy path to production?\n- **ACTUAL TODAY (V, docs at head):** PR #249: no merge/deploy performed; staging boards failing / NXDOMAIN in Nov 2026 checks (from memory — not re-checked this session). `PUBLIC-CONTENT-IMPLEMENTATION.md` lists as **outstanding rollout gates**: restore deployed migration source files, rehearse clean/staging migrations, verify end-to-end authentication/payment/mobile regressions and actual email delivery, then enable production routing and public reads. `docs/qa/RELEASE_DECISIONS_20261102.md` (read at head) lists staging steps: back up the database first, then apply migrations (attendance 0007, billing 0005); record the deployed SHA and rollback artefact; run test-mode provider acceptance for checkout recovery, replay and refunds. **No evidence was found that any rehearsal, rollback test, or staging deploy from the exact launch head has happened.** The mobile ledger: Senior Package Testing (exact-head Docker/PG/web/mobile acceptance, native physical devices, staging-only provider proof, EAS binary and rollback) not done. Migration baseline: `backend/users/migrations/0001_squashed_baseline.py` exists (referenced in blocked trace; not re-read).\n- **RECOMMENDED:** Before launch: a staging deploy from the exact launch head with boards loading; a migration rehearsal on a staging copy (including the squashed baseline); a tested rollback (code + migration) and a named deploy owner; no production data touched by Grill work (per Issue #250 scope freeze).\n- **ALTERNATIVES:** A — Full rehearsal before launch. B — Deploy to staging only; rehearse migration the week before launch. C — No rehearsal (deploy and hope).\n- **Status:** TRACED (V — docs); live staging check still needed by an agent with browser/deploy access (this subagent cannot do it)."}, {"id": "GM-26-W01", "area": "GM-26", "plat": "Web only", "md": "### GM-26-W01: Production reCAPTCHA keys (W-05, D167): owner action, not a choice\n**Scenario:** Sara registers on the web on launch day; Jack registers in the phone app.\n**What happens today:** Vite, Next and Expo registration use reCAPTCHA. O4 row A15 was skipped because the local rig had no keys.\n**Owner action:** Set `VITE_RECAPTCHA_SITE_KEY` for Vite, `NEXT_PUBLIC_RECAPTCHA_SITE_KEY` for Next, `EXPO_PUBLIC_RECAPTCHA_SITE_KEY` for Expo, and `RECAPTCHA_SECRET_KEY` on the backend. Run staging registration on all three clients. See GM01-Q14 for the separate sign-in choice. Evidence: `pr257:frontend_web/src/pages/register.tsx:58`, `main:frontend_web/landing_next/migrated/pages/register.tsx:58`, `pr257:frontend_mobile/app/register.tsx:108`, `pr257:backend/core/settings.py:641`.\n**Status:** OWNER ACTION (production checklist)"}, {"id": "GM-26-W02", "area": "GM-26", "plat": "Web + Expo", "md": "### GM-26-W02: Dependabot pull requests (W-09, D11)\n**Scenario:** Tom chooses which dependency updates to merge before launch.\n**What happens today:** The 21 Nov 2026 inventory recorded 30 open Dependabot PRs. The 11 Nov D11 review recommends merging #243 first, then #244 after lint and visual checks, and merging #265. It recommends holding #263 and #264 for a combined CodeQL change and closing #266 because SDK 58 supersedes it. #212 is in the waiting list with no recorded D11 verdict. #207, #206, #178, #177, #174, #90 and the older #60–#78 group also still need triage.\n**Recommendation first: A.** Follow D11. Review #212 and the remaining action bumps in one batch. Confirm which older updates SDK 58 supersedes before closing them.\n- **A (recommended):** Tom merges the D11 updates in order and keeps #212 pending until reviewed with the remaining dependency changes.\n- **B:** Tom gets a separate review for every remaining PR, including #212, before launch.\n- **DEFER:** Tom decides after launch.\n\n**Status:** OPEN (the owner merges; agents merge nothing)"}, {"id": "GM-26-W03", "area": "GM-26", "plat": "Web + Expo", "md": "### GM-26-W03: Keep the node-forge 1.4.1 RSA patch? (W-14, register item 6)\n**What happens today:** The patch and its regression are present (`pr257:frontend_mobile/scripts/dependency-security.test.cjs:486`). Release register item 6 reports that clean, unpatched node-forge 1.4.1 passed the regression and that the patch was kept as defence in depth (`main:docs/qa/RELEASE_DECISIONS_20261102.md:14`).\n**Recommendation first: KEEP** until the next node-forge release, then drop it. Technical sign-off, low risk either way.\n**Status:** OPEN (technical sign-off)"}, {"id": "GM-26-W04", "area": "GM-26", "plat": "Web + Expo", "md": "### GM-26-W04: When does the minimatch 3.1.5 exception (GHSA-g3hv-75wg-m249) end? (W-14, register item 9)\n**What happens today:** the gate accepts only the fingerprinted root copy, which lacks the vulnerable function.\n**Recommendation first:** remove it when Expo / React Native leave glob 7 or the advisory range is corrected; re-check at every Expo SDK upgrade. Technical sign-off.\n**Status:** OPEN (technical sign-off)"}, {"id": "GM-26-OD-23", "area": "GM-26", "plat": "Web + Expo", "md": "### GM-26-OD-23: Resend-protection records are kept forever (OD-23, D68)\n**Platforms:** Web + Expo\n**What happens today:** To stop duplicates, the server keeps a small record for each protected request (shift posts, marketplace and ethical-marketplace saves, talent pitches). There is no clean-up job.\n**Already implemented:** pr257, `backend/shifts/models.py:892`, `backend/marketplace/models.py:321`, `backend/ethical_marketplace/models.py:320`\n**Recommendation:** Keep at launch; add a clean-up later (for example after 12 months).\n**Other option:** Delete them after a set time from launch.\n**Status:** OPEN, confirm or change."}, {"id": "GM-26-OD-24", "area": "GM-26", "plat": "Web + Expo", "md": "### GM-26-OD-24: Three small risks I accepted (OD-24, D103, D115, D137)\n**Platforms:** Web + Expo\n**What happens today:** (a) After switching accounts, the app may still read public data without signing in (no identity crosses). (b) The explorer-admin guard trusts the stored role, which matters only if a role changes to or from Explorer (you said that never happens, D93). (c) A counter-offer resend fails with an error if the worker's onboarding record was deleted in between.\n**Already implemented:** pr257\n**Recommendation:** Accept all three.\n**Other option:** Reopen any of them as work.\n**Status:** OPEN, confirm or change."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Platform admin access | Accessible only via backend `/admin` Django interface . Vite has no platform admin console (`backend/core/urls.py:40`, `frontend_web/src/main.tsx:87`). | Mobile app has no platform admin console; `/admin` is pharmacy manager (`frontend_mobile/app/admin`). | Yes | Intended: Platform administration is restricted to secure Django admin. |\n| Talent board anonymous candidate unmasking | Authenticated talent board exposes author names and IDs for anonymous posts (`backend/talent/serializers/explorer.py:131`, `backend/talent/serializers/explorer.py:250`). | Authenticated mobile talent board displays same author identity pre-consent (`backend/talent/serializers/explorer.py:131`). | Yes | Server-side leak (BL-08): both clients show what these serializers return. |\n| Anonymous pharmacy public shift posting | Redacts pharmacy name and street address on public card (`frontend_web/src/pages/PublicJobBoardPage.tsx:142`). | Redacts pharmacy contact info on public shift card (`frontend_mobile/roles/shared/shifts/AnonymousShiftBoardScreen.tsx:45`). | Yes | |\n| User account deletion & data anonymization | User triggers deletion in account settings with soft-delete anonymization (`frontend_web/src/components/AccountDeletionSection.tsx:49`). | User triggers account deletion in mobile profile settings (`frontend_mobile/roles/pharmacist/profile.tsx:206`). | Yes | |\n| AHPRA suspension booking revocation | Backend revokes bookings; web displays cancellation banner (`backend/shifts/cancellation.py:74`). | Backend revokes bookings; mobile displays shift status change (`backend/shifts/cancellation.py:74`). | Yes | |\n| Kiosk pairing code security in notifications | Pairing code generated and displayed on kiosk page (`frontend_web/src/pages/attendance/KioskPage.tsx:385`). | Mobile receives pairing code in push notification payload (`backend/attendance/credentials.py:347-356`). | Yes | Verified 21 Nov: confirmed. The code is put in the notification title/body and payload (`backend/attendance/credentials.py:347-356`), and `notify_users` also attempts push, so it can show on a lock screen. Backlog BL-25. |", "file": "areas/GM-26-admin-privacy-security-release.md"}], "bg": {"decided": "## 1. Already decided: never re-asked\n\n| Source | Decisions |\n|---|---|\n| Carried owner decisions (30, launch grill `questions.json`) | D01-D05, R01, R04, R04A-R04D, R06, E01, E01A, E01B, E03, P02, P04-P12, FEES, F01, F04, NOPEN |\n| Launch grill answers (artifact `answers`, 23 Oct) | ON-Q01 **KEEP**, ON-Q02 **KEEP** (re-confirm once at GM01-Q04 with the corrected baseline), ON-Q03 **B** (checked on every outside booking), ON-P01 **A** (employees skip the AHPRA check, favourites are checked), ON-Q04 **B** (told early, pay details finished before accepting) |\n| Job memory, carried in | R1 (owner may record invoice payment without approval), E1 (admin bypass intended), grill #9 (plain draft roster staff deleted with their shift: still true in code), D2 (cover terms accepted only as shown), D3 (legacy paid session in a locked period goes to refund / manual follow-up), E17/E18 (ABN wins for cross-site cover; staff wins for unrostered local cover), iOS native acceptance deferred |\n| Owner, 13 Nov | D93 (no role change to Explorer; Explorers get no invoices), D96 (an Explorer can never be an admin; built) |\n| Deferred by the owner | Planner: PR #181 simplified vs PR #192 original; keep both until asked (GM-23-W01) |\n\n**AHPRA-FAV-01** and **VERIFY-GATE-01** are answered by ON-P01 and ON-Q03. Engineering follows BL-01 and BL-02. **GM01-Q04** is the single re-confirmation of ON-Q02. **GM-07-Q04 to Q06** and **GM13-Q01/Q02** implement carried decisions through BL-06.\n\n**Already implemen
