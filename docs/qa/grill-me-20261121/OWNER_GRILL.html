<style>
/* Layout: sticky progress header, area list on the left, one area of question cards at a time */
:root{--font-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-head:'Space Grotesk',Inter,system-ui,sans-serif;--bg:#f6f7fb;--panel:#fff;--ink:#1d2433;--muted:#525d7a;--line:#e2e6ef;--accent:#5b3fd6;--accent-soft:#efeafe;--yes:#16794a;--yes-soft:#e5f5ec;--chg:#b25e00;--chg-soft:#fff1de;--def:#5d6b84;--def-soft:#eef1f6;--code:#f1f3f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--panel:#191d27;--ink:#e7eaf2;--muted:#a3adc4;--line:#2b3242;--accent:#a08bff;--accent-soft:#2a2346;--yes:#5fd39a;--yes-soft:#163326;--chg:#ffb35c;--chg-soft:#3a2a14;--def:#b4bfd6;--def-soft:#252b38;--code:#222838;color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11141b;--panel:#191d27;--ink:#e7eaf2;--muted:#a3adc4;--line:#2b3242;--accent:#a08bff;--accent-soft:#2a2346;--yes:#5fd39a;--yes-soft:#163326;--chg:#ffb35c;--chg-soft:#3a2a14;--def:#b4bfd6;--def-soft:#252b38;--code:#222838}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2.area{font-family:var(--font-head);text-wrap:balance}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}
.bar{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.count{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

#exportBox textarea{width:100%;min-height:160px;font:13px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:0;max-width:1400px;margin:0 auto}
nav{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);padding:12px 8px}

nav a.on{background:var(--accent-soft);font-weight:650}
nav a small{color:var(--muted);font-variant-numeric:tabular-nums}

main{padding-block:18px 80px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));min-width:0}

h2.area{font-size:21px;margin:4px 0 10px}
details.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:0 14px}
details.box>summary{cursor:pointer;padding:11px 0;font-weight:600}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.q.yes{border-left:5px solid var(--yes)}.q.change{border-left:5px solid var(--chg)}.q.defer{border-left:5px solid var(--def)}
.qh{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.qn{margin-left:auto;color:var(--muted);font-size:12px}
.qb{padding:4px 16px 4px;max-height:420px;overflow:hidden;position:relative}
.qb.open{max-height:none}
.qb:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--panel))}
.more{margin:0 16px 8px;border:none;background:none;color:var(--accent);padding:4px 0}
.qa{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}

.qa button.sel-change{background:var(--chg-soft);border-color:var(--chg);color:var(--chg);font-weight:650}

.qa textarea{flex:1 1 100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--panel);color:var(--ink)}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13.5px;margin:8px 0}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;text-align:left}

.md pre{background:var(--code);padding:10px;border-radius:8px;overflow-x:auto}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px}
.md h1,.md h2,.md h3,.md h4{font-size:16px;margin:12px 0 6px}
.empty{color:var(--muted);padding:20px;text-align:center}
.nav-btns{display:flex;justify-content:space-between;margin-top:20px;gap:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
label.flt{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;white-space:nowrap}
@media (max-width:860px){.wrap{grid-template-columns:1fr}nav{display:none}select#areaSel{display:block}main{padding-block:12px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

<script>
const DATA = {"total": 385, "areas": [{"key": "ROW0", "row": "0", "title": "LAUNCH-01: what launches, where, after which checks", "qs": [{"id": "LAUNCH-01", "area": "Row 0", "plat": "Web + Expo", "md": "### LAUNCH-01 — the single launch decision (merges GM21-Q01 + GM25-Q01 + GM26-Q36)\n\n**Question:** What launches, on which surfaces, and only after which gates?\n**Owner:** GM-26 (release gate) — record the answer in GM-21 and GM-25 ledgers too; do not ask GM21-Q01, GM25-Q01 or GM26-Q36 separately.\n**Current behaviour:** PR #200 (draft, 24 Oct) audit says PRODUCTION NO-GO; Issue #250 open; CI red on main; staging deploys queued since October (PR #167, no self-hosted runner); marketplace is a read-only public catalogue at defaults with no payment path; Expo pays via `Linking.openURL` to Stripe Checkout with the return-to-app leg unverified; 480-file mobile rewrite (PR #248) unmerged.\n**Recommendation (single):** A — no launch until the NO-GO is cleared; then Vite web + Next public first, Expo after Senior Package Testing, marketplace deferred from the launch cut.\n**Options:** A (recommended) — no launch until NO-GO cleared, then Vite + Next public first, marketplace deferred, Expo after package testing. B — browse-only early access (no bookings, no payments). C — bookings live with manual/off-platform charges. D — full launch with recorded risk acceptance.\n**Ask together:** GM-21-W01 covers marketplace switches, GM-16-W01 the trial and GM-16-W02 billing surfaces. The live-fulfilment launch gate includes the stuck-checkout fix (GM13-Q13, BL-09) and payment readiness (LA-Q05, BL-03)."}, {"id": "GM-16-W01", "area": "GM-16", "plat": "Web + Expo", "md": "### GM-16-W01: Launch with no free trial, or with a trial? (W-02, D153)\n**Scenario:** Tom signs up his pharmacy, posts his first shift, then offers it to Sara.\n**What happens today:** The default trial is zero days. `PAYMENT_REQUIRED` is used in offer acceptance, where a qualifying booking waits for payment before confirmation. Tom can post without subscribing. Live fulfilment collection has its own release switch and defaults off (`pr257:backend/shifts/posting.py:100`, `pr257:backend/shifts/offers.py:406`, `pr257:backend/core/settings.py:678`, `:685`). O4 used a 30-day trial override and did not verify live Stripe.\n**Recommendation first: B.** Give Tom 30 days before the standard payment rule applies to eligible bookings.\n- **KEEP (0 days):** Tom can post. Standard payment rules apply from the first eligible acceptance, once live collection is enabled.\n- **B (recommended):** Tom gets 30 trial days for eligible bookings, then standard payment rules apply.\n- **C:** Tom gets another trial length chosen by the owner.\n- **DEFER**\n\n**Note:** Stripe live acceptance is a production checklist item (GM-26), whatever the answer here.\n**Status:** OPEN"}, {"id": "GM-16-W02", "area": "GM-16", "plat": "Web + Expo", "md": "### GM-16-W02: Subscription and seats: web only for launch? (W-07)\n**Scenario:** Tom opens the Subscription screen in the phone app to add two seats.\n**What happens today:** The server can change Tom's existing extra-seat subscription in Stripe directly. It opens a new Stripe Checkout session when Tom needs to buy extra seats for the first time. The phone opens the returned Checkout URL. These actions have no billing portal (`pr257:backend/billing/subscription_operations.py:160`, `:196`, `pr257:frontend_mobile/roles/owner/subscription-seats.tsx:104`, `:128`).\n**Recommendation first: A.** Keep purchases and seat changes on the web for launch. Tom can see the plan and seat count on his phone.\n- **A (recommended):** Tom sees his plan and seats on the phone and goes to the web to buy or change them.\n- **KEEP:** Tom can change seats from the phone. The app opens Stripe Checkout when the server returns a new session.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM-21-W01", "area": "GM-21", "plat": "Web + Expo", "md": "### GM-21-W01: Which marketplace switches are on at launch? (W-04, D166)\n**Scenario:** Ali wants to list spare stock at launch. Nadia wants to contact him. Tom wants to apply for ethical marketplace access.\n**What happens today:** Goods browsing and the master write switch default on. Separate switches default off for new goods listings, contact, commitments, escalation and catalogue lookup. Ethical access applications default on. Ethical private browsing, inventory, transfers, escalation and S8 default off (`pr257:backend/core/settings.py:235`, `:251`).\n**Recommendation first: A.** Launch goods browsing and keep ethical access applications open. Wait to enable trading until the relevant launch gates pass.\n- **A (recommended):** Ali and Nadia can browse goods only. Tom can apply for ethical access. Private ethical browsing and trading stay off.\n- **B:** Ali can list goods and Nadia can contact him. Goods commitments, escalation and catalogue lookup stay off. Ethical access stays as in A.\n- **C:** Ali and Nadia also get goods commitments, escalation and catalogue lookup. Enable ethical private browsing, inventory, transfers, escalation and S8 after their release gates pass.\n- **DEFER:** Decide within LAUNCH-01.\n\n**Engineering: see BL-07.** The listing editor should explain when new listings are closed.\n**Status:** OPEN (ask together with LAUNCH-01)"}], "sbs": "", "file": "GRILL_ME_CONSOLIDATED_QUEUE.md"}, {"key": "GM-01", "row": "1", "title": "GM-01 Sessions/auth", "qs": [{"id": "GM01-Q01", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q01 — How long should a sign-in last, and should \"Keep me signed in\" exist on mobile too?\n\n**Plain English:** today a web sign-in lasts a different length depending on a checkbox, and the phone app never asks — it always stays signed in. The odd part: ticking \"keep me signed in\" on the web actually gives you a *shorter* refresh token (7 days) than not ticking it (90 days). The owner needs to choose one clear rule for how long each sign-in lasts on each device.\n\n**ACTUAL TODAY — Web:** login screen has \"Keep me signed in\", default off (`frontend_web/src/pages/login.tsx`, `rememberMe = useState(false)`). Backend (`backend/users/sessions.py` `_set_auth_cookies`): `persistent = remember_me is not False`, so ticked → cookies persist; unticked → session cookie (browser close ends it). Refresh lifetime (`backend/users/serializers.py`): `remember_me is True` → 7 days (`JWT_REMEMBER_ME_REFRESH_TOKEN_LIFETIME`); `remember_me is False` → session cookie but the token itself still carries the 90-day lifetime; `remember_me` not sent at all → persistent + 90 days. Access token 30 min everywhere. **ACTUAL TODAY — Expo:** no checkbox anywhere; `loginWithCredentials` sends no `remember_me` (`frontend_mobile/utils/nativeIdentityTransport.ts`), so the backend treats it as persistent + 90-day refresh, and tokens live in SecureStore indefinitely until logout/refresh failure (`frontend_mobile/utils/authSession.ts`). **Parity gap:** web defaults to \"forget me when the browser closes\", mobile defaults to \"remember me for 90 days\" — opposite defaults, never chosen by the owner.\n**Normal case:** worker signs in daily on a shared pharmacy computer vs their own phone. **Edge case:** refresh token stolen — 90 days of access vs 7. **Retry/concurrency:** refresh rotation blacklists only the rotated token; a stolen refresh can be used until expiry. **Denied role:** none. **Payment/notification:** none directly; a stale session can still receive push until logout deletes the device token.\n**RECOMMENDED:** Keep the web checkbox, fix the inversion (ticked = 90 days, unticked = session cookie + short refresh, e.g. 24 h), and add the same choice on Expo (default off for shared devices, on for personal phones). Severity: medium — security + convenience. Benefit: one predictable rule, shorter exposure if a token leaks. Risk: workers on shared computers stay signed in if they tick the box.\n**ALTERNATIVE A — Keep current logic:** web checkbox as-is (including the 7-day inversion), Expo always persistent. Trade-off: no work, but the inversion stays a trap and the two clients keep opposite defaults.\n**ALTERNATIVE B — Short sessions everywhere:** access 30 min, refresh 24 h max on all clients, no remember-me. Trade-off: safest, but locums sign in several times a day; biometric on Expo softens it.\n**ALTERNATIVE C — Long sessions everywhere:** 90-day refresh on web and Expo, no checkbox. Trade-off: most convenient, weakest if a device is lost — needs \"sign out everywhere\" (GM01-Q06) to be safe.\n**Other (describe) / Defer:** owner may defer, but this blocks GM01-Q06/Q07 wording.\n**Sources:** `backend/users/sessions.py` (`_set_auth_cookies`), `backend/users/serializers.py` (`CustomTokenObtainPairSerializer`), `backend/core/settings.py` (`SIMPLE_JWT`, `JWT_REMEMBER_ME_REFRESH_TOKEN_LIFETIME`), `frontend_web/src/pages/login.tsx`, `frontend_mobile/utils/nativeIdentityTransport.ts`, `frontend_mobile/utils/authSession.ts`.\n**Decision status:** OPEN."}, {"id": "GM01-Q03", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q03 — Should an unverified email block sign-in entirely, or let the worker in to finish verifying?\n\n**Plain English:** today if you signed up but never entered the email code, you cannot sign in at all — the app sends you back to the code screen. That is strict and safe, but a worker who lost the email is stuck outside until they find it.\n\n**ACTUAL TODAY — Web:** login blocked unless `is_otp_verified` (401 `email_not_verified`, `backend/users/serializers.py`); `frontend_web/src/pages/login.tsx` routes to `/otp-verify` on that code. **ACTUAL TODAY — Expo:** identical backend block; `frontend_mobile/app/login.tsx` surfaces the backend message; same OTP screen. No difference between clients.\n**Normal case:** new worker signs up, code arrives, verifies, signs in. **Edge case:** email went to spam / wrong inbox — worker cannot sign in to fix anything; resend is only on the OTP screen. **Retry/concurrency:** 5 wrong codes → 15-min lockout; resend throttled 5/min. **Payment/notification:** welcome email only sent after successful verification.\n**RECOMMENDED:** KEEP the block — email is the account's identity and password-reset route; letting unverified accounts browse would let bots harvest the boards. Add one softening: on the OTP screen, show \"wrong email? change it and resend\" (needs a change-email flow — new work, GM-02-adjacent).\n**ALTERNATIVE A — Keep current logic:** block + OTP screen, no change-email path. Trade-off: simplest, some workers get stuck and contact support.\n**ALTERNATIVE B — Limited shell:** let unverified users sign in but only to the verification screen and account settings (no boards, no applying). Trade-off: friendlier recovery, more code, and a half-signed-in state to maintain on both clients.\n**Other (describe) / Defer.**\n**Sources:** `backend/users/serializers.py` (`CustomTokenObtainPairSerializer`), `backend/users/api_otp.py` (`VerifyOTPView`), `frontend_web/src/pages/login.tsx`, `frontend_mobile/context/AuthContext.tsx` (`verifyOTP`).\n**Decision status:** OPEN."}, {"id": "GM01-Q04", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q04 — Must a worker verify their mobile before they can browse anything? (carried ON-Q02, re-asked — FIRST QUESTION, see Part D)\n\n> **Also covers (22 Nov):** GM25-C02 (GM-25). Asked once, here.\n\n**Previous answer:** KEEP (launch grill, 23 Oct 2026). Re-confirm here once using the corrected dashboard baseline.\n\n**Plain English:** today, after email + password, a pharmacist, assistant, technician or Explorer must also verify an Australian mobile number (or, for overseas Explorers, a photo ID) before they can see *any* dashboard page — the app bounces them to the mobile-check screen. The old grill said workers could \"browse everything after email login\". That is not what the code does. The owner needs to confirm the strict rule or relax it.\n\n**ACTUAL TODAY — Web:** `ProtectedRoute` forces PHARMACIST / OTHER_STAFF / EXPLORER with `!is_mobile_verified && !mobile_check_skipped` to `/mobile-verify` (`frontend_web/src/components/ProtectedRoute.tsx`); login also routes there first. **ACTUAL TODAY — Expo:** identical — `frontend_mobile/app/login.tsx` routes there first; `_layout.tsx` guard keeps unverified users out of protected routes. **Anonymous public boards** (no sign-in) stay open to anyone on both clients — the gate only bites once signed in. **Backend:** `POST /mobile/request-otp/` + `/mobile/verify-otp/` (AU numbers only, `backend/users/api_otp.py`); overseas Explorer skip via `POST /mobile/skip-overseas/` (photo ID stands in).\n**Normal case:** locum verifies mobile once, never sees the gate again. **Edge case:** worker with no AU number who is not an overseas Explorer has no path at all. Verified number is locked and can never be changed. **Retry/concurrency:** 60-s resend cooldown; throttles 10/min verify, 5/min resend. **Denied role:** OWNER and ORG_STAFF are not gated by this check. **Payment/notification:** none — but a worker who cannot pass the gate can never apply, so pharmacies never see them.\n**RECOMMENDED:** KEEP the current strict rule (option B of the old question: browse after email + mobile). It blocks bots and fake sign-ups before they can reach pharmacies, and it is already built on both clients.\n**ALTERNATIVE A — Keep the old grill's recommendation (browse after email, gate applying):** let workers browse all boards after email login; only applying / accepting / booking needs mobile + Verified. Trade-off: friendlier first look, more fake accounts browsing; needs the gate moved from `ProtectedRoute` to the apply/accept actions on both clients.\n**ALTERNATIVE B — Nothing until Verified:** also require full Verified status (AHPRA etc.) before browsing. Trade-off: strictest; many workers leave before finishing (GM-02 owns the Verified definition).\n**Other (describe) / Defer.**\n**Sources:** `frontend_web/src/components/ProtectedRoute.tsx`, `frontend_web/src/pages/login.tsx`, `frontend_mobile/app/login.tsx`, `frontend_mobile/app/_layout.tsx`, `backend/users/api_otp.py`.\n**Decision status:** OPEN — **ask first (Part D)**."}, {"id": "GM01-Q05", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q05 — Should sign-in get a second factor (authenticator app), or is email code + mobile check enough?\n\n**Plain English:** today there is no authenticator-app (TOTP) second factor at sign-in. You prove email with a code once at signup, and your mobile once — after that, password alone signs you in. The code even has the 2FA library installed, but nothing uses it at login.\n\n**ACTUAL TODAY — Web and Expo (same):** `django-otp` + `two_factor` installed with `OTPMiddleware` (`backend/core/settings.py`), but no TOTP enforcement was found in the login flow; the only second proofs are the one-time email OTP at signup and the one-time mobile OTP after first login. No \"remember this device\", no backup codes, no 2FA settings screen on either client.\n**Normal case:** password-only sign-in after the one-time checks. **Edge case:** password leaked → account fully open (until a password reset revokes sessions). **Retry/concurrency:** Axes lockout (5 fails / 1 h) is the only brute-force defence; no CAPTCHA on login. **Payment/notification:** a compromised owner account could confirm bookings and trigger payments (GM-13/GM-16 own the money rules).\n**RECOMMENDED:** Add optional authenticator-app 2FA for OWNER and ORG_STAFF first (the accounts that move money), later for workers — with backup codes and a \"remember device 30 days\" option. Severity: medium-high for owners, low for workers.\n**ALTERNATIVE A — Keep current logic:** email OTP at signup + mobile check once, password only after that. Trade-off: no work; weakest account security, and the installed-but-unused `django-otp` stays misleading.\n**ALTERNATIVE B — SMS code at every sign-in:** reuse the mobile OTP on every login. Trade-off: strong, but SMS costs, delays, and overseas workers without AU numbers cannot sign in.\n**ALTERNATIVE C — 2FA mandatory for everyone:** Trade-off: safest, highest drop-off for locums signing in on shift.\n**Other (describe) / Defer.**\n**Sources:** `backend/core/settings.py` (`django-otp`, `two_factor`, `OTPMiddleware`), `backend/users/api_auth.py` (`CustomLoginView` — no 2FA step), `backend/users/login_security.py`.\n**Decision status:** OPEN."}, {"id": "GM01-Q06", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q06 — How many devices can stay signed in, and should there be a \"sign out everywhere\" button?\n\n**Plain English:** today there is no limit — every sign-in on every device mints a new session, and signing out on one device leaves all the others signed in. There is no list of your devices and no \"sign out everywhere\".\n\n**ACTUAL TODAY — Web and Expo (same backend):** each login mints a new refresh token (`sid` = new `jti` each time, `backend/users/tokens.py`); rotation blacklists only the rotated token; logout revokes only its own `sid` (`LogoutView`, `backend/users/api_auth.py`); password reset is the ONLY thing that revokes all sessions (`_revoke_user_tokens`, `backend/users/account_deletion.py`). No session list API, no device list, no per-user session cap was found. **Clients:** neither shows active sessions.\n**Normal case:** worker signed in on phone + pharmacy computer; signs out on the computer, phone stays in. **Edge case:** phone lost/stolen — owner cannot kill that session except by resetting the password (which also signs *them* out everywhere). **Retry/concurrency:** two devices refreshing at once is safe (deduplicated per instance; `sid` survives rotation). **Payment/notification:** a stolen session keeps receiving push until its refresh expires (up to 90 days).\n**RECOMMENDED:** Add \"sign out everywhere\" (reuse the password-reset revocation path behind a confirm screen) + a simple session list (device, last active, current device marked) on web and Expo. Cap: no hard cap at launch; revisit if abuse appears.\n**ALTERNATIVE A — Keep current logic:** no limit, no list, password reset is the only global kill-switch. Trade-off: no work; lost-device recovery is painful and surprising.\n**ALTERNATIVE B — One session only:** new login kills all older sessions. Trade-off: simplest to reason about, but breaks the normal phone + computer pattern.\n**ALTERNATIVE C — Cap of 5 sessions, oldest evicted:** Trade-off: middle ground, needs eviction rules and messaging.\n**Other (describe) / Defer.**\n**Sources:** `backend/users/tokens.py`, `backend/users/api_auth.py` (`LogoutView`), `backend/users/account_deletion.py` (`_revoke_user_tokens`, `_revoke_user_sessions`).\n**Decision status:** OPEN."}, {"id": "GM01-Q07", "area": "GM-01", "plat": "Web only", "md": "### GM01-Q07 — Fix the \"Keep me signed in\" inversion? (ticked = 7 days, unticked = 90 days)\n\n**Plain English:** this is the bug-shaped part of GM01-Q01, split out so it can be decided on its own. On the web, ticking \"Keep me signed in\" gives a 7-day refresh token; leaving it unticked gives a 90-day one. That is backwards from what the words promise, and the phone app never sends the flag at all so it always gets 90 days.\n\n**ACTUAL TODAY — Web:** `CustomTokenObtainPairSerializer` stamps `remember_me=True` → refresh expiry shortened to `JWT_REMEMBER_ME_REFRESH_TOKEN_DAYS` (7); `remember_me=False` → session cookie but token keeps the 90-day lifetime; refresh preserves `remember_me` and the *original* `exp` (never extends). **ACTUAL TODAY — Expo:** no `remember_me` sent → treated as not-False → persistent + 90 days. **Backend:** `backend/users/serializers.py`, `backend/users/sessions.py`, `backend/core/settings.py`.\n**RECOMMENDED:** Fix the inversion in the same change as GM01-Q01 (ticked = long, unticked = short). If the owner defers GM01-Q01, at minimum make Expo send `remember_me: false` explicitly so its lifetime is a deliberate choice, not an accident of an omitted field.\n**ALTERNATIVE A — Keep current logic:** leave the inversion; document it. Trade-off: zero work, permanent trap for anyone reading the code or the UI.\n**ALTERNATIVE B — Remove `remember_me` entirely:** one lifetime for everyone (decide the number in GM01-Q01). Trade-off: simplest code, removes the checkbox users expect.\n**Other (describe) / Defer.**\n**Sources:** `backend/users/serializers.py`, `backend/users/sessions.py`, `backend/core/settings.py`.\n**Decision status:** OPEN. (Code gap if the owner confirms the inversion is a bug: the fix is small and touches no UI wording beyond the checkbox behaviour.)"}, {"id": "GM01-Q08", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q08 — When a session expires mid-use, what should the worker see?\n\n**Plain English:** today there is no single \"your session expired, sign in again\" moment. Each screen fails on its own; the web app quietly clears your session when you click back into the tab, and the phone app clears it when it restarts. A worker can be mid-form when their session dies.\n\n**ACTUAL TODAY — Web:** no `onAuthFailure` is wired anywhere (`frontend_web/src/config/api.ts` passes no `onAuthFailure` to `configureApi`); a final 401 just throws to the calling screen. `AuthContext` focus/visibility re-check clears tokens if `/me/` fails, and reloads the page if the identity changed. No \"session expired\" message exists. **ACTUAL TODAY — Expo:** same — no `onAuthFailure` in `frontend_mobile/config/api.ts`; `refreshAccessToken` clears the whole stored session on 400/401; bootstrap treats an unreadable/expired session as signed out. Only the biometric path shows \"Your saved session has expired. Please sign in again.\" **Shared-core** (`shared-core/src/transport/client.ts`) supports `onAuthFailure` — it is simply never passed.\n**Normal case:** token expires after 30 min idle; next tap fails. **Edge case:** worker mid-way through a long application form — unsaved input may be lost on the reload (web reloads the whole page on identity change). **Retry/concurrency:** one deduplicated refresh + one retry, then failure.\n**RECOMMENDED:** Wire one central handler on both clients: on final 401, save the current route/form state, clear the session, show \"Your session expired — sign in again\", and return the user to where they were after login. Severity: medium — UX + data-loss.\n**ALTERNATIVE A — Keep current logic:** per-screen failures, silent clears, page reload on identity change. Trade-off: no work; workers lose context and get no explanation.\n**ALTERNATIVE B — Silent background re-login only:** keep retrying refresh forever. Trade-off: worse — masks revoked sessions and hammers the backend.\n**Other (describe) / Defer.**\n**Sources:** `shared-core/src/transport/client.ts` (`createApiClient`, `onAuthFailure`), `frontend_web/src/config/api.ts`, `frontend_mobile/config/api.ts`, `frontend_web/src/contexts/AuthContext.tsx` (`synchronizeSession`), `frontend_mobile/context/AuthContext.tsx`.\n**Decision status:** OPEN."}, {"id": "GM01-Q09", "area": "GM-01", "plat": "Web only", "md": "### GM01-Q09 — After sign-in, should the worker return to the page that sent them there? (Web parity)\n\n**Plain English:** today if you tap a link to a specific page while signed out, the web app sends you to sign in — and then dumps you on your dashboard, not the page you wanted. The Next site remembers where you were going; the Vite dashboard does not.\n\n**ACTUAL TODAY — Vite:** `frontend_web/src/pages/login.tsx` always routes by role (mobile-verify → org → owner-setup → role dashboard); `ProtectedRoute` sends logged-out users to `loginHref(path)` (`/login?next=…`) but login never reads `?next=` or `location.state.from`. **ACTUAL TODAY — Next:** `frontend_web/landing_next/migrated/pages/login.tsx` honours the return destination first (`returnDestination()` / `rememberDestination` / `finishDestination`), then role routing. **ACTUAL TODAY — Expo:** no return-to concept — login always routes by role/workspace; deep links are not preserved across sign-in (not verified whether Expo deep links carry a return route — UNKNOWN).\n**Normal case:** manager emails a link to a shift; worker taps it signed out; after sign-in they land on the dashboard and must find the shift again. **Edge case:** `?next=` pointing outside the allowlist — `safeNext` in `browser-session.ts` already restricts to `/dashboard|/onboarding|/setup|/kiosk|/hubs|/blog|/news|/content|/calculator|/shifts|/talent|/marketplace|/learning|/how-it-works|/membership|/referee|/organization`, never logout URLs.\n**RECOMMENDED:** Make Vite honour `?next=` through the existing `safeNext` allowlist (small change, shared helper already exists). Keep Expo role-routing (phones rarely carry web deep links into sign-in).\n**ALTERNATIVE A — Keep current logic:** Vite always lands on the dashboard; Next keeps its return-to. Trade-off: no work; invitation and shift links keep dropping workers on the dashboard.\n**ALTERNATIVE B — Return-to on all three clients:** including Expo deep links. Trade-off: most consistent, more work, deep-link handling on Expo was not traced.\n**Other (describe) / Defer.**\n**Sources:** `frontend_web/src/pages/login.tsx`, `frontend_web/landing_next/migrated/pages/login.tsx`, `frontend_web/landing_next/shared/browser-session.ts` (`safeNext`, `loginHref`, `returnDestination`), `frontend_web/src/components/ProtectedRoute.tsx`.\n**Decision status:** OPEN. (Code gap if the owner confirms Vite should honour `?next=` — the helper already exists.)"}, {"id": "GM01-Q10", "area": "GM-01", "plat": "Expo only", "md": "### GM01-Q10 — Should every onboarding/auth step work on mobile, including the password and OTP screens?\n\n> **Also covers (22 Nov):** ON-Q15 (GM-02), GM-03-Q05 (GM-03), Q-16 (GM-05), GM25-C01 (GM-25), GM26-Q48 (GM-26). Asked once, here.\n\n**Plain English:** the auth screens themselves (sign in, sign up, email code, mobile check, forgot password, reset password) all exist on the phone app — but the Next web app's shared API setup is missing its token-refresh callback, so it is not proven that a signed-in Next session refreshes cleanly. And the old grill's complaint about the mobile \"add personal profile\" flow belongs to onboarding, not to sessions.\n\n**ACTUAL TODAY — Expo:** public routes in `frontend_mobile/app/_layout.tsx` include `login, register, welcome, verify-otp, forgot-password, reset-password, mobile-verify` — all auth screens exist. **ACTUAL TODAY — Vite:** all equivalent pages exist (`login.tsx`, `register.tsx`, `OTPVerify.tsx`, `MobileOTPVerify.tsx`, `password-reset.tsx`, `ResetPasswordPage.tsx`). **ACTUAL TODAY — Next:** login/register migrated copies exist and mirror Vite, BUT `frontend_web/landing_next/migrated/config/api.ts` passes `getToken` and **no `refreshToken` callback** to `configureApi` — so shared-core API calls from Next cannot refresh on 401; only calls through `browserRequest` (`browser-session.ts`) refresh. Whether the live Next app hits the broken path was not verified.\n**RECOMMENDED:** A — full parity for the auth steps (already true for screens) + verify/fix the Next refresh callback before launch (code gap, GM01-Q10a below).\n**ALTERNATIVE A — Keep current logic:** screens as-is; Next refresh path unverified. Trade-off: no work; risk of signed-in Next users being dropped to login mid-task.\n**ALTERNATIVE B — Mobile basics, rest links to web:** auth on mobile, the rest of onboarding on the web. Trade-off: less to build, phone users switch devices mid-onboarding (the old ON-Q15 option B).\n**Other (describe) / Defer.**\n**Sources:** `frontend_mobile/app/_layout.tsx`, `frontend_web/landing_next/migrated/config/api.ts`, `frontend_web/src/config/api.ts`, `frontend_web/landing_next/shared/browser-session.ts` (`browserRequest`).\n**Decision status:** OPEN. (Carried in part from ON-Q15; the Next refresh callback is a code gap to verify first.)"}, {"id": "GM01-Q11", "area": "GM-01", "plat": "Expo only", "md": "### GM01-Q11 — Biometrics on the phone: keep it, and should the web get passkeys? (Expo-only feature)\n\n**Plain English:** on the phone you can unlock your saved session with Face ID or fingerprint instead of typing your password. The web has nothing like it. One detail to fix: the \"biometrics on\" flag is stored in plain app storage, not in the secure store where the tokens live.\n\n**ACTUAL TODAY — Expo:** enrolment offered after password login (`frontend_mobile/app/login.tsx` `promptForBiometricEnable`); device prompt at startup if a saved biometric user matches the stored session (`frontend_mobile/context/AuthContext.tsx`); flag + `{id, email, name}` in AsyncStorage (`BIOMETRIC_LOGIN_ENABLED`, `BIOMETRIC_LOGIN_USER` in `frontend_mobile/utils/biometricAuth.ts`) — **not SecureStore**; tokens themselves are in SecureStore. Fallback to device passcode is allowed; cancel/fail → password login. **ACTUAL TODAY — Web/Next:** no biometric or passkey login of any kind.\n**Normal case:** locum opens the app, Face ID, straight in. **Edge case:** someone adds a new fingerprint to the device — the saved session is still unlocked by the device, which is the platform's own guarantee. **Retry/concurrency:** none (device-local). **Payment/notification:** none.\n**RECOMMENDED:** Keep Expo biometrics; move the flag/user record into SecureStore (small fix); do NOT add web passkeys before launch — revisit after GM-01 decisions land.\n**ALTERNATIVE A — Keep current logic:** biometrics as-is, flag in AsyncStorage. Trade-off: no work; the flag only records *who* may use biometrics, not a secret — low risk, but inconsistent with the token storage rule.\n**ALTERNATIVE B — Remove biometrics:** password only on Expo. Trade-off: simplest, worst daily experience for locums.\n**ALTERNATIVE C — Add web passkeys now:** Trade-off: best long-term, large work across all three clients before launch.\n**Other (describe) / Defer.**\n**Sources:** `frontend_mobile/utils/biometricAuth.ts`, `frontend_mobile/app/login.tsx`, `frontend_mobile/context/AuthContext.tsx`, `frontend_mobile/utils/secureStorage.ts`.\n**Decision status:** OPEN. (Moving the flag to SecureStore is a code gap once the owner confirms biometrics stays.)"}, {"id": "GM01-Q12", "area": "GM-01", "plat": "Expo only", "md": "### GM01-Q12 — If sign-out fails (offline), should the app sign you out anyway or stay signed in?\n\n**Plain English:** today the phone app and the web disagree when the sign-out request fails. On the web (Expo web) it keeps you signed in and tells you to retry. On the phone it signs you out locally but warns the server session may still be alive. The Vite dashboard's failure path was not fully read.\n\n**ACTUAL TODAY — Expo web:** logout failure → alert \"Could not sign out. Please check your connection and try again.\" and the session stays visible (`frontend_mobile/context/AuthContext.tsx` `logout`). **ACTUAL TODAY — Expo native:** logout failure → local sign-out anyway + alert \"Signed out on this device, but the server session could not be revoked.\" — the server session survives until its refresh expires (up to 90 days). **ACTUAL TODAY — Vite:** `logout()` calls `logoutSession` then clears local state; the failure path in `frontend_web/src/contexts/AuthContext.tsx` was not fully read (UNKNOWN — re-check before implementation). **Backend:** logout revokes only its own `sid`; a failed request revokes nothing.\n**Normal case:** online sign-out works everywhere. **Edge case:** sign out on a train with no signal — native says you're out but the server disagrees. **Retry/concurrency:** `logoutSession` waits for a pending refresh and holds the refresh lock (web). **Payment/notification:** device push token is deleted only on a *successful* logout call — a failed native logout may keep push arriving after the user thinks they signed out.\n**RECOMMENDED:** One rule everywhere: always clear the local session, and queue a \"revoke my session\" retry for when the connection returns; show \"signed out on this device — we'll finish signing out when you're back online\" instead of two different alerts. Needs a small outbox (new work).\n**ALTERNATIVE A — Keep current logic:** Expo web stays signed in on failure, native signs out locally, Vite as-is. Trade-off: no work; inconsistent and confusing, and the native path leaves a live server session behind.\n**ALTERNATIVE B — Never clear locally until the server confirms:** safest server state, worst UX offline (user stuck signed in on a shared device).\n**Other (describe) / Defer.**\n**Sources:** `frontend_mobile/context/AuthContext.tsx` (`logout`), `frontend_web/src/contexts/AuthContext.tsx` (`logout`), `frontend_web/landing_next/shared/browser-session.ts` (`logoutSession`), `backend/users/api_auth.py` (`LogoutView`).\n**Decision status:** OPEN."}, {"id": "GM01-Q13", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q13 — Password reset signs every device out — keep that, and should the reset link expire?\n\n**Plain English:** today resetting your password kills every session on every device (the only \"sign out everywhere\" that exists) and also marks your email as verified. The reset link itself has no stated expiry — Django's default token stays valid until you change your password again.\n\n**ACTUAL TODAY — All clients (same backend):** `PasswordResetConfirmAPIView` (`backend/users/api_passwords.py`) sets the new password, sets `is_otp_verified=True`, resets the Axes lockout, and revokes ALL tokens/sessions (`_revoke_user_tokens` / `_revoke_user_sessions`, `backend/users/account_deletion.py`). Request endpoint always answers \"If this email exists, a reset link has been sent.\" (no enumeration), throttled 5/hour. **Clients:** all three show the reset form and return to login on success (`ResetPasswordPage.tsx`, `app/reset-password.tsx`, migrated copy).\n**Normal case:** worker forgets password, resets, signs in on their phone — their old laptop session dies too. **Edge case:** reset link forwarded or leaked — usable until the password changes again (no time limit found in code). **Retry/concurrency:** a reset racing an in-flight refresh — revocation wins (refresh rejected, `RevokedSession` checked). **Payment/notification:** none, but a hijacked reset is a full account takeover.\n**RECOMMENDED:** Keep the global revocation (it is the safety net for a stolen password). Add a 1-hour link expiry and a \"reset requested\" email notice so the owner sees unexpected resets.\n**ALTERNATIVE A — Keep current logic:** global revocation, no link expiry. Trade-off: no work; leaked links stay usable indefinitely.\n**ALTERNATIVE B — Revoke only the current device:** Trade-off: friendlier, but a stolen password stays usable on the attacker's device.\n**Other (describe) / Defer.**\n**Sources:** `backend/users/api_passwords.py`, `backend/users/account_deletion.py`, `frontend_web/src/pages/ResetPasswordPage.tsx`, `frontend_mobile/app/reset-password.tsx`.\n**Decision status:** OPEN."}, {"id": "GM01-Q14", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q14 — Login defences: keep 5-fails / 1-hour lockout, and should sign-in get a CAPTCHA?\n\n**Plain English:** today five wrong passwords lock the account for an hour (per username + IP), and there is no CAPTCHA on the sign-in screen — only on signup. A bot can try passwords against any email address until the lockout trips.\n\n**ACTUAL TODAY — All clients (same backend):** Axes 5 failures, 1 h cooloff, reset on success (`backend/core/settings.py`, `backend/users/login_security.py`); locked login returns 429 `login_locked` with minutes remaining; wrong credentials return 401 `invalid_credentials` without saying whether the email exists (except correct-password + unverified email reveals `email_not_verified`). Clients show the backend message verbatim. **No CAPTCHA on login** on any client; reCAPTCHA is enforced only on register (`RegisterView`).\n**Normal case:** worker mistypes 5 times → locked out for an hour, must reset password. **Edge case:** attacker locks a victim's account by failing 5 times on purpose (username+IP lockout can be abused for denial of service). **Retry/concurrency:** lockout is checked before password verification, so a locked account cannot be brute-forced further.\n**RECOMMENDED:** Keep 5/1 h, add CAPTCHA after 3 failed attempts (not on first try — keep honest workers fast), and consider per-IP throttling so one attacker cannot lock many accounts. Severity: medium.\n**ALTERNATIVE A — Keep current logic:** 5/1 h, no CAPTCHA anywhere on login. Trade-off: no work; credential-stuffing and lockout-abuse stay possible.\n**ALTERNATIVE B — Softer lockout (10 fails / 15 min):** Trade-off: fewer support calls, weaker brute-force defence.\n**Other (describe) / Defer.**\n**Sources:** `backend/core/settings.py` (Axes), `backend/users/login_security.py`, `backend/users/api_auth.py` (`CustomLoginView`), `frontend_web/src/pages/login.tsx`, `frontend_mobile/app/login.tsx`.\n**Decision status:** OPEN."}, {"id": "GM01-Q15", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q15 — When a worker opens a page they are not allowed to see, should the app say so or silently send them home?\n\n**Plain English:** today if you open a page for another role (or another pharmacy's admin page), the app silently drops you on your own dashboard with no message. You never learn the page exists, and you cannot ask for access.\n\n**ACTUAL TODAY — Web:** `ProtectedRoute` (`frontend_web/src/components/ProtectedRoute.tsx`): wrong role / missing capability / no admin assignment → silent `<Navigate to={resolveDashboardPath(user.role)} replace />`. Not signed in → login with `?next=`. AHPRA-frozen accounts DO get a message (\"Account Access Paused\" + recovery link). **ACTUAL TODAY — Expo:** `_layout.tsx` root guard redirects to the role home; no 403 page, no message. **Backend:** default permission `IsAuthenticated` (fail closed); per-view permissions decide the rest (GM-05 owns the role model).\n**Normal case:** locum pastes an owner's admin link → lands on their own dashboard, confused. **Edge case:** a manager who *should* have access but whose assignment was removed — silent redirect hides the real problem. **Retry/concurrency:** none. **Payment/notification:** none.\n**RECOMMENDED:** Show a short \"You don't have access to this page\" notice with the page name and a \"request access\" link, then send them home — same on all three clients. Keeps the fail-closed backend, fixes the confusion.\n**ALTERNATIVE A — Keep current logic:** silent redirect everywhere. Trade-off: no work; workers cannot tell a bad link from a missing permission, and support gets \"the page disappeared\" reports.\n**ALTERNATIVE B — Show a full 403 page with the reason:** Trade-off: clearest, but reveals which pages exist to users who should not know (minor information leak; keep the message generic).\n**Other (describe) / Defer.**\n**Sources:** `frontend_web/src/components/ProtectedRoute.tsx`, `frontend_mobile/app/_layout.tsx`, `backend/core/settings.py` (default `IsAuthenticated`).\n**Decision status:** OPEN."}, {"id": "GM01-Q18", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q18 — Mobile numbers: Australian only, locked forever once verified — keep that?\n\n**Plain English:** today the mobile check only accepts Australian numbers, and once a number is verified you can never change it. An overseas worker without an Australian number can only get in as an Explorer with a photo ID.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `POST /mobile/request-otp/` requires an Australian number (normalised to `61…`); verified number is locked, no change-number flow exists; `POST /mobile/skip-overseas/` is EXPLORER + `OVERSEAS` only, sets `mobile_check_skipped=True`, photo ID stands in (`backend/users/api_otp.py`). Clients show the same screens on both platforms.\n**Normal case:** locum verifies their AU mobile once. **Edge case:** worker changes number, or arrives from overseas as a pharmacist (not Explorer) — no path; they are stuck at `/mobile-verify`. **Retry/concurrency:** 60-s resend cooldown. **Payment/notification:** none.\n**RECOMMENDED:** Keep AU-only at launch (the product is Australian), but add a change-number flow (re-verify the new number, keep the old one until the new one verifies) and an overseas path for non-Explorer roles via photo ID. Severity: medium — blocks real workers.\n**ALTERNATIVE A — Keep current logic:** AU only, locked forever, overseas skip for Explorers only. Trade-off: no work; number changes and overseas pharmacists are support cases.\n**ALTERNATIVE B — Accept international numbers:** Trade-off: widest access; SMS costs and fraud risk rise, and the \"Australian mobile\" identity signal weakens.\n**Other (describe) / Defer.**\n**Sources:** `backend/users/api_otp.py` (`RequestMobileOTPView`, `VerifyMobileOTPView`, `SkipMobileOverseasView`), `frontend_web/src/pages/MobileOTPVerify.tsx`, `frontend_mobile/app/mobile-verify.tsx`.\n**Decision status:** OPEN."}, {"id": "GM01-Q19", "area": "GM-01", "plat": "Web + Expo", "md": "### GM01-Q19 — Email/mobile codes: keep 6 digits / 10 minutes / 5 tries, and is the test-mode code display safely off in production?\n\n**Plain English:** the codes are 6 digits, live 10 minutes, and 5 wrong tries lock you out for 15 minutes. Separately, there is a test setting that returns the mobile code inside the app response instead of sending an SMS — the code itself gates it so it cannot be on in production by default; the remaining risk is a staging/local misconfiguration.\n\n**ACTUAL TODAY — All clients (same backend):** email OTP: 6 digits, hashed, 10-min expiry, 5 fails → 15-min lockout (`VerifyOTPView`, `backend/users/api_otp.py`; constants `OTP_MAX_FAILED_ATTEMPTS = 5`, `OTP_LOCKOUT_MINUTES = 15` defined in `backend/users/otp.py:14,17`); mobile OTP: 10-min expiry, 60-s resend cooldown, throttles 10/min verify / 5/min resend. `MOBILE_OTP_DISPLAY_IN_APP` (`backend/core/settings.py:654-658`, verified at head `97c4543e`) returns `debug_otp` in the response when on — \"Test environments show the code in the app instead of sending SMS\". **Senior-review correction (downgraded):** the flag is code-gated — `env.bool(\"MOBILE_OTP_DISPLAY_IN_APP\", default=DEBUG) and (APP_ENV in {local, dev, development, test, staging})` — so it cannot be on in production via the default. The residual risk is staging/local misconfiguration (staging is in the allowed set and staging holds copied production users), not a production default. Resend always answers generically (\"If this email is eligible…\").\n**Normal case:** code arrives by email/SMS, entered within 10 minutes. **Edge case:** slow email delivery (>10 min) → code dead on arrival; worker must resend. **Retry/concurrency:** resend while a code is live — does it invalidate the old code? Not traced (UNKNOWN — check `RequestMobileOTPView`/`ResendOTPView` before implementation). **Payment/notification:** SMS costs per send.\n**RECOMMENDED:** Keep 6 digits / 10 min / 5 tries. Confirm the staging deploy does not enable `MOBILE_OTP_DISPLAY_IN_APP` with production-like data, and add a startup check that refuses to boot with it on outside test settings (code gap, downgraded from a production risk to a staging/local misconfiguration risk). Consider 15-min email codes if delivery is slow in testing.\n**ALTERNATIVE A — Keep current logic:** same timings, test-mode setting as code-gated. Trade-off: no work; a misconfigured staging deploy could still leak codes.\n**ALTERNATIVE B — Longer codes / authenticator instead:** 8 digits or TOTP (see GM01-Q05). Trade-off: more secure, more friction.\n**Other (describe) / Defer.**\n**Sources:** `backend/users/api_otp.py`, `backend/users/otp.py:14,17`, `backend/core/settings.py:654-658` (`MOBILE_OTP_DISPLAY_IN_APP`).\n**Decision status:** OPEN. (Verifying the staging setting value is a code gap, not a decision.)\n\n---"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Sign up (create account) | Visitor submits registration form with role selection and reCAPTCHA (`frontend_web/src/pages/register.tsx:96`). | Visitor submits registration with role picker and captcha verification (`frontend_mobile/app/register.tsx:241`). | Yes | — |\n| Verify email OTP | User inputs 6-digit email code sent upon registration (`frontend_web/src/pages/OTPVerify.tsx:35`). | User enters 6-digit OTP with auto-advancing text inputs (`frontend_mobile/app/verify-otp.tsx:57`). | Yes | — |\n| Log in (email & password) | User enters credentials with \"Keep me signed in\" checkbox (`frontend_web/src/pages/login.tsx:61`). | User enters credentials without \"Keep me signed in\" checkbox (`frontend_mobile/app/login.tsx:143`). | No | Parity question: web exposes \"Keep me signed in\" checkbox altering refresh token lifetime (`frontend_web/src/pages/login.tsx:189`), while mobile omits it. |\n| Biometric fast login | Web client does not implement biometric or WebAuthn passkey authentication (`frontend_web/src/pages/login.tsx`). | Mobile client prompts for biometric enrolment and allows Face ID/fingerprint sign-in (`frontend_mobile/app/login.tsx:162`). | Expo only | Intended: mobile-only native device hardware capability. |\n| Mobile OTP verification | Unverified worker is gated to mobile OTP verification screen (`frontend_web/src/pages/MobileOTPVerify.tsx:67`). | Mobile app gates unverified workers to mobile-verify screen before accessing tabs (`frontend_mobile/app/_layout.tsx:362`). | Yes | — |\n| Password reset request | Visitor submits email to request password reset link (`frontend_web/src/pages/PasswordResetRequestPage.tsx:26`). | Visitor inputs email on forgot-password screen to trigger reset code (`frontend_mobile/app/forgot-password.tsx:25`). | Yes | — |\n| Session token refresh | Browser refreshes access token via HttpOnly cookies and session storage sync (`frontend_web/src/contexts/AuthContext.tsx:191`). | Native app exchanges stored refresh token via bearer payload (`frontend_mobile/context/AuthContext.tsx:127`). | Same (different storage) | Intended (orchestrator review 22 Nov): each platform keeps the sign-in where it is safest (web HttpOnly cookie, phone secure storage). Not an owner question. |\n| Log out | User logs out, clearing browser storage and session cookies (`frontend_web/src/contexts/AuthContext.tsx:453`). | User logs out, clearing SecureStore and resetting root navigation (`frontend_mobile/context/AuthContext.tsx:518`). | Yes | — |", "file": "areas/GM-01-sessions-auth.md"}, {"key": "GM-02", "row": "1", "title": "GM-02 Worker onboarding", "qs": [{"id": "ON-Q05", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q05 — What can Explorers (new to pharmacy) do with shifts?\n\n> **Also covers (22 Nov):** Q-03 (GM-05), GM-12-Q05 (GM-12), GM-24-Q01 (GM-24), GM25-C04 (GM-25). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN.**\n- **Context:** Web shows Explorers the shift boards, but they get no verification check and\n  can never accept. No Explorer payment tab exists (ON-09).\n- **ACTUAL TODAY:** Confirmed, with one refinement. Explorers *can* express interest on\n  public shifts if their Explorer profile is Verified (`interest.py:_require_public_shift_onboarding()`,\n  EXPLORER branch) — but they can **never accept**: `engagement.py:25 worker_onboarding()`\n  returns `OtherStaffOnboarding` for every non-pharmacist, so an Explorer has no row and\n  `_external_payment_profile()` raises \"Complete worker onboarding before accepting\".\n  There is no Explorer payment tab (no payment fields on `ExplorerOnboarding` in the\n  inspected models). Mobile Explorer shifts tab NOT INSPECTED at this head.\n- **Options:** **KEEP — Keep current logic:** Explorers see boards and can apply but never\n  accept. | **A — No shifts; hide the boards:** Explorers use the Talent Board only. |\n  **B — Unpaid shadowing posts only:** a new post type for observation days. |\n  **C — Paid shifts after upgrading role:** the upgrade card exists; they then follow that\n  role's checks.\n- **RECOMMENDED: C. Severity: High.** Today Explorers can apply to shifts they can never\n  accept, which wastes pharmacies' time and creates dead applicants on every public\n  shift. Locumate and Locate a Locum tie shift access to role checks; the existing\n  upgrade path moves Explorers into a real track. A is the fallback if upgrade is not\n  ready; B is a new product, not a launch fix.\n- **Normal case:** Explorer applies → manager offers → accept fails with \"complete\n  onboarding\". **Edge case:** a verified Explorer's interest sits on a shift forever with\n  no path to booking. **Notification side effect:** managers are emailed about interest\n  from workers who cannot be booked. **Web/Expo difference:** web boards confirmed in\n  #184; mobile tab NOT INSPECTED.\n- **Sources:** [engagement.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/shifts/engagement.py#L25-L28),\n  [interest.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/shifts/interest.py#L38-L62),\n  [users/models.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/users/models.py#L54)."}, {"id": "ON-Q06", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q06 — How should AHPRA be re-checked after sign-up?\n\n> **Also covers (22 Nov):** GM26-Q10 (GM-26). Asked once, here.\n- **Validation: STILL VALID — WITH A CORRECTION.** **Decision status: OPEN.\n  Severity: Critical** (the register is the core legal trust signal).\n- **Context:** Workers can press Re-check, and a public apply or accept queues a check\n  once the stored expiry passes. No scheduled scan (ON-02).\n- **ACTUAL TODAY (corrected):** One lookup at sign-up stores status, type and expiry\n  (`ahpra.py:evaluate_ahpra_record()` + `_update_ahpra_fields()`). Re-check exists with a\n  1-hour cooldown (3 attempts/24h when unreadable) — **but only when\n  `AHPRA_SOURCE == 'desktop'`** (`recheck.py`). The post-expiry recheck on public\n  apply/accept (`state.py:197 queue_public_recheck()`) **also only fires on the desktop\n  source**; under the default ScrapingBee source (`settings.py:643`) nothing is queued.\n  So #184's KEEP text (\"a recheck after expiry on public apply or accept\") is **only\n  true on desktop**. There is still no scheduled register scan: the only beat entry is\n  `ahpra-overdue-alerts` every 15 min, which emails admins about *overdue desktop\n  checks* — it never re-reads the register (`settings.py:271`, `tasks.py:380`).\n  A mid-year suspension is therefore unseen until a lookup happens for another reason.\n- **Options:** **KEEP — Keep current logic:** Re-check button, plus a recheck after expiry\n  on public apply or accept (desktop only; inert on ScrapingBee). |\n  **A — Daily scan plus acceptance:** rescan workers with upcoming bookings daily; check\n  again at acceptance. | **B — Acceptance check only:** current when booked; no early\n  warning. | **C — Weekly register scan:** cheaper, but changes may be a week late.\n- **RECOMMENDED: A. Severity: Critical.** A daily scan of booked workers catches\n  suspensions early; acceptance-time re-check is the backstop. AHPRA calls the public\n  register the accurate source. B leaves pharmacies exposed between bookings; C leaves a\n  week's exposure. Cost note: a scan needs a lookup source that can run unattended —\n  see ON-P03 first (this is why P03 is asked before Q06 in the interview order).\n- **Normal case:** pharmacist renews on time → expiry passes → next public apply queues\n  a recheck (desktop) or nothing happens (ScrapingBee). **Edge case:** suspension\n  mid-registration-year → invisible until next lookup; existing bookings are only\n  cancelled when a lookup *does* run and returns Suspended. **Retry/concurrency:**\n  desktop checks dedupe via the active-check queue; ScrapingBee lookups retry 3× with\n  growing pauses (`ahpra.py`). **Notification:** admins emailed after 15 min overdue\n  (desktop only).\n- **Sources:** [state.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/state.py#L197-L224),\n  [recheck.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/recheck.py),\n  [settings.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/core/settings.py#L271-L275),\n  [settings.py (source)](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/core/settings.py#L643-L644),\n  [tasks.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/tasks.py#L380-L400)."}, {"id": "ON-P03", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-P03 — Which AHPRA lookup should run at launch?\n\n> **Also covers (22 Nov):** GM-18-Q12 (GM-18), GM26-Q11 (GM-26). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: Critical** — it decides\n  whether the Q03/Q06/Q07/P02 machinery works at all. **Ask this first (see §3).**\n- **Context:** A desktop verifier exists: a Chrome extension on an office PC reads the\n  register, with an AI repair fallback. The default and staging still use ScrapingBee.\n- **ACTUAL TODAY:** `AHPRA_SOURCE` defaults to `'scrapingbee'` (`settings.py:643`);\n  every desktop path is gated on `AHPRA_SOURCE == 'desktop'` (`desktop.py:90,125,131,159,171,246`;\n  `recheck.py`; `state.py:queue_public_recheck()`). ScrapingBee lookup still runs at\n  sign-up (`ahpra.py:ahpra_lookup()`, 3 retries) and sets `ahpra_verified` via\n  `evaluate_ahpra_record()`, so the *base* Verified gate works on either source — but\n  the fine-grained PR #183 handling (suspension auto-cancel, not-found/unreadable\n  states, Re-check, admin overdue alerts) is written against `AhpraCheck` rows produced\n  by the desktop flow. Whether the ScrapingBee path also writes usable `AhpraCheck`\n  rows was **not fully traced** (the task body was only partly read); #184's claim that\n  those gates stay inert under ScrapingBee is therefore carried as **unconfirmed**, not\n  as verified fact. Staging env value NOT INSPECTED.\n- **Options:** **KEEP — Keep current logic:** ScrapingBee, one lookup at sign-up; PR #183's\n  suspension handling may stay inactive. | **A — Desktop verifier:** office PC must stay\n  on; new sign-ups wait for it.\n- **RECOMMENDED: A — after a staging trial. Severity: Critical.** Only the desktop\n  source feeds the suspension, not-found and Re-check handling the other questions\n  assume. Run it on staging first (the deploy guide still leaves staging on\n  ScrapingBee, per #184 — not re-verified). If the office PC cannot stay on, the honest\n  fallback is KEEP **plus** accepting that Q06/Q07/P02's automatic protections do not run.\n- **Normal case:** sign-up → lookup → verified or review. **Edge case:** office PC off →\n  checks sit `pending`/`sent`, admins alerted after 15 min, sign-ups wait. **Retry:**\n  desktop checks have lease/claim/repair flows (`desktop.py`); ScrapingBee retries 3×.\n  **Legal impact:** a suspended pharmacist working while the register is unread is the\n  core liability this choice controls.\n- **Sources:** [settings.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/core/settings.py#L643-L647),\n  [desktop.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/desktop.py#L89-L106),\n  [ahpra.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/ahpra.py#L18-L75)."}, {"id": "ON-Q07", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q07 — If current registration cannot be confirmed, what happens to future bookings?\n\n> **Also covers (22 Nov):** GM26-Q12 (GM-26). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: High.**\n- **Context:** Not-found or unreadable results block new public applications but keep\n  existing bookings, and nobody else is told. Suspension is ON-P02 (ON-02).\n- **ACTUAL TODAY:** Confirmed in `state.py:apply_state_transition()`. `not_found /\n  unreadable / rejected` → `verified=False`, `ahpra_verified=False`, new public\n  applications blocked; existing bookings **kept**. Pharmacies are told only for\n  `rejected` (`announce_rejected_bookings()` — \"needs immediate resolution\"); for\n  `not_found`/`unreadable` nobody is told. `suspended` / `type_not_accepted` →\n  auto-cancel future public bookings + notify (ON-P02). A stored expiry alone does not\n  block anything — it only (on desktop) queues a recheck at next public apply/accept.\n- **Options:** **KEEP — Keep current logic:** block new public applications; keep\n  bookings; warn nobody. | **A — Keep bookings, warn both:** worker must resolve it\n  before starting. | **B — Cancel automatically:** fast, but risks cancelling during\n  renewal. | **C — Block new; review booked:** support verifies status and helps both sides.\n- **RECOMMENDED: C. Severity: High.** The code already blocks new commitments (the first\n  half of C). A stored expiry or unreadable page alone is not a lapse, so review existing\n  bookings and warn both sides rather than cancelling. B risks cancelling a pharmacist\n  mid-renewal; A leaves the pharmacy uninformed.\n- **Normal case:** renewal week → lookup unreadable → no new applications; booked shifts\n  stand pending review. **Edge case:** AHPRA page format change → every lookup\n  unreadable → all pharmacists blocked from *new* applications at once (support load).\n  **Payment side effect:** kept bookings still run their D02 payment deadlines; a\n  cancelled booking's fee/refund follows CX-Q20 (other area). **Notification:** only\n  `rejected` notifies pharmacies today.\n- **Sources:** [state.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/state.py#L239-L280)."}, {"id": "ON-P02", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-P02 — When the register shows Suspended or Cancelled, what happens?\n\n> **Also covers (22 Nov):** GM26-Q13 (GM-26). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: Critical.**\n- **Context:** The register status acts automatically. Pharmacist owners become Pharmacy\n  Managers; bookings with leave, attendance or invoice history are kept for admins.\n- **ACTUAL TODAY:** Confirmed. `apply_state_transition()` (`state.py:239`) on a\n  `suspended`/`type_not_accepted` transition: future public bookings cancelled and\n  pharmacies told; non-member workers paused account-wide (`ahpra_frozen()`); admins\n  emailed (`announce_suspension()`); owners switch to MANAGER (`ahpra_switched_to_manager`,\n  restored if a later check is `ok`). A non-General pharmacist result cancels bookings\n  without pausing (pause applies only to `suspended`). No fee or refund rule runs —\n  settle under CX-Q20. Whether `cancel_upcoming_assignments()` covers only public\n  bookings or also chain/org bookings was NOT traced (function lives in the feature\n  port, not read); #184's \"future public bookings\" is carried, not re-verified.\n- **Options:** **KEEP — Keep current logic:** auto-cancel future public bookings, pause\n  non-members, notify pharmacies and admins. | **A — Admin confirms, then cancel:** block\n  new bookings at once; cancel only after a person checks.\n- **RECOMMENDED: KEEP. Severity: Critical.** Working while suspended is unlawful, and an\n  exact register status rarely misreads; fast cancellation gives pharmacies time to\n  refill. A adds a human delay to the highest-risk case.\n- **Normal case:** suspension lands → bookings cancelled, pharmacy notified, refill starts.\n  **Edge case:** suspension reversed on appeal → owner role restores automatically on\n  an `ok` check; cancelled bookings are *not* restored (refill already happened).\n  **Payment side effect:** cancelled confirmed bookings may carry fees/refunds — no rule\n  runs today; that is CX-Q20's decision, not this one. **Wrong tenant:** a member's\n  suspension notifies *their* pharmacies only (`announce_member_suspension()`).\n- **Sources:** [state.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/state.py#L239-L330)."}, {"id": "ON-Q08", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q08 — Who must pass an ID check?\n\n> **Also covers (22 Nov):** Q-15 (GM-05), GM-24-Q06 (GM-24), GM26-Q07 (GM-26). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: High.**\n- **Context:** ID is only part of Verified for overseas Explorers. ID reading (OCR) already\n  works for everyone.\n- **ACTUAL TODAY:** Confirmed. `policy.py:mobile_waived()` + `requirements()` — ID is\n  required only for overseas Explorers who skipped the mobile check. A setting can add\n  ID to Verified for everyone (`VERIFICATION_EXTRA_REQUIREMENTS` containing `gov_id`,\n  `settings.py:245`) but it is off by default (env empty). Azure OCR exists\n  (`verification/documents.py:azure_ocr()`, PDF first-page → PNG) — the *utility* was\n  read; the per-role wiring that calls it (in `tasks.py`) was only partly read, so \"OCR\n  works for all\" is confirmed for the utility, not for every screen.\n- **Options:** **KEEP — Keep current logic:** ID only for overseas Explorers who skip the\n  mobile check. | **A — Every worker before first booking:** one check, reused for every\n  pharmacy. | **C — Pharmacists and ABN workers only:** skips employed support staff.\n- **RECOMMENDED: A. Severity: High.** Today most workers are never ID-checked. Clipboard,\n  Hireup and Relief Buddy check government ID before work; the OCR and the on/off setting\n  already exist, so this is a gate change, not new tooling. Note the interaction with\n  ON-R01: turning ID on for everyone multiplies the retained evidence (set the retention\n  rule in the same decision).\n- **Normal case:** worker uploads ID once, verified, books anywhere. **Edge case:**\n  overseas Explorer with no AU mobile → ID is the *only* identity check; a forged ID\n  passes only if OCR + review miss it (review path NOT INSPECTED). **Web/Expo\n  difference:** upload screens NOT INSPECTED.\n- **Sources:** [policy.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/policy.py#L52-L78),\n  [settings.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/core/settings.py#L245-L249),\n  [documents.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/documents.py)."}, {"id": "ON-R01", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-R01 — How long should verification evidence be kept?\n\n> **Also covers (22 Nov):** GM26-Q06 (GM-26). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: Medium (legal/privacy).**\n- **Context:** Identity and qualification files are collected, but no evidence-specific\n  deletion schedule is documented.\n- **ACTUAL TODAY:** Confirmed as far as inspected: no retention/deletion schedule for\n  verification evidence was found in the inspected files (no retention constants in\n  `onboarding/tasks.py`, `core/settings.py`, `talent/models.py`; `AhpraCheck` snapshots\n  including `register_data` are kept with no deletion date seen). Wider retention policy\n  may live in GM-26 docs — NOT INSPECTED. (Audit gap ON-12 was named in #184 but its\n  text is not in the AUDIT.md file as retrieved; the question itself is the record.)\n- **Options:** **KEEP — Keep current logic:** retain files without a defined deletion\n  trigger. | **A — Delete after verification:** keep result, source and audit dates only.\n  | **B — Keep seven years:** higher breach impact; needs legal basis.\n- **RECOMMENDED: A. Severity: Medium.** APP 11 requires destruction or de-identification\n  when information is no longer needed. Set evidence-class schedules and retain only the\n  verification audit record unless law requires more. B needs a named legal basis before\n  it can be chosen; get qualified privacy advice before picking B.\n- **Normal case:** ID verified → file deleted on schedule, audit row kept. **Edge case:**\n  a disputed verification needs the file after deletion → the audit row (result, source,\n  dates) is the evidence. **Legal impact:** retaining ID documents indefinitely is the\n  breach-exposure risk; deleting too early is the dispute-evidence risk.\n- **Sources:** (negative finding — no schedule in inspected files) [tasks.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/tasks.py),\n  [settings.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/core/settings.py)."}, {"id": "ON-Q09", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q09 — Which workers must prove professional indemnity cover?\n\n> **Also covers (22 Nov):** GM26-Q14 (GM-26). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: High (legal).**\n- **Context:** No insurance field, evidence or expiry gate exists (ON-03).\n- **ACTUAL TODAY:** Confirmed. Zero matches for \"insurance\"/\"indemnity\" in the inspected\n  backend (`onboarding/models.py`, `organizations/models.py`, `shifts/engagement.py`,\n  fetched `onboarding/` tree). No field, no upload, no expiry, no gate, no badge.\n  (#184 cited a comment in `onboarding/services/skills.py:61`; that file was not fetched\n  at this head, so the comment is not re-verified — the *absence of any field* is\n  verified from the models.)\n- **Options:** **KEEP — Keep current logic:** collect no insurance evidence. |\n  **A — ABN pharmacists only:** misses practising employee and provisional registrants. |\n  **B — All practising pharmacists:** General, limited or provisional; own or third-party\n  cover. | **C — Badge only:** show cover but never gate bookings.\n- **RECOMMENDED: B. Severity: High.** The Pharmacy Board standard applies to practising\n  pharmacists with general, limited or provisional registration, whether cover is\n  personal or provided by an employer. ABN status is not the test — A misses employed\n  pharmacists whose employer cover may not extend to locum work, and misses provisional\n  (intern) registrants entirely. This needs qualified legal confirmation before launch;\n  do not treat the recommendation as legal advice.\n- **Normal case:** pharmacist uploads certificate of currency with expiry; expiry blocks\n  new bookings. **Edge case:** employer-provided cover that does not extend to locum\n  shifts → worker must hold own cover. **Payment/notification:** an expiry gate needs\n  the same re-check machinery as AHPRA (see ON-Q06) or it goes stale the same way.\n- **Sources:** [onboarding/models.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/models.py) (no insurance field),\n  [engagement.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/shifts/engagement.py) (no insurance in terms)."}, {"id": "ON-Q10", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q10 — How should super show on ABN contractor terms?\n- **Validation: SETTLED — DO NOT RE-ASK.** **Decision status: SETTLED (keep current logic).**\n- **Context:** Engagement terms split TFN casual (Award floor) from ABN contractor. ABN\n  terms were said never to mention super.\n- **ACTUAL TODAY:** The premise is out of date (as #184 itself noted). ABN terms carry\n  `super_notice`: \"Invoice settlement does not by itself remove superannuation\n  obligations. The pharmacy/principal must review whether super is payable for a\n  labour-only contractor.\" (`engagement.py:734`), plus `super_review_required: True` and\n  `super_payable_confirmed: False`. TFN terms carry the Award/super relationship\n  notices (`engagement.py:697-716`).\n- **Options (recorded, not re-asked):** **KEEP — Keep current logic:** keep the existing\n  super warning in ABN terms. | B — Say contractor handles own super (simple, but may be\n  wrong for some workers). | C — Ask counsel first; nothing at launch.\n- **RECOMMENDED: KEEP.** Today's notice already says what B proposed and matches the ATO\n  rule that labour-only contractors can be owed super. Re-open only if counsel advises\n  different wording (GM-14 owns the wording).\n- **Sources:** [engagement.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/shifts/engagement.py#L720-L737)."}, {"id": "ON-Q11", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q11 — What must a pharmacy pass before posting to outside workers?\n\n> **Also covers (22 Nov):** GM-03-Q01 (GM-03), GM-04-Q03 (GM-04), GM-10-Q08 (GM-10), GM-24-Q07 (GM-24), GM25-C06 (GM-25). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: Critical.**\n- **Context:** Pharmacy-verified and ABN-verified flags exist, but posting checks neither.\n  Workers can accept shifts from unverified sites (ON-06).\n- **ACTUAL TODAY:** Confirmed. `post_shift()` (`posting.py:62`) checks neither\n  `Pharmacy.verified` (`organizations/models.py:135`) nor `abn_verified` (`:236`); any\n  pharmacy can post to every tier including public. (Where `Pharmacy.verified` *is* read\n  — #184 said only the ethical marketplace — was NOT re-verified; the flag's readers\n  were not traced.)\n- **Options:** **KEEP — Keep current logic:** no pharmacy checks before posting to any\n  tier. | **B — ABN verified for any outside post:** automatic ABN check only. |\n  **C — ABN plus admin check before public:** a person reviews the site before public\n  posting. | **D — B for chain/org, C for public:** ABN for chain and organisation tiers;\n  admin check too for public.\n- **RECOMMENDED: D. Severity: Critical.** Today a fake site can post publicly and be\n  accepted. Locumate activates pharmacy accounts only after review; chain and\n  organisation workers already know the site, public workers do not. D is the\n  proportionate split — automatic for known audiences, human for strangers.\n- **Normal case:** real pharmacy, ABN verified → posts to chain/org at once; public after\n  admin check. **Edge case:** new pharmacy, ABN check failing (name mismatch) → cannot\n  post outside at all; needs a support path. **Payment side effect:** none until a\n  booking is made; but an unverified pharmacy's bookings still open Stripe checkouts\n  today. **Web/Expo difference:** posting screens NOT INSPECTED on either client.\n- **Sources:** [posting.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/shifts/posting.py#L62-L120),\n  [organizations/models.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/organizations/models.py#L135-L236)."}, {"id": "ON-Q12", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q12 — Which site brief fields are required before the first post?\n\n> **Also covers (22 Nov):** GM-03-Q02 (GM-03). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: Medium.**\n- **Context:** The pharmacy record holds site details, hours, documents and rates.\n  Software, staffing, parking and arrival steps are not structured fields.\n- **ACTUAL TODAY:** Confirmed at model level. `Pharmacy` has optional `software` (JSON,\n  skill-registry codes), `services` (JSON), `script_volume_weekday/weekend` (band codes)\n  — all `blank=True` (`organizations/models.py:191-197`). No parking, arrival-steps or\n  named-contact field exists (only email + address). Whether the web/mobile forms\n  *require* any of these was NOT INSPECTED; nothing in the model enforces it.\n- **Options:** **KEEP — Keep current logic:** all brief fields optional; parking and\n  arrival have no field. | **A — Core: software, staffing, parking, contact:** each shift\n  copies them and can override. | **C — Full brief incl. script volume:** also services\n  and weekday/weekend script volumes.\n- **RECOMMENDED: A. Severity: Medium.** Software and script volume exist but are optional,\n  and parking, contact and arrival are missing. Locumate collects software, services and\n  contacts at setup and Relief Buddy filters by software; core required fields stop most\n  mismatches (wrong software is the classic first-shift failure).\n- **Normal case:** locum arrives knowing software, parking, who to ask for. **Edge case:**\n  multi-site owner — fields are per-pharmacy, so each site needs its own brief (correct).\n  **Web/Expo difference:** NOT INSPECTE
