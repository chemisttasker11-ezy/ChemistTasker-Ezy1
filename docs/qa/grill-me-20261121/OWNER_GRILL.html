D.\n- **Sources:** [organizations/models.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/organizations/models.py#L191-L197)."}, {"id": "ON-Q13", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q13 — Should pharmacies save a payment method during setup?\n\n> **Also covers (22 Nov):** GM-03-Q03 (GM-03), GM13-Q10 (GM-13), GM16-Q05 (GM-16), GM25-C07 (GM-25). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: High.**\n- **Context:** Every booking opens a new Stripe Checkout; no card is stored. Under D02 a\n  shift under 2 hours away leaves 30 minutes to pay (ON-08).\n- **ACTUAL TODAY:** Confirmed as far as inspected. `billing/views.py` at this head\n  (`charge_shift_fulfillment`, `charge_penalty` still present) opens a checkout per\n  booking; **no saved-card / SetupIntent / Stripe Customer payment-method storage was\n  found in the inspected billing files** — but the billing module has been split since\n  #184 (`checkout_reservations.py` etc.) and was **not fully traced**; the full\n  checkout flow is GM-16's to verify. Billing is live with no trial:\n  `BILLING_LIVE_DATE = 2025-06-01` with the stale comment \"June 1, 2026\" and\n  `FREE_TRIAL_DAYS = 0` (`settings.py:679-682`) — unchanged since the audit.\n- **Options:** **KEEP — Keep current logic:** one Stripe checkout per booking; no stored\n  card. | **B — Save card, charge on acceptance:** confirms in seconds; payment is still\n  verified per D01. | **C — Saved card for subscribers only:** others keep one checkout\n  per booking.\n- **RECOMMENDED: B. Severity: High.** Today urgent shifts often expire unpaid inside the\n  30-minute window. Sidekicker requires a card before the first hire and Mable needs\n  payment details before booking. B needs a Stripe customer + off-session payment design\n  (GM-16) and a clear refund path (GM-17); do not build it as part of GM-02.\n- **Normal case:** owner saves card at setup → acceptance confirms in seconds. **Edge\n  case:** card expired/declined at acceptance → reservation must fall back to a fresh\n  checkout inside the D02 window, not silently fail. **Payment side effect:** stored\n  cards change the chargeback/refund surface; keep the per-booking verification (D01).\n- **Sources:** [billing/views.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/billing/views.py#L140-L240),\n  [settings.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/core/settings.py#L679-L682)."}, {"id": "ON-Q14", "area": "GM-02", "plat": "Web + Expo", "md": "#### ON-Q14 — How do organisations (multi-site groups) join?\n\n> **Also covers (22 Nov):** GM-03-Q04 (GM-03), GM-04-Q01 (GM-04), Q-13 (GM-05). Asked once, here.\n- **Validation: STILL VALID.** **Decision status: OPEN. Severity: Medium.**\n- **Context:** Only a platform admin can create an organisation. There is no organisation\n  sign-up, and the web create page is not routed (ON-07).\n- **ACTUAL TODAY:** Confirmed for the backend. `OrganizationViewSet.get_permissions()`\n  (`organizations/views.py:59-63`) — `create` requires `IsAdminUser()`; there is no\n  ORGANIZATION signup role (`users/models.py:50`). Organisations then claim or invite\n  pharmacies by email (`PharmacyClaim`, `organizations/models.py:261`). The web create\n  page's routing was NOT INSPECTED at this head.\n- **Options:** **KEEP — Keep current logic:** platform admin creates every organisation;\n  no self sign-up. | **B — Self-serve, waits for approval:** new sign-up role plus an\n  admin review queue. | **C — Self-serve, instant access:** no review; highest risk.\n- **RECOMMENDED: KEEP. Severity: Medium.** Sales-led setup is what Patchwork does and\n  suits the few groups joining at launch. Only the unrouted create page needs deleting\n  (a cleanup, ON-05 — NOT re-verified), not a logic change.\n- **Normal case:** group admin emails sales → platform admin creates org → org invites\n  its pharmacies. **Edge case:** a group tries to self-register → no role exists; they\n  hit a dead end unless sales contact is shown. **Web/Expo difference:** NOT INSPECTED.\n- **Sources:** [organizations/views.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/organizations/views.py#L59-L66),\n  [users/models.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/users/models.py#L50)."}, {"id": "GM02-Q21", "area": "GM-02", "plat": "Web + Expo", "md": "#### GM02-Q21 — Should a manager be warned or blocked from offering a shift to an unverified or suspended worker?\n- **Type: decision. Severity: High. Decision status: OPEN.**\n- **ACTUAL TODAY:** Ordinary offer creation checks public shifts. Dedicated offer creation uses a different path. The shared guard skips non-public shifts (`pr257:backend/shifts/base.py:348`, `pr257:backend/shifts/posting.py:159`, `pr257:backend/onboarding/verification/state.py:174`). The booking check is settled in ON-Q03. The open detail is what the manager sees or can send before an outside worker accepts where the creation path still permits the offer.\n- **Options:** A — Show readiness and let the manager send the offer while the worker finishes checks. B — Stop the offer for a suspended or not-found worker and warn when verification is incomplete.\n- **RECOMMENDED: B.** Blocking suspended workers stops the platform sending booking\n  emails to people who cannot legally work; warning (not blocking) unverified workers\n  preserves the case where verification completes before accept. A alone still lets\n  managers book suspended workers by mistake.\n- **Normal case:** manager offers to a verified locum → no friction. **Edge case:**\n  favourite locum suspended yesterday → offer blocked, manager sees why, picks someone\n  else. **Notification side effect:** fewer dead offer emails; suspended workers stop\n  receiving offers they cannot accept. **Wrong tenant:** an offer to a worker from\n  another pharmacy is unaffected by this question (audience rules are GM-11).\n- **Sources:** [assignment.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/shifts/assignment.py#L25-L29)."}, {"id": "GM02-Q22", "area": "GM-02", "plat": "Web + Expo", "md": "#### GM02-Q22 — Should a passed AHPRA expiry date itself block new public applications, even without a fresh lookup?\n- **Type: decision. Severity: High. Decision status: OPEN.**\n- **ACTUAL TODAY:** `ahpra_expiry_date` is stored (`ahpra.py:_update_ahpra_fields()`)\n  but is **not** enforced at apply or accept. The apply-time gate reads the latest\n  `AhpraCheck.register_data` (`state.py:ahpra_state()`), not the stored date. The\n  stored date only (a) triggers a desktop recheck queue *after* expiry on public\n  apply/accept (`state.py:queue_public_recheck()`), and (b) blocks talent-board\n  publishing for pharmacists (`talent/views/explorer.py:170`). Under ScrapingBee, (a)\n  never fires. So a pharmacist whose registration expired last month can keep applying\n  until some lookup happens to run.\n- **Options:** **KEEP — Keep current logic:** expiry alone blocks nothing at apply/accept. |\n  **A — Expiry blocks new public applications:** stored expiry past → same refusal as\n  an unreadable result, until a fresh lookup confirms current registration; existing\n  bookings kept, both sides warned. | **B — Expiry triggers a same-day lookup and a\n  warning, but does not block:** worker must re-verify before the shift starts.\n- **RECOMMENDED: A.** An expiry date is the register's own statement of currency; the\n  platform already has it. A renewal in progress is handled by the fresh lookup, not by\n  leaving the gate open. B leaves the same hole Q06 is trying to close.\n- **Normal case:** registration renewed → fresh lookup → `ok`, no interruption. **Edge\n  case:** pharmacist renews the day before a shift; lookup lags → blocked from *new*\n  applications, existing booking kept and warned (per Q07/C). **Retry:** Re-check button\n  (desktop) / next signup-style lookup is the recovery path.\n- **Sources:** [state.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/state.py#L30-L80),\n  [ahpra.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/ahpra.py#L280-L310),\n  [explorer.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/talent/views/explorer.py#L156-L173)."}, {"id": "GM02-Q23", "area": "GM-02", "plat": "Web + Expo", "md": "#### GM02-Q23 — Should intern talent posts get the same AHPRA-expiry check pharmacist posts get?\n- **Type: decision (small). Severity: Medium. Decision status: OPEN.**\n- **ACTUAL TODAY:** Talent publish (`talent/views/explorer.py:156-173`) checks\n  `ahpra_verified` + `ahpra_expiry_date` only when `user.role == \"PHARMACIST\"`.\n  Interns are OTHER_STAFF: they need `verified` (which includes AHPRA via\n  `policy.requirements()`), but no expiry check runs at publish — and interns store\n  their expiry in the `AhpraCheck.register_data`, not on the profile\n  (`state.py:queue_public_recheck()` comment: \"Other-staff (intern) profiles have no\n  expiry column\"), so the profile-level check could not run as written anyway.\n- **Options:** **KEEP — Keep current logic:** interns publish on Verified alone. |\n  **A — Same expiry check for interns:** read expiry from the latest check; block\n  publish when expired. | **B — Interns cannot publish availability posts:** pharmacist\n  and Explorer posts only.\n- **RECOMMENDED: A.** Interns practise under provisional registration; an expired\n  provisional registration is the same trust problem as an expired general one. B is\n  disproportionate — interns are a real locum pipeline.\n- **Sources:** [explorer.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/talent/views/explorer.py#L156-L173),\n  [policy.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/policy.py#L52-L78)."}, {"id": "GM02-Q24", "area": "GM-02", "plat": "Web + Expo", "md": "#### GM02-Q24 — Who may skip the Australian mobile check, and what must they prove instead?\n- **Type: decision (small). Severity: Medium. Decision status: OPEN.**\n- **ACTUAL TODAY:** `policy.py:mobile_waived()` — only EXPLORER + `user.mobile_check_skipped`\n  may skip mobile, and then `gov_id_verified` is required instead. Who sets\n  `mobile_check_skipped`, and what proof is needed to set it, was NOT traced (flag\n  setter not found in inspected files). Onshore workers with no AU mobile number have\n  no skip path in the inspected code.\n- **Options:** **KEEP — Keep current logic:** overseas newcomers only; ID instead of\n  mobile. | **A — Any worker may skip with verified ID:** onshore users without an AU\n  mobile can verify by ID. | **B — No skip at all:** everyone verifies an AU mobile.\n- **RECOMMENDED: KEEP**, provided the flag-setter is an admin/support action with a\n  recorded reason (verify this when the flag is traced). A widens the ID-fraud surface\n  without a need shown; B locks out genuine overseas newcomers.\n- **Sources:** [policy.py](https://github.com/chemisttasker11-ezy/ChemistTasker-Ezy1/blob/97c4543e051b43fe30ec7e2e61ad3d69957a918e/backend/onboarding/verification/policy.py#L52-L60).\n\n---"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Sign up role selection | Visitor selects from OWNER, PHARMACIST, OTHER_STAFF, or EXPLORER roles (`frontend_web/src/pages/register.tsx:26`). | Visitor selects from identical four role tracks (`frontend_mobile/app/register.tsx:37`). | Yes | — |\n| Mobile OTP verification gate | Worker verifies Australian mobile or skips if overseas Explorer (`frontend_web/src/pages/MobileOTPVerify.tsx:254`). | Worker enters 6-digit SMS OTP or confirms overseas waiver (`frontend_mobile/app/mobile-verify.tsx:105`). | Yes | — |\n| Enter AHPRA registration number | Staff onboarding collects AHPRA number for interns and pharmacists (`frontend_web/src/pages/onboarding/onboarding_staff/RegulatoryV2.tsx:153`). | Other-staff regulatory tab collects and validates AHPRA registration number (`frontend_mobile/roles/otherstaff/profile-tabs/RegulatoryScreen.tsx:111`). | Yes | — |\n| Pharmacist onboarding profile | Pharmacist enters profile bio, qualifications, and work history (`frontend_web/src/pages/onboarding/onboarding_pharmacist/BasicInfoV2.tsx:66`). | Pharmacist enters personal and professional details in mobile onboarding (`frontend_mobile/roles/pharmacist/onboarding.tsx:64`). | Yes | — |\n| Explorer basic info & Gov ID | Newcomer Explorer fills profile and submits government ID (`frontend_web/src/pages/onboarding/ExplorerOnboarding.tsx:98`). | Explorer completes identity verification on mobile profile screen (`frontend_mobile/roles/explorer/profile-tabs/IdentityScreen.tsx:27`). | Yes | — |\n| Payment & banking setup | Worker chooses ABN or TFN payment and enters super details (`frontend_web/src/pages/onboarding/onboarding_pharmacist/PaymentV2.tsx:65`). | Worker chooses ABN or TFN payment and enters super details (`frontend_mobile/roles/pharmacist/profile-tabs/PaymentScreen.tsx:30`). | Yes | Corrected 22 Nov (orchestrator review): neither onboarding asks for bank details; bank details are entered on invoices. |\n| Shift application verification check | Public shift board blocks unverified workers from applying (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:277`). | Worker home logic evaluates missing verification steps before allowing applications (`frontend_mobile/roles/shared/shifts/PublicShiftsView.tsx:284`). | Yes | — |", "file": "areas/GM-02-worker-onboarding-credentials.md"}, {"key": "GM-05", "row": "1", "title": "GM-05 Roles/membership", "qs": [{"id": "Q-04", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-04 — [NEW] When a pharmacy invites someone with no account, should they become an active member immediately?\n- **Status:** Merged into GM-05-W01. Ask there once.\n- **Sources:** `backend/memberships/invites.py` `create_membership_invite()` (the `if user_created or activate_immediately` branch); `backend/memberships/models.py` `Membership.Status`.\n- **ACTUAL TODAY:** Yes — today a brand-new person is created with a random password and their membership is **ACCEPTED and active at once**, before they have logged in, verified email or mobile, or proved anything about themselves. They get a password-set magic link by email. Separately, an existing user who is invited stays **PENDING** until they accept — unless the inviter passes `activate_immediately=true`, which also skips consent.\n- **RECOMMENDED — Change: pending until the person accepts (and verifies email). Severity: HIGH.** A membership is a trust relationship: it unlocks the AHPRA exemption (Q-01), staff-tier shift visibility, and internal access. Granting it to an unverified email address — including a mistyped address, which would hand a stranger membership of a real pharmacy — is the wrong default. Benefits: no stranger-members; the invite flow matches what the worker sees (accept/reject). Risks: one extra click before a new starter can be rostered; managers must chase acceptance. Legal: reduces impersonation / wrongful-access exposure. Financial: none.\n- **ALTERNATIVE A — Keep current logic (immediate activation for new accounts).** Scenario: a manager invites a locum who has never used the platform; the locum clicks the magic link, sets a password, and is already on the roster for tomorrow. Trade-off: fastest onboarding for genuine starters; but a typo'd email activates a stranger, and the \"member\" has passed no check at all.\n- **ALTERNATIVE B — Immediate activation, but limited until first login + email verification.** Scenario: as in A, but the membership is active for rostering only after the magic link is used and email verified; until then it shows as \"invited — not yet active\". Trade-off: keeps speed, closes the stranger problem; needs a new intermediate state or a flag.\n- **ALTERNATIVE C — Immediate activation only for staff (FULL_TIME/PART_TIME/CASUAL), pending for favourites.** Scenario: a new full-time hire is active at once; a new favourite locum must accept first. Trade-off: matches the trust difference between employee and contractor; two rules to explain.\n- **Other / defer.** Edge cases: the magic link expires (Django token timeout — exact value **not inspected** in settings) while the membership stays active forever — define link expiry vs membership expiry separately. Retry/concurrency: re-inviting the same email is blocked while PENDING, but a *created-but-never-logged-in* account is ACCEPTED, so a second invite says \"already a member\". Denied role: the new account's role is *derived* from the membership role (PHARMACIST→PHARMACIST, INTERN/STUDENT/ASSISTANT/TECHNICIAN→OTHER_STAFF, anything else→**EXPLORER**) — a CONTACT invite silently creates an Explorer. Payment/notification: the new-user email is the only notice; no in-app notification exists until the account is used."}, {"id": "Q-05", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-05 — [NEW] Should a direct email invite ever expire, and can it be revoked?\n- **Status:** OPEN — REVALIDATED (new since #184).\n- **Sources:** `backend/memberships/models.py` `Membership` (no expiry field), `MembershipInviteLink` (`expires_at`, `is_valid()`); `backend/memberships/invites.py` `create_membership_invite()`.\n- **ACTUAL TODAY:** A direct email invite (PENDING membership) **never expires** and no revoke/withdraw action was found in the files inspected. The *other* invite mechanism — multi-use invite links — **does** expire (`expires_at` + `is_valid()`), but its expiry has no default (see Q-08). So today a forgotten invite from months ago can still be accepted, and a manager who invited the wrong person has no \"undo\" except removing the membership afterwards (Q-09).\n- **RECOMMENDED — Add a 7-day expiry + a revoke action. Severity: MEDIUM.** Benefits: stale invites cannot be accepted after the pharmacy has moved on; a wrong-email invite stops being a live door. Risks: genuine slow responders must be re-invited; a small amount of build. Legal/financial: minimal; reduces unauthorised-access window.\n- **ALTERNATIVE A — Keep current logic (never expires, no revoke).** Scenario: a locum accepts an invite sent 4 months ago for a pharmacy that has since changed hands. Trade-off: zero build; the risk above stays.\n- **ALTERNATIVE B — 30-day expiry, no revoke.** Scenario: as above, but only within a month. Trade-off: less build than a revoke action; a wrong invite still lives for a month.\n- **ALTERNATIVE C — Expiry matches the invite-link default (whatever Q-08 decides), plus revoke.** Scenario: one expiry rule for both invite mechanisms. Trade-off: most consistent; ties this decision to Q-08.\n- **Other / defer.** Edge: what happens to an invite accepted *after* the pharmacy's circumstances changed (e.g. ownership)? Retry: re-inviting after expiry must create a fresh invite, not resurrect the old one. Notification: expiry should notify the inviter (or not — decide). Web/Expo: both show the same membership list, so expiry must be enforced backend-side."}, {"id": "Q-06", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-06 — [NEW] Who can create ORG_STAFF accounts and organisation memberships, and what does REGION_ADMIN actually scope?\n- **Status:** OPEN — REVALIDATED (new since #184; org-role mechanics partly not inspected).\n- **Sources:** `backend/users/models.py` `User.ROLE_CHOICES`, `OrganizationMembership`; `backend/memberships/access.py` `user_can_invite_members_to_pharmacy()` (org capability checks); `backend/users/org_roles.py` — **NOT INSPECTED**.\n- **ACTUAL TODAY:** ORG_STAFF is a real account role but **not self-registrable**. Organisation memberships carry one of ORG_ADMIN / CHIEF_ADMIN / REGION_ADMIN, a free-text `region`, a pharmacy `admin_level` (default MANAGER), and an M2M list of scoped pharmacies. Invite/change/decide authority for a pharmacy checks org capabilities (`INVITE_STAFF` / `MANAGE_STAFF` / `MANAGE_ADMINS`) *and* whether the membership \"covers\" that pharmacy. But **who creates the ORG_STAFF account, who grants the org role, and what REGION_ADMIN's region limits** were not found in the files inspected.\n- **RECOMMENDED — Define it before launch: org admins create ORG_STAFF accounts by invite; REGION_ADMIN is scoped to pharmacies in their named region only; CHIEF_ADMIN is org-wide and is the only org role that can grant org roles. Severity: MEDIUM.** Rationale: today the power exists in code with no visible front door, which means it will be done by support/DB or not at all. Benefits: groups can actually run themselves; scoping prevents a region admin acting org-wide. Risks: if the region is free text, scoping is unenforceable — regions need a controlled list. Legal/financial: org admins acting outside their scope could invite staff to pharmacies they don't run.\n- **ALTERNATIVE A — Keep current logic (undefined / platform-admin-led).** Scenario: a chain asks for a regional manager account; support creates it manually. Trade-off: works for the few groups at launch (consistent with ON-Q14's sales-led org setup); does not scale and leaves the capability checks as dead code.\n- **ALTERNATIVE B — Self-serve org signup with admin approval (mirrors ON-Q14 option B).** Trade-off: consistent with a future self-serve org story; more build and approval workflow.\n- **Other / defer.** Edge: an org member whose `pharmacies` M2M list is empty — covers nothing, or everything? (The `membership_covers_pharmacy()` semantics are **not inspected** — this must be answered from code before the owner decides.) Denied role / wrong tenant: an org admin of Chain X inviting into a pharmacy of Chain Y must be denied — the code checks `organization_id` match, but the exact denial response was not inspected."}, {"id": "Q-07", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-07 — [NEW] A Manager has exactly the same powers as the Owner. Keep that?\n- **Status:** OPEN — REVALIDATED.\n- **Sources:** `backend/access_control/pharmacy_roles.py` `PharmacyAdminPolicy.CAPABILITY_MATRIX`; `backend/organizations/models.py` `PharmacyAdmin.can_be_removed_by()`, `clean()`.\n- **ACTUAL TODAY:** MANAGER holds **all four** capabilities — MANAGE_ADMINS, MANAGE_STAFF, MANAGE_ROSTER, MANAGE_COMMUNICATIONS — identical to OWNER. The only owner protections are: the owner's own admin record cannot be demoted, and owners cannot be removed by other admins. So a Manager can appoint/remove other Managers and Roster/Communication Managers, manage all staff, and run the roster — everything except touching the owner's own record.\n- **RECOMMENDED — Change: MANAGER keeps staff + roster + comms, but loses MANAGE_ADMINS (or can manage only ROSTER/COMMUNICATION managers, never other MANAGERs). Severity: MEDIUM-HIGH.** Rationale: \"manager\" that can mint other managers is effectively a co-owner with no ownership accountability; a disgruntled or mistaken Manager can lock the owner out of their own admin team (not the pharmacy — the owner record is protected — but the team around it). Benefits: least-privilege, matches the plain meaning of the words. Risks: owners who genuinely run a pharmacy through a Manager must do admin appointments themselves; a small workflow cost. Legal/financial: reduces insider-risk exposure.\n- **ALTERNATIVE A — Keep current logic (MANAGER = OWNER in powers).** Scenario: an owner on leave leaves a Manager fully in charge, including appointing a weekend Roster Manager. Trade-off: maximum delegation; the owner must trust the Manager completely, because the system does.\n- **ALTERNATIVE B — Add a distinct \"Owner-delegate\" level and demote MANAGER to staff+roster+comms.** Scenario: as in A, but only a named delegate gets admin powers. Trade-off: clearest, but a new level to build and explain.\n- **Other / defer.** Edge: two Managers disagreeing — today either can remove the other (first mover wins); under the recommendation, neither can. Concurrency: simultaneous admin changes are not serialised in the code inspected — check `membership_operations` (✘ NI). Denied role: ROSTER_MANAGER and COMMUNICATION_MANAGER correctly lack staff/admin powers today. Web/Expo: admin screens must hide what the capability matrix denies — both apps must read the same matrix."}, {"id": "Q-08", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-08 — [NEW] Invite links: who can generate them, how long do they live, and what stops abuse?\n- **Status:** OPEN — REVALIDATED (new flow; views not inspected).\n- **Sources:** `backend/memberships/models.py` `MembershipInviteLink`, `MembershipApplication`; `backend/memberships/serializers.py` `MembershipInviteLinkSerializer`, `MembershipApplicationSerializer`, `MembershipApplicationReviewSerializer`.\n- **ACTUAL TODAY:** An Owner/Org Admin/Pharmacy Admin can generate a **multi-use** magic link per pharmacy per category (full/part-time vs locum/casual). Candidates submit name, mobile, date of birth, role and award details; each submission is an application the owner approves/rejects; approval creates the membership via the normal invite email flow. The link has an `expires_at` and an `is_active` flag — but **no default expiry is set anywhere inspected**, and who may generate/revoke a link (which endpoint, which permission) was not inspected (views ✘ NI).\n- **RECOMMENDED — Default 14-day expiry, one link per pharmacy+category at a time (regenerating invalidates the old one), owner/admin-only generation, revoke action. Severity: MEDIUM.** Benefits: a shared link cannot circulate forever; one live link is auditable. Risks: a link shared in a group chat still admits anyone who applies — approval is the real gate, so the risk is spam applications, not unauthorised membership. Legal/financial: applications collect date of birth — retention/privacy handling must be defined (GM-26), and rejected applications should not keep personal data indefinitely.\n- **ALTERNATIVE A — Keep current logic (expiry as supplied, multi-use, no stated default).** Scenario: a link posted in a staff Facebook group in January is still accepting applications in June. Trade-off: zero build; the exposure above stays.\n- **ALTERNATIVE B — Single-use links.** Scenario: each candidate gets their own link. Trade-off: kills the \"share one link\" convenience that justifies the feature; use direct invites instead.\n- **Other / defer.** Edge: duplicate applications from the same person (unique `pending_identity_key` dedupes by identity — exact fields ✘ NI). Retry: re-applying after rejection — allowed? Unknown. Notification: owner notified of a new application? ✘ NI. Web/Expo: the application form is a public (signed-out?) page — confirm auth requirements before launch."}, {"id": "Q-09", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-09 — [NEW] What happens when a member is removed — bookings, roster, history?\n- **Status:** OPEN — REVALIDATED (removal mechanics confirmed; downstream effects not inspected).\n- **Sources:** `backend/memberships/models.py` `Membership.remove()`, `revoke_admin_access()`; `backend/memberships/access.py` `user_can_change_membership()`.\n- **ACTUAL TODAY:** Removing a member revokes their admin access, **deletes their chat participations** (messages preserved), and deletes the membership row — or deactivates it if employment history protects the row. What happens to their **future confirmed bookings, roster entries, pending offers, or favourite status** was not found in the files inspected. The owner's own membership cannot be changed/removed through the generic endpoint.\n- **RECOMMENDED — Removal blocks new bookings immediately, keeps history, and forces a decision on future confirmed bookings (cancel with notice, or keep with a warning). Severity: MEDIUM.** Rationale: silently keeping a removed person's confirmed shifts is worse than either clean option. Benefits: no ghost workers on the roster; audit trail intact. Risks: requires a booking-cancellation path that interacts with the cancellation-fee decisions (P09) — do not invent fees here. Legal/financial: a removed employee's future shifts are a pay/cover problem, not a membership problem — surface it, don't hide it.\n- **ALTERNATIVE A — Keep current logic (remove only; downstream effects as the code happens to do).** Scenario: a dismissed casual is removed on Friday; she still holds a confirmed Saturday locum shift at the same pharmacy. Trade-off: zero build; the Saturday surprise is the cost.\n- **ALTERNATIVE B — Removal is blocked while future confirmed bookings exist (manager must cancel/reassign first).** Scenario: as above, but removal refuses until the Saturday shift is dealt with. Trade-off: safest, but a manager in a hurry cannot remove someone quickly.\n- **Other / defer.** Edge: the member is mid-shift when removed (attendance/kiosk — GM-08). Concurrency: removal racing an acceptance — the acceptance should fail if the membership is gone (verify in `offers.py` ✘ NI). Notification: removed member told? ✘ NI."}, {"id": "Q-11", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-11 — [NEW] The Pharmacy Manager one-time switch: what exactly happens, and is once really once?\n- **Status:** OPEN — REVALIDATED (model comment only; endpoint not inspected).\n- **Sources:** `backend/users/models.py` `User.ROLE_CHOICES` (PHARMACY_MANAGER comment), `CHOOSABLE_ACCOUNT_TYPES`.\n- **ACTUAL TODAY (from the model only):** A Pharmacy Manager — created when an organisation onboards a pharmacy by email — manages that pharmacy through a MANAGER admin assignment, and \"may later choose PHARMACIST or OTHER_STAFF once\". Ownership is never acquired this way; MANAGER \"remains the highest delegated pharmacy-admin level\". The endpoint that performs the switch, whether it is enforced once, what happens to the admin assignment and to any personal onboarding already done, and what the mobile flow does (per #184 ON-04 it was broken) are all **not inspected**.\n- **RECOMMENDED — Keep the rule, but define and enforce it before launch: one switch, only to PHARMACIST or OTHER_STAFF, admin assignment survives the switch, and the switch requires completing that role's onboarding before the person can apply for shifts. Severity: MEDIUM.** Benefits: a real person who both manages a pharmacy and works shifts gets one account, not two. Risks: if the switch is not enforced once, role-hopping becomes a way to dodge verification; if the admin assignment is dropped, the pharmacy loses its manager.\n- **ALTERNATIVE A — Keep current logic as written in the model comment (switch once; details undefined).** Scenario: a manager switches to Pharmacist, keeps managing, works shifts. Trade-off: the happy path works; the edge cases (double-switch, dropped admin rights, half-onboarded switcher applying for shifts) are undefined.\n- **ALTERNATIVE B — No switch: a manager who wants to work shifts creates a second account.** Trade-off: simplest to reason about; two logins, two identities for one person, and the membership/AHPRA logic must cope with that.\n- **Other / defer.** Edge: a PHARMACY_MANAGER who is also the pharmacy's *owner-side* contact — switching must never confer ownership. Denied role: switching to OWNER or ORG_STAFF or EXPLORER must be refused. Web/Expo: the #184 mobile breakage (ON-04) must be re-verified at #249 head before this is asked as a launch question."}, {"id": "Q-18", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-18 — [NEW] The 3-pharmacy membership cap: keep it, raise it, or scope it?\n- **Status:** OPEN — REVALIDATED (new since #184 — no cap was mentioned in Oct).\n- **Sources:** `backend/memberships/serializers.py` `MAX_ACTIVE_PHARMACY_MEMBERSHIPS = 3`, `_count_active_memberships()`; `backend/memberships/invites.py` `create_membership_invite()`.\n- **ACTUAL TODAY:** One person may hold at most **3 active** (ACCEPTED + active) pharmacy memberships. PENDING invites don't count. The cap is enforced on invite and on serializer validation, with a plain error message. There is no per-role or per-type distinction — a pharmacist working across a 5-site group hits the same cap as a casual at 3 independents.\n- **RECOMMENDED — KEEP 3 for favourites/locums; exempt or raise for employed staff of one organisation's pharmacies. Severity: LOW-MEDIUM.** Rationale: the cap exists to stop membership sprawl, but a real employee of a 5-site group is not \"sprawling\" — and the org-membership scoping (Q-06) already governs group staff. Benefits: groups can staff all their sites; the anti-sprawl protection stays for the marketplace side. Risks: two rules to explain; the exemption must be tied to the org, not to the person asserting it.\n- **ALTERNATIVE A — Keep current logic (flat cap of 3 for everyone).** Scenario: a pharmacist employed by a 4-site group cannot be a member of the fourth site and must be booked as an outsider there. Trade-off: simplest; the group workaround (book as public) defeats the membership model.\n- **ALTERNATIVE B — Raise the flat cap (e.g. 5 or 10).** Scenario: as above, solved for most groups. Trade-off: one number, but a locum could then be a \"member\" of 10 pharmacies and collect the AHPRA exemption (Q-01) at all of them.\n- **Other / defer.** Edge: concurrency — simultaneous invites to different pharmacies are serialised on the user row, so the cap cannot be raced past (✔ R). Edge: a member who *leaves* one pharmacy frees a slot only when the row is deactivated/deleted (F14). Notification: the inviter sees a plain error; the worker is never told they hit a cap."}, {"id": "Q-19", "area": "GM-05", "plat": "Web + Expo", "md": "### Q-19 — [NEW] Should the owner's own membership really be untouchable through the normal membership screen?\n- **Status:** CODE INVARIANT — confirm only (not a #184 carried decision). Senior-review correction: this is a code invariant (`user_can_change_membership()` returns False for the owner's derived membership), not one of #184's carried owner decisions (D01–D05, R01/R04/R06, E01/E03, P02–P12, F01/F04). Recorded here for the ledger, not a fresh decision.\n- **Sources:** `backend/memberships/access.py` `user_can_change_membership()` (\"The pharmacy owner's derived OWNER membership is a system/control-plane invariant and is not mutable through the generic membership endpoint\").\n- **ACTUAL TODAY:** The owner's membership of their own pharmacy cannot be changed through the generic membership endpoint — `user_can_change_membership()` returns False for it. Separately, the owner's admin record cannot be demoted or removed (`PharmacyAdmin.clean()`, `can_be_removed_by()`).\n- **RECOMMENDED — KEEP, and confirm with the owner that this matches their intent.** It protects against an admin accidentally (or deliberately) removing the owner from their own pharmacy. The open part is only: what *is* the path when ownership genuinely transfers (sale of pharmacy)? That belongs to GM-03/GM-04, not GM-05 — flagged here so it is not lost.\n- **Other / defer.** If ownership transfer needs a path, it should be a platform-admin action with an audit record, not a membership edit.\n\n---"}, {"id": "GM-05-OD-03", "area": "GM-05", "plat": "Web + Expo", "md": "### GM-05-OD-03: Attendance approvals and the roster need both staff and roster rights (OD-03, decisions-for-owner 6h)\n**Platforms:** Web + Expo\n**What happens today:** On Expo, as on web, an admin sees attendance approvals and the roster only with both staff and roster rights. Argon suggested roster rights alone; I kept the web rule.\n**Already implemented:** pr257, same rule as web\n**Recommendation:** Keep the web rule.\n**Other option:** Roster rights alone are enough.\n**Status:** OPEN, confirm or change."}, {"id": "GM-05-OD-04", "area": "GM-05", "plat": "Web + Expo", "md": "### GM-05-OD-04: Organisation tabs are hidden when Lina lacks the right (OD-04, decisions-for-owner 6g)\n**Platforms:** Web + Expo\n**What happens today:** An organisation tab Lina may not use is hidden (as on web), not shown with a \"not allowed\" message.\n**Already implemented:** pr257\n**Recommendation:** Keep.\n**Other option:** Show the tab with a \"not allowed\" note.\n**Status:** OPEN, confirm or change."}, {"id": "GM-05-OD-05", "area": "GM-05", "plat": "Web + Expo", "md": "### GM-05-OD-05: A new invitee with no name shows as their email address (OD-05, D162)\n**Platforms:** Web + Expo\n**What happens today:** An invite to a new email creates an account with no name. Rosters, leave and timesheets used to crash on that (HTTP 500 for the whole roster). They now show the email address until the person sets a name.\n**Already implemented:** commit 7855bbd8\n**Recommendation:** Keep.\n**Other option:** Require a name when inviting.\n**Status:** OPEN, confirm or change."}, {"id": "GM-05-OD-06", "area": "GM-05", "plat": "Web + Expo", "md": "### GM-05-OD-06: When Ali is removed, what happens to his future roster shifts? (OD-06, D181 (five-user run A6), extends Q-09)\n**Platforms:** Web + Expo\n**What happens today:** After removal Ali can no longer clock in or open the workspace roster, but his own roster still lists a future Southport shift (24 Nov), and that slot still counts as filled.\n**Code:** not a choice I made: found in the five-user run\n**Recommendation:** Take him off future roster shifts at removal and tell the manager those shifts need cover.\n**Other option:** Hide them from Ali only, leaving the slots for the manager to fix; or leave them as they are.\n**Status:** OPEN, confirm or change."}, {"id": "GM-05-W01", "area": "GM-05", "plat": "Web + Expo", "md": "### GM-05-W01: Is a brand-new invitee an active team member before they set a password? (W-03, D156)\n**Scenario:** Tom invites Mia by email. Mia has no ChemistTasker account yet and hasn't opened the email.\n**What happens today:** Mia's new account gets an active, accepted membership and a set-password link. Tom can roster her before she signs in. With an ordinary direct invite, an existing account stays pending until it accepts. An approved invite-link application can activate an existing account immediately too (`pr257:backend/memberships/invites.py:149`, `pr257:backend/memberships/applications.py:122`).\n**Recommendation first: A.** Mia shows as \"Invited\" until she sets her password. Tom can still pre-roster her, but she gets no chat messages or shift offers until she joins.\n- **A (recommended):** active only after she sets a password; Tom can roster her as \"Invited\".\n- **KEEP:** active at once, as today.\n- **B:** active at once, but hidden from chat until she signs in.\n- **DEFER**\n\n**Status:** OPEN"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Direct email staff invite | Manager opens invite modal to send direct email invitation to staff (`frontend_web/src/pages/dashboard/sidebar/owner/InviteStaffModal.tsx:25`). | Manager sends invitation via staff management screen (`frontend_mobile/roles/shared/pharmacies/StaffManager.tsx:444`). | Yes | — |\n| Shareable invite links | Manager generates shareable join link with role presets (`frontend_web/src/pages/dashboard/sidebar/owner/StaffManager.tsx:339`). | Mobile app surfaces admin invitations screen to generate join links (`frontend_mobile/app/admin-invitations.tsx:5`). | Yes | — |\n| Promote staff to pharmacy manager | Owner promotes member to pharmacy admin/manager in staff list (`frontend_web/src/pages/dashboard/sidebar/owner/PharmacyAdmins.tsx:165`). | Manager assigns permissions on staff member profile (`frontend_mobile/roles/shared/pharmacies/StaffManager.tsx:149`). | Yes | — |\n| Remove member from pharmacy | Owner deletes pharmacy admin or staff membership (`frontend_web/src/pages/dashboard/sidebar/owner/PharmacyAdmins.tsx:192`). | Manager removes staff member from roster directory (`frontend_mobile/roles/shared/pharmacies/StaffManager.tsx:252`). | Yes | — |\n| Locum & staff directory | Owner manages active pharmacy staff and locum memberships (`frontend_web/src/pages/dashboard/sidebar/owner/StaffManager.tsx:144`). | Manager views pharmacy staff roster directory (`frontend_mobile/roles/shared/pharmacies/StaffManager.tsx:126`). | Yes | — |", "file": "areas/GM-05-roles-membership-invites.md"}, {"key": "GM-03", "row": "2", "title": "GM-03 Pharmacy setup", "qs": [{"id": "GM-03-Q06", "area": "GM-03", "plat": "Web + Expo", "md": "### GM-03-Q06 — Can an owner skip adding a pharmacy forever, and should anything remind them?\n- **Old ID:** NEW (from F-06). **Decision: OPEN.**\n- **Question:** The setup lets an owner press \"Continue later\" and reach the dashboard with no pharmacy. Is that a real choice — skip once, skip forever — or should the app keep asking until there's at least one pharmacy?\n- **ACTUAL TODAY:** Skip is client-side only and never expires. Web: forgotten when the tab closes (sessionStorage), so the owner is asked again next login. Expo: remembered on the phone (AsyncStorage) until a pharmacy is created, so one skip = never asked again. No backend flag, no reminder, no \"setup incomplete\" badge was found. An owner with zero pharmacies can browse, and can they post? Posting needs a pharmacy — the post flow would fail for lack of one (exact behaviour not traced — UNKNOWN).\n- **RECOMMENDED: Skip is allowed once, but the dashboard shows a permanent \"Add your pharmacy to post shifts\" prompt until the first pharmacy exists, on both clients.** Rationale: the skip exists so a busy owner isn't trapped; but a silent skip means a registered owner who never posts looks like a dead account. Severity: **Medium.** Benefits: no trapped owners, no lost owners. Risks: a nagging banner annoys owners who deliberately have no pharmacy yet (e.g. a manager account). Legal/financial: none directly; commercially, every skipped setup is a pharmacy that cannot pay a fee.\n- **ALTERNATIVE A — Keep current logic:** web re-asks, Expo never re-asks. Scenario: owner skips on the phone in November, opens the app in January — no prompt, no pharmacy, no shifts. Trade-off: zero work, inconsistent behaviour the owner never chose.\n- **ALTERNATIVE B — No skipping at all:** the pharmacy step is mandatory. Scenario: owner without the ABN to hand cannot reach the dashboard at all and abandons signup. Trade-off: complete data, higher drop-off.\n- **ALTERNATIVE C — Skip expires:** e.g. ask again after 7 days. Needs a server-side \"skipped at\" timestamp that does not exist today.\n- **Other (describe) / Defer.**\n- **Normal case:** owner skips, returns later, adds pharmacy from the dashboard prompt. **Edge case:** owner skips with a half-filled draft — web warns the draft wasn't saved and still skips (`PharmacyPage.tsx:2075-2095`); Expo's draft behaviour on skip was not traced (UNKNOWN). **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification:** none today; under the recommendation, one reminder (not repeated emails). **Web/Expo difference:** the persistence gap above — the decision must pick one behaviour for both.\n- **Sources:** `frontend_web/src/utils/ownerSetup.ts:16-18,65,88-93`; `frontend_mobile/utils/ownerSetup.ts:19-27,69-80`; `frontend_web/src/pages/dashboard/sidebar/PharmacyPage.tsx:2075-2095`; `frontend_mobile/roles/owner/setup-pharmacy.tsx:56-58,115`."}, {"id": "GM-03-Q07", "area": "GM-03", "plat": "Web + Expo", "md": "### GM-03-Q07 — Owner profile vs pharmacy profile: who is the legal party, and what happens when the owner isn't a pharmacist?\n- **Old ID:** NEW (from F-03, F-13; touches ON-P02). **Decision: OPEN.**\n- **Question:** The person signs up as a manager or a pharmacist, and the shop has its own ABN. When a shift is posted, who is legally responsible — the person, the shop, or both? And if the owner is a manager (not a pharmacist), or their AHPRA registration lapses, can the pharmacy still post pharmacist shifts?\n- **ACTUAL TODAY:** The two records are separate: `OwnerOnboarding` (person: role MANAGER/PHARMACIST, AHPRA, gov ID, `verified=False`) and `Pharmacy` (shop: ABN, address, rates). Posting checks neither the person's AHPRA nor the pharmacy's flags (GM-03-Q01). If the owner's AHPRA is suspended, the owner record can flip PHARMACIST → MANAGER (`ahpra_switched_to_manager`, `backend/onboarding/models.py:195`; per #184 ON-P02) while the pharmacy record is untouched and keeps posting. Nothing in the pharmacy record names a \"responsible pharmacist on site\".\n- **RECOMMENDED: The pharmacy (ABN entity) is the contracting party for every shift; the owner person must be a verified manager or pharmacist, and a pharmacist shift requires a named registered pharmacist attached to that pharmacy — decide whether that is the owner, a nominated manager, or a per-shift declaration.** Rationale: locums and the platform need one accountable party, and \"the shop\" is the only party with an ABN; but a pharmacist shift with no registered pharmacist anywhere on the record is a regulatory gap. Severity: **High — needs qualified review, not just a product pick.** Benefits: clear accountability; AHPRA/employer obligations are answerable. Risks: over-engineering — many real pharmacies are owned by non-pharmacist managers with employed pharmacists; the rule must not block them. Legal/financial: employment vs contractor, AHPRA employer obligations, and who pays if a shift is worked unlawfully. **This question should go to qualified review before launch (as #250 requires for legal/regulatory issues).**\n- **ALTERNATIVE A — Keep current logic:** person and shop separate; posting checks neither. Scenario: a manager-owned pharmacy posts a pharmacist shift; the locum is registered, the owner isn't — work happens, nobody checks. Trade-off: no friction, unanswerable accountability.\n- **ALTERNATIVE B — Owner must be a registered pharmacist to post pharmacist shifts:** Scenario: a manager-owner who employs pharmacists cannot post at all. Trade-off: simple, but blocks a large real-world ownership pattern.\n- **ALTERNATIVE C — Per-pharmacy \"responsible pharmacist\" field:** the pharmacy names one registered pharmacist (owner or employee) whose AHPRA is checked. Needs a new field + check that do not exist today.\n- **Other (describe) / Defer.**\n- **Normal case:** pharmacist-owner posts pharmacist shifts; manager-owner posts with employed pharmacists on the roster. **Edge case:** owner's AHPRA lapses mid-booking — existing bookings stand or are reviewed? (GM-02's ON-Q07 covers workers; the owner/pharmacy side is undecided here.) **Retry/concurrency:** n/a. **Denied role:** a PHARMACY_MANAGER (admin-only identity) is not the owner — they administer a pharmacy but the owner record is someone else's; whether they can post is a GM-05/GM-10 matter. **Payment/notification:** if a pharmacy is blocked from posting pharmacist shifts, the owner must be told why and what fixes it. **Web/Expo difference:** none — backend rule.\n- **Sources:** `backend/onboarding/models.py:151-230`; `backend/organizations/models.py:71-259` (`Pharmacy.owner`); `backend/shifts/posting.py:62`; #184 ON-P02/ON-Q07 (worker side, for contrast)."}, {"id": "GM-03-Q08", "area": "GM-03", "plat": "Web + Expo", "md": "### GM-03-Q08 — One owner, several pharmacies: chain, organisation, or just \"my pharmacies\"?\n- **Old ID:** NEW (from F-11; touches ON-Q14, GM-04). **Decision: OPEN.**\n- **Question:** An owner with five shops can group them as a Chain, join an Organisation, or just own five separate pharmacies. Which grouping should drive what the owner sees and what workers see — shift audiences, fees, payroll, and who manages whom?\n- **ACTUAL TODAY:** All three exist and overlap. Plain ownership: `Pharmacy.owner → OwnerOnboarding`. `Chain`: owner- or org-owned, M2M pharmacies, own subscription plan + contact email (`backend/organizations/models.py:467-...`; `ChainViewSet`, `views.py:340-...`). `Organization` + claims: org claims pharmacies, one accepted claim per pharmacy. The shift audience tiers (staff → favourites → owner chain → organisation → public, carried E01) use chain and organisation as tiers, but nothing in GM-03's code says which grouping a new multi-site owner should use, or whether a pharmacy can be in a chain *and* an organisation at once (it can, structurally).\n- **RECOMMENDED: One owner, one Chain for their own shops by default; Organisation only for groups that are genuinely separate businesses sharing a head office; a pharmacy belongs to at most one Chain and at most one Organisation, and the setup flow asks \"Is this part of a group?\" once and creates the right grouping.** Rationale: three overlapping groupings with no guidance will produce inconsistent audiences and billing (which subscription? whose billing contact? — `resolve_billing_account` picks org scope when an organisation exists). Severity: **High.** Benefits: predictable audiences, one billing account per pharmacy, support can answer \"which group is this in?\". Risks: forcing a choice at setup slows multi-site onboarding; some real groups are both a chain and an org.\n- **ALTERNATIVE A — Keep current logic:** all three, owner figures it out. Scenario: an owner creates a Chain *and* joins an Organisation for the same five shops; a shift escalates to \"owner chain\" and \"organisation\" — the same people see it twice under two labels. Trade-off: no work, confused audiences.\n- **ALTERNATIVE B — Chains only for owners; organisations only via admin:** i.e. keep both, but the UI never offers both to the same owner — setup asks once. Scenario: a 5-shop owner gets a Chain; Chempro gets an Organisation. Trade-off: clearer, but needs the setup question and the guardrails built.\n- **Other (describe) / Defer:** e.g. \"decide in GM-04 (Organisations/chains/regions)\" — legitimate, but GM-03 must then state that multi-pharmacy setup is *blocked* on GM-04, not silently shipped.\n- **Normal case:** single shop → no group; 3 shops, one owner → one Chain. **Edge case:** a pharmacy sold from one owner to another — Chain membership, Organisation claim, and owner FK must all move; no transfer flow was found (UNKNOWN). **Retry/concurrency:** claim uniqueness is DB-enforced; Chain add/remove are simple M2M ops. **Denied role:** adding a pharmacy to a Chain you don't own → denied by `ChainViewSet.get_queryset` scoping (characterised in `test_pharmacy_access_characterization.py:17-101`). **Payment:** billing account resolution prefers organisation scope when present (`billing/utils.py: resolve_billing_account`) — so the grouping choice changes who is billed. **Notification:** claim emails (F-11). **Web/Expo difference:** org pharmacy screens exist on Expo; chain management screens were not traced on either client (UNKNOWN).\n- **Sources:** `backend/organizations/models.py:39-69,71-259,261-354,467-...`; `backend/organizations/views.py:49-77,340-...`; `backend/organizations/claims.py`; `backend/billing/utils.py: resolve_billing_account`."}, {"id": "GM-03-Q09", "area": "GM-03", "plat": "Web + Expo", "md": "### GM-03-Q09 — Can the owner change a pharmacy after shifts are posted — and what locks when?\n- **Old ID:** NEW (from F-08, F-10, F-18). **Decision: OPEN.**\n- **Question:** After a pharmacy has posted shifts and workers have accepted, what can the owner still change — the address, the hours, the rates, the ABN — and what must stay frozen so accepted workers aren't misled?\n- **ACTUAL TODAY:** Almost everything is editable (`PharmacyViewSet` update; `check_object_permissions` — owner, active admin, or scoped org member). Two locks exist: (1) ABN locks once verified-and-confirmed — changing it is a 400 (`serializers.py: validate()`); changing an unlocked ABN resets all ABN fields to unverified. (2) A *shift* cannot change pharmacy once offers/assignments exist, and cannot be edited (except text) while an offer awaits payment (`posting.py: revise_shift()`). But the *pharmacy record itself* has no freeze: the owner can change the address, hours or default rates after workers accepted shifts at that pharmacy, and `sync_pharmacy_rate_defaults` can also write shift rates back onto the pharmacy. No version, no audit note, no notification to accepted workers was found for pharmacy edits.\n- **RECOMMENDED: Address, hours and rates stay editable; changing them after a booking exists shows a warning listing affected upcoming shifts and notifies accepted workers of material changes (address/hours); ABN change stays as today (reset + re-verify).** Rationale: shops genuinely move hours and rates; silently changing the address of a shift someone already accepted is the failure mode. Severity: **Medium.** Benefits: no nasty surprises for workers; owners keep control. Risks: notification noise if owners tweak rates often — needs a \"material change\" definition. Legal/financial: an address change after acceptance could void the agreed terms (GM-14 territory); a rate change must never rewrite an already-frozen agreed rate.\n- **ALTERNATIVE A — Keep current logic:** everything editable, silently. Scenario: owner moves the shop's listed suburb after a locum accepted; the locum drives to the old address. Trade-off: zero work, real-world harm.\n- **ALTERNATIVE B — Freeze the pharmacy once it has an accepted booking:** no edits except via support. Scenario: a genuine hours change needs a support ticket. Trade-off: safest for workers, worst for owners.\n- **Other (describe) / Defer.**\n- **Normal case:** owner fixes a typo in opening hours before any booking — no notice needed. **Edge case:** owner changes ABN after verification — locked, must contact support (no support flow found — UNKNOWN). **Retry/concurrency:** concurrent edits last-write-wins (no ETag/version found). **Denied role:** wrong-tenant edit → generic 403 (`test_pharmacy_access_characterization.py:101-145`). **Payment/notification:** none today; under the recommendation, material-change notices to accepted workers. **Web/Expo difference:** none in backend; both clients use the same update endpoint.\n- **Sources:** `backend/organizations/views.py: check_object_permissions, perform_update`; `backend/organizations/serializers.py: validate(), _apply_abn_side_effects`; `backend/shifts/posting.py: revise_shift(), sync_pharmacy_rate_defaults`."}, {"id": "GM-03-Q10", "area": "GM-03", "plat": "Web + Expo", "md": "### GM-03-Q10 — Which pharmacy documents are required, who reviews them, and do they expire?\n- **Old ID:** NEW (from F-15). **Decision: OPEN.**\n- **Question:** The pharmacy can upload methadone/S8 protocols, Queensland SUMP papers, SOPs and induction guides. Must any of them be there before posting, who checks them, and what happens when they go out of date?\n- **ACTUAL TODAY:** All four are optional file uploads, validated only for file type/size (`DOCUMENT_UPLOAD_POLICY`). No required-before-posting rule, no review queue, no expiry, no status field, no notification. A pharmacy with zero documents posts normally. (`Pharmacy.methadone_s8_protocols`, `qld_sump_docs`, `sops`, `induction_guides` — `backend/organizations/models.py`.)\n- **RECOMMENDED: No document blocks posting at launch; SOPs + induction guide required before the first *public* post (not before chain/org posts), reviewed by a platform admin within a stated time; documents carry a review date and the owner is prompted to re-confirm yearly.** Rationale: S8/SUMP papers are state- and service-specific (not every pharmacy needs them), but a public locum walking into a shop with no SOPs and no induction guide is a safety gap. Severity: **Medium.** Benefits: locums arrive prepared; the platform can show \"SOPs on file\" as a trust signal. Risks: admin review load; owners without digital SOPs stall. Legal/financial: S8/SUMP handling is regulated in Queensland — getting this wrong is a compliance issue, so the *which-documents-for-which-pharmacy* detail needs qualified review, not just a product pick.\n- **ALTERNATIVE A — Keep current logic:** all optional, never reviewed. Scenario: a locum accepts a methadone shift with no protocols on file and no induction guide. Trade-off: zero friction, safety gap.\n- **ALTERNATIVE B — All four required before any post:** Scenario: a small shop without methadone services must still upload S8 papers it doesn't have. Trade-off: unworkable — the requirement must be conditional on services offered.\n- **Other (describe) / Defer:** e.g. \"documents shown as badges only, never blocking\" (cf. #184 ON-Q09 pattern for insurance).\n- **Normal case:** owner uploads SOPs at setup → admin ticks them → \"SOPs on file\" shows on the shift. **Edge case:** Queensland pharmacy without SUMP papers posts an S8 shift — under the recommendation, blocked until uploaded; under today, allowed. **Retry/concurrency:** file re-upload replaces the old file (RemoveOldFilesMixin). **Denied role:** only editors of that pharmacy can upload (F-18 permissions). **Payment/notification:** none today; under the recommendation, review-approved/rejected notices. **Web/Expo difference:** both clients upload via the same multipart endpoint; native file-picker behaviour differs (not traced).\n- **Sources:** `backend/organizations/models.py` (file fields); `backend/organizations/serializers.py:82-110` (`file_fields`, `upload_validation_map`)."}, {"id": "GM-03-Q11", "area": "GM-03", "plat": "Web + Expo", "md": "### GM-03-Q11 — Default rates and the payroll switch: where do they belong, and what is the default?\n- **Old ID:** NEW (from F-07, F-16). **Decision: OPEN.**\n- **Question:** The pharmacy has default pay rates (weekday, Saturday, Sunday, public holiday, early morning, late night) and a \"use ChemistTasker payroll\" switch. Should the owner set them during setup, what are the defaults if they don't, and is payroll on or off unless they choose?\n- **ACTUAL TODAY:** Rates are optional in the pharmacy form on both clients; the web form forces all four day rates if FIXED is chosen (Expo: unknown). If no rate is given, a FIXED shift falls back to `default_fixed_rate or weekday_rate or slot rate or $0.00` (`posting.py`). The payroll switch defaults to **off** and is **not in either pharmacy form** — it lives on a separate workforce-settings screen (web `usePayrollSetting.ts`; Expo `app/workforce-settings.tsx`). With payroll off, \"roster and attendance still produce timesheets without requiring Award classifications or pay rates\" (model help text).\n- **RECOMMENDED: Keep payroll off by default; surface the switch in the pharmacy form (setup + edit) on both clients with a one-line explanation of what changes; require at least a weekday rate before the first FIXED-rate post (not before setup completes).** Rationale: payroll off is the safe default (no Award/pay-rate obligations the owner didn't ask for), but a switch the owner never sees is not a choice. Severity: **Medium.** Benefits: owners who want payroll find it; owners who don't aren't forced through Award setup. Risks: surfacing it in setup lengthens the form; a wrong toggle changes timesheet/payroll routing (GM-09). Legal/financial: payroll on means Award classifications and pay rates become required downstream — the owner must understand that before toggling.\n- **ALTERNATIVE A — Keep current logic:** rates optional, payroll hidden in workforce settings, off by default. Scenario: an owner posts FIXED shifts with no rates and the shift defaults to $0.00; another owner never finds payroll and pays locums outside the system. Trade-off: zero work, silent misconfiguration.\n- **ALTERNATIVE B — Payroll on by default:** every pharmacy gets Award/payroll from day one. Scenario: a small owner who only wants locum cover must complete Award classifications before posting. Trade-off: correct payroll, heavy onboarding.\n- **Other (describe) / Defer.**\n- **Normal case:** owner sets weekday/Saturday/Sunday/public-holiday rates at setup → new shifts prefill them. **Edge case:** owner sets FIXED with only a weekday rate on Expo (if the web rule is missing there) → other days fall back silently. **Retry/concurrency:** rate sync from a posted shift can overwrite pharmacy defaults (`sync_pharmacy_rate_defaults`) — under the recommendation, that write-back needs the owner's eyes (it happens today without notice). **Denied role:** only pharmacy editors can change rates/payroll. **Payment:** rates drive the agreed wage and therefore the booking fee base; payroll toggle drives timesheet routing. **Notification:** none today. **Web/Expo difference:** the FIXED four-rate rule (web-only, verified) and the payroll screen location (separate on both, but different screens).\n- **Sources:** `backend/organizations/models.py` (`use_chemisttasker_payroll` help text; rate fields); `backend/shifts/posting.py` (rate fallback; `sync_pharmacy_rate_defaults`); `frontend_web/src/pages/dashboard/sidebar/PharmacyPage.tsx:1895,1974-1980`; `frontend_mobile/roles/shared/pharmacies/PharmacyForm.tsx:451-452`; `frontend_web/src/pages/dashboard/sidebar/owner/usePayrollSetting.ts`."}, {"id": "GM-03-Q12", "area": "GM-03", "plat": "Web + Expo", "md": "### GM-03-Q12 — Who verifies a pharmacy (`verified` flag), on what evidence, and is the owner told?\n- **Old ID:** NEW (from F-09; splits the admin half out of GM-03-Q01). **Decision: OPEN.**\n- **Question:** The pharmacy has a `verified` flag that only the marketplaces read. Who flips it to Yes, what do they check, how long does it take, and does the owner get told — or does it stay a mystery flag forever?\n- **ACTUAL TODAY:** Unknown from the code inspected. The flag is read-only in the API, no in-app screen sets or displays it, and no notification or review queue for it was found. The onboarding Django admin has verify/reject actions for *onboarding checks* (`backend/onboarding/admin.py:21,46-68`) — a different object, not `Pharmacy`. It is plausible a platform admin flips it in Django admin or a shell; that was not verified.\n- **RECOMMENDED: A named platform-admin review (ABN verified + trading name/address matched + one contact check), decided within 2 business days, with the owner notified of approval, rejection + reason, and revocation; the flag never expires silently but is re-checked if the ABN changes.** Rationale: a flag nobody can see, set, or explain is not a control — it is a trap for the marketplace decision (GM-21) that depends on it. Severity: **High if GM-03-Q01 option D is chosen; Medium otherwise** (if posting never depends on it, its only load-bearing use is marketplace trading). Benefits: the flag means something auditable. Risks: review load; a rejected pharmacy with no reason will complain to support. Legal/financial: revocation must be appealable (cf. carried P10 principles for workers — owners need a parallel fairness path, GM-15/GM-26).\n- **ALTERNATIVE A — Keep current logic:** flag set by unknown admin action, owner never told. Scenario: an owner lists products on the marketplace and is silently ineligible for months. Trade-off: zero work, invisible control.\n- **ALTERNATIVE B — Automatic:** `verified` follows `abn_verified` (flag flips when the ABN is confirmed). Scenario: any valid ABN = verified pharmacy. Trade-off: no admin load, but collapses two different assurances into one.\n- **ALTERNATIVE C — Remove the flag:** marketplaces use `abn_verified` instead. Needs GM-21 agreement (marketplace area owns that read).\n- **Other (describe) / Defer:** e.g. \"decide in GM-21/GM-26 (admin/privacy/security)\" — legitimate, but then GM-03 must record that Q01's option D cannot be implemented until Q12 is answered.\n- **Normal case:** owner confirms ABN → admin reviews → verified → marketplace trading opens. **Edge case:** ABN changes after verification — flag must reset or re-check (today: ABN reset does not touch `verified` — a changed-ABN pharmacy stays `verified`, a hole). **Retry/concurrency:** n/a. **Denied role:** only platform admins may set it (by definition — no API exists). **Payment/notification:** approval/rejection/revocation notices (new). **Web/Expo difference:** none — admin-side, not client-side.\n- **Sources:** `backend/organizations/models.py:135`; `backend/organizations/serializers.py:211` (read-only); `backend/marketplace/policy.py:99-100`; `backend/ethical_marketplace/policy.py:89,94,127`; `backend/onboarding/admin.py:21,46-68` (different object — cited to prevent confusion).\n\n---"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Owner registration | New user selects OWNER role during registration (`frontend_web/src/pages/register.tsx:26`). | New user selects OWNER role in mobile registration (`frontend_mobile/app/register.tsx:37`). | Yes | — |\n| Setup gate enforcement | Incomplete owner is redirected to owner setup during login (`frontend_web/src/pages/login.tsx:89`). | Layout redirect guards force incomplete owners into setup wizard (`frontend_mobile/app/_layout.tsx:379`). | Yes | — |\n| Step 1: Owner personal profile | Owner submits single-page personal profile form (`frontend_web/src/pages/onboarding/OwnerOnboarding.tsx:837`). | Owner completes step-by-step onboarding wizard with unsaved changes guard (`frontend_mobile/roles/owner/setup-onboarding.tsx:95`). | No | Verified 21 Nov: intended layout difference (single page on web, wizard on Expo); not a defect. |\n| Step 2: Create primary pharmacy | Owner fills pharmacy details and creates pharmacy record (`frontend_web/src/pages/dashboard/sidebar/PharmacyPage.tsx:2010`). | Owner enters pharmacy location and operating details in setup wizard (`frontend_mobile/roles/owner/setup-pharmacy.tsx:110`). | Yes | — |\n| Dashboard unlock | Completing profile and pharmacy unlocks the owner overview container (`frontend_web/src/pages/dashboard/sidebar/owner/OwnerOverviewContainer.tsx:27`). | Completing setup redirects owner to mobile dashboard (`frontend_mobile/roles/owner/dashboard.tsx:196`). | Yes | — |\n| Pharmacy management & settings | Owner manages pharmacy operating hours and details in settings (`frontend_web/src/pages/dashboard/sidebar/owner/PharmacySettings.tsx:20`). | Owner edits pharmacy details using the shared mobile form (`frontend_mobile/roles/shared/pharmacies/PharmacyForm.tsx:71`). | Yes | — |", "file": "areas/GM-03-pharmacy-owner-setup.md"}, {"key": "GM-04", "row": "2", "title": "GM-04 Organisations", "qs": [{"id": "GM-04-Q02", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q02 — What is an organisation, a chain, and a region — and can one pharmacy belong to more than one? [NEW, refined by code]\n\n**Plain English:** the code now defines two of the three words. An organisation is the legal group (one per pharmacy). A chain is a named set of pharmacies that can belong to an owner, an organisation, or neither — and one pharmacy can be in many chains. A region still means nothing in the product.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `Organization`: name/slug/about/cover only. `Chain`: owner FK (nullable) + organization FK (nullable) + name/logo/`subscription_plan`/`primary_contact_email`/`is_active` + pharmacies M2M. `Pharmacy.organization`: single nullable FK. `Pharmacy.public_holiday_region`: a holiday-district label only. No `Region` model.\n**RECOMMENDED:** Write the definitions down before any other GM-04 decision: organisation = the legal group (one per pharmacy); chain = the owner/org-linked set of pharmacies used for the visibility tier and cross-site cover (a pharmacy may sit in several chains); region = dropped as a product concept (a \"region\" is just a suburb/postcode, or the `Region Admin` role's scope — see Q10). Severity: high — every later question depends on these words meaning one thing.\n**ALTERNATIVE A — Keep current logic:** leave chain and org as two tiers with no written definition. Scenario: Chempro posts to \"chain\" and separately to \"organisation\" and the same workers see it twice — harmless but confusing. Trade-off: no work, permanent ambiguity.\n**ALTERNATIVE B — One concept:** merge chain into organisation (one tier). Scenario: an owner with 3 independent pharmacies and a Chempro franchisee — merged tier shows the franchisee's shifts to the owner's other pharmacies' staff, which the owner may not want. Trade-off: simpler UI, loses a real distinction E01 deliberately kept — and now a real model distinction (chain has its own subscription plan).\n**ALTERNATIVE C — Organisation + optional region, chain retired as a tier:** chain becomes just a label on the org. Scenario: a national group wants \"QLD only\" visibility — needs regions (see Q10). Trade-off: biggest change; needs migration of existing tier values.\n**Other / defer:** Defer the definition; decide Q01/Q04 first.\n**Normal case:** one pharmacy, one org, one or more chains. **Edge case:** a pharmacy changes groups (sold, rebrands from Chempro to independent) — its `organization` FK moves, its chain memberships do not automatically; history/favourites/source labels: UNKNOWN. **Retry/concurrency:** two admins adding the same pharmacy to different orgs — the FK is single, last write wins; two claims → unique constraint blocks the second. **Denied role / wrong tenant:** an org admin adding a pharmacy they don't own — `ChainViewSet.add_pharmacy` scoping not line-traced (UNKNOWN). **Payment/notification:** none directly; chain `subscription_plan` may feed billing (GM-16 — not traced). **Web/Expo:** definitions must appear identically in both posting wizards.\n**Sources:** `backend/organizations/models.py` (`Organization`, `Chain`, `Pharmacy.organization`, `Pharmacy.public_holiday_region`), `backend/organizations/views.py` (`ChainViewSet`).\n**Decision status:** OPEN."}, {"id": "GM-04-Q05", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q05 — What can an organisation admin do? (hierarchy, pharmacies, members, shifts) [NEW, refined]\n\n**Plain English:** the per-pharmacy admin ladder is fully defined in code, and org-wide admin roles exist — but nobody has written down what an org admin may actually do at a pharmacy they don't personally manage.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Per-pharmacy: `PharmacyAdmin` OWNER / MANAGER / ROSTER_MANAGER / COMMUNICATION_MANAGER with a capability matrix; MANAGER = OWNER in powers except touching the owner record (GM-05, adopted). Org-wide: `OrganizationMembership` roles (Org Admin / Chief Admin / Region Admin, GM-05) with capabilities via `users/org_roles.py` — seen in use (`VIEW_ALL_PHARMACIES`, `MANAGE_ROSTER`, `MANAGE_STAFF`, scoped per pharmacy by `membership_covers_pharmacy`), but `org_roles.py` itself was NOT read line by line here. Org admins can create chains and add/remove pharmacies and users (`ChainViewSet`), manage org pharmacies (`PharmacyViewSet`), and receive leave notices. Whether they can post shifts, set rates, or approve payments for a site they don't manage: UNKNOWN.\n**RECOMMENDED:** Org admin can see all pharmacies in their org, manage org membership, and see (not edit) shifts across the org; they cannot post shifts, set rates, or approve payments for a pharmacy they don't manage, and cannot see other orgs. Severity: high — without this, \"org admin\" is a label with unknown power, and wrong-tenant access is a privacy risk.\n**ALTERNATIVE A — Keep current logic:** leave org-admin powers as whatever the code happens to allow today (partly UNKNOWN). Scenario: an org admin opens another pharmacy's shift and edits its rate — if the code allows it, nobody decided it should. Trade-off: no work, undefined access.\n**ALTERNATIVE B — Org admin = owner of every pharmacy in the org:** full owner powers everywhere. Scenario: area manager cancels a shift at a site they don't run, and the site owner disputes it. Trade-off: simple, over-broad.\n**ALTERNATIVE C — Read-only org admin + per-pharmacy delegation:** org admin sees everything, acts only where explicitly delegated per pharmacy. Scenario: head office monitors staffing across 20 sites but each site owner keeps control. Trade-off: most code (delegation model), cleanest governance.\n**Other / defer:** Defer until Q01/Q02 settle who an org admin is.\n**Normal case:** org admin views org dashboard. **Edge case:** org admin is also an owner of one pharmacy — powers must union cleanly, not leak across sites. **Retry/concurrency:** two admins editing the same membership — last-write-wins vs conflict error UNKNOWN. **Denied role / wrong tenant:** org admin of Chempro requests Org B's data → must be 403 + audit log (actual behaviour UNKNOWN — capability scoping is per-org in the code seen, but not end-to-end verified). **Payment/notification:** org-admin actions must not trigger payments; whether they trigger notices is Q08. **Web/Expo:** org screens must exist on both or be declared web-only with a reason (GM-25 parity).\n**Sources:** `backend/organizations/models.py` (`PharmacyAdmin`, capability matrix via `PharmacyAdminPolicy`), `backend/organizations/views.py` (`ChainViewSet`, `PharmacyViewSet`), `backend/workforce/permissions.py` (`_org_has_capability`), GM-05 adopted revalidation.\n**Decision status:** OPEN."}, {"id": "GM-04-Q06", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q06 — Are there org-level rates, policies or defaults (or is everything per pharmacy)? [NEW]\n\n**Plain English:** today everything about money is per pharmacy or per offer. There is no place to set a rate or a rule once for a whole group — a 20-site group types the same rate 20 times.\n\n**ACTUAL TODAY — Web and Expo (same backend):** No org-level rates/policies model at head. Rates live per pharmacy (`Pharmacy.rate_*`, `default_fixed_rate`); `Chain.subscription_plan` is a bare string; engagement terms per offer; cover permission per pharmacy (R04A — but see GM-07-Q06: the only candidate setting, `auto_publish_worker_requests`, is read by no backend code); `Pharmacy.auto_publish_worker_requests` help text still says worker swap/cover requests will \"automatically create and publish a new shift\".\n**RECOMMENDED:** Keep per-pharmacy as the authority at launch; allow an org to set *defaults* that a pharmacy can override (rates, cover permission, auto-publish). Severity: medium. Benefits: a 20-site group doesn't retype the same rate 20 times; site owners keep control. Risks: override logic is a real feature (precedence, audit) — don't half-build it.\n**ALTERNATIVE A — Keep current logic:** per-pharmacy only, no org defaults. Scenario: Chempro sets the same rate at 20 sites by hand; one site drifts and nobody notices. Trade-off: no new code, manual drift.\n**ALTERNATIVE B — Org rates override pharmacy rates:** head office sets the rate; sites cannot change it. Scenario: a remote site can't pay more to attract a locum for an urgent shift. Trade-off: control for head office, inflexible at the site.\n**ALTERNATIVE C — Org policies only (no rates):** org sets policies (e.g. cover rules, cancellation handling per P05) but rates stay per site. Trade-off: middle ground; still needs a policy model.\n**Other / defer:** Defer org defaults until after launch; per-pharmacy works today.\n**Normal case:** org default rate copied into a new pharmacy's rate. **Edge case:** org default changes after shifts are posted — posted/frozen terms must not change. **Retry/concurrency:** two admins changing the org default simultaneously — UNKNOWN. **Denied role / wrong tenant:** a pharmacy manager changing the org default → denied. **Payment/notification:** rate changes affect future offers only, never frozen terms or payments already made. **Web/Expo:** defaults UI on both or declared web-only.\n**Sources:** `backend/organizations/models.py` (`Pharmacy.rate_*`, `Chain.subscription_plan`, `auto_publish_worker_requests`), `backend/shifts/engagement.py` (per-offer terms, Oct 2026).\n**Decision status:** OPEN."}, {"id": "GM-04-Q07", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q07 — How does org membership affect shift visibility and booking? (who counts as \"in the org\"?) [ex-#184 ON-Q03 context + E01/E01A] — CHANGED (member now partly defined)\n\n**Plain English:** the org tier sits between chain and public, and earlier audiences keep access. What changed: the code now defines \"member\" for one purpose — getting into a *public* shift without the Verified check. It still doesn't define who counts as an org member for seeing org-tier shifts or for booking without the check.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Org tier between chain and public (E01, carried). Earlier audiences keep access (E01A, carried). \"Member\" for the public-tier exemption = active + accepted staff/favourite membership at that pharmacy + can perform the role + not anonymous (`shifts/interest.py`). Who is an \"org member\" for visibility — employee, favourite, locum on retainer, any user linked to a pharmacy in the org — is **not defined in the traced material**. The visibility queryset itself was not re-read at head (GM-11).\n**RECOMMENDED:** Org membership for *visibility* = employed staff of any pharmacy in the org + workers explicitly favourited/invited by the org; for *booking without the Verified/AHPRA gate*, only employed staff (see Q04-B). Severity: high — this is the definition that decides who sees a shift and who can be booked unchecked.\n**ALTERNATIVE A — Keep current logic:** org tier = whoever the current query returns (UNKNOWN definition). Scenario: a locum who did one shift for one Chempro site last year still sees every Chempro org-tier shift. Trade-off: no work, silent over-sharing.\n**ALTERNATIVE B — Org visibility = employed staff only:** locums/favourites see chain tier only if separately eligible. Scenario: a trusted regular locum misses org-tier shifts until favourited. Trade-off: tightest, may starve org shifts of applicants.\n**ALTERNATIVE C — Org visibility = staff +
