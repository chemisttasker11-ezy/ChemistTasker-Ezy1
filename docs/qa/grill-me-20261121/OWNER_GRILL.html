ted in code** (live, not pending; refs at `pr257` `21add924` unless marked):\n\n| Decision | Live? | Where |\n|---|---|---|\n| D96 no Explorer admins | Yes on pr257; not yet on main | `backend/access_control/admin_roles.py` |\n| Grill #9 draft roster staff deleted with the shift | Yes | `backend/workforce/roster/views.py:233-234` |\n| D2 terms accepted only as shown | Cover terms: yes on main and pr257 (`main:backend/attendance/cover_terms.py:214`). Outside offers: pr257 only (`backend/shifts/offers.py:386`, BL-21) | |\n| PR #242 items 2, 3, 7 (QR/PIN confirmations, stale cover terms, overnight activation) | Yes, merged 3 Nov | `backend/attendance/kiosk_api.py:449`, `backend/attendance/cover_terms.py`, `backend/shifts/payroll.py` |\n| ON-Q01 sign-up tracks KEEP | Yes (unchanged behaviour) | GM-01 Part B |\n| R1 record invoice payment without approval | Yes | GM-17 F11 |\n| D01, D02, D03, D04, R04A, R04B, R04C, R06, E01A, ON-Q03, ON-P01, ON-Q04 | **No, or only partly**: answered but not built | ENGINEERING_BACKLOG BL-01, BL-02, BL-03, BL-06, BL-15 |", "mine": "## 3b. Decisions I made for you: confirm or change (added 22 Nov)\n\nThe 17 waiting decisions above were only the ones I had parked for you. My decision logs also hold the calls I made myself while you were away. Most are engineering (who reviewed what, commits, test fixes) and need nothing from you. The 24 below change what users see or what is stored, so each one is now a question in its area. \"Yes\" keeps my call.\n\n| ID | Area | Platforms | Decision | Built? |\n|---|---|---|---|---|\n| GM-27-OD-01 | GM-27 | Expo only | Opening the app with no network keeps you signed in | yes: commit 172622e8 |\n| GM-27-OD-02 | GM-27 | Expo only | A saved, unsent change that the phone cannot read is never overwritten silently | yes: `frontend_mobile/features/parity/marketplace.tsx:518` and the shared saved-request store |\n| GM-05-OD-03 | GM-05 | Web + Expo | Attendance approvals and the roster need both staff and roster rights | yes: pr257 |\n| GM-05-OD-04 | GM-05 | Web + Expo | Organisation tabs are hidden when Lina lacks the right | yes: pr257 |\n| GM-05-OD-05 | GM-05 | Web + Expo | A new invitee with no name shows as their email address | yes: commit 7855bbd8 |\n| GM-05-OD-06 | GM-05 | Web + Expo | When Ali is removed, what happens to his future roster shifts? | open question |\n| GM-09-OD-07 | GM-09 | Web + Expo | A worker's correction request notifies the managers | yes: commit 7855bbd8 |\n| GM-09-OD-08 | GM-09 | Web + Expo | May a removed worker still raise a correction on a past timesheet? | open question |\n| GM-10-OD-09 | GM-10 | Web + Expo | The server refuses shift dates before today or more than 4 months ahead | yes: pr257 |\n| GM-10-OD-10 | GM-10 | Expo only | Reminder of your own decision: Expo Post shift has no separate draft/publish | your call, not built |\n| GM-16-OD-11 | GM-16 | Expo only | Both Pills entries and Pill rewards stay on Expo | yes: pr257 |\n| GM-17-OD-12 | GM-17 | Web + Expo | Organisation Invoices are on Expo but not in web's organisation menu | yes: pr257 |\n| GM-18-OD-13 | GM-18 | Web + Expo | Resending a talent pitch never creates a duplicate | yes: pr257 |\n| GM-22-OD-14 | GM-22 | Expo only | A notice about a shift at your other pharmacy opens that pharmacy | yes: commit cc5f2787 |\n| GM-24-OD-15 | GM-24 | Web + Expo | Learning pages show the \"Careers & learning\" articles | yes: commits 7855bbd8 and 22ceb013 |\n| GM-24-OD-16 | GM-24 | Expo only | Public shift links and the signed-out shift board are on Expo too | yes: pr257 |\n| GM-24-OD-17 | GM-24 | Web only | Referee forms stay web-only (intended) | yes: pr257 |\n| GM-25-OD-18 | GM-25 | Web only | Owner and organisation \"public\" and \"community\" shift boards: web pages with no menu links | yes: pr257 |\n| GM-25-OD-19 | GM-25 | Expo only | iPhones older than iOS 16.4 cannot install the app | yes: pr257 (SDK 58) |\n| GM-25-OD-20 | GM-25 | Expo only | App landing: no auto-rotating carousel; const qkey = q => q.area + '|' + q.id;
const toast = t => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); };
let cur = null;
try { const t = localStorage.getItem('grill267-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
document.getElementById('themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('grill267-theme', document.documentElement.dataset.theme); } catch (e) {}
};
function answered(a) { return a.qs.filter(q => A[qkey(q)] && A[qkey(q)].c).length; }
function progress() {
  const n = DATA.areas.reduce((s, a) => s + answered(a), 0);
  document.getElementById('count').textContent = n + ' of ' + DATA.total + ' answered';
  document.getElementById('bar').style.width = (100 * n / DATA.total) + '%';
}
function buildNav() {
  const nav = document.getElementById('nav'), sel = document.getElementById('areaSel');
  nav.innerHTML = '<div class="grp">Suggested order</div>'; sel.innerHTML = '';
  DATA.areas.forEach((a, i) => {
    const d = answered(a), t = a.qs.length;
    const el = document.createElement('a'); el.href = '#' + a.key; el.dataset.i = i;
    el.className = (cur === i ? 'on ' : '') + (d === t && t ? 'done' : '');
    el.innerHTML = '<span>' + esc(a.row + ' · ' + a.title) + '</span><small>' + d + '/' + t + '</small>';
    el.onclick = e => { e.preventDefault(); show(i); };
    nav.appendChild(el);
    const o = document.createElement('option'); o.value = i; o.textContent = a.row + ' · ' + a.title + '  (' + d + '/' + t + ')'; if (cur === i) o.selected = true; sel.appendChild(o);
  });
  sel.onchange = () => show(+sel.value);
}
function card(q, n) {
  const k = qkey(q), a = A[k] || {};
  const div = document.createElement('div'); div.className = 'q' + (a.c ? ' ' + a.c : ''); div.id = 'q-' + q.id;
  div.innerHTML = '<div class="qh"><span class="qid">' + esc(q.id) + '</span><span class="chip">' + esc(q.plat || 'Web + Expo') + '</span><span class="qn">' + n + '</span></div>' +
    '<div class="qb md">' + md(q.md) + '</div><button class="more">Show the whole question</button>' +
    '<div class="qa"><button data-c="yes">Yes, keep the recommendation</button><button data-c="change">Change</button><button data-c="defer">Defer</button><button data-c="">Clear</button>' +
    '<textarea placeholder="Your words (needed for Change; optional otherwise)"></textarea></div>';
  const body = div.querySelector('.qb'), more = div.querySelector('.more'), ta = div.querySelector('textarea');
  ta.value = a.n || '';
  requestAnimationFrame(() => { if (body.scrollHeight <= 430) { body.classList.add('open'); more.remove(); } });
  more.onclick = () => { body.classList.toggle('open'); more.textContent = body.classList.contains('open') ? 'Show less' : 'Show the whole question'; };
  const paint = () => { div.className = 'q' + (A[k] && A[k].c ? ' ' + A[k].c : ''); div.querySelectorAll('.qa button').forEach(b => b.className = (A[k] && A[k].c && b.dataset.c === A[k].c) ? 'sel-' + b.dataset.c : ''); };
  div.querySelectorAll('.qa button').forEach(b => b.onclick = () => {
    if (!b.dataset.c) { delete A[k]; ta.value = ''; } else { A[k] = {c: b.dataset.c, n: ta.value}; if (b.dataset.c === 'change' && !ta.value.trim()) { ta.focus(); toast('Write what you want instead'); } }
    save(); paint(); progress(); buildNav();
  });
  ta.oninput = () => { if (A[k]) { A[k].n = ta.value; save(); } };
  paint();
  return div;
}
function show(i) {
  cur = i; const a = DATA.areas[i], box = document.getElementById('area'); box.innerHTML = '';
  const only = document.getElementById('onlyOpen').checked;
  const h = document.createElement('h2'); h.className = 'area'; h.textContent = 'Row ' + a.row + ' · ' + a.title; box.appendChild(h);
  const src = document.createElement('div'); src.className = 'count'; src.textContent = 'Source file: ' + a.file; box.appendChild(src);
  if (a.sbs) { const d = document.createElement('details'); d.className = 'box'; d.innerHTML = '<summary>Web and Expo today, side by side</summary><div class="md">' + md(a.sbs) + '</div>'; box.appendChild(d); }
  const list = a.qs.filter(q => !only || !(A[qkey(q)] && A[qkey(q)].c));
  if (!list.length) box.insertAdjacentHTML('beforeend', '<div class="empty">' + (a.qs.length ? 'Everything in this area is answered.' : 'No open questions here.') + '</div>');
  list.forEach(q => box.appendChild(card(q, (a.qs.indexOf(q) + 1) + ' of ' + a.qs.length)));
  const nb = document.createElement('div'); nb.className = 'nav-btns';
  nb.innerHTML = (i > 0 ? '<button id="prevA">← ' + esc(DATA.areas[i - 1].title) + '</button>' : '<span></span>') + (i < DATA.areas.length - 1 ? '<button id="nextA" class="primary">Next area: ' + esc(DATA.areas[i + 1].title) + ' →</button>' : '');
  box.appendChild(nb);
  const p = document.getElementById('prevA'), n = document.getElementById('nextA');
  if (p) p.onclick = () => show(i - 1); if (n) n.onclick = () => show(i + 1);
  buildNav(); scrollTo({top: 0}); history.replaceState(null, '', '#' + a.key);
}
document.getElementById('onlyOpen').onchange = () => show(cur);
document.getElementById('exportBtn').onclick = () => {
  const lines = ['# Owner grill answers', '', 'Exported ' + new Date().toLocaleString() + '. Code: ' + DATA.code + '.', ''];
  let n = 0;
  DATA.areas.forEach(a => {
    const got = a.qs.filter(q => A[qkey(q)] && A[qkey(q)].c); if (!got.length) return;
    lines.push('## Row ' + a.row + ' · ' + a.title, '');
    got.forEach(q => { const x = A[qkey(q)]; n++; lines.push('- **' + q.id + '** (' + q.area + '): ' + ({yes: 'YES, keep the recommendation', change: 'CHANGE', defer: 'DEFER'}[x.c]) + (x.n && x.n.trim() ? ': ' + x.n.trim().replace(/\n+/g, ' ') : '')); });
    lines.push('');
  });
  const text = lines.join('\n');
  const box = document.getElementById('exportBox'), ta = document.getElementById('exportText');
  ta.value = text; box.hidden = false; scrollTo({top: 0});
  document.getElementById('copyBtn').onclick = () => {
    const ok = () => toast(n + ' answers copied. Paste them to Claude.');
    const fallback = () => { ta.focus(); ta.select(); toast('Press Ctrl+C to copy the selected text'); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  };
  document.getElementById('closeExport').onclick = () => { box.hidden = true; };
};
document.getElementById('intro').innerHTML =
  '<p><b>' + DATA.total + ' open questions</b>, each asked once, in the suggested order. Each card shows the scenario, what happens today and my recommendation. <b>Yes</b> keeps the recommendation; <b>Change</b> needs your words; <b>Defer</b> parks it.</p>' +
  '<p>Answers save in this browser as you go. Press <b>Export my answers</b> when you stop, and paste the result to Claude. Nothing is built until the whole grill is done.</p>' +
  '<details class="box"><summary>Already decided (never asked again)</summary><div class="md">' + md(DATA.bg.decided) + '</div></details>' +
  '<details class="box"><summary>The 24 decisions I made for you (they are questions in their areas)</summary><div class="md">' + md(DATA.bg.mine) + '</div></details>';
progress();
const start = DATA.areas.findIndex(a => '#' + a.key === location.hash);
show(start >= 0 ? start : Math.max(0, DATA.areas.findIndex(a => answered(a) < a.qs.length)));
</script>

</body>
</html>
