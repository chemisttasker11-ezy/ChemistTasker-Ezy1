est tell the pharmacy?\n- **Old ID:** NEW. **Status: VALIDATED.**\n- **ACTUAL TODAY:** Withdrawing interest is a silent DELETE (`offers.py:48`, no destroy override) — no notification, and escalation does NOT resume (any past interest blocks it, `escalation.py:92`).\n- **RECOMMENDED:** Notify the shift creator/managers on withdraw (in-app only, no email), and treat \"no live interest/offers\" as resuming escalation eligibility. Severity: MEDIUM. **ALTERNATIVE A — Keep current logic (silent).** **ALTERNATIVE B — Notify + resume escalation (recommended).** **ALTERNATIVE C — Notify only.** Other / defer."}, {"id": "GM-12-Q20", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q20 — Can a worker drop a reservation before payment without an incident?\n\n> **Also covers (22 Nov):** GM13-Q04 (GM-13), GM15-40 (GM-15). Asked once, here.\n- **Old ID:** BK-Q14. **Status: NOT RE-VALIDATED — BLOCKED (no reservations module).**\n- **ACTUAL TODAY:** No `reservations.py` exists in `backend/shifts/` at head; no reservation-expiry beat job was found in `settings.py`/`celery.py`. The Oct 2026 claim (unpaid reservations expire under D03) has no implementation traced in this area. The accept path proves the reservation *state* (`ACCEPTED_AWAITING_PAYMENT`, `shift.payment_status = 'PENDING'`), but withdrawal-before-payment has no rule and no endpoint in the files traced. This is GM-13 (billing) territory.\n- **RECOMMENDED (provisional):** Worker may withdraw an unpaid reservation freely (no incident, no fee) — it is not yet a confirmed booking; notify the pharmacy at once so the shift re-opens. **ALTERNATIVE A — Withdraw freely (recommended).** **ALTERNATIVE B — Withdraw counts as a decline (affects re-offer only).** **ALTERNATIVE C — No withdraw; wait for expiry.** Other / defer. Re-validate against GM-13 before deciding."}, {"id": "GM-12-Q21", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q21 — When a worker is booked, what happens to their overlapping applications?\n- **Old ID:** BK-Q10. **Status: VALIDATED — CHANGED (no handling proven).**\n- **ACTUAL TODAY:** `finalize_shift_offer` (`finalize.py`) has NO overlap handling: nothing withdraws the worker's other pending interests/offers on other shifts, and nothing blocks overlapping bookings across shifts. A worker booked 09:00–17:00 on shift A keeps live interests/offers for overlapping shift B.\n- **RECOMMENDED:** Auto-withdraw the worker's other PENDING interests/offers that overlap the booked time, and tell the affected pharmacies \"worker booked elsewhere\". Severity: MEDIUM-HIGH. **ALTERNATIVE A — Keep current logic** (no withdrawal). **ALTERNATIVE B — Withdraw overlapping offers only, keep interests.** **ALTERNATIVE C — Leave everything; let the worker decline.** Other / defer."}, {"id": "GM-12-Q22", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q22 — Can a worker hold a reservation that overlaps another booking or roster shift?\n- **Old ID:** BK-Q11. **Status: VALIDATED — CHANGED (no block proven).**\n- **ACTUAL TODAY:** No cross-shift overlap block exists in `finalize.py` or the accept path; the slot lock is per-shift only. A worker can hold a reservation overlapping another confirmed booking or roster shift.\n- **RECOMMENDED:** No — block acceptance where the time overlaps a confirmed booking or roster shift (same check as the slot lock, extended across shifts). Severity: MEDIUM-HIGH. **ALTERNATIVE A — Allow, warn only.** **ALTERNATIVE B — Block (recommended).** Other / defer."}, {"id": "GM-12-Q23", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q23 — Should must-have requirements block applying?\n- **Old ID:** BK-Q12. **Status: PARTLY VALIDATED.**\n- **ACTUAL TODAY:** No must-have gate in `express_interest` (role only, `interest.py:79`). Posting-side fields exist (`must_have`/`nice_to_have` on Shift; serializer normalises them and forbids overlap between the two lists — `serialization/shifts.py`). Whether the frontend shows must-haves on the apply screen is NOT inspected.\n- **RECOMMENDED (provisional):** Must-haves block interest with a clear reason; nice-to-haves never block. **ALTERNATIVE A — Never block (show only).** **ALTERNATIVE B — Block on must-haves (recommended).** Other / defer."}, {"id": "GM-12-Q24", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q24 — Should reservations show a live payment countdown? / What happens after booking payment fails?\n\n> **Also covers (22 Nov):** GM13-Q03 (GM-13), GM25-C18 (GM-25). Asked once, here.\n- **Old ID:** BK-Q13 + BK-R01 (gap SH-13). **Status: NOT RE-VALIDATED** (frontend + billing not inspected; reservation-expiry implementation not found — see Q20).\n- **ACTUAL TODAY (Oct 2026 only):** both sides see reserved-not-confirmed wording + pay-by time, no live countdown; on payment failure the reservation lives until its deadline with no retry/extension rule. The shared-core API exposes `acceptShiftOffer` / `activateShiftOfferPayroll` but no countdown logic was seen in `api.ts`. Do not present Oct 2026 as current.\n- **RECOMMENDED (provisional):** Live countdown on web + Expo; on payment failure, one automatic retry window + immediate release if the pharmacy chooses, else release at deadline (D03). **ALTERNATIVE A — Keep current logic.** **ALTERNATIVE B — Countdown + auto-release on first failure.** **ALTERNATIVE C — Countdown + extend once by 30 min.** Other / defer. Re-validate against GM-13 + the offer screens before deciding."}, {"id": "GM-12-Q25", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q25 — What must the worker see before accepting? Does the pharmacy accept the same agreement?\n\n> **Also covers (22 Nov):** GM14-Q02 (GM-14), GM14-Q03 (GM-14). Asked once, here.\n- **Old ID:** AG-Q01 + AG-Q02 (gap SH-09). **Status: VALIDATED — CHANGED (terms contents now proven).**\n- **ACTUAL TODAY:** Accept enforces a terms version match (409 TERMS_CHANGED) and freezes the accepted terms snapshot (`offers.py:392-408`; `engagement.py:freeze_accepted_terms`). The snapshot is `version: 1` and contains **NO cancellation table, NO platform terms version, and NO pharmacy-side acceptance** (`engagement.py:build_shift_engagement_terms`). Only the WORKER accepts in the traced code; staff path has `acceptance_required=False`. Award terms are computed (`_build_tfn_award_terms`: pharmacist above Award floor else ValidationError; >12h shift → payroll review; pre-7am weekday/Saturday → overtime review; overtime NOT auto-computed).\n- **RECOMMENDED:** Show pay, times, breaks, duties, site, cancellation table + platform terms version before accept; record pharmacy acceptance of the same terms. Severity: HIGH (P09 fees cannot be charged without pre-acceptance disclosure). **ALTERNATIVE A — Keep current logic** (pay/times/legal notices only — Oct 2026). **ALTERNATIVE B — Full disclosure + dual acceptance (recommended).** Other / defer. **Decide jointly with GM-13 (agreement/terms) and GM-14 (Award).**"}, {"id": "GM-12-Q26", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q26 — Code-gap timing questions (LAUNCH area, GM-12 slice)\n- **LA-Q05** (payment readiness surfaced late): ON-Q04 is answered. Engineering: see BL-03 for the early notice and acceptance gate. Launch timing is in LAUNCH-01.\n- **LA-Q09** (pending offers can outlive the shift — SH-07): **VALIDATED.** Lazy expiry + no start-cap confirmed; 48h value confirmed. Fix before launch? A/B/C — cap at start + eager expiry.\n- **LA-P03** (chain/org shifts skip the shared AHPRA gate): answered in ON-Q03. Engineering: see BL-01. Launch scope: see LAUNCH-01.\n- **LA-Q15** (web/mobile disagree on Talent Board booking permissions — TB-07): **NOT RE-VALIDATED** (no frontend inspected). Narrowed: both clients share one API client (`shared-core/api.ts`), so the *endpoint* behaviour cannot disagree; whether both UIs expose the same actions is NOT verified. Fix before launch? A/B/C.\n\n---"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Express interest in shift slots | Worker submits interest via `expressInterestInPublicShiftService` (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:284`). | Worker submits interest via `expressInterestInShiftService` (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:234`). | Yes | - |\n| View applicants & reveal candidates | Manager reviews applicants in candidates drawer (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/index.tsx:157`). | Manager reviews applicants on candidates screen (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:285`). | Yes | - |\n| Send shift offer with 48h expiry | Manager dispatches offer to candidate (`frontend_web/src/pages/dashboard/sidebar/ShiftsBoard/hooks/useCounterOffers.ts:418`). | Manager dispatches offer to candidate (`frontend_mobile/roles/shared/shifts/ShiftsBoard/hooks/useCounterOffers.ts:434`). | Yes | - |\n| Accept pending offer | Worker reviews terms dialog and accepts offer (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:468`). | Worker reviews terms dialog and accepts offer (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:356`). | Yes | - |\n| Decline pending offer | Worker declines offer via `declineShiftOfferService` (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:529`). | Worker declines offer via `declineWorkerShiftOfferService` (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:393`). | Yes | - |\n| Remind worker with buzz | Manager triggers buzz reminder subject to 1h cooldown (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/index.tsx:167`). | Manager triggers buzz reminder subject to 1h cooldown (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:775`). | Yes | - |\n| Counter-offer workflow | Worker submits proposed terms and manager can accept or reject (`frontend_web/src/pages/dashboard/sidebar/ShiftsBoard/hooks/useCounterOffers.ts:111`). | Worker submits proposed terms and manager can accept or reject (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/components/Candidates/StatusCard.tsx:126`). | Yes | - |", "file": "areas/GM-12-interest-offers.md"}, {"key": "GM-13", "row": "4", "title": "GM-13 Reservation/payment", "qs": [{"id": "GM13-Q08", "area": "GM-13", "plat": "Web + Expo", "md": "### GM13-Q08 — What happens after booking payment fails? (carried BK-R01; SH-13 has no definition)\n\n> **Also covers (22 Nov):** GM15-41 (GM-15), GM16-Q07 (GM-16). Asked once, here.\n\n**Plain English:** a failed or cancelled Stripe checkout does not confirm the booking. The owner can resume the same checkout or expire it and start a replacement — but there is no \"original deadline\" to retry until, because D02 was never built; the practical bound is Stripe's 24-hour session. And the gap this question cites, SH-13, is never defined anywhere in the #184 audit.\n**ACTUAL TODAY — Web:** 409 conflict dialog (resume / expire-and-replace / cancel) + `useShiftPaymentActions.recoverCheckout`. **ACTUAL TODAY — Expo:** same via native alert. **Backend:** failed Stripe call → 400, attempt unchanged; uncertain provider acknowledgement → 503 `checkout_uncertain` (\"Retry this unchanged request; do not create another payment\"); expired/unpaid session must be provider-confirmed before a replacement.\n**RECOMMENDED:** KEEP the retry-until-deadline rule **once Q01 creates a deadline**; until then the rule is \"retry the same attempt (resume) or expire-and-replace, within the Stripe session's 24 h\". Severity: medium. Also: SH-13 must be defined or dropped — it cannot be cited as a gap.\n**ALTERNATIVE A — Keep current logic (as above).** **ALTERNATIVE B — Release immediately:** one failed attempt loses the worker. **ALTERNATIVE C — Extend once:** failure grants extra reservation time.\n**Other / Defer.**\n**Sources:** `backend/billing/checkout_reservations.py` (`prepare_checkout`, `open_checkout`, `expire_checkout`), `frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts`, `docs/qa/launch-grill/AUDIT.md` (no SH-13).\n**Decision status:** OPEN."}, {"id": "GM13-Q12", "area": "GM-13", "plat": "Web + Expo", "md": "### GM13-Q12 — Legacy cancellation charge (LA-Q06 / SH-02)\n\n> **Also covers (22 Nov):** GM15-46 (GM-15), GM16-Q03 (GM-16), GM17-Q17 (GM-17), GM-18-Q20 (GM-18). Asked once, here.\n\n**Status:** Engineering: see BL-04. Preserve the route and client export behind the existing live-charge flag. Launch scope is owned by GM15-01 and LAUNCH-01."}, {"id": "GM13-Q13", "area": "GM-13", "plat": "Web + Expo", "md": "### GM13-Q13 — Launch scope for bookings that can strand a checkout (LA-P01)\n\n> **Also covers (22 Nov):** GM15-44 (GM-15). Asked once, here.\n\n**Scenario:** Tom has opened Stripe Checkout for Sara. Her AHPRA status changes before he pays. Tom needs to book Ben instead.\n**What happens today:** The cancellation declines Sara's offer and leaves the unpaid Stripe session and its hold active. Those can block the replacement (`pr257:backend/shifts/cancellation.py:74`).\n**Recommendation first: A.** Include live fulfilment only after the checkout release works here.\n- **A (recommended):** Tom can use live fulfilment at launch if the fix lands and is verified.\n- **B:** Tom can launch with live fulfilment switched off. Card payments follow after the fix is verified.\n\n**Status:** OPEN (launch scope, decide once at LAUNCH-01). Engineering: see BL-09."}, {"id": "GM-13-W01", "area": "GM-13", "plat": "Web + Expo", "md": "### GM-13-W01: Should operator recovery of a paid orphan checkout ever book the work? (W-14, register item 4)\n**Scenario:** An operator releases the hold on Tom's checkout. A delayed Stripe session appears and cannot be expired. Tom pays it. It covers two separate offers for Sara, and Ben now holds one date on her second offer.\n**What happens today:** Recovery can finalise an offer only if the original attempt holds every date on it. Sara can get the first offer. Ben's date blocks the whole second offer, even if its other dates are free. The payment is flagged for reconciliation and the managers are notified. Recovery issues no refund (`pr257:backend/billing/checkout_reservations.py:251`, `pr257:backend/billing/fulfillment.py:67`, `pr257:backend/billing/paid_fulfillment.py:36`).\n**Recommendation first: A.** Make operator-recovered orphan checkouts a narrow exception to F04. Accept only an offer the original checkout can still fulfil in full.\n- **A (recommended):** Sara gets the first offer and Ben keeps his date. Tom gets a reconciliation notice for the unbookable offer. He can choose credit or refund after approved review.\n- **B:** Apply F04 even to recovered orphan checkouts. Sara gets neither offer from this payment. Tom chooses credit or refund after approved review and can start a new booking.\n- **DEFER**\n\n**Status:** OPEN; must be decided before real card payments."}, {"id": "GM-13-W02", "area": "GM-13", "plat": "Web + Expo", "md": "### GM-13-W02: Should only a recorded cancellation release paid work? (W-14, register item 5)\n**Scenario:** A privileged repair removes Sara's paid assignment rows without recording a cancellation. Tom tries to book Ben for one of those dates.\n**What happens today:** Ordinary shift deletion and pharmacy or organisation cascades guard paid bookings (`pr257:backend/shifts/deletion.py:8`, `:30`). If an exceptional path removes the rows, the next checkout or fulfilment check can release the work. A slotless offer keeps its hold while accepted. Removing rows alone creates no cancellation record or outcome (release register item 5).\n**Recommendation first: A.** Release paid work only after a recorded cancellation. Apply the carried fee and notice rules and keep an audit trail.\n- **A (recommended):** Tom can rebook once the cancellation is recorded. A privileged repair also needs that record before it releases the dates.\n- **KEEP:** Tom can rebook once the app sees the assignment rows are gone. A slotless offer still holds while accepted.\n- **DEFER**\n\n**Status:** OPEN; must be decided before real card payments."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Worker accepts offer and creates reservation | Offer transitions to `ACCEPTED_AWAITING_PAYMENT` holding the slot (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:468`). | Offer transitions to `ACCEPTED_AWAITING_PAYMENT` holding the slot (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:356`). | Yes | - |\n| Owner opens Stripe checkout | Calls `chargeShiftFulfillment` and redirects to Stripe Checkout (; Next lacks payment UI at ) (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:30`). | Calls `chargeShiftFulfillment` and opens Stripe Checkout URL via `Linking.openURL` (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:228`). | Yes | - |\n| Stripe checkout completes via webhook | Webhook finalises booking and web UI refreshes on reload (`backend/billing/webhooks.py:25`). | Webhook finalises booking and mobile UI updates on reload (`backend/billing/webhooks.py:25`). | Yes | - |\n| Owner pays booking with Pills | Owner invokes `payShiftWithPills` to finalise shift without Stripe (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:12`). | Owner invokes `payShiftWithPills` to finalise shift without Stripe (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:204`). | Yes | - |\n| Concurrent checkout conflict | Displays conflict dialog offering to resume or expire session (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:5`). | Displays native alert offering to resume, expire, or cancel (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:246`). | Yes | - |\n| Lazy offer expiry | Offer list query triggers backend bulk-expiry of stale offers (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:374`). | Offer query triggers backend bulk-expiry of stale offers (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:154`). | Yes | - |", "file": "areas/GM-13-reservation-payment-confirmation.md"}, {"key": "GM-16", "row": "4", "title": "GM-16 Subscriptions/fees", "qs": [{"id": "GM16-Q01", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q01 — [PO-Q16 / SH-03] Should the booking fee depend on shift length? — 🔄 CHANGED (partly)**\n\n> **Also covers (22 Nov):** GM17-Q08 (GM-17). Asked once, here.\n- ACTUAL TODAY (verified, `shift_payments.py` + `checkout_prices.py`): fee is flat per accepted offer — $30 locum / $80 PT-FT, `quantity = len(offer_ids)` — whatever the hours or days. A 10-day block under one offer = one fee.\n- What changed since Oct 2026: the subscriber half-price is NOW applied ($15/$40). The flat per-offer shape is unchanged; no per-day / %-of-wages option exists in this file.\n- RECOMMENDED: keep flat per-offer for launch (simple, matches the code), revisit per-day only if multi-day blocks are common. Severity: low-medium (fairness, not correctness).\n- ALTERNATIVE A — Keep current logic: one fee per offer, any length. Scenario: pharmacy books a locum for 10 days in one offer, pays $30 once; a pharmacy booking 10 separate one-day offers pays $300. Trade-off: simple but rewards block-booking and penalises split bookings.\n- ALTERNATIVE B — Per shift day: same $30/$80 per date in the offer. Scenario: the 10-day block costs $300; single days unchanged. Trade-off: fairer per day, but more expensive for blocks and needs the offer→dates count wired into checkout.\n- ALTERNATIVE C — Percentage of wages: e.g. 5% of agreed wages. Scenario: a $2,000 week costs $100 vs $30 today. Trade-off: scales with value, harder to explain, needs wage math at checkout.\n- Other / defer. Edge cases: multi-slot offers (quantity counts offers, not slots — verified in `prepare_checkout`/`occurrence_keys`: reservations never change fee quantity); free-trial/pre-live path bypasses all of this.\n- Source: `backend/billing/shift_payments.py::charge_shift_fulfillment` + `checkout_prices.py::FULFILLMENT_PRICES` @ 97c4543e."}, {"id": "GM16-Q02", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q02 — [LA-Q07 / SH-03] Fix before launch? Subscribers charged full price; Stripe price IDs hard-coded. — 🟢 PART-FIXED**\n\n> **Also covers (22 Nov):** GM-18-Q21 (GM-18), GM26-Q34 (GM-26). Asked once, here.\n- ACTUAL TODAY (verified): subscriber discount IS now applied — `is_subscriber` (local status `active`) selects the $15/$40 Price IDs. The Oct 2026 bug (computed but unused) is gone. Price IDs are STILL hard-coded (`checkout_prices.py`, `stripe_support.py`: `BASE_SUB_PRICE`, `EXTRA_SEAT_PRICE` + 4 fulfilment IDs); test and live cannot differ.\n- RECOMMENDED: keep the discount logic; fix the hard-coded IDs (env/config per environment) before any live checkout. Severity: high for the config half (a test-mode checkout in production, or vice versa, charges real money or fails); the discount half is done.\n- ALTERNATIVE A — Keep current logic: hard-coded IDs, one set for all environments. Scenario: staging checkout uses the live $30 price. Trade-off: works until someone tests with real money. (Note the guard helps here: staging + live key is rejected by `release_guards.py`, and live collection needs the flag — but a wrong *test* price in production would still charge the wrong amount.)\n- ALTERNATIVE B — Price IDs from settings/env per environment + a test-price mapping. Scenario: staging uses test prices, production uses live prices, same code. Trade-off: small config change, needs deploy-time values.\n- Other / defer. Edge: `is_subscriber` reads the *local* status, which the webhook maps from Stripe `trialing` → `active` — trialling owners get the discount (see GM16-Q08).\n- Source: `backend/billing/shift_payments.py` + `checkout_prices.py` + `stripe_support.py` @ 97c4543e. Code gap (config), not a decision gap, for the hard-coded half; the discount half needs no decision."}, {"id": "GM16-Q04", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q04 — [PO-Q15 / SH-04] When should booking fees start? — 🔄 CHANGED (mechanism fully verified now)**\n\n> **Also covers (22 Nov):** GM17-Q07 (GM-17). Asked once, here.\n- ACTUAL TODAY (verified, `settings.py:674-682` + `utils.py` + `release_guards.py`): **two mechanisms coexist.** (1) `BILLING_LIVE_DATE = _date(2025, 6, 1)` with comment \"June 1, 2026 — flip this to go live\" — the date/comment contradiction is real at head — and `FREE_TRIAL_DAYS = 0`; `get_billing_state_for_account` returns PRE_LIVE before the date, FREE_TRIAL within the trial window, else PAYMENT_REQUIRED. (2) Live *collection* is separately gated by `BILLING_LIVE_SHIFT_FULFILLMENT_ENABLED` (default False) + Stripe key mode (test only in non-production envs; staging + live key rejected). The Oct 2026 claim (\"live 2025-06-01, comment says 2026, FREE_TRIAL_DAYS = 0\") describes mechanism (1) correctly; mechanism (2) is new since Oct.\n- RECOMMENDED: do not decide the launch date/trial until the owner confirms which gate is authoritative — the date, the flag, or both — and the contradiction (2025 date vs 2026 comment) is resolved in code. Severity: high (decides whether the first booking costs money).\n- ALTERNATIVE A — Keep current logic (date + flag as coded). Cannot be stated honestly as a single rule until the owner confirms the interaction — do not pick this blind.\n- ALTERNATIVE B — Free until a set date. ALTERNATIVE C — N-day trial per new pharmacy. (Both as in #184; scenarios unchanged: a new pharmacy's first booking is free vs paid.)\n- Other / defer.\n- Source: `backend/core/settings.py:674-682`, `backend/billing/utils.py`, `backend/billing/release_guards.py` @ 97c4543e."}, {"id": "GM16-Q06", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q06 — [PO-Q04] Should the pharmacy see the full cost before posting? — 🔄 CHANGED (pay-time half verified; pre-posting half not re-validated)**\n\n> **Also covers (22 Nov):** GM17-Q10 (GM-17). Asked once, here.\n- ACTUAL TODAY (verified at pay time): the owner card shows a total — but it is **`$n × 30 AUD` regardless of type or subscriber status** (Vite `ActiveShiftCard.tsx`, Expo `ActiveShiftsPage/ActiveShiftCards.tsx`). A PT/FT booking ($80 / $40) is displayed as $30/offer; a subscriber's $15/$40 is displayed as $30/offer. The server charges the right price (GM16-Q01) — the display is wrong. Whether the posting wizard shows wages/super/fee/GST/total before posting was **not** re-traced (posting wizard screens not read in this trace).\n- RECOMMENDED: A — show wages, super, fee, GST, total before posting **and** before payment — with the fee computed from the same price table the server uses (locum vs PT/FT, subscriber vs standard), not a hard-coded $30. Severity: high (the current display misstates the price for PT/FT and subscribers). Needs the GST decision first (GM16-Q15).\n- ALTERNATIVE A — Keep current logic: `$n × 30` at pay time; wizard as-is. Trade-off: no work; PT/FT and subscriber owners are shown the wrong total until Stripe.\n- Other / defer.\n- Source: pay card (both clients) @ 97c4543e; posting wizard ❓ (not re-traced)."}, {"id": "GM16-Q08", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q08 — (new, from verified webhook code) Does a trialling subscription get the 50% discount? — verified mechanism, decision open**\n- ACTUAL TODAY (verified, `subscription_events.py`): Stripe `trialing` is stored locally as `active`, and `charge_shift_fulfillment` discounts on local `active` — so a trialling owner DOES get $15/$40. Whether a trial exists, how long it is, and whether this is intended are UNKNOWN (`FREE_TRIAL_DAYS = 0` in settings suggests no trial is currently configured — but `is_in_free_trial` uses a per-user window, and the Stripe-side trial would come from the Price/checkout configuration, which was not traced).\n- RECOMMENDED: confirm deliberately — trialling owners getting the discount is a sensible acquisition rule, but only if a trial is a real, bounded offer. Severity: medium (revenue).\n- ALTERNATIVE A — Keep current logic: trial = active = discount. Scenario: a pharmacy in a 14-day trial books 5 locum shifts at $15 instead of $30. Trade-off: generous trial, lower trial revenue.\n- ALTERNATIVE B — Trial gets no discount until first paid invoice. Scenario: same 5 shifts cost $150 during trial. Trade-off: protects revenue, weaker trial.\n- ALTERNATIVE C — Discount only after the trial converts. Trade-off: simplest to explain, hardest to sell.\n- Other / defer. Edge: a subscription that lapses from `trialing` without payment goes `inactive` (see GM16-Q09) — the discount then stops mid-reservation with no in-code warning.\n- Source: `backend/billing/subscription_events.py` + `shift_payments.py` @ 97c4543e."}, {"id": "GM16-Q09", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q09 — (new, from verified webhook code) What happens the day a subscription lapses? — verified mechanism, decision open**\n- ACTUAL TODAY (verified, `subscription_events.py` + `shift_payments.py`): Stripe past-due/unpaid → local `inactive` → **full price immediately** (`$30/$80`), no grace period in code, no warning in either file or on either management screen (the screens show the renewal date but no lapse warning). Stripe `customer.subscription.deleted` → local `canceled` → full price, and only a new paid base checkout can revive it. `current_period_end` is stored and displayed, but nothing honours it.\n- RECOMMENDED: add a short grace period (e.g. discount holds until `current_period_end`, or 7 days past-due) and a warning before the first full-price checkout. Severity: high (a pharmacy that misses one $30 payment silently pays double on the next booking; disputes and churn risk).\n- ALTERNATIVE A — Keep current logic: full price the moment Stripe says not-active. Scenario: card expires on the 1st, owner books on the 2nd and pays $80 instead of $40 with no notice. Trade-off: simplest code, worst surprise.\n- ALTERNATIVE B — Grace until `current_period_end`: discount holds for the paid period even after cancellation. Scenario: owner cancels mid-month, keeps $15/$40 until month-end, then full price. Trade-off: matches what \"I paid for a month\" means; needs the checkout to read `current_period_end`.\n- ALTERNATIVE C — 7-day past-due grace + email/SMS warning, then full price. Scenario: failed payment on the 1st, owner warned, books on the 5th still at $40. Trade-off: forgiving, needs dunning notices.\n- Other / defer. Edge: extra-seat addon deleted → `staff_count` resets to 5 immediately (see GM16-Q10); retry/concurrency: webhook re-retrieves from Stripe under row lock, so out-of-order events are safe. Denied role/wrong tenant: webhook rejects mismatched Stripe customer (verified).\n- Source: `backend/billing/subscription_events.py` (`handle_subscription_updated`, `handle_invoice_paid`, `handle_subscription_deleted`) + `shift_payments.py` @ 97c4543e."}, {"id": "GM16-Q10", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q10 — (new, from verified webhook code) What happens to staff over 5 when extra seats drop? — verified reset; gating UNKNOWN**\n- ACTUAL TODAY (verified): base plan carries `staff_count = 5`; extra seats add `5 + n`. If the addon subscription is deleted, `staff_count` resets to 5 immediately. What \"staff_count\" gates (who counts, what happens to person 6 — blocked, removed, grandfathered, billed) is **UNKNOWN** — the gating code was NOT read (`test_subscription_accounts.py` not fetched; no enforcement was found in the traced files).\n- RECOMMENDED: decide before launch; do not let a billing event silently remove people's access. Severity: high (access loss). ALTERNATIVE A — Keep: reset to 5, 6th+ staff lose access at once. ALTERNATIVE B — Grandfather existing staff, block new adds above 5. ALTERNATIVE C — Downgrade only at next renewal. Other / defer. **Re-trace the gating code before deciding.**\n- Source: `backend/billing/subscription_events.py` @ 97c4543e; gating ❓."}, {"id": "GM16-Q11", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q11 — [CX-Q02 + P09 + NOPEN] Who receives the owner cancellation fee, and does the legacy penalty conflict? — ❓ + verified conflict**\n\n> **Also covers (22 Nov):** GM15-02 (GM-15), GM17-Q04 (GM-17). Asked once, here.\n- Oct 2026: P09 set a % of agreed wages but no recipient; F01 keeps booking fee and worker pay separate; #184 rec: A (worker, as cancellation pay). NOT re-validated as a decision. NEW verified facts: the only charging code at the head (`charge_penalty`) pays nobody — it is a platform Stripe checkout with no payee — and its bands (10/20%) differ from P09 (0–30%). It also charges on *all* assignments, not cancelled dates only. The route + view + shared-core export are all live (§1b).\n- RECOMMENDED: decide recipient + bands + legal review together (with GM16-Q03/Q14); do not launch any cancellation charge until then. Severity: high (legal/financial).\n- ALTERNATIVE A — Worker, as cancellation pay (via payroll/invoice, CX-Q22). ALTERNATIVE B — Platform keeps it. ALTERNATIVE C — Split. Other / defer.\n- Source: `shift_payments.py::charge_penalty` @ 97c4543e; P09/GM-15 adopted."}, {"id": "GM16-Q13", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q13 — [CX-Q03] If the pharmacy cancels an unpaid reservation, is any fee due? — ✅ STILL VALID (now verified)**\n\n> **Also covers (22 Nov):** GM15-03 (GM-15). Asked once, here.\n- Oct 2026: not built; #184 rec: A (no fee; worker notified), because D01 makes payment the confirmation point. **Now verified:** there is no pharmacy-cancel transition for unpaid reservations at all — the only ways an unpaid reservation ends are payment, explicit checkout expiry, AHPRA decline, or Stripe session lapse (GM-13). No fee is charged on any of those paths (expiry is free; AHPRA decline is free).\n- RECOMMENDED: A — no fee; worker notified (the notification half needs GM13-Q02's expiry notices to exist). Severity: low.\n- ALTERNATIVE A — No fee (recommended). ALTERNATIVE B — Fee bands apply: treat it like a confirmed booking (contradicts D01).\n- Other / defer.\n- Source: `checkout_reservations.py`, `cancellation.py` @ 97c4543e; GM-15 adopted."}, {"id": "GM16-Q14", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q14 — [LA-R02 / SH-16] May cancellation charges launch before Australian legal review? — ✅ still open (decision)**\n\n> **Also covers (22 Nov):** GM15-49 (GM-15), GM26-Q31 (GM-26). Asked once, here.\n- Oct 2026: P08/P09 define % charges; no review of classification, proportionality, or unfair-contract-term compliance (penalties for unfair standard-form terms apply since Nov 2023). #184 rec: A (legal review before launch). Nothing in the verified files shows a review happened. The legacy penalty still being routed + exported makes this launch-gating. ALTERNATIVE A — Legal review before launch. B — Disclosure is enough. C — Never charge. Other / defer.\n- Source: #184 Oct 2026; no review evidence in any verified file @ 97c4543e."}, {"id": "GM16-Q15", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q15 — [LA-R01 / SH-15] Booking fees: GST and tax invoice? — ✅ STILL VALID (now verified)**\n\n> **Also covers (22 Nov):** GM14-Q11 (GM-14), GM17-Q06 (GM-17), GM26-Q33 (GM-26). Asked once, here.\n- Oct 2026: fixed Stripe prices, no stated GST treatment, no platform tax invoice. **Now verified:** no GST mention in any traced billing file (`checkout_prices.py` is bare cents; `stripe_support.py` has no tax settings; `OwnerBillingPage.tsx` and the pay card show no GST line); the only GST fact in the code is the `gst_registered` flag on ABN worker terms (GM-14). Applies to the $30/$80 fees AND the $30/month subscription AND extra seats (Stripe Price dollar value UNKNOWN from code). Re-trace: none needed for the gap — it is verified absent.\n- RECOMMENDED: A (before launch — tax advice, correct GST treatment, total shown before payment, invoice/receipt from correct supplier). Needs qualified tax advice, not just an opinion.\n- ALTERNATIVE A — Tax advice + correct treatment before launch (recommended). B — Disclosure is enough. C — No GST treatment (not a real option without advice).\n- Other / defer.\n- Source: `checkout_prices.py`, `stripe_support.py`, `OwnerBillingPage.tsx`, pay card @ 97c4543e; GM-14/GM-17."}, {"id": "GM16-Q16", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q16 — Subscription management: where, by whom, and what does cancelling do? — ✅ VERIFIED (screens now traced)**\n- ACTUAL TODAY (verified): **Web** — `OwnerBillingPage.tsx`: plans / subscribe / manage; card or invoice; seats; renewal date from `currentPeriodEnd`. **Expo** — `roles/owner/subscription-seats.tsx`: same data + actions with `platform: 'mobile'`. **Who:** `user_can_manage_billing_for_pharmacy` (owner, billing managers, scoped org admins — `utils.py`); the views enforce it (403 otherwise). **Cancelling: there is no way to cancel from the app** — no endpoint, no route, no UI on either client; a subscription ends only via Stripe (webhook `deleted` → local `canceled`). How the owner initiates that is UNKNOWN. **Next:** no subscription/billing page in the migrated copy.\n- RECOMMENDED: decide the cancel path before launch — at minimum a \"cancel at period end\" action in the app (with the grace rule from Q09-B if chosen) or a documented Stripe-portal link. Severity: high — owners cannot leave; a subscription that cannot be cancelled is a consumer-law problem. ALTERNATIVE A — Keep current logic (cancel only via Stripe, undocumented). ALTERNATIVE B — In-app cancel at period end (discount holds until `currentPeriodEnd`). ALTERNATIVE C — In-app immediate cancel + refund of the remainder (needs GM-17's refund rule). Other / defer.\n- Edge: invoice-path subscriptions stay `inactive` until the invoice is paid — an owner who chose invoice and never pays has no subscription and no discount, with no dunning in the traced code.\n- Source: `OwnerBillingPage.tsx`, `roles/owner/subscription-seats.tsx`, `subscription_operations.py`, `views.py`, `urls.py` (GM-17) @ 97c4543e."}, {"id": "GM16-Q17", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q17 — Pills: what are they, what are they worth, do they touch money? — ✅ VERIFIED (fully traced this re-run)**\n- ACTUAL TODAY (verified, §1f): Pills are referral-earned credits (100 friend / 50 shift referral) recorded in an append-only ledger; **200 pills pays one fulfilment fee** (per selected pending offer) instead of Stripe. They do not offset the subscription, do not discount Stripe fees, never expire as ledger entries, cannot be bought or transferred, and are awarded only after the referred user is verified (OTP + onboarding). Earn is referral-only — there is no award for completed shifts, ratings, or anything else in the traced code. Pills survive account pause? UNKNOWN (no pause interaction traced — AHPRA suspension cancels bookings but the ledger is untouched in the traced code). Pills on a cancelled/refunded booking: UNKNOWN — `pay_shift` spends at finalisation; if the booking is later cancelled there is no pill refund/reversal path in the traced code (a REVERSAL entry type exists in the enum, but no writer was found).\n- RECOMMENDED: keep the 200-pill price for launch, and decide the two unknowns now: (a) cancelled-booking pill refunds (reverse the spend, or keep it — the money was never taken by Stripe, so a reversal is cheap and fair); (b) whether Pills are shown as a dollar value anywhere (they are not — the screens show \"N pills per shift post\", which is honest). Severity: medium (money-adjacent). ALTERNATIVE A — Keep current logic (200/post, no refunds, no expiry). ALTERNATIVE B — Lower/raise the price (e.g. 100/post = 1 friend referral per booking). ALTERNATIVE C — Let Pills offset the subscription too (needs a Stripe-side mechanism that does not exist). Other / defer.\n- Edge: self-referral and same-billing-identity referrals are blocked; referral awards need the referred user verified, so a referrer can wait indefinitely for pills from an unverified friend (event stays CLAIMED).\n- Source: `backend/rewards/{models,services,views,serializers,urls}.py`, `PillsPage.tsx`, `PillsScreen.tsx`, `shared-core/src/domains/rewards/api.ts` @ 97c4543e."}, {"id": "GM16-Q18", "area": "GM-16", "plat": "Web + Expo", "md": "**GM16-Q18 — [AG-Q01/AG-Q02, GM-16 angle] Does the pharmacy ever agree the fee/subscription terms that bind it? — ✅ STILL VALID (now verified via GM-14)**\n- Oct 2026: only the worker accepts terms; the pharmacy never records acceptance of the owner fee table (P09) or, by extension, the subscription/fee terms. **Now verified (GM-14):** `freeze_accepted_terms` stamps worker id + time only; no pharmacy acceptance exists anywhere. If the $30/$80 + $15/$40 table is only shown at Stripe checkout, it is arguably not agreed before the booking.\n- RECOMMENDED: A — pharmacy accepts when it sends/approves, logged with time + terms version (GM-14-Q03 owns the wording; GM-16 adopts it). Severity: high (enforceability of every fee in this area).\n- ALTERNATIVE A — Keep current logic: worker-only acceptance. Other / defer.\n- Source: GM-14 (`engagement.py:747`); `OwnerBillingPage.tsx` (no acceptance step before subscribe — the subscribe button goes straight to Stripe Checkout)."}, {"id": "GM-16-OD-11", "area": "GM-16", "plat": "Expo only", "md": "### GM-16-OD-11: Both Pills entries and Pill rewards stay on Expo (OD-11, decisions-for-owner 4, 6d)\n**Platforms:** Expo only\n**What happens today:** Expo keeps the owner Pills entry and the Pill rewards entry separately, and keeps rewards even though the design review lists gamified rewards as an anti-pattern. Your feature, so I kept it.\n**Already implemented:** pr257\n**Recommendation:** Keep both.\n**Other option:** Merge them into one entry.\n**Status:** OPEN, confirm or change."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Shift fulfilment fee checkout (Stripe) | Shows fee card and launches Stripe checkout session (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:30`). | Shows fee card and launches mobile checkout session (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:228`). | Yes | - |\n| Pay fulfilment fee with Pills | Taps Pay with Pills button to pay via reward balance (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:12`). | Taps Pay with Pills button to pay via reward balance (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:204`). | Yes | - |\n| Subscriber discount on checkout | Server applies $15/$40 rate but UI displays flat `$n × 30` calculation bug (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/ActiveShiftCard.tsx:583`). | Server applies $15/$40 rate but UI displays same `$n × 30` calculation bug (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/ActiveShiftCards.tsx:574`). | Yes | - |\n| Owner subscription & extra seats management | Manages subscription plan, card/invoice payment, and extra seats in `OwnerBillingPage` (`frontend_web/src/pages/dashboard/sidebar/owner/OwnerBillingPage.tsx:85`). | Manages extra seats and subscription in dedicated `subscription-seats` screen (`frontend_mobile/roles/owner/subscription-seats.tsx:29`). | Yes | - |\n| Pills reward wallet & referrals | Displays pill balance, referral code, and history on Pills page (`frontend_web/src/pages/dashboard/sidebar/rewards/PillsPage.tsx:56`). | Displays pill balance and referral history via `trustRewards` (`frontend_mobile/app/rewards/pills.tsx:3`). | Yes | - |\n| Legacy cancellation penalty endpoint | Backend endpoint `/billing/charge-penalty/` has no caller in web UI (`shared-core/src/domains/billing/api.ts:67`). | Backend endpoint has no caller in mobile UI (`shared-core/src/domains/billing/api.ts:67`). | Yes | Checked 22 Nov: the shared client function exists but no web or Expo screen calls it. |", "file": "areas/GM-16-subscriptions-pills-fees.md"}, {"key": "GM-08", "row": "5", "title": "GM-08 Attendance/kiosk", "qs": [{"id": "GM-08-Q01", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q01 — Who is allowed to clock in — and should a verified locum with no booking be able to walk in and work? (FIRST QUESTION, see Part D)\n\n**Plain English:** today five kinds of people can clock in: someone with a rostered or booked shift, an employed worker with no shift that day, a favourite covering an emergency, a worker from another site in the same chain or group — and a verified pharmacist with no booking at all, who just walks in, scans the QR, and works. That last one is the big trust decision: the system lets a stranger work first and asks the manager afterwards.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `resolve_attendance_eligibility` tiers (read in full): (1) confirmed assignment, non-provisional; (2) unscheduled local employed staff, provisional; (2b) favourite locum/Shift Hero, provisional; (3) cross-site employed staff (same owner / shared active Chain / same org), provisional; (5) **unbooked verified pharmacist, provisional, live-QR only** — no assignment, no membership, no source membership; blocked only if they hold an inactive/REJECTED/LEFT local membership. All provisional sessions need a manager's approval *after* the work (approval requires the session closed, backfills a Shift/Slot/Assignment with actual times, never creates membership). Draft-roster assignments confer no eligibility. Window: ±2h around the shift, pharmacy timezone.\n**Normal case:** rostered pharmacist scans in at 8:55 for a 9:00 shift. **Edge case:** verified pharmacist with no booking walks into a busy pharmacy at 9:00, scans, works a full day provisionally; the manager approves at 17:00 (backfilled, paid on their own terms) — or rejects at 17:00 (they worked, the evidence is kept, but the session is rejected: pay/dispute handling is GM-09/GM-14). Cross-site worker from a *different* org with no chain link → rejected (`REMOTE_MEMBERSHIP_NO_CHAIN_OR_ORG_MATCH`). **Retry/concurrency:** one open session per user across all pharmacies — clocking in at site B while open at site A is refused. **Denied role / wrong tenant:** CONTACT favourites without an assignment are rejected; org-admin role alone never confers eligibility; pending/inactive memberships are rejected with a reason code. **Payment/notification side effects:** provisional approval applies the worker's own payment terms (incomplete profiles allowed, flagged `payment_profile_incomplete`, settlement TIMESHEET_ONLY); no notification is sent on clock-in, approval, or rejection (CG-03). **Web/Expo difference:** none in the rule — same backend; the *screens* that show eligibility failures were not compared (contents not read).\n**RECOMMENDED:** KEEP tiers 1–3 and 2b; KEEP tier 5 (unbooked cover) but only for *verified pharmacists* (as today) and only when the pharmacy has enabled it per site (a per-pharmacy toggle, default off at launch, so a pharmacy opts into walk-in cover deliberately). Severity: high — tier 5 is the difference between \"the roster is the plan\" and \"any verified pharmacist can create work\".\n**ALTERNATIVE A — Keep current logic:** all five tiers, tier 5 always available to any verified pharmacist by live QR. Trade-off: no work; maximum cover in an emergency, and a stranger can create a payable shift the manager must then approve or reject after the fact.\n**ALTERNATIVE B — Drop tier 5 (unbooked cover):** only assigned, employed, favourite, or cross-site workers can clock in. Trade-off: the roster is the plan, full stop; a pharmacy short-staffed on the day cannot take a walk-in locum through the kiosk (they would need a marketplace offer first, GM-12).\n**ALTERNATIVE C — Tier 5 needs a manager's live approval first:** the walk-in's clock-in pends until a manager taps approve on the kiosk/in-app. Trade-off: no work-before-approval; but the manager must be present and watching, which defeats the emergency use.\n**Other (describe) / defer.**\n**Sources:** `backend/attendance/eligibility.py` (full read), `backend/attendance/transitions.py` (`clock_in`), `backend/attendance/approvals.py` (`approve_provisional_attendance`), `backend/attendance/models.py` (`ProvisionalAttendance.CoverType`).\n**Decision status:** OPEN — NEW. **Ask first (Part D).**"}, {"id": "GM-08-Q02", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q02 — Provisional attendance: who approves it, how fast, and what if nobody does?\n\n**Plain English:** a provisional clock-in — someone with no shift who worked anyway — sits waiting for a manager until the manager approves or rejects it. There is no deadline, no reminder, and no rule for what happens if nobody ever looks at it. The worker's pay waits on that decision.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Pending provisionals list at `GET attendance/manager/pending/`; approve requires a closed session, backfills Shift/Slot/Assignment with actual times in the pharmacy timezone, is idempotent, never creates membership, applies the worker's own payment terms (incomplete allowed, flagged). Reject requires a reason; evidence is kept. **No deadline, no reminder, no auto-approve, no auto-reject, and no notification to the worker of either decision** was found in the code read. The destination pharmacy's owner/manager decides; wrong-site managers are strictly denied.\n**Normal case:** cross-site pharmacist covers a sick colleague; manager approves the same evening; backfilled shift pays on the worker's terms. **Edge case:** manager is away for a week — the provisional sits PENDING; the worker's timesheet (GM-09) presumably can't settle it until approval; whether the timesheet blocks or warns is UNKNOWN (builder not read). Provisional approved after the worker's engagement changed — the backfill uses terms at approval time (`_apply_worker_payment_terms` builds them then). **Retry/concurrency:** approval locks both rows; repeat approval is idempotent (returns the existing record). **Denied role / wrong tenant:** only the destination pharmacy's managers; an org admin without a scoped MANAGE_ROSTER capability cannot approve. **Payment/notification side effects:** approval creates the payable assignment; rejection leaves worked hours with no assignment (pay/dispute = GM-09/GM-14); nobody is notified either way (CG-03). **Web/Expo difference:** none in the rule; approval screens not traced on any client.\n**RECOMMENDED:** Approve/reject within 48 hours of clock-out (owner picks the number); remind the manager at 24h; if still pending at the timesheet lock, the timesheet shows it as \"unapproved cover — hold pay\" rather than silently dropping it. Severity: high — unapproved work is unpaid work until someone clicks.\n**ALTERNATIVE A — Keep current logic:** no deadline, no reminder, no notice. Trade-off: no work; provisionals can sit forever and workers chase managers by hand.\n**ALTERNATIVE B — Auto-approve after N hours:** a provisional nobody rejected becomes approved automatically. Trade-off: workers always get paid; a manager who was away returns to find shifts they never reviewed — and a fraudulent clock-in auto-pays.\n**ALTERNATIVE C — Auto-reject after N hours:** Trade-off: no silent approvals; but a worker who genuinely covered a shift is rejected by a timer, and the dispute has no path (Q08).\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/approvals.py` (`get_pending_provisional_attendances`, `approve_provisional_attendance`, `reject_provisional_attendance`, `_apply_worker_payment_terms`), `backend/attendance/urls.py`.\n**Decision status:** OPEN — NEW."}, {"id": "GM-08-Q03", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q03 — When does a missing worker become a no-show? (carried CX-Q11) — STILL VALID\n\n> **Also covers (22 Nov):** GM15-11 (GM-15). Asked once, here.\n\n**Plain English:** today there is no such thing as a no-show in the product. A worker who never turns up simply has no attendance record, and their shift still shows them assigned. Nobody is told, nothing is flagged, and the incident ladder (which is supposed to count no-shows) has nothing to count.\n\n**ACTUAL TODAY — Web and Expo (same backend):** No no-show state, field, transition, or job exists in `backend/attendance/` (models, transitions, approvals read in full). No scheduled task marks missing workers (no beat task for attendance was found in the files read; `backend/core/celery.py` was not read — GM-11/GM-23 territory). The rostered worker stays assigned (GM-07 R04) until a manager releases them. The incident ladder (P06/P10) is GM-15's; it has no no-show input from attendance today.\n**Normal case:** locum doesn't turn up for a 9:00 shift; at 9:30 the pharmacy is short and nobody in the product knows. **Edge case:** worker clocks in 2h late (inside the window) — is that a late arrival or a no-show who showed up? No rule exists (Q04). Worker on approved leave who was never released from the roster (GM-06-Q06) looks exactly like a no-show. **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification side effects:** a no-show that is never recorded can't trigger the P06 warning ladder, the P09 fee logic, or a replacement — the manager must release the slot by hand (GM-07 F09, now exists — CX-Q16 CHANGED). **Web/Expo difference:** none — the absence is backend-wide.\n**RECOMMENDED:** A worker with a confirmed assignment who has not clocked in by 30 minutes after shift start (owner picks the number) becomes \"no-show — unconfirmed\" and the manager + owner are notified; the manager confirms \"no-show\" or \"late — still coming\" (which keeps the assignment and the ±2h clock-in window open). The confirmed no-show feeds the P06/P10 ladder (GM-15) and releases the slot for cover. Severity: high — without it, the ladder, the fees, and the cover flow all depend on a manager noticing.\n**ALTERNATIVE A — Keep current logic (no no-show state):** Trade-off: no work; no-shows are invisible to the product and everything downstream (ladder, fees, cover) waits on a human.\n**ALTERNATIVE B — Manager marks it by hand, no automation:** a \"mark no-show\" button on the roster/attendance screen, no timer. Trade-off: simple; still depends on the manager looking.\n**ALTERNATIVE C — Auto no-show at start + grace (see Q04):** the timer and the lateness rule are one decision. Trade-off: one rule instead of two; a worker stuck in traffic is auto-flagged.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/models.py`, `backend/attendance/transitions.py`, `backend/attendance/approvals.py` (no no-show anywhere); `docs/qa/launch-grill/questions.json` CX-Q11, CX-Q07, CX-Q16; GM-07 F09 (release exists).\n**Decision status:** OPEN (carried CX-Q11, STILL VALID)."}, {"id": "GM-08-Q04", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q04 — Late arrival, early departure, early finish: is there a grace period, and what counts? (carried CX-Q12) — STILL VALID\n\n> **Also covers (22 Nov):** GM15-12 (GM-15). Asked once, here.\n\n**Plain English:** today \"late\" doesn't exist. The clock-in window is two hours either side of the shift, and a clock-in at 8:00 for a 9:00 shift looks exactly the same as a clock-in at 10:30. There is no grace period, no late flag, and no rule for leaving early.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Eligibility window: start − 2h to end + 2h (`eligibility.py`, `_find_matching_assignment`). `AttendanceEvent.occurred_at` is server time; no comparison against scheduled time is made anywhere in the attendance code; no `late`, `grace`, `early`, or `minutes_late` field exists in the models. Clock-out has no window check at all (it closes whatever open session exists). Breaks are sequential but have no length limit and no paid/unpaid flag.\n**Normal case:** worker clocks in 10 minutes late — recorded as a normal clock-in. **Edge case:** worker clocks in 1h 55m late (inside the window) — same as on time. Worker clocks in 2h 1m late — outside the window, no matching assignment; they fall through to provisional tiers (local staff → UNROSTERED_LOCAL; others → rejection). Worker clocks out 1h early — recorded as a normal clock-out; pay treatment is GM-09 (CX-R01). **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification side effects:** lateness that is never recorded can't affect pay (GM-09), ratings (GM-15), or the incident ladder (GM-15) — and a worker who is consistently 30 minutes late is indistinguishable from a punctual one. **Web/Expo difference:** none — backend absence.\n**RECOMMENDED:** Record lateness, don't block on it: clock-in after start + 15 minutes grace is flagged \"late (N min)\" on the session/timeline (visible to the manager, not a denial); clock-out before end − 15 minutes is flagged \"early finish\". The flag feeds GM-09 (pay) and GM-15 (ladder) but the worker can still clock in inside the ±2h window. Severity: medium — a flag is cheap and the downstream decisions need the data.\n**ALTERNATIVE A — Keep current logic (no lateness concept):** Trade-off: no work; late and early are invisible forever.\n**ALTERNATIVE B — Hard grace + denial:** clock-in more than N minutes late is refused (worker must call the manager). Trade-off: clear; but a late worker who is refused can't work at all, and the pharmacy is shorter-staffed than if they'd started late.\n**ALTERNATIVE C — Grace + manager confirm:** a late clock-in asks the manager (on the kiosk) to confirm \"accept late start\" before it counts. Trade-off: human judgement at the door; needs a manager present.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/eligibility.py` (±2h window, no lateness), `backend/attendance/transitions.py`, `backend/attendance/models.py`; `docs/qa/launch-grill/questions.json` CX-Q12, CX-R01.\n**Decision status:** OPEN (carried CX-Q12, STILL VALID)."}, {"id": "GM-08-Q05", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q05 — Offline kiosk: how long may it run offline, and what happens to suspicious events?\n\n**Plain English:** the pharmacy's kiosk can keep working with no internet — it records clock-ins locally, signs each one, chains them together so none can be quietly changed, and uploads them when it's back online. It may run offline for up to 24 hours. Events that look wrong go to a manager for review instead of being accepted silently.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Native offline kiosk only (`client_kind == NATIVE_OFFLINE`; a WEB_ONLINE device that tries to sync is refused). Sync: `POST attendance/kiosk/sync/batch/` (device token; revoked devices may still sync, so a revoked kiosk can upload its outbox). Events: `KioskAttendanceEvent` with device sequence (unique per device), device timestamp + `trusted_time_estimate` + `monotonic_elapsed_ms` + `boot_session_id`, hash chain (`previous_event_hash` → `event_hash`), Ed25519 `device_signature`, `canonical_payload`, `integrity_flags`; status ACCEPTED / NEEDS_REVIEW / REJECTED + `rejection_reason`. Manager review: separate immutable `KioskAttendanceReview` (APPROVED/REJECTED, reason required, `effective_timestamp`); the signed event never changes. Config returns a server-time anchor + `max_offline_hours` (setting `KIOSK_MAX_OFFLINE_HOURS`, default 24). The verification rules inside `sync_offline_batch` (`protocol.py`) were **not line-read** — the exact accept/review/reject conditions are UNKNOWN beyond the model shape.\n**Normal case:** internet drops at 9:00; kiosk keeps clocking people in; syncs at 11:00; events accepted. **Edge case:** offline longer than 24 hours — the enrolment credential expires (`offline_valid_until`); whether the kiosk then refuses new clock-ins, queues them anyway, or warns, was NOT traced (the enrol/sync code paths for expiry were not line-read). Clock tampering (device clock moved back) — the monotonic clock + hash chain exist to catch it; the exact handling is in `protocol.py` (not read). Duplicate/out-of-order sequence → unique constraint on (device, sequence). **Retry/concurrency:** batches are idempotent by `event_id` + device sequence (unique constraints); a retried batch does not duplicate events (as far as the model constraints show — the protocol code was not read). **Denied role / wrong tenant:** device token is per-pharmacy; a device cannot sync another pharmacy's events (device FK on every event). **Payment/notification side effects:** NEEDS_REVIEW events don't become attendance until a manager decides (F10); pay waits (GM-09). **Web/Expo difference:** the offline kiosk is the Tauri desktop build; Expo is not the offline kiosk; Vite web-online kiosk cannot sync offline batches by design.\n**RECOMMENDED:** KEEP 24 hours and the review queue; add a kiosk-side rule (to be confirmed against `protocol.py`): past 24h offline, the kiosk warns loudly and keeps recording (never refuse a clock-in — a refused clock-in is lost evidence), and flags the whole batch NEEDS_REVIEW on sync. Severity: medium — the crypto exists; the expiry behaviour is the gap.\n**ALTERNATIVE A — Keep current logic:** 24h, review queue, expiry behaviour as whatever `protocol.py` does (unverified). Trade-off: no work; the expiry case is untested by this trace.\n**ALTERNATIVE B — Shorter offline window (e.g. 8h):** Trade-off: less room for clock drift/tampering; a pharmacy with a full-day outage can't clock anyone in offline after 8h.\n**ALTERNATIVE C — No offline kiosk at all (online only):** Trade-off: simplest trust model; a pharmacy with no internet can't record attendance at all — which is exactly when they need it most.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/models.py` (`KioskDevice`, `KioskAttendanceEvent`, `KioskAttendanceReview`), `backend/attendance/kiosk_api.py` (`KioskOfflineSyncView`, `KioskConfigView`, `KioskWorkerEnrolView`), `backend/attendance/protocol.py` (**not read** — verification rules UNKNOWN).\n**Decision status:** OPEN — NEW (with an UNKNOWN: read `protocol.py` before implementing)."}, {"id": "GM-08-Q06", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q06 — PIN clock-in: keep it, who sets the PIN, and is 5-tries / 15-minutes right? (NEW)\n\n**Plain English:** a worker can clock in at the kiosk with a personal PIN instead of their phone. The PIN is hashed, the owner can turn it off, and five wrong tries locks it for 15 minutes. The worker can also set their own PIN from the app.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `WorkerPIN`: one per membership, `pin_hash`, `failed_attempts`, `locked_until`, `is_enabled` (owner toggle). 5 failed attempts → 15-minute lockout, serialised per row. Worker sets/changes their own PIN (`POST attendance/worker/pin/update/`, per pharmacy). Manager setup via a 6-digit email code (10-minute reuse window). PIN + identifier verify at the kiosk (`KioskPinClockView`, `KioskWorkerEnrolView`); wrong PIN gives no hint which half was wrong. No PIN *format* rule was found in the code read (length? digits only? — `set_pin` only requires a non-empty string; whether the service layer enforces a format was not traced — `credentials.py` not line-read). Kiosk PIN clocking is throttled (`KioskPINRateThrottle`, values not read).\n**Normal case:** worker forgets their phone, enters identifier + PIN, clocks in. **Edge case:** worker's PIN is locked after 5 typos — they can't clock in by PIN for 15 minutes (QR still works). Worker changes their PIN mid-shift — the `credential_generation` hash changes, which invalidates offline enrolments (by design). **Retry/concurrency:** failed attempts are serialised (`select_for_update` on the row). **Denied role / wrong tenant:** a PIN is per *membership* (per pharmacy) — a PIN for Pharmacy A doesn't work at Pharmacy B (the kiosk device is per-pharmacy and the membership lookup is per-pharmacy). **Payment/notification side effects:** none directly; a locked-out worker who can't clock in looks absent (Q03). **Web/Expo difference:** PIN entry is a kiosk function; PIN *setup* is worker-app (Expo `attendance-pin.tsx`) and web — contents not compared.\n**RECOMMENDED:** KEEP PIN clock-in with 5 tries / 15 minutes, and set a PIN format rule (4–6 digits, not the worker's birth year — owner to confirm the exact rule) plus a manager reset (a manager can unlock/reset a worker's PIN without the email-code dance when the worker is standing at the counter). Severity: low-medium — the mechanism is sound; the format rule and the reset path are the gaps.\n**ALTERNATIVE A — Keep current logic:** as-is, no format rule, no manager reset. Trade-off: no work; weak PINs (\"1234\", \"0000\") are possible and a locked worker waits 15 minutes.\n**ALTERNATIVE B — Drop PIN clock-in (QR only):** Trade-off: one fewer credential to manage; workers without their phone can't clock in at all.\n**ALTERNATIVE C — Stronger lockout (3 tries / 1 hour):** Trade-off: harder to brute-force a 4-digit PIN; more lockouts on honest typos.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/models.py` (`WorkerPIN`), `backend/attendance/kiosk_api.py` (`KioskPinClockView`, `KioskWorkerEnrolView`, `KioskWorkerSetupPinView`), `backend/attendance/worker_api.py` (`WorkerUpdatePinView`), `backend/attendance/transitions.py` (KIOSK_PIN source).\n**Decision status:** OPEN — NEW."}, {"id": "GM-08-Q07", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q07 — QR scanning: confirm the current parameters and change nothing (scope freeze)\n\n**Plain English:** the owner froze QR scanning — it stays as it is unless separately approved. So this question isn't asking to change it. It's asking the owner to confirm the parameters as they are, so nobody \"fixes\" them by accident later.\n\n**ACTUAL TODAY — Web and Expo (same backend):** QR token: HMAC-signed, **30-second TTL**, kiosk refreshes every 30 seconds (`KioskQRView`: `ttl_seconds=30`, `refresh_interval_seconds: 30`). Worker scans with their own signed-in phone (`MOBILE_QR` source); clock-out needs a fresh QR at the session's pharmacy. Throttled (`KioskQRRateThrottle`). The QR itself carries no worker identity — identity comes from the signed-in user / the PIN. `PharmacyQRSession` (rotating code model) also exists; the live flow uses the signed token. **Scope freeze (Issue #250): existing QR scanning remains unchanged unless separately approved.**\n**Normal case:** worker scans, clocks in within 30 seconds. **Edge case:** worker scans a QR that is 31 seconds old — verification fails, they scan again. Two workers scanning the same QR — the token identifies the *pharmacy*, not the worker; each scan is a separate clock-in by a separate signed-in user. **Retry/concurrency:** 30-second idempotency on clock-in (F01). **Denied role:** an unsigned-out/anonymous scan can't clock in (worker endpoints require authentication). **Payment/notification:** none. **Web/Expo difference:** the kiosk *shows* the QR (Vite/Tauri build); Expo *scans* it — the two sides are different apps by design.\n**RECOMMENDED:** CONFIRM, no change: 30-second TTL, 30-second refresh, HMAC-signed, phone-side scan. Record the freeze explicitly against this question so a later \"improvement\" (longer TTL, static QR) has to come back as a new decision.\n**ALTERNATIVE A — Keep current logic (same as recommended):** confirm and freeze. (This question's KEEP *is* the recommendation.)\n**ALTERNATIVE B — Longer TTL (e.g. 5 minutes):** Trade-off: friendlier for slow phones; a photographed QR stays usable for 5 minutes — the freeze exists precisely to prevent this without a separate approval.\n**ALTERNATIVE C — Static QR per pharmacy:** Trade-off: simplest kiosk; a photo of the QR clocks anyone in from anywhere, forever — contradicts the freeze.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/kiosk_api.py` (`KioskQRView`), `backend/attendance/worker_api.py` (`WorkerClockInView`, `WorkerClockOutView`), Issue #250 scope freeze.\n**Decision status:** OPEN — confirm-only, no change proposed."}, {"id": "GM-08-Q08", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q08 — Manager corrections: who can correct, and how does a worker dispute one? (carried CX-Q33) — STILL VALID\n\n**Plain English:** a manager can fix a wrong clock time, and the fix is properly audited — the original time is never overwritten, the reason is required, and the timeline shows both. But if the worker disagrees with the correction, there is no way in the product to say so.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `POST attendance/manager/correct/` → `create_attendance_correction`: manager of the *destination* pharmacy only; `AttendanceCorrection` (original event, corrected timestamp, reason required, corrected_by, corrected_at); original `occurred_at` never mutated; `get_effective_session_timeline` computes the effective chronology; corrections are append-only. Manager timeline view exists (`GET attendance/manager/timeline/<session_id>/`). **No worker dispute, challenge, or \"I disagree\" path exists** in the attendance code read. Whether the worker is even *notified* of a correction was not found (no notification in `approvals.py` — CG-03).\n**Normal case:** worker forgot to clock out; manager corrects the clock-out to the scheduled end. **Edge case:** manager corrects a clock-in *earlier* than the real one (more paid hours) or *later* (fewer) — the reason is the only control, and the worker can't see or challenge it (unless the timeline is visible to them — the worker-facing timeline was not traced). Correction after the timesheet is locked (GM-09) — whether corrections are allowed then, and what happens, is UNKNOWN (timesheet lock interaction not traced). **Retry/concurrency:** corrections are append-only rows; two corrections to the same event stack (effective timeline picks the latest — exact precedence in `get_effective_session_timeline`, not line-read in detail). **Denied role / wrong tenant:** only the destination pharmacy's managers; a worker cannot correct their own times. **Payment/notification side effects:** corrections change effective (payable) hours — the money moves on a manager's say-so with no worker recourse. **Web/Expo difference:** none in the rule; correction screens not traced on any client.\n**RECOMMENDED:** KEEP manager corrections as-is, and add a worker dispute: the worker sees their effective timeline, can flag \"I disagree\" with a note, which reopens the session to the manager (no pay change until the manager answers). Severity: high — a correction that cuts pay with no recourse is a Fair Work complaint in waiting.\n**ALTERNATIVE A — Keep current logic:** manager corrects, worker has no path. Trade-off: no work; corrections are one-sided by design.\n**ALTERNATIVE B — Worker can request a correction too:** the worker proposes a corrected time with a reason; the manager approves/rejects it (same append-only audit). Trade-off: symmetric; more states, but the dispute and the request become one flow.\n**ALTERNATIVE C — Corrections need a second manager (four-eyes):** Trade-off: strongest control; slow, and small pharmacies have only one manager.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/approvals.py` (`create_attendance_correction`, `get_effective_session_timeline`), `backend/attendance/models.py` (`AttendanceCorrection`), `backend/attendance/urls.py`; `docs/qa/launch-grill/questions.json` CX-Q33.\n**Decision status:** OPEN (carried CX-Q33, STILL VALID)."}, {"id": "GM-08-Q09", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q09 — Breaks: paid or unpaid, how long, and who decides? (NEW, boundary with GM-09/GM-14)\n\n**Plain English:** the product records breaks — start, end, on the phone or at the kiosk — but it never says whether a break is paid, how long one may be, or what happens if someone takes an hour. The roster wizard doesn't even have a break field. The pay answer lives with timesheets and the Award, but the attendance side has to record enough for that answer to be possible.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Break events: BREAK_START / BREAK_END, sequential, in-app or kiosk; clock-out auto-ends an active break. No break length, no paid/unpaid flag, no limit, no scheduled-break field was found in the attendance code. `PO-Q02` (Oct 2026): \"Must every shift state the break length and whether it is paid? No break field exists. Frozen terms do not mention it.\" — still true as far as this trace shows (the posting wizard was not re-read at head; GM-10 owns it). Break elapsed seconds are returned by the kiosk break action (`break_elapsed_seconds`).\n**Normal case:** worker takes a 30-minute meal break mid-shift. **Edge case:** worker on break for 2 hours — recorded, no flag, no limit. Worker never ends the break and clocks out — auto-ended at clock-out, so the \"break\" runs to the end of the shift. **Retry/concurrency:** sequential enforcement (double start / end-without-start refused). **Denied role:** n/a. **Payment/notification side effects:** whether break time is deducted from payable hours is GM-09's builder (not read) — the attendance side must record breaks accurately or the pay math is wrong. **Web/Expo difference:** none in the rule; break dialogs exist on web (`KioskBreakDialog.tsx`) — Expo break UI not traced.\n**RECOMMENDED:** Decide the rule in GM-09/GM-14 (paid vs unpaid meal breaks under the Award), but record here: breaks stay as recorded (start/end, no auto-deduction in attendance), and the roster/posting flow gains a break-length + paid/unpaid field (PO-Q02, GM-10) so the timesheet has something to compare against. Severity: medium — the attendance recording is fine; the missing piece is the *expected* break.\n**ALTERNATIVE A — Keep current logic:** breaks recorded, no rule anywhere. Trade-off: no work; pay for breaks is decided ad hoc at timesheet time.\n**ALTERNATIVE B — Unpaid meal break auto-deducted (e.g. 30 min after 5h):** Trade-off: matches common Award practice; but auto-deduction without a recorded break punishes workers who didn't take one.\n**ALTERNATIVE C — Breaks must be rostered:** every shift states its break; a break outside the rostered window is flagged. Trade-off: most precise; needs the posting field (PO-Q02) first.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/transitions.py` (`start_break`, `end_break`), `backend/attendance/models.py` (`AttendanceEvent.EventType`), `backend/attendance/kiosk_api.py` (`KioskStaffBreakActionView`); `docs/qa/launch-grill/questions.json` PO-Q02.\n**Decision status:** OPEN — NEW (decide the pay rule in GM-09/GM-14; record the attendance side here)."}, {"id": "GM-08-Q10", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q10 — Can a manager clock someone in or out for them? (MANAGER source) (NEW)\n\n**Plain English:** the system has a \"manager\" clock source — a clock event recorded by a manager rather than by the worker. But no manager clock-in/out button or endpoint was traced in this pass, so it's unclear when, if ever, a manager is supposed to act for a worker — and what stops a manager from inventing attendance.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `AttendanceEvent.Source.MANAGER` exists in the enum (`models.py`), alongside QR_KIOSK / MOBILE_QR / KIOSK_PIN / IN_APP / OFFLINE_KIOSK. No manager clock-in/out endpoint appears in `attendance/urls.py` (29 routes — worker clock-in/out, kiosk PIN clock, breaks, manager pending/approve/reject/correct/timeline/devices/review; no manager clock action). No writer of `Source.MANAGER` was found in the files read (`transitions.py`, `worker_api.py`, `kiosk_api.py`, `approvals.py` — none sets MANAGER). It may be written by code not read (`views.py`, `attendance_edits.py`, `protocol.py`) or reserved for future use — UNKNOWN.\n**Normal case:** (if it existed) worker forgot their phone and their PIN; manager clocks them in at the counter. **Edge case:** manager clocks in a worker who never arrived — the event would look like a normal clock-in except for its source; the only defence is the audit trail + the manager's identity (which the event does not store as a separate field — `device`/`qr_session`/`ip_address` exist, but no \"recorded by manager X\" field was seen on `AttendanceEvent`). **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification side effects:** a manager-recorded clock-in creates payable hours — the fraud/abuse surface is real if the capability exists without controls. **Web/Expo difference:** none — the enum value is backend-wide; no screen offers it as far as traced.\n**RECOMMENDED:** Either wire it properly (manager clock-in/out only for a worker physically present, with the manager's identity stored on the event, a reason required, and the event flagged for review) or remove the enum value. Do not leave a source that nothing writes — it invites a future caller to use it without the controls. Severity: medium — today it appears to be dead; the risk is a future use without a decision.\n**ALTERNATIVE A — Keep current logic (MANAGER source exists, nothing writes it):** Trade-off: no work; a dead enum value that may confuse the next developer.\n**ALTERNATIVE B — Build manager clock-in/out with controls (recommended shape above):** Trade-off: genuinely useful at a busy counter; needs the controls, or it becomes the easiest way to fake attendance.\n**ALTERNATIVE C — Remove the MANAGER source:** Trade-off: cleanest; if a manager ever needs to act for a worker, they use corrections (Q08) instead.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/models.py` (`AttendanceEvent.Source.MANAGER`), `backend/attendance/urls.py` (no manager clock route), `backend/attendance/transitions.py` / `worker_api.py` / `kiosk_api.py` (no MANAGER writer found).\n**Decision status:** OPEN — NEW (with an UNKNOWN: search the whole backend for MANAGER writers before implementing)."}, {"id": "GM-08-Q11", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-Q11 — What does attendance hand to the timesheet — and what marks a shift complete? (carried CX-Q32 / CX-R01, GM-09 boundary)\n\n> **Also covers (22 Nov):** GM15-32 (GM-15), GM17-Q16 (GM-17). Asked once, here.\n\n**Plain English:** attendance records what actually happened; the timesheet turns it into pay. The handover between the two was not traced in this pass, and there is still no \"shift complete\" state anywhere. The owner needs to say what counts as a finished, payable shift — and what happens to the awkward cases (forgot to clock out, clocked in but never rostered, provisional never approved).\n\n**ACTUAL TODAY — Web and Expo (same backend):** `AttendanceSession` (actual times) and `ShiftSlotAssignment` (scheduled times) are separate by design; corrections adjust the *effective* timeline without touching the originals. Workforce timesheet endpoints exist (`timesheets/`, `missing-punch/`, `submit/`, `approve-time/`, `reopen/`, `lock/`, `correct/`, `recalculate/`) — but `timesheet_builder.py`, `timesheet_core.py`, `attendance_edits.py` were **not read**, so how actual hours, breaks, corrections, provisional approvals and missing punches combine into payable hours is UNKNOWN here. No \"completed\" state on bookings exists (CX-Q32, still valid). Early finishes / extra hours have no pay rule in the attendance code (CX-R01, still valid).\n**Normal case:** worker clocks in/out on time; session closes; timesheet picks up actual hours. **Edge case:** worker never clocks out (open session) — the timesheet has a `missing-punch` flow (rules not traced). Worker clocks in provisionally and it's never approved — the session exists with no assignment; whether the timesheet includes it is UNKNOWN. Worker clocks out early / works late — actual times recorded; pay rule is GM-09's. **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification side effects:** everything — this handover *is* the pay calculation's input. **Web/Expo difference:** none — backend boundary; `app/workforce-timesheets.tsx` exists on Expo (contents not read).\n**RECOMMENDED:** Define the handover in GM-09, but agree here: a shift is \"complete\" when the session is closed (clocked out) *and* any provisional is decided *and* any missing punch is resolved;
