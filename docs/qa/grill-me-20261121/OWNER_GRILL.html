d* (`cancellation.py`), so they vanish from history instead of appearing as \"cancelled\".\n- **Recommended: A — Yes, both see them with status**; reason visible only to the two parties.\n- **Keep — Assignment-and-time history without cancellation/expiry records. B — Hidden once cancelled.**\n- **Other / defer.**"}, {"id": "GM15-39", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-39 — AG-Q10 · Which channels carry those notices? [STILL VALID]\n\n> **Also covers (22 Nov):** GM22-04 (GM-22). Asked once, here.\n- **Actual today:** In-app, push and email exist; each feature picks its own. Offer/confirmation: in-app + email. Pre-shift reminders: email only (hourly beat, 12–13h window, `shifts/tasks.py`).\n- **Recommended: A — In-app and push; email for money/cancel.**\n- **Keep — Each feature keeps choosing its own channels. B — Email everything. C — In-app only.**\n- **Other / defer.**"}, {"id": "GM15-42", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-42 — TB-Q05 · How should reviews and reliability show? [STILL VALID]\n\n> **Also covers (22 Nov):** GM-18-Q05 (GM-18), GM-24-Q16 (GM-24). Asked once, here.\n- **Actual today:** Web and mobile show one average OWNER_TO_WORKER star score + count (`talent/views/explorer.py:78-82`; `ratings/views.py: summary`). No separate attendance reliability or responsiveness measure; internal ratings feed the same average.\n- **Recommended: A — Separate: reviews and reliability, with counts** (one line each).\n- **Keep — One relationship star average and count, no separate reliability.**\n- **Other / defer.**"}, {"id": "GM15-43", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-43 — TB-Q09 · Can a pharmacy block a worker? [STILL VALID]\n\n> **Also covers (22 Nov):** GM-18-Q09 (GM-18), GM26-Q19 (GM-26). Asked once, here.\n- **Actual today:** No block list exists anywhere (repo search: 0 hits in backend/talent).\n- **Recommended: A — Yes, private block** (worker stops seeing that pharmacy's shifts; never shown publicly).\n- **B — No blocking; pharmacy declines each time.**\n- **Other / defer.**"}, {"id": "GM15-47", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-47 — LA-Q10 / SH-09 · Accepted terms don't include the cancellation table or terms version [CHANGED — PARTIAL]\n\n> **Also covers (22 Nov):** GM-18-Q26 (GM-18), GM26-Q32 (GM-26). Asked once, here.\n- **Actual today:** Better than Oct, still incomplete. A stable terms fingerprint now exists (`engagement.py: shift_engagement_terms_version`, SHA-256) and acceptance echoes it (PR #249 D2 work). But the snapshot (`build_shift_engagement_terms`, `version: 1`) still contains **no cancellation band table, no platform terms version, no pharmacy-side acceptance** — only worker `accepted_at` / `accepted_by_user_id`. The register's legal note stands: P09 fees need clear disclosure *before* acceptance before they can ever be charged.\n- **Recommended: A — Before launch:** record versioned pre-contract acceptance by both sides, include the cancellation matrix, and obtain Australian legal review.\n- **B — Soon after launch. C — Not needed.**\n- **Other / defer.**"}, {"id": "GM15-48", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-48 — LA-P03 (context, GM-15 adjacent) · Chain and organisation shifts skip the AHPRA gate [STILL VALID — noted, owned by GM-02/GM-04]\n- **Actual today:** Not re-traced in this pass (belongs to GM-02/GM-04); carried from #184 unchanged. Flagged here only because a chain/org booking made without the gate inherits every cancellation gap in this area (a cancelled booking for an unverified worker still has no cancel path).\n- **Recommended: A — Before launch.**\n- **Other / defer.**"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Owner cancels confirmed booking | No endpoint or button exists in UI to cancel confirmed bookings (`backend/workforce/roster/worker_actions.py:55`). | No endpoint or button exists in mobile UI to cancel confirmed bookings (`backend/workforce/roster/worker_actions.py:55`). | Yes | - |\n| Worker cancels confirmed booking | No cancellation button exists; cover requests blocked on booked shifts (`frontend_web/src/pages/dashboard/sidebar/RosterWorkerPage.tsx:546`). | No cancellation button exists; cover requests blocked on booked shifts (`frontend_mobile/app/my-roster.tsx:280`). | Yes | - |\n| Worker declines pending offer | Worker declines offer via `declineShiftOfferService` (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:529`). | Worker declines offer via `declineWorkerShiftOfferService` (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:393`). | Yes | - |\n| Internal roster shift cover request | Worker requests cover for rostered internal shift (`frontend_web/src/pages/dashboard/sidebar/RosterWorkerPage.tsx:546`). | Worker requests cover for rostered internal shift (`frontend_mobile/app/my-roster.tsx:280`). | Yes | - |\n| Completed shift rating submission | Allows 1-5 star rating and feedback on completed shifts (`frontend_web/src/pages/dashboard/sidebar/HistoryShiftsPage.tsx:180`). | Opens dialog for 1-5 star rating on completed shifts (`frontend_mobile/roles/shared/shifts/HistoryShiftsView.tsx:193`). | Yes | - |\n| Historical ratings profile review | Displays rating summary and individual comments (`frontend_web/src/pages/dashboard/shiftCenter/WorkerBookedShifts.tsx:158`). | Displays rating summary and paginated reviews (`frontend_mobile/roles/shared/shifts/WorkerBookedShifts.tsx:182`). | Yes | - |", "file": "areas/GM-15-cancellation-disputes-ratings.md"}, {"key": "GM-06", "row": "9", "title": "GM-06 Employment/leave", "qs": [{"id": "GM-06-Q01", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q01 — Should every employed worker have a dated pay agreement (engagement), and who sets it?\n\n**Plain English:** today each employed worker can have a dated pay agreement that says their role, full-time/part-time/casual, Award classification and exact rates — and the rates are frozen in time, so changing the Award later doesn't rewrite history. But nobody has decided whether *every* employed worker must have one, or who is allowed to create it.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `EmploymentEngagement` is a dated period per membership (`effective_from`, optional `effective_to`); overlapping periods are rejected; role must match the membership; rates are frozen in `award_rate_snapshot`. Creation is via `POST employment-engagements/` for anyone who `can_manage_workforce_pharmacy` (owner, staff/roster manager, scoped org admin). **No rule requires an engagement to exist** — a member can be rostered with no engagement on file (whether rostering checks for one was not traced — UNKNOWN). Screens on web/Expo were not traced.\n**Normal case:** manager hires a part-time pharmacist, creates an engagement from 1 Dec with Award rates. **Edge case:** worker rostered before any engagement exists — what rate do they get paid? UNKNOWN (timesheet/rate resolution is GM-09/GM-14). **Retry/concurrency:** two managers creating overlapping engagements — the `clean()` overlap check runs per save; race behaviour UNKNOWN (no lock seen in the service code read). **Denied role / wrong tenant:** a manager from another pharmacy creating an engagement → permission check is `can_manage_workforce_pharmacy` (scoped per pharmacy); exact denial response UNKNOWN (views not read). **Payment/notification:** the engagement *is* the pay basis — wrong rates here flow straight into timesheets and payroll. No notification on create was found.\n**RECOMMENDED:** Require one current engagement per employed member before they can be published on a roster (fail closed, with a clear \"set pay terms first\" message), created by the owner or a staff manager. Severity: high — pay without agreed terms is the fastest route to a dispute.\n**ALTERNATIVE A — Keep current logic:** engagements optional; anyone with workforce permission can create them. Trade-off: no work; workers can be rostered and paid with no agreed terms on file.\n**ALTERNATIVE B — Owner-only:** only the pharmacy owner (not managers) creates engagements. Trade-off: tightest control; the owner becomes a bottleneck for every hire.\n**ALTERNATIVE C — Auto-create from membership:** an engagement is auto-created from the membership + Award defaults when a worker joins. Trade-off: no one is ever missing terms, but the defaults may be wrong (classification, above-Award rates) and nobody reviewed them.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py` (`EmploymentEngagement`), `backend/workforce/employment_engagement_service.py` (`build_employment_engagement_payload`), `backend/workforce/permissions.py` (`can_manage_workforce_pharmacy`), `backend/workforce/urls.py`.\n**Decision status:** OPEN — NEW."}, {"id": "GM-06-Q02", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q02 — Award or above Award — and what happens when the worker has a birthday (junior rates)?\n\n**Plain English:** the pay agreement is built on the Pharmacy Industry Award 2020, either at Award rates or above Award. For junior workers the Award rate changes on their birthday — and the code already forces an engagement to end the day before that birthday so a new one starts at the new rate. The owner needs to confirm this is the rule they want, and who fixes it when a birthday is missed.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `pay_basis` is AWARD or ABOVE_AWARD; `award_code` defaults to `MA000012`; the Award schedule is resolved by role + classification + employment type + date of birth + date (`resolve_award_schedule`, `award_rates.py` — interface only, not read); above-Award keeps the Award as the floor (`award_floor`); `require_end_before_rate_review` rejects an `effective_to` that runs past the next rate-review (birthday) date. Date of birth comes from onboarding, falling back to an approved membership application.\n**Normal case:** 19-year-old intern's engagement ends the day before their 20th birthday; a successor engagement starts at the new rate. **Edge case:** birthday missed (no successor created) — the worker's pay terms are expired with no current engagement; what the roster/timesheet does then is UNKNOWN. **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification:** no reminder or notice about an approaching rate review was found in the code read. **Web/Expo difference:** none — backend rule.\n**RECOMMENDED:** KEEP the birthday rule, and add a reminder (to owner + manager) 14 days before a junior rate review, plus a block on publishing a roster week that includes a worker whose engagement expires mid-week. Severity: medium — underpaying a junior is an Award breach.\n**ALTERNATIVE A — Keep current logic:** birthday rule enforced, no reminder, no roster block. Trade-off: no work; expired terms are discovered late.\n**ALTERNATIVE B — Auto-roll the engagement:** on the birthday, auto-create a successor at the new Award rate. Trade-off: never expired, but nobody reviewed the new terms and above-Award loadings may need re-thinking.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/employment_engagement_service.py` (`require_end_before_rate_review`, `build_employment_engagement_payload`), `backend/workforce/models.py` (`EmploymentEngagement`).\n**Decision status:** OPEN — NEW."}, {"id": "GM-06-Q03", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q03 — Part-time contracted hours: what does the roster owe a part-timer?\n\n**Plain English:** part-timers have contracted hours — a pattern of ordinary hours stored on their pay agreement, plus a weekly-minutes figure on their membership. But nothing in the code I read checks the roster against those hours. A part-timer contracted for 20 hours a week could be rostered for 38, or for 4, and nothing would flag it.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Part-time engagements store `ordinary_hours_pattern` (normalised by `normalise_part_time_pattern`); full-time/casual engagements must NOT have one. `MembershipWorkSettings` stores `contracted_weekly_minutes` + `work_pattern` + `effective_from`. Roster validation (`worker_issues`) checks role, overlaps and approved leave — **not** contracted hours. Whether the roster builder, publisher, or timesheet checks contracted hours was not found in the files read.\n**Normal case:** part-timer contracted 3 days a week is rostered for those 3 days. **Edge case:** part-timer rostered over their contracted hours — overtime? Refusal right? UNKNOWN (no rule found). Rostered under their hours — is the pharmacy obliged to top up? UNKNOWN. **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification:** contracted hours feed pay expectations; no check means pay disputes surface at timesheet time (GM-09). **Web/Expo difference:** none — backend rule (or absence of one).\n**RECOMMENDED:** Warn (not block) at roster publish when a part-timer's published week is outside their contracted pattern, and show contracted vs rostered hours on the roster screen. Severity: medium — protects both sides, keeps the roster flexible.\n**ALTERNATIVE A — Keep current logic:** contracted hours stored, never checked. Trade-off: no work; the pattern is decoration.\n**ALTERNATIVE B — Block at publish:** a roster week that breaks a part-timer's pattern cannot publish. Trade-off: strongest protection, but a sick-cover week may need exactly that breach — needs an override with a reason.\n**ALTERNATIVE C — Drop contracted hours from the product:** delete the pattern/minutes fields. Trade-off: honest about what the product does, but the Award needs ordinary-hours patterns for part-timers (the engagement already enforces the pattern's shape).\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py` (`MembershipWorkSettings`, `EmploymentEngagement.clean`), `backend/workforce/roster/validation.py` (`worker_issues` — no hours check), `backend/workforce/employment_terms.py` (not read — `normalise_part_time_pattern` only seen at call sites).\n**Decision status:** OPEN — NEW."}, {"id": "GM-06-Q04", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q04 — Which leave types exist, and is leave paid, unpaid, or \"the roster just changes\"?\n\n**Plain English:** today there are seven leave types — sick, annual, compassionate, study, carer's, unpaid, and other. But the product never says whether any of them is paid, never counts a balance, and never touches pay. Approving \"annual leave\" changes nothing except the leave row itself.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `WorkforceLeaveRequest.LEAVE_TYPES`: SICK, ANNUAL, COMPASSIONATE, STUDY, CARER, UNPAID, OTHER. No paid/unpaid flag, no balance, no accrual, no entitlement model anywhere in `backend/workforce/models.py` or `leave_service.py` (verified by search). No pay treatment on approval — timesheet/payroll handling of leave is GM-09 territory and was not traced here. The legacy `client_profile.LeaveRequest` is historical data only.\n**Normal case:** worker requests annual leave for a rostered Saturday; manager approves. **Edge case:** worker requests sick leave for a shift that already started, or for dates with no rostered shift (date-range path) — both are accepted by the code as written. **Retry/concurrency:** one active request per assignment; overlapping approved leave is blocked at decision. **Denied role / wrong tenant:** leave for another worker's shift → PermissionDenied; leave under another pharmacy's membership → PermissionDenied. **Payment/notification:** no pay effect in this code; whether approved leave generates paid hours in a timesheet is UNKNOWN (GM-09). **Web/Expo difference:** none — backend rule.\n**RECOMMENDED:** Keep the seven types, and decide the pay treatment per type now (even if the answer is \"leave is unpaid in the product until GM-09 builds paid leave\"): annual/sick/compassionate/carer's paid per the Award for full/part-time staff, unpaid for casuals; study/other/unpaid unpaid. Severity: high — \"approved annual leave\" that pays nothing is a Fair Work problem waiting to happen.\n**ALTERNATIVE A — Keep current logic:** seven types, no pay meaning, no balances. Trade-off: no work; every leave approval is a promise the payroll side may not keep.\n**ALTERNATIVE B — Cut the list to what the product can honour:** sick / annual / unpaid only, until paid-leave handling exists. Trade-off: honest, but study/carer's/compassionate requests go through \"other\" with a note.\n**ALTERNATIVE C — Leave is roster-only, never paid through the product:** the product only moves the roster; pay for leave is handled outside ChemistTasker. Trade-off: clear boundary, but the pharmacy must do leave pay by hand.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py` (`WorkforceLeaveRequest.LEAVE_TYPES`), `backend/workforce/leave_service.py` (no pay/balance logic).\n**Decision status:** OPEN — NEW."}, {"id": "GM-06-Q05", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q05 — Should the product track leave balances and entitlements, or stay request-only?\n\n**Plain English:** today the product does not know how much leave anyone has. There is no balance, no accrual, no \"you have 12 days left\". A worker can request annual leave every week and the product will happily approve it every week, as long as the requests don't overlap each other.\n\n**ACTUAL TODAY — Web and Expo (same backend):** No balance/accrual/entitlement field, model, or check exists in the workforce models or leave service (verified by search for balance/accrual/entitle/accrue — zero hits). Approval checks only overlap with other *approved* leave. Nothing checks how many days a worker has taken this year, or whether they have any entitlement left.\n**Normal case:** full-timer requests 4 weeks' annual leave; manager approves on trust. **Edge case:** casual requests paid annual leave (casuals don't accrue it under the Award) — nothing stops it. Worker requests leave beyond their balance — nothing stops it. **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification:** balances are the difference between approving leave and approving *paid* leave; without them, every approval is a handshake. **Web/Expo difference:** none — the absence is backend-wide.\n**RECOMMENDED:** Add balances after launch (defer the build), but decide the rule now: balances accrue per the Award by employment type (full/part-time accrue annual + sick; casuals don't), shown to worker and manager on the leave screen, and approval warns (not blocks) when the request exceeds the balance. Severity: high for correctness, medium for launch — a request-only launch is shippable if the owner accepts manual balance-keeping outside the product.\n**ALTERNATIVE A — Keep current logic (request-only, no balances):** Trade-off: no work; balances live in a spreadsheet or the pharmacy's payroll system, and the product can approve leave nobody has.\n**ALTERNATIVE B — Balances before launch:** accrue + show + enforce at approval. Trade-off: correct, but a real payroll feature (accrual rules, carry-over, cash-out, termination payout) — the biggest build in GM-06.\n**ALTERNATIVE C — Track taken-days only (no accrual math):** show \"days taken this year\" per type, no entitlement figure. Trade-off: cheap visibility, no false precision; still lets a manager spot abuse.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py`, `backend/workforce/leave_service.py` (searched: no balance/accrual/entitlement).\n**Decision status:** OPEN — NEW."}, {"id": "GM-06-Q06", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q06 — When leave is approved, what happens to the rostered shift? (FIRST QUESTION, see Part D)\n\n**Plain English:** today, nothing happens. Approving leave changes the leave request from \"pending\" to \"approved\" — and the worker stays assigned to the shift. The manager has to separately release the worker or find cover, in a different flow, or the shift still shows the worker who is on leave.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `decide_leave` (APPROVED) only updates the leave row (`status`, `decided_by`, `decided_at`, `manager_note`) and notifies the worker. It does not touch `ShiftSlotAssignment`, does not create a cover request, does not open a vacancy, does not notify anyone else. The rostered worker remains assigned. Separately, `worker_issues` blocks a *replacement* candidate who has approved leave overlapping the shift — so the system knows leave matters for cover, but never acts on the leaver's own shift.\n**Normal case:** worker's Saturday leave is approved on Monday; the manager releases the shift and finds cover by Wednesday. **Edge case:** leave approved the morning of the shift — the worker is still assigned, nobody has been asked to cover, and the shift starts uncovered. Leave approved for a date-range with no assignment — nothing to release; but any rostered shifts inside the range stay assigned (no sweep). **Retry/concurrency:** approval and a swap/cover approval racing on the same assignment — `decide_leave` locks the leave row and checks the assignment is unchanged *at decision time*; whether a cover approval racing a leave approval is safe was not traced. **Denied role / wrong tenant:** only a manager of that pharmacy can approve; approval by the wrong pharmacy's manager → PermissionDenied. **Payment/notification:** approval notifies only the worker; the roster, the cover flow and the attendance check (GM-08: approved leave blocks a replacement, not the leaver) are untouched. **Web/Expo difference:** none — backend behaviour.\n**RECOMMENDED:** On approval of slot-bound leave, prompt the manager (same screen, one tap) to release the shift to cover — \"release now\", \"find cover later\", or \"keep assigned\" — and record the choice. Never silently keep an approved-leave worker assigned without the manager seeing it. Severity: high — an approved-leave worker left on the roster is a no-show waiting to happen (GM-08) and a pay dispute (GM-09).\n**ALTERNATIVE A — Keep current logic:** approval touches only the leave row; the manager must remember to handle the shift separately. Trade-off: no work; the gap is silent and easy to miss, especially for leave approved close to the shift.\n**ALTERNATIVE B — Auto-release on approval:** approving slot-bound leave automatically releases the assignment (GM-07 release path, with optional escalation to the marketplace). Trade-off: the shift is never left assigned to an absent worker; but a manager who wanted to keep the worker assigned (e.g. leave approved in error) must re-add them.\n**ALTERNATIVE C — Auto-create a cover request:** approval creates a pending cover request (GM-07) for the shift, still assigned to the worker until a replacement is approved. Trade-off: matches carried R04 (stay assigned until replaced) and makes the gap visible in the cover queue; needs the cover-request plumbing to accept a manager-created request.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/leave_service.py` (`decide_leave` — no assignment touch), `backend/workforce/roster/worker_actions.py` (`release_worker_from_assignment`, `submit_cover_request`), `backend/workforce/roster/validation.py` (`APPROVED_LEAVE_CONFLICT`).\n**Decision status:** OPEN — NEW. **Ask first (Part D).**"}, {"id": "GM-06-Q07", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q07 — Leave for a date range: who sees it, and should it block rostering inside the range?\n\n**Plain English:** a worker can request leave for a date range with no specific shift attached — and when they do, nobody is told, and nothing stops a manager rostering them right inside those dates. The request exists, but the roster can't see it.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Date-range leave (`create_leave` without `slot_assignment_id`) requires the worker's own active accepted membership and tz-aware datetimes; it saves PENDING and notifies **nobody** (`_notify_slot_leave_created` returns early without a slot assignment). Roster validation (`worker_issues`) blocks a replacement only if they have *approved* leave overlapping the shift — so a date-range leave, once approved, does block the worker being drafted as cover; but nothing stops a manager *rostering* them (creating a new assignment) inside an approved leave range, and nothing warns at roster publish.\n**Normal case:** worker requests annual leave 10–24 Dec (date range); manager approves; no one is rostered over it because the manager remembers. **Edge case:** manager publishes a January roster that includes the worker on days they have approved leave in December — different month, fine; but a leave range spanning a roster week that gets published after approval — no warning was found. **Retry/concurrency:** n/a. **Denied role / wrong tenant:** date-range leave under another pharmacy's membership → PermissionDenied. **Payment/notification:** silent creation (CG-02) + silent approval-to-roster gap. **Web/Expo difference:** none — backend behaviour; whether either client even offers date-range leave is UNKNOWN (screens not traced).\n**RECOMMENDED:** Notify the same recipients as slot-bound leave on creation *and* on decision, and warn (not block) at roster publish when a published assignment overlaps a worker's approved leave. Severity: medium — the silent path makes date-range leave a trap.\n**ALTERNATIVE A — Keep current logic:** date-range leave notifies nobody and never blocks rostering. Trade-off: no work; managers must remember every approved date range.\n**ALTERNATIVE B — Block rostering inside approved leave:** creating/publishing an assignment overlapping approved leave is refused. Trade-off: strongest; a genuine exception (worker agrees to work a day inside their leave) needs a manager override + the leave to be amended.\n**ALTERNATIVE C — Drop date-range leave:** leave is only ever for a specific rostered shift. Trade-off: simplest; workers planning holidays must wait until the roster exists, which may be weeks after they need to book flights.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/leave_service.py` (`create_leave`, `_notify_slot_leave_created`), `backend/workforce/roster/validation.py` (`worker_issues`), `backend/workforce/roster/publication.py` (`publish_roster_period` — no leave check seen).\n**Decision status:** OPEN — NEW."}, {"id": "GM-06-Q08", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q08 — When employment ends, what happens to the roster, the bookings, and the leave?\n\n**Plain English:** today there is no \"employment ends\" flow at all. A pay agreement can be given an end date, and a membership can be removed — but nothing in the code I read says what happens to that person's future roster shifts, their pending leave, their confirmed bookings, or their attendance record when they leave.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `EmploymentEngagement.effective_to` closes a pay period (overlap rules still apply). `Membership.remove()` (GM-05, adopted) deletes the row, or deactivates it if employment history protects it — and GM-05 found nothing that handles the removed person's future bookings, roster entries, or pending offers. No termination reason, no last-day, no handover, no final-pay step was found in the files read. `WorkforceLeaveRequest` has no handling for a member who leaves with pending/approved leave.\n**Normal case:** a part-timer resigns with 2 weeks' notice; the manager sets `effective_to` and removes the membership. **Edge case:** the person has rostered shifts next week, approved leave next month, and a confirmed locum booking (they also locum elsewhere) — which of those survive? UNKNOWN. Person leaves mid-shift (attendance session open) — UNKNOWN. **Retry/concurrency:** removal racing an acceptance — GM-05 notes the acceptance should fail if the membership is gone (not verified in `offers.py`). **Denied role / wrong tenant:** only a manager of that pharmacy can remove; exact behaviour UNKNOWN here. **Payment/notification:** final pay, leave payout, and notice are Fair Work matters; the product currently says nothing. **Web/Expo difference:** none — the absence is backend-wide.\n**RECOMMENDED:** On membership removal / engagement end, block new bookings immediately, keep history, and force an explicit choice on future roster assignments and approved leave (release with notice, or keep with a warning) — the same shape as GM-05-Q09, which owns the removal consequences. Do not silently keep a departed worker on the roster. Severity: high — ghost workers on the roster become no-shows (GM-08) and pay errors (GM-09).\n**ALTERNATIVE A — Keep current logic:** end the engagement / remove the membership and let whatever happens happen. Trade-off: no work; future shifts stay assigned to someone who has left.\n**ALTERNATIVE B — Auto-release everything:** ending employment deletes/cancels all future roster assignments and pending leave, and releases the shifts to cover. Trade-off: clean, but a worker who is only changing employment type (casual → part-time) would lose their roster.\n**ALTERNATIVE C — Employment end is a GM-05 removal only:** no separate GM-06 flow; the membership-removal decision covers it. Trade-off: one place to decide; but pay/leave/final-pay specifics still need a home.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py` (`EmploymentEngagement.effective_to`), GM-05 adopted revalidation (`Membership.remove()`, Q-09), `backend/workforce/leave_service.py` (no leaver handling).\n**Decision status:** OPEN — NEW (overlaps GM-05-Q09 — decide together, don't decide twice)."}, {"id": "GM-06-Q09", "area": "GM-06", "plat": "Web + Expo", "md": "### GM-06-Q09 — Minimum staffing (coverage requirements): a rule, a warning, or decoration?\n\n**Plain English:** a pharmacy can write down \"we need at least 2 pharmacists on Saturdays 9–5\" — but nothing in the code I read ever checks it. The roster can publish with nobody on, and nothing complains.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `CoverageRequirement` exists (weekday, times, role, `minimum_staff`, `active`) with create/list/detail endpoints. No reference to coverage requirements was found in roster validation (`worker_issues`), publication (`publish_roster_period`), or the files read. Whether any other module enforces it was not traced.\n**Normal case:** Saturday needs 2 pharmacists; roster publishes with 2. **Edge case:** Saturday publishes with 1 (one called in sick, leave approved) — publish succeeds silently today. **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification:** none — but an understaffed pharmacy is a safety and service problem, and the product currently can't see it. **Web/Expo difference:** none — backend absence.\n**RECOMMENDED:** Warn at roster publish when a coverage requirement is unmet (list the gap, require the manager to acknowledge it — same pattern as publication warnings), and show coverage vs rostered on the roster screen. Severity: medium — a warning is useful; a block would stop a pharmacy publishing a roster it has to publish short-staffed.\n**ALTERNATIVE A — Keep current logic:** coverage requirements stored, never checked. Trade-off: no work; the feature is decoration.\n**ALTERNATIVE B — Block publish when coverage is unmet:** Trade-off: safest on paper; a pharmacy that cannot fill a Saturday cannot publish any of its roster, which punishes the whole week for one gap.\n**ALTERNATIVE C — Drop coverage requirements:** remove the model and endpoints. Trade-off: honest; loses the only place minimum staffing is written down.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py` (`CoverageRequirement`), `backend/workforce/urls.py` (endpoints), `backend/workforce/roster/validation.py` + `backend/workforce/roster/publication.py` (no coverage reference found).\n**Decision status:** OPEN — NEW.\n\n---"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Create employment engagement | Manager configures employment terms and award rates in engagements panel (`frontend_web/src/features/workforce/EmploymentEngagementsPanel.tsx:150`). | Manager creates and views employment engagements (`frontend_mobile/app/workforce/employment-engagements/index.tsx:3`). | Yes | — |\n| Part-time contracted hours recording | Engagement terms dialog records agreed part-time hours (`frontend_web/src/features/workforce/WorkforceSettingsPage.tsx:115`). | Mobile workforce settings records contracted hours for part-time staff (`frontend_mobile/app/workforce-settings.tsx:274`). | Yes | — |\n| Minimum staffing / coverage rules | Coverage panel displays pharmacy coverage requirements (`frontend_web/src/features/workforce/RosterCoveragePanel.tsx:20`). | Manager roster coverage screen reviews staffing coverage (`frontend_mobile/app/manager/roster/coverage.tsx:3`). | Yes | — |\n| Worker requests leave | Worker submits leave request in My Leave page (`frontend_web/src/features/workforce/MyLeavePage.tsx:6`). | Worker creates leave request with reason and date range (`frontend_mobile/app/my-leave.tsx:67`). | Yes | — |\n| Manager reviews and decides leave | Manager approves or rejects pending leave requests (`frontend_web/src/features/workforce/ManagerLeavePage.tsx:6`). | Manager reviews pending leave requests from workforce screen (`frontend_mobile/app/workforce/leave-requests.tsx:29`). | Yes | — |", "file": "areas/GM-06-employment-leave.md"}, {"key": "GM-07", "row": "9", "title": "GM-07 Roster/cover/swap", "qs": [{"id": "GM-07-Q01", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-Q01 — Is the weekly draft → validate → publish → acknowledge roster the right shape?\n\n**Plain English:** today a roster is a week (Monday to Sunday) that a manager drafts, the system validates, the manager publishes, and workers are asked to acknowledge. Drafts are invisible to workers. That shape is built — but nobody has confirmed a week is the right unit, or that publishing should be all-or-nothing per week.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `RosterPeriod`: one per pharmacy per Monday, DRAFT/PUBLISHED/ARCHIVED. Publish validates (errors block; warnings need force/acknowledge), writes a revisioned audit, notifies workers. Unpublish (whole week or single shift) hides shifts immediately. Archive only from published. Copy-week and templates exist. Workers see published weeks only.\n**Normal case:** manager drafts next week, publishes Friday, workers acknowledge over the weekend. **Edge case:** a mistake is found in one shift of a published week — the manager can unpublish that single shift (`unpublish_roster_shift`) or the whole week; whether unpublishing a single shift notifies its worker is UNKNOWN (no notification found in the code read). **Retry/concurrency:** publish locks the period row; two managers publishing at once serialise on the lock; revision counters track draft/published/validated revisions. **Denied role / wrong tenant:** only that pharmacy's roster managers can publish; org admins need a scoped MANAGE_ROSTER capability. **Payment/notification:** publish notifies workers (in-app); unpublish/archive send nothing found. **Web/Expo difference:** none in the rule — backend behaviour; screens not traced.\n**RECOMMENDED:** KEEP the weekly draft → publish shape, and add per-shift unpublish notices (same recipients as the publish notice). Severity: low for the shape, medium for the missing unpublish notice.\n**ALTERNATIVE A — Keep current logic:** weekly shape as-is, silent unpublishes. Trade-off: no work; a worker can lose a shift without being told.\n**ALTERNATIVE B — Fortnightly / monthly periods:** Trade-off: fewer publishes; bigger blast radius per mistake and a worse acknowledgement story.\n**ALTERNATIVE C — No draft state (publish-as-you-go):** every roster change is live immediately. Trade-off: simplest, but workers see half-built rosters and there is no validation gate.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py` (`RosterPeriod`, `RosterPublicationAudit`, `RosterAcknowledgement`), `backend/workforce/roster/publication.py` (all functions), `backend/workforce/roster/urls.py`.\n**Decision status:** OPEN — NEW."}, {"id": "GM-07-Q02", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-Q02 — Who can build and publish a roster — owner, manager, roster manager, org admin?\n\n**Plain English:** today the owner, any manager, any roster manager, and a scoped org admin can all publish a roster. A communications manager cannot. That is the rule in code — but it means a roster manager can publish a week the owner has never seen.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `can_manage_roster_pharmacy` (owner, superuser, `PharmacyAdmin` MANAGE_ROSTER via `can_manage_roster`, or org member with `OrgCapability.MANAGE_ROSTER` scoped to the pharmacy). GM-05 (adopted): OWNER and MANAGER hold identical capabilities; ROSTER_MANAGER holds roster + comms; COMMUNICATION_MANAGER holds comms only. Every publish/unpublish/archive/approve/reject/release path in this area goes through the same `is_authorized_attendance_manager` check.\n**Normal case:** the roster manager builds and publishes the week. **Edge case:** owner on leave; a manager publishes — allowed today. Two managers disagree — either can unpublish the other's week (no lock-out besides the row lock during the call). **Retry/concurrency:** row locks serialise concurrent publishes; no approval workflow between two managers. **Denied role / wrong tenant:** a manager of Pharmacy A publishing Pharmacy B's roster → PermissionDenied (scoped check). **Payment/notification:** publish notifies workers; the owner is not separately notified that someone else published. **Web/Expo difference:** none — backend rule; whether the screens hide publish from unauthorised roles is UNKNOWN (screens not traced).\n**RECOMMENDED:** KEEP who can publish, but require the *owner* (or a named delegate) to approve the first publish of a week when the publisher is not the owner — a lightweight second pair of eyes, not a veto. Severity: medium — publishing is the moment workers' plans change.\n**ALTERNATIVE A — Keep current logic:** anyone with MANAGE_ROSTER publishes freely. Trade-off: no work; the owner may first hear about a roster from a worker.\n**ALTERNATIVE B — Owner-only publish:** managers draft, only the owner publishes. Trade-off: tightest control; the owner is a bottleneck every week.\n**ALTERNATIVE C — Split build vs publish:** roster managers build, managers+owners publish. Trade-off: a real separation of duties; needs a new capability split (the matrix has no \"build but not publish\").\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/permissions.py` (`can_manage_roster_pharmacy`), `backend/workforce/roster/permissions.py`, `backend/workforce/roster/publication.py`, GM-05 adopted revalidation.\n**Decision status:** OPEN — NEW."}, {"id": "GM-07-Q03", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-Q03 — Workers are asked to acknowledge the roster — what if they never do?\n\n**Plain English:** when a roster publishes, every worker gets a notice asking them to acknowledge it. The product records who acknowledged — and then does nothing with that information. There is no deadline, no reminder, and no consequence for never acknowledging.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Publish notifies each rostered worker (in-app, action URL `/dashboard/<role>/roster`). `RosterAcknowledgement` is unique per (period, user) with `acknowledged_at`; a status view shows who has acknowledged. Nothing in the code read enforces acknowledgement, reminds the worker, escalates to the manager, or blocks anything on a missing acknowledgement.\n**Normal case:** worker sees the notice, opens the roster, acknowledges. **Edge case:** worker never opens the app — they never see the roster, never acknowledge, and the manager has no signal beyond the status view (which they must go and check). Worker acknowledges, then the week is unpublished and republished — is the old acknowledgement still valid? The republish path restores withdrawn slots and writes a new audit revision; whether acknowledgements reset on republish was not traced (UNKNOWN). **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification:** acknowledgement is the only proof a worker saw their shifts; without a consequence it is a read receipt. **Web/Expo difference:** none in the rule; whether Expo surfaces the notice and the acknowledge action identically is UNKNOWN (screens not traced).\n**RECOMMENDED:** Acknowledgement is a read receipt, not a gate — but add a reminder 24h before the week starts to workers who haven't acknowledged, and show the unacknowledged list on the manager's roster screen. Severity: low-medium — cheap, and it closes the \"did they see it?\" question that otherwise becomes a phone call.\n**ALTERNATIVE A — Keep current logic:** ask once, record, do nothing. Trade-off: no work; managers must chase acknowledgements by hand.\n**ALTERNATIVE B — Acknowledgement gates the shift:** a worker who hasn't acknowledged can't be marked present / can't clock in (GM-08) until they do. Trade-off: strongest signal, but a worker who forgot to tap is blocked at the door on Monday.\n**ALTERNATIVE C — Drop acknowledgement:** publish notice only, no acknowledgement at all. Trade-off: honest about what the product enforces; loses the only proof-of-sight.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/models.py` (`RosterAcknowledgement`), `backend/workforce/roster/publication.py` (`_notify_roster_publication`, `publish_roster_period`), `backend/workforce/roster/urls.py` (acknowledge + acknowledgement-status endpoints).\n**Decision status:** OPEN — NEW."}, {"id": "GM-07-Q07", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-Q07 — When cover is needed, should the shift become a visible vacancy (\"needs cover\")?\n\n**Plain English:** the rulebook says a cover opened as a vacancy is the same shift and slot, shown as \"needs cover\" and linked to the vacancy — no duplicate. Today there is no vacancy and no \"needs cover\" display anywhere in this flow. A cover request is invisible except to the manager who opens the request list.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Cover approval reassigns directly (F08). Release deletes the assignment and optionally widens visibility (F09) — but sets no vacancy flag and sends no notice. No `needs_cover` field, flag, or display was found in the files read (`worker_actions.py`, `publication.py`, `models.py` — searched in this pass for vacancy/cover display; none found). The marketplace boards show shifts by visibility tier, not by cover need.\n**Normal case:** worker requests cover for Saturday; the manager sees the request in their list and picks someone. **Edge case:** manager is away — nobody else can see the shift needs cover, so it sits until the manager returns. The shift's own worker still shows as assigned (R04), so the boards don't show a gap either. **Retry/concurrency:** n/a. **Denied role / wrong tenant:** a vacancy visible to the wrong audience would leak staffing gaps; scoping (staff-only? favourites? public?) is part of the decision. **Payment/notification:** a visible vacancy could attract favourites/public (GM-12 offer terms) instead of staff terms — the pay basis changes with the audience. **Web/Expo difference:** none — the absence is backend-wide.\n**RECOMMENDED:** Show an open cover request as \"needs cover\" to the pharmacy's own staff (and to named colleagues the requester suggested, Q05) — same shift, same slot, linked to the request — and only widen to favourites/public by an explicit manager action. Severity: medium — visibility is what makes cover fill fast; without it, everything depends on one manager's list.\n**ALTERNATIVE A — Keep current logic:** cover requests visible only in the manager's request list; no vacancy anywhere. Trade-off: no work; cover fills at the speed of the manager.\n**ALTERNATIVE B — Vacancy to the whole marketplace immediately:** an approved cover request (or a request itself) opens the shift to the public board. Trade-off: fastest fill; breaks R04 (stay assigned until replaced) in spirit — the public sees a shift that still shows a worker assigned — and pays on offer terms.\n**ALTERNATIVE C — Vacancy, but staff-only and manager-gated:** the manager turns a cover request into a vacancy with one tap. Trade-off: the manager keeps control; one more step.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/roster/worker_actions.py` (no vacancy), `backend/workforce/roster/publication.py`, carried R06, `backend/workforce/roster/urls.py` (no vacancy endpoint).\n**Decision status:** OPEN."}, {"id": "GM-07-Q08", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-Q08 — How late can a swap or cover request come in — and what happens near the start?\n\n**Plain English:** today there is no deadline at all. A worker can request a swap or cover five minutes before the shift starts, and the code will happily accept the request. Whether a manager can still approve it in time, and what happens if nobody answers, is entirely up to the people involved.\n\n**ACTUAL TODAY — Web and Expo (same backend):** No time-based rule was found in `worker_actions.py`, `validation.py`, or `publication.py`: no cut-off, no \"too late\" rejection, no escalation for unanswered requests near start, no expiry of pending requests. A pending request stays PENDING until a manager decides it (even after the shift has started or ended — no cleanup was found). Carried R04D covers public-worker cancellation near start (\"emergency escalation with reason and notices\") — that escalation path was not traced here (GM-15).\n**Normal case:** worker requests cover the day before; manager approves the same day. **Edge case:** request 10 minutes before start; manager approves 5 minutes after start — the replacement is assigned to a shift that has begun (attendance GM-08: clock-in window is ±2h, so they can still clock in). Request never answered — the worker stays assigned and is expected to show up (R04), but if they don't, that's a no-show (GM-08, CX-Q11 undecided). **Retry/concurrency:** n/a. **Denied role:** n/a. **Payment/notification:** a late approval changes who is paid, possibly after the shift started; no notice is sent on approval/rejection today (CG-03), so a late decision may not even be seen. **Web/Expo difference:** none — backend absence.\n**RECOMMENDED:** No hard cut-off for *requesting* (a late request is better than a silent no-show), but add a deadline for *deciding*: requests inside 2 hours of start escalate (notify the owner + all managers, not just the roster list), and a request still pending at start time is flagged \"unanswered — worker still assigned\" on the manager screen. Severity: medium — the near-start case is where cover matters most.\n**ALTERNATIVE A — Keep current logic:** no deadlines, no escalation, pending requests never expire. Trade-off: no work; near-start requests depend entirely on a manager happening to look.\n**ALTERNATIVE B — Hard cut-off:** no swap/cover requests inside N hours of start (owner picks N); inside the window the only path is a phone call / manager release. Trade-off: clear; but it pushes urgent cases outside the product.\n**ALTERNATIVE C — Pending requests expire at start time:** unanswered requests auto-reject at start, and the worker is told they are still assigned. Trade-off: no stale requests; a manager who was about to approve loses the chance.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/roster/worker_actions.py` (no time rule), carried R04D, GM-08 clock-in window (±2h, `attendance/eligibility.py`).\n**Decision status:** OPEN — NEW."}, {"id": "GM-07-Q09", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-Q09 — When a shift changes hands, whose pay terms apply — and what does the worker see?\n\n**Plain English:** today, when a swap or cover moves a shift to someone else, the new worker is paid on *their own* staff terms — their own engagement, their own rates — never the departing worker's. That's a sensible rule, but the workers involved are never shown it, and nobody is notified the transfer happened.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `_reassign` (`worker_actions.py`): \"Hand an assignment to a replacement worker under that worker's own staff terms, never the departing worker's.\" — `staff_assignment_defaults(user, pharmacy, work_date)` + `refresh_assignment_rate(assignment)`. The departing worker's terms are not carried over. No notification is sent on approval (CG-03), so neither worker is told by the system; the replacement discovers it on their roster. Whether the new terms are shown to either worker before/after transfer was not traced (screens not read).\n**Normal case:** a $45/hr pharmacist covers for a $55/hr pharmacist — the cover is paid $45 (their own rate). **Edge case:** the replacement has no current engagement on file — what rate do they get? UNKNOWN (GM-06-Q01: engagements are optional today). Replacement is above-Award, requester is Award — the shift's cost changes with no approval step for the cost. **Retry/concurrency:** the transfer is one transaction (locks held); a concurrent leave approval on the same assignment is guarded by the staleness check (requester must still be assigned). **Denied role:** n/a. **Payment/notification:** the pay basis changes silently with the transfer; the only record is the audit row + the assignment's refreshed rate. **Web/Expo difference:** none — backend rule.\n**RECOMMENDED:** KEEP \"replacement's own terms\", and show the rate that will apply to the replacement *before* the manager approves (on the approval screen), plus notify both workers on transfer. Severity: medium — the rule is right; the silence around it is the problem.\n**ALTERNATIVE A — Keep current logic:** own-terms transfer, no notice, no preview. Trade-off: no work; workers discover their pay after the fact.\n**ALTERNATIVE B — Departing worker's terms travel with the shift:** the cover is paid what the shift was going to pay. Trade-off: the shift's cost is stable; but a junior covering a senior's shift is overpaid and a senior covering a junior's is underpaid — and it breaks the engagement model (GM-06).\n**ALTERNATIVE C — Manager sets the rate per transfer:** the approval screen lets the manager pick the rate. Trade-off: flexible; invites inconsistent pay and Award-floor mistakes.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/roster/worker_actions.py` (`_reassign`, `staff_assignment_defaults`, `refresh_assignment_rate`), `backend/workforce/models.py` (`EmploymentEngagement`), GM-06-Q01.\n**Decision status:** OPEN — NEW."}, {"id": "GM-07-Q10", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-Q10 — Release to the marketplace: which audience, and who decides the tier?\n\n**Plain English:** when a manager releases a worker without a replacement, they can push the shift out to a wider audience — staff, favourites, chain, org, or public. That choice is a free parameter on the release call, and the public tier has a daily limit. Nobody has decided which tiers a release may use, or whether the manager should choose at all.\n\n**ACTUAL TODAY — Web and Expo (same backend):** `release_worker_from_assignment(request, manager, escalate_to_visibility=None)`: if a tier is given, it must be in `allowed_tiers(pharmacy)`; PUBLIC enforces `enforce_public_shift_daily_limit`; `apply_escalation` moves the shift; roster slots are detached (`roster_period=None`). If no tier is given, the shift is simply unassigned at its previous visibility. The release *approves* the worker's request (status APPROVED). No default tier, no rule about which tier is appropriate for a released roster shift, and no notification was found.\n**Normal case:** Saturday shift released to favourites; a favourite takes it as a marketplace offer. **Edge case:** released straight to PUBLIC — the shift is now a public shift with no public-shift checks at posting (GM-04-Q03: posting checks nothing; but this shift was never \"posted\", it was released — whether the public-tier Verified/AHPRA gate applies to a released shift's applicants is a GM-12 question). Released with no tier — the shift sits unassigned at staff visibility, visible to staff who may not know it's open (no vacancy display, Q07). **Retry/concurrency:** the release is one transaction; a concurrent swap approval on the same request is blocked by the PENDING check. **Denied role / wrong tenant:** only that pharmacy's managers; invalid tier → ValidationError. **Payment/notification:** a released shift that gets booked pays on offer terms (GM-12/GM-14), not staff terms; no notice is sent on release. **Web/Expo difference:** none — backend behaviour; whether the release screen offers the tier choice on both clients is UNKNOWN.\n**RECOMMENDED:** Default a release to the next tier up from where the shift was (staff → favourites → chain → org → public), let the manager override it on the same screen, and never release straight to public without a confirm step (public means the Verified/AHPRA gate and the daily limit both matter). Severity: medium — the tier decides who can take the shift and on what terms.\n**ALTERNATIVE A — Keep current logic:** manager passes any allowed tier or none; no default, no confirm. Trade-off: no work; a tired manager can release a Saturday shift to nobody (no tier) or to everyone (public) by accident.\n**ALTERNATIVE B — Release always goes to favourites first:** Trade-off: predictable; a shift nobody favourite wants sits until someone escalates it again.\n**ALTERNATIVE C — Release never escalates:** a released shift stays at staff visibility; the manager must separately post/escalate it. Trade-off: safest; two steps for every release.\n**Other (describe) / Defer.**\n**Sources:** `backend/workforce/roster/worker_actions.py` (`release_worker_from_assignment`), `backend/shifts/escalation.py` (`allowed_tiers`, `apply_escalation`, `PUBLIC_LEVEL` — not line-read), `backend/shifts/limits.py` (`enforce_public_shift_daily_limit` — not line-read).\n**Decision status:** OPEN — NEW.\n\n---"}, {"id": "GM-07-W01", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-W01: Does the 4-month posting window also apply to roster planning? (W-01, D148)\n**Scenario:** Tom builds a week template, then uses \"copy week\" to fill the roster six months ahead for Omar, Ali and Mia.\n**What happens today (pr257 only; deployed main has no server posting window):** new vacancy creation, recurrence and changed posting dates refuse dates outside the window (pharmacy-local today to the end of the fourth following calendar month) (`pr257:backend/shifts/posting.py:66` `validate_posting_window`, called at `:100` and `:228`; roster open-shift path `pr257:backend/workforce/roster/views.py:441`). Roster planning writers (week templates, copy week, bulk create, roster slot edits) do **not** check it, so Tom's copy succeeds. Releasing an existing assignment and approving a swap or replacement don't all apply it either.\n**Recommendation first: A.** Use the same date limit for roster planning and vacancy posting.\n- **A (recommended):** The copy stops at the window edge and tells Tom which weeks were skipped.\n- **KEEP:** Tom can plan a year ahead and make permitted description edits. Moving dates outside the window is refused (`pr257:backend/shifts/posting.py:213`, `:228`).\n- **B:** Tom can plan within a longer roster-only window, such as 12 months.\n- **DEFER**\n\n**Status:** OPEN"}, {"id": "GM-07-W02", "area": "GM-07", "plat": "Web + Expo", "md": "### GM-07-W02: May a roster manager edit or cancel a shift they are booked on themselves? (W-06, D178)\n**Scenario:** Omar is Tom's pharmacist and has the roster-manager role at Brisbane. He is also booked on Saturday's shift there. He edits that shift's description, then tries to cancel it.\n**What happens today:** Omar can edit the description. Agreed terms stay locked. Deleting a shift with booked or payment-pending staff is refused for any manager. The general D04 cancellation action is still to be built (`pr257:backend/workforce/roster/views.py:237`, `pr257:backend/workforce/roster/worker_actions.py:55`, O4 D178).\n**Recommendation first: A.** Ask another manager or Tom to edit Omar's booked shift or use the future cancellation action.\n- **A (recommended):** Omar asks another manager to make either change.\n- **B:** Omar can edit the description. Another manager uses the future cancellation action.\n- **C:** Omar keeps his current edit rights and can use the future D04 cancellation action with the same guards as other roster managers.\n- **DEFER**\n\n**Status:** OPEN"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Build draft roster week | Manager plans shifts on calendar grid (`frontend_web/src/components/roster/HorizontalCalendarGrid.tsx:28`). | Manager views and edits roster calendar (`frontend_mobile/app/manager/roster/calendar.tsx:3`). | Yes | — |\n| Validate and publish roster | Manager validates roster requirements and publishes week (`frontend_web/src/features/workforce/RosterPublishReviewDialog.tsx:81`). | Manager accesses published roster view (`frontend_mobile/app/attendance/published-roster.tsx:23`). | Yes | — |\n| Worker roster view & acknowledgement | Worker reviews schedule on roster grid (`frontend_web/src/pages/dashboard/sidebar/RosterWorkerPage.tsx:770`). | Worker sees the published roster in My Roster, with a notice linking to the acknowledgement screen (`frontend_mobile/app/my-roster.tsx:494`). | Yes | — |\n| Shift swap request | Worker requests a swap with a named colleague from the roster action dialog (`frontend_web/src/pages/dashboard/sidebar/RosterWorkerPage.tsx:113`). | Missing: My Roster offers leave, cover and claim only; a worker cannot request a swap (managers can approve swaps on Expo) (`frontend_mobile/app/my-roster.tsx:69-71`, `frontend_mobile/features/parity/roster.tsx:640`). | No | Corrected 22 Nov (orchestrator review): missing on Expo. Defect BL-34 (the app must carry every web feature), not an owner question. |\n| Roster audit trail | Manager overview records roster status and revision summaries (`frontend_web/src/components/roster/RosterPlanningToolbar.tsx:132`). | Mobile manager roster audit screen inspects historical changes (`frontend_mobile/app/manager/roster/audit.tsx:3`). | Yes | — |", "file": "areas/GM-07-internal-roster-cover-swap.md"}, {"key": "GM-18", "row": "10", "title": "GM-18 Talent/recruitment", "qs": [{"id": "GM-18-Q01", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q01 (ex TB-Q01) — Who can see the talent board? ★ FIRST QUESTION — see §4\n\n> **Also covers (22 Nov):** GM-04-Q12 (GM-04), GM-24-Q11 (GM-24), GM26-Q01 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** any signed-in account can read the whole board — including competing workers and newcomers — and sees every author's name and user IDs, because the authenticated feed uses the unmasked serializer (`serializers/explorer.py`, `views/explorer.py::get_permissions` — read = `IsAuthenticated` only). Logged-out visitors see public cards with anonymous authors masked. There is no role check on reading.\n- **RECOMMENDED (carried from #184, rec B):** employers + own post, plus public masked — restrict authenticated discovery to authorised hiring roles and each author; keep public discovery only if masking is enforced server-side. Rationale: worker-to-worker access defeats anonymity, and the leak is API-level, so a UI fix cannot cure it. Severity: **P0 (privacy)**. Benefit: anonymous posting becomes real; workers can advertise availability without competitors and current employers identifying them. Risk: the audience shrinks, so fewer eyes on each post; needs a server-side role gate plus a \"my post\" exception. Legal: privacy — names + availability + location are personal information; OAIC APP 6 (use/disclosure) supports consent-based disclosure; anonymous posting that is not anonymous is also a misleading-representation risk. Decide jointly with GM-20 (AUDIENCE-01).\n- **ALTERNATIVE A — Keep current logic:** all accounts see identities; public sees masked cards. Scenario: a locum's current employer signs in as an Explorer and reads her name, suburb and \"open to full-time\" post. Trade-off: zero build, the anonymity promise stays false.\n- **ALTERNATIVE B — Employers and own post only (no public board):** owners, managers, organisations; authors see their own post. Scenario: a pharmacy finds a locum, but a worker browsing without an employer account cannot discover the board at all. Trade-off: strongest privacy, weakest discovery and SEO.\n- **ALTERNATIVE C / Other:** employers + own post + public masked (identical to the recommendation here — the \"B\" option IS the recommendation). Defer: keep current logic until after launch and accept the leak — **not recommended at P0**.\n- **Cases:** normal — hiring owner browses masked/unmasked per role; edge — author views own post (must always work); a worker who is also an owner (dual roles — which side wins?); wrong tenant — a pharmacy in another state reads a local worker's post (no tenant scoping on reads today); web/Expo — same API, same leak; Next — same API via the migrated copy.\n- **Gap type:** decision gap (P0) + code gap (server-side masking must follow the decision)."}, {"id": "GM-18-Q02", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q02 (ex TB-Q02) — When is an anonymous candidate's identity revealed?\n\n> **Also covers (22 Nov):** GM-24-Q12 (GM-24), GM26-Q02 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** immediately, to any signed-in user, on first read. There is no reveal point: no chat reply, booking-request acceptance or offer acceptance gates the name — the API returns it with the card. The public feed is the only masked path.\n- **RECOMMENDED (carried from #184, rec A):** when the worker accepts a booking request. Rationale: identity is disclosed before consent today; tying reveal to the worker accepting a request gives the worker the choice to engage. Severity: **P0 (privacy)**. Benefit: anonymous posting works end-to-end; workers control first contact. Risk: needs a per-relationship reveal state (who has been revealed to whom) and a masked card that still lets an owner judge fit; the booking flow must carry the reveal (and the \"Request booking\" flow currently needs the author user id client-side — it must be reworked to use the reference code instead). Legal: privacy, as Q01.\n- **ALTERNATIVE A — Keep current logic:** reveal to any signed-in user immediately. Scenario: as Q01 — the leak is the feature. Trade-off: zero build, anonymity is fiction.\n- **ALTERNATIVE B — When they reply in chat:** earlier reveal. Scenario: owner messages, worker replies, name appears. Trade-off: needs a chat/enquiry step first (ties to Q07 option C); a worker who replies to ask a question has revealed themselves before any offer.\n- **ALTERNATIVE C — Only when an offer is accepted:** latest reveal. Scenario: owner makes a firm offer to \"Anonymous candidate\", worker accepts, name appears. Trade-off: maximum privacy, but the owner is offering blind (no name, no verifiable history) and payment/engagement needs identity eventually anyway.\n- **Other / defer:** reveal when the worker accepts a favourites invitation (ties to Q08B). Defer: decide with Q01, not separately.\n- **Gap type:** decision gap (P0), then build (reveal state + reference-code booking flow)."}, {"id": "GM-18-Q03", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q03 (ex TB-Q03) — What stays hidden before identity is revealed?\n\n> **Also covers (22 Nov):** GM26-Q03 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** structured cards omit contact details, street addresses and documents, but authenticated reads return adults' full names (under-18s: first name only) plus skills, software, travel states, AHPRA years and experience. Free-text pitches are **not scrubbed** — the write serializer has no scan, and both PitchDialogs carry only a warning (\"Please don't add any contact details…\"). A phone number in the pitch is published verbatim.\n- **RECOMMENDED (carried from #184, rec A):** hide surname, contacts, street address and documents until the Q02 reveal point; scan free text so the structured-field rule cannot be bypassed. Rationale: the structured rule is worthless if the pitch can carry the same information in plain text. Severity: **P0 (privacy)**. Benefit: the masking rule holds in practice, not just in the schema. Risk: scanning needs a pattern list (phone/email/URL/social handle) and a false-positive path (a worker whose suburb or employer name looks like an identifier); over-blocking annoys legitimate pitches. Legal: privacy, as Q01.\n- **ALTERNATIVE A — Keep current logic:** expose adult full names to signed-in users; warn about contact details. Scenario: a worker writes \"call me on 04xx\" and every signed-in reader can call them directly, off-platform. Trade-off: zero build, the leak persists through the pitch.\n- **ALTERNATIVE B — Contact details only:** show the full name before a booking request, hide contacts/address/documents. Scenario: an owner recognises a name and judges reputation, but cannot contact them directly. Trade-off: keeps reputation signals, keeps the name leak — only viable if Q01/Q02 accept name exposure, which they do not as recommended.\n- **Other / defer:** block the save when a phone/email pattern is detected (hard reject) vs warn-and-flag-for-review (soft). Defer: ship the structured masking first, add text scanning in the next release — acceptable only if Q01/Q02 masking lands first.\n- **Gap type:** decision gap (P0) for the hidden-set; **code gap** for the missing scan (no owner choice needed on the principle — a warning is not a control)."}, {"id": "GM-18-Q04", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q04 (ex TB-Q04) — Which filters should the talent board launch with?\n- **ACTUAL TODAY (verified):** role, state, work type, skills/software, text search, willing-to-travel, placement seeker, availability date range — all client-side after a full download (`filterTalentCandidates`, shared-core; `loadAllTalentPages`, `page_size: 200`). **No distance-from-pharmacy filter and no rate filter**, although posts store postcode and `coverage_radius_km`. The backend has no filter parameters.\n- **RECOMMENDED (carried from #184, rec A):** role, distance, dates, rate, software — run on the server. Rationale: the useful filters already exist, so retain them and add server-side distance/rate matching rather than rebuild the board; server-side is also the scale fix (Q16). Severity: medium. Benefit: an owner in Brisbane stops scrolling through Perth candidates; a $70/hr locum stops appearing for $55/hr searches. Risk: distance needs the pharmacy's location (owner's pharmacy vs search location — must be defined); rate needs a worker rate source (onboarding rates vs per-post rate — the model has neither for search). Legal/financial: none direct.\n- **ALTERNATIVE A — Keep current logic:** existing client-side filters without distance, rate or server filtering. Scenario: an owner filters by role and state, then manually reads 200 cards to find anyone within 30 km. Trade-off: zero build, poor hiring use and the scale problem (Q16) stays.\n- **ALTERNATIVE B — Role and date only:** less to build. Scenario: the board is a simple list; owners use text search for everything else. Trade-off: simplest, weakest — drops the skills/software filtering owners already have.\n- **Other / defer:** add distance only (rate is negotiated per offer — GM-12); or server-side the existing filters first, distance/rate second. Defer: launch with current filters, add server-side distance after launch volume is measured.\n- **Gap type:** decision gap (which filters, and where the rate lives) + code gap (server-side filtering — Q16)."}, {"id": "GM-18-Q06", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q06 (ex TB-Q06) — What does a brand-new worker show?\n- **ACTUAL TODAY (verified):** \"0.0 (0)\" on both cards (web `TalentCardV2.tsx:106`, mobile `:101`; client defaults missing average/count to 0). No neutral \"New\" label, no completed-shift threshold. A new worker looks poorly rated.\n- **RECOMMENDED (carried from #184, rec A):** \"New\" label until 5 completed shifts — no score shown yet. Rationale: zero stars makes an unrated worker look badly rated; a neutral state is honest. Severity: medium (fairness + marketplace liquidity — newcomers are the supply). Benefit: newcomers get enquiries; owners are not misled. Risk: the 5-shift threshold is a proposed local number (Airtasker's five-task completion-rate threshold informs it, does not prove it); \"completed shift\" needs a definition (timesheet approved? clock-out? GM-15 Q32–Q34). Legal: none direct; fairness/reputation.\n- **ALTERNATIVE A — Keep current logic:** show zero stars before feedback and the score from the first rating. Scenario: a new pharmacist's card shows 0.0 (0) next to a 4.8 (12); owners skip her. Trade-off: zero build, newcomers are punished for being new.\n- **ALTERNATIVE B — Show the score from the first rating, but label counts under 5 as \"few reviews\":** e.g. \"4.5 (2 reviews)\". Scenario: a worker with one 5-star review shows 5.0 (1) with a \"few reviews\" note. Trade-off: keeps early signal, warns about thin evidence; a single bad first review still sinks a newcomer.\n- **Other / defer:** \"New\" until first rating only (no 5-shift threshold). Defer: keep 0.0 (0) until after launch — not recommended; it costs newcomer supply from day one.\n- **Gap type:** decision gap (threshold + \"completed\" definition), then a small build."}, {"id": "GM-18-Q07", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q07 (ex TB-Q07) — Is \"Request booking\" a firm offer or an enquiry? ★ CONFLICT-RESOLVED — see OFFER-01\n\n> **Also covers (22 Nov):** GM-12-Q18 (GM-12), GM-24-Q14 (GM-24), GM25-C16 (GM-25). Asked once, here.\n- **ACTUAL TODAY (verified):** a firm offer. It opens a prefilled dedicated-shift form (web + mobile); submitting creates firm offers with 48-hour expiry (`assignment.py::offer_dedicated_shift`); the worker accepts or declines; outside acceptance reserves pending payment. The worker **cannot ask questions first** — there is no enquiry or chat step in the flow.\n- **RECOMMENDED — C (per consolidated queue OFFER-01, superseding #184's KEEP and GM-24's enquiry-first):** enquiry/chat first for public-board contacts, firm offer for favourites/members. Rationale: the conflict is real — GM-18's firm offer protects the owner, GM-24's enquiry-first protects the worker's identity and consent where no relationship exists. Splitting by relationship keeps the firm-offer mechanism where trust exists and adopts enquiry-first where identity is not yet established. Severity: high (it is the board's core transaction). Benefit: workers are not pressured by blind firm offers from strangers; owners keep the fast path for people they already know. Risk: two flows to build and explain; the boundary (who counts as a favourite/member) must be exact; the enquiry step needs a home (chat — GM-20 — or a lightweight message) or it becomes a dead end. **The GM-18 and GM-24 files' recommendations are superseded by this one; their evidence (48h flat expiry, one offer per slot, identity leak) stands.** Record the answer in both ledgers; do not ask Q07 and GM-24-Q14 separately.\n- **ALTERNATIVE A — Keep firm offer everywhere (GM-18's original KEEP):** continue dedicated offers requiring worker acceptance; payment confirms outside bookings. Scenario: an owner sends a firm offer to a stranger's anonymous card; the worker declines without ever being able to ask about the shift. Trade-off: one flow, fastest; workers get take-it-or-leave-it offers from people they have never spoken to.\n- **ALTERNATIVE B — Enquiry or chat first everywhere, then an offer (GM-24's original):** Scenario: every booking starts with a message; an owner who wants a regular locum waits for a reply before any offer exists. Trade-off: safest consent, slowest for trusted relationships; needs the chat/enquiry surface built before launch.\n- **ALTERNATIVE C — Owner chooses each time (TB-Q07 option C):** two flows behind one button. Scenario: the owner picks \"enquire\" or \"offer\" per candidate. Trade-off: maximum flexibility, maximum UI and support burden; owners will pick inconsistently.\n- **Other / defer:** offer only after an availability check passes (ties to Q17/Q19 — the post's dates may be stale). Defer: keep firm offer until the enquiry surface exists — acceptable only as a dated, explicit deferral, not a silent default.\n- **Gap type:** decision gap — **decided in principle by OFFER-01 (C)**; the owner confirms C (or picks A/B) and the build follows. The defects around the firm offer (credential gap Q11, expiry Q22, permission drift Q15) are separate questions."}, {"id": "GM-18-Q08", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q08 (ex TB-Q08) — What should the heart on a talent card do?\n\n> **Also covers (22 Nov):** Q-14 (GM-05), GM25-C17 (GM-25). Asked once, here.\n- **ACTUAL TODAY (verified):** it only likes/unlikes a post and changes its like count, on both apps. It creates no pharmacy-favourites membership, and talent cards have no \"Invite to favourites\" action. The saved-contacts API exists but has no UI (§1h).\n- **RECOMMENDED (carried from #184, rec B):** keep the like; add \"Invite to favourites\" — sends a membership invite the worker must accept. Rationale: a like does not create a reusable booking relationship today, and the favourites tier (community audience, re-booking) is the mechanism the platform already has for trusted repeat work. Severity: medium. Benefit: one tap turns discovery into a re-bookable relationship; the worker consents (invite, not silent add). Risk: needs the invite/accept flow (GM-05 membership invites) and a home for the invite in the worker's UI; a rejected invite needs a graceful state. Legal: consent — silent addition to a favourites list is a disclosure/relationship the worker did not choose.\n- **ALTERNATIVE A — Keep current logic:** post likes without a talent-card invitation to favourites. Scenario: an owner likes five locums and still has no way to re-book any of them except by finding the card again. Trade-off: zero build, discovery never converts to relationship.\n- **ALTERNATIVE B — Heart adds to favourites, with consent:** the worker must accept (same invite, different button). Scenario: the heart becomes the favourite action; the like disappears. Trade-off: one gesture, but owners lose the lightweight reaction and workers may confuse a like with a commitment.\n- **Other / defer:** wire the heart to the saved-contacts API (bookmark without membership) as a stopgap — cheap, private, no consent needed since it is the owner's own bookmark. Defer: keep like-only until membership invites are built.\n- **Gap type:** decision gap (which action the card offers), then build. The saved-contacts API already exists — only the UI is missing."}, {"id": "GM-18-Q10", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q10 (ex TB-Q10) — What is the rule for hiring a worker directly, off the platform?\n\n> **Also covers (22 Nov):** GM26-Q20 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** not built. No direct-hire or off-platform rule exists in the traced flow — no conversion fee, no permanent-hire clause, no disclosure. A pharmacy that finds a worker on the board can hire them directly and the platform has no stated position.\n- **RECOMMENDED (carried from #184, rec A):** permanent hire free; booked shifts stay — shifts found here are booked here. Rationale: a free permanent-hire rule is the simplest honest position (Nursa advertises no hire-away fee); it keeps the platform's revenue on shifts, where the fee is charged, and does not punish a good outcome (a permanent job). Severity: medium (commercial model). Benefit: owners are not afraid to use the board for full-time applications (Q07's full-time post kind exists precisely for this); workers are not trapped. Risk: revenue leakage if owners use the board as a free recruitment agency for permanent roles and never book a shift — needs the full-time-application flow to have its own terms (or a fee) if that becomes the dominant use. Legal: needs the terms to state it plainly; a conversion fee introduced later must not be retroactive (unfair-terms risk — GM-14/GM-26).\n- **ALTERNATIVE A — Keep current logic (no rule):** unclear for both sides. Scenario: an owner hires a locum permanently after two shifts; nobody knows whether a fee is owed. Trade-off: zero build, disputes later.\n- **ALTERNATIVE B — Conversion fee (like Upwork/Sidekicker):** a fee when a board contact becomes a permanent hire within a window. Scenario: owner pays, say, a fixed fee on permanent hire. Trade-off: protects platform revenue; needs the window, the amount, tracking (how do you know?) and enforcement — all unbuilt and hard to enforce.\n- **Other / defer:** free permanent hire, but shifts booked through the platform in the first N days stay on-platform. Defer: publish the free-hire rule at launch; revisit a fee only with data on permanent-hire volume.\n- **Gap type:** decision gap (commercial model), then terms wording. No code until the rule is chosen."}, {"id": "GM-18-Q11", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q11 (ex LA-Q01 / ON-02) — Must a fresh AHPRA register check run before a booking?\n\n> **Also covers (22 Nov):** GM26-Q35 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** no. A saved flag drives Verified. `require_public_ahpra` runs only for public (`PUBLIC_LEVEL`) shifts where the worker is not already a member; the re-check it queues is desktop-only, and the default
