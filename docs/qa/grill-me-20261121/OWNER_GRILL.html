an open session or pending provisional blocks that shift's timesheet from locking. Severity: high for pay correctness — but the decision belongs in GM-09; this question exists so the boundary isn't dropped.\n**ALTERNATIVE A — Keep current logic (handover undefined, no complete state):** Trade-off: no work; timesheets are built on whatever the builder does today, unverified.\n**ALTERNATIVE B — Session close alone = complete:** Trade-off: simplest; a provisional that was never approved still counts as complete (and payable?) — needs Q02's deadline to be safe.\n**ALTERNATIVE C — Manager sign-off per shift:** a manager marks each attendance complete (in addition to corrections). Trade-off: most control; a second approval queue on top of the provisional one.\n**Other (describe) / Defer.**\n**Sources:** `backend/attendance/models.py` (`AttendanceSession` vs assignment), `backend/workforce/urls.py` (timesheet + missing-punch endpoints), `docs/qa/launch-grill/questions.json` CX-Q32, CX-R01; GM-09 owns the builder (not read here).\n**Decision status:** OPEN — boundary question for GM-09 (carried CX-Q32/CX-R01, STILL VALID).\n\n---"}, {"id": "GM-08-W01", "area": "GM-08", "plat": "Web + Expo", "md": "### GM-08-W01: Re-grill: kiosk PIN setup and worker QR confirmations tied to the session the worker saw (W-13, register item 2)\n**Scenario (worker QR):** Ali scans the kiosk QR on his phone. It asks him to confirm clock-out. He clocks out elsewhere using his own signed-in session, then taps the old confirmation.\n**Scenario (PIN setup):** Mia verifies her code and sets a kiosk PIN. The kiosk asks her to confirm clock-in after a recent clock-out. Her attendance session changes before she confirms.\n**What happens today:** On both paths, the server checks the action and session shown to the worker. It refuses a stale tap with 409 and writes no clock event. For stale PIN setup, the PIN write rolls back and the verification code stays usable. On the phone, Ali sees a reload and is told to start the action again (`pr257:backend/attendance/worker_api.py:164`, `pr257:backend/attendance/kiosk_api.py:708`, `pr257:frontend_mobile/features/parity/attendance.tsx:386`).\n**Recommendation first: KEEP.** Both Ali and Mia act on fresh attendance information after a stale tap.\n- **KEEP (recommended):** Ali starts clock-out again from the refreshed screen. Mia restarts PIN setup and confirms against the current session.\n- **A:** When the intended clock state is already in place, Ali sees “Already clocked out” and Mia can finish setting her PIN without a second clock-in. A different session or action still needs fresh confirmation.\n- **DEFER**\n\n**Note:** The rollout order (ship the mobile build first, then the backend) is a GM-26 release item.\n**Status:** OPEN (owner asked for a re-grill; the ACTIVE.md note \"proposed until #242 merges\" is out of date: #242 merged on 3 Nov)"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Clock in via mobile QR scanner | Web browser app does not implement camera scanner for physical kiosk QR (`frontend_web/src/App.tsx`). | Mobile app opens camera scanner to read kiosk QR token (`frontend_mobile/app/attendance/clock.tsx:3`). | Expo only | Intended: camera QR scanning of the physical on-site kiosk is mobile-native. |\n| Rotating kiosk QR display | Dedicated tablet kiosk web app renders rotating dynamic QR code (`frontend_web/src/pages/attendance/KioskPage.tsx:95`). | Mobile app provides pairing status and link screen for kiosk hardware (`frontend_mobile/app/attendance/kiosk-status.tsx:3`). | No | Parity question: the kiosk display terminal is web-only (`KioskPage.tsx`), while mobile manages pairing and diagnostics. |\n| PIN clock in/out | Kiosk terminal provides numeric keypad for PIN attendance (`frontend_web/src/pages/attendance/KioskPage.tsx:722`). | Worker configures attendance PIN in dedicated mobile settings screen (`frontend_mobile/app/attendance-pin.tsx:11`). | No | Intended: terminal handles physical PIN entry while mobile allows worker PIN configuration. |\n| Breaks recording | Kiosk terminal logs break start and break return events (`frontend_web/src/pages/attendance/KioskBreakDialog.tsx:65`). | Mobile parity screen tracks break events during shift attendance (`frontend_mobile/features/parity/attendance.tsx:27`). | Yes | — |\n| Manager provisional attendance review | Manager audits unrostered and suspicious clock-ins (`frontend_web/src/pages/attendance/KioskEvidenceReview.tsx:41`). | Manager reviews attendance exceptions on mobile (`frontend_mobile/app/attendance/exceptions/[id].tsx:3`). | Yes | — |\n| Attendance corrections | Attendance tracking logs manual time adjustments (`frontend_web/src/pages/attendance/ManagerAttendanceReviewPage.tsx:246`). | Manager submits manual attendance correction request (`frontend_mobile/app/attendance/corrections/new.tsx:3`). | Yes | — |", "file": "areas/GM-08-attendance-kiosk.md"}, {"key": "GM-09", "row": "6", "title": "GM-09 Timesheet/payroll", "qs": [{"id": "Q1", "area": "GM-09", "plat": "Web + Expo", "md": "### Q1 — Who pays whom, and when? (payment ownership — ASK FIRST, see §4)\n- **Plain English:** When a locum finishes a shift, who actually sends the worker their pay — ChemistTasker, or the pharmacy directly? And when — same day, weekly, fortnightly? What does the platform take, and from whom?\n- **ACTUAL TODAY:** **Nobody pays anybody in the traced code.** Timesheets carry minutes only (no money fields); the lock produces a manifest that is explicitly a \"future payroll/integration boundary\" with \"no payroll execution\"; there is no pay run, no payout rail, no export. The fee schedule ($30/shift filled, $80/job, $30/mo owner subscription, 50% off fees) describes platform fees only; it does not state the wage rail. The `use_chemisttasker_payroll` toggle exists, but when it is off the UI says timesheets \"can be handed to the pharmacy's own payroll system\" — and there is no export to hand them over with. `BILLING_LIVE_SHIFT_FULFILLMENT_ENABLED` defaults False.\n- **RECOMMENDED (unchanged from provisional):** Decide this before any other GM-09 question — every later answer (approval, export, ABN/TFN, disputes) depends on it. Severity: **launch-gating**.\n- **ALTERNATIVE A — Pharmacy pays worker directly; platform charges its fee separately:** Pharmacy and worker settle wages off-platform (or via platform invoice as a pass-through record only). *Scenario:* a Saturday locum shift at $70/hr × 8 hrs = $560 wages pharmacy→worker; ChemistTasker charges the pharmacy $30 (or $15 on subscription). *Trade-offs:* simplest legally (platform is a marketplace, not employer/payer); but the platform cannot guarantee the worker gets paid, cannot enforce approval deadlines, and disputes become \"he said / she said\" with no money held. **This is the closest to what the code supports today** — the platform already computes the minutes and freezes them; the money moves elsewhere.\n- **ALTERNATIVE B — Platform collects from pharmacy, then pays worker (platform as payer/escrow):** Pharmacy funds the shift (card / invoice) at confirmation; platform releases pay to the worker after approved timesheet. *Scenario:* same $560 shift; pharmacy pre-authorised at booking; worker paid Tuesday after Monday approval. *Trade-offs:* worker trust and dispute leverage are much stronger; but the platform holds other people's money (trust-account / AFSL / tax / reconciliation duties), needs payout rails, and bears failed-payment and refund complexity. **Nothing in the traced code supports this today** — it is a build, not a switch.\n- **ALTERNATIVE C — Platform invoices pharmacy for wages + fee as one bill, worker paid by pharmacy on platform-generated payroll instruction:** Hybrid: platform computes and instructs, pharmacy executes. *Scenario:* platform issues a single $590 invoice; pharmacy pays worker $560 and platform $30 in one settlement run. *Trade-offs:* one bill is tidy for the pharmacy; but if the pharmacy pays late, the worker still waits and the platform has no lever. **Also a build** — the manifest exists, but there is no invoice generation from it in the traced code (GM-17).\n- **Other / defer:** Deferring = launch without a stated payer. That is not a neutral option: workers will assume the platform pays them and pharmacies will assume the opposite. Record as deferred only with an explicit launch risk accepted by the owner.\n- **Checks:** normal case (approved timesheet → payment — today there is no payment to trigger), edge (partial hours, no-show, late approval), retry/concurrency (double-pay on double-submit — no pay path to double), denied role / wrong tenant (pharmacy A approving pharmacy B's timesheet — approve requires `require_manage_pharmacy` for that pharmacy), payment/notification side effects (none exist), Web vs Expo difference (no pay status is shown on either client — time only)."}, {"id": "Q2", "area": "GM-09", "plat": "Web + Expo", "md": "### Q2 — How is a timesheet created, and from what source of truth?\n- **Plain English:** After a shift, does the timesheet appear automatically from clock-in/out (GM-08 kiosk/attendance), from the booked shift times, or does someone type the hours in by hand?\n- **ACTUAL TODAY:** Auto-built from roster + attendance + leave (`timesheet_builder.py`); one Timesheet per worker per TimesheetPeriod. Segments WORK/LEAVE/BREAK. A new TimesheetRevision is created when the source fingerprint changes; APPROVED/SUBMITTED timesheets rebuilt → REOPENED. Leave minutes count only overlap with published roster. A worker with attendance but no membership still gets a row. **Nobody types hours in by hand** — there is no manual hours entry in the traced code; corrections happen at the attendance source (append-only missing punch) or via check decisions.\n- **RECOMMENDED:** Keep auto-generation from attendance where it exists; booked times as fallback is NOT what the code does — the code uses roster + attendance + leave, and a rostered shift with no attendance is a BLOCKER, not a fallback. Confirm that as the rule, and add a manual-entry path only with an audit note if the owner wants one. Severity: HIGH.\n- **ALTERNATIVE A — Keep current logic:** auto-built from roster + attendance + leave; ROSTER_WITHOUT_ATTENDANCE blocks approval. *Scenario:* kiosk offline, worker did work, no attendance — timesheet sits NEEDS_REVIEW until a manager appends the missing punch with a reason. Trade-off: accurate; slow when the kiosk fails.\n- **ALTERNATIVE B — Booked times are the timesheet; attendance is advisory only:** *Scenario:* locum booked 9–5, stayed till 5:30, kiosk shows 5:32 — paid to 5:00 unless pharmacy approves extra. Simple, predictable; risks underpaying real overtime and discouraging staying late. **This is NOT current logic** — it would be a change to the builder.\n- **ALTERNATIVE C — Worker-entered hours, pharmacy-confirmed:** *Scenario:* worker submits 9:00–5:30 in Expo on the drive home; pharmacy taps approve. Flexible; risks inflated hours and slow approvals. **This is NOT current logic** — no manual entry exists.\n- **Other / defer:** —\n- **Checks:** normal/edge (no clock-out — open session counts to now; kiosk offline — BLOCKER; shift overruns midnight — segments handle it; split breaks — unmatched break = WARNING), retry/concurrency (rebuild is fingerprint-gated; double generation creates a revision, not a duplicate), denied role/wrong tenant (period create/recalculate are manager-only), notification side effects (none), Web vs Expo difference (manager page traced on web; Expo screen contents NOT read)."}, {"id": "Q3", "area": "GM-09", "plat": "Web + Expo", "md": "### Q3 — Who approves a timesheet, by when, and what happens if nobody does?\n- **Plain English:** Does the pharmacy have to tap \"approve\" before anyone gets paid, and is there a deadline after which hours are auto-approved — or can a timesheet sit forever?\n- **ACTUAL TODAY:** The pharmacy (manager, `require_manage_pharmacy`) must approve each timesheet; the worker submits their own first (SUBMITTED). **There is no deadline, no auto-approval, and no escalation.** A timesheet can sit in OPEN / NEEDS_REVIEW / READY / SUBMITTED forever. Approval is blocked by open BLOCKER checks or a stale revision. There is no reject state — the only \"no\" is reopening it or resolving/waiving checks with a reason. **No notification is sent on submit, approve, or reopen** — nobody is told a timesheet is waiting.\n- **RECOMMENDED:** Named approver per pharmacy + a fixed approval window (e.g. 48 hours) after which the timesheet auto-approves with notice, so workers are never left unpaid by silence. Severity: HIGH (cash-flow trust) — and note the dependency: auto-approval only matters once Q1 creates a payment that approval gates.\n- **ALTERNATIVE A — Keep current logic:** manual approval, no deadline, no auto-approval, no notifications. *Scenario:* pharmacy owner on leave, locum waits 10 days with no notice to anyone. Trade-off: protects pharmacies from paying wrong hours; destroys worker trust and creates support load.\n- **ALTERNATIVE B — No auto-approval; unpaid until a human approves:** Same as A in practice (A already has no auto-approval); the difference is stating it as policy with a named approver and a visible \"waiting\" state. *Scenario:* same as A, but the worker can see who is holding it up.\n- **ALTERNATIVE C — Auto-approve at the booked hours only; extra hours need approval:** *Scenario:* 9–5 booked auto-pays; the extra 30 min waits for approval. Middle ground; needs clear split in the UI — and a pay figure, which does not exist yet (Q5).\n- **Other / defer:** —\n- **Checks:** approver on leave / role change, pharmacy with several branches (which approver?), concurrent approve + correct (revision-must-match guards it), wrong-tenant approval attempt (denied by `require_manage_pharmacy`), reminders/notifications (none exist — a reminder would be new build), Web vs Expo difference (approve UI traced on web detail drawer path only; Expo NOT read)."}, {"id": "Q4", "area": "GM-09", "plat": "Web + Expo", "md": "### Q4 — How are corrections handled before and after approval?\n- **Plain English:** If the hours are wrong, who can fix them, when, and does the worker get told? What if the mistake is found after the money has already gone out?\n- **ACTUAL TODAY:** Before lock: manager reopens with a reason (→ REOPENED); rebuild creates a new revision when the fingerprint changes; check decisions resolve/waive/reopen with a reason — but MISSING_CLOCK_IN / MISSING_CLOCK_OUT / UNRESOLVED_PROVISIONAL_ATTENDANCE **cannot be waived** and must be corrected at the attendance source (append-only missing punch, manager-only, reason required, future times refused, within period ±1 day). After lock: `correct_locked_period` (reason required) returns the period to OPEN; re-lock creates an adjustment manifest naming superseded content; the locked record is kept for audit. **Nobody is notified at any step.** After payment: there is no payment, so no post-payment correction path exists. The `TimesheetCorrectionRequest` model (worker-raised correction requests) exists but has **no API endpoint — unreachable** (CG-09-01).\n- **RECOMMENDED:** Keep the append-only + reason-required + adjustment-manifest shape; wire up the correction-request model (or delete it) so workers can raise corrections in-app; notify both sides on every correction; post-payment corrections become a credit/debit on the next run, never a silent edit — once Q1 creates a payment. Severity: HIGH (audit + Fair Work record-keeping).\n- **ALTERNATIVE A — Keep current logic:** manager-only corrections, reason required, append-only, adjustment manifest on re-lock, no notifications, correction-request model unreachable. *Scenario:* worker flags 30 min missing by comment; manager appends the missing punch with a reason. Trade-off: auditable; slow and invisible to the worker (no notification).\n- **ALTERNATIVE B — Only the pharmacy can correct, worker can only dispute:** *Scenario:* worker raises a correction request (once wired); pharmacy edits or rejects with a reason. Clean audit; slow if the pharmacy is unresponsive.\n- **ALTERNATIVE C — Either side can correct before approval; after approval only admin can:** *Scenario:* typo fixed freely on day one; after payday only platform admin can adjust. Flexible early, controlled late; needs an admin path that exists (it does not today).\n- **Other / defer:** —\n- **Checks:** correction during a dispute, correction after export to payroll (no export exists), concurrent corrections by both sides (revision-must-match guards approve; attendance ordering guards punches), denied role, notification side effects (none), Web vs Expo difference (correction UI traced on web only)."}, {"id": "Q6", "area": "GM-09", "plat": "Web + Expo", "md": "### Q6 — What does the payroll export contain, and where does it go?\n- **Plain English:** Can a pharmacy (or the platform) download the week's timesheets as a file for their payroll system — and in what format, with whose details in it?\n- **ACTUAL TODAY:** **No export exists.** No CSV export endpoint, no payroll export endpoint in `workforce/urls.py`; no export/download button on the manager timesheet page; no CSV/Xero/MYOB code anywhere in `workforce/views.py`. The lock manifest exists (`payroll_export` for PAYROLL assignments, invoice list for INVOICE, audit snapshot only for TIMESHEET_ONLY) but the manifest is a \"future payroll/integration boundary\" — nothing consumes it. The only way to get hours out of the system today is to read them off the screen. (PR #249 commit `d15304b0` \"fail-closed selected-pharmacy shift and payroll filters\" is a lead, not a finding — the commit itself was not read.)\n- **RECOMMENDED:** CSV export as the minimum (one row per worker per shift, with hours, rate, premiums, totals, ABN/TFN status flag), scoped to the pharmacy's own data only; accounting integrations deferred until Q1 is decided. Severity: MEDIUM-HIGH.\n- **ALTERNATIVE A — Keep current logic:** no export; hours are read off the screen. *Scenario:* a pharmacy with 12 locums re-types a fortnight of hours into MYOB by hand. Trade-off: zero build; error-prone, unscalable, and the `use_chemisttasker_payroll` toggle's promise (\"handed to the pharmacy's own payroll system\") cannot be kept.\n- **ALTERNATIVE B — No export; payroll is done entirely inside ChemistTasker:** *Scenario:* pharmacy approves in-app and the platform pays (ties to Q1-B). Cleanest for the user; biggest build and compliance load.\n- **ALTERNATIVE C — Export plus Xero/MYOB integration:** *Scenario:* approved timesheets push straight into Xero pay runs. Best for larger groups (e.g. Chempro); integration cost and credential handling.\n- **Other / defer:** —\n- **Checks:** export of unapproved timesheets (lock requires ALL approved — the manifest is the natural export boundary), re-export after correction (adjustment manifest exists), wrong-tenant export (pharmacy A exporting pharmacy B's staff — the period is per-pharmacy; access control to be enforced), PII in the file, Web vs Expo difference (export on mobile? — no export anywhere today)."}, {"id": "Q7", "area": "GM-09", "plat": "Web + Expo", "md": "### Q7 — ABN and TFN: what is collected, from whom, and how is it stored?\n- **Plain English:** Does a locum need to give an ABN (contractor) or a TFN (employee), and where does that sensitive number live — and who can see it?\n- **ACTUAL TODAY:** Collected/checked at offer acceptance, not in the timesheet flow (`engagement.py`): ABN path RAISES if ABN missing/unverified/entity-unconfirmed — ABN workers ARE blocked at accept. TFN path does NOT block — readiness computed, `payroll_ready=False` → settlement TIMESHEET_ONLY, \"TFN/super setup may be completed after shift acceptance\". `validate_tfn_payroll_profile` requires TFN + super fund name/USI/member number. `worker_payment_profile_status` returns a safe summary with no secret identifiers. **Storage/encryption/visibility of the TFN/ABN values themselves was NOT traced in this area** (GM-26 privacy; GM-02 onboarding). The timesheet shows no ABN/TFN status flag.\n- **RECOMMENDED:** Collect the minimum the chosen payment/employment model needs, validate format at entry, store encrypted with strict role access (worker + their pharmacy's payroll approver + admin only), never in exports by default, and get qualified tax advice before launch. Severity: **launch-gating** (privacy + tax).\n- **ALTERNATIVE A — Keep current logic:** ABN blocked at accept; TFN deferred; no status flag on the timesheet. *Scenario:* a TFN worker is booked, works, and only learns at payroll time that their super details were never completed. Trade-off: fastest booking; payroll stalls later.\n- **ALTERNATIVE B — ABN-only, all locums treated as contractors:** *Scenario:* worker supplies ABN, invoices via the platform, no TFN, no PAYG. Simple; wrong if the working arrangement is really employment (sham-contracting risk, GM-14).\n- **ALTERNATIVE C — TFN declaration for employed locums, ABN for genuine contractors, model chosen per engagement:** *Scenario:* regular weekly locum on TFN/PAYG; one-off cover on ABN. Matches reality; doubles the payroll paths and the advice needed.\n- **Other / defer:** —\n- **Checks:** worker with neither ABN nor TFN (ABN path raises; TFN path defers — asymmetric, see Q4/GM-12-Q04), expired/invalid ABN, TFN visible to the wrong pharmacy, data breach / retention, Web vs Expo difference (pay-readiness is not surfaced on either client today).\n- **Decide jointly with GM-09-Q01 (payer model), GM-14 (employment status) and GM-26 (privacy/retention).**"}, {"id": "Q8", "area": "GM-09", "plat": "Web + Expo", "md": "### Q8 — How does a worker or pharmacy dispute hours or pay, and who decides?\n\n> **Also covers (22 Nov):** GM15-33 (GM-15). Asked once, here.\n- **Plain English:** If the worker says \"I worked 8 hours, you paid 7\", what button do they press, who looks at it, and how long until there is an answer — and does payment pause while it is argued?\n- **ACTUAL TODAY:** **There is no dispute flow.** No dispute state, no dispute endpoint, no resolver role, no timeline, no payment hold (there is no payment to hold). What exists: comments on a timesheet (`add_comment`, worker_visible), check decisions (resolve/waive/reopen + reason), reopen (reason required), correct-locked-period (reason required), and the attendance evidence (raw sessions kept for audit; rejected provisionals excluded from payable time). The `TimesheetCorrectionRequest` model (worker-raised correction requests with manager response) exists but is **unreachable via API**. Links to GM-15 (cancellation/disputes/ratings).\n- **RECOMMENDED:** In-app dispute on the timesheet itself (not email/chat), with the attendance record attached automatically, a named resolver (pharmacy first, platform admin on escalation), a stated response time, and disputed amounts held while undisputed amounts still pay — once Q1 creates a payment to hold. Severity: HIGH.\n- **ALTERNATIVE A — Keep current logic:** comments + check decisions + reopen; no formal dispute. *Scenario:* worker comments \"I stayed 30 min late\"; manager resolves the DURATION_DIFFERS check or appends a missing punch. Trade-off: auditable pieces exist; no deadline, no escalation, no hold, and ratings (GM-15) become the only leverage.\n- **ALTERNATIVE B — Dispute = chat message to the pharmacy, no formal state:** *Scenario:* worker messages \"I stayed late\"; pharmacy replies in Hub chat. Fast to build; no record, no deadline, no escalation, and ratings (GM-15) become the only leverage.\n- **ALTERNATIVE C — Formal dispute with payment held in full until resolved:** *Scenario:* $560 held while 30 min ($35) is argued. Strong leverage for the worker; punishes the worker for the undisputed $525 and invites tactical disputes. (Only meaningful once Q1-B/C creates a payment.)\n- **Other / defer:** —\n- **Checks:** dispute after payment (no payment exists; post-payment correction would be a credit/debit — Q4), dispute by a pharmacy against a worker (no-show / early departure — see Q10), concurrent dispute + correction, retaliation via ratings (GM-15), notification side effects (none exist), Web vs Expo difference (comments exist on web; Expo NOT read)."}, {"id": "Q9", "area": "GM-09", "plat": "Web + Expo", "md": "### Q9 — What records are kept, for how long, and who can see a worker's pay history?\n- **Plain English:** Can a worker see every shift they have ever been paid for, can a pharmacy see only its own staff, and how long does the platform keep these records?\n- **ACTUAL TODAY:** Workers see their own timesheets via My Hours (`MyHoursView`: own timesheets, latest 100, filterable by pharmacy/period — web `MyHoursPage.tsx`, Expo `app/my-hours.tsx`, contents NOT read). Pharmacies see only their own periods (periods are per-pharmacy; approve requires `require_manage_pharmacy`). **There is no pay history to see** — timesheets show minutes, not money. Retention: no retention/deletion rule was traced in the timesheet code (GM-26 territory). The locked manifest + adjustment manifests are kept for audit (correct-locked-period keeps the superseded record). Admin access / audit logging of reads was not traced.\n- **RECOMMENDED:** Worker sees their own full history; pharmacy sees only its own shifts; admin sees all with audit logging; retain per Australian record-keeping requirements (seek qualified advice; do not guess a number here). Severity: MEDIUM-HIGH.\n- **ALTERNATIVE A — Keep current logic:** worker sees own minutes (latest 100); pharmacy sees own periods; manifest kept for audit; no retention rule stated. *Scenario:* a worker needs last year's shifts for tax — the screen shows minutes, not pay, and only the latest 100 rows. Trade-off: works for the current fortnight; useless as a pay record.\n- **ALTERNATIVE B — Pharmacy sees only current pay period; history is admin-only:** *Scenario:* owner cannot pull last quarter without asking support. Reduces exposure; creates support load and hurts multi-branch reconciliation.\n- **ALTERNATIVE C — Full history for both sides, exportable:** *Scenario:* worker downloads their year's shifts for tax. Most useful; highest PII exposure if access control fails. (Needs Q6 export + Q1 payment first.)\n- **Other / defer:** —\n- **Checks:** worker who worked at two pharmacies (separation — periods are per-pharmacy; My Hours filters by pharmacy), ex-employee access, deleted account, Web vs Expo difference (My Hours exists on both; contents NOT read on either).\n- **Decide jointly with GM-14/GM-26 (record-keeping law, retention).**"}, {"id": "Q10", "area": "GM-09", "plat": "Web + Expo", "md": "### Q10 — What happens on the failure paths: no-show, early departure, shift cancelled mid-way, kiosk offline?\n- **Plain English:** If the worker never turns up, leaves early, or the kiosk was down so there is no clock-out — is there still a timesheet, and is anything paid?\n- **ACTUAL TODAY:** Every booked shift produces a timesheet state — including \"no attendance recorded\" — because a Timesheet row is created per worker per period and ROSTER_WITHOUT_ATTENDANCE is a BLOCKER, not an absence. Concretely: **no-show** → rostered shift with no attendance session → BLOCKER, timesheet cannot be approved until the attendance is corrected at source (or the roster is corrected). **Early departure** → FINISH_DIFFERS_FROM_ROSTER (WARNING) / DURATION_DIFFERS (WARNING); approval can proceed with the warning resolved/waived. **Kiosk offline / no clock-out** → open session counts worked minutes up to `min(now, period end)` with `open_session: true` (inflates, does not block); or MISSING_CLOCK_OUT (BLOCKER, unwaivable — must be corrected at source). **Shift cancelled mid-way** → no cancelled state in the timesheet code (GM-15 territory). **Nothing is paid on any path** — there is no payment (Q1).\n- **RECOMMENDED:** Keep \"every booked shift produces a timesheet state — including 'no attendance recorded' — so nothing silently vanishes; $0 timesheets for no-shows are explicit and visible, not absent.\" Add the missing pieces: a no-show flag (not just a blocker), and a rule for open sessions (cap at rostered end, not \"now\"). Severity: MEDIUM-HIGH.\n- **ALTERNATIVE A — Keep current logic:** BLOCKER for no attendance; WARNING for early finish; open session counts to now. *Scenario:* kiosk offline, worker did work, timesheet blocked until a manager appends the missing punch with a reason. Trade-off: accurate; the worker waits and the manager does the work.\n- **ALTERNATIVE B — No attendance, no timesheet:** *Scenario:* kiosk offline, worker did work, nothing to approve, worker must chase by chat. Simplest code; worst outcome for the worker. **This is NOT current logic.**\n- **ALTERNATIVE C — Booked hours paid unless the pharmacy flags non-attendance within 24 hours:** *Scenario:* kiosk down, worker paid booked hours, pharmacy can dispute. Protects the worker; risks paying no-shows if the pharmacy is slow. (Only meaningful once Q1 creates a payment.)\n- **Other / defer:** —\n- **Checks:** partial attendance, duplicate clock-outs (attendance ordering guards), timezone/DST (untraced — GM-10-Q05), retry after offline sync (recalculate rebuilds from attendance received; UI copy mentions syncing offline kiosks), denied role, notification side effects (none), Web vs Expo difference (failure states shown on web cards as blocking/warning pills; Expo NOT read).\n- **Links:** GM-08 (attendance source of truth), GM-15 (cancellation).\n\n---"}, {"id": "GM-09-OD-07", "area": "GM-09", "plat": "Web + Expo", "md": "### GM-09-OD-07: A worker's correction request notifies the managers (OD-07, D163/D173)\n**Platforms:** Web + Expo\n**What happens today:** A worker's comment on a timesheet is a correction request. Nobody was told, while the worker saw \"Request sent to the timesheet reviewer\". Now the managers who can act on that timesheet get a notice, and the author is never notified of their own comment.\n**Already implemented:** commit 7855bbd8, `backend/workforce/timesheet_transitions.py:146`\n**Recommendation:** Keep.\n**Other option:** No notice (managers find requests themselves).\n**Status:** OPEN, confirm or change."}, {"id": "GM-09-OD-08", "area": "GM-09", "plat": "Web + Expo", "md": "### GM-09-OD-08: May a removed worker still raise a correction on a past timesheet? (OD-08, D181 (five-user run A6))\n**Platforms:** Web + Expo\n**What happens today:** Yes today: Ali, already removed, could still comment on his own past timesheet, and the managers are notified.\n**Code:** today's behaviour, `backend/workforce/timesheet_transitions.py:128`\n**Recommendation:** Keep it allowed, for wage disputes after someone leaves.\n**Other option:** Block it after removal (disputes go to support).\n**Status:** OPEN, confirm or change."}, {"id": "GM-09-W01", "area": "GM-09", "plat": "Web + Expo", "md": "### GM-09-W01: Re-grill: overnight deferred payroll activation into a locked period (W-13, register item 7)\n**Scenario:** Omar works Friday 22:00 to Saturday 06:00 with TFN/super details deferred. Tom locks the period that covers Saturday. Omar finishes his details, then Tom asks the app to activate payroll for the shift.\n**What happens today:** An authorised manager starts activation. The server checks both work dates. A locked finishing date refuses activation and rolls back the offer and assignment writes (`pr257:backend/shifts/offers.py:566`, `:582`, `pr257:backend/shifts/payroll.py`). Separate cover and later assignment writes are outside this check (release register item 7).\n**Recommendation first: KEEP.** The locked period stays intact. Tom handles the correction.\n- **KEEP (recommended):** Tom sees the refusal and decides how to correct payroll.\n- **A:** Tom can activate payroll and put Omar's hours in the next open period automatically.\n- **DEFER**\n\n**Status:** OPEN (re-grill requested by the owner)"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Fortnightly timesheet period generation | Manager opens new fortnightly period and inspects timesheet summaries (`frontend_web/src/features/workforce/TimesheetsPage.tsx:292`). | Manager creates current fortnight period from workforce timesheets screen (`frontend_mobile/app/workforce-timesheets.tsx:500`). | Yes | — |\n| Recalculate timesheets from attendance | Recalculate rebuilds timesheets from attendance sessions and approved leave (`frontend_web/src/features/workforce/TimesheetsPage.tsx:218`). | Recalculate button updates timesheets and prompts to sync offline kiosks (`frontend_mobile/app/workforce-timesheets.tsx:367`). | Yes | — |\n| Worker reviews and submits hours | Worker reviews worked hours and breaks in My Hours page (`frontend_web/src/features/workforce/MyHoursPage.tsx:20`). | Worker inspects daily entries and submits timesheet in mobile app (`frontend_mobile/app/my-hours.tsx:129`). | Yes | — |\n| Manager resolves timesheet checks | Detail drawer reviews blocking checks and records resolutions (`frontend_web/src/features/workforce/TimesheetDetailDrawer.tsx:59`). | Detail screen inspects blocking checks and allows manager decisions (`frontend_mobile/roles/shared/timesheets/TimesheetDetailScreen.tsx:40`). | Yes | — |\n| Timesheet time adjustments | Manager adjusts timesheet segment times with adjustment dialog (`frontend_web/src/features/workforce/TimesheetAdjustTimesDialog.tsx:85`). | Manager adjusts timesheet hours with mobile adjustment bottom sheet (`frontend_mobile/roles/shared/timesheets/TimesheetAdjustTimesSheet.tsx:28`). | Yes | — |\n| Period lock and payroll handoff | Manager locks approved timesheet period to finalize payroll (`frontend_web/src/features/workforce/TimesheetsPage.tsx:227`). | Manager locks period or reopens locked period for corrections (`frontend_mobile/app/workforce-timesheets.tsx:300`). | Yes | — |\n| ChemistTasker payroll toggle | Pharmacy settings toggles ChemistTasker payroll vs external processing (`frontend_web/src/pages/dashboard/sidebar/owner/PharmacySettings.tsx:54`). | Workforce settings toggles ChemistTasker payroll routing (`frontend_mobile/app/workforce-settings.tsx:302`). | Yes | — |", "file": "areas/GM-09-timesheet-payroll.md"}, {"key": "GM-14", "row": "7", "title": "GM-14 Terms/Award/GST/super", "qs": [{"id": "GM14-Q01", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q01 — Who ever decides whether super is payable for an ABN contractor — and what happens until they do? (new, from verified code)\n\n**Plain English:** every ABN shift's terms say \"invoice settlement does not by itself remove super obligations — the pharmacy must review whether super is payable for a labour-only contractor.\" But nothing ever records the answer: the terms always say `super_payable_confirmed: False`, nobody is assigned to review it, and the worker still gets paid by invoice either way. The owner needs to decide who makes that call and whether anything waits for it.\n**ACTUAL TODAY — Web and Expo (same backend):** the notice is shown at accept; `super_review_required: True` and `super_payable_confirmed: False` are frozen into every ABN terms snapshot; no field, endpoint, or workflow ever changes them; settlement proceeds by invoice regardless.\n**Normal case:** labour-only locum on ABN, pharmacy never reviews, invoice paid, super question never answered. **Edge case:** the worker is later found to be owed super (ATO: labour-only contractors can be owed super) — no record exists of who reviewed it or when. **Payment/notification:** none — no reminder, no flag, no payroll hold. **Web/Expo difference:** none — the gap is backend-wide.\n**RECOMMENDED:** B — support/finance reviews before the **first** ABN payout to a worker (one review per worker, recorded with date + reviewer), and the review outcome is stored on the terms/worker record; later ABN shifts reuse it unless the relationship changes. Severity: high (super is a legal obligation, not a preference; getting it wrong is a Fair Work/ATO problem). Benefit: a real answer exists before money moves. Risk: a review queue to build and staff; first payouts slow down.\n**ALTERNATIVE A — Keep current logic:** notice only; the pharmacy is told to review and nobody checks. Trade-off: zero build; the obligation stays entirely on the pharmacy with no evidence anyone looked.\n**ALTERNATIVE B — Pharmacy attests at accept:** the pharmacy ticks \"I have reviewed super for this worker\" when posting/accepting, logged with time. Trade-off: an answer exists per shift, but it is self-attestation with no verification.\n**ALTERNATIVE C — Treat ABN as super-payable by default:** pay super unless the pharmacy records an exemption reason. Trade-off: safest for the worker, most expensive, and needs a super payment path that does not exist today.\n**Other (describe) / Defer:** deferring keeps A by default — say so explicitly, do not let it drift.\n**Sources:** `backend/shifts/engagement.py:727-734` (ABN terms), `backend/shifts/engagement.py:199` (profile status).\n**Decision status:** OPEN."}, {"id": "GM14-Q04", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q04 — How is employee vs contractor status decided? (carried AG-Q04)\n\n**Plain English:** the pharmacy picks \"TFN employee\" or \"ABN contractor\" per shift, and the worker must match. The terms themselves warn that an ABN label does not decide status and that the record is not legal advice. There is no test of the real relationship — so a mislabelled contractor is a sham-contracting risk.\n**ACTUAL TODAY — Web and Expo (same backend):** per-shift `payment_preference`; mismatch blocks accept (400); ABN path requires a separate contractor-status confirmation tick; notices as quoted in F01/F02.\n**RECOMMENDED:** B — relationship test first: assess the real relationship (control, integration, tools, risk) before the label sticks; ABN never decides alone. Severity: high (sham contracting). Benefit: the label follows the facts. Risk: a test to build + someone must apply it; slows posting.\n**ALTERNATIVE A — Keep current logic:** pharmacy chooses ABN or TFN. **ALTERNATIVE B — Both parties attest:** still risks choosing the wrong legal status.\n**Other / Defer:** get legal advice before launch either way (this question and Q01/Q11 both need it — they can share one advice).\n**Sources:** `backend/shifts/engagement.py:629-640` (preference match), `:747` (contractor confirmation).\n**Decision status:** OPEN."}, {"id": "GM14-Q06", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q06 — Should both sides get a PDF copy of the agreement? (carried AG-Q03)\n\n> **Also covers (22 Nov):** GM22-15 (GM-22). Asked once, here.\n\n**Plain English:** today nobody gets a copy of what was agreed — the acceptance emails go out, but the terms themselves are only in the database. Both sides should be able to prove what they agreed to.\n**ACTUAL TODAY — Web and Expo (same):** no PDF, no downloadable copy, no terms attachment on the acceptance emails.\n**RECOMMENDED:** A — emailed PDF once confirmed, also downloadable in the app. Severity: medium. Benefit: disputes have a document; Relief Buddy / LocumCo do this. Risk: PDF generation + storage to build.\n**ALTERNATIVE A — In-app view only:** less to build; no durable copy outside the app.\n**Other / Defer.**\n**Sources:** `backend/shifts/offers.py:accept` (notification templates `shift_accept.html`, `owner_worker_confirmed.html`).\n**Decision status:** OPEN."}, {"id": "GM14-Q07", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q07 — Which changes after booking need the worker's new consent? (carried AG-Q05 / SH-08 — NOT RE-VALIDATED)\n\n**Plain English:** the old grill said managers can still change rate, role, payment type, description and travel after acceptance, with only slots locked — so the shift card and the frozen terms can disagree. That claim was not re-checked against current code in this trace.\n**ACTUAL TODAY:** NOT RE-VALIDATED (Oct 2026 evidence only). Slot locking after engagement is verified in the accept/finalise path; the edit endpoints were not read.\n**RECOMMENDED (carried from #184, rec A):** rate, date, times, role, site, travel need new consent; notes/parking are notice-only. Severity: high if the Oct claim is true (cards disagreeing with frozen terms). Do not decide until re-traced.\n**ALTERNATIVE A — Keep current logic:** edits allowed with a notice only. **ALTERNATIVE B — Rate and date only.**\n**Other / Defer.**\n**Sources:** #184 Oct 2026 (SH-08); re-trace `backend/shifts/` edit endpoints before deciding.\n**Decision status:** OPEN — **NOT RE-VALIDATED**."}, {"id": "GM14-Q08", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q08 — Until the worker answers a change, which terms apply? (carried AG-Q06 — NOT RE-VALIDATED)\n\n**Plain English:** if there is no change-request flow, nobody can tell which terms apply after an edit — the card shows new values, the frozen terms keep the old ones.\n**ACTUAL TODAY:** NOT RE-VALIDATED. No change-request flow was found in the traced files (consistent with Oct \"not built\"), but the edit endpoints were not read.\n**RECOMMENDED (carried, rec A):** old terms stay; new terms apply only after consent. **ALTERNATIVE A — Keep current logic. ALTERNATIVE B — New terms apply; worker can decline afterwards.**\n**Other / Defer.**\n**Decision status:** OPEN — **NOT RE-VALIDATED**."}, {"id": "GM14-Q09", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q09 — If the worker rejects the change, what happens? (carried AG-Q07 — NOT RE-VALIDATED)\n\n**Plain English:** no rule exists in the traced files for a worker rejecting a change.\n**ACTUAL TODAY:** NOT RE-VALIDATED (Oct: \"not built\").\n**RECOMMENDED (carried, rec A):** keep old terms, or pharmacy cancels (counts as pharmacy-initiated; owner fee bands apply). **ALTERNATIVE B — Mutual cancel, no fee.**\n**Other / Defer.**\n**Decision status:** OPEN — **NOT RE-VALIDATED**."}, {"id": "GM14-Q10", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q10 — Until re-consent is built, lock key fields after the first acceptance? (carried AG-Q08 / SH-08 — NOT RE-VALIDATED)\n\n**Plain English:** locking rate, role, payment and travel after the first acceptance is the smallest safe step until re-consent exists — but whether those fields are currently editable was not re-checked.\n**ACTUAL TODAY:** NOT RE-VALIDATED (slot lock verified; the rest not re-traced).\n**RECOMMENDED (carried, rec A):** lock rate, role, payment, travel; to change them, cancel and repost. **ALTERNATIVE A — Keep current logic. ALTERNATIVE B — Allow, with re-consent (needs Q07 built first).**\n**Other / Defer.**\n**Decision status:** OPEN — **NOT RE-VALIDATED**."}, {"id": "GM14-Q12", "area": "GM-14", "plat": "Web + Expo", "md": "### GM14-Q12 — (new) Who updates the Award rates, and when? (from verified code)\n\n**Plain English:** the Award rates in the code are hard-coded dollar amounts published by Fair Work for 1 July 2026. There is no update mechanism, no expiry, and no Fair Work sync — so after the next Fair Work update, the code will quietly enforce the old rates.\n**ACTUAL TODAY — Web and Expo (same backend):** `award_rates.py` stores Schedule B dollar amounts \"ppc 01Jul26\"; nothing checks their age.\n**RECOMMENDED:** A named owner + a calendar reminder each July (and on any Fair Work update): update the schedule, record the source + date, and confirm frozen snapshots are unaffected (they are — snapshots freeze the old values by design). Severity: medium-high (underpaying against the Award is a Fair Work breach; the frozen snapshot protects history but not new terms). Benefit: rates stay right.\n**ALTERNATIVE A — Keep current logic:** hard-coded rates, updated when someone remembers.\n**ALTERNATIVE B — Fetch from Fair Work at runtime:** no stable API exists for this — do not build it without a source.\n**Other / Defer.**\n**Sources:** `backend/workforce/award_rates.py:19-21`.\n**Decision status:** OPEN."}, {"id": "GM-14-W01", "area": "GM-14", "plat": "Web + Expo", "md": "### GM-14-W01: Re-grill: the cover-terms dialog went stale (409 TERMS_CHANGED) (W-13, register item 3)\n**Scenario:** Ali is asked to cover Mia's Thursday shift and opens the cover terms. Tom changes the terms. Ali taps \"Accept\" on the old ones.\n**What happens today (merged in PR #242, live on main and pr257):** the server refuses with `TERMS_CHANGED` and writes nothing (`main:backend/attendance/cover_terms.py:214`, `pr257:backend/attendance/cover_terms.py:214`). Web and phone throw away the stale preview, reload the current terms and make Ali agree to both agreements again. If the reload fails he gets a retry, never the stale acceptance. **Separate gap:** for outside shift offers, deployed main checks the acceptance flags but doesn't compare the terms version; pr257 does (`pr257:backend/shifts/offers.py:386`). That is backlog BL-21, not part of this question.\n**Already answered:** D2, terms are accepted only as shown (carried decision). This re-grill asks only about the reload experience.\n**Recommendation first: KEEP.** Ali only ever agrees to terms he has seen.\n- **KEEP (recommended):** reload and ask again.\n- **A:** reload and highlight what changed (the rate) before she agrees again (small UX addition).\n- **DEFER**\n\n**Status:** OPEN (re-grill requested by the owner)"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| TFN casual terms presentation | Dialog renders Award code MA000012, classification, and superannuation notice (`frontend_web/src/pages/dashboard/sidebar/ShiftsBoard/components/ShiftEngagementTermsDialog.tsx:35`). | Dialog renders Award details, classification, and superannuation notice (`frontend_mobile/roles/shared/shifts/ShiftsBoard/components/ShiftEngagementTermsDialog.tsx:28`). | Yes | - |\n| ABN contractor terms presentation | Dialog presents contractor terms requiring separate contractor checkbox confirmation (`frontend_web/src/pages/dashboard/sidebar/ShiftsBoard/components/ShiftEngagementTermsDialog.tsx:45`). | Dialog presents contractor terms requiring contractor confirmation (`frontend_mobile/roles/shared/shifts/ShiftsBoard/components/ShiftEngagementTermsDialog.tsx:40`). | Yes | - |\n| Terms version snapshot & freeze | Sends `termsVersion` with acceptance to prevent stale review drift (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:468`). | Sends `termsVersion` with acceptance to prevent stale review drift (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:356`). | Yes | - |\n| Award floor enforcement | Displays locked rate ensuring rate cannot fall below statutory minima (`frontend_web/src/pages/dashboard/sidebar/ShiftsBoard/components/ShiftEngagementTermsDialog.tsx:94`). | Displays locked rate ensuring rate cannot fall below statutory minima (`frontend_mobile/roles/shared/shifts/ShiftsBoard/components/ShiftEngagementTermsDialog.tsx:123`). | Yes | - |\n| Payment profile readiness | Incomplete payment details trigger navigation to profile settings (`frontend_web/src/pages/attendance/WorkerAttendancePage.tsx:66`). | Incomplete payment details trigger `openPaymentProfile` callback (`frontend_mobile/features/parity/attendance.tsx:296`). | Yes | - |", "file": "areas/GM-14-terms-award-gst-super.md"}, {"key": "GM-17", "row": "7", "title": "GM-17 Invoices/refunds", "qs": [{"id": "GM17-Q01", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q01 — FIRST QUESTION (ask this first)\n**When a pharmacy cancels a paid booking, does it get its booking fee back — cash refund, platform credit, or nothing?**\n- **Actual today:** Nothing happens automatically. There is no refund or credit engine; the fee stays with the platform unless someone refunds it manually in Stripe, and the app has no button, approver or record for that (`billing/urls.py` has no refund route; `payment_events.handle_charge_refunded` only reconciles Stripe-initiated refunds). The cancellation penalty path (`charge_penalty`, 10%/20%) is a separate charge *to* the pharmacy, not a refund.\n- **Recommended:** **C — Refund over 72h, credit inside 72h** (same as #184 CX-Q19 rec). It matches the existing 72h penalty boundary, keeps value with the pharmacy either way, and avoids cash leaving the platform for late cancellations. Severity: **launch-gating** — the live-collection guard doc makes \"owner recovery/cancellation decisions\" a precondition for enabling live fulfilment collection, so this answer unblocks real payments. Risk if undecided: support refunds money ad hoc in Stripe with no record, or pharmacies dispute charges.\n- **Alternative A — Keep current logic:** No refund, no credit; fee kept always. Simple, but pharmacies pay for shifts they cancelled in good time; expect disputes and chargebacks. Edge: pharmacy cancels 3 weeks out, worker rebooks instantly — platform still keeps $30.\n- **Alternative B — Credit always, never cash:** Money never leaves the platform; good for cash flow, but a pharmacy that never rebooks loses $30/$80 and has no remedy. Edge: pharmacy closes down — credit is worthless.\n- **Alternative C — Refund over 72h, credit inside 72h (recommended above).**\n- **Alternative D — Full cash refund whenever the pharmacy cancels before the worker is out of pocket:** Most generous; simplest to explain; platform eats the Stripe fee on every refund.\n- **Other / defer:** Describe, or defer — but deferring blocks enabling live fulfilment collection.\n- Normal case: pharmacy cancels 4 days out → refund. Edge: cancels 1h out after worker travelled → credit + penalty may both apply — owner must say whether both can apply. Retry/concurrency: refund requested twice → must be idempotent (no engine exists today). Denied role: only platform finance/support or the paying pharmacy can request; worker cannot trigger a fee refund. Payment side effect: Stripe refund → webhook sets `refunded`/`partially_refunded`. Web/Expo: no UI on either today; same backend either way."}, {"id": "GM17-Q02", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q02 — Worker cancels or no-shows: what happens to the booking fee?\n\n> **Also covers (22 Nov):** GM15-20 (GM-15). Asked once, here.\n- **Actual today:** Not built. No rule, no remedy, no replacement flow tied to the fee (`CX-Q20`, still valid).\n- **Recommended:** **C — Keep the fee only if a replacement actually fulfils the booking; otherwise the pharmacy chooses refund or credit.** Rationale: the pharmacy paid for a filled shift; if the platform refills it, the fee bought something.\n- **A — Pharmacy picks remedy after each failure (refund or credit).** **B — Credit only.** **Other / defer.**\n- Scenarios: locum no-shows at 7am for an 8am shift, replacement found by 9am (fee kept, worker sanctioned separately per P04); no replacement found (pharmacy chooses); worker cancels 5 days out and replacement fills it (fee kept)."}, {"id": "GM17-Q03", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q03 — Who approves refunds and credits, and how fast?\n\n> **Also covers (22 Nov):** GM15-21 (GM-15), GM26-Q21 (GM-26). Asked once, here.\n- **Actual today:** Nobody in-app. Refunds happen in Stripe by whoever has Stripe access; the app only reconciles afterwards. `reconciliation_required` flags need human follow-up with no owner, queue or SLA.\n- **Recommended:** **A — Platform finance/support admin, every case, reason logged, 2-business-day SLA.** Start manual; automate by rule later.\n- **A — Platform admin, every case (recommended).** **B — Automatic by rule, admin for exceptions.** **C — Pharmacy self-serves refund inside a window (e.g. >72h), admin beyond it.** **Other / defer.**\n- Edge: refund requested twice; refund after partial refund; refund for a deleted shift (F15) — who is told, and does the pharmacy get the money or just a flag?"}, {"id": "GM17-Q05", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q05 — How is the worker's cancellation pay paid out?\n\n> **Also covers (22 Nov):** GM15-22 (GM-15). Asked once, here.\n- **Actual today:** No record or payout path. Timesheets route ordinary pay to payroll or invoicing, but cancellation pay has no line.\n- **Recommended:** **A — Same invoice or payroll channel as wages, labelled \"cancellation pay\"** (per #184 CX-Q22 rec). The worker invoices it, or it rides the payroll export — never a platform wage wallet.\n- **A — Same channel, labelled (recommended).** **B — Platform pays the worker directly.** **C — Pharmacy pays off-platform, worker records it as an external invoice.** **Other / defer.**\n- Edge: worker is TFN payroll vs ABN invoice — channel follows the frozen `settlement_channel`; a cancelled shift has no approved timesheet, so what evidence supports the invoice?"}, {"id": "GM17-Q09", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q09 — What should workers see: rate, super, GST, shift total? (PO-Q03)\n- **Actual today:** Workers see the hourly rate; super shows as a chip when selected; no GST line and no whole-shift total (re-checked: no GST/total text in the Post Shift wizard search).\n- **Recommended:** **A — Hourly rate, super and GST shown separately, plus a total for the shift.** Confirm tax treatment before launch (links to Q06).\n- **A — Rate + super + GST + total (recommended).** **B — Keep current logic.** **C — One all-in rate.** **Other / defer.**"}, {"id": "GM17-Q11", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q11 — AHPRA auto-cancellation: fee, refund, notices (ON-P02 + LA-P02)\n\n> **Also covers (22 Nov):** GM15-45 (GM-15), GM22-16 (GM-22). Asked once, here.\n- **Actual today:** Future public bookings are auto-cancelled, pharmacies told, no fee or refund rule runs; the AHPRA path bypasses the cancellation policy entirely (two paths, different outcomes for the same booking).\n- **Recommended:** **Keep auto-cancel, and settle any paid booking fee under Q01/Q02** (refund/credit as if the pharmacy had cancelled in good time — the worker did nothing wrong, the pharmacy did nothing wrong).\n- **A — Keep auto-cancel + settle fee under Q01/Q02 (recommended).** **B — Admin confirms, then cancel (slower; unlawful work risk).** **Other / defer.**\n- Edge: booking already paid and partially worked — worked dates stay, future dates cancel; fee treatment splits by date."}, {"id": "GM17-Q12", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q12 — Worker invoice corrections: credit notes, void, reversals (NEW)\n- **Actual today:** Corrections use new immutable revisions (a sent invoice can be corrected by a new revision; the pharmacy keeps the old published version until the new one is sent). But there is **no credit note, no payment reversal/refund, no void action** (`docs/worker-finance.md`); `voided_at` exists but nothing in the app can set it. A wrongly *paid* invoice cannot be un-paid or credited — only re-issued as a new draft.\n- **Recommended:** **A — Build credit notes first (negative invoice linked to the original, same GST treatment), then a void action for unpaid invoices; payment reversals stay manual with a reason and audit record.**\n- **A — Credit notes + void (recommended).** **B — Revisions only (keep current logic) — overpaid invoices are settled off-platform.** **C — Full refund/reversal workflow in-app.** **Other / defer.**\n- Scenarios: worker overstates hours by 2h, pharmacy already paid; pharmacy pays the wrong invoice; invoice sent to the wrong pharmacy. Each needs a different remedy — a revision cannot fix money already moved."}, {"id": "GM17-Q13", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q13 — Overdue worker invoices: reminders, escalation, late fees? (NEW)\n- **Actual today:** \"Overdue\" is only a red label (sent + past due date, computed in shared-core). No reminders, no escalation, no late fee, no follow-up task. Customers have `payment_terms_days`; nothing enforces them.\n- **Recommended:** **A — Email + in-app reminders at due date +7/+14 days, then a manual follow-up task for the worker; no late fee at launch.**\n- **A — Reminders + manual follow-up (recommended).** **B — Reminders + automatic late fee (needs a rate and disclosure).** **C — Nothing (keep current logic).** **Other / defer.**\n- Edge: pharmacy approved for payment but never pays — is \"approved\" a promise the platform stands behind? (No — the platform does not pay wages; the owner must decide the wording so approval is not read as a guarantee.)"}, {"id": "GM17-Q14", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q14 — Subscription paid by invoice: what if it is never paid? (NEW)\n- **Actual today:** Stripe `send_invoice`, 7 days to pay; local status stays `inactive` until paid. No dunning, suspension or discount-loss rule was found.\n- **Recommended:** **A — Reminder at day 5, subscription stays inactive, booking fees stay at full price; after 30 days the invoice-method request lapses and the owner must start again.**\n- **A — Remind, stay inactive, lapse at 30 days (recommended).** **B — Grace period with subscriber pricing anyway.** **C — Suspend the pharmacy's posting until paid.** **Other / defer.**"}, {"id": "GM17-Q15", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q15 — Reconciliation queue: who works flagged payments? (NEW)\n- **Actual today:** A flag + a notification. No queue, screen, owner or SLA. Reasons: `paid_work_unavailable`, `locked_payroll_period`, `deleted_shift`, binding errors.\n- **Recommended:** **A — Platform support owns the queue; every flagged payment gets a decision (refund / replay / manual fix) within 2 business days, recorded against the payment.**\n- **A — Support-owned queue + SLA (recommended).** **B — Auto-refund everything flagged (fast, but wrong for locked-payroll cases that should be replayed).** **C — Leave to the pharmacy (keep current logic).** **Other / defer.**"}, {"id": "GM17-Q18", "area": "GM-17", "plat": "Web + Expo", "md": "### GM17-Q18 — Invoice numbering, tax-invoice wording and duplicate protection (NEW)\n- **Actual today:** Worker invoices are numbered `INV-000123` (sequential by PK); PDFs render from the stored payload; payments are idempotent by `request_key`; duplicates create a fresh draft with no links. Super contribution requests are explicitly not tax invoices. Whether a worker service invoice counts as a compliant *tax invoice* (ABN, GST, \"tax invoice\" wording) was not verified against the PDF template (`backend/templates/invoices/invoice_pdf.html`, `worker_finance/templates/.../invoice.html`) in this trace.\n- **Recommended:** **A — Owner + accountant confirm the worker invoice PDF is a compliant tax invoice when the issuer is GST-registered (and states clearly when it is not); keep `INV-` numbering; keep `request_key` idempotency.**\n- **A — Confirm compliance, keep numbering (recommended).** **B — Add \"tax invoice\" wording + ABN/GST checks before send.** **C — Leave as-is.** **Other / defer.**\n\n---"}, {"id": "GM-17-OD-12", "area": "GM-17", "plat": "Web + Expo", "md": "### GM-17-OD-12: Organisation Invoices are on Expo but not in web's organisation menu (OD-12, decisions-for-owner 5)\n**Platforms:** Web + Expo\n**What happens today:** Expo keeps an Invoices entry for organisations. Web's organisation menu has none. We never drop features, so I kept it on Expo.\n**Already implemented:** pr257\n**Recommendation:** Keep it on Expo and add the same link to web's organisation menu later.\n**Other option:** Remove it from Expo to match web.\n**Status:** OPEN, confirm or change."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Fulfillment fee checkout redirect | Dispatches `chargeShiftFulfillment` and redirects to Stripe Checkout (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:30`). | Dispatches `chargeShiftFulfillment` opening Stripe session on mobile (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:228`). | Yes | - |\n| Free mode finalisation | PRE_LIVE / FREE_TRIAL finalises booking with zero charge (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:33`). | Free billing mode finalises booking with zero charge (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:232`). | Yes | - |\n| Worker invoices list | Renders list of worker invoices with status and date filters (`frontend_web/src/pages/dashboard/sidebar/Invoices/InvoiceManagePage.tsx:8`). | Renders invoice list grouped by status (`frontend_mobile/roles/shared/invoices/InvoiceList.tsx:68`). | Yes | - |\n| Worker invoice details & generation | Inspects invoice line items and triggers PDF generation (`frontend_web/src/pages/dashboard/sidebar/InvoiceDetailPage.tsx:37`). | Displays invoice details and allows line item edits (`frontend_mobile/roles/shared/invoices/InvoiceDetail.tsx:91`). | Yes | - |\n| Subscription payment by invoice | Allows selecting invoice billing for subscriptions (`frontend_web/src/pages/dashboard/sidebar/owner/OwnerBillingPage.tsx:85`). | Expo manages extra seats only; it has no option to pay the subscription by invoice (`frontend_mobile/roles/owner/subscription-seats.tsx:29`). | No | Corrected 22 Nov (orchestrator review): invoice billing is web-only. Covered by GM-16-W02 (subscription and seats web-only for launch). |\n| Checkout reconciliation & conflict queue | Displays conflict dialog when previous checkout state is unresolved (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftPaymentActions.ts:5`). | Displays alert when checkout attempt is in conflict (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:246`). | Yes | - |", "file": "areas/GM-17-invoices-refunds.md"}, {"key": "GM-15", "row": "8", "title": "GM-15 Cancellation/disputes", "qs": [{"id": "GM15-01", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-01 — CX-Q01 · What cancellation can launch, given fees are not yet enforceable? [STILL VALID]\n- **Actual today:** Nothing. No cancel endpoint, no cancelled state, no button on Vite/Next/Expo (F1/F2). Delete is 409-blocked once anyone is engaged (`deletion.py`). The roster release path refuses booked work (`_guard_booked`).\n- **Recommended (High — launch-blocker): B** — Build owner cancel + manager-reviewed worker cancel-request with reason, audit and notices, with any fee *shown but not charged* until LA-R02 legal review passes. Launching with zero cancel path means week-one cancellations go to manual DB edits, exactly as SH-01 warned.\n- **A — Support-only cancel, no fees:** Admin action with reason + audit. Slow, but shippable fastest and keeps money out of it. Risk: support becomes the bottleneck; no self-serve near start time.\n- **B — Owner cancel + worker request (recommended):** Owner cancels directly; worker requests, manager approves (R04D), notices to both sides. Risk: needs the approval window (Q05) and reopen rule (Q15) decided first.\n- **C — Hold launch until fees enforceable:** Delays launch indefinitely; fees need legal review first. Risk: no revenue while a non-money cancel could ship.\n- **Other / defer:** describe.\n- **Edge cases:** cancel before/after acceptance, before/after payment, <2h to start, recurring multi-date (D05: one date / selected / whole posting), concurrent cancel + payment, wrong tenant/role denied (403), payment in flight."}, {"id": "GM15-04", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-04 — CX-Q04 · At exactly 72h / 24h / 12h / 2h, which band applies? [CHANGED]\n- **Actual today (changed):** The Oct \"preview-only fee calculator\" (`shifts/cancellation_policy.py`) **does not exist** at this head. The only live computation is `charge_penalty`: ≤24h = 20%, 24–72h = 10%, >72h = 0 — and its boundary behaviour is timezone-dependent (proven: same instant gives different amounts under UTC vs Brisbane, `test_cancellation_policy_evidence.py`). The P09 7-band table is not implemented anywhere.\n- **Recommended (High):** Do not \"keep\" anything — decide the bands fresh against the P09 table (0/0/10/15/20/25/30%) and fix the timezone to the pharmacy's local time with the milder band at exact boundaries. This question must be re-asked, not carried: the old KEEP option referred to code that is gone.\n- **A — Milder band at exact boundaries, pharmacy local time (recommended, once P09 is implemented). B — Stricter band (exactly 24h = 15%).**\n- **Other / defer.**"}, {"id": "GM15-05", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-05 — CX-Q05 · How much notice counts as \"enough window\" for a normal manager approval? [STILL VALID]\n- **Actual today:** No window exists. R04/R04D are decisions only; `WorkerShiftRequest` has no urgency field.\n- **Recommended: A — 72h or more** (matches where owner fees start, P08). **B — 24h+. C — 7 days+** (most requests become emergencies).\n- **Other / defer.**"}, {"id": "GM15-06", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-06 — CX-Q06 · Inside the window, who is alerted and how fast? [STILL VALID]\n\n> **Also covers (22 Nov):** GM22-07 (GM-22). Asked once, here.\n- **Actual today:** No emergency escalation exists. Roster emails go once to owner/admins; nothing repeats, nothing escalates to support.\n- **Recommended: B** — Manager + owner push every 15 min, plus platform support after 30 min (support chases, does not approve).\n- **A — Manager + owner push every 15 min. C — Manager only.**\n- **Other / defer.**"}, {"id": "GM15-07", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-07 — CX-Q07 · If no manager answers before start and the worker doesn't come, what is it? [STILL VALID]\n- **Actual today:** No classification. Worker stays assigned (R04D); then the shift ages into history with no record that they asked.\n- **Recommended: A — Late cancel, not a no-show** (request is evidence; platform reviews).\n- **B — No-show** (ignores that they asked in time).\n- **Other / defer.**"}, {"id": "GM15-08", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-08 — CX-Q08 · How is a mutually agreed cancellation proven and approved? [STILL VALID]\n- **Actual today:** No two-party consent, no waiver record. P11 exempts mutual cancels, but nothing records one.\n- **Recommended: A — Both tap \"agree\" in app**, logged with time; waiver applies automatically.\n- **B — Manager says so. C — Support reviews every one.**\n- **Other / defer.**"}, {"id": "GM15-09", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-09 — CX-Q09 · What evidence may support an illness or emergency exemption? [STILL VALID]\n- **Actual today:** No evidence intake, retention or restricted review exists anywhere.\n- **Recommended: A — Reason first; evidence only if disputed**, minimum necessary, support-only, destroyed/de-identified when no longer needed (health data is sensitive).\n- **B — Evidence within 48h for every claim. C — No evidence ever.**\n- **Other / defer.**"}, {"id": "GM15-10", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-10 — CX-Q10 · Can a pharmacy emergency (closure, outage) waive the owner fee? [STILL VALID]\n- **Actual today:** No waiver process exists. P11 owner exemptions are undefined.\n- **Recommended: A — Yes, support waives with evidence; worker is told the reason.**\n- **B — Never; fee always applies.**\n- **Other / defer.**"}, {"id": "GM15-13", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-13 — CX-Q13 · How is a no-show confirmed? [STILL VALID]\n- **Actual today:** No review queue. Managers only report (P04); the platform decides (P10) — but there is no one and nowhere to decide.\n- **Recommended: A — Report, worker replies in 48h, platform decides** (both sides heard).\n- **B — Platform decides on the report alone.**\n- **Other / defer.**"}, {"id": "GM15-14", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-14 — CX-Q14 · If a worker cancels several dates of one booking, how many incidents is that? [STILL VALID]\n- **Actual today:** No incident ledger, so nothing to count. (D05 allows one-date / selected / whole-posting cancels.)\n- **Recommended: A — One incident per cancel action** (a series counts once; avoids a 10-day block exhausting the ladder).\n- **B — One per affected date.**\n- **Other / defer.**"}, {"id": "GM15-15", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-15 — CX-Q15 · After a confirmed booking is cancelled, how does the shift reopen? [STILL VALID]\n- **Actual today:** No reopen-after-cancel exists. The closest analogues: D03 expiry reopens to the same audience; roster release reuses the same shift and escalates to LOCUM_CASUAL (`worker_actions.py:398-408`).\n- **Recommended: A — Same shift; notify favourites first**, then current audience per owner flags.\n- **B — Same audience, no extra notice (matches D03). C — Manager decides each time.**\n- **Other / defer.**"}, {"id": "GM15-16", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-16 — CX-Q16 · Can the manager release a no-show's slot and repost straight away? [STILL VALID]\n- **Actual today:** No no-show release exists. The roster release exists only for non-booked work and refuses booked work.\n- **Recommended: A — Yes, once the no-show line passes** (Q11); incident review continues separately.\n- **B — Only after platform review** (too slow on the day).\n- **Other / defer.**"}, {"id": "GM15-17", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-17 — CX-Q17 · If a worker's cancelled shift is filled by a replacement, what happens to the incident? [STILL VALID]\n- **Actual today:** No incident mitigation rule; no incident exists to mitigate. P12 says \"depends on who cancelled and time left\" — undecided detail.\n- **Recommended: B — No incident if replaced 24h+ out**; inside 24h it still counts.\n- **A — No incident if replaced at any time. C — Always counts.**\n- **Other / defer.**"}, {"id": "GM15-18", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-18 — CX-Q18 · If the pharmacy cancels but offers the worker equal replacement work, is the fee waived? [STILL VALID]\n- **Actual today:** No waiver exists. P12 applies to pharmacy cancels too — undecided.\n- **Recommended: A — Waived if worker accepts it** (equal pay, same day; worker must accept, pharmacy cannot impose a substitute).\n- **B — Fee still applies.**\n- **Other / defer.**"}, {"id": "GM15-19", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-19 — CX-Q19 · When the pharmacy cancels a paid booking, what happens to the booking fee? [STILL VALID]\n- **Actual today:** No refund/credit engine. `charge_penalty` only opens a checkout; it refunds nothing. F01 keeps booking fee / refund / worker pay separate (decided, not built).\n- **Recommended: C — Refund over 72h, credit inside** (pharmacy keeps value either way).\n- **A — Refund over 72h, none inside. B — Credit always, never cash.**\n- **Other / defer.**"}, {"id": "GM15-23", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-23 — CX-Q23 · Who reviews disputes and appeals? [STILL VALID]\n\n> **Also covers (22 Nov):** GM26-Q22 (GM-26). Asked once, here.\n- **Actual today:** No dispute or appeal workflow. Only the platform may sanction (P04, decided) — but there is no reviewer, no queue, no case. (Partial related build: `RatingReport` lets a ratee report a *rating*; that is not a cancellation/hours dispute and has no review queue.)\n- **Recommended: A — Support reviews; a second person hears the appeal** (appeal never goes to the first reviewer).\n- **B — One reviewer does both.**\n- **Other / defer.**"}, {"id": "GM15-24", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-24 — CX-Q24 · How long to appeal, and how fast must support answer? [STILL VALID]\n\n> **Also covers (22 Nov):** GM26-Q23 (GM-26). Asked once, here.\n- **Actual today:** No clocks exist.\n- **Recommended: A — 14 days to appeal; answer in 5 (first review in 2 business days).**\n- **B — 30 days to appeal; answer in 10.**\n- **Other / defer.**"}, {"id": "GM15-25", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-25 — CX-Q25 · Who can see each part of a dispute? [STILL VALID]\n\n> **Also covers (22 Nov):** GM26-Q24 (GM-26). Asked once, here.\n- **Actual today:** No dispute case, evidence classes or access policy exist.\n- **Recommended: A — Summary to both sides; support alone sees sensitive evidence** (medical, identity, third-party).\n- **B — Everything to both sides. C — Platform only.**\n- **Other / defer.**"}, {"id": "GM15-26", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-26 — CX-Q26 · Which events count as an incident? [STILL VALID]\n\n> **Also covers (22 Nov):** GM26-Q26 (GM-26). Asked once, here.\n- **Actual today:** No reviewed incident ledger, no qualifying cutoff. P10 says every non-exempt qualifying cancel/no-show counts after platform review — \"qualifying\" is undefined.\n- **Recommended: A — No-shows and cancels inside 72h** (matches the owner fee line).\n- **B — Inside 24h. C — Any cancel after confirmation, even weeks ahead.**\n- **Other / defer.**"}, {"id": "GM15-28", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-28 — CX-Q28 · How far back does the ladder count? [STILL VALID]\n- **Actual today:** No lookback or reset. P10 has no window.\n- **Recommended: A — Rolling 12 months** (old incidents drop off; allows rehabilitation).\n- **B — Rolling 6 months. C — Lifetime.**\n- **Other / defer.**"}, {"id": "GM15-29", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-29 — CX-Q29 · When should the reliability badge disappear? [STILL VALID]\n- **Actual today:** No badge exists at all (P10 adds one at incident 3 — not built).\n- **Recommended: B — Below three active incidents** (badge follows the rolling lookback from Q28).\n- **A — After three clear months. C — Permanent.**\n- **Other / defer.**"}, {"id": "GM15-30", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-30 — CX-Q30 · What process applies before permanent suspension? [STILL VALID]\n\n> **Also covers (22 Nov):** GM26-Q25 (GM-26). Asked once, here.\n- **Actual today:** No suspension tooling, no process. P10 requires human review, notice, appeal and legal review — none exists.\n- **Recommended (High — legal): A — Code-compliant process** (reasons, notice, review, response, appeal) under the Digital Labour Platform Deactivation Code.\n- **B — Two reviewers plus legal. C — One platform admin.**\n- **Other / defer.** Note: do not build suspension tooling before this is decided; a one-sided permanent ban is the highest-risk item in this area."}, {"id": "GM15-34", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-34 — CX-R01 · How are early finishes and extra hours paid? [STILL VALID]\n- **Actual today:** Timesheets compare actual vs planned hours and allow manager correction, but no marketplace policy resolves early release, authorised extra hours or minimum payment (Oct description; timesheet-compare half not re-traced at this head — see §8).\n- **Recommended: A — Approved actual hours**; preserve any legal minimum engagement; calculate authorised overtime/penalties; record who requested the early finish/extension.\n- **Keep — Managers approve actual hours without a marketplace rule. B — Scheduled hours only.**\n- **Other / defer.**"}, {"id": "GM15-35", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-35 — CX-Q34 · Who can rate, and when? [CHANGED]\n\n> **Also covers (22 Nov):** GM-24-Q17 (GM-24), GM26-Q27 (GM-26). Asked once, here.\n- **Actual today (changed):** Owners/org-admins/pharmacy-admins can rate assigned workers; workers can rate pharmacies — but now only with a **past-date assignment** at a controlled pharmacy (`ratings/views.py: _has_completed_relationship_*`, `slot_date < today`; 403 otherwise). One editable rating per relationship. `pending` lists unrated eligible relationships. **Still not proof of work:** no timesheet approval, no clock-out, no attendance check — a no-showed worker can still be rated, and can rate the pharmacy. Still relationship-level, not per-shift. Still no internal/marketplace separation (see Q36).\n- **Recommended (High — trust): A — After approved timesheet only.** No rating when no work happened.\n- **Keep (stale — needs rewriting) — \"Allow relationship ratings after any assignment\":** no longer describes the code; the code now requires a past-date assignment. Do not carry the old KEEP text forward. **B — After the shift's end time** (current code, roughly: past date; unworked shifts could still be rated).\n- **Other / defer.**"}, {"id": "GM15-36", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-36 — CX-Q35 · Should ratings from internal roster shifts appear on the public talent board? [STILL VALID]\n\n> **Also covers (22 Nov):** GM-24-Q18 (GM-24). Asked once, here.\n- **Actual today:** Yes, they do. Talent cards average **all** OWNER_TO_WORKER ratings including internal-roster ones (`talent/views/explorer.py:78-82`, `Avg`/`Count` with no source filter); web and mobile show the same aggregate; no internal-vs-marketplace separation.\n- **Recommended: A — No, keep internal private** (employer reviews stay private; marketplace reviews are separate).\n- **Keep — Continue including internal ratings in the talent-card average.**\n- **Other / defer.**"}, {"id": "GM15-37", "area": "GM-15", "plat": "Web + Expo", "md": "### GM15-37 — CX-Q36 · Do cancelled, expired and no-show shifts stay in both sides' history? [STILL VALID]\n\n> **Also covers (22 Nov):** GM26-Q28 (GM-26). Asked once, here.\n- **Actual today:** Both sides have assignment-and-time history. Cancelled/no-show states do not exist; expired unpaid offers without assignments do not appear. **Worse than Oct:** AHPRA-cancelled assignments are *delete
