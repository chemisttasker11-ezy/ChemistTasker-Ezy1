 source is ScrapingBee, so under the default config no fresh lookup runs before any booking. Dedicated offers (the whole talent-board booking path) never trigger the gate at all, because they are forced private. A registration cancelled after the last stored check is not caught.\n- **RECOMMENDED (carried from #184, rec A):** before launch — a fresh check before registered-role bookings (turn on the desktop source plus a fresh check). Rationale: AHPRA calls its public register the authoritative source; a stale flag is the difference between a registered pharmacist and a suspended one standing in a pharmacy. Severity: **P0 (safety / legal)**. Benefit: the booking gate means what it says. Risk: the desktop verifier needs a staging trial (GM-02 ON-P03); a fresh lookup adds latency to booking and a failure mode (register unreachable — must fail closed or open? That is a sub-decision). Legal: patient safety; a booking made on a lapsed registration is the platform's worst outcome.\n- **ALTERNATIVE A — Keep current logic:** saved flag + stored check; no fresh lookup. Scenario: a pharmacist suspended on Monday is booked from the board on Tuesday because the last check was in October. Trade-off: zero build, the gate is theatre.\n- **ALTERNATIVE B — Soon after launch:** within the first month of live use. Scenario: launch with the stale-flag risk, fix while live. Trade-off: ships sooner; the risk window is exactly when the platform is least watched.\n- **ALTERNATIVE C — Not needed:** accept the risk or drop the check. Scenario: the platform states it does not verify registration at booking. Trade-off: honest, but the \"Verified\" badge then means something else entirely — the badge would have to change too.\n- **Other / defer:** fresh check only for first booking with a given pharmacy (not every booking). Defer: not recommended at P0.\n- **Gap type:** decision gap (P0) + code gap (desktop source + fresh-check wiring). Owned jointly with GM-02 (ON-P03 is the same decision — do not ask twice; record once)."}, {"id": "GM-18-Q13", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q13 (ex LA-Q12 / TB-01) — Fix the identity leak before launch?\n\n> **Also covers (22 Nov):** GM01-Q16 (GM-01), GM-24-Q13 (GM-24), GM25-C12 (GM-25), GM26-Q04 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** the leak is live in code: authenticated feed/list/retrieve/`by_profile` return names and user IDs for anonymous posts; only the public feed redacts. Both apps consume the leaking API. This is a **code gap**, not a policy question — anonymous posting is currently bypassed by signing in.\n- **RECOMMENDED (carried from #184, rec A):** before launch — server-side masking and a consent-based reveal (Q01/Q02). Rationale: the fix is the Q01/Q02 decision implemented; shipping the board with a known identity leak ships a false anonymity promise. Severity: **P0**. Benefit: the board can be marketed as anonymous without misleading workers. Risk: the fix touches the serializer the apps depend on — the booking flow needs the author user id today, so it must move to the reference code (Q02) in the same change, or booking breaks. Legal: privacy, as Q01.\n- **ALTERNATIVE A — Keep current logic (no fix):** launch with the leak. Scenario: a worker's anonymous post is identified by a colleague on day one. Trade-off: zero build, reputational and privacy risk from the first post.\n- **ALTERNATIVE B — Soon after launch:** within the first month. Scenario: as A, for a month. Trade-off: ships sooner; the leak is public by then.\n- **ALTERNATIVE C — Not needed:** accept the leak and drop the anonymity claim (rename \"anonymous\" to something honest). Scenario: the board is openly identified; workers who want privacy do not post. Trade-off: honest, but it guts the board's value for workers with a current employer.\n- **Gap type:** **code gap with a timing decision** — the fix itself needs no owner choice (mask server-side), but *when* it ships is the owner's call. Recommended: before the first real booking."}, {"id": "GM-18-Q14", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q14 (ex LA-Q13 / TB-03) — Hidden, stale and lapsed-credential posts: are they really unreadable?\n\n> **Also covers (22 Nov):** GM01-Q17 (GM-01), GM26-Q05 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified, split):** the **bypass half is FIXED** — `get_queryset` now filters through `_visible_posts` on all non-write actions, so moderated (`hidden_at`) and past-date posts are excluded from feed, list and detail. The **lapse half is still missing** — `is_talent_board_visible` checks nothing about Verified/AHPRA status, so a worker whose registration lapses or whose Verified is revoked keeps a visible post. The viewer gate checks the viewer, not the author.\n- **RECOMMENDED (carried from #184, rec A):** before launch — enforce visibility **and** current eligibility consistently (hide on lapse/revocation, re-show on re-verification). Rationale: hidden or newly ineligible candidates remain bookable today; a lapsed pharmacist on the board is the same failure as Q11, one step earlier. Severity: high. Benefit: the board only shows people who can actually be booked. Risk: needs a re-check trigger (on what event does a post hide — a nightly job? an event on revocation? GM-02 has no scheduled re-scan) and a re-show path (a worker who re-verifies must not have to re-post). Legal: safety, as Q11.\n- **ALTERNATIVE A — Keep current logic:** bypass fixed; no lapse re-check. Scenario: a pharmacist's AHPRA lapses in December; her post stays up and owners keep offering. Trade-off: half the fix is already in; the remaining half is the dangerous one.\n- **ALTERNATIVE B — Soon after launch:** within the first month. Scenario: as A, for a month. Trade-off: ships sooner; lapsed posts are live meanwhile.\n- **ALTERNATIVE C — Not needed:** accept that posts outlive eligibility and rely on the booking-time gate (Q11). Scenario: the board shows ineligible people, but booking blocks them. Trade-off: only works if Q11's gate is real — today it is not (dedicated offers bypass it), so this option depends on Q11 being fixed first.\n- **Gap type:** **code gap, half fixed** — the remaining half needs a trigger decision (job vs event) from the owner, then build."}, {"id": "GM-18-Q15", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q15 (ex LA-Q15 / TB-07) — One hiring-role policy: who may request a booking?\n\n> **Also covers (22 Nov):** Q-17 (GM-05), GM-24-Q15 (GM-24), GM25-C14 (GM-25), GM26-Q29 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** three policies, not one. **Web/Next:** fixed 9-role allow-list + admin (`OWNER`, `PHARMACY_ADMIN`, `PHARMACY_OWNER`, `ORG_ADMIN`, `ORG_OWNER`, `ORG_STAFF`, `CHIEF_ADMIN`, `REGION_ADMIN`, `ORGANIZATION`). **Expo:** any role except worker roles (`EXPLORER`, `PHARMACIST`, `OTHER_STAFF`), plus a `canRequestBookingOverride` the owner/org wrappers set to true. **`PHARMACY_MANAGER` can book on mobile and cannot on web.** The backend does not settle it — no hiring-role gate was found in the traced backend slice; whether the shift-creation view enforces one is UNKNOWN. GM-05 Q-17 (talent-board booking-permission parity) is NOT VERIFIED and must wait for this decision, not run in parallel.\n- **RECOMMENDED (carried from #184, rec A):** before launch — set **one backend hiring-role policy** and mirror it in both clients. Rationale: a permission that differs by client is not a permission; a manager who can book on their phone but not their laptop will find the phone path, and the backend cannot stop them. Severity: high. Benefit: one rule, enforced where it cannot be bypassed. Risk: the policy itself needs the PHARMACY_MANAGER call (below) and a home for the rule (shared-core, so all three clients read it — the drift is partly because the rule lives in each client today).\n- **The PHARMACY_MANAGER call (owner must make it):** (i) managers can hire — add `PHARMACY_MANAGER` to the allow-list on web/Next, keep Expo as-is; (ii) managers cannot hire — remove the any-non-worker rule on Expo, add an explicit list. There is no third option that keeps both clients as they are.\n- **ALTERNATIVE A — Keep current logic:** web 9-role list; mobile any-non-worker. Scenario: a pharmacy manager books locums from the Expo app and is blocked on the web board for the same candidate. Trade-off: zero build, a live inconsistency that will be discovered by a user, not by a test.\n- **ALTERNATIVE B — Backend only, clients unchanged:** enforce the policy server-side on dedicated-shift creation; leave the buttons as they are. Scenario: a manager taps \"Request booking\" on mobile, fills the form, and is refused at submit. Trade-off: secure, but a confusing user experience — the button promises what the server refuses.\n- **ALTERNATIVE C — Soon after launch:** within the first month. Scenario: as A, for a month. Trade-off: ships sooner; the drift is live meanwhile.\n- **Other / defer:** put the rule in shared-core (`resolveTalentBookingRole` already lives there — the role list should too) and have all three clients import it. Defer: not recommended — this is a permission, and permissions should not ship inconsistent.\n- **Cases:** normal — owner books; edge — admin user (covered by `isAdminUser` on web; Expo override covers owner/org wrappers, but what about an admin opening the board elsewhere?); a user with two roles (owner + pharmacist — which wins?); wrong tenant — a manager of pharmacy A booking for pharmacy B (no tenant check traced in the booking flow).\n- **Gap type:** decision gap (the policy + the PHARMACY_MANAGER call) + code gap (backend enforcement + dedupe the rule into shared-core). **Check against #257:** it touches Expo post-shift screens and `shared-core/src/domains/shifts/audience.ts` — the role rule may move there."}, {"id": "GM-18-Q16", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-Q16 (ex LA-Q14 / TB-04) — The board downloads every post: fix before launch?\n\n> **Also covers (22 Nov):** GM25-C13 (GM-25), GM26-Q30 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** yes, it downloads everything. Both apps call `loadAllTalentPages` (`page_size: 200`) and filter in the app; the backend has no filter parameters, and `_visible_posts` loops the whole table in Python before pagination. No server-side distance or rate filter exists. This breaks at a few thousand posts.\n- **RECOMMENDED (carried from #184, rec B):** soon after launch — within the first month of live use — **only** for a deliberately small, monitored board; set a measured migration trigger (e.g. post count or p95 feed latency) now. Rationale: at launch volume the full download works; the fix (server-side filtering + pagination discipline) is real work that should not block the first bookings, but it must have a trigger, or \"soon\" becomes \"never\". Severity: medium (scale, not correctness). Benefit: the board survives growth; search becomes server-side (Q04). Risk: the trigger must be monitored — nobody watches it, it will be missed; the Python-loop visibility check must move into the query or the server filter will still scan the table.\n- **ALTERNATIVE A — Keep current logic:** full download, client filtering, no trigger. Scenario: the board grows to 3,000 posts; every open downloads all of them; the feed slows and mobile data usage spikes. Trade-off: zero build, a known cliff.\n- **ALTERNATIVE B — Before launch:** server-side filters + paged feed from day one. Scenario: launch is later, but the board is built to scale. Trade-off: delays launch for a problem launch volume does not have.\n- **ALTERNATIVE C — Not needed:** accept the cliff. Scenario: the board is expected to stay small (a few hundred posts). Trade-off: only honest if the volume assumption is written down and owned.\n- **Gap type:** **code gap with a timing decision** — the fix needs no owner choice on the principle, but *when* and *at what trigger* are the owner's calls."}, {"id": "GM-18-OD-13", "area": "GM-18", "plat": "Web + Expo", "md": "### GM-18-OD-13: Resending a talent pitch never creates a duplicate (OD-13, O1 (7 Nov))\n**Platforms:** Web + Expo\n**What happens today:** A resend within 30 days returns the first result. After 30 days it is refused as expired, never duplicated. Resending a deleted pitch says it was deleted and does not restore it. Old app versions without this protection cannot create public pitches (they need the updated app; there are no such versions in the stores yet).\n**Already implemented:** pr257, `backend/talent/test_pitch_idempotency.py:110`\n**Recommendation:** Keep.\n**Other option:** A shorter or longer window.\n**Status:** OPEN, confirm or change."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Authenticated talent board browsing | Renders talent cards with client-side role and category filters (; Next has migrated copy ) (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/index.tsx:78`). | Renders talent cards with identical filters (`frontend_mobile/roles/shared/talent-board/index.tsx:89`). | Yes | - |\n| Public talent board browsing | Signed-out visitors browse the public talent feed. | Signed-out visitors browse the same public feed at /explore/talent-board; every `explore` route is public (`frontend_mobile/app/explore/talent-board.tsx`, `frontend_mobile/app/_layout.tsx:315-317`). | Yes | Corrected 22 Nov (orchestrator review): the earlier row said Expo needs sign-in; it does not. |\n| Worker creates / edits talent profile | Worker writes pitch and copies availability via pitch dialog (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/index.tsx:360`). | Worker writes pitch and copies availability via pitch modal (`frontend_mobile/roles/shared/talent-board/index.tsx:412`). | Yes | - |\n| Request booking modal / route | Tapping \"Request booking\" opens embedded post-shift modal prefilled with worker (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/index.tsx:264`). | Tapping \"Request booking\" navigates to mobile post-shift screen (`frontend_mobile/roles/shared/talent-board/index.tsx:358`). | Yes | - |\n| Role gating on \"Request booking\" | Restricted to 9 hiring roles; `PHARMACY_MANAGER` is excluded (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/index.tsx:208-226`). | Permits any non-worker role; `PHARMACY_MANAGER` is allowed (`frontend_mobile/roles/shared/talent-board/index.tsx:322-326`). | No | Verified 21 Nov: real drift. Web allows a fixed role list or an admin (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/index.tsx:208-226`); Expo allows any role except Explorer, pharmacist and other staff (`frontend_mobile/roles/shared/talent-board/index.tsx:322-326`). Owner choice: one hiring-role policy (GM-18 Q15, GM-05 Q-17); then align both (BL-24). |\n| Like / react to candidate post | Toggles heart icon to increment/decrement reaction counter (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/index.tsx:288`). | Toggles heart icon on candidate card (`frontend_mobile/roles/shared/talent-board/index.tsx:370`). | Yes | - |\n| Manage availability calendar | Worker configures weekly availability slots on dedicated page (`frontend_web/src/pages/dashboard/sidebar/SetAvailabilityPage.tsx:129`; Next has no availability page). | Worker configures availability on mobile screen (`frontend_mobile/roles/shared/availability/SetAvailabilityScreen.tsx:1285`). | Yes | - |", "file": "areas/GM-18-talent-recruitment.md"}, {"key": "GM-19", "row": "10", "title": "GM-19 Availability/matching", "qs": [{"id": "GM-19-Q01 (ex AV-Q01)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q01 (ex AV-Q01) — How should workers set availability? — ✅ STILL VALID (screens now verified)\n\n> **Also covers (22 Nov):** GM-23-02 (GM-23). Asked once, here.\n- **ACTUAL TODAY (verified):** dated slots and recurring weekdays with time windows / all-day, `recurring_end_date` optional, `notes`, `notify_new_shifts` — on both Vite and Expo, same model. **No unavailable-date / blackout / holiday exception model exists** in the verified model or either screen.\n- **RECOMMENDED (carried from #184, rec A):** keep recurring patterns; add dated blackouts (unavailable dates) that always win over a pattern. Rationale: holidays and outside work cannot currently override a pattern, so workers either delete the pattern or get alerted for shifts they cannot do. Severity: medium. Benefit: fewer false matches, less owner wasted time. Risk: precedence rules must be defined (blackout vs booking vs leave) or three overlapping \"unavailable\" sources will conflict. Legal/financial: none direct; indirectly, fewer no-shows / late cancels.\n- **ALTERNATIVE A — Keep current logic:** dated + recurring only, no exceptions. Scenario: a pharmacist on annual leave in January deletes her Monday pattern, then must rebuild it in February; in the meantime she gets no alerts. Trade-off: zero build, ongoing stale/false matches and re-entry burden.\n- **ALTERNATIVE B — Dated slots only:** retire recurrence; workers retype every week. Scenario: a regular Monday locum re-enters the same slot weekly; drop-off in kept-up availability is likely. Trade-off: simplest matching, highest worker burden.\n- **ALTERNATIVE C / Other:** weekly pattern + blackout + a \"pause all availability\" switch (cf. Q07). Defer: keep current logic until after launch, accept false matches.\n- **Cases:** normal — weekly pattern covers a shift; edge — blackout on a public holiday that falls on a recurring day (precedence must be stated); retry/concurrency — two edits to the same row, last write wins (no versioning seen in verified slice); denied role — another user cannot edit your rows (queryset filter); wrong tenant — n/a, availability is user-global, not per-pharmacy; payment/notification — none; web/Expo — both screens verified, same model; Next — no surface.\n- **Gap type:** decision gap (owner must choose the exception model first); then a build."}, {"id": "GM-19-Q02 (ex AV-Q02)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q02 (ex AV-Q02) — How far can a repeating availability run? — 🔄 CHANGED (Oct claim wrong)\n\n> **Also covers (22 Nov):** GM-23-03 (GM-23). Asked once, here.\n- **ACTUAL TODAY (verified):** open-ended recurrence is allowed by the backend (`recurring_end_date` nullable) **and by both apps** — the end date is optional on Vite and Expo; the payload sends `recurring_end_date: null` when unset, with no \"required\" validation found. The Oct 2026 claim \"apps require an end date\" is **WRONG at head**. Nothing expires a pattern and nobody is prompted to refresh it.\n- **RECOMMENDED (carried, rec B):** open-ended, with a quarterly reconfirm prompt. Rationale: nothing reconfirms old patterns; a prompt preserves the low-effort pattern while fighting staleness. Severity: medium. Benefit: fewer ghost availabilities. Risk: prompt fatigue / ignored nudges; needs a `confirmed_at` field and a notification job (neither exists). Legal/financial: none direct.\n- **ALTERNATIVE A — Keep current logic:** optional end date, no prompt. Scenario: a worker who left pharmacy in 2025 still \"available Mondays\" in 2027 and keeps receiving alerts. Trade-off: zero build, maximum staleness.\n- **ALTERNATIVE B — End date required, max 3 months:** forces a refresh. Scenario: a regular locum re-confirms quarterly; a worker who forgets silently disappears from matching. Trade-off: freshest data, highest burden, risk of silent drop-out.\n- **Other / defer:** 6-month horizon; or reconfirm only when a match email bounces / is ignored.\n- **Cases:** normal — pattern renewed quarterly; edge — pattern with end date in the past still stored (roster logic treats it as inapplicable, but the row persists); retry — n/a; denied role — n/a; web/Expo — both verified, same behaviour.\n- **Gap type:** decision gap (horizon + prompt cadence), then build (field + job + UI)."}, {"id": "GM-19-Q03 (ex AV-Q03)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q03 (ex AV-Q03) — When does availability \"match\" a shift? ★ FIRST QUESTION — see §4\n\n> **Also covers (22 Nov):** GM-23-04 (GM-23). Asked once, here.\n- **ACTUAL TODAY (verified, split — the divergence is now confirmed):** **alerts/dashboard use ANY OVERLAP** (`_availability_matches_slot`: `start <= slot_end and end >= slot_start`, touching endpoints count). **Roster warnings use FULL CONTAINMENT** (`validation.py`: the shift must sit fully inside a declared window, or the row is all-day). The same worker/shift pair can be \"matched\" by email and \"outside availability\" by the roster at the same time.\n- **RECOMMENDED (carried, rec A):** one rule everywhere — the shift must sit fully inside the availability. Rationale: a 9–10 availability matching a 9–17 shift wastes the owner's time and trains workers to ignore alerts. Severity: high (it decides who gets emailed about every shift). Benefit: alerts mean \"can actually cover this\"; aligns with roster warnings. Risk: fewer alerts per shift, especially for part-day availability; owners of long shifts may see a thinner audience. Legal/financial: none direct; indirectly fewer failed bookings.\n- **ALTERNATIVE A — Keep current logic:** divergent rules (any-overlap alerts + full-containment roster warnings). Scenario: worker available 9–10 is emailed a 9–17 shift, applies, is rejected or cannot cover; owner waits. Trade-off: no build, continued noise and mismatched expectations between alerts and roster.\n- **ALTERNATIVE B — Overlap of at least X%:** e.g. availability must cover ≥50% (or ≥4 hours) of the shift. Scenario: worker available 9–13 for a 9–17 shift gets the alert and the owner can negotiate a part-cover; a 9–10 worker does not. Trade-off: needs the threshold chosen and explained; partial-cover negotiation needs a product path (cover/swap, GM-07).\n- **ALTERNATIVE C / Other:** any overlap as a deliberate \"wide net\" and let the owner filter; or match on date only, ignore times. Defer: decide after launch data on alert-to-apply conversion.\n- **Cases:** normal — full-day availability vs full-day shift; edge — availability ends exactly at shift start (touching endpoints: overlap rule says match, containment says no); overnight shift crossing midnight (roster rolls +1 day — alert side: `_availability_matches_slot` compares the raw intervals, overnight handling not traced in this function); retry/concurrency — a shift posted twice could double-notify (engine has no dedupe seen in the traced function — caller not traced, GM-10); denied role — unverified workers receiving alerts they cannot act on (verified: no Verified/AHPRA filter); payment/notification — the alert itself is the side effect; no payment at match time; web/Expo — recommendations come from the same server function on both clients.\n- **Gap type:** decision gap — the owner must pick the single matching rule first; the alert engine must then be changed to it. **No longer blocked on re-fetch — both rules are verified.**"}, {"id": "GM-19-Q04 (ex AV-Q04)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q04 (ex AV-Q04) — Who can see a worker's availability? — ✅ STILL VALID (now fully verified)\n\n> **Also covers (22 Nov):** GM-18-Q24 (GM-18), GM-23-05 (GM-23), GM26-Q17 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** only the worker can read/edit raw availability through the API (own-rows queryset). Pharmacies see at most what was copied into a talent post (`availability_days` snapshot), not a live calendar. No visibility/opt-in field exists on `UserAvailability`. The authenticated talent list exposes the post author's identity unmasked (`author_user_id`, `explorer_user_id`, `explorer_name`) — LA-Q12 still valid.\n- **RECOMMENDED (carried, rec B):** explicit worker opt-in for accepted staff / favourite pharmacies. Rationale: a private calendar (with free-text `notes`) should not be disclosed by relationship alone; OAIC APP 6 (use/disclosure of personal information) supports consent-based disclosure. Severity: medium (privacy). Benefit: owners can invite the right people directly; workers stay in control. Risk: opt-in uptake may be low; needs per-pharmacy scoping UI. Legal: privacy — availability + notes are personal information; disclosure without consent is the risk.\n- **ALTERNATIVE A — Keep current logic:** raw calendar private; posts hold copied dates. Scenario: an owner who wants a regular Monday locum cannot see she is free Mondays unless she posted on the talent board. Trade-off: safest privacy, weakest hiring use.\n- **ALTERNATIVE B — Opt-in talent card:** worker opts in to show availability on the public / employer-visible talent card. Scenario: a locum seeking work advertises \"Mondays and Wednesdays, Gold Coast\" to all employers. Trade-off: widest reach, widest disclosure — needs the anonymous-post rules (GM-18 / TB-02) to agree.\n- **Other / defer:** show availability only after a booking request / chat reply (ties to TB-02 reveal timing). Defer: keep private until after launch.\n- **Cases:** normal — favourite pharmacy sees opted-in calendar; edge — worker opts in then opts out (old copies in talent posts persist — Q12); denied role — competing workers must not see raw calendars (API already enforces); wrong tenant — availability is user-global, so a pharmacy the worker never worked with must not gain access via a stale membership; web/Expo — both screens verified, same API.\n- **Gap type:** decision gap (privacy + opt-in scope), then build."}, {"id": "GM-19-Q05 (ex AV-Q05)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q05 (ex AV-Q05) — Should confirmed bookings block that time automatically? — 🔄 CHANGED (alert side now VERIFIED: they do not)\n\n> **Also covers (22 Nov):** GM-23-06 (GM-23). Asked once, here.\n- **ACTUAL TODAY (verified, split):** **Roster side — blocked:** overlapping assignments are a hard `SHIFT_OVERLAP` error in `worker_issues()`. **Alert side — NOT blocked:** `announce_availability_matches` has **no assignment check** — a worker already booked for those hours is still alerted. It does not delete or amend the `UserAvailability` row. Approved leave is likewise not checked by the alert function (roster blocks it, alerts do not).\n- **RECOMMENDED (carried, rec A):** yes — booked time is unavailable for matching. Rationale: alerting a worker about hours they are already booked for wastes both sides and risks a double-booking attempt. Severity: medium-high. Benefit: alerts stay actionable. Risk: needs the matching engine to consult assignments (and leave, and roster) — a query + test burden; a cancelled booking must restore availability promptly. Financial: fewer failed / double-booked acceptances; no direct fee impact (fees attach at confirmation, GM-13).\n- **ALTERNATIVE A — Keep current logic:** leave declared availability and alerts unchanged when bookings are confirmed; rely on roster conflict checks at placement. Scenario: a locum booked 9–17 Monday keeps receiving Monday 9–17 alerts, applies, and is blocked late. Trade-off: zero build, noisy alerts, late rejections.\n- **ALTERNATIVE B / Other:** suppress alerts only, keep the calendar row visible (no deletion); or mark booked intervals as \"busy\" in the worker's own calendar view without changing matching. Defer: keep current logic until alert volume is measured.\n- **Cases:** normal — booked Monday, no Monday alerts; edge — booking cancelled / shift deleted (availability must reappear — timing matters); overlapping but non-identical intervals (partial overlap — ties to Q03's rule); retry/concurrency — booking confirmed at the same moment a match email is being composed (race — caller not traced, GM-10); denied role — n/a; web/Expo — whether the worker's calendar shows booked time as busy was not traced on either screen.\n- **Gap type:** decision gap for the alert side; the roster side is already built (code exists)."}, {"id": "GM-19-Q06 (ex AV-Q06)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q06 (ex AV-Q06) — When should a talent post stop showing? — ✅ STILL VALID (feeds now verified to call the rule)\n\n> **Also covers (22 Nov):** GM-18-Q23 (GM-18), GM-23-07 (GM-23), GM-24-Q31 (GM-24). Asked once, here.\n- **ACTUAL TODAY (verified):** `is_talent_board_visible()` — hidden → no; full-time application → always yes; dated → until last listed date; undated → forever. **NEW: `get_queryset` now filters through `_visible_posts` for all non-write actions — TB-03 is FIXED at head** (the Oct bypass claim is no longer true). But undated and full-time posts still remain indefinitely unless moderated.\n- **RECOMMENDED (carried, rec A):** hide after 30 days without update, nudge the worker first. Rationale: last-date filtering leaves undated/full-time posts stale forever. Severity: medium. Benefit: the board stops filling with \"ghosts\". Risk: a genuinely available full-time seeker is hidden for not tapping a button; needs a nudge + one-tap renew path (cf. Q07). The 30-day number is a proposed local default, not a competitor standard.\n- **ALTERNATIVE A — Keep current logic:** hide dated posts after last date; retain undated and full-time posts. Scenario: a full-time seeker from 2025 still tops the board in 2027. Trade-off: zero build, stale board.\n- **ALTERNATIVE B — Hide once the last listed date passes (partly true today):** i.e. require dates on every post. Scenario: undated posts are forced to add dates or be hidden. Trade-off: kills the full-time-application use case unless that kind is exempted.\n- **ALTERNATIVE C — Never:** board fills with ghosts (explicitly the cost). Other / defer: 60/90 days instead of 30; hide only from employer search, keep visible to the author.\n- **Cases:** normal — post updated monthly stays visible; edge — post with a single past date plus a full-time flag (which rule wins? `post_kind` check comes first in the verified code — full-time always wins); retry — n/a; denied role — moderation (`hidden_at`) is the only verified takedown; web/Expo — both clients now get the same filtered feed (TB-03 fixed).\n- **Gap type:** decision gap (inactivity window + nudge) — the code gap (TB-03) is fixed."}, {"id": "GM-19-Q07 (ex AV-Q07)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q07 (ex AV-Q07) — Should availability show when it was last confirmed? — ✅ STILL VALID (model verified, no field)\n\n> **Also covers (22 Nov):** GM-23-08 (GM-23). Asked once, here.\n- **ACTUAL TODAY (verified):** not built. There is no freshness signal, no confirmation date, and no one-tap reconfirm; `updated_at` changes on any edit and is not a worker confirmation. No reconfirm action exists in the verified API slice; neither screen shows a freshness display.\n- **RECOMMENDED (carried, rec A):** yes — show \"last confirmed\" plus a weekly one-tap reconfirm; mark stale after 14 days; add a pause option. Rationale: pharmacies cannot tell a live calendar from a forgotten one. Severity: medium. Benefit: trust in matching; pairs with Q02/Q06. Risk: weekly cadence may annoy; 14-day staleness is a proposed number. Needs a new field + endpoint + UI on both clients.\n- **ALTERNATIVE A — No:** pharmacies guess. Scenario: an owner messages three \"available\" workers, two never reply. Trade-off: zero build, continued wasted outreach.\n- **Other / defer:** show `updated_at` as a weak proxy (misleading — an edit is not a confirmation); monthly instead of weekly reconfirm.\n- **Cases:** normal — worker taps reconfirm weekly; edge — worker pauses availability (Q01C) vs stale marking (paused ≠ stale — must be distinct states); retry — double-tap reconfirm must be idempotent; denied role — only the worker can confirm their own calendar; web/Expo — both screens verified, neither shows freshness.\n- **Gap type:** decision gap (cadence + stale threshold + pause semantics), then build."}, {"id": "GM-19-Q08 (ex AV-Q08)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q08 (ex AV-Q08) — Should urgent-shift alerts need a separate opt-in? — ✅ VERIFIED (single flag; no separate urgent consent)\n\n> **Also covers (22 Nov):** GM22-08 (GM-22), GM-23-09 (GM-23), GM-24-Q20 (GM-24), GM26-Q18 (GM-26). Asked once, here.\n- **ACTUAL TODAY (verified):** one \"notify new shifts\" switch per availability row (`notify_new_shifts`, default False) — the only consent in the matching engine and on both screens (\"Notify me when new public shifts match my availability\"). **No separate urgent-shift consent, no urgency-based alert audience, no quiet-hours** in any verified file. Escalation never re-announces, so there is no second \"urgent\" wave at all.\n- **RECOMMENDED (carried, rec KEEP):** keep one matching-shift consent; label urgent messages clearly; add frequency controls only if volume proves necessary. Rationale: urgency does not change the notification purpose. Severity: low. Benefit: no extra settings burden. Risk: urgent alerts at night could annoy — mitigation is labelling + quiet-hours, not a second opt-in.\n- **ALTERNATIVE A — Keep current logic:** same consent for urgent and ordinary shifts (identical to the recommendation here — the \"keep\" option IS the recommendation).\n- **ALTERNATIVE B — Yes, separate urgent opt-in:** for shifts starting within 24h. Scenario: a worker wants ordinary alerts but not 2am urgent pings. Trade-off: finer control, more settings, risk workers miss urgent work they would have taken.\n- **Other / defer:** quiet-hours window instead of a second opt-in.\n- **Cases:** normal — urgent shift alert labelled \"URGENT — starts in 3h\"; edge — shift becomes urgent after posting (escalation / time passing — **verified: no re-announce happens**, so the worker is never told it became urgent); retry — duplicate urgent alerts (no dedupe seen in the traced function; caller not traced); web/Expo — same server flag on both.\n- **Gap type:** decision gap (small). **No longer blocked — the engine is verified.**"}, {"id": "GM-19-Q09 (ex AV-Q09)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q09 (ex AV-Q09) — Should workers set a max distance and minimum rate for alerts? — 🔄 SPLIT (distance verified, rate verified absent)\n\n> **Also covers (22 Nov):** GM-18-Q25 (GM-18), GM22-09 (GM-22), GM-23-10 (GM-23). Asked once, here.\n- **ACTUAL TODAY (verified):** **distance IS enforced in alerts** — `_user_can_travel_to_shift` (open-to-travel requires the pharmacy state in `travel_states`; otherwise haversine distance ≤ `coverage_radius_km`; missing coords/radius → no match). Both screens expose travel/radius (web default 30 km; mobile 5–1000 km + map preview). **Minimum rate is NOT checked** — `announce_availability_matches` has no rate comparison; `UserAvailability` has no rate field. Talent-post radius (`coverage_radius_km` on `ExplorerPost`) is a separate snapshot from the matching prefs.\n- **RECOMMENDED (carried, rec A):** yes — alerts respect both max distance and a minimum rate; search can still widen deliberately. Rationale: a worker 90 minutes away, or below their minimum rate, should not be alerted. Severity: medium. Benefit: fewer irrelevant alerts; owners reach workers who will actually accept. Risk: a minimum-rate field needs a source of truth (onboarding rates vs per-availability rate — the model has neither); too-tight filters thin the audience for hard-to-fill shifts.\n- **ALTERNATIVE A — Keep current logic:** respect existing distance/travel preferences without filtering alerts by minimum rate. Scenario: a $70/hr locum is alerted about a $55/hr shift and declines. Trade-off: zero build, continued mismatched alerts.\n- **ALTERNATIVE B / Other:** distance only, no rate (rate is negotiated per offer — GM-12); or rate only for PLATFORM-tier alerts. Defer: add rate filtering after launch data.\n- **Cases:** normal — alert only within radius and at/above minimum rate; edge — pharmacy just outside radius but offering travel/accommodation (GM-10 travel fields — interplay unverified); shift rate changed after posting (frozen terms vs live card — GM-10 SH-08, unverified here); retry — n/a; web/Expo — both screens verified, same travel form.\n- **Gap type:** decision gap for the rate half (whether rate filters alerts; where the minimum rate lives); the distance half is **built and verified** — no decision needed there. **No longer blocked — `announcements.py` is verified.**"}, {"id": "GM-19-Q10 (NEW)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q10 (NEW) — Should availability validation be added, and what must it reject? — ✅ VERIFIED (no validation)\n\n> **Also covers (22 Nov):** GM-18-Q19 (GM-18), GM-23-17 (GM-23). Asked once, here.\n- **ACTUAL TODAY (verified):** any row is accepted (end ≤ start, past date, weekday out of range, recurring with no days, exact duplicates). Serializer has zero `validate_*` methods; the characterisation tests contain no validation tests. AV-05 CONFIRMED (GM-18 agreed).\n- **RECOMMENDED:** add validation (start < end unless all-day; weekdays 0–6; recurring rows must list days; date not in the past for non-recurring rows; reject exact duplicates). Severity: medium. This is a **code gap** (no owner choice needed on the principle), but the owner should confirm the past-date rule: can a worker backdate availability for record-keeping?\n- **ALTERNATIVE A — Keep current logic:** no validation. Scenario: a worker saves 17:00–09:00 by mistake and is matched (or not matched) unpredictably. Trade-off: zero build, garbage in.\n- **ALTERNATIVE B — Validate as above.** **ALTERNATIVE C — Validate + allow past dates with a warning.** Other / defer.\n- **Gap type:** code gap, with one owner sub-decision (past dates)."}, {"id": "GM-19-Q11 (NEW)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q11 (NEW) — Should a roster availability warning block placement, or stay a warning? — ✅ VERIFIED (warning only)\n- **ACTUAL TODAY (verified, `validation.py`):** warning only, and silent when no availability is declared. A manager can roster a worker outside their declared availability, and a worker who declared nothing is never flagged.\n- **RECOMMENDED:** keep as a warning at launch (blocking would strand managers when a worker simply never filled in availability), but surface it prominently and log it; revisit after launch data.\n- **ALTERNATIVE A — Keep current logic (warning).** **ALTERNATIVE B — Hard error when availability declared and shift outside it.** Scenario: manager tries to roster a Monday-only locum on Saturday and is blocked. Trade-off: protects workers, risks stranding a shift when availability is stale (Q02/Q07). **ALTERNATIVE C — Hard error only for internal roster, warning for cover.** Other / defer.\n- **Gap type:** decision gap."}, {"id": "GM-19-Q12 (NEW)", "area": "GM-19", "plat": "Web + Expo", "md": "### GM-19-Q12 (NEW) — Should the talent-post availability snapshot sync with the calendar? — ✅ VERIFIED (structural; never syncs)\n\n> **Also covers (22 Nov):** GM-18-Q17 (GM-18), GM-23-01 (GM-23), GM25-C15 (GM-25). Asked once, here.\n- **ACTUAL TODAY (verified, model shape + GM-18):** two stores, no link in `models.py`; editing availability does not update any talent post. The copy call-site was not re-traced (GM-18 territory), but the structural fact stands: no sync mechanism exists.\n- **RECOMMENDED:** sync on edit, or show a \"last synced\" stamp and a one-tap \"update my post\" action — owner to choose.\n- **ALTERNATIVE A — Keep current logic (one-time copy).** Scenario: worker changes Mondays to Tuesdays; her post still says Mondays for months. Trade-off: zero build, stale posts. **ALTERNATIVE B — Auto-sync.** **ALTERNATIVE C — Post reads the live calendar instead of a snapshot (ties to Q04).** Other / defer.\n- **Gap type:** decision gap (AV-01 carried)."}, {"id": "GM-19-Q13 (NEW)", "area": "GM-19", "plat": "Web only", "md": "### GM-19-Q13 (NEW) — Next web: does an availability surface exist, and must it match Vite/Expo? — ✅ VERIFIED ABSENT\n- **ACTUAL TODAY (verified by listing):** the migrated-pages directory under `frontend_web/landing_next/migrated/pages/dashboard/sidebar/` contains **only `ShiftsBoard` + `TalentBoard`** — no SetAvailability, no billing, no pills. Next has no availability surface as traced. Whether the live Next site serves these migrated copies is UNKNOWN (GM-25).\n- **RECOMMENDED:** record as a parity gap (GM-25); the owner then decides whether Next needs availability at launch or can defer to Vite/Expo. This is a code/parity gap, not a GM-19 decision, until the owner chooses the Next launch scope.\n- **Gap type:** parity gap (GM-25), not a decision — until located otherwise."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Save dated availability slot | Worker saves dated slot via sidebar form . Next web lacks availability surface (`frontend_web/src/pages/dashboard/sidebar/SetAvailabilityPage.tsx:235`). | Worker saves dated slot with start/end time and travel radius (`frontend_mobile/roles/shared/availability/SetAvailabilityScreen.tsx:490`). | Yes | Parity question: Next web lacks an availability page; Vite web and Expo have matching forms. |\n| Save recurring pattern | Worker configures recurring weekdays with optional end date (`frontend_web/src/pages/dashboard/sidebar/SetAvailabilityPage.tsx:368`). | Worker configures recurring weekdays with optional end date (`frontend_mobile/roles/shared/availability/SetAvailabilityScreen.tsx:495`). | Yes | |\n| Edit / delete availability slot | Worker updates or removes slot with immediate preview update (`frontend_web/src/pages/dashboard/sidebar/SetAvailabilityPage.tsx:387`). | Worker updates or deletes slot via optimistic mutation (`frontend_mobile/roles/shared/availability/SetAvailabilityScreen.tsx:265`). | Yes | |\n| Matching shift notification toggle | Worker sets a travel radius (default 30 km) with availability (`frontend_web/src/pages/dashboard/sidebar/SetAvailabilityPage.tsx:271`, `:326`). | Same radius setting, plus a map preview of the circle (`frontend_mobile/roles/shared/availability/SetAvailabilityScreen.tsx:223`). | Yes | Corrected 22 Nov (orchestrator review): web has the radius too; only the map preview is Expo-only (display, intended). |\n| Shift match alerts on posting | Backend alerts workers with any-overlap availability at shift posting (`backend/shifts/announcements.py:461`). | Push and in-app alerts dispatched from matching engine without client filtering (`backend/shifts/announcements.py:461`). | Yes | |\n| Dashboard availability recommendations | Overlap matching endpoint feeds recommended shifts (`backend/shifts/announcements.py:211`). | Mobile dashboard fetches matching shifts from recommendations API (`frontend_mobile/roles/shared/availability/availabilityModel.ts:68`). | Yes | |\n| Roster placement availability warning | Roster displays non-blocking warning when shift is outside full containment (`backend/workforce/roster/validation.py:70`). | Manager roster surfaces non-blocking conflict warning from validation API (`backend/workforce/roster/validation.py:70`). | Yes | |\n| Talent board availability snapshot | Worker publishes talent post with copied availability snapshot that never auto-syncs (`frontend_web/src/pages/dashboard/sidebar/TalentBoard/index.tsx:86`). | Post displays snapshot decoupled from live calendar rows (`frontend_mobile/roles/shared/talent-board/index.tsx:63`). | Yes | |", "file": "areas/GM-19-availability-matching.md"}, {"key": "GM-24", "row": "10", "title": "GM-24 Explorer/public", "qs": [{"id": "GM-24-Q21", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q21 — NEW: Should anonymous visitors see every role on the public job board?\n- **Status:** NEW (no #184 equivalent).\n- **ACTUAL TODAY:** Yes — `PublicJobBoardView` has no role gating, so a logged-out visitor sees Pharmacist, Intern, Assistant, Technician, Student, and EXPLORER-role shifts with full rates. A signed-in Explorer sees only EXPLORER-role shifts (`/public-shifts/`). So signing in *narrows* what you can see. Both role filters (Vite + Expo) also omit an Explorer option, so nobody can filter to Explorer-role shifts.\n- **RECOMMENDED: Keep anonymous broad, but add the Explorer role to the filter and show a signed-in hint.** Anonymous breadth is the SEO funnel; the oddity is the signed-in narrowing, which follows from Q01. Severity: low-medium.\n- **ALTERNATIVE A — Keep current logic.**\n- **ALTERNATIVE B — Gate the anonymous board by role too (visitors pick a role first).** Trade-off: kills casual browsing/SEO.\n- **ALTERNATIVE C — Show all roles to signed-in users as well (role filter becomes a filter, not a wall).** Then apply-time gates do the enforcement.\n- **Other / Defer:** ___"}, {"id": "GM-24-Q22", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q22 — NEW: The Explorer Community tab is always empty — hide it or open community to Explorers?\n- **Status:** NEW.\n- **ACTUAL TODAY:** Both clients show Explorers a Community Shifts tab/section, but the backend only returns shifts to accepted members; Explorers have no membership path, so the tab is permanently empty with no explanation. The Explorer dashboard also loads community shifts that never arrive.\n- **RECOMMENDED: Hide the Community tab for Explorers until/unless community access is a real feature.** An empty tab with no message reads as broken. Severity: medium (UX/trust).\n- **ALTERNATIVE A — Keep current logic (show the empty tab).**\n- **ALTERNATIVE B — (recommended, above).**\n- **ALTERNATIVE C — Open community browsing to Explorers (read-only; apply still gated).** Scenario: a newcomer sees how their local pharmacy rosters cover — useful, but exposes internal staffing to outsiders.\n- **Other / Defer:** ___"}, {"id": "GM-24-Q23", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q23 — NEW: Share-link sitemap URLs are dead, and share tokens never expire?\n- **Status:** NEW.\n- **ACTUAL TODAY:** The sitemap lists `/shifts/link?id={id}`, but the page requires `?token=` — those links 400 (\"A share token is required\"). `issue_share_token` rotates the token (old link dies) but no expiry field was found, so a link works indefinitely until rotated or the shift closes.\n- **RECOMMENDED: Fix the sitemap to emit real share URLs (or drop shift URLs from it) and give share tokens an expiry (e.g. 30 days or shift start + 7 days).** Severity: medium (SEO + link safety).\n- **ALTERNATIVE A — Keep current logic.**\n- **ALTERNATIVE B — Drop per-shift URLs from the sitemap; keep board URLs only.**\n- **ALTERNATIVE C — Expiry only (keep sitemap as-is).**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q24", "area": "GM-24", "plat": "Web only", "md": "### GM-24-Q24 — NEW: Which public site is canonical — Vite or Next — and who owns the public pages?\n- **Status:** NEW.\n- **ACTUAL TODAY:** Two implementations: Vite pages (runtime JS meta — invisible to non-JS crawlers) and Next wrappers (server metadata + migrated Vite pages). `PublicRouteBridge` redirects Vite public paths to Next only when `VITE_PUBLIC_SITE_ENABLED=1` and origins differ. Both are in the repo at this head; which one production serves is a deploy decision, not a code fact.\n- **RECOMMENDED: Next is canonical for all public/SEO pages; Vite keeps the authenticated app; delete-or-freeze the Vite public duplicates once Next is live.** Severity: medium (SEO + double maintenance).\n- **ALTERNATIVE A — Keep current logic (both, bridged by env flag).**\n- **ALTERNATIVE B — (recommended, above).**\n- **ALTERNATIVE C — Vite is canonical; Next is a future migration (do not index Next).**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q25", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q25 — NEW: Anonymous pharmacy detail keeps postcode + script volume — hide more?\n- **Status:** NEW (spin-out of PO-Q11).\n- **ACTUAL TODAY:** See Q08: postcode + script volumes survive anonymisation. In a small suburb that is identifying.\n- **RECOMMENDED: Drop postcode and script volumes from the anonymised detail (suburb + state only).** Severity: medium (privacy).\n- **ALTERNATIVE A — Keep current logic.**\n- **ALTERNATIVE B — Drop postcode only.**\n- **ALTERNATIVE C — Drop suburb too (state only) — see Q08 Alt B.**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q26", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q26 — NEW: Non-anonymous talent posts expose identity to anonymous visitors — intended?\n- **Status:** NEW.\n- **ACTUAL TODAY:** `PublicExplorerPostReadSerializer` redacts only `is_anonymous` posts. A post with `is_anonymous=False` exposes full name + user id to anyone, logged out, via the public feed and the public talent board (which maps `authorUserId`/`explorerUserId` through).\n- **RECOMMENDED: Non-anonymous should mean \"name visible to signed-in employers\", not \"name visible to the whole internet\". Redact identity on the public feed regardless of the flag; the flag controls signed-in visibility.** Severity: high (privacy).\n- **ALTERNATIVE A — Keep current logic (flag off = public identity).**\n- **ALTERNATIVE B — (recommended, above).**\n- **ALTERNATIVE C — Remove the flag; all talent posts are anonymous publicly, always.**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q27", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q27 — NEW: Explorer interest that can never become a booking — fail fast?\n- **Status:** NEW (spin-out of Q01).\n- **ACTUAL TODAY:** Interest succeeds, offer creation succeeds, accept fails late. The failure surfaces as a generic 400 at the last step, after the pharmacy has waited and the worker has hoped.\n- **RECOMMENDED: Fail fast — block dedicated offers to Explorers at creation (with a clear message to the pharmacy: \"this candidate needs to upgrade first\") and hide/disable Apply for Explorers on non-EXPLORER-role shifts (already role-blocked) with the upgrade card beside it.** Severity: high if Q01 answer is C; moot if Q01 answer is B.\n- **ALTERNATIVE A — Keep current logic (fail late at accept).**\n- **ALTERNATIVE B — (recommended, above).**\n- **ALTERNATIVE C — Let the offer be created but warn both sides up front that acceptance needs an upgrade.**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q28", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q28 — NEW: Public-board role filter has no Explorer option — add it?\n- **Status:** NEW.\n- **ACTUAL TODAY:** Vite `PUBLIC_ROLE_OPTIONS` and Expo `ROLE_OPTIONS` list Pharmacist/Intern/Assistant/Technician/Student only. EXPLORER-role shifts (shadowing/placement) exist as a role but cannot be filtered to on either client.\n- **RECOMMENDED: Add \"New to pharmacy\" to the role filter on both clients.** Trivial, no decision needed beyond yes/no. Severity: low.\n- **ALTERNATIVE A — Keep current logic.**\n- **ALTERNATIVE B — (recommended, above).**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q29", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q29 — NEW: Daily public-shift limit is 10 per pharmacy per day — keep?\n- **Status:** NEW.\n- **ACTUAL TODAY:** `MAX_PUBLIC_SHIFTS_PER_DAY = 10`, enforced at posting and at escalation to PLATFORM; counts shifts that became public today. No UI explains the limit until it is hit (400 \"Maximum of 10 public shifts per day reached…\").\n- **RECOMMENDED: Keep 10/day for launch; show the remaining quota in the Post Shift wizard before submit.** Severity: low.\n- **ALTERNATIVE A — Keep current logic (10/day, silent until hit).**\n- **ALTERNATIVE B — (recommended, above).**\n- **ALTERNATIVE C — Raise/lower the limit (state number).**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q30", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-Q30 — NEW: Talent view counts — every authenticated view counts, no cap — keep?\n- **Status:** NEW (TB-07 limb).\n- **ACTUAL TODAY:** `add_view` increments on every authenticated call, no per-user/per-day cap; like/unlike are idempotent per user.\n- **RECOMMENDED: Cap views at one per user per post per day (or per session).** View counts are shown as social proof; uncapped counts are gameable and meaningless. Severity: low.\n- **ALTERNATIVE A — Keep current logic.**\n- **ALTERNATIVE B — (recommended, above).**\n- **Other / Defer:** ___"}, {"id": "GM-24-Q32", "area": "GM-24", "plat": "Expo only", "md": "### GM-24-Q32 — Launch-gate check: are the mobile dead-ends fixed?\n- **Old ID:** LA-Q03. **Status:** CHANGED (part) — carried as a check, not a fresh decision.\n- **ACTUAL TODAY:** Explorer Shifts screen fixed (shared `ShiftsScreen`). The manager \"add personal profile\" limb (ON-04: legacy mobile onboarding posting unsupported fields / not-found route) was **not** re-validated in this area. The Explorer upgrade flow is the live path and works on both clients.\n- **RECOMMENDED: A — Verify ON-04 in GM-01/GM-05 before launch; GM-24's own dead-ends are fixed.** Severity: medium.\n- **ALTERNATIVE A — (recommended, above).**\n- **ALTERNATIVE B — Soon after launch.**\n- **Other / Defer:** ___"}, {"id": "GM-24-OD-15", "area": "GM-24", "plat": "Web + Expo", "md": "### GM-24-OD-15: Learning pages show the \"Careers & learning\" articles (OD-15, D155/D184)\n**Platforms:** Web + Expo\n**What happens today:** The learning pages (Vite web, Next, Expo) asked for a topic called \"learning\" that does not exist, so articles written in the editor never appeared. They now show the existing \"Careers & learning\" topic. Rows the seed wrote with the old topic need a one-off data fix in production.\n**Already implemented:** commits 7855bbd8 and 22ceb013, `frontend_mobile/features/explore/ArticleFeed.tsx:40`, `frontend_web/src/pages/dashboard/sidebar/LearningMaterialsPage.tsx:212`, `frontend_web/landing_next/app/(public)/learning/page.tsx:47`\n**Recommendation:** Keep. Run the data fix at the production release.\n**Other option:** A separate \"Learning\" topic in the editor.\n**Status:** OPEN, confirm or change."}, {"id": "GM-24-OD-16", "area": "GM-24", "plat": "Expo only", "md": "### GM-24-OD-16: Public shift links and the signed-out shift board are on Expo too (OD-16, decisions-for-owner 23)\n**Platforms:** Expo only\n**What happens today:** Web had a public share link for a shift and a signed-out shift board. Expo now has both, so a shared link works on a phone.\n**Already implemented:** pr257, `frontend_mobile/app/shifts/public-board.tsx`\n**Recommendation:** Keep.\n**Other option:** Web only.\n**Status:** OPEN, confirm or change."}, {"id": "GM-24-OD-17", "area": "GM-24", "plat": "Web only", "md": "### GM-24-OD-17: Referee forms stay web-only (intended) (OD-17, D76f)\n**Platforms:** Web only\n**What happens today:** Referees are outside people who open an emailed link, so their questionnaire and decline pages stay on the web. The app has no referee screens.\n**Already implemented:** pr257\n**Recommendation:** Keep web-only.\n**Other option:** Add them to the app.\n**Status:** OPEN, confirm or change."}, {"id": "GM-24-W01", "area": "GM-24", "plat": "Server only (production data)", "md": "### GM-24-W01: What happens to explorer accounts that already hold admin rows in production? (W-10, D96)\n**Scenario:** before the D96 guard existed, Zoe (an Explorer) was made a pharmacy manager at Tom's.\n**What happens today:** on the Expo branch the guard refuses any new admin grant to an Explorer (`pr257:backend/access_control/admin_roles.py`; not yet on deployed main), but rows created before it stay. The dev database has 0 such rows. The production count is unknown until the read-only query `explorer-admin-counts.sql` (mobile-mirror work folder) runs on production.\n**Recommendation first: A.** Count first. If any are found, end those admin rows and tell the pharmacy owner; Zoe keeps her ordinary Explorer access.\n- **A (recommended):** run the count; end any explorer admin rows and notify the owner.\n- **B:** run the count; each owner decides case by case.\n- **DEFER:** only if the count is 0.\n\n**Status:** OPEN (needs the production count; the rule itself is answered by D96)"}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Public job board browsing (logged-out) | Visitors browse public shifts on Vite  and Next (`frontend_web/src/pages/PublicJobBoardPage.tsx:74`). | Visitors browse public shifts via AnonymousShiftBoardScreen (`frontend_mobile/app/shifts/public-board.tsx:4`). | Yes | |\n| Public talent board browsing (logged-out) | Visitors browse public talent profiles on Vite  and Next (`frontend_web/src/pages/PublicTalentBoardPage.tsx:18`, `frontend_web/landing_next/app/(public)/talent/public-board/page.tsx`). | Visitors inspect public candidate pitches (`frontend_mobile/app/explore/talent-board.tsx:22`). | Yes | |\n| View shared shift link via token | Shared shift details viewed anonymously (`frontend_web/src/pages/SharedShiftLandingPage.tsx:33`). | Anonymous shared shift link opened via deep link (`frontend_mobile/roles/shared/shifts/SharedShiftLandingScreen.tsx:45`). | Yes | |\n| Explorer account registration | New user selects EXPLORER role during self-registration (`frontend_web/src/pages/register.tsx:26`). | User registers with EXPLORER role (`frontend_mobile/app/register.tsx:211`). | Yes | |\n| Explorer onboarding completion | Explorer fills background details in onboarding wizard (`frontend_web/src/pages/onboarding/onboarding_explorer/ExplorerOnboardingV2Layout.tsx:20`). | Explorer submits verification details in profile tabs (`frontend_mobile/roles/explorer/profile-tabs/BasicInfoScreen.tsx:41`). | Yes | |\n| Signed-in Explorer shifts browsing | Signed-in explorer sees public shifts on dashboard (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/index.tsx:72`). | Explorer Shifts is the shared Shift Centre (the same screen every worker uses) | Yes | Verified 21 Nov: refuted. Expo Explorer Shifts re-exports the shared Shift Centre (`frontend_mobile/roles/explorer/shifts.tsx`, `export { default } from '@/roles/shared/shifts/ShiftsScreen'`), not a placeholder; same access policy as web. |\n| Express interest in public shift | Explorer submits interest application (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:284`). | Worker applies to public shift card (`frontend_mobile/roles/shared/shifts/AnonymousShiftBoardScreen.tsx:182`). | Yes | |", "file": "areas/GM-24-explorer-public.md"}, {"key": "GM-20", "row": "11", "title": "GM-20 Chat/Hubs", "qs": [{"id": "GM20-Q01", "area": "GM-20", "plat": "Web + Expo", "md": "### GM20-Q01 — Who can start a direct chat with whom? [FIRST QUESTION — see §3]\n- **Context:** There is no rule today linking a DM to any working relationship. A DM is also the moment a stranger learns the other person's full name, email and photo (see Q08), and it is the only way a worker can ask a question before accepting work (see TB-Q07).\n- **ACTUAL TODAY:** Any signed-in user with any active membership can open a DM with any user id (`POST /rooms/get-or-create-dm-by-user/`, `backend/chat/views.py::ConversationViewSet._get_or_create_dm_conversation`). No shared pharmacy, shift, offer, favourite or verification check. If the other person has no active membership, the backend silently creates an inactive CONTACT membership for them under the *sender's* pharmacy (`role='STUDENT'`, `employment_type='CONTACT'`). No Verified/AHPRA check on the REST path. Web's picker and Expo's picker narrow who you *find*, but the API does not enforce it. Normal case: owner DMs a locum — works. Edge case: a stranger DMs any worker whose user id they know/guess; an Explorer with no pharmacy link can be pulled into a CONTACT membership under a pharmacy they never joined. Retry/concurrency: `dm_key` + transaction dedupes, so two simultaneous creates return the same room. Denied role/wrong tenant: none — there is no tenant check on DMs. Payment/notification side effects: none until the first message, which then notifies + pushes (F19).\n- **Type:** decision. **Severity:** Launch-blocking (safety + privacy).\n- **Options:**\n  - **KEEP — \"Keep current logic\":** anyone with an active membership can DM anyone, CONTACT auto-created. Simplest; matches \"everybody posts from both sides\" openness. Trade-off: open to spam, poaching, and unsolicited contact; a worker's email is exposed to any DM partner (Q08).\n  - **A — \"Shared relationship only\":** DM allowed only if the two users share a pharmacy (same membership pharmacy), a favourite link, or an upcoming/past assignment. Strangers get \"You don't work together yet — send a shift offer or request booking instead.\" Trade-off: blocks cold outreach between pharmacies; needs a visible-membership lookup at DM time.\n  - **B — \"Shift-linked only\":** DM allowed only from the shift-contacts list (an upcoming assignment exists) or inside a shift thread (see Q03). Trade-off: cleanest safety story, but no pre-booking questions at all unless combined with an enquiry flow (TB-Q07 option B).\n  - **C — \"Owners/admins can start, workers can reply\":** only OWNER/ORG_ADMIN/pharmacy-admin can initiate; workers can reply to DMs started with them and DM within their own pharmacy team. Trade-off: matches the web/Expo FAB gates, but blocks worker-to-worker chat (e.g. two locums covering the same pharmacy).\n  - **Other (describe) / Defer.**\n- **RECOMMENDED: A.** Shared-relationship-only keeps the marketplace usable (teammates, favourites, assigned workers can always talk) while closing cold-contact spam and the silent CONTACT-membership side effect. It is the smallest change that makes Q02/Q08 safe. **Why not KEEP:** an open DM to any user id, combined with full identity exposure, is the single biggest safety gap in this area; it will be used for off-platform poaching and harassment in week one. **Why not B:** it kills pre-booking questions entirely and contradicts TB-Q07's enquiry need. **Risks of A:** needs a clear \"why can't I message?\" error and a path (offer/request booking) so legitimate cold contact still works.\n- **Sources:** `backend/chat/views.py::_get_or_create_dm_conversation`, `get_or_create_dm_by_user`, `get_or_create_dm` @ `97c4543`; `backend/chat/models.py::make_dm_key`; `shared-core/src/domains/chat/api.ts::getOrCreateDmByUser/startDm`.\n- **Decision status:** NOT VERIFIED → CURRENT FLOW TRACED, awaiting owner decision. Blocks Q02, Q03, Q08."}, {"id": "GM20-Q02", "area": "GM-20", "plat": "Web + Expo", "md": "### GM20-Q02 — When can a worker and a pharmacy chat — before or only after a booking?\n- **Context:** Today chat and booking are two separate worlds: chat has no booking state, booking has no chat. The owner must decide whether \"talk first\" is a feature or a leak.\n- **ACTUAL TODAY:** A DM can start at any time, including before any interest, offer, or booking — there is no gate. The shift-contacts list only *lists* people with upcoming assignments (`slot_date >= today`); it does not gate anything, and past assignments disappear from the list while the DM history remains. A worker can also be DM'd the moment their talent post is visible, because their user id is exposed by the talent API (TB-Q02's leak). Normal case: owner and assigned locum coordinate the shift — works. Edge case: owner DMs a worker who only *looked* at a public shift; worker DMs a pharmacy that never posted. Retry/concurrency: n/a. Denied role: none. Payment side effects: none — chat never touches payment. Notification: first message notifies even with no booking.\n- **Type:** decision. **Severity:** High.\n- **Options:**\n  - **KEEP — \"Chat anytime\":** no booking link; chat is a general messaging tool. Trade-off: maximum flexibility, maximum cold-contact surface (see Q01).\n  - **A — \"After interest or offer\":** either side can open a DM once the worker has shown interest in a shift or the owner has made an offer. Before that, only a structured enquiry (no free text) is possible. Trade-off: preserves pre-booking questions with consent on both sides.\n  - **B — \"After acceptance only\":** chat unlocks when an offer is accepted (reservation created); before that, contact is via the shift/offer flow only. Trade-off: safest, but a worker cannot ask \"is parking available?\" before accepting — expect more declines and more support tickets.\n  - **C — \"After payment-confirmed booking\":** chat unlocks only when the reservation is paid/confirmed (D01). Trade-off: latest; kills coordination during the payment window (up to 24 h), which is exactly when coordination is needed.\n  - **Other (describe) / Defer.**\n- **RECOMMENDED: A.** Interest-or-offer is the consent moment: both sides have already signalled intent, so opening chat is expected, not a surprise. **Why not KEEP:** it leaves the cold-contact problem unsolved. **Why not B/C:** they push ordinary coordination questions into support channels and increase declines. **Risks of A:** needs the backend to check interest/offer state at DM time, and a clear message when chat is still locked.\n- **Sources:** `backend/chat/views.py::shift_contacts`, `_get_or_create_dm_conversation` @ `97c4543`; carried D01–D03 (Issue #250 / questions.json).\n- **Decision status:** CURRENT FLOW TRACED, awaiting owner decision. Depends on Q01."}, {"id": "GM20-Q03", "area": "GM-20", "plat": "Web + Expo", "md": "### GM20-Q03 — Should a chat thread be linked to a shift?\n- **Context:** Today a DM about \"Tuesday's shift\" is indistinguishable from any other DM. When a booking is cancelled or a shift changes, the chat has no idea.\n- **ACTUAL TODAY:** No shift link exists on any chat model (`backend/chat/models.py` has no shift FK). Shift-contacts is a people list, not a thread link. A DM survives after the shift ends, after cancellation, and after the assignment is replaced — the thread shows no shift, date, role, or rate. Normal case: one shift, one DM — the humans remember the context. Edge case: a locum works 5 shifts at one pharmacy; all coordination lives in one undifferentiated DM; after a cancellation (GM-15) nobody can tell which messages were about the cancelled date. Retry/concurrency: n/a. Payment side effects: none. Web/Expo: identical — neither shows shift context.\n- **Type:** decision. **Severity:** Medium (High for dispute handling).\n- **Options:**\n  - **KEEP — \"People-only chat\":** DMs stay generic; shift context lives in the shift/offer screens. Trade-off: zero build; disputes rely on humans quoting dates.\n  - **A — \"Show the shift in the thread\":** when a DM is opened from shift-contacts (or from a shift/offer screen), the thread header shows the shift card (date, role, rate, status) and new messages can optionally attach to that shift. Old DMs stay generic. Trade-off: small build, big clarity win; needs a nullable shift link + UI.\n  - **B — \"Auto shift thread on acceptance\":** accepting an offer creates (or reuses) a dedicated thread for that shift+slot, with both parties auto-added; the thread archives when the shift completes. Trade-off: clearest audit trail for cancellations/disputes; more threads to manage; what happens on cover/swap (R04) needs a rule.\n  - **Other (describe) / Defer.**\n- **RECOMMENDED: A.** A shift card in the thread header solves the \"which Tuesday?\" problem without forcing a new thread model or changing how DMs work. **Why not B now:** it multiplies threads and needs cover/swap rules first; revisit after launch. **Risks of A:** the link must stay correct when a shift is edited (SH-08) or cancelled — show the *current* shift status, never a stale snapshot.\n- **Sources:** `backend/chat/models.py` (no shift FK) @ `97c4543`; `backend/chat/views.py::shift_contacts`.\n- **Decision status:** CURRENT FLOW TRACED, awaiting owner decision."}, {"id": "GM20-Q04", "area": "GM-20", "plat": "Web + Expo", "md": "### GM20-Q04 — Who belongs in a pharmacy's community chat, and can a pharmacy opt out?\n- **Context:** The community chat is automatic: join a pharmacy's staff and you are in. Favourite locums are deliberately kept out. The owner must confirm that is the intended room.\n- **ACTUAL TODAY:** One GROUP chat per pharmacy, auto-created on first qualifying membership (`signals.py::sync_membership_to_community_chat`). Every accepted, active staff member (employment types in `PHARMACY_STAFF_EMPLOYMENT_TYPES`) is auto-added; losing the membership removes them. Favourite locums (LOCUM/SHIFT_HERO) are explicitly *not* members even with a legacy Participant row (`realtime.py::participant_can_receive_chat_updates`). The owner can open it (`get-or-create-group` Case A) but is only added as a Participant if they hold a staff membership — an owner with no membership gets the room object back without a Participant row, so WS send/receive eligibility for that owner is untested (unknown — needs a live check). There is no per-pharmacy on/off switch and no opt-out. Normal case: all staff in one room — works. Edge case: a multi-pharmacy owner is in every pharmacy's room; a locum who worked one shift never sees the room; a revoked staff member loses access instantly but their messages stay. Retry/concurrency: `get_or_create` + unique constraint prevents duplicate rooms. Notification: every message notifies *all* members (badge + push) — no mute.\n- **Type:** decision. **Severity:** Medium.\n- **Options:**\n  - **KEEP — \"All staff, auto-joined, favourites out\":** today's rule. Trade-off: zero build; locums coordinate only by DM.\n  - **A — \"Per-pharmacy toggle: include favourites\":** owner/admin can switch a pharmacy's room to include favourite locums (or assigned workers for the week). Trade-off: locums get team context; risk of internal chatter reaching outsiders.\n  - **B — \"Opt-in rooms\":** staff choose to join; nobody is auto-added. Trade-off: quieter rooms, but new staff miss announcements.\n  - **C — \"No community chat at launch\":** disable auto-creation; DMs + hub posts only. Trade-off: simplest moderation story, loses the team-announcement channel.\n  - **Other (describe) / Defer.**\n- **RECOMMENDED: KEEP, with A as a post-launch toggle.** The auto-joined staff room is the right default for announcements and cover; favourites-out is a deliberate, tested rule. **Risks:** the owner-without-membership edge (above) must be fixed or confirmed first; all-member notifications with no mute will be noisy in large pharmacies (see Q10).\n- **Sources:** `backend/chat/signals.py::sync_membership_to_community_chat`, `backend/chat/realtime.py::participant_can_receive_chat_updates`, `backend/chat/models.py::Conversation` (unique community constraint) @ `97c4543`.\n- **Decision status:** CURRENT FLOW TRACED, awaiting owner decision. Owner-without-membership edge is a code gap (C16) to verify live."}, {"id": "GM20-Q05", "area": "GM-20", "plat": "Web + Expo", "md": "### GM20-Q05 — Who can create a custom group chat?\n- **Context:** Web and Expo both hide the \"New Group\" button from workers — but the backend does not. The owner must decide whether that hiding is the rule or just the UI.\n- **ACTUAL TODAY:** Backend: any authenticated user can create a custom group (`POST /rooms/`, `perform_create`; `POST /rooms/get-or-create-group/`), and becomes its admin. The only backend limit is that added members must be in `visible_memberships(user)` (`memberships/selectors.py`). Web gates creation to OWNER / ORG_ADMIN / admin (`ChatPage.tsx:185`); Expo gates the FAB to OWNER / ORG_ADMIN / ADMIN / SUPERUSER. A worker calling the API directly bypasses both gates. Normal case: owner creates a group for a project — works everywhere. Edge case: a worker creates a group containing staff from two pharmacies they belong to; a worker adds someone from a pharmacy they only *used* to belong to (re-send of existing members is tolerated, test `test_group_edit_may_resend_existing_members_the_editor_cannot_see`). Denied role: none server-side. Notification: none on group creation.\n- **Type:** decision (with a code gap underneath — C04). **Severity:** Medium.\n- **Options:**\n  - **KEEP — \"Anyone can create (UI just hides it)\":** backend stays open; the buttons stay gated. Trade-off: workers will discover it; inconsistent with the product's own UI.\n  - **A — \"Enforce the UI rule server-side\":** only OWNER / ORG_ADMIN / pharmacy-admin can create custom groups; workers can be added and can reply. Trade-off: one rule everywhere; needs the server to know \"pharmacy-admin\" for the creator.\n  - **B — \"Any staff member can create\":** remove the UI gates too; groups are a general teamwork tool. Trade-off: most open; group sprawl; a worker could group staff across competing pharmacies.\n  - **Other (describe) / Defer.**\n- **RECOMMENDED: A.** A button that hides a permission the API still grants is a bug, not a policy — enforce what the UI already promises. **Risks:** define \"pharmacy-admin\" precisely (membership `is_pharmacy_admin` vs org capability) before coding.\n- **Sources:** `backend/chat/views.py::perform_create`, `ConversationCreateSerializer` @ `97c4543`; `frontend_web/.../ChatPage.tsx:185`; `frontend_mobile/roles/shared/chat/ChatPage.tsx::canCreateChat`.\n- **Decision status:** CURRENT FLOW TRACED, awaiting owner decision."}, {"id": "GM20-Q06", "area": "GM-20", "plat": "Web + Expo", "md": "### GM20-Q06 — How are abusive, spam, or wrong messages handled in chat? (report / block / mute)\n- **Context:** This is the biggest safety hole in GM-20. The hub has reporting; chat has nothing.\n- **ACTUAL TODAY:** Nothing. No report, block, mute, or admin-moderation feature exists in the chat app: no model, no endpoint, no UI (`backend/chat/models.py`, `views.py` — grep for report/block/mute returns nothing). The only controls are: the sender can soft-delete their *own* message; a community-chat admin can delete the *whole room*; text is HTML-stripped only (`sanitize_chat_text` — no profanity/abuse filter). Reactions include 💩. Contrast: the hub has `CommunityReport` / `Report` / `BoardReport` (one per user per object, `resolved` flag) and the article flow has hide/delete. Normal case: polite coordination — fine. Edge case: a worker is harassed in a DM; a spammer messages every locum; a staff member posts patient-identifiable information in the community chat — today the victim's only option is to delete their own messages or leave (DM delete-for-me), and the platform has no record. Retry/concurrency: n/a. Notification side effect: a harasser's messages still push-notify the victim. Legal: Australian privacy / workplace law expects a reporting path for a workplace messaging tool; patient data in chat is a privacy incident with no containment tool.\n- **Type:** decision. **Severity:** Launch-blocking.\n- **Options:**\n  - **KEEP — \"No moderation\":** rely on revocation (remove the person from the pharmacy) and on users deleting DMs for themselves. Trade-off: no evidence trail, no containment, no platform visibility.\n  - **A — \"Report to admin (reuse the hub pattern)\":** a Report button on any message → creates a report (one per user per message), notifies pharmacy comms-admins + platform admin, message stays visible pending review; admins can delete any message. Trade-off: smallest build reusing an existing pattern; needs someone to *read* the reports (see Q17).\n  - **B — \"Report + block + mute\":** A plus: block a user (no new DMs from them, existing thread hidden) and mute a room (no badge/push). Trade-off: real user safety; block semantics across shared rooms need care (a blocked person still shares the community chat).\n  - **C — \"Full moderation queue\":** B plus a staff Moderation tab, hide-pending-review, audit log, and escalation to platform admin. Trade-off: most complete; most build; do not promise it for launch.\n  - **Other (describe) / Defer.**\n- **RECOMMENDED: A for launch, B soon after.** Report-to-admin is the minimum a workplace tool can ship with; block/mute follows because a report without a way to stop the messages is half a fix. **Why not KEEP:** shipping a messaging product with no reporting path is a launch risk, not a feature gap. **Risks of A:** reports must actually be read — name the person/role who reads them before launch, or reports pile up unseen (same warning as Q17).\n- **Sources:** `backend/chat/models.py`, `backend/chat/views.py` (absence verified by grep) @ `97c4543`; contrast `backend/public_hub/models.py::Report/CommunityReport/BoardReport`, `backend/public_hub/community.py::ReportPost/BoardReportView`.\n- **Decision status:** CURRENT FLOW TRACED, awaiting owner decision. Launch-gating."}, {"id": "GM20-Q07", "area": "GM-20", "plat": "Web + Expo", "md": "### GM20-Q07 — How long is chat history kept?\n- **Context:** Messages are forever today. Privacy law and dispute handling pull in opposite directions, so the owner must pick a number.\n- **ACTUAL TODAY:** Indefinite retention. No expiry, archive, or cleanup job exists (no chat entry in `backend/core/celery.py`; no management command; `Message` has no retention field). Soft-deleted messages keep their row (body/attachment cleared). Hard-deleting a GROUP conversation destroys all its messages for everyone (CASCADE). Revoked staff lose access but their messages stay visible to others. There is no export, no \"download my chat history\", and no per-user delete-everything. Normal case: old coordination stays searchable by scrolling (there is no message search — see backlog). Edge case: a worker leaves a pharmacy in 2027; their 2026 community-chat messages are still visible to current staff forever. Dispute case: a cancellation dispute months later can still be evidenced from the thread — which is also the argument for keeping history.\n- **Type:** decision. **Severity:** Medium (privacy/legal).\n- **Options:**\n  - **KEEP — \"Forever\":** retain indefinitely. Trade-off: best dispute evidence; worst privacy posture; storage grows unboundedly.\n  - **A — \"2 years after last activity, then delete\":** a thread with no messages for 2 years is deleted (or archived out of the app). Trade-off: covers the realistic dispute window; needs a job and a warning.\n  - **B — \"Delete on relationship end + 90 days\":** when a membership ends, that person's access stops now (already true) and their messages are removed after a 90-day grace period. Trade-off: strongest privacy; destroys evidence for late disputes.\n  - **C — \"Archive, don't delete\":** messages leave the app after N months but are kept in a plat
