favourites + anyone who has worked for the org:** Scenario: a locum who worked once gets org visibility forever — needs an expiry, or it becomes A in practice. Trade-off: generous, needs a recency rule.\n**Other / defer:** Defer the \"worked before\" limb; decide staff + favourites now.\n**Normal case:** employed pharmacist sees org-tier shift and applies. **Edge case:** worker employed at Site A, shift at Site B in the same org — visible (org tier) but is travel/credentialing the same? UNKNOWN. **Retry/concurrency:** membership revoked while an offer is pending — offer must be re-checked at acceptance (UNKNOWN whether it is). **Denied role / wrong tenant:** ex-employee still seeing org shifts after leaving — must lose access on removal; timing UNKNOWN (GM-05 Q-09 covers removal consequences). **Payment/notification:** visibility alone triggers no payment; availability-match emails only fire for PLATFORM posts, so org-tier shifts get no match emails today (Oct 2026). **Web/Expo:** same backend query; both boards must show the same set.\n**Sources:** `backend/shifts/interest.py` (`is_public_shift_member_access`), carried E01/E01A/R01.\n**Decision status:** OPEN."}, {"id": "GM-04-Q08", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q08 — Who is told when a shift is cancelled, covered or replaced — are org admins told? [ex-#184 AG-Q09] — STILL VALID\n\n> **Also covers (22 Nov):** GM15-38 (GM-15), GM22-03 (GM-22). Asked once, here.\n\n**Plain English:** today each feature picks its own recipients; there is no agreed list of who must be told. One new fact: org-wide admins *are* told about leave requests. They are still not in any agreed list for cancellations, cover, or replacements.\n\n**ACTUAL TODAY — Web and Expo (same backend):** Existing notices are per feature. No recipient list is agreed (D07). Leave notices go to the owner + org-wide admins + pharmacy admins (`backend/workforce/leave_service.py`, read at head). Edits reach every past applicant (per #184 rec. — leaks activity, adds noise).\n**RECOMMENDED: A — affected workers, owner, shift's managers.** Rationale (per #184): telling only the people who must act keeps names private. Severity: medium. Benefits: less noise, better privacy. Risks: org admins/head office are blind to cancellations at their sites unless they check.\n**ALTERNATIVE A — (recommended above)** Affected workers, owner, shift's managers.\n**ALTERNATIVE B — A plus organisation admins:** head office sees every cancellation/cover/replacement in its org. Scenario: Chempro area manager spots a site cancelling repeatedly and intervenes — impossible under A. Trade-off: more mail, real oversight; needs an opt-out or digest or it becomes noise. (Leave already does B — consistency argues for B here too.)\n**ALTERNATIVE C — A plus anyone watching:** anyone who viewed/followed the shift. Scenario: a locum who merely browsed gets cancellation mail for a shift they never applied to. Trade-off: noisy, privacy-poor.\n**Other / defer:** Keep per-feature notices (KEEP) until D07 is settled platform-wide; do not add org-admin notices piecemeal.\n**Normal case:** shift cancelled → worker + owner + managers notified. **Edge case:** cancellation at 2am for a 7am shift — org admin (B) woken by mail they can't act on; digest vs instant matters. **Retry/concurrency:** notice sent twice after a retry — idempotency UNKNOWN. **Denied role / wrong tenant:** a notice must never reveal another org's shift details to an org admin (B must be scoped per org). **Payment/notification side effects:** notices themselves are the side effect; cancellation fees (P09) are shown/charged separately and are not enforceable without disclosure (SH-09). **Web/Expo:** notices are backend/email/push; both clients show the same in-app notice list (parity UNKNOWN).\n**Sources:** `docs/qa/launch-grill/questions.json` AG-Q09 (re-read this session); `backend/workforce/leave_service.py` (`_slot_leave_recipients`, read at head).\n**Decision status:** OPEN."}, {"id": "GM-04-Q09", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q09 — When is a worker's source (favourite, chain, org, public) frozen, and which wins if several apply? [ex-#184 CX-Q31] — NOT RE-VALIDATED\n\n> **Also covers (22 Nov):** GM15-31 (GM-15). Asked once, here.\n\n**Plain English:** the rulebook says a worker's \"source\" — favourite, chain, org, or public — is frozen when they accept, and that it decides which cancellation policy and which incident treatment apply. But which source wins when a worker is several things at once was never decided, and the code that does the freezing was not read in this pass.\n\n**ACTUAL TODAY:** Per the register (Oct 2026): freeze per worker and date at acceptance; precedence open. `backend/workforce/assignment_freeze.py` exists at head — **not read**. A favourite who sees a public shift can be misclassified by visibility tier (Oct 2026). Implementation at head NOT VERIFIED — do not quote as current.\n**RECOMMENDED: A — freeze at accept; closest relationship wins.** Rationale: the relationship is the truth (a favourite is a favourite even if they happened to see the public card); the channel seen is an accident of browsing. Severity: high — source drives P02 cancellation policy, P05 internal handling, and the P10 ladder.\n**ALTERNATIVE A — (recommended above)** Freeze at accept; closest relationship wins.\n**ALTERNATIVE B — Freeze at accept; channel seen wins:** the tier the worker actually saw decides. Scenario: a favourite applies via the public board because they missed the chain notice — treated as public, with public cancellation rules. Trade-off: simple to implement (tier is on the shift), unfair in edge cases.\n**ALTERNATIVE C — Freeze at payment:** source decided when the booking is paid/confirmed, not at acceptance. Scenario: acceptance and payment are hours apart and the worker becomes a favourite in between — source flips. Trade-off: matches the money, but the worker's terms were frozen at acceptance, so the source would disagree with the terms.\n**Other / defer:** Keep current logic (KEEP in #184) — i.e. whatever the code does today, unexamined. Not recommended: the code's behaviour here is unverified.\n**Normal case:** favourite accepts a chain-tier shift → source = favourite. **Edge case:** worker is both a favourite of Site A and employed by Site B in the same org — which wins? Needs the precedence order. **Retry/concurrency:** acceptance retried after a network drop — freeze must be idempotent (same source, not recomputed). **Denied role / wrong tenant:** source must be computed from *that* pharmacy's relationships, never another org's. **Payment/notification:** source affects cancellation fees (P09/FEES) and badge/ladder treatment, not the booking fee itself. **Web/Expo:** source is backend-computed; both clients display the same frozen source (display UNKNOWN).\n**Sources:** `docs/qa/launch-grill/questions.json` CX-Q31 (re-read this session); `backend/workforce/assignment_freeze.py` (existence only at head).\n**Decision status:** OPEN — NOT RE-VALIDATED."}, {"id": "GM-04-Q10", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q10 — Do regions exist as a product concept, and if so what do they scope? [NEW] — CHANGED (role exists, geography still doesn't)\n\n**Plain English:** regions still don't exist as a thing in the product — no model, no field, no screen. Two near-misses turned up: a `Region Admin` *role* (a person, not a place) and a `public_holiday_region` label on each pharmacy that only says which holiday district it is in.\n\n**ACTUAL TODAY:** No Region model/field/API/screen at head (`backend/organizations/models.py`, full read). `Pharmacy.public_holiday_region` is a free string (e.g. `QLD_GOLD_COAST`) used for public holidays. `Region Admin` is an org-wide admin role (GM-05, adopted) — its scope is pharmacies assigned to that membership, not a geographic region object.\n**RECOMMENDED:** Drop regions from launch scope unless the owner names a concrete use (e.g. \"QLD-only visibility\" or \"regional manager\"). If a use is named, define region as a *label on a pharmacy* (state/area), not as a permission boundary — visibility stays with staff/favourite/chain/org/public (E01). Severity: low if dropped; high if adopted without definition.\n**ALTERNATIVE A — Keep current logic (no regions):** regions don't exist; a \"region\" is just a suburb/postcode on the pharmacy. Scenario: Chempro QLD manager wants all QLD shifts — they filter by pharmacy, not by region. Trade-off: no work, manual filtering.\n**ALTERNATIVE B — Region as a visibility tier:** add \"region\" between org and public in E01 (needs a new carried-decision change). Scenario: a shift is visible to every worker in SEQ before going public. Trade-off: new tier, new escalation, new notices; reopens E01.\n**ALTERNATIVE C — Region as an admin scope only:** regional managers see/report on pharmacies in their region but visibility is unchanged. Scenario: QLD manager sees QLD sites' staffing without seeing NSW pay details. Trade-off: reporting feature, not a marketplace change. (Closest to what `Region Admin` already implies — verify what that role can actually see before building C.)\n**Other / defer:** Defer; revisit if a group asks for it.\n**Normal case:** n/a (no regions). **Edge case:** a pharmacy sits on a region border (e.g. Gold Coast / NSW) — which region? Shows why a label needs a rule. **Retry/concurrency:** n/a. **Denied role / wrong tenant:** a regional manager must not see other regions (if C). **Payment/notification:** none. **Web/Expo:** n/a until defined.\n**Sources:** `backend/organizations/models.py` (full read — no Region class; `public_holiday_region` only); GM-05 adopted revalidation (`Region Admin` role).\n**Decision status:** OPEN."}, {"id": "GM-04-Q11", "area": "GM-04", "plat": "Web + Expo", "md": "### GM-04-Q11 — Do favourite, chain and organisation incidents count toward the platform ladder? [ex-#184 CX-Q27] — NOT RE-VALIDATED\n\n> **Also covers (22 Nov):** GM15-27 (GM-15). Asked once, here.\n\n**Plain English:** the rulebook says public-source incidents go on the platform ladder and chain/org incidents are handled inside the group — but nobody has checked whether the ladder itself is built, or what it counts.\n\n**ACTUAL TODAY (Oct 2026):** No source-specific platform incident ladder or badge rule is implemented (per #184 rec.). Ladder implementation at head NOT VERIFIED — GM-15 owns cancellation/incidents.\n**RECOMMENDED: A — public-sourced only; others badge only.** Rationale: keep public-source sanctions separate from internally handled relationships (P04/P05). Severity: medium. Benefits: a chain pharmacist isn't platform-banned for an internal rostering dispute; badges still signal repeat behaviour. Risks: a worker who repeatedly no-shows for chain shifts escapes the ladder by never working publicly.\n**ALTERNATIVE A — (recommended above)** Public-sourced only; others badge only.\n**ALTERNATIVE B — All outside sources count:** chain/org/favourite incidents count toward the P10 ladder (1st warning, 2nd 14 days, 3rd 28 days + badge, 4th 56 days, 5th permanent after human review). Scenario: a Chempro locum cancels late twice for chain shifts and is blocked from *public* shifts too. Trade-off: consistent, but the platform overrules an internal relationship.\n**Other / defer:** Defer until P10 ladder is implemented and tested on public source first.\n**Normal case:** public worker no-shows → ladder step. **Edge case:** same incident, two sources (Q09 freeze decides the source first — Q09 must be answered before Q11 can be applied). **Retry/concurrency:** duplicate incident reports for one no-show — must not double-count (UNKNOWN). **Denied role / wrong tenant:** only the platform sanctions (P04: managers only report); an org admin must not be able to ladder a worker. **Payment/notification:** ladder steps restrict applying (no payment); badge display is public on talent cards (SH-10 context). **Web/Expo:** ladder/badge display must match on both.\n**Sources:** `docs/qa/launch-grill/questions.json` CX-Q27 (re-read this session); carried P04/P05/P10.\n**Decision status:** OPEN — NOT RE-VALIDATED."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Organization dashboard overview | Org admin views multi-site overview with key performance metrics (`frontend_web/src/pages/dashboard/organization/OrganizationOverviewPage.tsx:15`). | Org admin accesses mobile organization dashboard (`frontend_mobile/roles/organization/dashboard.tsx:69`). | Yes | — |\n| Pharmacy hierarchy & site list | Org dashboard lists pharmacies associated with the organization (`frontend_web/src/pages/dashboard/organization/OrganizationOverviewPage.tsx:53`). | Organization navigation exposes pharmacies tab and detail routes (`frontend_mobile/app/organization/_layout.tsx:222`). | Yes | — |\n| Invite staff to organization | Org admin invites staff members across multiple sites (`frontend_web/src/pages/dashboard/organization/InviteStaffPage.tsx:142`). | Org admin accesses invite staff screen (`frontend_mobile/roles/organization/invite.tsx:101`). | Yes | — |\n| Post shift with organization scope | Shift creation allows scoping visibility to chain or organisation tiers (`frontend_web/shared/postShift/PostShiftForm.tsx:236`). | Mobile post-shift wizard supports organisation visibility scoping (`frontend_mobile/roles/shared/shifts/PostShiftVisibilityStep.tsx:48`). | Yes | — |\n| Aggregated organization invoicing | Web shows only an invoice summary panel on the organisation overview; its organisation menu has no Invoices list (`frontend_web/src/pages/dashboard/organization/OrganizationOverviewPage.tsx:179`). | Org admin reviews aggregated invoices on mobile (`frontend_mobile/app/organization/invoice.tsx:5`). | No | Corrected 22 Nov (orchestrator review): Expo has an organisation Invoices list, web does not. Parity question: GM-17-OD-12. |", "file": "areas/GM-04-organisations-chains-regions.md"}, {"key": "GM-10", "row": "3", "title": "GM-10 Posting/rates", "qs": [{"id": "GM-10-Q01", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q01 — Who can post a shift, and from where?\n- **#184 ID:** none established (topic inventory from Issue #250). **Status: VALIDATED (permission rule traced; role detail adopted from GM-05).**\n- **ACTUAL TODAY:** Creating a shift requires `user_can_manage_pharmacy` (`base.py:check_permissions`) — owner or authorised manager. Workers cannot post; a manager of pharmacy A cannot post for pharmacy B. Entry points: web `PostShiftPage.tsx` / `AdminPostShiftPage.tsx`; Expo `roles/owner/post-shift.tsx`, `roles/admin/post-shift.tsx`, `roles/organization/post-shift.tsx`. No Next entry point found. The exact role set (which manager roles count as \"can manage\") is GM-05's trace — adopted here, not re-derived.\n- **RECOMMENDED:** Keep the manager check, and confirm the GM-05 role list covers org admins for multi-site groups. Severity: MEDIUM.\n- **ALTERNATIVE A — Keep current logic:** owner + authorised managers post; workers denied. *Scenario:* an authorised manager posts while the owner is away. Trade-off: works; delegation is per GM-05.\n- **ALTERNATIVE B — Owner-only posting:** only the pharmacy owner posts; managers request. *Scenario:* owner on leave, urgent cover needed, no manager can post — shift goes unfilled. Trade-off: tightest control, slowest cover.\n- **ALTERNATIVE C — Owner + named authorised managers, per pharmacy:** *Scenario:* a multi-site owner delegates posting to each site's manager, with an audit trail. Trade-off: faster cover, needs a per-pharmacy authorisation list.\n- **Other / defer:** Defer until GM-05 (roles/membership/invites) is decided, since posting permission depends on it.\n- **Normal case:** owner posts from their own pharmacy. **Edge case:** manager posts for a pharmacy they just left / were removed from — the manager check is evaluated at request time, so a removed manager is denied. **Retry/concurrency:** two managers posting the same slot at once — no server guard (F-12). **Denied role / wrong tenant:** worker, or a manager of pharmacy A posting for pharmacy B — denied by `user_can_manage_pharmacy`. **Payment/notification side effects:** none at permission time. **Web/Expo difference:** entry routes differ; permission rule is shared backend."}, {"id": "GM-10-Q02", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q02 — What fields are required to post a shift, and what happens when one is missing?\n- **#184 ID:** none established. **Status: VALIDATED.**\n- **ACTUAL TODAY:** Required (shared validation, `postingDraft.ts`): pharmacy, role, employment type; locum needs ≥1 slot; slot start/end valid HH:MM and not equal; FT/PT HOURLY needs min+max hourly; ANNUAL needs min+max annual + super%. Backend adds: slots required; chosen visibility must be in `allowed_tiers`; FT/PT pay-band rules; Explorer shifts cannot require professional skills; must_have/nice_to_have cannot overlap. **A rate is NOT required for a locum shift** (see Q03) — a FIXED shift can even be created at $0.00 (Q12). Missing/invalid → inline error in the wizard, nothing persisted; no server draft to resume from.\n- **RECOMMENDED:** Keep the required set, but add the two missing guards (past date — Q05; rate floor — Q03/Q12). Severity: MEDIUM-HIGH.\n- **ALTERNATIVE A — Keep current logic:** required set as traced. *Scenario:* owner posts a locum shift with dates/times/role but no rate. Trade-off: fastest posting; rate disputes later.\n- **ALTERNATIVE B — Minimal required set (date, times, role, site) with rate optional/negotiable:** *Scenario:* an owner posts urgently without fixing a rate; workers express interest and the rate is negotiated in the offer. Trade-off: faster posting, slower matching, possible rate disputes.\n- **ALTERNATIVE C — Strict required set including a fixed rate:** *Scenario:* every posted shift shows a firm rate, so workers only apply to shifts they accept. Trade-off: clearer matching, slower posting, owners may post a low rate just to get the shift live.\n- **Other / defer:** Defer the rate-required choice to GM-10-Q03.\n- **Normal/edge/retry/denied/payment/Web-Expo:** shared validation is identical on web + Expo (same `postingDraft.ts`); Next unknown."}, {"id": "GM-10-Q03", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q03 — Must a shift carry a fixed hourly rate at posting, or can the rate be open/negotiable? [FIRST — see §3]\n- **#184 ID:** none established (PO-Q03 is the visibility half, not the rate rule). **Status: VALIDATED.**\n- **ACTUAL TODAY:** Three rate types exist — FIXED, FLEXIBLE (\"Open to offers\"), PHARMACIST_PROVIDED (\"Pharmacist's own rate\") (`models.py:RATE_TYPE_CHOICES`; wizard radio \"How is the rate set?\"). A locum shift can be posted with NO rate at all: FIXED defaults cascade (pharmacy `default_fixed_rate` → `rate_weekday` → first slot rate → **$0.00**). The Award floor is enforced at *accept* for pharmacists (`engagement.py`: pharmacist must be above Award floor, else ValidationError), not at posting. Workers can filter by `negotiable_only` (FLEXIBLE) in browse. Published pay is hidden from the pharmacy's own staff/chain staff and shown to everyone else (`rate_visibility.py` — PO-Q03 finding, never an owner decision).\n- **RECOMMENDED:** B — Fixed rate required for pharmacist locum shifts, shown to workers, frozen at posting; FLEXIBLE allowed only with a stated minimum (the Award floor). Rationale: the current code lets a FIXED shift exist at $0.00 and lets the rate be settled only at accept, which is exactly where GM-12's counter-offer and GM-14's Award disputes start. Severity: 🔴 launch-gating — it shapes matching (GM-19), offers (GM-12), terms/Award (GM-14) and fees (GM-16).\n- **ALTERNATIVE A — Keep current logic:** FIXED/FLEXIBLE/PHARMACIST_PROVIDED as traced, rate optional, $0.00 FIXED possible, floor enforced only at accept. *Scenario:* an owner posts a FIXED shift with no defaults anywhere — it goes live at $0.00 and a worker applies before anyone notices. Trade-off: maximum flexibility, real underpayment/trust risk.\n- **ALTERNATIVE B — Fixed rate required, shown to workers, frozen at posting (recommended):** *Scenario:* a locum sees \"$65/hr, Saturday\" and applies knowing the pay; the owner cannot lower it after interest. Trade-off: trust and fast matching; owners lose flexibility if the market moves.\n- **ALTERNATIVE C — Rate range or \"negotiable\", settled in the offer:** *Scenario:* an owner posts \"$60–$70/hr negotiable\" for a hard-to-fill Sunday; workers counter-offer. Trade-off: flexible, but slower matching and more disputes; Award-minimum floor still needs a rule (see GM-14).\n- **Other / defer:** Defer until GM-14 (Award/GST/super) confirms the minimum-pay floor — but note that deferring leaves the $0.00 path live at launch.\n- **Normal case:** owner posts a Saturday pharmacist shift at a fixed rate. **Edge case:** PHARMACIST_PROVIDED with a worker who has no rate preference stored → `KeyError` in pricing (CG-10-06). **Retry/concurrency:** rate preview (`calculate_shift_rates`) can return \"0.00\" on error with no hard failure. **Denied role / wrong tenant:** n/a. **Payment/notification:** the posted rate becomes the frozen terms rate at accept (`finalize.py` uses the accepted-terms snapshot). **Web/Expo difference:** same rate types and fields on both (shared-core); Next unknown."}, {"id": "GM-10-Q04", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q04 — How are overtime, weekend and public-holiday loadings handled?\n\n> **Also covers (22 Nov):** Q5 (GM-09). Asked once, here.\n- **#184 ID:** none established (PO-R01 is the Award-check half). **Status: VALIDATED.**\n- **ACTUAL TODAY:** Loadings are **computed, not entered**: `pricing.py` segments every shift by day type (weekday/Saturday/Sunday/public holiday from the pharmacy's state/region holiday calendar) and time window (early-morning before 08:00 / daytime / late-night from 19:00), using Award windows from 1 July 2026 Schedule B (07:00/08:00/18:00/19:00/21:00 boundaries; part-day holiday boundaries data-driven). Pharmacist FIXED/FLEXIBLE → pharmacy day-rate per segment; non-pharmacist → Award casual rates per segment + `owner_adjusted_rate` bonus. **Overtime is NOT computed anywhere in pricing** — it is only flagged for payroll review at accept (>12h shift, pre-7am weekday/Saturday — `engagement.py`). The owner enters per-day rates + an optional bonus on top of the Award rate; there is no separate \"overtime rate\" field.\n- **RECOMMENDED:** Keep computed loadings, and decide explicitly that overtime is a payroll-review flag (not an automatic loading) until GM-14 says otherwise. Severity: MEDIUM-HIGH.\n- **ALTERNATIVE A — Keep current logic:** segmented day/time rates + bonus; overtime flagged, not computed. *Scenario:* a 14-hour Saturday shift prices the Saturday rate for all hours; the >12h flag sends it to payroll review. Trade-off: simple; overtime pay depends on a human review step.\n- **ALTERNATIVE B — Automatic loadings from the Award (GM-14):** *Scenario:* a Saturday shift automatically shows the weekend loading; the owner cannot underpay by forgetting it. Trade-off: correct by default, needs the Award rules encoded and kept current.\n- **ALTERNATIVE C — Owner enters a single all-in rate, no separate loadings:** *Scenario:* an owner posts \"$80/hr Sunday\" as one number. Trade-off: simple, but the payslip/terms must still break out base vs loading, or payroll (GM-09) inherits an unexplained number.\n- **Other / defer:** Defer the calculation method to GM-14; GM-10 decides only what the poster enters and what the worker sees.\n- **Normal/edge:** overnight shifts split across days (end<=start → +1 day); shifts crossing into a public holiday are segmented per day. **Web/Expo:** same pay step fields (shared-core)."}, {"id": "GM-10-Q05", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q05 — Dates, times and timezones: what guards exist, and what time does the worker see?\n\n> **Also covers (22 Nov):** GM-23-23 (GM-23). Asked once, here.\n- **#184 ID:** none established. **Status: VALIDATED (absence proven).**\n- **ACTUAL TODAY:** **No past-date guard, no end>start guard, no recurring-end cap** — in shared validation, in the slot serializer, and in `ShiftSlot.clean`. Equal start/end times are refused client-side only. Overnight is a convention: end<=start means +1 day (`pricing.py`). Recurring expansion is by weekday with `recurring_end_date` and no horizon cap. Timezone: pricing uses the pharmacy's state/region (holiday calendar); **no single storage/display timezone rule was traced** — whether times are stored as UTC and displayed pharmacy-local, or stored naïve, was not established from the files read. DST handling: UNKNOWN.\n- **RECOMMENDED:** Add a past-date guard (refuse slots in the past) and a recurring horizon cap (e.g. 12 weeks), and state the timezone rule explicitly (pharmacy-local time everywhere, stored as UTC — or whatever the code actually does once confirmed). Severity: 🟠 high — a past-date shift is postable today and then silently invisible in browse (future-or-current filter), which looks like a lost post, not a refused one.\n- **ALTERNATIVE A — Keep current logic:** no guards; overnight by convention. *Scenario:* an owner fat-fingers last month's date; the shift posts, nobody sees it, the owner assumes the board is broken. Trade-off: zero build, silent failure mode.\n- **ALTERNATIVE B — Pharmacy-local time everywhere, stored as UTC:** *Scenario:* a Gold Coast pharmacy posts 08:00–16:00; a worker in Sydney sees 08:00–16:00 Gold Coast time labelled as such. Trade-off: one truth, needs clear labelling on every screen.\n- **ALTERNATIVE C — Device-local display with explicit timezone label:** *Scenario:* same shift shown converted to the worker's timezone. Trade-off: friendlier for travellers, risk of a worker turning up an hour early/late if the label is missed.\n- **Other / defer:** Defer DST specifics to implementation once the storage rule is decided.\n- **Normal case:** same-day day shift. **Edge cases:** overnight shift crossing midnight; shift spanning the DST change; past date; end before start; zero-length shift (refused client-side only). **Retry/concurrency:** n/a. **Denied role / wrong tenant:** n/a. **Payment/notification:** a wrong-time shift that is worked becomes a pay dispute (GM-09/GM-15). **Web/Expo difference:** date/time pickers commonly differ between web and mobile — the Expo Timetable step contents were not read at head; the validation is shared, the pickers are not."}, {"id": "GM-10-Q06", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q06 — Can a posted shift be edited, and what changes after interest or acceptance?\n- **#184 ID:** SH-08 (partly). **Status: VALIDATED — CHANGED (partly fixed since Oct 2026).**\n- **ACTUAL TODAY:** `revise_shift` (`posting.py`): if any ACCEPTED_AWAITING_PAYMENT offer exists, any non-description edit or slots change is refused (\"Complete payment before editing\"). **But with only ACCEPTED (paid/confirmed) or PENDING offers, rate/role/payment edits are still allowed** — the accepted terms snapshot is frozen (old values kept for the booked worker) while the shift card shows the new values. Pharmacy change is blocked when assignments or accepted offers exist. Slots replacement is blocked if a roster container / rostered slots / assignments exist. On edit, slots are sent only if `slotsModified`, rates only if `ratesModified`; notify flags are NOT re-sent on edit. **Interested/accepted workers are NOT re-notified and NOT asked to re-confirm** in the traced code.\n- **RECOMMENDED:** Freeze rate/role/payment/dates once ANY interest or offer exists (not just while payment is pending); allow description-only edits freely; any other change requires withdrawing and reposting (or a re-confirmation from affected workers). Severity: 🟠 high — today an owner can change the rate on a shift with three PENDING offers and the workers are never told.\n- **ALTERNATIVE A — Keep current logic:** blocked only while payment is pending; otherwise editable. *Scenario:* owner fixes a typo in the rate after three workers applied — each worker still sees the old offer; the shift card shows the new rate. Trade-off: flexible; silent divergence between offers and the card.\n- **ALTERNATIVE B — Free edit before any interest; re-confirmation required after interest:** *Scenario:* owner changes the rate after three workers applied — each worker is asked to confirm they still want it at the new rate. Trade-off: fair, but adds a re-confirmation step that may lose workers.\n- **ALTERNATIVE C — No edit after publishing; withdraw and repost instead:** *Scenario:* owner changes the date by withdrawing and reposting; old interest is discarded and workers must re-apply. Trade-off: simplest to reason about, most friction for workers.\n- **Other / defer:** Defer the re-confirmation mechanism to GM-12 (interest/offers).\n- **Normal/edge/retry/denied/payment/Web-Expo:** edit reuses the wizard on web + Expo (same shared-core payload); Next unknown."}, {"id": "GM-10-Q07", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q07 — Can a posted shift be withdrawn, and what happens to workers who already saw it or applied?\n- **#184 ID:** none established (SH-01 is the confirmed-booking half — GM-15). **Status: VALIDATED.**\n- **ACTUAL TODAY:** There is **no withdraw state and no withdraw endpoint**. Deletion IS the withdraw mechanism for unfilled shifts: DELETE is allowed unless assignments exist (409) or payment is pending (409). **Deleting a shift with PENDING interests/offers is allowed and sends no notice** (no delete hook in `deletion.py`). A confirmed external booking has no cancelled state/endpoint (SH-01 STILL VALID — GM-15).\n- **RECOMMENDED:** Add a real withdraw (not delete): mark the shift withdrawn, notify interested/offered workers, keep the record for audit, and let escalation/offer state resolve cleanly. Severity: 🟠 high — today three interested locums are left waiting on a shift that no longer exists.\n- **ALTERNATIVE A — Keep current logic:** delete = withdraw; silent for interested workers. *Scenario:* owner finds internal cover and deletes; three interested locums get no \"shift withdrawn\" notice and keep waiting. Trade-off: zero build, poor worker experience.\n- **ALTERNATIVE B — Withdraw any time before acceptance; interested workers are notified:** *Scenario:* owner finds internal cover and withdraws; three interested locums get a \"shift withdrawn\" notice. Trade-off: clean, needs a notification rule (GM-22).\n- **ALTERNATIVE C — Withdraw allowed after acceptance only via cancellation (GM-15):** *Scenario:* withdrawing a filled shift is a cancellation with policy/fees, not a free withdraw. Trade-off: protects the accepted worker; the owner cannot silently drop them.\n- **Other / defer:** Defer post-acceptance withdrawal to GM-15.\n- **Normal/edge/retry/denied/payment/Web-Expo:** delete is a shared-core call on both clients; Next unknown."}, {"id": "GM-10-Q09", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q09 — Do drafts exist, and what does publishing a draft do?\n- **#184 ID:** none established. **Status: VALIDATED (absence proven).**\n- **ACTUAL TODAY:** **No drafts exist.** `ShiftSerializer` has no `draft`/`is_draft` field; `posting.py` has no draft functions; `ShiftSlot.unpublished_at` is a roster-draft marker, not a posting draft. The wizard's \"draft\" is in-memory form state only (`PostShiftForm.tsx:postingDraft()`, `buildShiftPostingPreview` — \"Review card for an unsaved draft\"). Leaving the page loses the half-finished post. Submit = publish: the shift is immediately live at its chosen visibility tier, with escalation timestamps and posting-time notices. PR #249's W3b handover lists draft/publish as unfinished work.\n- **RECOMMENDED:** B — Drafts exist, visible only to the poster, no expiry (server-side, with a list/resume/delete). Rationale: owners plan rosters days ahead; losing a half-finished post on navigation is the failure the W3b handover already flags. Severity: MEDIUM.\n- **ALTERNATIVE A — Keep current logic:** no drafts; posting is publishing. *Scenario:* an owner must finish the wizard in one go. Trade-off: simplest state machine; a half-finished post is lost if the session drops.\n- **ALTERNATIVE B — Drafts exist, visible only to the poster, no expiry (recommended):** *Scenario:* an owner drafts Friday's shifts on Monday and publishes Thursday. Trade-off: flexible planning; stale drafts may pile up and confuse the poster.\n- **ALTERNATIVE C — Drafts exist with expiry (e.g. 7 days) and auto-cleanup:** *Scenario:* same as B, but stale drafts disappear. Trade-off: tidy; an owner who drafts early loses work silently if they miss the window.\n- **Other / defer:** Defer draft expiry/cleanup to implementation once drafts are confirmed to exist.\n- **Normal/edge/retry/denied/payment/Web-Expo:** in-memory draft is shared-core (same on web + Expo); a server draft would need both clients to use it."}, {"id": "GM-10-Q10", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q10 — How does reposting work, and what carries over?\n- **#184 ID:** none established. **Status: VALIDATED (absence proven).**\n- **ACTUAL TODAY:** **No repost endpoint or flag was found** in the traced files. The only paths are creating a brand-new shift (new id, new notifications, new source-freeze, old interest does NOT carry over) or editing the existing one (Q06). Whether reposting counts as new for fees is GM-16 territory.\n- **RECOMMENDED:** B — Repost creates a new shift copying rate/audience, old interest discarded. Rationale: clean history; the old shift's interest belonged to the old dates. Severity: MEDIUM.\n- **ALTERNATIVE A — Keep current logic:** no repost; manual re-creation only. *Scenario:* an unfilled Saturday shift is re-created by hand for next Saturday. Trade-off: works, but every field must be re-entered and nothing carries over.\n- **ALTERNATIVE B — Repost creates a new shift copying rate/audience, old interest discarded (recommended):** *Scenario:* an unfilled Saturday shift is reposted for next Saturday; last week's interested workers must re-apply. Trade-off: clean history, workers may miss the repost.\n- **ALTERNATIVE C — Repost revives the same shift and re-notifies prior interested workers:** *Scenario:* the same workers are told the shift is live again. Trade-off: best fill rate, risks spamming workers if reposted repeatedly.\n- **Other / defer:** Defer the notification rule to GM-22.\n- **Normal/edge/retry/denied/payment/Web-Expo:** no repost UI traced on either client."}, {"id": "GM-10-Q11", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q11 — What does posting trigger (notifications, fees, matching), and what do edit/withdraw/repost trigger?\n- **#184 ID:** none established (AV-04 / SH-06 are the escalation halves — GM-11). **Status: VALIDATED.**\n- **ACTUAL TODAY:** Posting triggers: posting-time notices per the wizard's notify flags (`announce_posted_shift` — staff/favourites/chain; no org broadcast; PLATFORM anonymous → no notices at all; cap 50 recipients) + availability-match emails ONLY if posted straight to PLATFORM (`announce_availability_matches` — no Verified filter; any-overlap). Escalation triggers NOTHING (GM-11-Q01). Editing triggers nothing (no re-notify, no re-confirmation — Q06). Withdrawing (deleting) triggers nothing (no delete hook — Q07). No fee is charged at posting in the traced code (fees are GM-16; `BILLING_LIVE_SHIFT_FULFILLMENT_ENABLED` defaults False, `settings.py`).\n- **RECOMMENDED:** Post notifies matching available workers immediately, at every tier (not just PLATFORM-at-posting) — and edit/withdraw notify the workers they affect. Severity: 🟠 high — this is the core rule (\"neither side waits for the other\") made concrete: a worker who posted availability (GM-19) should be told the moment a matching shift appears.\n- **ALTERNATIVE A — Keep current logic:** posting-time notices per flags + PLATFORM-only match emails; edit/withdraw silent. *Scenario:* a matching shift is posted to favourites; an available favourite who set alerts never hears about it. Trade-off: quiet, slow fills.\n- **ALTERNATIVE B — Post notifies matching available workers immediately, at every tier (recommended):** *Scenario:* a worker who posted availability (talent board, GM-19) is notified the moment a matching shift appears. Trade-off: fastest matching, notification volume risk.\n- **ALTERNATIVE C — Post notifies nobody; workers find shifts by browsing:** *Scenario:* matching depends entirely on workers checking the board. Trade-off: quiet, slow fills — conflicts with the core rule that neither side waits for the other.\n- **Other / defer:** Defer the exact recipient list to GM-22 (notifications) and any fee trigger to GM-16.\n- **Normal/edge/retry/denied/payment/Web-Expo:** notices are backend (client-independent); the flags are set in the wizard on web + Expo."}, {"id": "GM-10-Q12", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-Q12 — NEW: Can a shift ever be posted, displayed or paid at $0.00?\n- **#184 ID:** NEW (found in this trace). **Status: VALIDATED (gap in current code).**\n- **ACTUAL TODAY:** Yes, by three paths: (1) a FIXED shift with no pharmacy `default_fixed_rate`, no `rate_weekday`, and no slot rate is created at `Decimal('0.00')` (`posting.py` default cascade); (2) `get_locked_rate_for_slot` returns `DECIMAL_ZERO` with an error on any pricing failure (`pricing.py` — silent $0 fallback); (3) `calculate_shift_rates` returns rate `\"0.00\"` on error for the Post Shift preview (`lifecycle.py`). A pharmacist's PHARMACIST_PROVIDED rate that is missing raises `KeyError` instead (loud, but a different failure). No $0 guard exists at posting, at preview, or at accept — the Award floor is only enforced at accept for pharmacists, and only for TFN engagements (`engagement.py`).\n- **RECOMMENDED:** Refuse to post (or at least to publish) any shift whose computed rate is $0.00, and surface the pricing error to the poster instead of silently substituting zero. Severity: 🟠 high — a $0.00 shift that reaches a worker is an underpayment/trust incident waiting to happen.\n- **ALTERNATIVE A — Keep current logic:** $0.00 possible via defaults/fallback. *Scenario:* an owner posts a FIXED shift with no defaults; it goes live at $0.00 and a worker applies before anyone notices. Trade-off: zero build, real risk.\n- **ALTERNATIVE B — Refuse $0.00 at posting (recommended):** *Scenario:* same owner gets \"Add a rate before posting\" and the shift never goes live. Trade-off: one guard; owners with genuinely unpaid/volunteer shifts (if those exist) need an explicit $0 path — see GM-19/Explorer.\n- **ALTERNATIVE C — Allow $0.00 only as an explicit, labelled \"unpaid/volunteer\" post:** *Scenario:* a shadowing shift is posted at $0 with a clear label. Trade-off: preserves a legitimate use if one exists; needs the label everywhere the rate appears.\n- **Other / defer:** e.g. warn but allow, with the $0 shown prominently to the worker. **Edge cases:** FT/PT pay-band shifts (min/max rates, not a single rate); slot rate 0 with a valid pharmacy default (the cascade saves it). **Decide jointly with Q03 (rate rule) and GM-14 (Award floor).**\n\n---"}, {"id": "GM-10-OD-09", "area": "GM-10", "plat": "Web + Expo", "md": "### GM-10-OD-09: The server refuses shift dates before today or more than 4 months ahead (OD-09, D64/D147)\n**Platforms:** Web + Expo\n**What happens today:** New posts, recurring end dates and date edits are refused unless the date is between today and the end of the 4th month ahead, in the pharmacy's time zone. Before, only the screens checked this. (Roster planning is W-01, asked separately.)\n**Already implemented:** pr257, `backend/shifts/posting.py:66`, `:228`\n**Recommendation:** Keep.\n**Other option:** A different window, or past dates allowed for record-keeping.\n**Status:** OPEN, confirm or change."}, {"id": "GM-10-OD-10", "area": "GM-10", "plat": "Expo only", "md": "### GM-10-OD-10: Reminder of your own decision: Expo Post shift has no separate draft/publish (OD-10, your D36 (4 Nov))\n**Platforms:** Expo only\n**What happens today:** Web lets an owner save a draft and publish later (GM-10-Q09). Expo posts straight away. Templates are on Expo now. You decided on 4 Nov that the Shifts, Shift Centre and Post shift redesign (web look plus every web feature) happens in a separate pass at the end.\n**Code:** not built yet\n**Recommendation:** Keep your D36: do it in the end pass, after the grill.\n**Other option:** Build draft/publish on Expo before launch.\n**Status:** OPEN, confirm or change."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Start posting wizard | Multi-step wizard opens in Vite (`frontend_web/src/pages/dashboard/sidebar/PostShiftPage.tsx:16`; Next has no wizard route, only a navigation helper at `frontend_web/landing_next/migrated/pages/dashboard/sidebar/TalentBoard/index.tsx:307`). | Multi-step posting screen opens in Expo (`frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:79`, mounted at `frontend_mobile/roles/owner/post-shift.tsx:1`). | Yes | - |\n| Submit shift with required fields | Validates draft and submits payload via `buildShiftPostingPayload` (`frontend_web/shared/postShift/PostShiftForm.tsx:493`). | Validates draft and submits payload via `buildShiftPostingPayload` (`frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:1372`). | Yes | - |\n| Submit with missing or invalid fields | Shared validation intercepts invalid draft returning inline field errors (`frontend_web/shared/postShift/PostShiftForm.tsx:499`). | Shared validation intercepts invalid draft returning inline field errors (`frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:1338`). | Yes | - |\n| Hourly rate and loading preview | Renders rate inputs and preview calculations in pay step (`frontend_web/shared/postShift/PostShiftPayStep.tsx:64`). | Renders mobile pay rate step sending identical rate configuration (`frontend_mobile/roles/shared/shifts/PostShiftPayRateStep.tsx:92`). | Yes | - |\n| Edit published shift | Re-enters wizard loading existing shift data under `editingShiftId` (`frontend_web/shared/postShift/PostShiftForm.tsx:79`). | Reuses mobile wizard passing `editingShiftId` to update payload (`frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:1340`). | Yes | - |\n| Withdraw / delete unfilled shift | Deletes unfilled shift via `deleteShift` action without candidate notifications (`frontend_web/src/pages/dashboard/sidebar/ActiveShiftsPage/hooks/useShiftActions.ts:44`). | Deletes unfilled shift via `deleteShift` without candidate notifications (`frontend_mobile/roles/shared/shifts/ActiveShiftsPage/index.tsx:294`). | Yes | - |\n| Save draft / leave wizard | In-memory draft state only; closing the page discards unsubmitted data (`frontend_web/shared/postShift/PostShiftForm.tsx:135`). | In-memory draft state only; navigating away discards form progress (`frontend_mobile/roles/shared/shifts/PostShiftScreen.tsx:241`). | Yes | - |", "file": "areas/GM-10-shift-posting-rates.md"}, {"key": "GM-11", "row": "3", "title": "GM-11 Audience/escalation", "qs": [{"id": "GM-11-Q01", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q01 — When a shift escalates, who is told, and when does escalation stop? 🔴 [FIRST — see §4]\n\n> **Also covers (22 Nov):** GM-12-Q19 (GM-12), GM22-01 (GM-22), GM-24-Q10 (GM-24). Asked once, here.\n- **Old ID:** PO-Q08 (gap SH-06). **Status: STILL VALID.**\n- **ACTUAL TODAY:** Escalation sends no notices at any tier; availability-match emails go out only when a shift is posted straight to public. Auto-escalation stops for good once anyone has shown interest, even if they later declined, withdrew, or their offer expired (`escalation.py` filter `interests__isnull=True`; no resume path).\n- **RECOMMENDED:** A — Notify each new tier; stop when reserved. Respects the owner's notice flags. Rationale: newly eligible workers are never told today, and one declined applicant strands the shift. Severity: launch-gating — shifts can strand silently on launch weekend.\n- **ALTERNATIVE A — Keep current logic:** Silent escalation; any past interest stops it for good. *Scenario:* a favourite declines on Monday; the shift sits invisible to the chain and public all week and goes unfilled, pharmacy pays for cover elsewhere. Trade-off: zero notification noise, zero build — but silent, stranded shifts.\n- **ALTERNATIVE B — Notify at public; stop at interest:** Today's stop rule, plus a single notice at PLATFORM. *Scenario:* chain workers still never learn the shift widened to them; only the public blast helps, late. Trade-off: minimal email, still strands shifts after any interest.\n- **ALTERNATIVE C — Owner chooses per shift:** A per-shift notify/stop setting on the posting form. *Scenario:* an urgent Saturday shift gets \"notify every tier, keep escalating until reserved\"; a routine weekday shift gets \"quiet\". Trade-off: most flexible, most UI and most owner effort per post; inconsistent worker experience.\n- **Other / defer:** Describe another rule, or defer — but deferring leaves SH-06 launch-gating: shifts can strand silently.\n- **Edge cases:** declined vs withdrawn vs expired-offer interest (all stop it today); interest from an unverified worker; interest on one date of a multi-date block; two workers interested at once (race — first interest stops widening for both); escalation reaching PLATFORM after shift start (no late bound); PLATFORM step skipped while at daily public-shift limit (silent — no notice the step was skipped). **Payment/notification side effects:** notifying a tier costs email/push volume only; no fee is charged on escalation. **Web/Expo difference:** none in the rule (shared backend); the *discovery* difference is that Expo workers rely on push/list loads, web workers on email/list loads — both silent today."}, {"id": "GM-11-Q02", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q02 — Should escalation pause while an offer waits for an answer? 🟠\n\n> **Also covers (22 Nov):** GM22-13 (GM-22). Asked once, here.\n- **Old ID:** PO-Q09. **Status: STILL VALID.**\n- **ACTUAL TODAY:** No pause rule. Auto-escalation stops for good once anyone shows interest, so most shifts with a pending offer never escalate again, even after decline or expiry. (Offer expiry is flat 48h, lazily applied — GM-12-Q10.)\n- **RECOMMENDED:** A — Pause; resume on decline or expiry. No two workers race for one slot. Rationale: the current stop rule is a pause that never resumes; turning it into a real pause keeps the no-race benefit without stranding the shift.\n- **ALTERNATIVE A — Keep current logic:** Escalation stops at first interest and never resumes. *Scenario:* worker A is offered the shift, sits on it 48h, declines; the shift never widens and the pharmacy finds out on Friday. Trade-off: no race, but the worst fill rate.\n- **ALTERNATIVE B — Keep escalating:** Faster fill; more let-downs. *Scenario:* worker A is considering the offer while worker B (public) accepts; A is told \"already filled\". Trade-off: fastest fill, but double-booking disappointment; the slot-lock (`assignment.py:slot_locked_for_shift_offer` — GM-12) prevents a true double-booking, but not the disappointment.\n- **Other / defer:** e.g. pause only for the first 2 hours, then resume; or pause only below PLATFORM.\n- **Edge cases:** offer expires (lazily — may outlive shift start); worker withdraws; owner withdraws offer (no withdraw action exists — GM-12-Q16); multi-date block with one date offered. **Blocked by:** Q01 (the stop rule must be replaced before a pause rule makes sense)."}, {"id": "GM-11-Q03", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q03 — How late may a scheduled escalation fire? 🔴 (code gap once decided)\n\n> **Also covers (22 Nov):** GM22-11 (GM-22), GM25-C20 (GM-25). Asked once, here.\n- **Old ID:** PO-Q10 (gap SH-05), type `code` in #184; also LA-Q08. **Status: STILL VALID.**\n- **ACTUAL TODAY:** Auto-escalation only runs when someone loads a shift list or detail (`base.py:get_queryset` → `_auto_escalate_shifts` on every request); no scheduled job exists, so due escalations fire late or never, and each request scans every due shift.\n- **RECOMMENDED:** A — Within 5 minutes. A scheduled job every few minutes. Rationale: the existing beat schedule already runs jobs every 60 s (editorial revisions) and */15 (AHPRA alerts), so a job is cheap; 5 minutes is plenty for owner-set intervals.\n- **ALTERNATIVE A — Within 1 minute:** Same job, more often. *Scenario:* an urgent shift posted at 07:00 escalates at 07:01 instead of 07:05 — negligible worker benefit, higher job frequency. Trade-off: tightest, most load.\n- **ALTERNATIVE B — Within 15 minutes:** Cheapest. *Scenario:* a shift due to widen at 09:00 widens at 09:15; a chain worker who checked at 09:05 sees nothing and does not come back. Trade-off: cheapest, visibly laggy for urgent shifts.\n- **Other / defer:** e.g. 2 minutes; or keep lazy escalation for non-urgent shifts and schedule only urgent ones.\n- **Engineering: see BL-24.** Q03 owns the timing bound."}, {"id": "GM-11-Q04", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q04 — Should automatic widening be in the first launch? (LA-Q08)\n\n> **Also covers (22 Nov):** GM22-12 (GM-22). Asked once, here.\n\n**Scenario:** Tom's shift is due to widen at 2 am. Sara checks at 7 am.\n**What happens today:** The shift widens when a shift-list or detail request runs the due check. Until someone loads it, the shift can stay at its earlier tier (`pr257:backend/shifts/escalation.py:91`).\n**Recommendation first: A.** Launch automatic widening with the scheduled check and the timing chosen in GM-11-Q03.\n- **A (recommended):** After the scheduler ships, Sara can find the shift in the wider audience within the agreed time even if nobody opens the board overnight.\n- **B:** Tom widens the audience by hand at launch. Scheduled widening comes later.\n\n**Status:** OPEN (launch scope). Engineering: see BL-24."}, {"id": "GM-11-Q05", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q05 — Fix before launch? Match emails miss escalated shifts and reach unverified workers. 🟠 (code gap)\n\n> **Also covers (22 Nov):** GM-18-Q18 (GM-18), GM22-10 (GM-22), GM-23-16 (GM-23), GM-24-Q19 (GM-24). Asked once, here.\n- **Old ID:** LA-Q17 (gap AV-04). **Status: STILL VALID.**\n- **ACTUAL TODAY:** Match emails go out only at posting time, for shifts posted straight to PLATFORM (`announcements.py:announce_availability_matches`); shifts that later escalate to PLATFORM never notify available workers. Recipients are not filtered by Verified, so unverified workers are emailed shifts they are then blocked from applying to. Match uses any-overlap (`availability.start <= slot_end AND availability.end >= slot_start`).\n- **RECOMMENDED:** A — Fix before launch. Send on escalation to PLATFORM as well as on direct posting; filter recipients to Verified (and role-appropriate) workers.\n- **ALTERNATIVE A — Keep current logic:** *Scenario:* a shift escalates to public on Thursday; available workers who set availability alerts never hear about it, while an unverified worker gets an email for a shift they cannot apply to and complains. Trade-off: no build, misleading emails + missed fills.\n- **ALTERNATIVE B — Fix the Verified filter only, not the escalation trigger:** Stops misleading emails; escalated shifts still silent. Trade-off: half the fix.\n- **ALTERNATIVE C — Fix the escalation trigger only, not the filter:** Escalated shifts notify; unverified workers still get emails they cannot act on. Trade-off: half the fix, opposite half.\n- **Other / defer:** e.g. replace email with in-app/push only for escalated shifts.\n- **Edge cases:** worker becomes Verified between posting and escalation; worker's availability overlaps partially (any-overlap vs % overlap — undecided); worker opted out of alerts (`notify_new_shifts=False` is respected). **Web/Expo difference:** email is client-independent; push/in-app would differ by client — not inspected."}, {"id": "GM-11-Q06", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q06 — Who can start at a later tier, and can a tier be skipped entirely? 🟡\n- **Old ID:** part of carried E01 (\"Owner may start at a later tier\"). **Status: CHANGED.**\n- **ACTUAL TODAY:** The wizard offers a starting-tier choice (web + Expo `PostShiftVisibilityStep`, `allowedVis` list) and `allowed_tiers()` builds the conditional list (OWNER_CHAIN only if the pharmacy is in an owner's chain; ORG_CHAIN only if the pharmacy is claimed by an org). Creating a shift requires `user_can_manage_pharmacy` (`base.py:check_permissions`) — owner or authorised manager, per GM-05 roles. New nuance: a shift posted straight to PLATFORM is visible to earlier tiers too (`browse.py`: PLATFORM + not anonymous passes the community filter), so \"skipping\" affects the priority window and the notices, not the visibility itself.\n- **RECOMMENDED:** Keep E01 (owner may start later) — but confirm that managers (not only owners) may do so, and that skipped tiers are recorded as skipped, not as \"notified\". Rationale: starting at PLATFORM for an urgent shift is the main legitimate use; silently skipping favourites burns trust if they later learn they were bypassed.\n- **ALTERNATIVE A — Keep current logic (owner-or-manager late start, as traced):** *Scenario:* owner posts straight to public for a Saturday urgent shift; favourites see it only as a public post, with no priority window. Trade-off: simple, fastest for urgent shifts.\n- **ALTERNATIVE B — Late start needs a reason / is logged:** *Scenario:* owner must pick \"urgent\" or \"no favourites available\" to skip tiers; the skip is visible to managers. Trade-off: audit trail, slight friction.\n- **ALTERNATIVE C — No skipping; escalation must pass through every tier, with zero-length intervals allowed:** *Scenario:* owner sets 0-minute intervals to reach public immediately but every tier is technically offered it. Trade-off: preserves priority order on paper, adds noise.\n- **Other / defer:** e.g. per-pharmacy default starting tier set by the owner once, not per shift.\n- **Edge cases:** starting at PLATFORM anonymously (see Q07/Q08); starting late on a multi-date block; changing the starting tier after posting (edit — GM-10 territory)."}, {"id": "GM-11-Q07", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q07 — On an anonymous public post, what is hidden? 🟡\n\n> **Also covers (22 Nov):** GM-24-Q08 (GM-24), GM26-Q15 (GM-26). Asked once, here.\n- **Old ID:** PO-Q11. **Status: PARTLY (mechanism confirmed, field list not re-verified).**\n- **ACTUAL TODAY:** Redaction runs through `anonymize_pharmacy_detail` (`serialization/shifts.py:to_representation`); anonymous shifts are included in the public queryset with search excluding name/street. The Oct 2026 field list — name, street, software and services hidden; suburb, state, postcode, script volume and rate shown — was **not** re-verified at head. Do not present that list as current until the serializer is read line by line.\n- **RECOMMENDED (Oct 2026, stands as proposal):** KEEP the Oct 2026 list if confirmed. It hides what was proposed and keeps the suburb workers need to judge travel, as Mable does. It also hides software and services, which could identify a small-suburb pharmacy.\n- **ALTERNATIVE A — Keep current logic:** As traced (redaction via serializer). *Scenario:* a worker in a neighbouring suburb judges travel from the suburb + rate and applies. Trade-off: workable, tested pattern.\n- **ALTERNATIVE B — Also hide suburb (region only):** *Scenario:* a single-pharmacy small town — suburb alone identifies the pharmacy, so a worker who knows the town knows who it is anyway, but a worker elsewhere cannot judge travel at all. Trade-off: stronger anonymity, much weaker usefulness.\n- **Other / defer:** e.g. hide script volume too (it can identify a high-volume store).\n- **Edge cases:** anonymous post escalates *to* PLATFORM from a named earlier tier — do earlier-tier workers keep seeing the name while public workers see \"Anonymous\"? NOT inspected — unknown. Anonymous + urgent flag; anonymous multi-date block. **Web/Expo difference:** redaction must hold in both clients and in emails/push — NOT inspected on Expo. Re-verify the serializer field list before deciding."}, {"id": "GM-11-Q08", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q08 — When does an anonymous pharmacy's name reach the worker? 🟠\n\n> **Also covers (22 Nov):** GM22-14 (GM-22), GM-24-Q09 (GM-24), GM26-Q16 (GM-26). Asked once, here.\n- **Old ID:** PO-Q12. **Status: PARTLY (reminder job confirmed, naming not verified).**\n- **ACTUAL TODAY:** The reminder job exists (`tasks.py:send_shift_reminders`, 12h window, hourly beat). Whether the 12-hour reminder email names the pharmacy on anonymous shifts, and whether the terms dialog omits the name, were NOT re-verified at head. Oct 2026 said: worker never sees the name before accepting; terms dialog omits it; accept notices say \"Shift in &lt;suburb&gt;\"; cards stay anonymous after booking; the 12-hour reminder email names it. Treat that as Oct 2026 only.\n- **RECOMMENDED (Oct 2026):** A — In the agreement preview, before the worker accepts. Today (Oct 2026) a worker agrees to work for an unknown business and learns the name by accident in an email.\n- **ALTERNATIVE A — Keep current logic:** Worker accepts blind; name surfaces only in the reminder email. *Scenario:* worker accepts, then learns it is a pharmacy they refuse to work for — now they must cancel, triggering the cancellation ladder (GM-15). Trade-off: zero build, highest late-cancel risk.\n- **ALTERNATIVE B — After reservation:** Worker accepts blind (same as keep, but name revealed at reservation rather than 12h before). *Scenario:* worker can still cancel before payment, but after committing. Trade-off: earlier than today, still blind at accept.\n- **ALTERNATIVE C — After payment confirms:** Worker commits blind. *Scenario:* worst — worker is financially committed before knowing the employer. Trade-off: not recommended; legal/fairness risk.\n- **Other / defer:** e.g. reveal name on offer (not on application), so applicants apply blind but accept knowing.\n- **Edge cases:** worker is staff/favourite of that pharmacy (already knows it — should redaction lift for them? NOT inspected); manager view vs worker view; reminder email is the *only* reveal today — if email fails, worker arrives not knowing the name. **Legal/financial impact:** accepting work for an unknown employer raises informed-consent / workplace-safety concerns; a worker who withdraws after learning the name may face cancellation consequences they did not bargain for. Re-verify the reminder email + terms dialog before deciding."}, {"id": "GM-11-Q09", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q09 — What makes a shift \"urgent\", and does urgency change the audience/escalation? 🟡\n- **Old ID:** PO-Q13 (urgency flag); escalation interaction is new for GM-11. **Status: STILL VALID.**\n- **ACTUAL TODAY:** Urgent is only the owner's switch in the wizard (web `PostShiftForm.tsx:isUrgent` and Expo equivalent; `is_urgent` on Shift); nothing turns on automatically near start time. Workers can filter by urgent (`only_urgent` in `browse.py`). No rule ties urgency to faster escalation or a wider starting tier.\n- **RECOMMENDED (Oct 2026, for the flag itself):** A — Owner flag, or auto within 24h. Any shift starting within 24 hours is urgent. (Qwick treats shifts posted within 24h as urgent; Mable's Last Minute covers 4–48h.)\n- **ALTERNATIVE A — Keep current logic:** Urgent only when the owner switches it on. *Scenario:* a shift starting tomorrow is not flagged urgent unless the owner remembers; it escalates on the normal slow schedule and goes unfilled. Trade-off: no build, relies on owner memory.\n- **ALTERNATIVE B — Owner flag, or auto within 48h:** Wider net. *Scenario:* a shift in 36h is flagged urgent and (if the owner agrees) escalates faster — more workers see it sooner, more notification noise. Trade-off: earlier warning, more \"urgent\" fatigue.\n- **ALTERNATIVE C — Urgency shortens escalation intervals automatically:** e.g. urgent shifts escalate every 30 minutes instead of the owner's intervals. *Scenario:* Saturday 07:00 shift posted Friday night reaches public by midnight. Trade-off: fastest fill for genuinely urgent shifts; needs a decision on what \"shortens\" means.\n- **Other / defer:** e.g. urgent is a filter only, never changes escalation.\n- **Edge cases:** owner turns urgent off after posting; shift becomes urgent by passage of time (crosses the 24h boundary) — does it re-escalate? NOT inspected."}, {"id": "GM-11-Q10", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q10 — When an offer is declined or expires, what happens to the shift's audience? 🟠\n\n> **Also covers (22 Nov):** GM-12-Q11 (GM-12), GM13-Q06 (GM-13). Asked once, here.\n- **Old ID:** BK-Q06 (booking area, escalation-adjacent). **Status: STILL VALID.**\n- **ACTUAL TODAY:** Decline/expiry does not resume escalation (SH-06 stop rule — any past interest blocks it). The shift stays at whatever tier it reached, with the same audience; a reservation expiry releases to the same audience only (D03 — decision; implementation not found, see §6).\n- **RECOMMENDED:** A — On decline/expiry/withdrawal, resume escalation from the tier it had reached (do not restart from tier 1, do not jump to PLATFORM), and notify the next tier. Rationale: the slot is empty again; the audience should widen, not freeze. This is the same recommendation as Q01-A/Q02-A, applied to the decline/expiry event.\n- **ALTERNATIVE A — Keep current logic:** Shift stays frozen at its tier after any interest. *Scenario:* see Q01-A.\n- **ALTERNATIVE B — On decline, jump straight to PLATFORM:** Fastest re-fill; burns the priority order (favourites/chain never get their window). Trade-off: speed vs fairness to nearer tiers.\n- **ALTERNATIVE C — Owner manually re-opens / re-escalates:** *Scenario:* owner gets a notice \"offer declined — widen audience?\" and taps once. Trade-off: human control, delay if the owner is asleep.\n- **Other / defer:** e.g. auto-resume only if shift start is &gt;12h away; manual if nearer.\n- **Edge cases:** multiple offers, one declines while another is pending; decline after partial acceptance on a multi-date block; expired offer discovered lazily (SH-07) — does expiry even get noticed in time to resume? **Concurrency:** two declines at once must resume escalation once, not twice."}, {"id": "GM-11-Q12", "area": "GM-11", "plat": "Web + Expo", "md": "### GM-11-Q12 — Do notification flags control escalation notices per tier, and is there an organisation-wide broadcast? 🟡\n- **Old ID:** part of carried E01B. **Status: STILL VALID — downstream of Q01.**\n- **ACTUAL TODAY:** Staff, favourite and chain notice flags exist in the wizard and govern posting-time notices (`announcements.py:announce_posted_shift`); no organisation-wide broadcast (no org-wide recipients in the file). Escalation sends nothing, so the flags currently only govern posting-time notices.\n- **RECOMMENDED:** Keep E01B, and apply the same flags to escalation notices: a tier is notified on escalation only if its flag is on; ORG_CHAIN is never broadcast — org members discover via browsing / personal alerts only.\n- **ALTERNATIVE A — Keep current logic:** Flags as today; no escalation notices at all (until Q01 is decided, this question is moot — it is downstream of Q01).\n- **ALTERNATIVE B — Escalation notices ignore the flags (always notify the new tier):** *Scenario:* a chain pharmacist who turned chain notices off still gets emailed every escalation. Trade-off: maximum fill, notification fatigue + opt-out complaints.\n- **ALTERNATIVE C — Add an organisation-wide broadcast option:** Owner may broadcast to the whole org on escalation to ORG_CHAIN. *Scenario:* a group with 20 stores fills a shift in an hour — or 200 staff get an email about a shift 300 km away. Trade-off: speed vs spam; needs distance/role filtering to be sane.\n- **Other / defer:** e.g. digest (one email per day per worker) instead of per-escalation emails.\n- **Edge cases:** worker belongs to several tiers at once (staff at one store, favourite at another) — one notice or several? NOT inspected. Worker opted out of email but not push."}], "sbs": "## Web and Expo today, side by side (pr257 `21add924`)\n\nSource for both web and Expo is `origin/agent/pr257-int` `21add924` (what merges to main). Read-only code check by agy, 21 Nov 2026; every cited file:line was checked to exist at that commit. \"Parity question\" = a choice for the owner, asked in this area's rounds. \"Possible defect (to verify)\" = drift that looks unintended; it is confirmed in code before it goes to the engineering backlog, never asked as a question. The Platforms table says which platforms each question applies to.\n\n| Flow | Web (Vite + Next) | Expo | Same? | If different |\n|---|---|---|---|---|\n| Select audience tier in posting wizard | Offers 5 audience tiers and custom escalation timing (`frontend_web/shared/postShift/PostShiftVisibilityStep.tsx:61`). | Offers identical 5 audience tiers and escalation intervals (`frontend_mobile/roles/shared/shifts/PostShiftVisibilityStep.tsx:63`). | Yes | - |\n| Unfilled shift escalation check | Any shift list load triggers backend auto-escalation evaluation (`backend/shifts/base.py:252`, `backend/shifts/escalation.py:91`). | Shift list load triggers identical backend auto-escalation check (`backend/shifts/base.py:252`). | Yes | - |\n| Disclosing widened shift to new tier | Widened shift becomes visible to new audience on feed query (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:159`). | Widened shift becomes discoverable on mobile shift query (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:151`). | Yes | - |\n| Posting-time notification toggles | Wizard exposes notification switches for email and in-app alerts (`frontend_web/shared/postShift/PostShiftVisibilityStep.tsx:61`). | Wizard exposes notification switches for email and in-app alerts (`frontend_mobile/roles/shared/shifts/PostShiftVisibilityStep.tsx:63`). | Yes | - |\n| Worker interest halts escalation | Submitting interest halts further automatic audience widening (`frontend_web/src/pages/dashboard/sidebar/PublicShiftsPage.tsx:284`). | Submitting interest halts further automatic audience widening (`frontend_mobile/roles/pharmacist/shifts/[id].tsx:234`). | Yes | - |\n| Anonymous public posting toggle | Toggle anonymises pharmacy details for public platform tier (`frontend_web/shared/postShift/PostShiftVisibilityStep.tsx:61`). | Toggle hides pharmacy name on public platform tier (`frontend_mobile/roles/shared/shifts/PostShiftVisibilityStep.tsx:210`). | Yes | - |", "file": "areas/GM-11-audience-escalation.md"}, {"key": "GM-12", "row": "3", "title": "GM-12 Interest/offers", "qs": [{"id": "GM-12-Q06", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q06 — Which ways can a worker get a shift at launch?\n- **Old ID:** BK-Q01. **Status: VALIDATED — CHANGED (claim now proven).**\n- **ACTUAL TODAY:** Apply-and-offer for outsiders; **instant claim for own direct staff only** (`claim_shift`, `browse.py:249` — active member of THIS pharmacy; favourites/locums refused 400 with \"must express interest and accept the final shift offer so ABN/TFN engagement terms are recorded\"; role + `staff_membership_can_claim_role` checks; single-user: any existing assignment blocks; taken slots silently skipped — partial claim possible; deletes own interest/rejection; emails + in-app notifies creator). No instant book for anyone else; no auto-accept path found.\n- **RECOMMENDED (provisional, #184):** B — A plus opt-in instant book per shift. Severity: MEDIUM. **ALTERNATIVE A — Keep current logic** (staff-only claim). **ALTERNATIVE B — Opt-in instant book.** Other / defer."}, {"id": "GM-12-Q07", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q07 — Who may instant-book or be auto-accepted?\n- **Old ID:** BK-Q02. **Status: VALIDATED — CHANGED (claim scope proven).**\n- **ACTUAL TODAY:** Instant claim = own direct staff only (Q06). No reliability score exists in inspected files; no auto-accept for favourites.\n- **RECOMMENDED (provisional, #184):** A — favourites only (for any future opt-in instant book). **ALTERNATIVE A — Keep current logic** (employees only). **ALTERNATIVE B — Favourites plus rule-based workers (e.g. 5+ completed shifts, no incidents).** Other / defer."}, {"id": "GM-12-Q08", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q08 — How should applicants be ordered for the pharmacy?\n- **Old ID:** BK-Q03. **Status: NOT RE-VALIDATED** (ordering lives in the frontend Candidates components — contents not read at head; backend annotates average rating only, `offers.py:58-60`, no ranking rule).\n- **ACTUAL TODAY (backend only):** interest list annotates `Avg('user__ratings_received_as_worker__stars')`; no ordering rule in backend. Frontend ordering UNKNOWN.\n- **RECOMMENDED (provisional):** Order by fit — Verified + role match first, then favourites/staff, then rating, then earliest interest — and show the rule on screen. **ALTERNATIVE A — Earliest interest first.** **ALTERNATIVE B — Highest rated first.** **ALTERNATIVE C — Pharmacy chooses per shift.** Other / defer. Read the Candidates components before deciding."}, {"id": "GM-12-Q09", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q09 — What should the pharmacy see on each applicant? (incl. reveal)\n- **Old ID:** BK-Q04. **Status: VALIDATED — CHANGED (reveal now proven).**\n- **ACTUAL TODAY:** Public interest announce says \"A candidate\" (`interest.py:145-147`). Reveal is explicit and audited: `reveal_candidate` (`candidates.py:83`) — quota-enforced (`reveal_count >= reveal_quota` → 403 unless already revealed), already-revealed does not double-count, `interest.revealed = True`, audit-logged, worker notified (in-app + email) only on first reveal. `revealed_profile` shows name + work profile — **no contact details or CV** (\"owner decision\"). `work_profile` includes `verified`, `gov_id_verified`, `abn_verified`, AHPRA summary, `verified_skills`, dispensary qualification. `assigned_profile`: no quota, no email. Quota *value/default* (`shift.reveal_quota`) was not traced — UNKNOWN (see §6).\n- **RECOMMENDED:** Show role, Verified/AHPRA badge, rating, distance/rate if the worker opts in; reveal full identity on offer, not on interest — for public shifts. The current reveal-on-manager-action shape already matches this; the decision is whether the quota and the no-contact-details rule stay. Severity: MEDIUM. **ALTERNATIVE A — Keep current logic** (reveal with quota, no contact details/CV). **ALTERNATIVE B — Reveal on interest.** **ALTERNATIVE C — Reveal only on accept.** Other / defer."}, {"id": "GM-12-Q10", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q10 — How long does an offer stay open?\n\n> **Also covers (22 Nov):** GM13-Q05 (GM-13), GM-18-Q22 (GM-18). Asked once, here.\n- **Old ID:** BK-Q05 (gap SH-07). **Status: VALIDATED — CHANGED (value now confirmed).**\n- **ACTUAL TODAY (validated):** `OFFER_EXPIRY_HOURS = 48` (`assignment.py`) — flat 48h, confirmed at head. Expiry is lazy (list + accept paths mark EXPIRED, `offers.py:182-186, :355-359`); **NO start-cap** is visible in any inspected file. Re-offering an existing PENDING offer refreshes rate/times but does **not** refresh `expires_at` — a re-offer does not extend the deadline. No offer-expiry beat job exists.\n- **RECOMMENDED:** Cap expiry at shift start (never past start), shorten for urgent shifts, and expire eagerly (scheduled job) rather than lazily. Severity: HIGH (an offer accepted after start, or a shift that looks staffed while its offer silently lapsed, breaks week-one operations). **ALTERNATIVE A — Keep current logic** (flat 48h, lazy). **ALTERNATIVE B — Cap at start, keep lazy expiry.** **ALTERNATIVE C — Per-shift expiry chosen by the pharmacy at offer time, capped at start.** Other / defer. Normal: 48h-style offer well before start. Edge: offer made 2h before start. Retry: accept-after-expiry → EXPIRED + 400 (validated). Payment: an expired offer never reaches payment. Web/Expo: UNKNOWN (countdown display not inspected)."}, {"id": "GM-12-Q12", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q12 — Can a pharmacy offer one shift to several workers at once?\n\n> **Also covers (22 Nov):** GM13-Q07 (GM-13). Asked once, here.\n- **Old ID:** BK-Q07. **Status: VALIDATED — CHANGED (payment-branch ambiguity resolved).**\n- **ACTUAL TODAY:** Multiple offers per slot can coexist. First acceptance wins via the slot lock — **in both branches now proven:** `slot_locked_for_shift_offer` (`assignment.py`) locks a slot if any assignment exists for slot/date OR any ACCEPTED_AWAITING_PAYMENT offer exists for the same slot/date (a whole-shift offer holds every slot). So a second accept IS blocked in the payment branch even though rivals are not expired there (Q15 refined). Rivals are expired at accept ONLY in the no-payment branch, same slot+date (`offers.py:437-448`); in the payment branch rivals stay PENDING (stale) until lazy expiry — and can still accept if the reservation expires unpaid.\n- **RECOMMENDED:** Allow parallel offers, but hold the slot from the FIRST acceptance (awaiting payment included — the lock already does this) and tell later workers \"this shift is on hold pending payment\" instead of leaving them with a live-looking PENDING offer. Severity: HIGH (stale PENDING offers + a rival accept after an unpaid reservation expires is confusing, even if the lock prevents a true double-booking). **ALTERNATIVE A — Keep current logic** (lock holds the slot; rivals left stale-PENDING). **ALTERNATIVE B — One offer at a time (serial).** **ALTERNATIVE C — Parallel offers, first PAID wins, others auto-expired at payment.** Other / defer."}, {"id": "GM-12-Q13", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q13 — What can a worker counter?\n- **Old ID:** BK-Q08. **Status: PARTLY VALIDATED.**\n- **ACTUAL TODAY (validated):** counter slots carry `proposed_rate`, `proposed_start_time`, `proposed_end_time`, `slot_date` (`counter_offers.py:165-170`) — rate and times are counterable. Submit-side validation (`base.py`): `require_public_ahpra` unconditional + role check (same no-op-for-non-public behaviour). Whether a counter rate must stay above the Award floor at submit is NOT verified; the floor IS enforced at accept for pharmacists (`engagement.py:_build_tfn_award_terms`: pharmacist must be ABOVE Award floor, else ValidationError; bonus forced 0; other staff `agreed_rate = max(posted, floor+bonus)`).\n- **RECOMMENDED:** Rate + start/end times only; dates only by choosing different slots; no counter on role, pharmacy, or payment type. Severity: MEDIUM. **ALTERNATIVE A — Keep current logic** (rate + times, as inspected). **ALTERNATIVE B — Rate only.** **ALTERNATIVE C — Rate + times + dates.** Other / defer."}, {"id": "GM-12-Q14", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q14 — If the pharmacy accepts a counter-offer, is the worker booked?\n- **Old ID:** BK-Q09. **Status: VALIDATED — STILL VALID (wording sharpened).**\n- **ACTUAL TODAY:** NO — accepting a counter creates fresh `ShiftOffer`(s) the worker must still confirm (`counter_offers.py:112-247`; `worker_confirmation_required: True`, `assignment_ids: []`). The worker then goes through §1.6 (terms + payment-or-finalize).\n- **RECOMMENDED:** Keep this two-step (pharmacy accepts counter → worker confirms offer). It protects the worker from being booked at terms they proposed but never re-confirmed. Severity: LOW (keep). **ALTERNATIVE A — Keep current logic (recommended).** **ALTERNATIVE B — Counter-accept books immediately** (faster, but the worker never re-confirms the final terms — legal risk). Other / defer. Edge: partial acceptance — counter stays PENDING until ALL slots have generated offers."}, {"id": "GM-12-Q15", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q15 — NEW: When payment is required, should the first acceptance hold the slot against rival offers?\n- **Old ID:** NEW (found in the prior trace; now refined). **Status: VALIDATED — CHANGED (refined by the slot lock).**\n- **ACTUAL TODAY:** `accept()` expires rival PENDING/ACCEPTED_AWAITING_PAYMENT offers for the same slot+date ONLY in the no-payment branch (`offers.py:437-448`). In the payment-required branch rivals are left PENDING. **But the slot lock closes the double-booking hole:** `slot_locked_for_shift_offer` (`assignment.py`) blocks a second accept while an ACCEPTED_AWAITING_PAYMENT offer holds the slot/date. What remains is a UX/state gap, not a double-booking gap: rivals sit PENDING (live-looking) until lazy expiry, and if the reservation expires unpaid a rival can still accept.\n- **RECOMMENDED:** Expire — or visibly mark \"on hold\" — rivals at FIRST acceptance in both branches; if the reservation then expires unpaid (D03), release back to the same audience. Severity: HIGH (as a state/UX gap; the double-booking itself is now proven blocked). **ALTERNATIVE A — Keep current logic** (lock holds the slot; rivals stale-PENDING). **ALTERNATIVE B — Allow parallel awaiting-payment accepts, first paid wins.** **ALTERNATIVE C — Block second accepts with \"on hold\" (no expiry until payment/expiry).** Other / defer."}, {"id": "GM-12-Q16", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q16 — NEW: Can the pharmacy withdraw a pending offer? What is the worker told?\n- **Old ID:** NEW. **Status: VALIDATED (absence in inspected code).**\n- **ACTUAL TODAY:** `ShiftOfferViewSet` has NO withdraw/cancel action (`offers.py:163-726`: list, retrieve, update, buzz, accept, decline, activate-payroll only). No withdraw path exists in `base.py` either (actions traced: escalate, counter_offers, accept_user, reveal_profile, manual_assign, generate_share_link). A pharmacy that changes its mind can only wait ~48h for expiry while the worker waits.\n- **RECOMMENDED:** Add manager withdraw of PENDING offers with a reason + worker notice (in-app + email), and log it. Severity: MEDIUM-HIGH. **ALTERNATIVE A — No withdraw (wait for expiry).** **ALTERNATIVE B — Withdraw with notice (recommended).** **ALTERNATIVE C — Withdraw silently.** Other / defer."}, {"id": "GM-12-Q17", "area": "GM-12", "plat": "Web + Expo", "md": "## GM-12-Q17 — NEW: Should withdrawing inter
