st month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"A post can advertise dates the worker removed from the live calendar. Fix or clearly eliminate the copied calendar before launch; a silent stale snapshot is misleading.","sources":[],"current":"Both apps copy availability into the pitch form when composing a talent post and save separate post dates. Later calendar edits do not automatically update that saved snapshot."},{"id":"LA-Q17","q":"Fix before launch? Match emails miss escalated shifts and reach unverified workers.","context":"Emails only go at posting straight to public, and recipients aren't filtered by Verified (AV-04).","gap":"AV-04","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Escalated vacancies miss outreach while unverified workers receive alerts they cannot act on. Fix both before launch; Instawork cascades outreach and researched credential gates support eligible recipients.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/2062210-selecting-pros-for-your-shift"}],"current":"Availability-match messages run when posting directly to public, not when shifts later escalate there. Recipients are filtered by active account, role and travel/availability, but not Verified; the same backend serves both apps."},{"id":"LA-Q18","q":"Fix before launch? Availability input has no validation.","context":"No check that start is before end, weekdays are 0–6, repeats have days, dates aren't past, or rows aren't duplicates (AV-05).","gap":"AV-05","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Client checks are already present but do not protect the API. Add server-side semantic validation before launch so malformed availability cannot corrupt matching; this is correctness work, not a new owner policy.","sources":[],"current":"Both apps check time order and repeat fields, but the API serializer has no semantic validation for time order, weekdays, recurrence, past dates or duplicates. Direct API calls bypass the client checks."}]}]}]}</script>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'launch-grill-v1';
  const rt = window.claude && window.claude.use ? window.claude : null;
  const content = document.getElementById('content');
  const nav = document.getElementById('area-nav');
  const byId = id => document.getElementById(id);
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
  let data;
  try {
    data = JSON.parse(byId('grill-data').textContent);
    if (!data || !Array.isArray(data.areas) || !Array.isArray(data.carried)) throw new Error('Expected areas and carried lists.');
  } catch (error) {
    content.innerHTML = '<div class="fatal" role="alert">The questionnaire could not load. Check the embedded JSON data.</div>';
    byId('save-status').textContent = 'Not saved: questionnaire data unavailable';
    byId('save-status').classList.add('error');
    return;
  }

  const questions = [];
  const questionMap = new Map();
  data.areas.forEach((area, areaIndex) => {
    area.steps.forEach((step, stepIndex) => {
      step.questions.forEach(q => {
        const entry = { q, area, step, areaIndex, stepIndex };
        questions.push(entry);
        questionMap.set(q.id, entry);
      });
    });
  });
  const blank = () => ({ choice: null, other: '', note: '', status: '', updatedAt: '' });
  let answers = Object.create(null);
  let position = { area: data.areas[0]?.id || 'review', step: 0 };
  let serverDb = null;
  let ready = false;
  let readOnly = false;
  let localError = '';
  let loadError = '';
  let savedAt = '';
  const jobs = new Map();
  const errors = new Map();
  const localOnly = new Set();

  // Ties retain the current version, so a late snapshot cannot undo an edit.
  function mergeAnswers(current, incoming) {
    const merged = Object.assign(Object.create(null), current);
    for (const [id, answer] of Object.entries(incoming)) {
      const previous = merged[id];
      if (!previous || Date.parse(answer.updatedAt) > Date.parse(previous.updatedAt)) merged[id] = { ...answer };
    }
    return merged;
  }

  function validateAnswer(id, value) {
    const entry = questionMap.get(id);
    if (!entry) throw new Error('Unknown question: ' + id);
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Invalid answer: ' + id);
    if (!(value.choice === null || value.choice === 'OTHER' || entry.q.options.some(o => o.key === value.choice))) throw new Error('Invalid choice: ' + id);
    if (typeof value.other !== 'string' || typeof value.note !== 'string') throw new Error('Invalid text fields: ' + id);
    if (!['', 'answered', 'later', 'skip'].includes(value.status)) throw new Error('Invalid status: ' + id);
    if (typeof value.updatedAt !== 'string' || !/^\d{4}-\d{2}-\d{2}T/.test(value.updatedAt) || !Number.isFinite(Date.parse(value.updatedAt))) throw new Error('Invalid updatedAt: ' + id);
    return { choice: value.choice, other: value.other, note: value.note, status: value.status, updatedAt: value.updatedAt };
  }

  function validateAnswers(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Expected an answers object.');
    const valid = Object.create(null);
    for (const [id, answer] of Object.entries(value)) valid[id] = validateAnswer(id, answer);
    return valid;
  }

  function readLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const stored = JSON.parse(raw);
      answers = validateAnswers(stored.answers);
      if (stored.position && typeof stored.position.area === 'string' && Number.isInteger(stored.position.step)) position = stored.position;
      Object.keys(answers).forEach(id => localOnly.add(id));
    } catch (error) {
      localError = error.name === 'SecurityError' ? 'device storage blocked' : 'saved device data unavailable';
    }
  }

  function mirrorLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers, position }));
      localError = '';
    } catch (error) {
      localError = error.name === 'QuotaExceededError' ? 'device storage full' : 'device storage blocked';
    }
    updateSaveStatus();
  }

  function updateSaveStatus() {
    const pill = byId('save-status');
    const problem = readOnly ? 'read-only' : localError || errors.values().next().value || loadError;
    const pending = [...jobs.values()].some(job => job.timer !== null || job.inFlight || job.due);
    let label;
    if (problem) label = 'Not saved: ' + problem;
    else if (pending && (!ready || serverDb)) label = 'Saving...';
    else if (!serverDb || localOnly.size) label = 'Saved on this device only';
    else label = 'Saved ' + new Date(savedAt || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    if (pill.textContent !== label) pill.textContent = label;
    pill.classList.toggle('error', Boolean(problem));
    pill.title = problem ? 'Your edits remain in this session. Device storage and server saves are handled separately.' : 'Device storage is mirrored on every edit. Server saves are used when available.';
    byId('retry-save').hidden = readOnly || !(errors.size || localError);
  }

  function queueSave(id) {
    localOnly.add(id);
    if (readOnly || (ready && !serverDb)) { updateSaveStatus(); return; }
    let job = jobs.get(id);
    if (!job) {
      job = { latest: null, timer: null, due: false, inFlight: false };
      jobs.set(id, job);
    }
    job.latest = { ...answers[id] };
    job.due = false;
    clearTimeout(job.timer);
    job.timer = setTimeout(() => {
      job.timer = null;
      job.due = true;
      flushSave(id);
    }, 800);
    updateSaveStatus();
  }

  async function flushSave(id) {
    const job = jobs.get(id);
    if (!job || !ready || !serverDb || readOnly || job.inFlight || !job.due) return;
    const payload = { ...job.latest };
    job.due = false;
    job.inFlight = true;
    updateSaveStatus();
    let success = false;
    try {
      for (let attempt = 0; ; attempt++) {
        if (readOnly) return;
        try {
          await serverDb.doc('answers/' + id).set(payload);
          success = true;
          break;
        } catch (error) {
          if (error.code === 'invalid_argument') {
            readOnly = true;
            for (const queued of jobs.values()) { clearTimeout(queued.timer); queued.timer = null; queued.due = false; }
            throw error;
          }
          if (error.code === 'unavailable' && attempt === 0) {
            await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 1000));
            continue;
          }
          throw error;
        }
      }
      errors.delete(id);
      savedAt = new Date().toISOString();
      if (answers[id]?.updatedAt === payload.updatedAt) localOnly.delete(id);
    } catch (error) {
      errors.set(id, error.code === 'invalid_argument' ? 'read-only' : String(error.code || 'server save failed'));
    } finally {
      job.inFlight = false;
      if (success && job.latest.updatedAt === payload.updatedAt) {
        clearTimeout(job.timer);
        jobs.delete(id);
      }
      updateSaveStatus();
      // A newer edit waits for its own debounce and never overlaps this write.
      if (jobs.has(id) && job.due && !readOnly) flushSave(id);
    }
  }

  function editAnswer(id, patch) {
    const previous = answers[id] || blank();
    const timestamp = Math.max(Date.now(), (Date.parse(previous.updatedAt) || 0) + 1);
    answers[id] = { ...previous, ...patch, updatedAt: new Date(timestamp).toISOString() };
    mirrorLocal();
    queueSave(id);
    refreshMetrics();
    syncQuestion(id);
  }

  function isAnswered(q) {
    const answer = answers[q.id];
    return Boolean(answer && answer.status === 'answered' && answer.choice && (answer.choice !== 'OTHER' || answer.other.trim()));
  }

  function answerLabel(q) {
    const answer = answers[q.id];
    if (!answer?.choice) return 'No choice yet';
    if (answer.choice === 'OTHER') return answer.other.trim() ? 'Other: ' + answer.other.trim() : 'Other — add your answer';
    const option = q.options.find(o => o.key === answer.choice);
    if (option?.key === 'KEEP') return option.label;
    return option ? option.key + ': ' + option.label : 'No choice yet';
  }

  function statusLabel(q) {
    const answer = answers[q.id];
    if (answer?.status === 'later') return 'Ask me later';
    if (answer?.status === 'skip') return 'Skipped';
    if (isAnswered(q)) return 'Answered';
    return q.required === false ? 'Optional · unanswered' : 'Required · unanswered';
  }

  function safeURL(value) {
    try {
      const url = new URL(value);
      return ['https:', 'http:'].includes(url.protocol) ? url.href : null;
    } catch (_) { return null; }
  }

  function questionHTML(q) {
    const e = escapeHTML;
    const answer = answers[q.id] || blank();
    const id = e(q.id);
    const options = [...q.options.filter(o => o.key === 'KEEP'), ...q.options.filter(o => o.key !== 'KEEP'), { key: 'OTHER', label: 'Other (describe)', detail: 'None of these fit: describe what you want.' }];
    const sources = (q.sources || []).map(source => {
      const url = safeURL(source.url);
      return url ? `<a href="${e(url)}" target="_blank" rel="noopener">${e(source.name)}</a>` : `<span>${e(source.name)}</span>`;
    }).join('');
    const canRecommend = q.options.some(o => o.key === q.rec);
    return `<section class="question" id="card-${id}" aria-labelledby="heading-${id}">
      <div class="chips"><span class="chip id">${id}</span><span class="chip">Gap ${e(q.gap)}</span><span class="chip">${e(q.type)}</span><span class="required-flag" id="flag-${id}" ${isAnswered(q) ? 'hidden' : ''}>${e(statusLabel(q))}</span></div>
      <h3 id="heading-${id}" tabindex="-1">${e(q.q)}</h3>
      <p class="context" id="context-${id}">${e(q.context)}</p>
      <div class="current" id="current-${id}" hidden><span class="current-label">How it works today</span><p class="current-text"></p></div>
      <fieldset aria-describedby="context-${id}"><legend class="sr-only">Choose an answer for ${id}</legend><div class="options">
        ${options.map(option => `<label class="option ${answer.choice === option.key ? 'selected' : ''}" for="choice-${id}-${e(option.key)}"><input type="radio" id="choice-${id}-${e(option.key)}" name="choice-${id}" value="${e(option.key)}" data-question="${id}" data-field="choice" ${answer.choice === option.key ? 'checked' : ''}><span class="option-copy"><span class="option-title">${option.key !== 'OTHER' ? `<span class="option-key">${e(option.key)}</span>` : ''}${e(option.label)}</span><span class="option-detail">${e(option.detail)}</span></span></label>`).join('')}
      </div></fieldset>
      <div class="field" id="other-wrap-${id}" ${answer.choice !== 'OTHER' ? 'hidden' : ''}><label for="other-${id}">Describe your answer</label><textarea id="other-${id}" data-question="${id}" data-field="other" aria-describedby="other-help-${id}" ${answer.choice === 'OTHER' ? 'aria-required="true"' : ''}>${e(answer.other)}</textarea><p class="helper" id="other-help-${id}">Add your answer to complete this question.</p></div>
      <div class="field"><label for="note-${id}">Your note / explanation</label><textarea id="note-${id}" data-question="${id}" data-field="note" placeholder="Optional: what should we know?">${e(answer.note)}</textarea></div>
      <div class="recommendation"><strong>Recommended: ${e(q.rec || 'No recommendation')}</strong><p>${e(q.recWhy)}</p>${sources ? `<div class="source-links" aria-label="Recommendation sources">${sources}</div>` : ''}<button type="button" data-action="recommend" data-id="${id}" ${canRecommend ? '' : 'disabled'}>Use recommendation</button></div>
      <div class="status-field"><label for="status-${id}">Question status</label><select id="status-${id}" data-question="${id}" data-field="status"><option value="" ${answer.status === '' ? 'selected' : ''}>Not answered yet</option><option value="answered" ${answer.status === 'answered' ? 'selected' : ''}>Answered</option><option value="later" ${answer.status === 'later' ? 'selected' : ''}>Ask me later</option><option value="skip" ${answer.status === 'skip' ? 'selected' : ''}>Skip</option></select></div>
    </section>`;
  }

  function syncQuestion(id) {
    const entry = questionMap.get(id);
    const card = byId('card-' + id);
    if (!entry || !card) return;
    const answer = answers[id] || blank();
    card.querySelectorAll('input[type="radio"]').forEach(input => {
      input.checked = input.value === answer.choice;
      input.closest('.option').classList.toggle('selected', input.checked);
    });
    const other = byId('other-' + id);
    byId('other-wrap-' + id).hidden = answer.choice !== 'OTHER';
    other.setAttribute('aria-required', answer.choice === 'OTHER' ? 'true' : 'false');
    if (document.activeElement !== other) other.value = answer.other;
    const note = byId('note-' + id);
    if (document.activeElement !== note) note.value = answer.note;
    byId('status-' + id).value = answer.status;
    const flag = byId('flag-' + id);
    flag.textContent = statusLabel(entry.q);
    flag.hidden = isAnswered(entry.q);
  }

  function renderNav() {
    const e = escapeHTML;
    nav.innerHTML = data.areas.map(area => `<button type="button" class="nav-item" data-area="${e(area.id)}" ${position.area === area.id ? 'aria-current="page"' : ''}><span class="nav-name">${e(area.name)}</span><span class="nav-count" data-area-count="${e(area.id)}"></span></button>`).join('') +
      `<div class="nav-extra"><button type="button" class="nav-item" data-area="carried" ${position.area === 'carried' ? 'aria-current="page"' : ''}><span class="nav-name">Already decided</span><span class="nav-count">${data.carried.length}</span></button><button type="button" class="nav-item" data-area="review" ${position.area === 'review' ? 'aria-current="page"' : ''}><span class="nav-name">Review &amp; export</span></button></div>`;
  }

  function refreshMetrics() {
    const count = questions.filter(entry => isAnswered(entry.q)).length;
    const percent = questions.length ? Math.round(count / questions.length * 100) : 0;
    byId('progress-text').textContent = count + ' / ' + questions.length + ' answered';
    byId('progress-percent').textContent = percent + '%';
    byId('progress-fill').style.width = percent + '%';
    byId('overall-progress').setAttribute('aria-valuenow', percent);
    byId('overall-progress').setAttribute('aria-valuetext', count + ' of ' + questions.length + ' answered');
    nav.querySelectorAll('[data-area-count]').forEach(node => {
      const list = questions.filter(entry => entry.area.id === node.dataset.areaCount);
      node.textContent = list.filter(entry => isAnswered(entry.q)).length + ' / ' + list.length;
    });
  }

  function renderArea(area) {
    const e = escapeHTML;
    const step = area.steps[position.step];
    if (!step) { content.innerHTML = `<h2 id="view-title" tabindex="-1">${e(area.name)}</h2><p class="empty">There are no steps in this area.</p>`; return; }
    const index = data.areas.indexOf(area);
    const last = position.step === area.steps.length - 1;
    const lastArea = index === data.areas.length - 1;
    content.innerHTML = `<h2 id="view-title" tabindex="-1">${e(area.name)}</h2><p class="area-summary">${e(area.summary)}</p>
      <div class="step-heading"><div class="step-count">Step ${position.step + 1} of ${area.steps.length}</div><h3>${e(step.name)}</h3><p>${e(step.why)}</p></div>
      ${step.questions.length ? step.questions.map(questionHTML).join('') : '<p class="empty">No questions in this step. Continue when you’re ready.</p>'}
      <div class="step-footer"><span class="footer-count">Step ${position.step + 1} of ${area.steps.length}</span><div class="step-actions"><button type="button" data-action="previous" ${index === 0 && position.step === 0 ? 'disabled' : ''}>Previous</button><button type="button" class="primary" data-action="next">${last ? (lastArea ? 'Review answers' : 'Next area') : 'Next step'}</button></div></div>`;
    // "current" is set via textContent so the box never parses markup.
    step.questions.forEach(q => {
      const box = byId('current-' + q.id);
      const text = typeof q.current === 'string' ? q.current.trim() : '';
      box.querySelector('.current-text').textContent = text;
      box.hidden = !text;
    });
  }

  function renderCarried() {
    const e = escapeHTML;
    content.innerHTML = `<h2 id="view-title" tabindex="-1">Already decided</h2><p class="area-summary">These decisions are carried forward for reference. They’re read-only.</p>` +
      (data.carried.length ? data.carried.map(item => `<section class="decided-item"><span class="chip id">${e(item.id)}</span><h3>${e(item.label)}</h3><p>${e(item.answer)}</p></section>`).join('') : '<p class="empty">No decisions have been carried forward.</p>');
  }

  function reviewGroupsHTML() {
    const e = escapeHTML;
    return data.areas.map(area => {
      const list = questions.filter(entry => entry.area.id === area.id).sort((a, b) => Number(isAnswered(a.q)) - Number(isAnswered(b.q)));
      return `<section class="review-group"><h3>${e(area.name)}</h3>${list.map(({q}) => `<article class="review-item ${isAnswered(q) ? '' : 'unanswered'}"><span class="chip id">${e(q.id)}</span><span class="review-status">${e(statusLabel(q))}</span><h4>${e(q.q)}</h4><p class="answer-label">${e(answerLabel(q))}</p>${answers[q.id]?.note ? `<p>Note: ${e(answers[q.id].note)}</p>` : ''}<button type="button" data-action="open-question" data-id="${e(q.id)}">Open question</button></article>`).join('') || '<p>No questions in this area.</p>'}</section>`;
    }).join('');
  }

  function reviewSummary() {
    const remaining = questions.filter(entry => !isAnswered(entry.q)).length;
    return remaining ? `${remaining} question${remaining === 1 ? '' : 's'} still open. Unanswered questions come first in each area.` : 'Every question is answered. Review your decisions below.';
  }

  function renderReview() {
    const e = escapeHTML;
    content.innerHTML = `<h2 id="view-title" tabindex="-1">Review &amp; export</h2><p class="area-summary" id="review-summary">${reviewSummary()}</p>
      <div class="review-actions"><button type="button" class="primary" id="copy-answers">Copy all answers</button><button type="button" id="export-json">Export JSON</button></div><p class="message" id="transfer-message" role="status" aria-live="polite"></p>
      <section class="transfer-panel" id="output-panel" hidden><h3 id="output-title">Your export</h3><label for="export-output" class="sr-only">Selectable export text</label><textarea id="export-output" readonly spellcheck="false"></textarea><button type="button" id="select-export">Select all text</button></section>
      ${reviewGroupsHTML()}
      <section class="transfer-panel"><h3>Restore from JSON</h3><p class="area-summary">Paste an exported file below. Only newer answers replace your current answers.</p><label for="import-json">Import JSON</label><textarea id="import-json" spellcheck="false" placeholder="Paste your exported JSON here" aria-describedby="import-message"></textarea><button type="button" id="import-answers">Import answers</button><p class="message" id="import-message" role="status" aria-live="polite"></p></section>`;
  }

  function normalizePosition() {
    if (position.area === 'review' || position.area === 'carried') return;
    const area = data.areas.find(a => a.id === position.area);
    if (!area) { position = { area: data.areas[0]?.id || 'review', step: 0 }; return; }
    position.step = Math.max(0, Math.min(position.step, Math.max(0, area.steps.length - 1)));
  }

  function render() {
    normalizePosition();
    renderNav();
    if (position.area === 'review') renderReview();
    else if (position.area === 'carried') renderCarried();
    else renderArea(data.areas.find(a => a.id === position.area));
    refreshMetrics();
    updateSaveStatus();
  }

  function navigate(area, step = 0, questionId = null) {
    position = { area, step };
    normalizePosition();
    mirrorLocal();
    render();
    // Native focus scrolling keeps the new heading below the sticky header.
    const target = byId(questionId ? 'heading-' + questionId : 'view-title');
    if (target) {
      target.style.scrollMarginTop = (document.querySelector('.header').offsetHeight + 24) + 'px';
      target.focus();
    }
  }

  function moveStep(direction) {
    const areaIndex = data.areas.findIndex(a => a.id === position.area);
    const area = data.areas[areaIndex];
    if (!area) return;
    const step = position.step + direction;
    if (step >= 0 && step < area.steps.length) navigate(area.id, step);
    else if (direction > 0) navigate(data.areas[areaIndex + 1]?.id || 'review');
    else if (areaIndex > 0) { const previous = data.areas[areaIndex - 1]; navigate(previous.id, Math.max(0, previous.steps.length - 1)); }
  }

  function exportObject() {
    return {
      exportedAt: new Date().toISOString(),
      answers: JSON.parse(JSON.stringify(answers)),
      questions: questions.filter(({q}) => isAnswered(q)).map(({q, area}) => ({ id: q.id, area: area.name, q: q.q, choice: answers[q.id].choice, chosenOptionLabel: q.options.find(o => o.key === answers[q.id].choice)?.label || answers[q.id].other.trim() }))
    };
  }

  function allAnswerText() {
    const lines = [data.title || 'Launch Grill', 'Exported ' + new Date().toISOString()];
    data.areas.forEach(area => {
      lines.push('', area.name);
      questions.filter(entry => entry.area.id === area.id).forEach(({q}) => {
        lines.push('', q.id + ' · ' + q.q, 'Answer: ' + answerLabel(q), 'Status: ' + statusLabel(q));
        if (answers[q.id]?.note) lines.push('Note: ' + answers[q.id].note);
      });
    });
    lines.push('', 'Already decided');
    data.carried.forEach(item => lines.push(item.id + ' · ' + item.label, item.answer));
    return lines.join('\n');
  }

  function showOutput(text, title, message) {
    byId('output-panel').hidden = false;
    byId('output-title').textContent = title;
    byId('export-output').value = text;
    byId('transfer-message').textContent = message;
    byId('export-output').focus();
    byId('export-output').select();
  }

  const downloadsReady = (async () => {
    const dl = rt ? await rt.use('downloads').catch(() => null) : null;
    return dl;
  })().catch(() => null);

  async function copyAnswers() {
    const text = allAnswerText();
    try {
      await navigator.clipboard.writeText(text);
      if (position.area === 'review') byId('transfer-message').textContent = 'All answers copied.';
    } catch (_) {
      if (position.area === 'review') showOutput(text, 'Copy your answers', 'Clipboard access is unavailable. Select the text below and copy it.');
    }
  }

  async function exportJSON() {
    const button = byId('export-json');
    const exportObj = exportObject();
    const json = JSON.stringify(exportObj, null, 2);
    button.disabled = true;
    try {
      const dl = await downloadsReady;
      if (!dl) {
        if (position.area === 'review') showOutput(json, 'Your JSON export', 'Select and copy this JSON to keep a backup.');
        return;
      }
      await dl.save({ filename: 'launch-grill-answers.json', data: JSON.stringify(exportObj, null, 2) });
      if (position.area === 'review') byId('transfer-message').textContent = 'JSON export sent to downloads.';
    } catch (_) {
      if (position.area === 'review') showOutput(json, 'Your JSON export', 'The download was declined or unavailable. You can copy the JSON below.');
    } finally {
      button.disabled = false;
    }
  }

  function importJSON() {
    const message = byId('import-message');
    try {
      const parsed = JSON.parse(byId('import-json').value);
      const imported = validateAnswers(parsed.answers);
      const merged = mergeAnswers(answers, imported);
      const changed = Object.keys(imported).filter(id => !answers[id] || merged[id].updatedAt !== answers[id].updatedAt);
      answers = merged;
      mirrorLocal();
      changed.forEach(queueSave);
      render();
      byId('import-message').textContent = changed.length + ' newer answer' + (changed.length === 1 ? '' : 's') + ' restored.';
      byId('import-answers').focus();
    } catch (error) {
      message.textContent = 'Could not import: ' + error.message;
      message.classList.add('error');
    }
  }

  nav.addEventListener('click', event => {
    const button = event.target.closest('button[data-area]');
    if (button) navigate(button.dataset.area);
  });
  content.addEventListener('input', event => {
    const field = event.target;
    if (field.dataset.question && ['note', 'other'].includes(field.dataset.field)) editAnswer(field.dataset.question, { [field.dataset.field]: field.value });
  });
  content.addEventListener('change', event => {
    const field = event.target;
    if (!field.dataset.question) return;
    if (field.dataset.field === 'choice') {
      editAnswer(field.dataset.question, { choice: field.value, status: 'answered' });
      if (field.value === 'OTHER') byId('other-' + field.dataset.question).focus();
    } else if (field.dataset.field === 'status') editAnswer(field.dataset.question, { status: field.value });
  });
  content.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    const id = button.dataset.id;
    if (button.dataset.action === 'recommend') editAnswer(id, { choice: questionMap.get(id).q.rec, status: 'answered' });
    else if (button.dataset.action === 'next') moveStep(1);
    else if (button.dataset.action === 'previous') moveStep(-1);
    else if (button.dataset.action === 'open-question') {
      const entry = questionMap.get(id);
      navigate(entry.area.id, entry.stepIndex, id);
    } else if (button.id === 'copy-answers') copyAnswers();
    else if (button.id === 'export-json') exportJSON();
    else if (button.id === 'import-answers') importJSON();
    else if (button.id === 'select-export') { byId('export-output').focus(); byId('export-output').select(); }
  });
  byId('retry-save').addEventListener('click', () => {
    mirrorLocal();
    if (!ready || !serverDb || readOnly) return;
    for (const id of errors.keys()) queueSave(id);
    updateSaveStatus();
  });

  async function connect() {
    try {
      const db = rt ? await rt.use('db').catch(() => null) : null;
      serverDb = db;
      if (db !== null) {
        try {
          const snap = await db.collection('answers').get();
          const incoming = Object.create(null);
          for (const doc of snap.docs) {
            if (!questionMap.has(doc.id)) continue;
            try { incoming[doc.id] = validateAnswer(doc.id, doc.data()); }
            catch (_) { loadError = 'invalid saved answer'; }
          }
          answers = mergeAnswers(answers, incoming);
          for (const [id, answer] of Object.entries(incoming)) {
            if (answers[id].updatedAt === answer.updatedAt) localOnly.delete(id);
          }
          // A newer remote answer cancels an edit still waiting for initial loading.
          for (const [id, job] of jobs) {
            if (Date.parse(answers[id].updatedAt) > Date.parse(job.latest.updatedAt)) {
              clearTimeout(job.timer);
              jobs.delete(id);
            }
          }
          savedAt = new Date().toISOString();
          mirrorLocal();
          // Update fields in place while typing; never replace a focused textarea.
          if (position.area === 'review') {
            // Review has editable import text. Refresh only its answer groups.
            const scratch = document.createElement('div');
            scratch.innerHTML = reviewGroupsHTML();
            const updated = scratch.querySelectorAll('.review-group');
            content.querySelectorAll('.review-group').forEach((group, index) => group.replaceWith(updated[index]));
            byId('review-summary').textContent = reviewSummary();
          } else questions.forEach(({q}) => syncQuestion(q.id));
          refreshMetrics();
        } catch (error) {
          loadError = String(error.code || 'server load failed');
          if (error.code === 'invalid_argument') readOnly = true;
        }
      }
    } catch (_) {
      serverDb = null;
    } finally {
      ready = true;
      if (!serverDb) { for (const job of jobs.values()) clearTimeout(job.timer); jobs.clear(); }
      else for (const [id, job] of jobs) if (job.due) flushSave(id);
      updateSaveStatus();
    }
  }

  function selfTest() {
    const old = { ...blank(), choice: 'A', updatedAt: '2026-01-01T10:00:00.000Z' };
    const fresh = { ...old, choice: 'B', updatedAt: '2026-01-01T11:00:00.000Z' };
    const results = [
      mergeAnswers({ Q: old }, { Q: fresh }).Q.choice === 'B',
      mergeAnswers({ Q: fresh }, { Q: old }).Q.choice === 'B',
      mergeAnswers({}, { Q: fresh }).Q.choice === 'B',
      mergeAnswers({ Q: old }, { Q: { ...old, choice: 'B' } }).Q.choice === 'A',
      old.choice === 'A'
    ];
    results.forEach((pass, index) => console.assert(pass, 'Merge assertion ' + (index + 1)));
    console.log('selfTest: ' + (results.every(Boolean) ? 'PASS' : 'FAIL'));
    return results.every(Boolean);
  }

  readLocal();
  document.querySelector('.sidebar-note').textContent = data.intro || 'Work in small sittings. You can leave a question for later and keep going.';
  byId('page-title').textContent = data.title || 'Launch Grill';
  document.title = data.title || 'Launch Grill';
  render();
  if (location.hash === '#selftest') selfTest();
  connect();
})();
</script>
