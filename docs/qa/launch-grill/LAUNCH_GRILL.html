. Instawork lets workers set schedule notifications; email for money and cancels, push for the rest.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/12995914-how-do-i-search-for-shifts"}],"current":"In-app, push and email exist and each feature picks its own; offer and confirmation events send an in-app notice plus email, and pre-shift reminders are email only."},{"id":"AG-Q11","q":"Which shifts get pre-shift reminders, and when?","context":"Reminders come from real assignments, so reservations get none. Cancelled assignments have no state to stop reminders (D12).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"One email about 12 hours before each assigned slot."},{"key":"A","label":"Confirmed only, 24h and 2h before","detail":"One per worker per date."},{"key":"B","label":"Confirmed only, 24h before","detail":"Fewer messages."},{"key":"C","label":"Also reservations","detail":"Reminds about unpaid holds."}],"rec":"A","recWhy":"Today one email 12 hours out is easy to miss and has no closer nudge. Two reminders (24h and 2h) cut no-shows without noise; Locum Organiser confirms each session.","sources":[{"name":"Locum Organiser","url":"https://locumorganiser.com/help/booking-confirmations/"}],"current":"An hourly job emails every booked or rostered worker once, about 12 hours before each slot. Reservations get none, and there is no push or second reminder."},{"id":"AG-Q12","q":"If a shift changes inside 12 hours of start, what happens to reminders?","context":"Reminder suppression for late changes is not defined (D12).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"No late-change alert; reminder uses current slot time."},{"key":"A","label":"Instant alert; old reminders cancelled","detail":"New reminder uses new details."}],"rec":"A","recWhy":"A change made after the 12-hour email has gone gets no alert, so the worker keeps the old time. Locumate treats accepted-shift changes as needing the locum's attention.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"}],"current":"No special handling: the reminder reads the slot's current time when it fires, and booked slots can only be re-timed in the roster editor. There is no instant alert for late changes."}]}]},{"id":"cancel","name":"Cancellations & no-shows","summary":"Every way a booked shift can fall over, and what follows.","steps":[{"id":"CX-S1","name":"Pharmacy cancels","why":"Sets the launch scope and how the owner fee table is used.","questions":[{"id":"CX-Q01","q":"What cancellation can launch, given fees are not yet enforceable?","context":"A confirmed outside booking cannot be cancelled by anyone. No cancelled state, no endpoint; worker requests cover roster work only (SH-01).","gap":"SH-01","type":"decision","options":[{"key":"A","label":"Support-only cancel, no fees","detail":"Admin action with reason and audit."},{"key":"B","label":"Owner cancel plus worker request","detail":"Notices sent; fee shown but not charged."},{"key":"C","label":"Hold launch until fees enforceable","detail":"Delays launch."}],"rec":"B","recWhy":"Neither side has an audited external-booking cancellation action today. Build owner cancellation and manager-reviewed worker requests with notices before relying on the Hireup/Relief Buddy cancellation pattern; fee estimates must remain explicitly non-chargeable.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360031493231-Statement-on-Cancellations"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Not built yet."},{"id":"CX-Q02","q":"Who receives the owner cancellation fee?","context":"P09 set a percentage of agreed wages but no recipient. F01 keeps booking fee and worker pay separate.","gap":"","type":"decision","options":[{"key":"A","label":"The worker, as cancellation pay","detail":"Compensates the lost shift."},{"key":"B","label":"The platform","detail":"Worker gets nothing."},{"key":"C","label":"Split worker and platform","detail":"Harder to explain."}],"rec":"A","recWhy":"No approved cancellation-pay recipient or distribution flow exists. Locumate and Hireup compensate the worker for lost work, so allocate the proposed owner fee to the worker while keeping platform booking fees separate.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360031493231-Statement-on-Cancellations"}],"current":"Not built yet."},{"id":"CX-Q03","q":"If the pharmacy cancels an unpaid reservation, is any fee due?","context":"D01 makes acceptance a reservation; payment confirms. The register asks if an unpaid reservation can attract a fee.","gap":"","type":"decision","options":[{"key":"A","label":"No fee; worker notified","detail":"Not confirmed, so no booking to cancel."},{"key":"B","label":"Fee bands apply","detail":"Treat it like a confirmed booking."}],"rec":"A","recWhy":"There is no pharmacy cancellation transition for unpaid reservations. No fee is the consistent proposed rule because D01 makes payment the confirmation point; the research does not establish a directly equivalent competitor prepayment model.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"}],"current":"Not built yet."},{"id":"CX-Q04","q":"At exactly 72h, 24h, 12h or 2h, which band applies?","context":"Engineering proposed the milder band at each boundary, using the pharmacy's local time for each date. Not owner-approved yet.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Use the milder adjacent band at exact boundaries; keep the calculator preview-only."},{"key":"B","label":"Stricter band","detail":"Exactly 24h = 15%."}],"rec":"KEEP","recWhy":"KEEP: the existing calculation resolves exact boundaries clearly and favours the payer at the edge. The research identifies ambiguous competitor boundaries; keeping this preview rule is safe and does not authorise charging.","sources":[{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"The preview-only fee calculator uses the milder band at exactly 72, 24, 12 and 2 hours, with 30% at or after start. It accepts timezone-aware timestamps but is not connected to cancellation or charging screens."}]},{"id":"CX-S2","name":"Worker cancels","why":"R04 needs an 'enough window' and an emergency path.","questions":[{"id":"CX-Q05","q":"How much notice counts as 'enough window' for a normal manager approval?","context":"R04 needs manager approval when enough notice remains; R04D adds emergency escalation near start. The window is not set.","gap":"","type":"decision","options":[{"key":"A","label":"72 hours or more","detail":"Matches where owner fees start."},{"key":"B","label":"24 hours or more","detail":"Shorter normal path."},{"key":"C","label":"7 days or more","detail":"Most requests become emergencies."}],"rec":"A","recWhy":"No notice-based normal-versus-emergency approval window is implemented. Seventy-two hours is a proposed launch threshold informed by Relief Buddy, rather than a verified universal competitor rule; it aligns with the selected owner fee line.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-do-i-cancel-a-shift"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Not built yet."},{"id":"CX-Q06","q":"Inside the window, who is alerted and how fast?","context":"R04D: manager approval always, emergency escalation near start. Recipients and timing are open.","gap":"","type":"decision","options":[{"key":"A","label":"Manager and owner, push every 15 min","detail":"Until someone answers."},{"key":"B","label":"A, plus platform support after 30 min","detail":"Support chases the pharmacy; it does not approve."},{"key":"C","label":"Manager only","detail":"One person, no backup."}],"rec":"B","recWhy":"There is no timed emergency cancellation escalation. Existing roster emails are not repeated emergency notices; add manager/owner alerts and support follow-up without giving support approval authority. The 15/30-minute timings are proposed, not verified competitor standards.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"},{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"}],"current":"Not built yet."},{"id":"CX-Q07","q":"If no manager answers before start and the worker doesn't come, what is it?","context":"The worker stays assigned until approval (R04D). No rule covers an unanswered request.","gap":"","type":"decision","options":[{"key":"A","label":"Late cancel, not a no-show","detail":"Reviewed as a late cancellation with the request as evidence."},{"key":"B","label":"No-show","detail":"Ignores that they asked in time."}],"rec":"A","recWhy":"There is no classification for an unanswered external cancellation request. Preserve logged notice for platform review; Nursa distinguishes advance in-app cancellation from silence, but treating an unanswered approval request as late cancellation is a proposed local rule.","sources":[{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"}],"current":"Not built yet."}]},{"id":"CX-S3","name":"Mutual and emergency","why":"P11 waivers need proof and an approver.","questions":[{"id":"CX-Q08","q":"How is a mutually agreed cancellation proven and approved?","context":"P11 exempts mutual cancels, but proof and approver are pending. Mutual must not be logged as an incident.","gap":"","type":"decision","options":[{"key":"A","label":"Both tap 'agree' in app","detail":"Logged with time; waiver applies automatically."},{"key":"B","label":"Manager says so","detail":"One-sided."},{"key":"C","label":"Support reviews every one","detail":"Slow."}],"rec":"A","recWhy":"No two-party cancellation consent or automatic waiver record exists. Both parties agreeing in the app provides stronger evidence than a manager-only assertion; Hireup supports mutually agreed rescheduling, not a verified identical two-tap waiver workflow.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360031493231-Statement-on-Cancellations"}],"current":"Not built yet."},{"id":"CX-Q09","q":"What evidence may support an illness or emergency exemption?","context":"P11 permits exemptions. No evidence intake, retention or restricted review process exists.","gap":"","type":"decision","options":[{"key":"A","label":"Reason first; evidence if disputed","detail":"Support requests only the minimum needed."},{"key":"B","label":"Evidence within 48 hours","detail":"Medical certificate or similar for every claim."},{"key":"C","label":"No evidence ever","detail":"Platform cannot resolve contested exemptions."}],"rec":"A","recWhy":"Health evidence is sensitive information. Collect only what is reasonably necessary, restrict it to support, and destroy or de-identify it when no longer needed.","sources":[{"name":"OAIC APP 3","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-3-app-3-collection-of-solicited-personal-information"},{"name":"OAIC APP 11","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-11-app-11-security-of-personal-information"}],"current":"Not built yet."},{"id":"CX-Q10","q":"Can a pharmacy emergency (closure, outage) waive the owner fee?","context":"P11 gives owners their own exemptions; none are defined.","gap":"","type":"decision","options":[{"key":"A","label":"Yes, support waives with evidence","detail":"Worker is told the reason."},{"key":"B","label":"Never","detail":"Fee always applies."}],"rec":"A","recWhy":"No owner-emergency waiver process exists. Evidence-based support review follows the exception handling described by Pharmacy SOS; publish the criteria and tell the worker rather than silently removing compensation.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"},{"name":"Instawork","url":"https://help.instawork.com/en/articles/2062211-what-happens-if-i-need-to-cancel-my-scheduled-professional-s"}],"current":"Not built yet."}]},{"id":"CX-S4","name":"No-show and late","why":"Separates late, absent and accidental.","questions":[{"id":"CX-Q11","q":"When does a missing worker become a no-show?","context":"There is no no-show state. Attendance and timesheets live in a separate domain (D13).","gap":"","type":"decision","options":[{"key":"A","label":"30 min after start, no contact","detail":"Pharmacy can repost sooner."},{"key":"B","label":"60 min after start, no contact","detail":"Instawork's automatic line."},{"key":"C","label":"Manager reports any time after start","detail":"No fixed line."}],"rec":"A","recWhy":"There is no no-show classification or timer. A 30-minute threshold is a proposed pharmacy-specific default, not Instawork parity: the research documents its 60-minute automatic rule and earlier business intervention when contact is absent.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/6122001-cancellation-policy"},{"name":"Instawork","url":"https://help.instawork.com/en/articles/3614637-what-happens-if-i-m-late-to-my-shift"}],"current":"Not built yet."},{"id":"CX-Q12","q":"How is late arrival treated?","context":"No lateness rule exists.","gap":"","type":"decision","options":[{"key":"A","label":"15+ min late is logged, not an incident","detail":"Shown on reliability; a 'running late' message with ETA."},{"key":"B","label":"Late counts as an incident","detail":"Same ladder as no-shows."}],"rec":"A","recWhy":"Attendance timestamps exist, but no booking lateness classification, running-late ETA or reliability treatment is implemented. Separate lateness from no-shows, as Instawork does; the proposed 15-minute rule should not itself trigger the incident ladder.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/3614637-what-happens-if-i-m-late-to-my-shift"},{"name":"Instawork","url":"https://help.instawork.com/en/articles/5048510-how-reliability-affects-your-shift-access"}],"current":"Not built yet."},{"id":"CX-Q13","q":"How is a no-show confirmed?","context":"Managers only report; the platform decides (P04, P10). No review queue exists (D13).","gap":"","type":"decision","options":[{"key":"A","label":"Report, worker replies in 48h, platform decides","detail":"Both sides heard."},{"key":"B","label":"Platform decides on the report alone","detail":"Faster, one-sided."}],"rec":"A","recWhy":"No platform no-show adjudication queue exists. Hear both parties before applying the selected incident ladder; Qwick and Locate a Locum support individual review, while the 48-hour reply window is a proposed launch deadline.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/3815156-locate-a-locum-cancellation-policy-locums"}],"current":"Not built yet."},{"id":"CX-Q14","q":"If a worker cancels several dates of one booking, how many incidents is that?","context":"The register asks whether a recurring series counts once or once per date (D13).","gap":"","type":"decision","options":[{"key":"A","label":"One incident per cancel action","detail":"A series counts once."},{"key":"B","label":"One per affected date","detail":"A 10-day block could hit the ladder hard."}],"rec":"A","recWhy":"No cancellation incident ledger or multi-date counting rule exists. Count one cancellation action once to avoid a series exhausting the ladder; this is a fairness recommendation, not a verified competitor rule for recurring bookings.","sources":[{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"},{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"}],"current":"Not built yet."}]},{"id":"CX-S5","name":"Replacement and recovery","why":"Pharmacies need cover fast; P12 links replacement to consequences.","questions":[{"id":"CX-Q15","q":"After a confirmed booking is cancelled, how does the shift reopen?","context":"D03 reopens to the same audience for unpaid expiry. Cancellations have no rule yet.","gap":"","type":"decision","options":[{"key":"A","label":"Same shift; notify favourites first","detail":"Then the current audience, per owner's flags."},{"key":"B","label":"Same audience, no extra notice","detail":"Matches D03."},{"key":"C","label":"Manager decides each time","detail":"Slow near start."}],"rec":"A","recWhy":"Confirmed cancellations cannot reopen a slot because their transition is missing. Reuse the same shift and prioritise favourites according to notice flags; ShiftKey Cancellation Recovery provides the closest researched replacement-outreach pattern.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Not built yet."},{"id":"CX-Q16","q":"Can the manager release a no-show's slot and repost straight away?","context":"No emergency release exists (D13).","gap":"","type":"decision","options":[{"key":"A","label":"Yes, once the no-show line passes","detail":"The incident review continues separately."},{"key":"B","label":"Only after platform review","detail":"Too slow on the day."}],"rec":"A","recWhy":"No no-show slot-release action exists. Enable coverage after the chosen no-show threshold while reviewing the incident separately; ShiftKey supports rapid reopening, but the exact no-show release threshold is a proposed local rule.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Not built yet."},{"id":"CX-Q17","q":"If a worker's cancelled shift is filled by a replacement, what happens to the incident?","context":"P12: depends on who cancelled and time left. No reduction set.","gap":"","type":"decision","options":[{"key":"A","label":"No incident if replaced","detail":"Any time before start."},{"key":"B","label":"No incident if replaced 24h+ out","detail":"Inside 24h it still counts."},{"key":"C","label":"Always counts","detail":"Replacement changes nothing."}],"rec":"B","recWhy":"There is no incident mitigation rule for replacement coverage. The 24-hour cutoff is a proposed implementation of P12; Pharmacy SOS supports replacement-related relief but does not establish this exact worker-incident rule.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"}],"current":"Not built yet."},{"id":"CX-Q18","q":"If the pharmacy cancels but offers the worker equal replacement work, is the fee waived?","context":"P12 applies to pharmacy cancels too. No rule set.","gap":"","type":"decision","options":[{"key":"A","label":"Waived if worker accepts it","detail":"Equal pay, same day."},{"key":"B","label":"Fee still applies","detail":"Replacement is goodwill only."}],"rec":"A","recWhy":"No cancellation-fee waiver for accepted replacement work exists. Pharmacy SOS documents suitable replacement-work exceptions; require the worker to accept equivalent pay and timing rather than letting the pharmacy impose a substitute.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"}],"current":"Not built yet."}]},{"id":"CX-S6","name":"Refunds and credits (D10)","why":"F01 keeps money streams separate; this sets the rules.","questions":[{"id":"CX-Q19","q":"When the pharmacy cancels a paid booking, what happens to the booking fee?","context":"No refund or credit engine exists; late payments are only flagged (D10, F01).","gap":"","type":"decision","options":[{"key":"A","label":"Refund over 72h, none inside","detail":"Simple bands."},{"key":"B","label":"Credit always, never cash","detail":"Keeps money on platform."},{"key":"C","label":"Refund over 72h, credit inside","detail":"Pharmacy keeps value either way."}],"rec":"C","recWhy":"There is no cancellation booking-fee refund/credit engine. Pharmacy SOS supports refunds or credits and Locumate has a 72-hour cancellation boundary, but this exact refund/credit matrix is a proposed local policy that needs explicit disclosure.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"}],"current":"Not built yet."},{"id":"CX-Q20","q":"When the worker cancels or no-shows, what happens to the booking fee?","context":"No rule exists (D10).","gap":"","type":"decision","options":[{"key":"A","label":"Pharmacy picks remedy","detail":"Refund or credit after each failure."},{"key":"B","label":"Credit only","detail":"Use it on a replacement booking."},{"key":"C","label":"Keep only if replaced","detail":"Otherwise pharmacy chooses refund or credit."}],"rec":"C","recWhy":"There is no booking-fee remedy for worker cancellation or no-show. Keep the fee only when a replacement actually fulfils the booking; otherwise let the pharmacy choose refund or credit, consistent with the research recommendation for failed delivery.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"},{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Not built yet."},{"id":"CX-Q21","q":"Who approves refunds and credits?","context":"F01/F04 need an approver. The reconciliation flag is not a payout engine.","gap":"","type":"decision","options":[{"key":"A","label":"Platform finance/support admin","detail":"Every case, with reason logged."},{"key":"B","label":"Automatic by rule, admin for exceptions","detail":"Faster, more to build."}],"rec":"A","recWhy":"Payments can be flagged for reconciliation, but there is no cancellation refund/credit approval workflow. Start with platform finance/support approval and a reason, matching F04 and Pharmacy SOS case handling; a reconciliation flag cannot issue money.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"}],"current":"Not built yet."},{"id":"CX-Q22","q":"How is the worker's cancellation pay paid out?","context":"Timesheets route to payroll or invoicing. Nothing handles cancellation pay.","gap":"","type":"decision","options":[{"key":"A","label":"Same invoice or payroll as wages","detail":"Labelled 'cancellation pay'."},{"key":"B","label":"Platform pays the worker","detail":"Platform holds the money."}],"rec":"A","recWhy":"Existing timesheets route ordinary pay to payroll or invoicing, but cancellation pay has no record or payout path. Reuse the appropriate pay channel with a distinct cancellation-pay line; Locumate documents pharmacy-to-worker payment without a platform wage wallet.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/payment-process"}],"current":"Not built yet."}]},{"id":"CX-S7","name":"Disputes and appeals (D11)","why":"Sanctions need a fair, timed process.","questions":[{"id":"CX-Q23","q":"Who reviews disputes and appeals?","context":"No dispute or appeal workflow exists (D11). Only the platform may sanction (P04).","gap":"","type":"decision","options":[{"key":"A","label":"Support reviews; a second person appeals","detail":"Appeal never goes to the first reviewer."},{"key":"B","label":"One reviewer does both","detail":"Simpler, less fair."}],"rec":"A","recWhy":"There is no cancellation dispute or appeal workflow. Separate initial review from appeal as a proposed fairness safeguard; Qwick and Locate a Locum establish individual review, not a verified identical two-reviewer structure.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/3815156-locate-a-locum-cancellation-policy-locums"}],"current":"Not built yet."},{"id":"CX-Q24","q":"How long to appeal, and how fast must support answer?","context":"No timings exist (D11).","gap":"","type":"decision","options":[{"key":"A","label":"14 days to appeal; answer in 5","detail":"First review within 2 business days."},{"key":"B","label":"30 days to appeal; answer in 10","detail":"Slower, roomier."}],"rec":"A","recWhy":"No cancellation appeal or support response clocks exist. Fourteen days to appeal and the proposed review deadlines give workers predictable answers; competitor hours-dispute deadlines are useful context but do not prove these appeal timings.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/13113958-how-does-instawork-handle-payment-processing-when-there-are-disputes-about-worked-hours"}],"current":"Not built yet."},{"id":"CX-Q25","q":"Who can see each part of a dispute?","context":"No dispute case, evidence classes or access policy exists (D11).","gap":"","type":"decision","options":[{"key":"A","label":"Summary to both sides","detail":"Support alone sees sensitive evidence."},{"key":"B","label":"Everything to both sides","detail":"Exposes medical and identity evidence."},{"key":"C","label":"Platform only","detail":"Parties cannot answer the case."}],"rec":"A","recWhy":"Give each party the allegation, relevant facts and outcome. Limit medical, identity and third-party evidence to authorised support unless disclosure is necessary and lawful.","sources":[{"name":"OAIC APP 6","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-6-app-6-use-or-disclosure-of-personal-information"}],"current":"Not built yet."}]},{"id":"CX-S8","name":"Incident ladder details (P10)","why":"The ladder is approved; its edges are not.","questions":[{"id":"CX-Q26","q":"Which events count as an incident?","context":"P10: every non-exempt qualifying cancel or no-show counts after platform review. Whether long-notice cancels qualify is open.","gap":"","type":"decision","options":[{"key":"A","label":"No-shows and cancels inside 72h","detail":"Matches the owner fee line."},{"key":"B","label":"No-shows and cancels inside 24h","detail":"More forgiving."},{"key":"C","label":"Any cancel after confirmation","detail":"Even weeks ahead."}],"rec":"A","recWhy":"There is no reviewed incident ledger or qualifying-cancellation cutoff. A 72-hour line is a proposed policy aligned with the owner bands; Nursa distinguishes early/late incidents and Relief Buddy changes cancellation treatment at 72 hours.","sources":[{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Not built yet."},{"id":"CX-Q27","q":"Do favourite, chain and organisation incidents count toward the platform ladder?","context":"P04: favourites get warnings. P05: chain/org handled internally, badges possible. Public gets case-by-case sanctions.","gap":"","type":"decision","options":[{"key":"A","label":"Public-sourced only; others badge only","detail":"Non-public incidents can add a badge, never suspension."},{"key":"B","label":"All outside sources count","detail":"One ladder for everyone outside."}],"rec":"A","recWhy":"No source-specific platform incident ladder or badge rule is implemented. Keep public-source sanctions separate from internally handled relationships to preserve P04/P05; researched facility-local return/block controls support that separation but do not define this exact ladder.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/5511147-how-can-i-create-and-manage-my-roster"}],"current":"Not built yet."},{"id":"CX-Q28","q":"How far back does the ladder count?","context":"No lookback or reset is set (P10).","gap":"","type":"decision","options":[{"key":"A","label":"Rolling 12 months","detail":"Old incidents drop off."},{"key":"B","label":"Rolling 6 months","detail":"Faster reset."},{"key":"C","label":"Lifetime","detail":"No rehabilitation."}],"rec":"A","recWhy":"No incident lookback or reset exists. A rolling 12-month window allows rehabilitation and matches ShiftKey reliability history; it is a proposed incident-ladder window, since researched Nursa cancellation and no-show periods differ.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Reliability-Score-FAQ-for-Facilities"},{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"}],"current":"Not built yet."},{"id":"CX-Q29","q":"When should the reliability badge disappear?","context":"P10 adds a badge at incident three. The incident lookback is decided separately in CX-Q28.","gap":"","type":"decision","options":[{"key":"A","label":"After three clear months","detail":"Badge clears before older incidents expire."},{"key":"B","label":"Below three active incidents","detail":"Badge follows the rolling lookback."},{"key":"C","label":"Permanent","detail":"No rehabilitation."}],"rec":"B","recWhy":"Tie the badge to the active incident count so it has one understandable rule and disappears automatically when fewer than three incidents remain in the chosen window.","sources":[],"current":"Not built yet."},{"id":"CX-Q30","q":"What process applies before permanent suspension?","context":"P10 requires human review, notice, appeal and legal review, but no workflow exists.","gap":"","type":"decision","options":[{"key":"A","label":"Code-compliant process","detail":"Reasons, notice, review, response and appeal."},{"key":"B","label":"Two reviewers plus legal","detail":"Useful controls, but not the full process."},{"key":"C","label":"One platform admin","detail":"Fast, one-sided and high risk."}],"rec":"A","recWhy":"Where a worker is protected, the Digital Labour Platform Deactivation Code requires a fair process. Design to it before permanent or material account restrictions go live.","sources":[{"name":"Fair Work employee-like workers","url":"https://www.fairwork.gov.au/find-help-for/regulated-workers/employee-like-workers"}],"current":"Not built yet."},{"id":"CX-Q31","q":"When is a worker's source (favourite, chain, org, public) frozen, and which wins if several apply?","context":"Shift visibility changes as it escalates. The register says freeze per worker and date at acceptance; precedence is open.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep freezing shift visibility without worker-specific relationship precedence."},{"key":"A","label":"Freeze at accept; closest relationship wins","detail":"A favourite seen via public counts as favourite."},{"key":"B","label":"Freeze at accept; channel seen wins","detail":"Public view means public rules."},{"key":"C","label":"Freeze at payment","detail":"Later, may shift with escalation."}],"rec":"A","recWhy":"The visibility tier can misclassify a favourite who sees a public shift. Freeze the actual closest eligible relationship per worker/date at acceptance; Locumate preferred-pool behaviour supports the relationship-first direction, not a verified identical precedence rule.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"Accepted engagement terms freeze the shift visibility at acceptance, and assignments link to the source offer. They do not freeze each worker's favourite, chain, organisation or public relationship or resolve precedence between those relationships."}]},{"id":"CX-S9","name":"Completion (D14)","why":"What marks a shift done, so pay and ratings can follow.","questions":[{"id":"CX-Q32","q":"What marks a shift complete?","context":"Timesheets route to payroll or invoicing. No completed state on bookings (D14).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Continue time-based history without an explicit booking completion state."},{"key":"A","label":"Timesheet approved, or auto after 48h","detail":"Worker submits; pharmacy approves or it auto-approves."},{"key":"B","label":"Clock-out alone","detail":"No pharmacy check."},{"key":"C","label":"Manager approval only","detail":"Can stall forever."}],"rec":"A","recWhy":"Scheduled end alone cannot prove work or agreed hours. Use approved hours and a visible timed fallback; Locumate documents 48-hour timesheet auto-approval, with different deadlines at Relief Buddy and Nursa.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-confirm-shift-hours-once-a-shift-is-complete"}],"current":"Assigned shifts enter history after their scheduled end, regardless of approved timesheets or clock-out. Assignments have no completed state; timesheet approval is a separate manager action without a 48-hour automatic completion rule."},{"id":"CX-Q33","q":"How are disputed hours settled?","context":"Manager corrections exist in the attendance domain. No dispute path for the worker.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep manager corrections and worker comments without platform dispute escalation."},{"key":"A","label":"Pharmacy edits with reason; worker can escalate","detail":"Support decides if they disagree."},{"key":"B","label":"Support handles every dispute","detail":"Slow."}],"rec":"A","recWhy":"Existing corrections and comments do not settle a contested hours decision. Add worker escalation while retaining manager edits and audit reasons; Instawork and Qwick document bounded hours-review workflows.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/13113958-how-does-instawork-handle-payment-processing-when-there-are-disputes-about-worked-hours"},{"name":"Qwick","url":"https://support.qwick.com/en/articles/13038785"}],"current":"Managers can correct attendance with a reason; workers can comment on timesheets and request missing punches. There is no implemented escalation of an hours disagreement to platform support; both apps share this backend."},{"id":"CX-R01","q":"How are early finishes and extra hours paid?","context":"Timesheets capture actual hours, but no marketplace rule says when scheduled or actual hours control payment.","gap":"SH-14","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Managers approve actual hours without a marketplace rule."},{"key":"A","label":"Approved actual hours","detail":"Apply minimum engagement, penalties and overtime."},{"key":"B","label":"Scheduled hours only","detail":"Ignores authorised overtime and early release."}],"rec":"A","recWhy":"Use approved actual hours, preserve any legal minimum engagement, and calculate authorised overtime and penalties. Record who requested an early finish or extension.","sources":[{"name":"Pharmacy Industry Award","url":"https://awards.fairwork.gov.au/MA000012.html"}],"current":"Timesheets compare actual and planned hours and allow manager correction, but no marketplace policy resolves early release, authorised extra hours or the resulting minimum payment."}]},{"id":"CX-S10","name":"History and ratings (D15)","why":"Ratings must reflect real worked shifts.","questions":[{"id":"CX-Q34","q":"Who can rate, and when?","context":"Ratings are allowed for any assignment, even future, unworked and internal ones. Owner ratings average publicly on talent cards (SH-10).","gap":"SH-10","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Allow relationship ratings after any assignment, without proof of completed work."},{"key":"A","label":"After approved timesheet only","detail":"No rating when no work happened."},{"key":"B","label":"After the shift's end time","detail":"Unworked shifts could be rated."}],"rec":"A","recWhy":"Assignment existence is not evidence of completed work, so future or unworked shifts can affect ratings. Require approved timesheets; ShiftKey/Airtasker separate real feedback from fulfilment reliability.","sources":[{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/beyond-filling-shifts-how-to-build-a-network-of-independent-professionals-you-trust"},{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"}],"current":"Owners, organisation admins and pharmacy admins can rate assigned workers; workers can rate their pharmacies. The write API accepts any assignment, including future, internal or unworked ones; pending-rating lists only filter dates."},{"id":"CX-Q35","q":"Should ratings from internal roster shifts appear on the public talent board?","context":"Employee ratings feed the public talent-card average today (SH-10).","gap":"SH-10","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Continue including internal relationship ratings in the talent-card average."},{"key":"A","label":"No, keep internal","detail":"Employer reviews stay private."}],"rec":"A","recWhy":"Internal employment feedback currently affects public discovery. Keep internal ratings private and separate them from marketplace reviews; Clipboard supports relationship-scoped detailed records, rather than proving this exact proposed rating rule.","sources":[{"name":"Clipboard","url":"https://www.clipboard.com/privacy-policy"}],"current":"Talent cards average all owner-to-worker relationship ratings, including ratings made eligible by internal roster assignments. Web and mobile show the same aggregate; there is no internal-versus-marketplace separation."},{"id":"CX-Q36","q":"Do cancelled, expired and no-show shifts stay in both sides' history?","context":"History queries come from assignments and times; cancelled states don't exist yet (D15).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep assignment-and-time history without complete cancellation or expiry records."},{"key":"A","label":"Yes, both see them with status","detail":"Reason visible only to the two parties."},{"key":"B","label":"Hidden once cancelled","detail":"Loses the audit trail."}],"rec":"A","recWhy":"Current history cannot explain cancellations, expired reservations or no-shows. Retain those events with explicit status and scoped reasons; Airtasker completion reporting illustrates why cancellation records must survive.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"}],"current":"Both sides have assignment-based history filtered by scheduled time. Cancelled and no-show states do not exist, and expired unpaid offers without assignments do not appear there; there is no complete status-and-reason history."}]}]},{"id":"talent","name":"Talent board","summary":"Who can find workers, what they see, and what they can do.","steps":[{"id":"TB-S1","name":"Who sees what","why":"Privacy first; the board leaks names today.","questions":[{"id":"TB-Q01","q":"Who can see the talent board?","context":"Any signed-in user can, including competing workers, plus public anonymous cards (TB-02).","gap":"TB-02","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"All accounts see identities; public sees masked cards."},{"key":"A","label":"Employers and own post","detail":"Owners, managers, organisations; authors see their post."},{"key":"B","label":"A plus public masked","detail":"Public discovery never reveals identity."}],"rec":"B","recWhy":"Worker-to-worker access defeats anonymity. Restrict authenticated discovery to authorised hiring roles and each author; keep public discovery only if masking is enforced server-side.","sources":[{"name":"Upwork visibility controls","url":"https://support.upwork.com/hc/en-us/articles/211060298-How-to-control-who-sees-your-Upwork-profile"}],"current":"Any signed-in account can read talent posts, including other workers. Logged-out visitors can read public cards; anonymous posts have identity redacted only on the public API, not authenticated reads used by both apps."},{"id":"TB-Q02","q":"When is an anonymous candidate's identity revealed?","context":"Not defined. Logged-in reads leak names anyway (TB-01, TB-02).","gap":"TB-02","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Reveal anonymous authors to any signed-in user immediately."},{"key":"A","label":"When they accept a booking request","detail":"Worker chooses to engage."},{"key":"B","label":"When they reply in chat","detail":"Earlier."},{"key":"C","label":"Only when an offer is accepted","detail":"Latest."}],"rec":"A","recWhy":"Identity is disclosed before consent today. Tie reveal to the worker accepting the booking request; Mable supports agreement-linked identity restriction, while this precise reveal trigger is a proposed local choice.","sources":[{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"For anonymous posts, public reads redact identity, but any signed-in user receives names and user IDs immediately. Neither app waits for chat, a booking request or offer acceptance before the API reveals them."},{"id":"TB-Q03","q":"What stays hidden before identity reveal?","context":"Authenticated cards expose adult full names. Contact fields are omitted, but free-text pitches are not scrubbed.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Expose adult full names to signed-in users."},{"key":"A","label":"Identity and contact details","detail":"Hide surname, contacts, address and documents."},{"key":"B","label":"Contact details only","detail":"Show full name before a booking request."}],"rec":"A","recWhy":"Hide direct identity, contact details, street address and documents until the separate reveal point. Scan free text so the structured-field rule cannot be bypassed.","sources":[{"name":"Mable profile guidance","url":"https://mable.com.au/help_centre/create-winning-profile/"}],"current":"Structured cards omit contact details, street addresses and documents, but authenticated APIs return adults' full names; under-18s get first names. Both apps use this API, and free-text pitches are not a contact-masking guarantee."}]},{"id":"TB-S2","name":"Search and trust signals","why":"Helps pharmacies pick, without punishing newcomers.","questions":[{"id":"TB-Q04","q":"Which filters should the talent board launch with?","context":"All filtering happens in the app after downloading every post. No distance filter, though posts store postcode and radius (TB-04).","gap":"TB-04","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep existing client-side filters without distance, rate or server filtering."},{"key":"A","label":"Role, distance, dates, rate, software","detail":"Run on the server."},{"key":"B","label":"Role and date only","detail":"Less to build."}],"rec":"A","recWhy":"Useful filters already exist, so retain them and add server-side distance/rate matching rather than rebuild the board. Relief Buddy and Upwork support the structured constraints missing from today's filtering.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-find-a-shift"},{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/211063528-How-to-search-for-freelancers-on-Upwork"}],"current":"Both apps download all feed pages, then filter by role, work type, state, skills/software, dates, travel and text through shared-core. There is no pharmacy-distance or rate filter, and filtering is not server-side."},{"id":"TB-Q05","q":"How should reviews and reliability show?","context":"Owner-to-worker ratings are averaged into one public number (SH-10). No reliability measure exists.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep one relationship star average and count, without separate reliability."},{"key":"A","label":"Separate: reviews and reliability, with counts","detail":"Explained in one line each."}],"rec":"A","recWhy":"Counts already exist; the missing distinction is review quality versus fulfilment reliability. ShiftKey and Airtasker separate those signals, avoiding one score hiding cancellations or penalising employment relationships.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Reliability-Score-FAQ-for-Facilities"},{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"}],"current":"Web and mobile show one average owner-to-worker star score with a rating count. There is no separate attendance reliability or responsiveness measure, and internal ratings feed the same average."},{"id":"TB-Q06","q":"What does a brand-new worker show?","context":"A new worker shows no rating, which can look like a bad one.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Show zero stars before feedback and the score from the first rating."},{"key":"A","label":"'New' label until 5 completed shifts","detail":"No score shown yet."}],"rec":"A","recWhy":"Zero stars currently makes an unrated worker look poorly rated. Use a neutral New state; Airtasker's five-task completion-rate threshold and ShiftKey's feedback threshold inform, but do not prove, the proposed five-shift rating threshold.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"},{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/beyond-filling-shifts-how-to-build-a-network-of-independent-professionals-you-trust"}],"current":"Both apps display 0.0 (0) before any rating, then show the average and count from the first rating. There is no neutral New label or completed-shift threshold."}]},{"id":"TB-S3","name":"Actions on a card","why":"Turns discovery into bookings and lasting relationships.","questions":[{"id":"TB-Q07","q":"Is 'Request booking' a firm offer or an enquiry?","context":"It posts a dedicated shift and makes firm offers with 48h expiry. The worker can't ask questions first (TB-06).","gap":"TB-06","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Continue dedicated offers requiring worker acceptance; payment confirms outside bookings."},{"key":"B","label":"Enquiry or chat first","detail":"Then a normal offer."},{"key":"C","label":"Owner chooses each time","detail":"Two flows."}],"rec":"KEEP","recWhy":"KEEP: a firm request that workers may accept or decline matches Hireup booking requests and Florence invitations while preserving consent. Keep this offer-versus-enquiry structure; credential, permission and expiry defects remain separate launch fixes.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/13502083241103-Booking-Requests-For-Clients"},{"name":"Florence","url":"https://help.florence.co.uk/en/articles/8200817-how-to-use-favourites-to-rebook-preferred-professionals"}],"current":"Request booking opens a prefilled dedicated-shift form on web and mobile; submitting creates firm offers with 48-hour expiry. Workers accept or decline, and outside acceptance reserves pending payment."},{"id":"TB-Q08","q":"What should the heart on a talent card do?","context":"The heart only likes a post. Pharmacy favourites can't be added from a card (TB-05).","gap":"TB-05","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep post likes without a talent-card invitation to pharmacy favourites."},{"key":"A","label":"Adds to favourites, with consent","detail":"Worker must accept."},{"key":"B","label":"Keep like; add 'Invite to favourites'","detail":"Sends a membership invite."}],"rec":"B","recWhy":"A like does not create a reusable booking relationship today. Preserve the light reaction and add an explicit consent-based membership invitation; Florence and Locate a Locum treat favourites as practical rebooking relationships.","sources":[{"name":"Florence","url":"https://help.florence.co.uk/en/articles/8200817-how-to-use-favourites-to-rebook-preferred-professionals"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/12982363-how-to-get-the-most-value-from-your-locums"}],"current":"The heart likes or unlikes a post and changes its like count on both apps. It creates no pharmacy favourites membership, and talent cards have no Invite to favourites action."},{"id":"TB-Q09","q":"Can a pharmacy block a worker?","context":"No block list exists.","gap":"","type":"decision","options":[{"key":"A","label":"Yes, private block","detail":"Worker stops seeing that pharmacy's shifts; never shown publicly."},{"key":"B","label":"No blocking","detail":"Pharmacy declines each time."}],"rec":"A","recWhy":"No private pharmacy worker-block list is implemented in the shift/talent flow. Sidekicker, Relief Buddy and CareRev support private blocking separately from public ratings; build that scoped relationship control.","sources":[{"name":"Sidekicker","url":"https://pages.sidekicker.com/book-a-demo"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-happens-when-a-temp-cancels-on-me"},{"name":"CareRev","url":"https://www.carerev.com/blog/getting-the-most-out-of-carerev-tips-tricks-for-healthcare-professionals"}],"current":"Not built yet."},{"id":"TB-Q10","q":"What is the rule for hiring a worker directly, off the platform?","context":"No direct-hire or off-platform rule exists.","gap":"","type":"decision","options":[{"key":"A","label":"Permanent hire free; booked shifts stay","detail":"Shifts found here are booked here."},{"key":"B","label":"Conversion fee","detail":"Like Upwork or Sidekicker."},{"key":"C","label":"No rule","detail":"Unclear for both sides."}],"rec":"A","recWhy":"No direct-hire or off-platform conversion policy is implemented in this flow. Nursa advertises no hire-away fee while Upwork/Sidekicker use conversion fees; publish the simpler free permanent-hire rule and explicit treatment of platform-booked shifts.","sources":[{"name":"Nursa","url":"https://nursa.com/facility/solutions/healthcare-recruitment-software"},{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/360043723533-What-is-the-Upwork-Conversion-Fee"},{"name":"Sidekicker","url":"https://sidekicker.com/policy-pages/terms-of-use"}],"current":"Not built yet."}]}]},{"id":"availability","name":"Availability","summary":"When workers can work, and how that drives matching.","steps":[{"id":"AV-S1","name":"The calendar","why":"One source of truth for when a worker is free.","questions":[{"id":"AV-Q01","q":"How should workers set availability?","context":"Workers save dated slots or recurring weekdays with an optional end date. No 'unavailable' exceptions exist.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep dated and recurring available slots without unavailable-date exceptions."},{"key":"A","label":"Weekly pattern plus unavailable dates","detail":"Exceptions always win."},{"key":"B","label":"Dated slots only","detail":"Retype every week."}],"rec":"A","recWhy":"Recurring patterns already work, but holidays and outside work cannot override them. Add dated blackouts with precedence, following Relief Buddy and Locate a Locum, rather than replace existing availability entry.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/available-days-to-work"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4815841-how-to-use-your-locum-diary"}],"current":"Workers save dated availability or repeating weekdays with time windows or all-day flags on both apps. The backend has no unavailable-date or holiday exception model to override a weekly pattern."},{"id":"AV-Q02","q":"How far can a repeating availability run?","context":"The backend accepts open-ended repeats; both apps only preview when an end date is set (AV-02).","gap":"AV-02","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep optional API end dates, required app end dates and no refresh prompts."},{"key":"A","label":"End date required, max 3 months","detail":"Forces a refresh."},{"key":"B","label":"Open-ended, reconfirm quarterly","detail":"Nudge every 3 months."}],"rec":"B","recWhy":"Today's API and apps disagree, and nobody reconfirms old patterns. Support open-ended recurrence consistently with a quarterly prompt; research supports availability maintenance, but does not establish quarterly as a competitor standard.","sources":[{"name":"Locumate","url":"https://support.locumate.ai/portal/en/kb/locumate/marketplace/locums"},{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/115003975967-Why-was-my-profile-changed-to-private"}],"current":"The backend accepts open-ended repeats, but both apps require an end date when saving and previewing repeats. There is no three-month maximum, quarterly reconfirmation or automatic refresh reminder."}]},{"id":"AV-S2","name":"How it is used","why":"Matching rules must agree across alerts, roster and search.","questions":[{"id":"AV-Q03","q":"When does availability 'match' a shift?","context":"Alerts match any overlap (9–10 matches a 9–17 shift). Roster checks need the shift fully inside (AV-03).","gap":"AV-03","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep overlap-based alerts and full-containment roster warnings."},{"key":"A","label":"Shift fully inside availability","detail":"Same rule everywhere."},{"key":"B","label":"Overlap of at least X%","detail":"Pick a percentage."}],"rec":"A","recWhy":"A short or boundary-only overlap currently triggers alerts for shifts the worker cannot cover. Full containment aligns matching with roster warnings and Relief Buddy's consistent unavailable-time exclusion.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/available-days-to-work"}],"current":"Match emails and dashboard suggestions accept any time overlap, including touching endpoints; roster warnings require full containment. Both apps share these backend rules."},{"id":"AV-Q04","q":"Who can see a worker's availability?","context":"It feeds alerts and recommendations only. Pharmacies see just what was copied into a talent post (AV-06).","gap":"AV-06","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Raw calendar private; posts hold copied dates."},{"key":"B","label":"Opt-in trusted pharmacies","detail":"Worker chooses staff and favourite visibility."},{"key":"C","label":"Opt-in talent card","detail":"Broader employer visibility."}],"rec":"B","recWhy":"Offer an explicit worker opt-in for accepted staff and favourite pharmacies. Relationship alone should not silently disclose a private calendar or notes.","sources":[{"name":"OAIC APP 6","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-6-app-6-use-or-disclosure-of-personal-information"}],"current":"Only workers can read or edit their raw availability through the API; it drives alerts, recommendations and roster warnings. Pharmacies see copied talent-post dates rather than a live calendar on either app."},{"id":"AV-Q05","q":"Should confirmed bookings block that time automatically?","context":"Availability ignores bookings; alerts can go out for times already booked.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Leave declared availability and alerts unchanged when bookings are confirmed."},{"key":"A","label":"Yes, booked time is unavailable","detail":"No alerts for those hours."}],"rec":"A","recWhy":"Existing conflict checks do not suppress matching alerts or stale available time. Deduct confirmed booking intervals automatically, as Hireup conflict visibility and Locate a Locum diary filtering suggest.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/13502083241103-Booking-Requests-For-Clients"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4815841-how-to-use-your-locum-diary"}],"current":"Confirmed assignments do not subtract time from declared availability or matching alerts. Separate roster conflict checks can reject clashes, but both apps can still receive alerts for booked hours."}]},{"id":"AV-S3","name":"Freshness and preferences","why":"Stale calendars waste pharmacies' time.","questions":[{"id":"AV-Q06","q":"When should a talent post stop showing?","context":"Posts with no dates, and full-time posts, stay visible forever (AV-02).","gap":"AV-02","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Hide dated posts after their last date; retain undated and full-time posts."},{"key":"A","label":"Hide after 30 days without update","detail":"Nudge the worker first."},{"key":"C","label":"Never","detail":"Board fills with ghosts."}],"rec":"A","recWhy":"Last-date filtering leaves undated/full-time posts stale forever and is bypassable through other endpoints. Add nudges and inactivity hiding consistently; Upwork supports inactivity privacy, but 30 days is a proposed local default.","sources":[{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/115003975967-Why-was-my-profile-changed-to-private"}],"current":"Feeds hide dated availability posts after their last date; undated and full-time posts remain indefinitely unless moderated. Ordinary list/detail endpoints bypass this visibility filter; neither app has an inactivity cutoff."},{"id":"AV-Q07","q":"Should availability show when it was last confirmed?","context":"No freshness signal exists.","gap":"","type":"decision","options":[{"key":"A","label":"Yes, plus weekly one-tap reconfirm","detail":"Marked stale after 14 days; pause option."},{"key":"B","label":"No","detail":"Pharmacies guess."}],"rec":"A","recWhy":"No availability confirmation date, reconfirm action or freshness status is implemented; generic database update timestamps are not a worker confirmation. Locumate maintenance guidance and Mable pause controls support the direction; weekly/14-day timing is proposed.","sources":[{"name":"Mable","url":"https://mable.com.au/help_centre/how-are-response-rates-calculated-and-why-is-it-important-for-my-business/"},{"name":"Locumate","url":"https://support.locumate.ai/portal/en/kb/locumate/marketplace/locums"}],"current":"Not built yet."},{"id":"AV-Q08","q":"Should urgent-shift alerts need a separate opt-in?","context":"Workers have one 'notify new shifts' switch.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Use the same matching-shift notification consent for urgent and ordinary shifts."},{"key":"A","label":"Yes, separate urgent opt-in","detail":"For shifts starting within 24h."}],"rec":"KEEP","recWhy":"Urgency does not change the notification purpose. Keep one matching-shift consent at launch, label urgent messages clearly, and add frequency controls only if volume proves necessary.","sources":[],"current":"Both apps show one matching-public-shift notification switch saved on availability rows. There is no separate urgent-shift consent or urgency-based availability-alert audience."},{"id":"AV-Q09","q":"Should workers set a max distance and minimum rate for alerts?","context":"Talent posts store postcode and radius; alerts ignore distance and rate.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Respect existing distance/travel preferences without filtering alerts by minimum rate."},{"key":"A","label":"Yes, alerts respect both","detail":"Search can still widen."}],"rec":"A","recWhy":"Distance/travel matching already exists, contrary to the audit context. Keep it and add a worker minimum-rate preference for alerts; Relief Buddy combines both constraints and allows search to widen deliberately.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-find-a-shift"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4967810-how-to-find-apply-for-a-shift-as-a-locum"}],"current":"Both apps let workers set coverage radius or travel states, and match alerts already enforce these preferences. Alerts do not check a minimum hourly rate; talent-post radius is a separate snapshot."}]}]},{"id":"launch","name":"Fix list & launch","summary":"Code gaps with no policy choice. Only the timing is yours.","steps":[{"id":"LA-S1","name":"Onboarding fixes","why":"Trust and sign-up blockers.","questions":[{"id":"LA-Q01","q":"Fix before launch? Booking never refreshes AHPRA registration from the public register.","context":"A saved flag drives Verified; booking paths do not refresh registration status, type or conditions (ON-02).","gap":"ON-02","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"AHPRA calls its public register the authoritative source. Add a current register check before registered-role bookings rather than treating the copied expiry date alone as status.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"A saved AHPRA flag drives Verified. Booking paths do not refresh status, registration type or conditions from the public register; only separate talent and operations checks inspect expiry."},{"id":"LA-Q02","q":"Fix before launch? Mobile 'add personal profile' drops pharmacist data and sends other staff to not-found.","context":"Legacy pharmacist screen posts fields the backend lacks; /otherstaff/onboarding has no file (ON-04).","gap":"ON-04","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Mobile account upgrades can lose data or land on not-found today. Fix before launch and route to the supported role profiles; the researched onboarding pattern is a complete actionable flow, not a legacy dead end.","sources":[{"name":"Florence","url":"https://www.florence.co.uk/looking-for-work/registration"}],"current":"Mobile manager upgrades send pharmacists to a legacy form posting unsupported bank/rate fields; other staff go to a missing onboarding route. Web has separate routed onboarding screens."},{"id":"LA-Q03","q":"Fix before launch? Reachable mobile screens can dead-end or send unsupported fields.","context":"Manager profile upgrades can lose data or route to not-found; some reachable hubs are placeholders (ON-04, ON-05).","gap":"ON-05","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Repair or remove reachable dead ends and unsupported submissions before launch. An unreferenced web organisation page can be deleted or deferred separately.","sources":[],"current":"Mobile profile upgrades can post unsupported fields or reach a missing route. Explorer Shifts and some hubs are placeholders; an unreferenced organisation-create page also exists on web."},{"id":"LA-Q04","q":"Fix before launch? Profile progress % doesn't match what Verified needs.","context":"Progress counts resume, bio, rates, referees and ID; Verified needs email, mobile and AHPRA (ON-10).","gap":"ON-10","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Optional profile completeness currently obscures the actual blocking checks. Fix the readiness presentation before launch using missing verification requirements; Florence and Hireup support progress tied to real review steps.","sources":[{"name":"Florence","url":"https://www.florence.co.uk/looking-for-work/registration"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360016020691-What-do-I-need-to-register-as-a-Hireup-support-worker"}],"current":"Profile completeness counts optional resume, bio, rates, referees and identity fields, while Verified uses a different role-specific policy. Both apps can show high completeness without meeting the actual public-access requirements."},{"id":"LA-Q05","q":"Fix before launch? Workers only see payment readiness at the moment of accepting.","context":"Readiness status is only shown to managers (ON-11).","gap":"ON-11","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Workers currently discover payment blockers too late to act confidently on urgent work. Add an early actionable checklist before launch; Airtasker and ShiftKey document readiness requirements before payout or bidding.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/42073609183641-Having-problems-verifying-my-account-what-should-I-do"}],"current":"Payment readiness is exposed in manager membership data, without an early worker readiness checklist. On both apps, missing ABN/entity or settlement requirements can surface when retrieving or accepting offer terms."}]},{"id":"LA-S2","name":"Shift and billing fixes","why":"Money and schedule correctness.","questions":[{"id":"LA-Q06","q":"Fix before launch? The old 10%/20% penalty route is still live.","context":"charge-penalty/ is routed and exported, though no screen calls it. The register says suspend it (SH-02).","gap":"SH-02","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Disable the callable legacy charge route before launch. Do not introduce replacement cancellation charges until Australian counsel reviews classification, proportionality, disclosure and unfair-contract-term risk.","sources":[{"name":"ACCC contract terms","url":"https://www.accc.gov.au/consumers/buying-products-and-services/contracts"},{"name":"ACCC unfair terms penalties","url":"https://www.accc.gov.au/media-release/businesses-urged-to-remove-unfair-contract-terms-ahead-of-law-changes"}],"current":"The authenticated charge-penalty route still creates legacy 10%/20% checkouts for eligible outside shifts and is exported by shared-core. Internal employee/roster shifts are guarded; neither app currently calls it from a screen."},{"id":"LA-Q07","q":"Fix before launch? Subscribers are charged full price, and Stripe price IDs are hard-coded.","context":"The subscriber flag is computed but unused, so subscribers pay $30/$80 not $15/$40; test and live share price IDs (SH-03).","gap":"SH-03","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"The subscriber discount is not applied and environments cannot select independent prices. Fix before live checkout so paying subscribers are not charged the standard tier; competitor pricing cannot justify this internal mismatch.","sources":[],"current":"Checkout computes subscriber status but always selects the standard locum or permanent Stripe price ID. Those IDs are hard-coded; web and mobile use the same billing endpoint."},{"id":"LA-R01","q":"Fix before launch? Booking fees lack explicit GST and tax-invoice treatment.","context":"Checkout uses fixed Stripe prices, but the reviewed flow does not state GST inclusion or issue a platform tax invoice.","gap":"SH-15","type":"code","options":[{"key":"A","label":"Before launch","detail":"Confirm tax treatment, display it and issue compliant records."},{"key":"B","label":"Soon after launch","detail":"Take payments while tax treatment is unclear."},{"key":"C","label":"Not needed","detail":"Leave Stripe receipts as the only record."}],"rec":"A","recWhy":"Obtain Australian tax advice, configure the correct GST treatment, show the total before payment and issue the required invoice or receipt from the correct supplier.","sources":[{"name":"ATO GST registration","url":"https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/registering-for-gst"},{"name":"ACCC price displays","url":"https://www.accc.gov.au/business/pricing/price-displays"}],"current":"Booking checkout selects fixed Stripe prices and stores the amount, but no reviewed field or flow states GST treatment or creates a platform tax invoice."},{"id":"LA-Q08","q":"Fix before launch? Scheduled escalation only runs when someone loads a shift list.","context":"Escalation runs inside list requests, scanning every due shift; no scheduled job (SH-05).","gap":"SH-05","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Scheduled release can stall whenever nobody browses. Run shift escalation independently before launch; CareRev cascading and Locumate scheduled release support predictable release timing, not request-triggered catch-up.","sources":[{"name":"CareRev","url":"https://www.carerev.com/solutions/carerev-irp"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"Shift escalation runs during shared shift-query handling, including list/detail requests, rather than a scheduled shift job. Existing periodic escalation tasks cover goods marketplaces; web and mobile both depend on browsing to trigger shift escalation."},{"id":"LA-Q09","q":"Fix before launch? Pending offers can outlive the shift.","context":"Flat 48h expiry, not capped at start, applied lazily (SH-07).","gap":"SH-07","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"An urgent offer can remain acceptable after its shift begins. Cap the response deadline at start before launch; Qwick distinguishes offers from confirmed places, but the research does not prescribe a universal response duration.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"}],"current":"Pending offers receive a fixed 48-hour expiry that is not capped at shift start. Listing lazily marks expired offers, while acceptance checks the same deadline; both apps can retain pending offers after start."},{"id":"LA-Q10","q":"Fix before launch? Accepted terms don't include the cancellation table or terms version.","context":"The accepted snapshot omits the cancellation table, platform terms version and pharmacy acceptance; no Australian unfair-terms review is recorded (SH-09).","gap":"SH-09","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Record versioned, pre-contract acceptance by both sides and obtain Australian legal review. Disclosure alone does not make a one-sided or disproportionate term fair.","sources":[{"name":"ACCC contract terms","url":"https://www.accc.gov.au/consumers/buying-products-and-services/contracts"},{"name":"ACCC unfair terms penalties","url":"https://www.accc.gov.au/media-release/businesses-urged-to-remove-unfair-contract-terms-ahead-of-law-changes"}],"current":"Accepted engagement snapshots include a schema version and worker acceptance, but omit the cancellation matrix, platform terms version and pharmacy-side policy acceptance. Both apps use this shared backend record."},{"id":"LA-R02","q":"May cancellation charges launch before Australian legal review?","context":"P08 and P09 define percentage charges. No review establishes classification, proportionality or unfair-contract-term compliance.","gap":"SH-16","type":"decision","options":[{"key":"A","label":"Legal review before launch","detail":"Review every charge and remedy before enforcement."},{"key":"B","label":"Disclosure is enough","detail":"Launch after showing the table."},{"key":"C","label":"Never charge","detail":"Use non-money reliability controls only."}],"rec":"A","recWhy":"Since November 2023, proposing, using or relying on unfair standard-form terms can attract major penalties. Clear wording alone does not cure unfairness.","sources":[{"name":"ACCC contract terms","url":"https://www.accc.gov.au/consumers/buying-products-and-services/contracts"},{"name":"ACCC unfair terms penalties","url":"https://www.accc.gov.au/media-release/businesses-urged-to-remove-unfair-contract-terms-ahead-of-law-changes"}],"current":"The approved charge table is not implemented. A separate legacy 10% or 20% checkout remains callable, without evidence of Australian legal review."},{"id":"LA-Q11","q":"Fix before launch? The auto-publish setting contradicts R06/R04B and is missing on mobile.","context":"Its help text says it creates and publishes a new shift; the toggle is web-only. Re-point it to the R04A permission (SH-11).","gap":"SH-11","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"The mobile-toggle omission in the audit is incorrect. Keep both existing controls, correct the copy and enforce the per-pharmacy cover permission before launch; an unused flag cannot implement R04A/R06.","sources":[],"current":"Web and mobile already expose the staff-request toggle, but backend request handlers do not consult it. Its model help text still promises creating a new shift, rather than a permission governing cover on the existing slot."}]},{"id":"LA-S3","name":"Talent board fixes","why":"Privacy leaks and scale.","questions":[{"id":"LA-Q12","q":"Fix before launch? Anonymous talent posts expose full names to any signed-in account.","context":"Feed, list and retrieve return name and user ids; only the public feed redacts (TB-01).","gap":"TB-01","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Anonymous posting is currently bypassed by signing in. Fix before launch with server-side masking and a consent-based reveal; Mable restricts full-name discovery and profile contact information.","sources":[{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"Authenticated talent feed, list and detail serializers return anonymous authors' names and user IDs. Only public reads mask them; both apps consume the leaking authenticated API."},{"id":"LA-Q13","q":"Fix before launch? Hidden, stale and lapsed-credential posts can still be read.","context":"List and retrieve skip the visibility filter; visibility is not re-checked when Verified or AHPRA lapses (TB-03).","gap":"TB-03","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Hidden or newly ineligible candidates remain retrievable today. Enforce visibility and current eligibility consistently before launch; Nursa removes ineligible clinicians from visibility.","sources":[{"name":"Nursa","url":"https://nursa.com/facility/capabilities/background-checks"}],"current":"Feed visibility excludes moderated or past-dated posts, but ordinary list/detail reads bypass that check. Revoked Verified or lapsed AHPRA status is not a visibility gate after posting; both apps can access these API paths."},{"id":"LA-Q14","q":"Fix before launch? The talent board downloads every post and filters in the app.","context":"No server filters; a Python loop scans the whole table. Breaks at a few thousand posts (TB-04).","gap":"TB-04","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"B","recWhy":"Soon after launch is reasonable only for a deliberately small, monitored board; actual launch volume was not measured. Full-feed downloads scale poorly compared with researched Relief Buddy/Upwork structured search, so set a measured migration trigger.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-find-a-shift"}],"current":"Both apps fetch every feed page through shared-core, then filter locally; the backend checks post visibility in a Python loop before pagination. There are no server-side pharmacy-distance or rate filters."},{"id":"LA-Q15","q":"Fix before launch? Web and mobile disagree on Talent Board booking permissions.","context":"Mobile allows any non-worker role; web uses a narrower allow-list. The backend must be the authority (TB-07).","gap":"TB-07","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the first month of live use."},{"key":"C","label":"Not needed","detail":"Accept the risk or drop it."}],"rec":"A","recWhy":"Set one backend hiring-role policy and mirror it in both clients before launch. Track the wrong route, duplicate hook and view-count inflation as separate engineering cleanup.","sources":[],"current":"Mobile permits every non-worker role to request bookings; web limits roles and admin status. The shared backend must enforce the final policy regardless of client gates."}]},{"id":"LA-S4","name":"Availability fixes","why":"Matching that reaches the right, verified people.","questions":[{"id":"LA-Q16","q":"Fix before launch? Talent post availability is copied once and never syncs with the calendar.","context":"Later calendar edits never update the post (AV-01).","gap":"AV-01","type":"code","options":[{"key":"A","label":"Before launch","detail":"Must be done before the first real booking."},{"key":"B","label":"Soon after launch","detail":"Within the fir
