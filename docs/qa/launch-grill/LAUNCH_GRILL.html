@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap');

    --on-accent: #102b22; --selected: #234b3d; --warning: #f1ce84; --warning-bg: #3d321d;

  --page: #10211e; --surface: #172d28; --soft: #213c35; --ink: #e4f2ed;
  --muted: #adc5bc; --line: #3c5a50; --control-line: #759b8a; --accent: #86dac0; --accent-hover: #a5e8d3;
  --on-accent: #102b22; --selected: #234b3d; --warning: #f1ce84; --warning-bg: #3d321d;

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.6 'Public Sans', sans-serif; }
::selection { color: var(--on-accent); background: var(--accent); }
* { scrollbar-color: var(--line) var(--page); }
button, input, textarea, select { font: inherit; color: inherit; accent-color: var(--accent); caret-color: var(--accent); }
button, select, .option { cursor: pointer; }
button, select { min-height: 44px; }
button { border: 1px solid var(--line); border-radius: 9px; padding: 10px 16px; background: var(--surface); font-weight: 600; line-height: 1.4; transition: background .15s ease; }
button:hover { background: var(--soft); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

a:hover { text-decoration-thickness: 2px; }

[hidden] { display: none !important; }

.outer { max-width: 1260px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); padding-block: 0 max(36px, env(safe-area-inset-bottom,0px)); }
.header { position: sticky; top: env(safe-area-inset-top,0px); z-index: 5; background: var(--page); border-bottom: 1px solid var(--line); padding-block: 20px 16px; display: grid; grid-template-columns: 1fr minmax(200px, 360px); gap: 12px 32px; align-items: center; }
.brand { display: flex; gap: 12px; align-items: center; }
.brand-mark { width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); border-radius: 11px; }
.brand-mark svg { width: 23px; height: 23px; }
.header-sub { color: var(--muted); font-size: 13px; }
.progress-copy { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
.progress-copy strong { color: var(--ink); font-weight: 600; }
.meter { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .2s ease; }
.save-line { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.save-pill { background: var(--soft); color: var(--muted); padding: 4px 10px; border-radius: 6px; font-size: 12px; max-width: 100%; overflow-wrap: anywhere; }
.save-pill.error { color: var(--danger); background: var(--danger-bg); }
.save-line button { padding: 7px 12px; font-size: 13px; }
.layout { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 48px; padding-top: 30px; align-items: start; }
.sidebar { position: sticky; top: calc(env(safe-area-inset-top,0px) + 170px); min-width: 0; }
.nav-label { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.nav-list { display: flex; flex-direction: column; gap: 8px; }
.nav-item { text-align: left; background: var(--clear); border-color: var(--clear); display: flex; align-items: center; gap: 10px; padding: 12px; width: 100%; }
.nav-item[aria-current="page"] { color: var(--accent); background: var(--selected); border-color: var(--line); }
.nav-name { min-width: 0; overflow-wrap: anywhere; flex: 1; }
.nav-count { flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-extra { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.sidebar-note { margin: 24px 12px 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
main { min-width: 0; max-width: 790px; }
.area-summary { color: var(--muted); max-width: 65ch; }
.step-heading { margin-block: 28px 22px; border-top: 1px solid var(--line); padding-top: 22px; }
.step-count { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.step-heading h3 { margin-bottom: 7px; }
.step-heading p { color: var(--muted); margin: 0; max-width: 65ch; }
.question { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 28px); margin-bottom: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 11px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
.chip.id { color: var(--accent); font-weight: 700; }

.question h3 { font-size: clamp(19px, 2.4vw, 23px); }
.context { color: var(--muted); font-size: 14px; max-width: 65ch; }
.current { background: var(--soft); border-left: 3px solid var(--control-line); border-radius: 8px; padding: 12px 14px; margin: 16px 0 0; font-size: 14px; }
.current-label { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.current-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
fieldset { padding: 0; margin: 22px 0 0; border: 0; min-width: 0; }
.options { display: grid; gap: 10px; }
.option { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--control-line); border-radius: 9px; padding: 14px; min-height: 58px; background: var(--surface); transition: background .15s ease; }

.option-key { display: inline-block; color: var(--accent); font-size: 13px; margin-right: 8px; }
.option-detail { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.field { margin-top: 20px; }
.field > label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
textarea, select { width: 100%; max-width: 100%; border: 1px solid var(--control-line); border-radius: 8px; background: var(--surface); padding: 12px; }
textarea { min-height: 104px; resize: vertical; display: block; line-height: 1.6; }
textarea::placeholder { color: var(--muted); opacity: 1; }
.helper { margin-top: 6px; margin-bottom: 0; color: var(--muted); font-size: 12px; }
.recommendation { border-block: 1px solid var(--line); padding-block: 18px; margin-top: 24px; }
.recommendation strong { color: var(--accent); font-size: 14px; }
.recommendation p { margin: 7px 0 10px; color: var(--muted); font-size: 14px; }
.source-links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; font-size: 13px; }
.source-links a { min-height: 44px; display: inline-flex; align-items: center; }
.recommendation button { font-size: 14px; }
.status-field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); align-items: center; gap: 12px; margin-top: 20px; }
.status-field label { font-size: 14px; font-weight: 600; }
.step-footer { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-block: 4px 24px; }
.footer-count { font-size: 13px; color: var(--muted); }
.step-actions { display: flex; gap: 10px; }
.empty, .decided-item { padding-block: 22px; border-bottom: 1px solid var(--line); }
.decided-item .chip { display: inline-block; margin-bottom: 10px; }
.decided-item p:last-child { color: var(--muted); margin-bottom: 0; white-space: pre-wrap; }
.review-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-block: 24px; }
.review-group { margin-block: 32px; }
.review-group > h3 { margin-bottom: 16px; }
.review-item { padding: 20px 18px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 12px; background: var(--surface); }
.review-item.unanswered { background: var(--warning-bg); }
.review-item h4 { margin: 10px 0; font-size: 16px; font-weight: 600; line-height: 1.5; }
.review-item p { margin-bottom: 8px; font-size: 14px; white-space: pre-wrap; }
.review-item .answer-label { font-weight: 600; }
.review-item .review-status { color: var(--warning); font-size: 12px; margin-left: 8px; }
.review-item button { font-size: 13px; margin-top: 5px; }
.transfer-panel { border-top: 1px solid var(--line); padding-top: 24px; margin-top: 28px; }
.transfer-panel h3 { font-size: 19px; }
.transfer-panel textarea { min-height: 160px; }
.transfer-panel button { margin-top: 12px; }
.message { color: var(--muted); font-size: 14px; margin-top: 12px; white-space: pre-wrap; }
.message.error { color: var(--danger); }
.fatal { padding: 24px; color: var(--danger); background: var(--danger-bg); border-radius: 10px; }
@media (max-width: 760px) {
  .header { grid-template-columns: minmax(0, 1fr); padding-block: 14px 12px; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; flex-basis: 34px; border-radius: 9px; }
  .header-sub { display: none; }
  .save-line { grid-column: 1; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-top: 16px; }
  .sidebar { position: static; }
  .nav-label, .sidebar-note { display: none; }
  .nav-list { flex-direction: row; overflow-x: auto; padding: 4px 3px 10px; gap: 8px; }
  .nav-item { width: auto; flex-shrink: 0; max-width: 280px; padding: 10px 13px; border-color: var(--line); background: var(--surface); }
  .nav-extra { display: contents; }
  .nav-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step-heading { margin-top: 22px; }
  .required-flag { margin-left: 0; }
  .question { border-radius: 11px; }
  .status-field { grid-template-columns: minmax(0, 1fr); gap: 7px; }
  .step-footer { align-items: stretch; }
  .footer-count { width: 100%; }
  .step-actions { width: 100%; }
  .step-actions button { flex: 1; padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

<script id="grill-data" type="application/json">{"title":"Launch Grill","intro":"Answer area by area, top to bottom. Earlier answers unblock later ones, and settled decisions are listed first so you never answer them twice.","carried":[{"id":"D01","label":"When is an outside booking confirmed?","answer":"Acceptance creates a time-limited reservation. Only verified payment confirms it."},{"id":"D02","label":"How long does the pharmacy have to pay?","answer":"Start over 48h away: 24h. 12–48h: 6h. 2–12h: 2h. Under 2h: 30 minutes. Never past shift start."},{"id":"D03","label":"An unpaid reservation expires. Then what?","answer":"Release to the same audience and notify worker and manager. No auto-escalation, no penalty."},{"id":"D04","label":"Who can cancel?","answer":"Owner and authorised managers, with guards. Staff request cover, swap or cancel and stay assigned until approved or replaced."},{"id":"D05","label":"Cancel one date or all?","answer":"One date, selected dates or the whole posting. Other dates and history stay."},{"id":"R01","label":"Who belongs on the internal roster?","answer":"Only employed staff: full-time, part-time, casual. Locums and favourites go through shift offers."},{"id":"R04","label":"Staff swap and cover requests","answer":"Staff can ask for swap or cover. No release until a manager decides or a replacement is fulfilled. Public worker cancels need a reason."},{"id":"R04A","label":"Who allows staff to publish cover?","answer":"The owner sets it per pharmacy, not per worker or role."},{"id":"R04B","label":"Who can staff invite to cover?","answer":"Named eligible colleagues. Widening to favourites or public needs a manager."},{"id":"R04C","label":"When is a replacement fulfilled?","answer":"The target accepts, passes role and conflict checks, and a manager approves the transfer."},{"id":"R04D","label":"Public worker wants to cancel","answer":"Always needs manager approval. Near start, emergency escalation with reason and notices. No self-cancel."},{"id":"R06","label":"Cover opened as a vacancy","answer":"Same shift and slot, shown as needs cover and linked to the vacancy. No duplicate."},{"id":"E01","label":"Audience order","answer":"Staff, favourites, owner chain, organisation, public. Owner may start at a later tier and post anonymously to public."},{"id":"E01A","label":"Do earlier audiences keep access?","answer":"Yes. Wider posting adds viewers. Skipping a notice never hides the shift."},{"id":"E01B","label":"Notification choices","answer":"Keep the existing staff, favourite and chain notice flags. No organisation-wide broadcast."},{"id":"E03","label":"Escalation timing","answer":"Owner picks escalation intervals when posting. Roster publishing never triggers escalation."},{"id":"P02","label":"What drives cancellation policy?","answer":"Where the worker was sourced: favourites, chain, organisation or public. Employment type is kept separate."},{"id":"P04","label":"Who sanctions workers?","answer":"The platform only, case by case, scaled by notice. Managers only report. Owners can face fees."},{"id":"P05","label":"Chain and organisation cancellations","answer":"Handled internally. No-show and repeat-cancellation badges can still apply."},{"id":"P06","label":"Public worker late cancel or no-show","answer":"Notice-based warnings. Serious cases go to platform review, case by case."},{"id":"P07","label":"What drives owner fees?","answer":"Time before shift, for outside confirmed bookings only. Internal roster work is excluded."},{"id":"P08","label":"Notice bands","answer":"Over 7 days, 72h, 24h, 12h, 2h, at or after start."},{"id":"P09","label":"Owner fee type","answer":"A percentage of the frozen agreed wages for the cancelled dates only."},{"id":"FEES","label":"Owner fee table (7 bands)","answer":"Over 7d 0%. 72h–7d 0%. 24–72h 10%. 12–24h 15%. 2–12h 20%. Under 2h 25%. At or after start 30%."},{"id":"P10","label":"Worker incident ladder","answer":"Platform-verified incidents only. 1st warning. 2nd 14 days no applying. 3rd 28 days plus badge. 4th 56 days. 5th permanent after human review. Cap 6 months."},{"id":"P11","label":"Exemptions","answer":"Different waivers for owners, internal workers and public workers, including mutually agreed cancellation."},{"id":"P12","label":"Does a replacement soften consequences?","answer":"It depends on who cancelled and how much time was left."},{"id":"F01","label":"Pharmacy cancels: the money","answer":"Booking fee, any refund or credit, and worker pay stay separate."},{"id":"F04","label":"Payment arrives after expiry","answer":"No rebooking. The pharmacy chooses credit or refund, after approved review."},{"id":"NOPEN","label":"Money penalties for workers?","answer":"None, ever. No fines, deductions or charges on workers for cancelling or no-shows."}],"areas":[{"id":"onboarding","name":"Onboarding","summary":"Sign-up to first shift, for workers and pharmacies.","steps":[{"id":"ON-S1","name":"Worker tracks and gates","why":"Sets what each role must finish before it can browse, apply, confirm and get paid.","questions":[{"id":"ON-Q01","q":"Jack is an intern pharmacist and Mia is a casual pharmacy assistant at Tom's. Both are signing up as workers on ChemistTasker. Should each role get its own sign-up path, or share one 'other staff' form that changes by role?","context":"Each role needs different checks, so the form must ask the right questions without making sign-up longer than it needs to be.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Three tracks; Jack and Mia share one form that asks each role's own questions."},{"key":"B","label":"Jack and Mia each get their own sign-up","detail":"Separate screens for intern, technician, assistant and student; more screens to build and keep up."}],"rec":"KEEP","recWhy":"Today already gives each role its own questions inside one form, on web and mobile. Locumate and Locate a Locum also change the documents by role, not the whole sign-up.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-sign-up-as-a-job-seeker-shift-work-inc-ft-pt"},{"name":"Locate a Locum","url":"https://locatealocum.com/document-checklist"}],"current":"Today Jack and Mia both use the 'other staff' form, on web and mobile. It changes by role: Jack is asked for AHPRA, Mia for an award classification. Students like Zoe give year of study. Pharmacists like Sara have their own track; Explorers have a third."},{"id":"ON-Q02","q":"Sara is a locum pharmacist. She has just signed up, is not a member of any pharmacy and is not verified yet. She wants to look at shifts and apply for a public Saturday shift at Tom's Pharmacy. What should she be allowed to do?","context":"Letting new workers look around keeps them interested, but an unchecked pharmacist must never end up working a shift.","gap":"ON-01","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara browses everything; only applying to public shifts needs Verified."},{"key":"A","label":"Sara browses all, but Apply asks her to verify","detail":"She sees every open shift; applying, accepting and booking show a checklist of what to finish."},{"key":"B","label":"Sara must confirm email and mobile to browse","detail":"Stops bots and fake sign-ups; Sara can still look around before verifying."},{"key":"C","label":"Sara sees nothing until verified","detail":"Strictest. Many new workers like Sara leave before finishing."}],"rec":"A","recWhy":"Browsing is low risk. Check the right things whenever Sara applies, accepts an offer or asks to book, and show her a clear checklist of what is left to verify.","sources":[],"current":"Today Sara logs in with an email code and browses every board. Tapping Apply on Tom's public shift is blocked until she is verified, or if her AHPRA result is not-found or unreadable. If suspended, she is locked out entirely. Tom's staff and favourites skip the check."},{"id":"ON-Q03","q":"Nadia is a pharmacist at Tom's other pharmacy, so she is not a member of Tom's Pharmacy in Parramatta. Her AHPRA result has come back suspended. Tom posts a Parramatta shift to the chain and Nadia accepts. Tom also books Sara straight from the Talent Board. Where should AHPRA be checked?","context":"A pharmacist whose registration is suspended must not work any shift, whichever board it was posted on.","gap":"ON-01","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Only public shifts are checked; Nadia's chain booking and Sara's Talent Board booking go through."},{"key":"B","label":"Nadia and Sara are checked on every outside booking","detail":"Anyone not a member of Tom's Parramatta pharmacy is checked on chain, organisation, Talent Board and public bookings."},{"key":"C","label":"B, plus Tom's own staff before rostering","detail":"Omar and Jack are also checked before Tom rosters them."}],"rec":"B","recWhy":"Today public shifts are already checked, and members never need AHPRA, as the owner ruled. Extend the same check to non-members like Nadia on chain, organisation and Talent Board bookings. Who counts as a member is the next question.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"Today Nadia's chain booking goes through with no check, and so does Sara's Talent Board booking. Only public applying, accepting an offer and counter-offers check Verified and the latest AHPRA result. Members of the posting pharmacy, including favourites, are exempt, and Tom's own roster is never checked."},{"id":"ON-P01","q":"Ben is one of Tom's favourite locums: an outside pharmacist who has worked at Tom's before. Omar is Tom's employed pharmacist. Both apply for a public shift at Tom's Pharmacy. Ben's AHPRA has just come back suspended. Who should skip the AHPRA check?","context":"A favourite locum is an outside contractor the platform books, so a lapsed registration could put an unlawful pharmacist behind Tom's counter.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Ben and Omar both skip AHPRA at Tom's; a suspended Ben keeps booking."},{"key":"A","label":"Omar skips the check; Ben is checked","detail":"Ben passes AHPRA like any public worker. Omar is checked by Tom as the employer."},{"key":"B","label":"Nobody skips; Ben and Omar are both checked","detail":"If Omar is suspended, Omar loses all pharmacist shifts, even at Tom's."}],"rec":"A","recWhy":"Employers check their own staff, but Ben is an outside contractor the platform books. Today a suspended favourite keeps booking Tom's shifts. AHPRA tells employers to check the public register.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"Today both Ben and Omar skip AHPRA on Tom's public shifts, because favourites count as members. Ben keeps booking Tom's shifts even while suspended: Ben is never paused and only loses other pharmacies' public shifts. Invitations never need AHPRA."},{"id":"ON-Q04","q":"Sara is a verified locum pharmacist with an ABN, but has not entered her bank or super details. She applies for Tom's Saturday shift and Tom sends her an offer. When should Sara be told what pay details are missing, and when must they be done?","context":"Finding a missing detail at the last step can lose Sara the shift, while asking for everything up front scares new workers off.","gap":"ON-11","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara learns what is missing only when she taps Accept."},{"key":"A","label":"Sara must finish pay details before applying","detail":"Fewer surprises later, but more workers like Sara give up before their first application."},{"key":"B","label":"Sara is told early, must finish before accepting","detail":"Same gate as today, but a checklist of missing details shows on the apply and offer screens."},{"key":"C","label":"Sara only needs details before her first payment","detail":"Fastest booking; risk she works unpaid or is wrongly set up as ABN or TFN."}],"rec":"B","recWhy":"The gate is right, but Sara only learns what is missing at the last step. Airtasker and ShiftKey ask for tax and payment details up front; showing the checklist on apply and offer screens removes the surprise.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/42073609183641-Having-problems-verifying-my-account-what-should-I-do"},{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/essential-tips-for-professionals-using-shiftkey"}],"current":"Today Sara can apply with nothing filled in. She only finds out what is missing when she taps Accept on Tom's offer, and is stopped there. TFN workers can add payroll details later. Web and mobile show the gaps only in the accept dialog."},{"id":"ON-Q05","q":"Zoe is a pharmacy student who signed up as an Explorer, someone new to pharmacy. Zoe sees a public shift at Tom's Pharmacy and taps Apply. What should Zoe be able to do with shifts?","context":"Explorers applying to shifts they can never take wastes pharmacies' time and makes the app look broken to new workers.","gap":"ON-09","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Zoe sees boards and can apply, but can never accept an offer."},{"key":"A","label":"Zoe sees no shifts at all","detail":"The shift boards are hidden; Zoe uses the Talent Board only."},{"key":"B","label":"Zoe can join unpaid shadowing days only","detail":"A new type of post for observation days at pharmacies like Tom's."},{"key":"C","label":"Zoe upgrades to student, then gets paid shifts","detail":"The upgrade card already exists; Zoe then passes the student checks before applying."}],"rec":"C","recWhy":"Today Zoe can apply to shifts Zoe can never accept, wasting Tom's time. Locumate and Locate a Locum tie shift access to role checks; the existing upgrade card moves Explorers into a real track.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-sign-up-as-a-job-seeker-shift-work-inc-ft-pt"},{"name":"Locate a Locum","url":"https://locatealocum.com/document-checklist"}],"current":"Today on web Zoe sees the public and community boards and can apply with no checks, but can never accept an offer, so Tom's time is wasted. On mobile, Zoe's shifts tab is a blank placeholder. There is no Explorer payment tab."}]},{"id":"ON-S2","name":"Credentials and expiry","why":"Registration and ID are the trust signal pharmacies pay for.","questions":[{"id":"ON-Q06","q":"Sara is a verified locum pharmacist booked for Tom's shift next Saturday. Mid-year, AHPRA suspends her registration, though her stored expiry date is months away. How should ChemistTasker find out before Saturday?","context":"A suspended pharmacist working Tom's shift is unlawful and puts Tom at risk, so changes must be caught before the shift, not after.","gap":"ON-02","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Re-check button, plus a recheck only after the stored expiry passes."},{"key":"A","label":"Daily scan catches Sara before Saturday","detail":"Workers with upcoming bookings are rechecked daily, and again when accepting an offer."},{"key":"B","label":"Sara is checked only when accepting","detail":"Current at booking time; a later suspension is missed with no early warning."},{"key":"C","label":"Weekly scan of the register","detail":"Cheaper, but Sara's suspension could be found up to a week late."}],"rec":"A","recWhy":"Today rechecks run only after the stored expiry, so a mid-year suspension goes unseen. AHPRA calls the public register the accurate source; a daily scan of booked workers catches changes before the shift.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"},{"name":"AHPRA renewal","url":"https://www.ahpra.gov.au/Registration/Renewal.aspx"}],"current":"Today Sara's AHPRA was looked up once at sign-up. With the desktop verifier on, Sara can press Re-check at most hourly, and a public apply or accept after the stored expiry queues a recheck. Nothing scans the register, so the suspension stays unseen unless Sara presses Re-check."},{"id":"ON-P03","q":"Sara signs up as a locum pharmacist today, and ChemistTasker must look her up on the AHPRA register. Which lookup should run at launch: the paid ScrapingBee service, or the desktop verifier, a Chrome extension on an office PC that reads the register?","context":"Only the desktop verifier makes the suspension and re-check safeguards actually work; with ScrapingBee they sit switched off.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"ScrapingBee looks Sara up once at sign-up; suspension handling stays off."},{"key":"A","label":"Desktop verifier checks Sara","detail":"Suspension, not-found and Re-check work. The office PC must stay on; new sign-ups wait for it."}],"rec":"A","recWhy":"Only the desktop source feeds the suspension, not-found and Re-check handling; under ScrapingBee those safeguards never fire. Run it on staging first, since staging still uses ScrapingBee.","sources":[],"current":"Today ScrapingBee looks Sara up once at sign-up, and nothing more. With the desktop verifier switched on, Sara also gets Re-check, and suspension and not-found handling work. Sara's check then waits for the office PC; admins are emailed if it waits 15 minutes."},{"id":"ON-Q07","q":"Sara is a verified locum booked for Tom's shift next Saturday. A routine AHPRA lookup now says 'not found'. Maybe the page could not be read, maybe she is mid-renewal. What should happen to Sara's booking at Tom's, and who should be told?","context":"A misread page or a renewal in progress is not a lapse, but Tom still needs to know before Saturday.","gap":"ON-02","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara cannot apply for new shifts; Saturday stays booked; nobody warns Tom."},{"key":"A","label":"Booking stays; Sara and Tom are both warned","detail":"Sara must sort out her registration before the shift starts."},{"key":"B","label":"Sara's booking is cancelled automatically","detail":"Fast, but may cancel a pharmacist who is only renewing."},{"key":"C","label":"No new shifts; support reviews Saturday's booking","detail":"Support checks Sara's registration and helps Sara and Tom decide what to do."}],"rec":"C","recWhy":"Today new shifts are already blocked, the first half of C. A misread page or past expiry date alone is not a lapse, so a person should review existing bookings and warn both sides rather than cancel.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"Today Sara loses Verified and cannot apply for new public shifts. Her Saturday booking at Tom's stays, and nobody tells Tom. Unreadable or rejected results work the same way. Only a suspended or non-General result cancels her future public bookings."},{"id":"ON-P02","q":"Sara is a locum pharmacist with three public shifts booked, one at Tom's. The AHPRA register now shows her as Suspended. What should ChemistTasker do with her bookings and her account?","context":"Working while suspended is unlawful, and Tom needs as much time as possible to find another pharmacist.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara's future public bookings cancel automatically; Sara is paused; Tom and admins are told."},{"key":"A","label":"New bookings blocked; a person confirms before cancelling","detail":"Sara cannot book anything new at once; Tom's shift is cancelled only after an admin checks."}],"rec":"KEEP","recWhy":"Working while suspended is unlawful, and an exact register status rarely misreads; fast cancellation gives Tom time to refill. Any booking fee Tom already paid is settled in the cancellation questions.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"Today Sara's future public bookings are cancelled and Tom is told. Sara, a non-member, is paused account-wide and admins are emailed. Suspended pharmacist owners become Pharmacy Managers. Bookings with leave, attendance or invoice history are kept for admins. A non-General result cancels without pausing. No fee or refund rule runs."},{"id":"ON-Q08","q":"Sara is a locum pharmacist and Mia is a casual pharmacy assistant. Neither has ever shown government ID on ChemistTasker. Sara is about to accept her first shift at Tom's. Who should pass an ID check before working?","context":"Without an ID check, Tom cannot be sure the person who turns up is the pharmacist whose AHPRA record was checked.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Only overseas Explorers who skip the mobile check show ID."},{"key":"A","label":"Sara and Mia both show ID before first booking","detail":"One check, reused at every pharmacy."},{"key":"C","label":"Sara is checked; Mia skips it as an employee","detail":"Pharmacists and ABN workers only; employed support staff like Mia skip it."}],"rec":"A","recWhy":"Today most workers are never ID-checked. Clipboard, Hireup and Relief Buddy check government ID before work; the ID reader and the on/off setting already exist, so this is a rule change, not new tooling.","sources":[{"name":"Clipboard","url":"https://www.clipboard.com/for-workers"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360016020691-What-do-I-need-to-register-as-a-Hireup-support-worker"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-change-my-profile-picture"}],"current":"Today neither Sara nor Mia is ID-checked. Only overseas Explorers who skip the mobile check must upload ID. A setting can add ID to Verified for everyone, but it is off; the ID reader already works for all."},{"id":"ON-R01","q":"Sara uploaded her driver licence and degree certificate to get verified. She is now Verified. How long should ChemistTasker keep those files?","context":"Australian privacy law says personal information must be destroyed once no longer needed, and stored ID files make any data breach worse.","gap":"ON-12","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara's files are kept with no deletion date."},{"key":"A","label":"Sara's files are deleted after verification","detail":"Only the result, source and audit dates are kept."},{"key":"B","label":"Sara's files are kept seven years","detail":"Bigger harm if leaked; needs a legal reason."}],"rec":"A","recWhy":"Privacy principle APP 11 requires destroying or de-identifying information once it is no longer needed. Set a schedule per type of evidence and keep only the verification audit record unless law requires more.","sources":[{"name":"OAIC APP 11","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-11-app-11-security-of-personal-information"}],"current":"Today Sara's licence and certificate are stored with no deletion date. Each AHPRA lookup also keeps a copy of the register page, kept forever. No retention schedule exists for verification files."}]},{"id":"ON-S3","name":"Insurance and super","why":"Cover and super must be right before money moves.","questions":[{"id":"ON-Q09","q":"Sara is a locum pharmacist on an ABN. Omar is Tom's employed pharmacist, and Jack is an intern with provisional registration. Which of them should prove professional indemnity insurance before working shifts?","context":"The Pharmacy Board requires practising pharmacists to hold cover, so a shift worked without it is a risk for Tom and the worker.","gap":"ON-03","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"No insurance evidence is collected from anyone."},{"key":"A","label":"Only Sara, the ABN pharmacist, must prove cover","detail":"Misses employed pharmacists like Omar and provisional registrants like Jack."},{"key":"B","label":"Sara, Omar and Jack all must prove cover","detail":"All practising pharmacists: general, limited or provisional; own cover or employer-provided."},{"key":"C","label":"Cover shown as a badge only","detail":"Tom sees who has cover, but bookings are never blocked."}],"rec":"B","recWhy":"The Pharmacy Board standard covers practising pharmacists with general, limited or provisional registration, whether cover is personal or provided by an employer. Having an ABN is not the test.","sources":[{"name":"Pharmacy Board PII standard","url":"https://www.pharmacyboard.gov.au/documents/default.aspx?chksum=VYWldu%2FPTLuLnEzS1inDaQ%3D%3D&dbid=AP&record=WD15%2F19184"}],"current":"Today nobody is asked. There is no insurance field, no upload, no expiry date and no booking check, so Sara, Omar and Jack all book without showing cover."},{"id":"ON-Q10","q":"Sara is a locum pharmacist invoicing Tom on her ABN for a Saturday shift. She only provides her own labour. When Sara reads the contractor terms, what should they say about super?","context":"Labour-only contractors can still be owed super, so getting the wording wrong could leave Tom with an unpaid super bill.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"The terms warn that Tom must check whether Sara is owed super."},{"key":"B","label":"Terms say Sara handles her own super","detail":"Simple, but may be wrong for labour-only contractors."},{"key":"C","label":"Ask a lawyer first; say nothing at launch","detail":"Leaves the question open for Tom and Sara."}],"rec":"KEEP","recWhy":"Today's notice already matches the ATO rule that labour-only contractors can be owed super. The worry that contractor terms never mention super is out of date.","sources":[{"name":"ATO","url":"https://www.ato.gov.au/businesses-and-organisations/super-for-employers/work-out-if-you-have-to-pay-super/super-for-independent-contractors"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"}],"current":"Today Sara's ABN terms already carry a super notice, on web and mobile: invoicing does not remove super duties, and Tom must check whether super is owed for a labour-only contractor like Sara."}]},{"id":"ON-S4","name":"Pharmacy setup","why":"Workers need a real, payable site before they accept.","questions":[{"id":"ON-S01","q":"Lina is organisation admin for the banner group that includes Tom's Pharmacy. Grace is region admin, and the pharmacy also has a pharmacy admin. Each opens Tom's pharmacy record and wants to change its details or delete it. Who should be allowed?","context":"Deleting a pharmacy wipes out its shifts, staff and billing, so only senior people should be able to do it.","current":"Today only Tom, as owner, and Lina, as organisation admin, can edit or delete Tom's pharmacy. Grace and the pharmacy admin cannot, and web and mobile hide the buttons from them.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Only Tom and Lina can edit or delete Tom's pharmacy."},{"key":"A","label":"Pharmacy admins can also edit, not delete","detail":"Tom's pharmacy admin can change details but still cannot delete the pharmacy."}],"rec":"KEEP","recWhy":"Deleting a pharmacy affects shifts, staff and billing, so a small set of senior roles is safer.","sources":[]},{"id":"ON-Q11","q":"Tom has just signed up Tom's Pharmacy. Nobody has checked its ABN or confirmed it is a real pharmacy. Tom posts a Saturday shift straight to the public board, and Sara, a verified locum, accepts it. What should a pharmacy pass before posting to outside workers?","context":"A fake pharmacy could lure locums like Sara to a made-up address; public workers do not know the site the way chain staff do.","gap":"ON-06","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom posts anywhere with no pharmacy checks."},{"key":"B","label":"Tom's ABN must be verified for outside posts","detail":"An automatic ABN check before posting beyond Tom's own staff."},{"key":"C","label":"ABN plus an admin check before public posts","detail":"A person reviews Tom's pharmacy before Tom can post to the public board."},{"key":"D","label":"ABN for chain posts; admin check too for public","detail":"Chain and organisation posts need Tom's ABN verified; public posts also need a person's review."}],"rec":"D","recWhy":"Today a fake site can post publicly and be accepted. Locumate only activates pharmacy accounts after review. Chain and organisation workers already know the site; public workers like Sara do not.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-create-a-pharmacy-account-on-locumate"}],"current":"Today Tom can post straight away. Posting checks neither the pharmacy's Verified flag nor its ABN, so any pharmacy can post to every board, including public, and Sara can accept a shift at a site nobody has checked."},{"id":"ON-L01","q":"Tom adds Tom's Pharmacy Parramatta, then adds it again with the same name and address, thinking the first save failed. Now there are two Parramatta pharmacies, with staff and shifts split between them. Should ChemistTasker stop a second pharmacy with the same details?","context":"Some owners run several pharmacies under one ABN, so a shared ABN alone does not mean a duplicate.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom can add identical pharmacies and must spot and delete duplicates himself."},{"key":"A","label":"Tom is warned and can open the saved one","detail":"Same name and address shows the existing pharmacy; Tom can still continue if it is really separate."},{"key":"B","label":"A second pharmacy at that address is blocked","detail":"Tom cannot save it; support sorts out genuine cases."}],"rec":"A","recWhy":"A warning stops accidental duplicates without blocking real cases, such as two shops in one centre. Staff, shifts and billing split across duplicates are harder to undo than a warning.","sources":[],"current":"Today a deliberate second Add creates a second pharmacy. Only a retry of the same save after a lost response is caught. Nothing compares name, address, ABN or map place, so testers made two identical pharmacies."},{"id":"ON-Q12","q":"Tom is posting the first shift for Tom's Pharmacy. Sara, a locum who has never been there, will want to know the dispensing software, how many staff are on, where to park and who to ask for on arrival. Which of these must Tom fill in before posting?","context":"Locums who arrive to unfamiliar software, no parking or no contact start late and stressed, and the shift goes worse for Tom.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Everything optional; parking, contact and arrival have no field."},{"key":"A","label":"Tom must add software, staffing, parking, contact","detail":"Each shift copies these from the pharmacy, and Tom can change them per shift."},{"key":"C","label":"Full brief, including script volume and services","detail":"Tom also fills in services and weekday and weekend script volumes before posting."}],"rec":"A","recWhy":"Software and script volume exist but are optional, and parking, contact and arrival are missing. Locumate collects software, services and contacts at setup and Relief Buddy filters by software; a required core stops most mismatches.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-create-a-pharmacy-account-on-locumate"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-post-a-shift"}],"current":"Today Tom can post with none of it. Software, services and weekday/weekend script volume are optional on the profile; each shift adds optional duties and staff-on-shift counts. Parking, contact and arrival steps have no field, so Sara may arrive not knowing where to go."},{"id":"ON-Q13","q":"Tom posts an urgent shift starting in 90 minutes. Sara accepts. Tom now has to pay the booking fee before Sara is confirmed. Should Tom save a card when setting up the pharmacy, so bookings are charged straight away?","context":"Once payment deadlines arrive, urgent shifts will often expire unpaid while the owner is busy at the counter.","gap":"ON-08","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom pays through a new Stripe checkout for each booking; no saved card."},{"key":"B","label":"Tom's saved card is charged when Sara accepts","detail":"Sara is confirmed in seconds; the payment is still checked before confirming."},{"key":"C","label":"Only subscribers can save a card","detail":"Other pharmacies keep one checkout per booking."}],"rec":"B","recWhy":"Once payment deadlines are built, urgent shifts will often expire unpaid inside the 30-minute window. Sidekicker requires a card before the first hire, and Mable needs payment details before booking.","sources":[{"name":"Sidekicker","url":"https://help.sidekicker.com/en/articles/8320035-how-to-add-a-credit-card"},{"name":"Mable","url":"https://mable.com.au/help_centre/how-do-i-sign-up-as-a-client-on-mable/"}],"current":"Today Tom goes through a fresh Stripe checkout for every booking; no card is saved. Sara's accepted offer waits for payment with no time limit. Payment deadlines are not on PR #198 (built in draft PR #182); with them, Tom would have 30 minutes to pay."}]},{"id":"ON-S5","name":"Organisations and devices","why":"How groups join, and whether phone users get the full flow.","questions":[{"id":"ON-Q14","q":"Lina runs a banner group of pharmacies, including Tom's. Lina wants the group on ChemistTasker and looks for a way to sign the organisation up. How should groups like Lina's join?","context":"Groups control many pharmacies at once, so letting anyone create one without review would be a big trust risk.","gap":"ON-07","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"A ChemistTasker admin creates Lina's organisation; no self sign-up."},{"key":"B","label":"Lina signs up, then waits for approval","detail":"A new sign-up role plus an admin review queue."},{"key":"C","label":"Lina signs up and gets in straight away","detail":"No review; highest risk."}],"rec":"KEEP","recWhy":"Sales-led setup is what Patchwork does, and suits the few groups joining at launch. Only the unused web create page needs deleting, a cleanup, not a rule change.","sources":[{"name":"Patchwork","url":"https://patchwork.health/temporary-staffing"}],"current":"Today Lina cannot sign up the group. Only a ChemistTasker platform admin can create an organisation; Lina's group then claims or invites pharmacies like Tom's by email. A web create page exists, but nothing links to it."},{"id":"ON-Q15","q":"Tom runs Tom's Pharmacy from a phone. In the mobile app, Tom adds a personal pharmacist profile so Tom can also take locum shifts. Must every onboarding step like this work on mobile at launch?","context":"Most pharmacy staff live on their phones, so a broken mobile step means lost data or a dead end.","gap":"ON-04","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Adding a personal profile on mobile stays broken; other steps unchanged."},{"key":"A","label":"Every step works for Tom on web and mobile","detail":"Full match: nothing on mobile loses data or ends on not-found."},{"key":"B","label":"Mobile covers basics; the rest links to web","detail":"Less to build, but Tom must switch to a computer."}],"rec":"A","recWhy":"Today managers who upgrade on mobile lose data or hit a dead end. Florence and Staffy run onboarding inside the app with visible progress.","sources":[{"name":"Florence","url":"https://www.florence.co.uk/looking-for-work/registration"},{"name":"Staffy","url":"https://staffy.com/faq"}],"current":"Today Tom's pharmacist details are sent but the server drops them, so they are lost. A manager adding an intern, technician, assistant or student profile lands on a not-found page. Profile tabs otherwise match on web and mobile."},{"id":"ON-M01","q":"Sara uses the shared computer at Tom's Pharmacy. Sara half-writes a community hub post, signs out without posting, and Tom signs in on the same browser tab. Later Sara signs back in there. What should happen to Sara's unsent text?","context":"Keeping the text saves Sara retyping, but it stays on a shared computer after Sara signs out.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara's text waits, unseen by Tom, until the tab is closed."},{"key":"A","label":"Sara's text is deleted on sign-out","detail":"Nothing stays on the shared computer; Sara retypes anything unsent."},{"key":"B","label":"Sara chooses when signing out","detail":"Signing out with unsent text asks Sara to keep or delete it."}],"rec":"KEEP","recWhy":"Hub posts and comments are public once sent, so unsent text is low risk, and Tom cannot see it. Deleting it on sign-out would frustrate staff who share one dispensary computer.","sources":[],"current":"Today drafts are kept per person, so Tom never sees Sara's text. Sara gets the hub post and comment text back on signing in again before the tab is closed; closing it deletes them. Attached files are not kept."},{"id":"ON-M02","q":"Lina and Grace share the head office computer and browser. Lina is part-way through editing Tom's pharmacy details in one tab. Grace, in another tab, signs Lina out and signs in as Grace. What should happen to Lina's open tab?","context":"One browser holds one signed-in account, so two people on one computer can lose each other's open work.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Lina's tab switches to Grace at once; Lina's unsaved edits are lost."},{"key":"A","label":"Lina's tab warns and keeps the edits","detail":"Lina's tab says who signed in and shows the unsaved edits to copy, without saving them as Grace."},{"key":"B","label":"Lina and Grace each stay signed in","detail":"Each tab keeps its own account; a large change to how sign-in works."}],"rec":"KEEP","recWhy":"One account per browser stops Grace acting with Lina's wider organisation rights, and Lina's screens hide at once. Lost edits are rare; people sharing a computer can use separate browser profiles.","sources":[],"current":"Today one browser holds one account. When Grace signs in, Lina's open tab hides its screens at once, checks who is signed in and reloads as Grace, so Lina's unsaved edits are lost. If that check stalls for 20 seconds, a Reconnect prompt shows."}]}]},{"id":"posting","name":"Post a shift","summary":"What a pharmacy enters, who sees it, and what it costs.","steps":[{"id":"PO-S1","name":"Shift details","why":"What a worker needs to judge the shift.","questions":[{"id":"PO-Q01","q":"Tom posts a Saturday shift. Sara, a locum, wants to know her duties, whether she will be the only pharmacist on, when her break is and where to park. Where should Tom enter these details?","context":"Retyping the same details for every shift is tiring, and missing ones leave Sara surprised on the day.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom retypes duties and staffing per shift; no break or parking field."},{"key":"A","label":"Tom enters a site brief once; shifts can override","detail":"Saved per pharmacy and copied into each shift, where Tom can change anything."},{"key":"B","label":"Tom enters everything on every shift","detail":"More typing, and easy to forget."}],"rec":"A","recWhy":"Today duties and staffing are retyped on every shift, and breaks and parking are missing. Locumate and Relief Buddy collect these per posting; a reusable site brief saves retyping, and shift overrides keep it accurate.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-post-a-shift"}],"current":"Today Tom types duty tags and staff-on-shift counts into every shift, on web and mobile. Breaks and parking have no field, so Sara never sees them. Software, services and script volume sit on the pharmacy profile."},{"id":"PO-R01","q":"Tom posts a TFN shift for a pharmacy assistant like Mia: a short Sunday shift at the weekday rate, with no break. It may break Pharmacy Award rules on minimum hours, breaks and penalty rates. Should ChemistTasker check the Award before the shift goes live?","context":"If Mia accepts terms below the Award, Tom is underpaying staff, which Fair Work treats seriously.","gap":"SH-12","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom posts first; problems are only caught in later review, if at all."},{"key":"A","label":"Tom's post is blocked until it meets the Award","detail":"Checks minimum hours, breaks, penalty rates and overtime before Mia can see it."},{"key":"B","label":"Tom is warned but can still post","detail":"A warning shows; Tom can continue anyway."}],"rec":"A","recWhy":"The Pharmacy Award sets minimum hours, breaks, ordinary-hour limits, penalties and overtime. Check TFN terms before a worker like Mia accepts them.","sources":[{"name":"Pharmacy Industry Award","url":"https://awards.fairwork.gov.au/MA000012.html"}],"current":"Today Tom's shift posts as typed. Each date's length is accepted on its own, with no full Award check. Pay calculations flag some low rates and long days, but miss rules like minimum hours, breaks and all overtime."},{"id":"PO-Q02","q":"Sara sees Tom's 9-hour Saturday shift. She wants to know how long her break is and whether it is paid. Must every shift say this?","context":"If break length and pay are unclear, Sara and Tom will argue over the hours on the timesheet.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"No break shown; only whatever Tom types in the description."},{"key":"A","label":"Tom must state break minutes, paid or unpaid","detail":"A required field; Sara sees the break length and whether it is paid."}],"rec":"A","recWhy":"Today Sara cannot tell how long the break is or whether it is paid. Qwick states unpaid breaks come off paid hours; without a field, timesheet disputes follow.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5563649"}],"current":"Today Sara cannot tell. Roster shifts store planned break minutes, but the posting form on web and mobile has no break field, and nothing says paid or unpaid. The terms Sara accepts do not mention breaks."}]},{"id":"PO-S2","name":"Rates and costs","why":"Both sides must see the real money before committing.","questions":[{"id":"PO-Q03","q":"Sara looks at Tom's Saturday locum shift, which she would work on her ABN. She wants to know what she will actually be paid: the hourly rate, whether super is on top, whether GST applies, and the total for the day. What should she see?","context":"Workers compare shifts by what lands in their pocket, and unclear GST or super leads to wrong invoices.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Hourly rate plus an optional super chip; no GST or total."},{"key":"A","label":"Sara sees rate, super, GST and shift total","detail":"Each shown separately, with an estimated total for the whole shift."},{"key":"B","label":"Sara sees one all-in rate","detail":"Simpler, but hides super and GST."}],"rec":"A","recWhy":"Super already shows when selected. Add an estimated total and say clearly whether GST is included, added or not applicable; confirm the tax treatment before launch.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"}],"current":"Today Sara sees the hourly rate, plus a '+ Super' chip if Tom ticked 'Super paid on top'. Full/part-time shifts show the super %. Sara sees no GST line and no total for the shift."},{"id":"PO-Q04","q":"Tom is posting a Saturday locum shift at $75 an hour. Before posting, Tom wants to know what the shift will really cost: wages, super, ChemistTasker's booking fee and GST. What should Tom see?","context":"A surprise fee at checkout feels like a hidden charge and makes owners like Tom distrust the platform.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom sees wages only; the booking fee appears at checkout."},{"key":"A","label":"Tom sees wages, super, fee and GST up front","detail":"One total before posting, and again before paying."}],"rec":"A","recWhy":"The booking fee first appears at checkout. Show wages, super, platform fee, GST treatment and the total payable before posting and again before payment.","sources":[{"name":"ACCC price displays","url":"https://www.accc.gov.au/business/pricing/price-displays"},{"name":"Locumate pricing","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"}],"current":"Today Tom sees the hourly rate and wages per date while posting. Super, GST and the booking fee are not shown; Tom first sees the fee at Stripe checkout, after Sara has accepted."}]},{"id":"PO-S3","name":"Dates, blocks and repeats","why":"Continuity needs differ from filling single days.","questions":[{"id":"PO-Q05","q":"Tom needs one pharmacist for Monday to Friday next week, the same person every day. Sara sees the post. How should Tom say 'same person for every date', and how does Sara know it is all or nothing?","context":"Tom wants the same pharmacist all week, and Sara needs to know she is committing to all five days.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom's 'One person works every date' switch makes the week all or nothing."},{"key":"B","label":"Every date is always booked separately","detail":"Simpler, but Tom may get a different pharmacist each day."}],"rec":"KEEP","recWhy":"Today's switch is exactly what Locumate asks when posting multi-day work. The only gap is that Sara's card does not say 'all dates required', which is a label fix.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"}],"current":"Today Tom ticks 'One person works every date' on web or mobile. One worker then takes the whole week and date picking is hidden. Without the tick, each date is booked separately. Sara's card does not say 'all dates required'."},{"id":"PO-Q06","q":"Tom posts a repeating Tuesday shift and sets the end date to 2028. Sara sees Tuesdays on offer for the next two years at today's rate. How far ahead should repeating shifts be allowed?","context":"Rates and availability change, so shifts posted years ahead go stale and mislead workers like Sara.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Any end date allowed; no limit."},{"key":"A","label":"Up to 12 weeks ahead; Tom reposts to extend","detail":"Tom's Tuesday shifts stop after 12 weeks unless Tom posts them again."},{"key":"B","label":"Up to 6 months ahead","detail":"Fewer reposts for Tom, but rates may drift."}],"rec":"A","recWhy":"Today a repeat can run for years, so rates and availability go stale. Hireup's board handles one-off, weekly and fortnightly needs; a 12-week limit keeps posts current.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360015006131-The-Job-Board"}],"current":"Today Tom can do this. Repeating shifts need weekdays and an end date, which defaults to the start date, but web, mobile and the server set no maximum."},{"id":"PO-Q07","q":"Tom posted a Saturday shift last month that Ben worked. Tom needs the same shift again this Saturday. How should Tom repeat it?","context":"Owners post similar shifts every week, and retyping wastes time and invites mistakes.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom retypes each shift; only the description can be reused."},{"key":"A","label":"Tom taps 'Post again' and checks the dates","detail":"A copy of the past shift opens with the dates for Tom to confirm."},{"key":"B","label":"Tom saves named templates","detail":"More setup for Tom first."},{"key":"C","label":"Both 'Post again' and templates","detail":"Most flexible; most to build."}],"rec":"A","recWhy":"Today Tom retypes every repeat shift. Instawork's book-again copies location and instructions with dates for review, and LocumCo+ offers duplication.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/10081823-exploring-the-shift-details-page"},{"name":"LocumCo+","url":"https://locumco.com.au/latest-news/locumco-plus-manage-locum-shifts/"}],"current":"Today Tom retypes the whole shift. There is no 'post again', copy or shift template; Tom can only save and reuse a description per pharmacy and role, on web and mobile."}]},{"id":"PO-S4","name":"Audiences and escalation","why":"Owner-set schedules must actually fire and reach the new audience.","questions":[{"id":"PO-Q08","q":"Tom posts a Saturday shift to Tom's favourite locums first, set to open to the public board a day later. Ben applies, then declines Tom's offer. Sara lives nearby and has said she is free Saturdays. Who should be told as the shift opens up, and when should it stop?","context":"If newly eligible workers are not told, or one declined applicant freezes the shift, Tom is left with nobody on Saturday.","gap":"SH-06","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Opening up is silent, and Ben's past interest stops it for good."},{"key":"A","label":"Each new group is told; stops once someone is reserved","detail":"Sara is told when the shift reaches the public, if Tom allowed notices; opening stops once a worker holds it."},{"key":"B","label":"Only the public is told; first interest stops it","detail":"Today's stop rule: Ben's interest still freezes the shift."},{"key":"C","label":"Tom chooses per shift","detail":"One more setting on Tom's posting form."}],"rec":"A","recWhy":"Today newly eligible workers are never told, and one declined applicant strands the shift. CareRev cascades openings across teams, and Locumate releases shifts on a schedule.","sources":[{"name":"CareRev","url":"https://www.carerev.com/solutions/carerev-irp"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"Today the shift never reaches Sara: once Ben showed interest, opening up stopped for good, even after Ben declined. Opening to a new group sends no notice. Availability emails only go out when a shift is posted straight to public."},{"id":"PO-Q09","q":"Tom's shift is open to Tom's favourite locums. Tom sends Ben an offer, and Ben has not answered yet. The shift is due to open to the public. Should opening up pause while Ben decides?","context":"Opening up while Ben decides could have two workers chasing one shift; never resuming leaves Tom's shift empty.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Opening up stops at Ben's interest and never resumes."},{"key":"A","label":"Pause for Ben; resume if Ben declines or lapses","detail":"Nobody else races Ben for the shift, and it keeps opening if Ben says no."},{"key":"B","label":"Keep opening up while Ben decides","detail":"Fills faster, but more workers are let down."}],"rec":"A","recWhy":"Today opening up never resumes after a decline or expiry, so the shift can sit empty. Instawork offers to selected workers first, then falls back to others.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/2062210-selecting-pros-for-your-shift"}],"current":"Today there is no pause. Once Ben showed interest, opening up stopped for good, so if Ben declines or the offer expires, the shift never reaches the public."},{"id":"PO-Q10","q":"Tom sets a Saturday shift to open to the public at 6 pm Friday. Nobody opens a shift list that evening, so it stays closed and Sara never sees it. How late may a scheduled opening be?","context":"Tom trusts the timing set on the shift; a shift that opens hours late can miss every available locum.","gap":"SH-05","type":"code","options":[{"key":"A","label":"Within 5 minutes","detail":"A timed job runs every few minutes and opens due shifts."},{"key":"B","label":"Within 1 minute","detail":"Same job, run more often."},{"key":"C","label":"Within 15 minutes","detail":"Cheapest; Sara may see it a little later."}],"rec":"A","recWhy":"The server already runs timed jobs, such as content publishing every 60 seconds, so this is cheap. Five minutes is plenty for owner-set timings; CareRev releases shifts by rule, not page views.","sources":[{"name":"CareRev","url":"https://www.carerev.com/solutions/carerev-irp"}],"current":"Today opening up only runs when someone loads a shift list or a shift's page. There is no timed job, so due openings happen late or never, and each page load scans every due shift."}]},{"id":"PO-S5","name":"Anonymous and urgent","why":"Privacy and speed without misleading workers.","questions":[{"id":"PO-Q11","q":"Tom posts an anonymous public shift so a nearby rival cannot tell who is short-staffed. Sara browses the public board. What should Sara see about the pharmacy, and what should stay hidden?","context":"Sara needs enough to judge travel and workload, while Tom needs to stay unidentifiable to competitors.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Name, street, software and services hidden; suburb and rate shown."},{"key":"B","label":"Sara also cannot see the suburb","detail":"Only the region shows; harder for Sara to judge travel."}],"rec":"KEEP","recWhy":"Today hides the identifying details and keeps the suburb workers need to judge travel, as Mable does. Hiding software and services also helps, since they could identify a small-suburb pharmacy.","sources":[{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"Today Sara sees 'Anonymous Pharmacy', the suburb, state, postcode, script volume and the rate. The name, street, software and services are hidden from everyone except Tom's managers."},{"id":"PO-Q12","q":"Sara is offered an anonymous shift in Parramatta. She does not know which pharmacy it is; it is Tom's. When should Sara learn the pharmacy's name?","context":"Sara is agreeing to work for a business, so she should know who it is before she commits.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara accepts blind; the name shows only in the reminder email."},{"key":"A","label":"Sara sees the name in the agreement preview","detail":"Before she accepts the shift."},{"key":"B","label":"Sara sees the name once the shift is held","detail":"Sara still accepts blind."},{"key":"C","label":"Sara sees the name once Tom pays","detail":"Sara commits blind and finds out only when confirmed."}],"rec":"A","recWhy":"Today Sara agrees to work for an unknown business and learns the name by accident in an email. Relief Buddy shows the shift agreement before the worker commits.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"}],"current":"Today Sara never sees the name before accepting: the terms leave it out and the notice says 'Shift in Parramatta'. Cards stay anonymous after booking; Sara finds out from the reminder email 12 hours before."},{"id":"PO-Q13","q":"Tom posts a shift for tomorrow morning but forgets to switch on 'Urgent'. Sara filters the board for urgent shifts. Should Tom's shift show as urgent?","context":"Last-minute shifts need the most attention, and owners in a rush often forget the switch.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Urgent only when Tom switches it on."},{"key":"A","label":"Urgent if Tom says so, or starting within 24h","detail":"Tom's shift for tomorrow morning shows as urgent automatically."},{"key":"C","label":"Urgent if Tom says so, or within 48h","detail":"A wider net; more shifts carry the urgent tag."}],"rec":"A","recWhy":"Today a shift starting tomorrow is not urgent unless Tom remembers. Qwick treats shifts posted within 24 hours as urgent; Mable's Last Minute covers 4 to 48 hours.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5564417"},{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"Today it does not. Urgent is only Tom's switch in the posting form, on web and mobile; nothing turns it on as the start time nears. Sara filters by urgent, so she misses Tom's shift."},{"id":"PO-Q14","q":"Tom's Sunday shift starts in six hours and nobody has applied. Tom wants to add an extra $20 an hour as an urgent bonus. Should there be a separate boost that Sara sees?","context":"A visible bonus can attract workers quickly, but a new field adds work before launch.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"No boost; Tom raises the rate or adds the award extra."},{"key":"B","label":"Tom adds a boost Sara sees hourly and in total","detail":"A separate, visible extra on top of the rate."}],"rec":"KEEP","recWhy":"Raising the rate, or the existing award 'Extra on top', already does the job at launch with no new field. Qwick-style boosts can wait until there is urgent-fill data.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5564417"}],"current":"Today there is no boost. Tom can raise the pharmacist rate. On award-rate shifts, such as one for Mia, Tom can add an 'Extra on top' per hour, shown as a bonus in the terms."}]},{"id":"PO-S6","name":"Billing","why":"Billing is live with no trial today.","questions":[{"id":"PO-Q15","q":"Tom has just joined ChemistTasker. Sara accepts Tom's first shift. Before Sara is confirmed, Tom must pay a booking fee. When should booking fees start for a new pharmacy like Tom's?","context":"Paying before seeing any value is a barrier for new pharmacies trying the platform.","gap":"SH-04","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom pays a fee for every outside booking from day one."},{"key":"B","label":"Free for everyone until a set date","detail":"Tom and every other pharmacy book free until then."},{"key":"C","label":"Tom gets a free trial of N days","detail":"Each new pharmacy gets its own trial; a saved card still confirms bookings."}],"rec":"C","recWhy":"Today the first booking already costs money, a barrier for new pharmacies. Locumate makes registration and posting free and charges only per completed shift.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"}],"current":"Today Tom pays from the very first booking. Billing went live on 2025-06-01 (a code comment wrongly says 2026) with no free trial, so every outside booking needs a paid checkout."},{"id":"PO-Q16","q":"Tom books Sara for a 10-day block, one worker for every date. Next week Tom books Ben for a single Saturday. Should the booking fee depend on how many days are booked?","context":"A flat fee makes long blocks cheap and single days expensive, which feels unfair and loses revenue.","gap":"SH-03","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"One flat fee per offer, whatever the length."},{"key":"B","label":"Tom pays one fee per booked day","detail":"Sara's 10-day block costs ten fees; Ben's Saturday costs one."},{"key":"C","label":"A percentage of wages","detail":"With a minimum and a maximum fee."}],"rec":"B","recWhy":"Today a 10-day block costs the same as one day, while a shift split into separate dates pays per date. Locumate charges A$50 per completed shift; per day is simple and fair for blocks.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Today both cost Tom the same: $30 per locum offer or $80 for full/part-time, whatever the hours. Sara's 10-day block is one offer and one fee. Subscribers are wrongly charged full price instead of $15/$40."}]}]},{"id":"booking","name":"Apply & book","summary":"How a worker gets from interest to a reserved and paid shift.","steps":[{"id":"BK-S1","name":"Booking modes","why":"Decides whether trusted workers can skip the queue.","questions":[{"id":"BK-Q01","q":"Tom posts an urgent Saturday shift. Ben, Tom's favourite locum, sees it and wants it now. Sara, a verified outside locum, also sees it. What ways should Ben and Sara have to get the shift?","context":"Waiting for an offer slows urgent shifts, but owners still want control over who walks into their pharmacy.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Ben and Sara apply and wait for an offer; only employees claim instantly."},{"key":"B","label":"Today's way, plus instant book if Tom allows","detail":"Tom switches instant book on per shift; eligible workers take it straight away."}],"rec":"B","recWhy":"Today trusted favourites like Ben must wait for an offer, even for urgent shifts. Locumate offers first-come instant booking beside applications, and ShiftKey auto-accepts eligible bids; opt-in keeps Tom in control.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"},{"name":"ShiftKey","url":"https://marketing.production.shiftkey.com/resources/blog/admin-assist-the-convenience-you-want-with-the-control-you-need"}],"current":"Today Ben and Sara both apply, then wait for Tom to send an offer and confirm it. Counter-offers exist. Only Tom's own employees, like Omar, can claim the shift instantly."},{"id":"BK-Q02","q":"Tom switches on instant book for a Saturday shift. Ben is Tom's favourite locum. Sara has done 8 shifts on ChemistTasker with no problems but has never worked for Tom. Who should be able to book it instantly?","context":"Instant booking puts someone in Tom's pharmacy without Tom choosing them, so it should only go to people Tom trusts.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Only Tom's employees, like Omar, claim instantly."},{"key":"A","label":"Ben and other favourites only","detail":"People Tom already trusts book instantly; Sara still applies."},{"key":"B","label":"Ben, plus workers like Sara who meet rules","detail":"For example 5 or more completed shifts and no incidents."}],"rec":"A","recWhy":"Today favourites, the people pharmacies trust most, cannot book instantly. ShiftKey and Nursa auto-approve favourites; score-based rules need reliability data the platform does not have yet.","sources":[{"name":"ShiftKey","url":"https://marketing.production.shiftkey.com/resources/blog/admin-assist-the-convenience-you-want-with-the-control-you-need"},{"name":"Nursa","url":"https://nursa.com/facility/solutions/healthcare-recruitment-software"}],"current":"Today only Tom's own employees, like Omar, can claim instantly, and only in roles their job covers. Ben must apply and accept an offer like anyone else. There is no reliability score for Sara."}]},{"id":"BK-S2","name":"Applicants","why":"What the pharmacy sees when choosing.","questions":[{"id":"BK-Q03","q":"Tom's Saturday shift has six applicants. Sara applied first; Ben, Tom's favourite locum, applied last. Tom opens the applicant list. In what order should Tom see them?","context":"A clear order helps Tom pick quickly, and explaining it stops workers feeling the list is unfair.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Unsorted list with no explanation."},{"key":"A","label":"Favourites first, then reliability, then apply time","detail":"Ben shows at the top, and the screen explains the order."},{"key":"B","label":"First to apply shows first","detail":"Sara shows at the top; Ben shows last."},{"key":"C","label":"Tom sorts the list","detail":"No default order."}],"rec":"A","recWhy":"Today favourites can sit below strangers. Mable explains its ranking (location, response speed, feedback), and favourites first matches Locumate's preferred locums.","sources":[{"name":"Mable","url":"https://mable.com.au/help_centre/how-support-workers-are-ranked-in-mable-search-results/"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"Today Tom sees them unsorted, roughly in the order they applied, on web and mobile, with no explanation. Ben can sit below strangers."},{"id":"BK-Q04","q":"Sara has applied for Tom's Saturday shift. Tom has never worked with Sara. What should Tom see about Sara before booking her?","context":"Tom needs enough to trust a stranger, but sharing contact details early lets people book around the platform.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Profile and badges; name on reveal; contact after booking."},{"key":"A","label":"Tom sees role, AHPRA, reviews, reliability and rate","detail":"Sara's contact details still wait until she is booked."},{"key":"B","label":"Tom also sees Sara's phone and email","detail":"Easier for Tom and Sara to deal off the platform."}],"rec":"A","recWhy":"Contact details are already held back correctly, but reviews and reliability are missing. ShiftPosts shows profiles and ratings before booking, and ShiftKey lets facilities review credentials.","sources":[{"name":"ShiftPosts","url":"https://shiftposts.com/"},{"name":"ShiftKey","url":"https://www.shiftkey.com/facilities/facility-quick-start-guide"}],"current":"Today Tom sees Sara's photo, bio, role, skills, Verified and AHPRA badges, suburb, travel and rate preference. Revealing shows her name; contact details and CV come after booking. Tom sees no reviews or reliability."}]},{"id":"BK-S3","name":"Offers and expiry (D06)","why":"What happens when an offer is not answered.","questions":[{"id":"BK-Q05","q":"Tom sends Sara an offer at 8 am for a shift starting at 2 pm today. Sara does not answer. How long should Tom's offer stay open?","context":"An offer still pending after the shift starts leaves Tom unsure whether anyone is coming.","gap":"SH-07","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Flat 48-hour offer that can outlive the shift."},{"key":"A","label":"48 hours, but never past the start","detail":"Sara's offer closes at 2 pm at the latest."},{"key":"B","label":"Shorter the closer the shift is","detail":"24h, 6h, 2h or 30 minutes, matching payment deadlines, never past the start."}],"rec":"B","recWhy":"Today an urgent offer can stay pending after the shift starts. One timing model for offers and payments is easier to explain, and Qwick shows offers do not hold a place for long.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"}],"current":"Today Sara's offer stays open for 48 hours, long after the 2 pm shift has started. It is only marked expired when someone opens the offer list or tries to accept."},{"id":"BK-Q06","q":"Tom offers a Saturday shift to Sara, and Sara declines. On another shift, Tom's offer to Ben just runs out with no answer. What should happen to each shift, and who should be told?","context":"If Tom is not told an offer died, Tom waits on nobody while Saturday gets closer.","gap":"","type":"decision","options
