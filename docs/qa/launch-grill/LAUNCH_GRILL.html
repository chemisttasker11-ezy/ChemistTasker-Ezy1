":[{"key":"KEEP","label":"Keep it like today","detail":"Shift stays open; Tom is told only when Sara declines."},{"key":"A","label":"Shift reopens to the same workers; Tom is told","detail":"Tom hears about both Sara's decline and Ben's expired offer."},{"key":"B","label":"Back to Tom to pick someone","detail":"The shift waits until Tom acts."},{"key":"C","label":"Next applicant gets the offer automatically","detail":"Fast, but may pick someone Tom did not want."}],"rec":"A","recWhy":"Today expiry is silent, so Tom may wait on a dead offer. Reopening to the same workers and telling Tom in both cases matches the rule for unpaid holds; ShiftKey reopens shifts immediately too.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Today when Sara declines, Tom is told and the shift stays open to the same workers. When Ben's offer expires, the status changes silently: nobody is told, and nothing offers the next applicant."},{"id":"BK-Q07","q":"Tom's Saturday shift is urgent, so Tom sends offers to Sara, Ben and another locum at once. All three accept. Tom can only pay for one. What should happen?","context":"Workers who accept and are then quietly dropped may have turned down other work for Tom's shift.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"All three accept; Tom pays for one; the others expire untold."},{"key":"A","label":"Tom offers to one worker at a time","detail":"Slow for urgent shifts."},{"key":"B","label":"Several offers; Sara's first acceptance holds it","detail":"Ben's later acceptance is refused; the other offers expire and the workers are told."}],"rec":"B","recWhy":"Today several workers can accept and wait while Tom pays for one, and the rest are never told. Qwick and Hireup let the first acceptance hold the shift.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/13502083241103-Booking-Requests-For-Clients"}],"current":"Today all three can accept and wait for payment. Tom's checkout takes one; the other two offers expire and nobody tells them. 'First acceptance holds it' is not on PR #198 (built in draft PR #182)."}]},{"id":"BK-S4","name":"Counter-offers","why":"Negotiation must end in a clear booking.","questions":[{"id":"BK-Q08","q":"Sara wants Tom's Saturday shift but asks for $5 more an hour, a 9 am start instead of 8 am, and travel costs. What should Sara be able to counter?","context":"Small changes often decide whether a locum takes the shift, but too many open terms cause disputes later.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara counters rate and times per date, plus a travel request."},{"key":"A","label":"Sara can counter the rate only","detail":"Simplest."},{"key":"B","label":"Sara can counter rate and times","detail":"Covers most real requests."}],"rec":"KEEP","recWhy":"Today already covers rate and times, like Relief Buddy. Travel is only a yes/no request, not a negotiated amount, so it adds no dispute risk.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/request-change-request-and-apply-adjusting-shift-rate-or-times"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4799126-how-to-negotiate-a-shift-rate-in-the-app"}],"current":"Today Sara can counter the rate if Tom marked it negotiable, and start and end times if Tom marked it flexible, per date. She can also tick 'request travel', on web and mobile."},{"id":"BK-Q09","q":"Sara counters Tom's Saturday shift at $80 an hour. Tom accepts the counter-offer. Is Sara now booked, or does Sara confirm first?","context":"Sara's confirmation is the moment she agrees the written terms, which protects both sides if there is a dispute.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara confirms the countered offer and accepts the terms once."},{"key":"A","label":"Sara is booked straight away","detail":"Sara already proposed $80, so the shift goes straight to payment."}],"rec":"KEEP","recWhy":"The confirm step is where Sara accepts the fixed terms, and contractor status for ABN workers, which the legal notes rely on. Skipping it would book Sara without recorded consent.","sources":[{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4799126-how-to-negotiate-a-shift-rate-in-the-app"}],"current":"Today Sara is not booked yet. Tom's acceptance creates a new offer at $80, and Sara must confirm it and accept the shift terms before it is held for payment."}]},{"id":"BK-S5","name":"Conflicts and requirements","why":"No double booking, no unqualified bookings.","questions":[{"id":"BK-Q10","q":"Sara applied for Saturday shifts at Tom's and at two other pharmacies. Tom books her first. What should happen to her other Saturday applications?","context":"Pharmacies waste time choosing workers who are already booked, and may even double-book them.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara's overlapping applications stay open."},{"key":"A","label":"Overlapping ones are withdrawn; others stay","detail":"Automatic, with a notice."},{"key":"B","label":"They stay open; Sara is blocked at accept","detail":"Other pharmacies may still pick Sara, who cannot come."}],"rec":"A","recWhy":"Today pharmacies can pick a worker already booked elsewhere. ShiftKey cancels conflicting bids, and Relief Buddy withdraws overlaps while keeping the rest.","sources":[{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/essential-tips-for-professionals-using-shiftkey"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/can-i-apply-to-multiple-shifts-at-the-same-time"}],"current":"Today nothing changes. Testers applied for two overlapping Monday shifts with no clash warning. After Tom books Sara, her other Saturday applications and offers stay open, so another pharmacy may pick her even though she is booked at Tom's."},{"id":"BK-Q11","q":"Sara is booked and paid for a Saturday shift at another pharmacy. Tom now offers Sara a shift at the same time on Saturday, and she taps Accept. Should she be able to?","context":"A double-booked worker means one pharmacy is left without a pharmacist on the day.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Overlaps allowed at accept and at payment."},{"key":"A","label":"Sara is blocked at accept","detail":"And checked again before Tom's payment confirms."},{"key":"B","label":"Allowed until Tom pays","detail":"Risk Sara ends up with two paid bookings."}],"rec":"A","recWhy":"Today a worker can hold two paid bookings at once. ShiftKey and Relief Buddy block conflicts; checking at accept and again at payment closes the gap.","sources":[{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/essential-tips-for-professionals-using-shiftkey"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/can-i-apply-to-multiple-shifts-at-the-same-time"}],"current":"Today yes. Accepting never checks Sara's other bookings, held shifts or roster shifts, so Sara can hold two overlapping shifts, and both can end up paid."},{"id":"BK-Q12","q":"Tom's Saturday shift lists 'Fred dispensing software' and 'vaccination certificate' as must-haves. Sara has neither. She taps Apply. What should happen?","context":"Tom wastes time reading unsuitable applicants, and Sara wastes time applying for shifts she cannot do.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Must-haves are advice only; Tom filters by hand."},{"key":"A","label":"Missing must-haves block Sara; nice-to-haves rank","detail":"Sara sees why she cannot apply; workers with nice-to-haves show higher for Tom."}],"rec":"A","recWhy":"Today workers missing a must-have can still apply, so Tom filters by hand. Relief Buddy filters out workers without required skills, and CareRev requires credentials before claiming.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-post-a-shift"},{"name":"CareRev","url":"https://www.carerev.com/professionals/faq"}],"current":"Today Sara can apply and accept as normal. Must-have and nice-to-have lists show on the post but are never checked, on web or mobile, so Tom filters by hand."}]},{"id":"BK-S6","name":"Reservation screen","why":"Workers must know when a booking becomes binding.","questions":[{"id":"BK-Q13","q":"Sara accepts Tom's urgent shift. It is held for her while Tom pays the booking fee. Sara and Tom both look at the shift. Should they see a live countdown to when payment is due?","context":"Once payment deadlines exist, a visible countdown stops Tom missing the deadline and tells Sara whether to keep waiting.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Both see an awaiting-payment status, with no deadline."},{"key":"A","label":"Sara and Tom both see a live countdown","detail":"Time left to pay shows to both sides."},{"key":"B","label":"Show it as booked","detail":"Misleading for Sara if Tom's payment fails."}],"rec":"A","recWhy":"Today the wording is accurate but shows no deadline, because none exists yet. Once payment deadlines are built, a countdown makes urgency easy to see; this is our usability call, not checked competitor practice.","sources":[],"current":"Today Sara sees 'Waiting for owner payment' and Tom sees 'Awaiting payment'. It turns 'Confirmed' only after Tom pays. There is no pay-by time: deadlines are not on PR #198 (built in draft PR #182)."},{"id":"BK-Q14","q":"Sara accepts Tom's Saturday shift, but Tom has not paid yet. An hour later Sara's car breaks down and she can no longer come. Can Sara drop the shift before Tom pays, without a mark on her record?","context":"Sara stuck on a shift she cannot work leaves Tom expecting someone who will not come.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara cannot drop it; it waits until Tom pays."},{"key":"A","label":"Sara can drop it, no mark","detail":"Nothing is confirmed until Tom pays, so it is not a cancellation."},{"key":"B","label":"Free for 15 minutes, then it counts","detail":"Only covers an accidental tap."},{"key":"C","label":"Counts as a cancellation","detail":"Treats Sara's unpaid hold like a confirmed booking."}],"rec":"A","recWhy":"Today a worker who can no longer come stays held with no end date. Nothing is confirmed until Tom pays, so releasing it is not a cancellation; Qwick lets accidental acceptances go.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"}],"current":"Today Sara cannot drop it. There is no withdraw button; the shift waits for payment with no deadline until Tom pays for Sara or someone else. Expiry of unpaid holds is not on PR #198 (built in draft PR #182)."},{"id":"BK-R01","q":"Sara accepts Tom's shift. Tom tries to pay the booking fee, but the card is declined. What should happen to Sara's hold on the shift?","context":"Sara should not lose the shift over one declined card, but she cannot wait forever either.","gap":"SH-13","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom retries any time; Sara's hold never expires."},{"key":"A","label":"Sara is released straight away","detail":"One failed payment and Tom loses Sara."},{"key":"B","label":"Sara's hold gets extra time once","detail":"The failure buys Tom more time to pay."},{"key":"C","label":"Tom retries until the original deadline","detail":"Same hold and same pay-by time; the failure changes nothing else."}],"rec":"C","recWhy":"Keep deadlines predictable: a failed payment neither confirms nor extends the booking, but Tom may retry before the existing deadline. Today the hold never expires.","sources":[],"current":"Today a failed or cancelled checkout does not confirm Sara. The hold keeps waiting, and Tom can retry any time, with no end. Payment deadlines are not on PR #198 (built in draft PR #182)."}]}]},{"id":"agreement","name":"Agreements & changes","summary":"What both sides sign, and what happens when terms change.","steps":[{"id":"AG-S1","name":"What gets accepted","why":"Fees and rules only hold if they were shown before acceptance.","questions":[{"id":"AG-Q01","q":"Sara, a verified locum, is about to tap Accept on Tom's Saturday shift. This is the agreement she is signing up to. What must Sara see before accepting?","context":"Late-cancellation fees can only be charged if Sara saw them before agreeing, and missing details cause disputes later.","gap":"SH-09","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara sees pay, times and legal notices only."},{"key":"A","label":"Sara sees pay, times, breaks, duties, site, cancellation","detail":"Plus which version of ChemistTasker's terms Sara is agreeing to."}],"rec":"A","recWhy":"Today the cancellation table is never shown, so cancellation fees cannot be charged. Relief Buddy previews conduct and cancellation terms; Locate a Locum requires terms acceptance first.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"},{"name":"Locate a Locum","url":"https://locatealocum.com/content/terms/"}],"current":"Today Sara sees pay type, award basis, dates, times, the final rate and legal notices, on web and mobile. She sees no breaks, duties, site details, cancellation fees or terms version."},{"id":"AG-Q02","q":"Sara accepts Tom's Saturday shift and agrees the terms, including what Tom pays if Tom cancels late. Should Tom also have to accept the same agreement?","context":"Tom cannot fairly be charged a cancellation fee Tom never agreed to.","gap":"SH-09","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Only Sara accepts; Tom never agrees the terms."},{"key":"A","label":"Tom accepts when sending or approving the offer","detail":"Recorded with the time and terms version."}],"rec":"A","recWhy":"Today Tom never agrees the cancellation fees that bind Tom. Relief Buddy sends the agreement to both parties.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"}],"current":"Today only Sara agrees: her acceptance and time are stored with the fixed terms. Tom never records accepting anything, including the fees that bind Tom."},{"id":"AG-Q03","q":"Sara's booking at Tom's is confirmed. A month later they disagree about the agreed rate. Should Sara and Tom each get a PDF copy of the agreement?","context":"A copy each side keeps settles disputes about what was agreed, without either side relying on the app.","gap":"","type":"decision","options":[{"key":"A","label":"Sara and Tom are emailed a PDF","detail":"Sent once the booking is confirmed; also downloadable in the app."},{"key":"B","label":"Sara and Tom view it in the app only","detail":"Less to build; no copy outside the app."}],"rec":"A","recWhy":"Relief Buddy emails both parties a PDF after acceptance, and LocumCo sends formal confirmation with contract terms.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"},{"name":"LocumCo","url":"https://locumco.com.au/candidates/locums/"}],"current":"Today there is no PDF or emailed copy. After booking, testers found Sara's Confirmed board shows only the locked $75 rate and a pharmacy address card; neither Sara nor Tom can reopen the full terms or cancellation rules."}]},{"id":"AG-S2","name":"Contractor or employee","why":"The engagement type drives tax, super and pay.","questions":[{"id":"AG-Q04","q":"Tom posts a locum shift and marks it 'Contractor (ABN)'. Sara, who has an ABN, has worked at Tom's every Saturday for a year, wears Tom's uniform and follows Tom's roster. Is Sara really a contractor? How should ChemistTasker decide employee or contractor?","context":"Calling an employee a contractor is sham contracting, which carries heavy penalties for Tom.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom chooses ABN or TFN; Sara's profile must match."},{"key":"A","label":"Sara and Tom both confirm the status","detail":"Still risks both picking the wrong legal status."},{"key":"B","label":"Check the real working relationship first","detail":"Questions about how Sara actually works decide it; an ABN never decides alone."}],"rec":"B","recWhy":"Fair Work looks at the whole working relationship for many businesses. An ABN or contract label does not decide status, and sham contracting creates serious risk.","sources":[{"name":"Fair Work independent contractors","url":"https://www.fairwork.gov.au/find-help-for/independent-contractors/independent-contractors"}],"current":"Today Tom picks 'Paid as' Contractor (ABN) or Employee (TFN) for each locum shift, on web and mobile. The terms follow Tom's choice, and Sara cannot accept if her profile type does not match."}]},{"id":"AG-S3","name":"Changes after booking (D09)","why":"Stops silent changes to agreed terms.","questions":[{"id":"AG-Q05","q":"Sara is booked for Tom's Saturday shift at $75 an hour. Tom then edits the shift: the rate to $65, the start to 7 am, and a note about parking. Which of these changes should need Sara's agreement?","context":"If Tom can change pay or times without asking, Sara may turn up on terms she never agreed to.","gap":"SH-08","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom edits freely; Sara gets a notice, no agreement needed."},{"key":"A","label":"Rate, date, times, role, site, travel need Sara's yes","detail":"Notes and parking changes just send Sara a notice."},{"key":"B","label":"Only rate and date need Sara's yes","detail":"Other changes just send Sara a notice."}],"rec":"A","recWhy":"Today the shift card and the agreed terms can disagree. Locumate requires the locum's agreement before changing accepted details, and Mable sends updated agreements.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"},{"name":"Mable","url":"https://mable.com.au/help_centre/agreements-how-it-works/"}],"current":"Today the edit form can change rate, role, payment type, description, travel and dates of a booked shift; changing dates deletes Sara's booking and her terms keep old values. Testers found no edit on Tom's Confirmed board: only Hide dates, View profile and Message."},{"id":"AG-Q06","q":"Tom lowers the rate on Sara's booked Saturday shift from $75 to $65 and asks Sara to agree. Sara has not answered yet. Which rate applies in the meantime?","context":"A shift card and an agreement that disagree lead straight to pay disputes.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Card shows $65; agreed terms still say $75."},{"key":"A","label":"Sara's $75 stands until Sara agrees","detail":"The new rate applies only after Sara says yes."},{"key":"B","label":"The new $65 applies straight away","detail":"Sara can decline afterwards."}],"rec":"A","recWhy":"Today nobody can tell which terms apply. Locumate and Mable both wait for the other party's agreement before a change counts.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"},{"name":"Mable","url":"https://mable.com.au/help_centre/agreements-how-it-works/"}],"current":"Today Tom cannot ask Sara; the edit applies at once. Sara's card shows $65 while her agreed terms still say $75, so nobody can tell which applies."},{"id":"AG-Q07","q":"Tom asks Sara to start Saturday at 7 am instead of 9 am. Sara cannot make 7 am and says no. What should happen to Sara's booking?","context":"The change came from Tom, so Sara should not be punished for saying no.","gap":"","type":"decision","options":[{"key":"A","label":"Old times stand, or Tom cancels and pays","detail":"If Tom cancels, it counts as a pharmacy cancellation and Tom's cancellation fees apply."},{"key":"B","label":"Both agree to cancel, no fee","detail":"No mark on Sara's record and no fee for Tom."}],"rec":"A","recWhy":"Locumate helps cancel when a locum cannot meet changed requirements. The change came from Tom, so Sara gets no mark on her record.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"}],"current":"Today there is no way for Tom to ask and no way for Sara to say no; Tom's edit simply applies."},{"id":"AG-Q08","q":"Asking Sara to agree a change is not built yet. Meanwhile Sara has accepted Tom's Saturday shift, and Tom wants to change its date and rate. Should those key details lock once someone accepts?","context":"Without a lock, Tom's edits silently change or delete Sara's booking, and her agreed terms stop matching the shift.","gap":"SH-08","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Key details stay editable after acceptance; Sara gets a notice only."},{"key":"A","label":"Dates, rate, role, payment, travel lock","detail":"To change them, Tom cancels and posts a new shift."},{"key":"B","label":"Changes allowed, with Sara's agreement","detail":"Needs the agreement step from the earlier question built first."}],"rec":"A","recWhy":"Today cards and agreed terms disagree after an edit, and changing dates silently deletes bookings. Locking is the smallest safe step until re-consent exists; Locumate routes accepted-shift changes through the locum's agreement.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"}],"current":"Today Tom can still change rate, role, payment type, description, travel and dates, with only an update notice to Sara. Only roster shifts lock. Locking once anyone engages is not on PR #198 (built in draft PR #182)."}]},{"id":"AG-S4","name":"Notices and reminders (D07, D12)","why":"The right people hear about changes, nobody gets stale reminders.","questions":[{"id":"AG-Q09","q":"Sara is booked for Tom's Saturday shift. Five other locums applied earlier and were not picked. Tom then cancels the shift, or replaces Sara with Ben. Who should be told?","context":"The right people must hear in time to act, without telling strangers about Tom's staffing.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Each feature keeps choosing who to tell."},{"key":"A","label":"Sara, Ben, Tom and the shift's managers","detail":"Only the people who must act are told."},{"key":"B","label":"Also Lina, the organisation admin","detail":"Wider oversight across the group."},{"key":"C","label":"Also anyone following the shift","detail":"Risks leaking names."}],"rec":"A","recWhy":"Today edits reach every past applicant, which leaks activity and adds noise. Telling only the people who must act keeps names private; ShiftKey sends recovery notices only to the groups the facility chooses.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Today each feature picks its own list. An edit tells everyone who ever applied, countered or got an offer. AHPRA cancellations tell the pharmacy. Tom can delete a booked shift and nobody, not even Sara, is told; the delete guard is not on PR #198 (built in draft PR #182)."},{"id":"AG-Q10","q":"Tom cancels Sara's Saturday shift. Earlier, Sara got an offer and a booking confirmation from Tom. How should each message reach Sara: in the app, as a phone push, or by email?","context":"Missing a cancellation or payment message costs money, while too many emails get ignored.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Each feature keeps choosing its own channels."},{"key":"A","label":"App and push; email for money and cancels","detail":"Sara gets an email only when it matters."},{"key":"B","label":"Email Sara about everything","detail":"A noisy inbox."},{"key":"C","label":"In-app only","detail":"Easy for Sara to miss."}],"rec":"A","recWhy":"Today there is no rule, so some money and cancel messages may lack an email, and reminders lack push. Instawork lets workers set schedule notifications; email for money and cancels, push for the rest.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/12995914-how-do-i-search-for-shifts"}],"current":"Today each feature picks its own channels. Offers and confirmations send Sara an in-app notice plus email. Pre-shift reminders are email only. In-app, push and email all exist."},{"id":"AG-Q11","q":"Sara is confirmed for Tom's Saturday 8 am shift. Ben accepted Tom's Sunday shift, but Tom has not paid yet. Which of them should get reminders before the shift, and when?","context":"A forgotten shift leaves Tom short-staffed, and one email the night before is easy to miss.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"One email about 12 hours before each booked shift."},{"key":"A","label":"Confirmed only, 24 hours and 2 hours before","detail":"Sara gets two reminders per date; Ben gets none until confirmed."},{"key":"B","label":"Confirmed only, 24 hours before","detail":"Fewer messages for Sara."},{"key":"C","label":"Ben's unpaid hold is reminded too","detail":"Reminds workers about shifts that may not go ahead."}],"rec":"A","recWhy":"Today one email 12 hours out is easy to miss and has no closer nudge. Two reminders, at 24 hours and 2 hours, cut no-shows without noise; Locum Organiser confirms each session.","sources":[{"name":"Locum Organiser","url":"https://locumorganiser.com/help/booking-confirmations/"}],"current":"Today an hourly job emails Sara once, about 12 hours before, around 8 pm Friday. Ben gets nothing, because unpaid holds get no reminders. There is no push and no second reminder."},{"id":"AG-Q12","q":"Omar is rostered for Saturday 8 am at Tom's Pharmacy. At 9 pm Friday, after Omar's reminder email has gone, Tom moves the start to 7 am. What should happen to Omar's reminders and alerts?","context":"A late change Omar never sees means Omar arrives an hour late and the pharmacy opens without a pharmacist.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"No alert for late changes; reminders use the time when sent."},{"key":"A","label":"Omar is alerted at once; old reminders cancelled","detail":"A new reminder goes out with the new start time."}],"rec":"A","recWhy":"A change made after the 12-hour email gets no alert, so the worker keeps the old time. Locumate treats changes to accepted shifts as needing the locum's attention.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"}],"current":"Today Omar gets no alert and keeps the old time. A reminder reads the current time only when it is sent. If Tom re-times Sara's booked marketplace shift instead, her booking is deleted."}]}]},{"id":"cancel","name":"Cancellations & no-shows","summary":"Every way a booked shift can fall over, and what follows.","steps":[{"id":"CX-S1","name":"Pharmacy cancels","why":"Sets the launch scope and how the owner fee table is used.","questions":[{"id":"CX-Q01","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom has booked her. He wants to cancel, but cancellation fees cannot yet be enforced. What cancellation actions should launch?","context":"Both sides need a clear way to cancel ordinary bookings while fee charging is unfinished.","gap":"SH-01","type":"decision","options":[{"key":"A","label":"Only support can cancel Sara's booking","detail":"Support records the reason and cancellation; no fee is charged."},{"key":"B","label":"Tom cancels; Sara asks for approval","detail":"Both receive notices; any fee is shown as an estimate and is not charged."},{"key":"C","label":"Tom and Sara wait for enforceable fees","detail":"Launch waits until cancellation charges can be enforced."}],"rec":"B","recWhy":"Let Tom cancel and Sara request approval, with recorded reasons and notices. Hireup and Relief Buddy inform cancellation handling; reuse AHPRA notices where suitable, but build general fees and refunds separately and show estimates without charging.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360031493231-Statement-on-Cancellations"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Today neither Tom nor Sara can cancel. Testers found Tom's Confirmed board offers only Hide dates, View profile and Message, and Sara's 'Reject Entire Shift' is greyed out once confirmed. AHPRA restrictions can still remove future public assignments. Staff cover requests are separate."},{"id":"CX-Q02","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom cancels her confirmed booking and owes a percentage of her agreed wages. Who should receive that money?","context":"Cancellation pay and the platform booking fee need separate purposes and recipients.","gap":"","type":"decision","options":[{"key":"A","label":"Sara receives cancellation pay","detail":"The payment compensates Sara for the lost shift."},{"key":"B","label":"The platform receives all the money","detail":"Sara receives nothing for the lost shift."},{"key":"C","label":"Sara and the platform share the money","detail":"The payment is split between them, adding an extra rule to explain."}],"rec":"A","recWhy":"Locumate and Hireup compensate workers for lost work. Give the proposed cancellation payment to Sara and keep the platform booking fee separate; the payment process still needs building.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360031493231-Statement-on-Cancellations"}],"current":"Today there is no cancellation-pay recipient or payment process for Sara's lost shift."},{"id":"CX-Q03","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom accepts her for Saturday but has not paid the booking fee. He now cancels. Should he owe a cancellation fee?","context":"An unpaid acceptance is not a confirmed booking under the chosen payment policy.","gap":"","type":"decision","options":[{"key":"A","label":"Tom owes nothing; Sara is notified","detail":"Sara is told the unpaid acceptance has ended; it was never confirmed."},{"key":"B","label":"Tom pays the normal cancellation percentage","detail":"His unpaid acceptance is treated like a confirmed booking."}],"rec":"A","recWhy":"Charge nothing before payment confirms the booking. Qwick distinguishes offers from confirmed places; cancellation notices and timed unpaid release still need building.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"}],"current":"Today Sara's accepted offer can wait for Tom's payment indefinitely: there is no payment deadline, automatic unpaid release or general pharmacy cancellation action. Draft PR #182 contains the missing reservation work; it is absent from PR #198."},{"id":"CX-Q04","q":"Tom owns Tom's Pharmacy in Parramatta. He cancels verified external locum Sara's booking exactly 72, 24, 12 or 2 hours before it starts. Which cancellation percentage should he see?","context":"Exact boundaries need predictable rates, calculated separately for each date in the pharmacy's local time.","gap":"","type":"decision","options":[{"key":"A","label":"Tom sees the milder percentage","detail":"Exactly 72 hours: 0%; 24 hours: 10%; 12 hours: 15%; 2 hours: 20%."},{"key":"B","label":"Tom sees the stricter percentage","detail":"Exactly 24 hours before the shift, Tom sees 15%."}],"rec":"A","recWhy":"Use the milder percentage at each exact boundary. Relief Buddy informs the approach, but these boundaries are a proposed local rule. Build the preview and keep charging off until terms are accepted and legally reviewed.","sources":[{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Today Tom has no preview of the proposed 72/24/12/2-hour cancellation rates. Only the separate old 10%/20% payment checkout exists. The preview is in draft PR #182, not PR #198."}]},{"id":"CX-S2","name":"Worker cancels","why":"R04 needs an 'enough window' and an emergency path.","questions":[{"id":"CX-Q05","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She needs to cancel a booking at Tom's Pharmacy. How much notice should give Tom the normal approval process rather than urgent alerts?","context":"Tom must approve the request, but short notice needs faster attention.","gap":"","type":"decision","options":[{"key":"A","label":"Sara gets normal review with 72 hours' notice","detail":"Requests closer to the start use urgent handling."},{"key":"B","label":"Sara gets normal review with 24 hours' notice","detail":"Only requests inside 24 hours use urgent handling."},{"key":"C","label":"Sara needs seven days for normal review","detail":"Most shorter-notice requests use urgent handling."}],"rec":"A","recWhy":"Use 72 hours as the proposed dividing line, matching the chosen owner fee boundary. Relief Buddy informs this choice; it is not a universal competitor rule, and the approval timing still needs building.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-do-i-cancel-a-shift"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Today Sara has no cancel, cover or swap request for a booked locum shift; testers saw 'Reject Entire Shift' greyed out once confirmed. Nothing switches between normal approval and urgent handling by notice."},{"id":"CX-Q06","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. An emergency stops her attending Tom's shift, which starts soon. She requests cancellation. Who should be alerted, and how quickly?","context":"A request close to shift start needs a backup when the usual manager does not answer.","gap":"","type":"decision","options":[{"key":"A","label":"Tom and managers get alerts every 15 minutes","detail":"Push reminders continue until someone answers Sara's request."},{"key":"B","label":"Support also follows up after 30 minutes","detail":"Managers and Tom get 15-minute push reminders; support chases the pharmacy after 30 minutes but cannot approve."},{"key":"C","label":"Only the manager gets an alert","detail":"Sara's request has no backup recipient or repeated alerts."}],"rec":"B","recWhy":"Alert managers and Tom repeatedly, then have support chase a response without approving. ShiftKey and Qwick inform urgent handling; the 15-minute reminders and 30-minute support follow-up are proposed timings, not verified competitor standards.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"},{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"}],"current":"Today Sara's urgent cancellation request has no timed sequence of repeated alerts or support follow-up."},{"id":"CX-Q07","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She requests cancellation before Tom's shift, gets no manager reply and does not attend. Should this count as a late cancellation or a no-show?","context":"Sara stays assigned until approval, but her recorded notice should be considered when reviewing her absence.","gap":"","type":"decision","options":[{"key":"A","label":"Sara is reviewed for late cancellation","detail":"Her recorded request is evidence, rather than treating her absence as an unexplained no-show."},{"key":"B","label":"Sara is recorded as a no-show","detail":"Her earlier cancellation request does not change the classification."}],"rec":"A","recWhy":"Keep Sara's notice as evidence for review. Nursa distinguishes advance in-app cancellation from silence; treating an unanswered approval request as a late cancellation is a proposed local rule.","sources":[{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"}],"current":"Today there is no rule classifying Sara's unanswered cancellation request when she does not attend."}]},{"id":"CX-S3","name":"Mutual and emergency","why":"P11 waivers need proof and an approver.","questions":[{"id":"CX-Q08","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She and Tom agree to cancel her booking without a fee or incident. How should they record and approve that agreement?","context":"Both sides need proof of their agreement so a mutual cancellation does not become an incident.","gap":"","type":"decision","options":[{"key":"A","label":"Sara and Tom both tap Agree","detail":"The app records the time and automatically applies the waiver."},{"key":"B","label":"Tom alone records their agreement","detail":"The waiver relies on Tom's account of what Sara agreed."},{"key":"C","label":"Support reviews every agreement","detail":"Sara and Tom wait for support to confirm the waiver."}],"rec":"A","recWhy":"Have both people agree in the app, with a recorded time. Hireup supports mutually agreed rescheduling; its research does not establish an identical two-tap cancellation waiver.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360031493231-Statement-on-Cancellations"}],"current":"Today Sara and Tom cannot both confirm cancellation consent in the app, and no automatic waiver record is created."},{"id":"CX-Q09","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She falls ill before Tom's booked shift and asks for an exemption from cancellation consequences. What evidence should she have to provide?","context":"Illness evidence can expose private health information while support still needs to resolve disputed exemptions.","gap":"","type":"decision","options":[{"key":"A","label":"Sara explains first; evidence only if disputed","detail":"Support asks Sara for only the evidence needed to resolve the disagreement."},{"key":"B","label":"Sara supplies evidence within 48 hours","detail":"Every claim needs a medical certificate or similar evidence."},{"key":"C","label":"Sara never supplies evidence","detail":"Support cannot use evidence to resolve a contested exemption."}],"rec":"A","recWhy":"Collect only necessary evidence, let authorised support review it, and delete or de-identify it when no longer needed. OAIC guidance supports keeping sensitive health information to the minimum required.","sources":[{"name":"OAIC APP 3","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-3-app-3-collection-of-solicited-personal-information"},{"name":"OAIC APP 11","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-11-app-11-security-of-personal-information"}],"current":"Today Sara has no illness or emergency exemption process for submitting evidence, limiting who sees it or managing how long it is kept."},{"id":"CX-Q10","q":"Tom owns Tom's Pharmacy in Parramatta. A power outage closes his pharmacy, so he cancels verified external locum Sara's booking. Can evidence of the emergency waive his cancellation fee?","context":"A genuine closure needs clear exemption rules and an explanation for the worker losing the shift.","gap":"","type":"decision","options":[{"key":"A","label":"Support can waive Tom's fee with evidence","detail":"Sara is told why the emergency qualifies for a waiver."},{"key":"B","label":"Tom always owes the cancellation fee","detail":"The closure or outage never qualifies for a waiver."}],"rec":"A","recWhy":"Pharmacy SOS describes evidence-based exceptions. Let support review Tom's evidence, publish the waiver criteria and tell Sara why compensation is waived.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"},{"name":"Instawork","url":"https://help.instawork.com/en/articles/2062211-what-happens-if-i-need-to-cancel-my-scheduled-professional-s"}],"current":"Today Tom has no process for requesting an owner emergency waiver with supporting evidence."}]},{"id":"CX-S4","name":"No-show and late","why":"Separates late, absent and accidental.","questions":[{"id":"CX-Q11","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She is booked at Tom's Pharmacy but has not arrived or contacted him after the start. When should her absence become a no-show?","context":"Tom needs a clear threshold for an unexplained absence, separate from attendance and timesheet records.","gap":"","type":"decision","options":[{"key":"A","label":"Sara becomes a no-show after 30 minutes","detail":"Sara has not contacted Tom; he can repost before the 30-minute mark."},{"key":"B","label":"Sara becomes a no-show after 60 minutes","detail":"With no contact, this follows Instawork's automatic threshold."},{"key":"C","label":"Tom reports Sara any time after the start","detail":"There is no fixed waiting period."}],"rec":"A","recWhy":"Use 30 minutes as a proposed pharmacy rule. Instawork uses a 60-minute automatic threshold and allows earlier business intervention without contact; the proposed timing is not an exact match.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/6122001-cancellation-policy"},{"name":"Instawork","url":"https://help.instawork.com/en/articles/3614637-what-happens-if-i-m-late-to-my-shift"}],"current":"Today there is no booking no-show status or timer. Testers found no button on Tom's Confirmed board or History tab to report Sara absent or late."},{"id":"CX-Q12","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She is running late for Tom's booked shift and wants to send her arrival time. How should lateness affect her record?","context":"Arriving late and failing to attend should have clearly different consequences.","gap":"","type":"decision","options":[{"key":"A","label":"Sara's lateness is logged without an incident","detail":"At 15 or more minutes late it affects reliability; she can send a running-late message with her arrival estimate."},{"key":"B","label":"Sara's lateness counts as an incident","detail":"It uses the same sequence of consequences as a no-show."}],"rec":"A","recWhy":"Separate lateness from no-shows, as Instawork does. Record arrivals 15 or more minutes late and an estimated arrival time without automatically counting an incident; 15 minutes is a proposed local threshold.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/3614637-what-happens-if-i-m-late-to-my-shift"},{"name":"Instawork","url":"https://help.instawork.com/en/articles/5048510-how-reliability-affects-your-shift-access"}],"current":"Today Sara's attendance can have timestamps, but there is no booking lateness category, running-late arrival message or reliability treatment for it."},{"id":"CX-Q13","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom reports that she missed her booked shift. Who should hear her explanation and decide whether it was a no-show?","context":"Managers report absences, while the platform must decide consequences after a fair review.","gap":"","type":"decision","options":[{"key":"A","label":"Sara has 48 hours to reply before platform review","detail":"Support considers Tom's report and Sara's response before deciding."},{"key":"B","label":"The platform decides from Tom's report alone","detail":"Sara has no reply stage before the decision."}],"rec":"A","recWhy":"Hear both sides before counting an incident. Qwick and Locate a Locum support individual review; Sara's proposed 48-hour reply window is a local launch choice.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/3815156-locate-a-locum-cancellation-policy-locums"}],"current":"Today Tom's report cannot enter a platform no-show review process, and Sara has no reply stage in that process."},{"id":"CX-Q14","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She cancels several dates in one booking at Tom's Pharmacy in a single action. How many incidents should that count as?","context":"One cancellation of a long booking could otherwise trigger several consequences at once.","gap":"","type":"decision","options":[{"key":"A","label":"Sara receives one incident for the cancellation","detail":"All dates cancelled together count once."},{"key":"B","label":"Sara receives one incident for every date","detail":"Cancelling ten dates could count as ten incidents."}],"rec":"A","recWhy":"Count one cancellation action once so a series does not exhaust all consequences immediately. Nursa and Qwick inform incident handling, but this multi-date counting rule is a proposed fairness choice.","sources":[{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"},{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"}],"current":"Today there is no cancellation incident record or rule for counting Sara's cancelled dates."}]},{"id":"CX-S5","name":"Replacement and recovery","why":"Pharmacies need cover fast; P12 links replacement to consequences.","questions":[{"id":"CX-Q15","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Her confirmed booking at Tom's Pharmacy is cancelled and he still needs cover. Who should see the reopened shift, and who gets notified first?","context":"Tom needs replacement cover quickly without creating duplicate shifts or ignoring his notification choices.","gap":"","type":"decision","options":[{"key":"A","label":"Tom's favourite locums are notified first","detail":"Reuse the shift, then notify its current audience according to Tom's notification settings."},{"key":"B","label":"Only the same audience sees the reopened shift","detail":"No extra notice is sent, matching the chosen unpaid-expiry approach."},{"key":"C","label":"Tom chooses the audience each time","detail":"Reopening waits for Tom's decision, even near the start."}],"rec":"A","recWhy":"Reopen the same shift and notify favourites first according to Tom's settings. ShiftKey supports replacement outreach; existing AHPRA removal alone does not provide this process.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Today Tom has no general reopening process for confirmed cancellations or automatic unpaid-expiry reopening. AHPRA restrictions can remove future public assignments without replacement outreach. Draft PR #182 has unpaid-expiry reopening; PR #198 does not."},{"id":"CX-Q16","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She misses Tom's booked shift without contact. Once the chosen no-show threshold passes, can Tom reopen her place immediately while the platform reviews the incident?","context":"Finding replacement cover should not have to wait for the incident investigation.","gap":"","type":"decision","options":[{"key":"A","label":"Tom can reopen once the no-show threshold passes","detail":"The platform continues reviewing Sara's incident separately."},{"key":"B","label":"Tom waits for the platform's decision","detail":"He cannot reopen Sara's place until the incident review finishes."}],"rec":"A","recWhy":"Let Tom seek cover once the chosen no-show threshold passes and review the incident separately. ShiftKey supports rapid reopening; the precise threshold remains a proposed local rule.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Today Tom has no action to release Sara's place as a no-show and reopen it urgently."},{"id":"CX-Q17","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She cancels Tom's booked shift, but a replacement takes it before it starts. Should her cancellation still count as an incident?","context":"The consequences may depend on how early Tom secures replacement cover.","gap":"","type":"decision","options":[{"key":"A","label":"Sara avoids an incident whenever cover is found","detail":"Any replacement before the shift starts removes the incident."},{"key":"B","label":"Sara avoids an incident with cover 24 hours ahead","detail":"If cover is arranged inside 24 hours, her incident still counts."},{"key":"C","label":"Sara's incident always counts","detail":"Finding replacement cover makes no difference."}],"rec":"B","recWhy":"Remove the incident if cover is arranged at least 24 hours ahead. Pharmacy SOS supports replacement-related relief, but this exact worker-incident cutoff is a proposed local rule.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"}],"current":"Today Sara has no rule reducing cancellation incidents when a replacement fills her shift."},{"id":"CX-Q18","q":"Tom owns Tom's Pharmacy in Parramatta. He cancels verified external locum Sara's booking but offers equal-paid work on the same day. If she accepts, should his cancellation fee be waived?","context":"Replacement work should suit Sara rather than being imposed to avoid compensation.","gap":"","type":"decision","options":[{"key":"A","label":"Tom's fee is waived if Sara accepts","detail":"The replacement work has equal pay and is on the same day."},{"key":"B","label":"Tom still pays the cancellation fee","detail":"His replacement offer is goodwill and does not change the fee."}],"rec":"A","recWhy":"Pharmacy SOS documents suitable replacement-work exceptions. Waive the fee only if Sara accepts equivalent pay and timing.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"}],"current":"Today Tom has no cancellation-fee waiver process for replacement work that Sara accepts."}]},{"id":"CX-S6","name":"Refunds and credits (D10)","why":"F01 keeps money streams separate; this sets the rules.","questions":[{"id":"CX-Q19","q":"Tom owns Tom's Pharmacy in Parramatta. He cancels verified external locum Sara's paid booking. Should his platform booking fee be refunded, credited or kept?","context":"Tom needs to know what happens to the platform fee separately from any cancellation pay owed to Sara.","gap":"","type":"decision","options":[{"key":"A","label":"Tom gets a refund only above 72 hours","detail":"Inside 72 hours he gets neither refund nor credit."},{"key":"B","label":"Tom always gets credit","detail":"The fee stays on the platform for future bookings; no cash refund."},{"key":"C","label":"Tom gets a refund above 72 hours, otherwise credit","detail":"He keeps the fee's value whichever side of the boundary applies."}],"rec":"C","recWhy":"Use a refund above 72 hours and credit closer to the start. Pharmacy SOS supports refunds or credits and Locumate has a 72-hour boundary; this exact combination is a proposed local policy requiring clear disclosure.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"}],"current":"Today Tom has no cancellation refund or credit process. Flags for sorting out late payments are also absent from PR #198; they exist in draft PR #182."},{"id":"CX-Q20","q":"Tom owns Tom's Pharmacy in Parramatta. Verified external locum Sara cancels his booking or does not attend. What should happen to the platform booking fee he paid?","context":"Tom paid to secure cover and needs a remedy when that cover fails.","gap":"","type":"decision","options":[{"key":"A","label":"Tom chooses a refund or credit","detail":"He chooses after each worker cancellation or no-show."},{"key":"B","label":"Tom receives credit only","detail":"He can use the credit for a replacement booking."},{"key":"C","label":"Tom's fee is kept only if replacement cover works","detail":"If no replacement fulfils the booking, Tom chooses a refund or credit."}],"rec":"C","recWhy":"Keep the fee only when replacement cover actually fulfils the booking; otherwise let Tom choose refund or credit. Pharmacy SOS and ShiftKey inform remedies and replacement handling, rather than an identical fee rule.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"},{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Today Tom has no booking-fee refund or credit process for Sara's cancellation or no-show."},{"id":"CX-Q21","q":"Tom owns Tom's Pharmacy in Parramatta. He requests a booking-fee refund after verified external locum Sara's booking is cancelled. Who should approve refunds and credits?","context":"Refunds and credits need an accountable approver and a recorded reason.","gap":"","type":"decision","options":[{"key":"A","label":"Platform finance or support reviews Tom's request","detail":"An authorised platform admin approves each case and records the reason."},{"key":"B","label":"Tom gets an automatic decision under published rules","detail":"A platform admin handles exceptions; this requires more automation."}],"rec":"A","recWhy":"Start with platform finance or support approval for every case, recording why. Pharmacy SOS informs case-based remedies; the approval, refund and credit actions still need building.","sources":[{"name":"Pharmacy SOS","url":"https://pharmacysos.com.au/terms-and-conditions/"}],"current":"Today Tom has no cancellation refund or credit approval process or payment action. Flags for sorting out payments exist in draft PR #182 but are absent from PR #198."},{"id":"CX-Q22","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom cancels her booking and owes her cancellation pay. Should that money follow her usual invoice, or should the platform pay it?","context":"Cancellation compensation needs a clear payment route, separate from recording hours actually worked.","gap":"","type":"decision","options":[{"key":"A","label":"Sara receives pay through the usual invoice or payroll","detail":"Cancellation pay is a clearly labelled line; Sara uses her usual invoice."},{"key":"B","label":"The platform pays Sara","detail":"The platform holds and distributes the cancellation money."}],"rec":"A","recWhy":"Use the usual invoice or payroll route with a separate cancellation-pay line. Locumate documents pharmacy-to-worker payment without a platform wage wallet; cancellation-pay records still need building.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/payment-process"}],"current":"Today there is no record or payment process for Sara's cancellation pay; ordinary timesheets already route wages to payroll or invoicing."}]},{"id":"CX-S7","name":"Disputes and appeals (D11)","why":"Sanctions need a fair, timed process.","questions":[{"id":"CX-Q23","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She disputes a cancellation decision about Tom's booking and may appeal the result. Who should handle the first review and the appeal?","context":"Only the platform can impose sanctions, and an appeal needs a fair review.","gap":"","type":"decision","options":[{"key":"A","label":"Sara's appeal goes to a different reviewer","detail":"Support handles the first review; a second person handles the appeal."},{"key":"B","label":"Sara's first reviewer also hears her appeal","detail":"One person handles both stages."}],"rec":"A","recWhy":"Use a different person for the appeal. Qwick and Locate a Locum support individual review, but an identical two-reviewer structure is not verified; this is a proposed fairness safeguard.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/3815156-locate-a-locum-cancellation-policy-locums"}],"current":"Today Sara has no cancellation dispute or appeal process."},{"id":"CX-Q24","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She wants to appeal a cancellation decision about Tom's booking. How long should she have, and how quickly should support respond?","context":"Both sides need predictable deadlines instead of an unresolved dispute.","gap":"","type":"decision","options":[{"key":"A","label":"Sara has 14 days; support answers in five","detail":"The first review happens within two business days."},{"key":"B","label":"Sara has 30 days; support answers in ten","detail":"Both the appeal window and response time are longer."}],"rec":"A","recWhy":"Allow 14 days to appeal, first review within two business days and an answer in five days. Instawork's hours-dispute deadlines offer context but do not establish these proposed cancellation appeal timings.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/13113958-how-does-instawork-handle-payment-processing-when-there-are-disputes-about-worked-hours"}],"current":"Today Sara has no cancellation appeal deadline or promised support response time."},{"id":"CX-Q25","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She disputes a cancellation with Tom and submits private medical evidence. What should each person be able to see?","context":"Both sides must be able to answer the case without unnecessarily exposing sensitive information.","gap":"","type":"decision","options":[{"key":"A","label":"Sara and Tom see the case summary","detail":"Only support sees sensitive evidence."},{"key":"B","label":"Sara and Tom see all evidence","detail":"This exposes medical and identity evidence to the other party."},{"key":"C","label":"Only platform support sees the case","detail":"Sara and Tom cannot see enough to answer the allegations."}],"rec":"A","recWhy":"Show both parties the allegation, relevant facts and outcome. Following OAIC guidance, restrict medical, identity and third-party evidence to authorised support unless disclosure is necessary and lawful.","sources":[{"name":"OAIC APP 6","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-6-app-6-use-or-disclosure-of-personal-information"}],"current":"Today Sara and Tom have no cancellation dispute case, evidence categories or rules controlling access to that evidence."}]},{"id":"CX-S8","name":"Incident ladder details (P10)","why":"The ladder is approved; its edges are not.","questions":[{"id":"CX-Q26","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She cancels Tom's confirmed shift or fails to attend, without an exemption. Which events should count as incidents after platform review?","context":"The policy needs to distinguish early cancellations from late cancellations and no-shows.","gap":"","type":"decision","options":[{"key":"A","label":"Sara's no-shows and cancellations inside 72 hours count","detail":"The cutoff matches Tom's cancellation fee boundary."},{"key":"B","label":"Sara's no-shows and cancellations inside 24 hours count","detail":"Earlier cancellations do not count as incidents."},{"key":"C","label":"Every cancellation after confirmation counts for Sara","detail":"Even cancelling weeks ahead counts as an incident."}],"rec":"A","recWhy":"Count no-shows and cancellations inside 72 hours after review. Nursa distinguishes early and late incidents, and Relief Buddy changes treatment at 72 hours; this combined cutoff is a proposed local policy.","sources":[{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Today Sara has no reviewed incident record or cutoff defining which cancellations count."},{"id":"CX-Q27","q":"Ben is Tom's favourite external locum pharmacist, verified and not employed by him. He misses a favourites shift. Should bookings through favourites, Tom's other pharmacies or his banner group count towards platform sanctions like public bookings?","context":"Public bookings need platform sanctions, while favourite and group relationships have their own internal handling.","gap":"","type":"decision","options":[{"key":"A","label":"Ben may get a badge, never platform suspension","detail":"Only public-sourced incidents count towards platform sanctions; other sources affect badges only."},{"key":"B","label":"Ben's incident counts like any external booking","detail":"Incidents through favourites, Tom's other pharmacies, his banner group and the public marketplace all count towards the same sanctions."}],"rec":"A","recWhy":"Count only public-sourced incidents towards platform sanctions; other sources may affect badges. Instawork's pharmacy-specific return and block controls support separating relationships, but do not establish this exact proposed rule.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/5511147-how-can-i-create-and-manage-my-roster"}],"current":"Today Ben has no relationship-based rule for platform incident counts or reliability badges."},{"id":"CX-Q28","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Her record includes an old cancellation at Tom's Pharmacy. How far back should the platform count incidents when deciding consequences?","context":"Old mistakes need a clear expiry rule if workers are to rebuild a reliable record.","gap":"","type":"decision","options":[{"key":"A","label":"Sara's incidents drop off after 12 months","detail":"Only incidents within the rolling year count."},{"key":"B","label":"Sara's incidents drop off after six months","detail":"Her record clears sooner."},{"key":"C","label":"Sara's incidents count for life","detail":"Old incidents never expire."}],"rec":"A","recWhy":"Use a rolling 12 months, matching ShiftKey's reliability history. This is a proposed incident-count window; Nursa uses different periods for cancellation and no-show treatment.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Reliability-Score-FAQ-for-Facilities"},{"name":"Nursa","url":"https://community.nursa.com/help-center/clinician/own-your-shift/cancelation-ncns/"}],"current":"Today Sara has no incident lookback period or reset rule."},{"id":"CX-Q29","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She receives a reliability badge after three incidents, including one at Tom's Pharmacy. When should the badge disappear?","context":"The badge needs a clear removal rule that workers can understand separately from incident expiry.","gap":"","type":"decision","options":[{"key":"A","label":"Sara's badge clears after three incident-free months","detail":"It can clear while older incidents still count."},{"key":"B","label":"Sara's badge clears below three active incidents","detail":"It follows the chosen incident lookback period."},{"key":"C","label":"Sara keeps the badge permanently","detail":"There is no way to clear it."}],"rec":"B","recWhy":"Remove the badge when fewer than three active incidents remain. One count-based rule is easier for Sara to understand than a separate badge timer.","sources":[],"current":"Today Sara has no reliability badge removal rule."},{"id":"CX-Q30","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. After incidents including a missed shift at Tom's Pharmacy, she faces permanent platform suspension. What review and appeal process should happen first?","context":"Permanent restrictions require human and legal review, clear reasons and a fair chance to respond and appeal.","gap":"","type":"decision","options":[{"key":"A","label":"Sara gets the required fair process","detail":"She receives reasons, notice, review, a chance to respond and appeal under the applicable Code."},{"key":"B","label":"Two reviewers and legal review Sara's case","detail":"These checks help but do not supply the whole required process."},{"key":"C","label":"One platform admin decides Sara's suspension","detail":"There is no second review or full response process."}],"rec":"A","recWhy":"Where the worker is protected, the Digital Labour Platform Deactivation Code requires fair process. Build that process before permanent or material account restrictions are used.","sources":[{"name":"Fair Work employee-like workers","url":"https://www.fairwork.gov.au/find-help-for/regulated-workers/employee-like-workers"}],"current":"Today Sara has no permanent-suspension review, notice or appeal process for these incidents."},{"id":"CX-Q31","q":"Ben is Tom's verified favourite external locum, not an employee. He accepts Tom's shift after it becomes public. When should his booking relationship be fixed, and which relationship should win if several apply?","context":"A favourite who sees a public advert should not accidentally receive the wrong cancellation consequences.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Ben's terms save the shift's audience at acceptance, without choosing between his own relationships."},{"key":"A","label":"Ben counts as a favourite from acceptance","detail":"Save his closest eligible relationship for each date when he accepts."},{"key":"B","label":"Ben counts as public from acceptance","detail":"The audience through which he saw the shift determines the rules."},{"key":"C","label":"Ben's relationship is fixed when Tom pays","detail":"It may change as the shift is shown to more people before payment."}],"rec":"A","recWhy":"Save the closest eligible relationship for each worker and date at acceptance. Locumate's preferred pools support a relationship-first approach, but this exact order of precedence is a proposed local rule.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"Today Ben's accepted terms save who could see the shift at acceptance, and his assignment links to the offer. They do not save whether he is a favourite, works at Tom's other pharmacies, belongs to the banner group or found it publicly, or choose between overlapping relationships."}]},{"id":"CX-S9","name":"Completion (D14)","why":"What marks a shift done, so pay and ratings can follow.","questions":[{"id":"CX-Q32","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She finishes Tom's booked shift and submits her hours. What should mark the booking complete?","context":"A booking record needs evidence of completed work, and approved hours still feed payroll or invoicing.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara appears in assignment-based history, which can include future work; there is no completed status."},{"key":"A","label":"Sara completes after approval or 48-hour auto-approval","detail":"She submits her timesheet; Tom approves it or it automatically approves after 48 hours."},{"key":"B","label":"Sara completes as soon as she clocks out","detail":"Tom does not confirm her hours first."},{"key":"C","label":"Sara completes only when Tom approves","detail":"The booking can remain unfinished indefinitely if he does not respond."}],"rec":"A","recWhy":"Use approved timesheets with a visible 48-hour fallback. Locumate documents 48-hour timesheet auto-approval; Relief Buddy and Nursa have different deadlines, so scheduled end alone should not prove the work happened.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-confirm-shift-hours-once-a-shift-is-complete"}],"current":"Today Sara's assignment has no completed status. Her and Tom's history needs an assignment but can show future work. Timesheet approval is separate, with no automatic booking completion after 48 hours."},{"id":"CX-Q33","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom changes her recorded hours after her booked shift. She disagrees. How should they settle it?","context":"Comments alone do not settle a disagreement about the hours Sara should be paid.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom corrects hours with a reason; Sara comments or requests missing clock records without a support dispute process."},{"key":"A","label":"Sara can ask support to review Tom's correction","detail":"Tom records his reason; support decides if they cannot agree."},{"key":"B","label":"Support handles every hours dispute","detail":"Every disagreement goes straight to support."}],"rec":"A","recWhy":"Keep reasoned manager corrections and let Sara take an unresolved disagreement to support. Instawork and Qwick document hours-review processes with clear limits.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/13113958-how-does-instawork-handle-payment-processing-when-there-are-disputes-about-worked-hours"},{"name":"Qwick","url":"https://support.qwick.com/en/articles/13038785"}],"current":"Today Tom can correct attendance with a reason. Sara can comment on timesheets and request missing clock-ins or clock-outs, but cannot send an hours disagreement to platform support through either app."},{"id":"CX-R01","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom sends her home early one day and authorises extra hours another day. Should payment follow scheduled or approved actual hours?","context":"Both sides need to know which hours control payment when the working day changes.","gap":"SH-14","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom approves actual hours without a marketplace rule for early release, extra hours or minimum payment."},{"key":"A","label":"Sara is paid approved actual hours with legal minimums","detail":"Apply minimum engagement, penalty rates and authorised overtime; record who requested the change."},{"key":"B","label":"Sara is paid scheduled hours only","detail":"Authorised extra hours and early release do not change the scheduled payment."}],"rec":"A","recWhy":"Use approved actual hours while preserving legal minimum engagements, authorised overtime and penalty rates. Record who requested each early finish or extension, following applicable Pharmacy Industry Award requirements.","sources":[{"name":"Pharmacy Industry Award","url":"https://awards.fairwork.gov.au/MA000012.html"}],"current":"Today Sara's timesheet compares actual and planned hours, and Tom can correct it. No marketplace rule resolves early release, authorised extra hours or the minimum payment owed."}]},{"id":"CX-S10","name":"History and ratings (D15)","why":"Ratings must reflect real worked shifts.","questions":[{"id":"CX-Q34","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She has a booking at Tom's Pharmacy but has not worked it yet. When should Tom and Sara be allowed to rate each other?","context":"An assignment alone does not prove work happened, yet these ratings affect public talent cards.","gap":"SH-10","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom and Sara can rate after any assignment, including future or unworked bookings."},{"key":"A","label":"Tom and Sara rate only after approved hours","detail":"No work means no rating."},{"key":"B","label":"Tom and Sara rate after the scheduled end","detail":"They could still rate a shift that was never worked."}],"rec":"A","recWhy":"Require approved timesheets before either side rates the work. ShiftKey and Airtasker separate feedback about real work from whether bookings were fulfilled.","sources":[{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/beyond-filling-shifts-how-to-build-a-network-of-independent-professionals-you-trust"},{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"}],"current":"Today Tom, organisation admins and pharmacy admins can rate assigned workers, and Sara can rate pharmacies. Any assignment qualifies, including future, internal or unworked assignments; only pending-rating lists filter dates."},{"id":"CX-Q35","q":"Omar is Tom's employed pharmacist and a verified staff member, paid through payroll. Tom rates him after an internal roster shift. Should that rating affect Omar's public talent card?","context":"Private employment feedback currently changes how a worker is presented to other employers.","gap":"SH-10","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Omar's internal relationship ratings count towards his public talent-card average."},{"key":"A","label":"Omar's internal ratings stay private","detail":"Tom's employee feedback does not affect Omar's public marketplace reviews."}],"rec":"A","recWhy":"Keep internal ratings private and separate from marketplace reviews. Clipboard supports records limited to the relevant relationship, but does not establish this exact proposed public-rating rule.","sources":[{"name":"Clipboard","url":"https://www.clipboard.com/privacy-policy"}],"current":"Today Omar's talent card averages all owner-to-worker relationship ratings, including those enabled by internal roster assignments. Web and mobile show the same combined average without separating employment feedback from marketplace reviews."},{"id":"CX-Q36","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Her booking at Tom's Pharmacy is cancelled, expires unpaid or becomes a no-show. Should both still see it in their history?","context":"Both people need a lasting record explaining what happened to a booking that did not proceed.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"History follows assignments, without complete cancellation, no-show or unpaid-expiry records."},{"key":"A","label":"Sara and Tom keep the record with its status","detail":"Only the two parties can see the reason."},{"key":"B","label":"Sara and Tom lose cancelled bookings from history","detail":"Cancelled bookings are hidden, removing the record of what happened."}],"rec":"A","recWhy":"Keep cancelled, expired and no-show events with clear status and reasons visible only to the parties. Airtasker's completion reporting illustrates why cancellation records need to survive.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"}],"current":"Today Sara and Tom see assignment-based history, which can include future work. There is no general cancelled or no-show status; AHPRA removal can erase assignments from history. Awaiting-payment offers have no automatic expiry release."}]}]},{"id":"talent","name":"Talent board","summary":"Who can find workers, what they see, and what they can do.","steps":[{"id":"TB-S1","name":"Who sees what","why":"Privacy first; the board leaks names today.","questions":[{"id":"TB-Q01","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She posts anonymously on the talent board so pharmacies such as Tom's can find her. Who should be allowed to browse her post?","context":"Sara's anonymity depends on who can browse and whether her identity stays hidden.","gap":"TB-02","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Any signed-in account sees Sara's identity; logged-out visitors see masked anonymous cards."},{"key":"A","label":"Only employers and Sara see her post","detail":"Owners, managers and organisations can browse; Sara can view her own post."},{"key":"B","label":"Employers and Sara see it; public cards stay masked","detail":"Logged-out visitors can discover Sara without seeing her identity."}],"rec":"B","recWhy":"Limit signed-in discovery to authorised hiring roles and the author, with properly masked public cards. Upwork's visibility controls inform audience choice; identity must be masked before data is sent because worker access currently defeats anonymity.","sources":[{"name":"Upwork visibility controls","url":"https://support.upwork.com/hc/en-us/articles/211060298-How-to-control-who-sees-your-Upwork-profile"}],"current":"Today any signed-in account, including other workers, can read Sara's post and identity on both apps. Logged-out visitors can read public cards, where anonymous identities are masked; signed-in reads do not mask them."},{"id":"TB-Q02","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She posts anonymously. Tom wants to contact her about work at his pharmacy. When should he learn who she is?","context":"Sara should control when an anonymous search for work becomes an identifiable conversation.","gap":"TB-02","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom or any other signed-in user receives Sara's name and user ID immediately."},{"key":"A","label":"Tom sees Sara's identity when she accepts his request","detail":"Sara chooses to engage by accepting the booking request."},{"key":"B","label":"Tom sees Sara's identity when she replies in chat","detail":"Her first chat reply reveals her identity, before accepting a request."},{"key":"C","label":"Tom sees Sara's identity only after offer acceptance","detail":"Identity stays hidden until the offer is accepted."}],"rec":"A","recWhy":"Reveal identity when Sara accepts the booking request. Mable supports identity restrictions linked to agreement, but this exact reveal point is a proposed local choice.","sources":[{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"Today Tom receives Sara's name and user ID as soon as he reads her anonymous post while signed in. Public reads mask her identity; neither app waits for chat, a booking request or offer acceptance."},{"id":"TB-Q03","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Her anonymous talent card interests Tom, who has not reached the agreed identity-reveal stage. Which details should stay hidden from him?","context":"Masking card fields is ineffective if a pitch can reveal the same identity or contact details.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Signed-in Tom sees Sara's adult full name; structured contacts, address and documents are omitted, but pitch text can disclose details."},{"key":"A","label":"Sara's identity and contact details stay hidden","detail":"Hide surname, contact details, street address and documents; check the pitch for identifying details too."},{"key":"B","label":"Only Sara's contact details stay hidden","detail":"Tom sees her full name before making a booking request."}],"rec":"A","recWhy":"Hide direct identity, contacts, street address and documents until the agreed reveal point, and check free text too. Mable's profile guidance supports restrictin
