g identifying and contact information.","sources":[{"name":"Mable profile guidance","url":"https://mable.com.au/help_centre/create-winning-profile/"}],"current":"Today Sara's structured card omits contacts, street address and documents, but signed-in users receive her adult full name. Under-18s show first names. Both apps share this behaviour, and free-text pitches are not reliably contact-masked."}]},{"id":"TB-S2","name":"Search and trust signals","why":"Helps pharmacies pick, without punishing newcomers.","questions":[{"id":"TB-Q04","q":"Tom owns Tom's Pharmacy in Parramatta. He searches the talent board for a verified external pharmacist like Sara to work nearby on Saturday. Which filters should he have at launch?","context":"Tom needs relevant candidates without downloading and searching every post himself.","gap":"TB-04","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom downloads all posts and uses existing app filters, without distance or rate filtering."},{"key":"A","label":"Tom filters role, distance, dates, rate and software","detail":"The service filters results before sending them to his app."},{"key":"B","label":"Tom filters only role and date","detail":"There are fewer search choices to build."}],"rec":"A","recWhy":"Keep useful existing filters and add distance and rate matching before results are downloaded. Relief Buddy and Upwork support the structured search constraints missing today.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-find-a-shift"},{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/211063528-How-to-search-for-freelancers-on-Upwork"}],"current":"Today Tom's app downloads every feed page, then filters role, work type, state, skills/software, dates, travel and text. Both apps use this approach, with no pharmacy-distance or rate filter and no filtering before download."},{"id":"TB-Q05","q":"Tom owns Tom's Pharmacy in Parramatta. He compares verified external locum Sara's talent card with other candidates. How should he see work reviews and whether bookings were reliably fulfilled?","context":"Good work reviews and reliable attendance answer different hiring questions.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom sees one relationship star average and count, with no separate reliability measure."},{"key":"A","label":"Tom sees separate reviews and reliability","detail":"Each has its own count and a one-line explanation."}],"rec":"A","recWhy":"Show reviews and reliability separately, each with counts and a short explanation. ShiftKey and Airtasker separate those signals; one average can hide cancellations or mix employment feedback with marketplace work.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Reliability-Score-FAQ-for-Facilities"},{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"}],"current":"Today Tom sees one average owner-to-worker star score and its rating count on web and mobile. Internal ratings feed that average, with no separate attendance reliability or responsiveness measure."},{"id":"TB-Q06","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She has just joined and has no completed shifts or reviews. Tom opens her talent card. What should he see before she builds a work record?","context":"A worker without feedback should not look like someone who has received poor feedback.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom sees zero stars before feedback and a score from Sara's first rating."},{"key":"A","label":"Tom sees New until Sara completes five shifts","detail":"No score appears before that threshold."}],"rec":"A","recWhy":"Show New until five completed shifts. Airtasker's five-task completion-rate threshold and ShiftKey's feedback threshold inform this choice; they do not establish the exact proposed five-shift rating rule.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/225875007-What-are-Completion-Rates"},{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/beyond-filling-shifts-how-to-build-a-network-of-independent-professionals-you-trust"}],"current":"Today Tom sees 0.0 (0) on Sara's card before any feedback, then an average and count from her first rating. Neither app has a neutral New label or completed-shift threshold."}]},{"id":"TB-S3","name":"Actions on a card","why":"Turns discovery into bookings and lasting relationships.","questions":[{"id":"TB-Q07","q":"Tom owns Tom's Pharmacy in Parramatta. He taps Request booking on verified external locum Sara's talent card. She has an ABN and no pharmacy membership. Is he sending a firm offer or starting an enquiry?","context":"Both people need to know whether the request is work ready to accept or a conversation.","gap":"TB-06","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara receives a firm dedicated offer to accept or decline; payment is required only when Tom's pharmacy billing requires it."},{"key":"B","label":"Sara receives an enquiry or chat first","detail":"Tom sends a normal offer after they discuss the work."},{"key":"C","label":"Tom chooses enquiry or firm offer each time","detail":"Sara receives whichever kind of request he selects."}],"rec":"KEEP","recWhy":"Keep a firm request Sara can accept or decline, like Hireup booking requests and Florence invitations. This preserves consent; credential, permission and expiry defects remain separate launch fixes.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/13502083241103-Booking-Requests-For-Clients"},{"name":"Florence","url":"https://help.florence.co.uk/en/articles/8200817-how-to-use-favourites-to-rebook-preferred-professionals"}],"current":"Today on web, Request Booking shows only if Sara's card lists dates; with 'No dates shared yet', Tom has no button to book or message her. Otherwise Tom sends firm offers expiring after 48 hours that Sara must accept. Timed payment holds are in draft PR #182, not PR #198."},{"id":"TB-Q08","q":"Tom owns Tom's Pharmacy in Parramatta. He likes verified external locum Sara's talent card and wants to invite her back for future work. She is not a pharmacy member. What should the heart do?","context":"A quick reaction and an invitation to a recurring work relationship need distinct meanings.","gap":"TB-05","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Tom likes the post; he cannot invite Sara to pharmacy favourites from her card."},{"key":"A","label":"Tom's heart sends Sara a favourites invitation","detail":"Sara must accept before joining his favourites."},{"key":"B","label":"Tom keeps liking; a separate button invites Sara","detail":"Invite to favourites sends a membership invitation for Sara to accept."}],"rec":"B","recWhy":"Keep the heart as a like and add an explicit invitation Sara can accept. Florence and Locate a Locum use favourites for practical rebooking relationships.","sources":[{"name":"Florence","url":"https://help.florence.co.uk/en/articles/8200817-how-to-use-favourites-to-rebook-preferred-professionals"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/12982363-how-to-get-the-most-value-from-your-locums"}],"current":"Today Tom's heart likes or unlikes Sara's post and changes its count on both apps. It creates no favourites relationship, and the card has no Invite to favourites action."},{"id":"TB-Q09","q":"Tom owns Tom's Pharmacy in Parramatta. He does not want verified external locum Sara, who is not a pharmacy member, to see or apply for his shifts again. Can he block her privately?","context":"Tom needs a pharmacy-specific hiring control without publicly damaging a worker's reputation.","gap":"","type":"decision","options":[{"key":"A","label":"Tom can privately block Sara","detail":"Sara stops seeing his pharmacy's shifts; the block is never shown publicly."},{"key":"B","label":"Tom cannot block Sara","detail":"He must decline her each time."}],"rec":"A","recWhy":"Sidekicker, Relief Buddy and CareRev support private blocking separately from public ratings. Build a block limited to Tom's pharmacy.","sources":[{"name":"Sidekicker","url":"https://pages.sidekicker.com/book-a-demo"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-happens-when-a-temp-cancels-on-me"},{"name":"CareRev","url":"https://www.carerev.com/blog/getting-the-most-out-of-carerev-tips-tricks-for-healthcare-professionals"}],"current":"Today Tom has no private worker-block list in the shift or talent flow."},{"id":"TB-Q10","q":"Tom owns Tom's Pharmacy in Parramatta. He meets verified external locum Sara through the platform and wants to employ her permanently. She is not currently a member. What direct-hire rule should they follow?","context":"Both sides need clear rules for permanent hiring and for shifts found through the platform.","gap":"","type":"decision","options":[{"key":"A","label":"Tom hires permanently free; platform shifts stay here","detail":"There is no permanent-hire fee; shifts found on the platform are booked on it."},{"key":"B","label":"Tom pays a conversion fee to hire Sara","detail":"Use an approach like Upwork or Sidekicker."},{"key":"C","label":"Tom and Sara have no direct-hire rule","detail":"Neither gets clear guidance about hiring or taking work off-platform."}],"rec":"A","recWhy":"Nursa advertises no hire-away fee, while Upwork and Sidekicker charge conversion fees. Choose free permanent hiring and clearly state that shifts found here must still be booked here.","sources":[{"name":"Nursa","url":"https://nursa.com/facility/solutions/healthcare-recruitment-software"},{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/360043723533-What-is-the-Upwork-Conversion-Fee"},{"name":"Sidekicker","url":"https://sidekicker.com/policy-pages/terms-of-use"}],"current":"Today Tom and Sara have no direct-hire or off-platform conversion rule in this flow."}]}]},{"id":"availability","name":"Availability","summary":"When workers can work, and how that drives matching.","steps":[{"id":"AV-S1","name":"The calendar","why":"One source of truth for when a worker is free.","questions":[{"id":"AV-Q01","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She is usually free Saturdays for pharmacies such as Tom's, except during a holiday. How should she enter her availability?","context":"Outside work and holidays need to override a normal weekly pattern without rebuilding it.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara saves dated or repeating available times, without unavailable-date exceptions."},{"key":"A","label":"Sara sets a weekly pattern plus unavailable dates","detail":"Her holiday and other unavailable dates always override the weekly pattern."},{"key":"B","label":"Sara enters each available date separately","detail":"She re-enters dates instead of repeating a weekly pattern."}],"rec":"A","recWhy":"Keep dated and recurring availability and add unavailable dates that override repeats. Relief Buddy and Locate a Locum support exceptions for holidays and outside commitments.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/available-days-to-work"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4815841-how-to-use-your-locum-diary"}],"current":"Today Sara can save dates or repeating weekdays, with times or all-day, on either app. To skip a holiday she can only leave dates out or delete a slot; there is no unavailable date, with a note, that overrides her weekly pattern."},{"id":"AV-Q02","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She repeats her Saturday availability for work at pharmacies such as Tom's. How long should that pattern run before she must confirm it again?","context":"Old repeating availability can keep matching shifts after the worker's plans change.","gap":"AV-02","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara needs an end date in either app; direct submissions can omit it, and no refresh reminders arrive."},{"key":"A","label":"Sara must set an end date within three months","detail":"She refreshes the pattern when it ends."},{"key":"B","label":"Sara can repeat indefinitely and reconfirms quarterly","detail":"Every three months she is prompted to check the pattern."}],"rec":"B","recWhy":"Allow open-ended repeats consistently and ask Sara to reconfirm every three months. Locumate and Upwork support maintaining availability; quarterly reminders are a proposed timing, not a verified competitor standard.","sources":[{"name":"Locumate","url":"https://support.locumate.ai/portal/en/kb/locumate/marketplace/locums"},{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/115003975967-Why-was-my-profile-changed-to-private"}],"current":"Today Sara must set an end date to save or preview repeats in either app, although the service accepts repeats without one. There is no three-month maximum, quarterly confirmation or automatic refresh reminder."}]},{"id":"AV-S2","name":"How it is used","why":"Matching rules must agree across alerts, roster and search.","questions":[{"id":"AV-Q03","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She is free from 9 am to 10 am. Tom posts a 9 am to 5 pm shift. Should that count as a match for her?","context":"A short overlap does not mean Sara can cover Tom's full working day.","gap":"AV-03","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara gets overlap-based alerts; roster warnings still require the whole shift to fit."},{"key":"A","label":"Sara matches only if she can cover the whole shift","detail":"Use the same rule for alerts, suggestions and roster warnings."},{"key":"B","label":"Sara matches if a chosen percentage overlaps","detail":"Choose the minimum percentage of Tom's shift she must be available for."}],"rec":"A","recWhy":"Require the whole shift to fit inside availability, matching roster warnings. Relief Buddy consistently excludes unavailable time; this avoids sending Sara shifts she cannot cover.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/available-days-to-work"}],"current":"Today Sara can receive a match email or dashboard suggestion for any overlap, even touching start and end times. Roster warnings instead require availability covering the whole shift; both apps use these rules."},{"id":"AV-Q04","q":"Ben is Tom's verified favourite external locum pharmacist, not an employee. He saves availability and considers letting Tom view it. Who should see his live calendar?","context":"A trusted relationship should not silently expose a worker's private calendar or notes.","gap":"AV-06","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Ben's raw calendar stays private; Tom sees only dates copied into his talent post."},{"key":"B","label":"Ben opts in chosen trusted pharmacies","detail":"He chooses which accepted staff and favourite pharmacies can see his availability."},{"key":"C","label":"Ben opts in employer viewing through his talent card","detail":"A broader employer audience can see the availability he shares."}],"rec":"B","recWhy":"Let Ben explicitly choose which accepted staff or favourite pharmacies can see availability. OAIC guidance supports consent for disclosure; an existing relationship alone should not reveal private calendar details.","sources":[{"name":"OAIC APP 6","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-6-app-6-use-or-disclosure-of-personal-information"}],"current":"Today only Ben can read or edit his raw availability. It drives alerts, recommendations and roster warnings, while Tom sees copied talent-post dates rather than his live calendar on either app."},{"id":"AV-Q05","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She declares Saturday available, then confirms a booking with Tom. Should those booked hours automatically stop matching other shifts?","context":"Alerts for hours already booked waste attention even if a later conflict check rejects the booking.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara's declared availability and alerts stay unchanged after her booking is confirmed."},{"key":"A","label":"Sara's booked hours become unavailable","detail":"She receives no matching-shift alerts for those hours."}],"rec":"A","recWhy":"Subtract confirmed booking times automatically. Hireup's conflict visibility and Locate a Locum's diary filtering support avoiding work that clashes with existing bookings.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/13502083241103-Booking-Requests-For-Clients"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4815841-how-to-use-your-locum-diary"}],"current":"Today Sara's confirmed assignments do not reduce her declared availability or matching alerts. Separate roster conflict checks can reject clashes, but either app can still send alerts for hours she has already booked."}]},{"id":"AV-S3","name":"Freshness and preferences","why":"Stale calendars waste pharmacies' time.","questions":[{"id":"AV-Q06","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She posts that she wants work at pharmacies such as Tom's, then stops updating the post. When should it stop appearing?","context":"Tom needs to know that people shown as available are still looking for work.","gap":"AV-02","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Dated posts leave feeds after the last date; undated and full-time posts remain, and list or detail reads bypass hiding."},{"key":"A","label":"Sara's post hides after 30 days without an update","detail":"She gets a reminder before it is hidden."},{"key":"C","label":"Sara's post never expires","detail":"Tom may keep seeing workers who stopped looking long ago."}],"rec":"A","recWhy":"Nudge Sara, then hide posts after 30 days without an update across all ways of viewing them. Upwork supports inactivity privacy; 30 days is a proposed local default.","sources":[{"name":"Upwork","url":"https://support.upwork.com/hc/en-us/articles/115003975967-Why-was-my-profile-changed-to-private"}],"current":"Today Sara's dated post disappears from feeds after its last date, but undated and full-time posts remain indefinitely unless moderated. Ordinary list and detail reads bypass that hiding rule; neither app has an inactivity cutoff."},{"id":"AV-Q07","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She wants Tom to know her saved availability is still correct. Should she be able to confirm it, with the confirmation date shown?","context":"Tom needs a clear signal that Sara recently checked the times she is offering.","gap":"","type":"decision","options":[{"key":"A","label":"Sara confirms weekly; Tom sees how recent it is","detail":"One tap reconfirms; availability is marked stale after 14 days, and Sara can pause."},{"key":"B","label":"Sara has no confirmation date or reminder","detail":"Tom must guess whether her availability is current."}],"rec":"A","recWhy":"Add a visible confirmation date, weekly one-tap reminders and a pause option. Locumate encourages maintenance and Mable supports pausing; weekly reminders and marking stale after 14 days are proposed timings.","sources":[{"name":"Mable","url":"https://mable.com.au/help_centre/how-are-response-rates-calculated-and-why-is-it-important-for-my-business/"},{"name":"Locumate","url":"https://support.locumate.ai/portal/en/kb/locumate/marketplace/locums"}],"current":"Today Sara has no availability confirmation date, confirmation action or freshness status; ordinary record update times do not show that she checked her availability."},{"id":"AV-Q08","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She allows matching-shift alerts. Tom posts a shift starting within 24 hours. Should urgent alerts need a separate permission from her?","context":"Notification permission should be clear without creating extra choices for the same purpose.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara's matching-shift permission covers urgent and ordinary public shifts."},{"key":"A","label":"Sara separately opts in to urgent alerts","detail":"The extra permission covers shifts starting within 24 hours."}],"rec":"KEEP","recWhy":"Keep one matching-shift permission at launch and clearly label urgent messages. Add frequency controls only if actual message volume shows they are needed.","sources":[],"current":"Today Sara has one matching-public-shift notification switch on availability entries in both apps. There is no separate urgent consent or separate group receiving availability alerts based on urgency."},{"id":"AV-Q09","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She wants alerts only for nearby shifts paying her minimum rate, including Tom's. Should alerts respect both limits?","context":"Relevant alerts should fit both the journey Sara accepts and the pay she needs.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep it like today","detail":"Sara's alerts respect distance or travel preferences but do not filter by minimum rate."},{"key":"A","label":"Sara's alerts respect distance and minimum rate","detail":"She can still widen her search when she chooses."}],"rec":"A","recWhy":"Keep existing travel matching and add a minimum-rate preference for alerts. Relief Buddy and Locate a Locum support structured matching; Sara should still be able to widen a search deliberately.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-find-a-shift"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4967810-how-to-find-apply-for-a-shift-as-a-locum"}],"current":"Today Sara can set a coverage radius or travel states on either app, and alerts already respect them. Alerts do not check a minimum hourly rate; the postcode and radius saved in her talent post are a separate copy."}]}]},{"id":"launch","name":"Fix list & launch","summary":"Code gaps with no policy choice. Only the timing is yours.","steps":[{"id":"LA-S1","name":"Onboarding fixes","why":"Trust and sign-up blockers.","questions":[{"id":"LA-Q01","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She accepts Tom's public shift, but booking uses a saved AHPRA result without completing a fresh register check. Fix before launch?","context":"Tom needs current registration checks before a pharmacist is booked.","gap":"ON-02","type":"code","options":[{"key":"A","label":"Before launch","detail":"Check Sara's registration successfully before booking her."},{"key":"B","label":"Soon after launch","detail":"Allow bookings first; add the fresh check within the first month."},{"key":"C","label":"Not needed","detail":"Keep booking Sara using saved AHPRA results."}],"rec":"A","recWhy":"Use the existing register-check process and require a fresh successful check before bookings for registered roles. An available desktop lookup alone does not make booking wait for the result.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"Today Sara's Verified status follows saved role requirements. Public bookings use stored AHPRA results; desktop mode queues overdue rechecks after the request. No fresh register lookup finishes before booking. The default register-check source is ScrapingBee."},{"id":"LA-Q02","q":"Tom owns Tom's Pharmacy in Parramatta. He adds a personal work profile on mobile. The pharmacist form sends unsupported details, while choosing other staff leads to a missing page. Fix before launch?","context":"Account upgrades need to preserve people's details and lead to a usable profile.","gap":"ON-04","type":"code","options":[{"key":"A","label":"Before launch","detail":"Give Tom a supported profile form and a working route."},{"key":"B","label":"Soon after launch","detail":"Leave Tom's upgrade problems until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep the unsupported form and missing page."}],"rec":"A","recWhy":"Fix mobile upgrades before launch using the supported role profiles. Florence's onboarding approach supports a complete, usable process rather than losing details or ending at a missing page.","sources":[{"name":"Florence","url":"https://www.florence.co.uk/looking-for-work/registration"}],"current":"Today Tom's mobile account upgrade sends pharmacists to an old form with unsupported bank and rate fields; other staff choices lead to a missing onboarding page. Web has separate role onboarding screens."},{"id":"LA-Q03","q":"Zoe is an unverified pharmacy student with an Explorer account and no pharmacy membership. She opens Shifts on mobile and reaches a placeholder. Other reachable screens also lose profile details or lead nowhere. Fix before launch?","context":"People should not reach screens that promise an action but cannot complete it.","gap":"ON-05","type":"code","options":[{"key":"A","label":"Before launch","detail":"Give Zoe and other users working reachable screens."},{"key":"B","label":"Soon after launch","detail":"Leave the broken screens until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep the placeholders, unsupported submissions and missing routes."}],"rec":"A","recWhy":"Repair or remove reachable dead ends and unsupported submissions before launch. The unreferenced web organisation page can be deleted or deferred separately.","sources":[],"current":"Today Zoe's Explorer Shifts screen and some hubs are placeholders. Mobile manager profile upgrades can send unsupported fields or reach a missing page. An unreferenced organisation-create page also exists on web."},{"id":"LA-Q04","q":"Sara is an external locum pharmacist with an ABN and no pharmacy membership. She is not verified yet, but her profile looks almost complete. The percentage includes optional details rather than the checks blocking public work. Fix before launch?","context":"Sara needs to see the checks that actually stop her taking public work.","gap":"ON-10","type":"code","options":[{"key":"A","label":"Before launch","detail":"Show Sara the actual missing verification checks."},{"key":"B","label":"Soon after launch","detail":"Keep the confusing percentage until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep optional profile completeness as the readiness signal."}],"rec":"A","recWhy":"Show the missing verification requirements before launch. Florence and Hireup tie progress to real review steps; optional profile completeness should not obscure what Sara must finish.","sources":[{"name":"Florence","url":"https://www.florence.co.uk/looking-for-work/registration"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360016020691-What-do-I-need-to-register-as-a-Hireup-support-worker"}],"current":"Today Sara's profile percentage counts optional CV, bio, rates, referees and identity details. Verified status follows different requirements for her role. Either app can show high completeness while she still lacks checks needed for public access."},{"id":"LA-Q05","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She tries to accept Tom's urgent shift and only then discovers missing payment setup. She had no early checklist. Fix before launch?","context":"Sara needs time to fix payment requirements before urgent work depends on them.","gap":"ON-11","type":"code","options":[{"key":"A","label":"Before launch","detail":"Show Sara payment blockers and how to fix them early."},{"key":"B","label":"Soon after launch","detail":"Add Sara's checklist in a release within the first month."},{"key":"C","label":"Not needed","detail":"Leave Sara to discover blockers when viewing or accepting terms."}],"rec":"A","recWhy":"Give Sara an early checklist with steps she can complete. Airtasker and ShiftKey document readiness requirements before payout or bidding, supporting earlier warning rather than a surprise at acceptance.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/42073609183641-Having-problems-verifying-my-account-what-should-I-do"}],"current":"Today Sara has no early payment-readiness checklist. Managers can see readiness in membership details, while missing ABN or entity details or settlement requirements can surface to workers when viewing or accepting offer terms on either app."},{"id":"LA-L01","q":"Sara, an unverified locum, taps Apply on Tom's public shift and sees 'Verify your profile' with no button to the missing step. Later, verified, she taps Confirm on Tom's offer and is told payment details are missing, again with no link. Fix before launch?","context":"Each dead-end message sends Sara hunting for the right page, and Tom may lose her.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Each message names the missing step and opens it in one tap."},{"key":"B","label":"Soon after launch","detail":"Launch with plain messages; add the links within the first month."},{"key":"C","label":"Not needed","detail":"Sara keeps finding the missing step herself."}],"rec":"A","recWhy":"A small change to existing messages. Apply and Confirm are where Sara decides whether to carry on, so a dead end there loses workers Tom needs.","sources":[],"current":"Today on web, the Apply block and the Confirm block are plain error messages. Neither names the missing step or links to it; Sara must find verification or payment details in her profile herself."},{"id":"LA-L02","q":"Tom adds Tom's Pharmacy in the seven-step wizard. He leaves the ABN empty on step 2 and clicks Next through to step 7. Only when he presses Create does 'ABN must be 11 digits' appear, with no jump back to step 2. Fix before launch?","context":"Tom may abandon setup if he cannot see where the problem is.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Next checks each step and points Tom at the empty field."},{"key":"B","label":"Soon after launch","detail":"Launch as is; add step checks within the first month."},{"key":"C","label":"Not needed","detail":"Tom keeps hunting for the problem step himself."}],"rec":"A","recWhy":"The jump back already exists for the ABN check button, so the fix reuses it. A stuck first setup is where a new pharmacy is most likely to leave.","sources":[],"current":"Today Next never checks a step. Saving shows 'ABN must be 11 digits' and stays on the last step. Only the separate ABN check button jumps Tom back to the step that needs fixing."}]},{"id":"LA-S2","name":"Shift and billing fixes","why":"Money and schedule correctness.","questions":[{"id":"LA-S01","q":"Tom owns Tom's Pharmacy in Parramatta. He accepts verified external locum Sara for a shift, but has no payment deadline or protection against deleting booked work. Should the missing shift protections from draft PR #182 be brought onto the launch branch?","context":"PR #182 contains payment deadlines, unpaid release, deletion protection, roster separation and group visibility needed for the chosen booking rules.","current":"Today Tom lacks these protections on PR #198. Draft PR #182 contains them, but it starts from an older main and needs reconciling before its code can be used.","gap":"","type":"decision","options":[{"key":"A","label":"Tom gets the protections by porting PR #182","detail":"Reconcile the older code with PR #198 and test it again before launch."},{"key":"B","label":"Tom gets newly rebuilt protections","detail":"Use PR #182 as the specification and write the needed parts afresh."},{"key":"C","label":"Tom launches without these protections","detail":"There are no payment deadlines or protection against deleting booked work."}],"rec":"A","recWhy":"Bring the existing work onto the launch branch and test it again. The agreed booking and cancellation rules depend on it; rebuilding would repeat work already done.","sources":[]},{"id":"LA-S02","q":"Tom owns Tom's Pharmacy in Parramatta. He deletes a shift already booked or paid for with verified external locum Sara. The shift disappears and nobody is told. Fix before launch?","context":"Deleting booked work can destroy the record of commitments, payments and history.","current":"Today Tom can delete a shift with bookings or payments without notifying anyone. The deletion protection exists in draft PR #182 but is absent from PR #198.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Stop Tom deleting booked or paid work before launch."},{"key":"B","label":"Soon after launch","detail":"Leave deletion possible until the next release."},{"key":"C","label":"Not needed","detail":"Keep allowing Tom to delete booked or paid shifts without notice."}],"rec":"A","recWhy":"Protect booked and paid shifts before launch so Tom cannot erase work and payment records without the proper cancellation process.","sources":[]},{"id":"LA-S03","q":"Tom owns Tom's Pharmacy in Parramatta. He edits a marketplace shift already booked by verified external locum Sara. Replacing the shift's work times deletes her booking and other applications. Fix before launch?","context":"Sara must not silently lose confirmed work because Tom edits shift details.","current":"Today Tom's edit to an engaged marketplace shift replaces its work-time entries and deletes applications and bookings attached to them. Only roster entries are locked against this replacement.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Keep Sara's booking and applications safe when Tom edits."},{"key":"B","label":"Soon after launch","detail":"Allow bookings to disappear until the next release."},{"key":"C","label":"Not needed","detail":"Keep edits that delete attached applications and bookings."}],"rec":"A","recWhy":"Protect applications and bookings when Tom edits marketplace shifts. Confirmed workers should not silently lose their commitments.","sources":[]},{"id":"LA-S04","q":"Tom owns Tom's Pharmacy in Parramatta. He pays an old penalty for a shift while verified external locum Sara's offer is waiting for booking payment. That penalty payment confirms her offer. Fix before launch?","context":"Money paid for a penalty must not be mistaken for the fee that confirms a worker's booking.","current":"Today any successful Stripe payment for Tom's shift can confirm offers waiting for payment, including Sara's, even when the payment came from a penalty checkout.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Confirm Sara only when the correct booking payment succeeds."},{"key":"B","label":"Soon after launch","detail":"Keep the payment mix-up until the next release."},{"key":"C","label":"Not needed","detail":"Let penalty payments continue confirming waiting offers."}],"rec":"A","recWhy":"Check what each payment is for before confirming offers. Paying a penalty must not book Sara.","sources":[]},{"id":"LA-S05","q":"Omar is Tom's verified employed pharmacist and a staff member, paid through payroll. An internal roster shift is automatically shown to a wider audience instead of staying internal. Fix before launch?","context":"Internal roster work is reserved for employed staff and must not appear in the external marketplace automatically.","current":"Today automatic widening does not exclude internal roster shifts such as Omar's. Draft PR #182 contains the roster separation protection; PR #198 does not.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Keep Omar's internal roster shifts out of automatic marketplace release."},{"key":"B","label":"Soon after launch","detail":"Allow internal shifts to widen until the next release."},{"key":"C","label":"Not needed","detail":"Keep automatically widening roster shifts."}],"rec":"A","recWhy":"Exclude internal roster shifts from automatic wider release. The agreed roster policy reserves them for employed staff.","sources":[]},{"id":"LA-P01","q":"Sara is an external locum pharmacist with an ABN and no pharmacy membership. An AHPRA restriction makes her ineligible while Tom's payment is pending. Her offer is declined, but the shift still says it awaits payment. Fix before launch?","context":"Tom should not be left with a payment status that no longer matches any payable offer.","current":"Today Sara's AHPRA cancellation declines her awaiting-payment offer without resetting Tom's shift payment flag or preventing simultaneous changes to the same shift. Timed reservation expiry and release exist in draft PR #182 but are absent from PR #198.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Clear or recalculate Tom's payment status safely when Sara's offer ends."},{"key":"B","label":"Soon after launch","detail":"Leave the stale payment status until the next release."},{"key":"C","label":"Not needed","detail":"Keep the shift awaiting payment after Sara's offer is declined."}],"rec":"A","recWhy":"Update payment status together with the AHPRA cancellation, protected against simultaneous changes. Otherwise Tom's shift can remain awaiting payment after every payable offer has gone.","sources":[]},{"id":"LA-P02","q":"Sara is an external locum pharmacist with an ABN and no pharmacy membership. An AHPRA restriction cancels her future work for Tom. He gets notices, but general cancellation fees and refunds have no process. Fix before launch?","context":"Existing notices need to be retained while payment outcomes and cancellation rules are made consistent.","current":"Today Sara's AHPRA cancellation already sends managers in-app and email notices. There is no general cancellation fee or refund process. A fee preview exists in draft PR #182 but is absent from PR #198.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Keep notices and make cancellation, payment outcomes and required notices consistent."},{"key":"B","label":"Soon after launch","detail":"Leave fees and refunds unresolved until the next release."},{"key":"C","label":"Not needed","detail":"Keep existing notices without a general fee or refund process."}],"rec":"A","recWhy":"Keep AHPRA notices and define cancellation fee and refund handling. A fee preview alone cannot enforce a cancellation policy or refund Tom.","sources":[]},{"id":"LA-P03","q":"Nadia is a pharmacist at another of Tom's pharmacies, not a member of his Parramatta pharmacy. Her AHPRA check is not verified. Bookings through Tom's other pharmacies or his banner group skip the public AHPRA check. Fix before launch?","context":"A pharmacist's access to a private group should not bypass the chosen registration requirements for outside bookings.","current":"Today Nadia can find shift boards for Tom's other pharmacies and his banner group on PR #198. Bookings there skip the AHPRA check that applies to public marketplace shifts.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Apply the chosen AHPRA eligibility rules to outside group bookings."},{"key":"B","label":"Soon after launch","detail":"Keep the gap until the next release."},{"key":"C","label":"Not needed","detail":"Keep bookings through Tom's other pharmacies and his banner group outside the public AHPRA check."}],"rec":"A","recWhy":"Define and enforce AHPRA eligibility for all outside bookings. Otherwise workers can book through Tom's other pharmacies or his banner group without passing the public registration check.","sources":[]},{"id":"LA-Q06","q":"Tom owns Tom's Pharmacy in Parramatta. The old 10%/20% penalty checkout remains available to signed-in users, without protection for internal roster shifts, although neither app has a button for it. Fix before launch?","context":"An unused screen action can still leave an outdated charging process available.","gap":"SH-02","type":"code","options":[{"key":"A","label":"Before launch","detail":"Disable the old penalty checkout before Tom can use it."},{"key":"B","label":"Soon after launch","detail":"Leave it callable until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep the old checkout available without internal-roster protection."}],"rec":"A","recWhy":"Disable the old checkout before launch. Do not replace it with cancellation charges until Australian legal advice covers classification, proportionality, disclosure and unfair contract terms.","sources":[{"name":"ACCC contract terms","url":"https://www.accc.gov.au/consumers/buying-products-and-services/contracts"},{"name":"ACCC unfair terms penalties","url":"https://www.accc.gov.au/media-release/businesses-urged-to-remove-unfair-contract-terms-ahead-of-law-changes"}],"current":"Today Tom has no screen calling the old 10%/20% penalty checkout, but signed-in users can still call it and shared app code still exposes it. The internal-roster penalty protection exists in draft PR #182, not PR #198."},{"id":"LA-Q07","q":"Tom owns Tom's Pharmacy in Parramatta. He subscribes for discounted booking fees but checkout still charges $30/$80 instead of $15/$40. Test and live prices also cannot be set independently. Fix before launch?","context":"Tom should receive the discount he subscribed for, with test and live prices kept independently configurable.","gap":"SH-03","type":"code","options":[{"key":"A","label":"Before launch","detail":"Charge Tom the subscriber price and configure test and live prices separately."},{"key":"B","label":"Soon after launch","detail":"Keep charging standard prices until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep the unused discount and fixed price identifiers."}],"rec":"A","recWhy":"Apply the subscriber discount and make prices independently configurable before taking live payments. Competitor prices do not justify charging Tom more than the advertised subscription rate.","sources":[],"current":"Today checkout recognises Tom's subscriber status but ignores it, always choosing standard locum or permanent Stripe prices. Those price identifiers are fixed in the code, and web and mobile use the same checkout service."},{"id":"LA-R01","q":"Tom owns Tom's Pharmacy in Parramatta. He pays a platform booking fee for verified external locum Sara, but checkout does not explain GST or issue a platform tax invoice. Fix before launch?","context":"Tom needs to understand the total price and receive the correct tax record.","gap":"SH-15","type":"code","options":[{"key":"A","label":"Before launch","detail":"Confirm tax treatment, show Tom the total and issue the required record."},{"key":"B","label":"Soon after launch","detail":"Take Tom's payments while GST treatment remains unclear."},{"key":"C","label":"Not needed","detail":"Leave Tom with Stripe receipts as the only record."}],"rec":"A","recWhy":"Get Australian tax advice, configure GST correctly, show the total before Tom pays, and issue the required invoice or receipt from the correct supplier.","sources":[{"name":"ATO GST registration","url":"https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/registering-for-gst"},{"name":"ACCC price displays","url":"https://www.accc.gov.au/business/pricing/price-displays"}],"current":"Today Tom's checkout selects fixed Stripe prices and saves the amount. The reviewed process has no explicit GST treatment or way to create a platform tax invoice."},{"id":"LA-Q08","q":"Tom owns Tom's Pharmacy in Parramatta. His shift should move from favourite locums to a wider audience at a set time. Nobody browses, so the move waits. Fix before launch?","context":"Tom's release times should work even when nobody opens the app.","gap":"SH-05","type":"code","options":[{"key":"A","label":"Before launch","detail":"Release Tom's shift at the scheduled time without waiting for browsing."},{"key":"B","label":"Soon after launch","detail":"Keep browsing-triggered release until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep waiting for someone to browse before widening Tom's shift."}],"rec":"A","recWhy":"Run wider shift release independently of browsing. CareRev's cascading and Locumate's scheduled release support predictable timing rather than waiting for someone to open a page.","sources":[{"name":"CareRev","url":"https://www.carerev.com/solutions/carerev-irp"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"Today Tom's shift widens only when someone requests a shift list or details, on web or mobile. There is no scheduled shift job; existing scheduled widening jobs cover goods marketplaces instead."},{"id":"LA-Q09","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. Tom offers her an urgent shift. The shift starts, but her offer still has time left to accept because its deadline is 48 hours away. Fix before launch?","context":"Sara should not be able to accept an urgent offer after its work has already started.","gap":"SH-07","type":"code","options":[{"key":"A","label":"Before launch","detail":"Make Sara's offer expire no later than shift start."},{"key":"B","label":"Soon after launch","detail":"Keep the late deadline until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep the 48-hour deadline even after the shift starts."}],"rec":"A","recWhy":"Cap Sara's response deadline at shift start. Qwick distinguishes offers from confirmed places; the research does not establish one universal response duration.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"}],"current":"Today Sara's pending offer expires after a fixed 48 hours, even if Tom's shift starts sooner. Either app marks expired offers when listing them; acceptance checks the same deadline, so pending offers can remain after the start."},{"id":"LA-Q10","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She accepts Tom's booking terms, but the saved agreement leaves out cancellation rates, the platform terms version and Tom's policy acceptance. Fix before launch?","context":"Both sides need evidence of the terms they accepted, and cancellation charges still need Australian legal review.","gap":"SH-09","type":"code","options":[{"key":"A","label":"Before launch","detail":"Save both parties' acceptance, cancellation rates and terms version."},{"key":"B","label":"Soon after launch","detail":"Keep incomplete agreements until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep saving Sara's acceptance without the missing policy details."}],"rec":"A","recWhy":"Record versioned acceptance by both sides before agreement and obtain Australian legal review. Clear disclosure alone does not make a one-sided or disproportionate term fair.","sources":[{"name":"ACCC contract terms","url":"https://www.accc.gov.au/consumers/buying-products-and-services/contracts"},{"name":"ACCC unfair terms penalties","url":"https://www.accc.gov.au/media-release/businesses-urged-to-remove-unfair-contract-terms-ahead-of-law-changes"}],"current":"Today Sara's saved agreement includes a record format version and her acceptance, but not the cancellation table, platform terms version or Tom's policy acceptance. Both apps use the same saved agreement."},{"id":"LA-R02","q":"Tom owns Tom's Pharmacy in Parramatta. He wants cancellation charges enforced when verified external locum Sara misses work, but the proposed charges have not had Australian legal review. May charging launch?","context":"Publishing percentages does not establish that cancellation charges are lawful, proportionate or fair.","gap":"SH-16","type":"decision","options":[{"key":"A","label":"Tom waits for legal review before charges launch","detail":"Review every cancellation charge and remedy before enforcing them."},{"key":"B","label":"Tom can charge once the table is disclosed","detail":"Launch charging after showing the percentages, without waiting for legal review."},{"key":"C","label":"Tom never uses cancellation charges","detail":"Use only non-money reliability controls."}],"rec":"A","recWhy":"Require legal review before enforcement. Since November 2023, proposing, using or relying on unfair standard-form terms can attract major penalties; clear wording alone does not cure unfairness.","sources":[{"name":"ACCC contract terms","url":"https://www.accc.gov.au/consumers/buying-products-and-services/contracts"},{"name":"ACCC unfair terms penalties","url":"https://www.accc.gov.au/media-release/businesses-urged-to-remove-unfair-contract-terms-ahead-of-law-changes"}],"current":"Today Tom's approved cancellation charge table is not implemented. A separate old 10% or 20% checkout remains callable, with no evidence of Australian legal review."},{"id":"LA-Q11","q":"Tom owns Tom's Pharmacy in Parramatta. He switches off staff cover publishing, but request handling ignores the setting. Web and mobile show the switch, whose help wrongly promises a new shift. Fix before launch?","context":"The pharmacy's cover permission should work and accurately explain what staff can do.","gap":"SH-11","type":"code","options":[{"key":"A","label":"Before launch","detail":"Make Tom's setting control cover requests and explain it correctly."},{"key":"B","label":"Soon after launch","detail":"Keep ignoring the setting until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep both switches with ignored settings and misleading help."}],"rec":"A","recWhy":"Keep both app controls, correct the wording and enforce the permission for each pharmacy. Restricting edits to owners and organisation-wide admins does not make the ignored switch govern cover requests.","sources":[],"current":"Today Tom or Lina, his banner group's organisation-wide admin, can edit the staff-request switch on web and mobile. Request handling ignores it, and the help still promises a new shift instead of controlling cover for an existing shift."},{"id":"LA-L03","q":"Tom opens Post a shift and clicks Next through all six steps without choosing a pharmacy or role. On Review he presses Post and gets 'Choose a pharmacy, role and type of work', with no jump back to step 1. Fix before launch?","context":"Tom fills in five steps before learning the first one was incomplete.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Next on step 1 stops Tom and marks the missing choice."},{"key":"B","label":"Soon after launch","detail":"Launch as is; add the step check within the first month."},{"key":"C","label":"Not needed","detail":"Tom keeps finding the missing choice from the final message."}],"rec":"A","recWhy":"The wizard already blocks Next when no dates are added, so the same check fits step 1 and saves Tom re-entering a shift.","sources":[],"current":"Today Next only checks that dates were added. Pharmacy, role and type of work are checked when Tom presses Post on the last step, in a short pop-up that does not show which step or field."},{"id":"LA-L05","q":"Sara's confirmed locum shift appears on Tom's internal roster as if she were staff. Tom cannot publish that week: Sara 'requires an active accepted membership'. Moving her shift shows a raw code error, and Delete does nothing visible. Fix before launch?","context":"Omar, Ali and Mia never get that week's roster while one locum booking blocks it.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Sara's booking shows read-only on the roster and never blocks publishing."},{"key":"B","label":"Soon after launch","detail":"Tom works around blocked roster weeks until a release within the first month."},{"key":"C","label":"Not needed","detail":"Weeks with a locum booking stay unpublishable."}],"rec":"A","recWhy":"The roster code already says marketplace bookings should only occupy their slot, not count as staff shifts. Today one booking stops the whole team getting its roster.","sources":[],"current":"Today every accepted offer, including Sara's locum booking, is saved as a roster shift. Roster checks then treat Sara as staff: publishing is blocked, Move shows a raw error, and Delete is refused with no visible message."},{"id":"LA-L06","q":"Tom invited Omar, who has not accepted yet. In roster Add shift, Omar still appears in the staff list. Tom picks him, saves, and gets 'Failed to create shift: Only direct full-time, part-time or casual pharmacy staff…'. Fix before launch?","context":"Tom cannot tell Omar's invite is still pending, so the error looks like a broken app.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Only accepted staff are listed; pending invites are marked as waiting."},{"key":"B","label":"Soon after launch","detail":"Tom keeps hitting the failure until a release within the first month."},{"key":"C","label":"Not needed","detail":"Pending invites stay listed and fail on save."}],"rec":"A","recWhy":"A small filter on the existing list. Saving already refuses pending staff, so the list should match it and tell Tom why Omar is missing.","sources":[],"current":"Today the roster staff list includes every active membership, even invites not yet accepted. Saving then fails with a technical message about direct staff. Testers hit this with a pending casual pharmacist."},{"id":"LA-L07","q":"Tom taps 'View shift' on his dashboard for Sara's confirmed Saturday shift. Instead of the booking he sees 'Active shifts did not load. We could not load your active shifts.' Fix before launch?","context":"Tom thinks the app is broken or the booking is lost, just when he wants to check it.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"Confirmed shifts open their booking details from the dashboard."},{"key":"B","label":"Soon after launch","detail":"Tom uses the Confirmed board until a release within the first month."},{"key":"C","label":"Not needed","detail":"Confirmed shifts keep opening an error page."}],"rec":"A","recWhy":"The dashboard link is a main way Tom reaches a booking. Opening confirmed shifts on the Confirmed board or a details view is a small routing fix.","sources":[],"current":"Today the dashboard lists all upcoming shifts, but 'View shift' opens the active-shift page, which only loads unfilled shifts. For a confirmed shift, testers got the 'Active shifts did not load' error."}]},{"id":"LA-S3","name":"Talent board fixes","why":"Privacy leaks and scale.","questions":[{"id":"LA-Q12","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She posts anonymously on the talent board. Tom or any other signed-in user can still receive her name and user ID. Fix before launch?","context":"Sara's anonymous post should not become identifiable simply because a reader signs in.","gap":"TB-01","type":"code","options":[{"key":"A","label":"Before launch","detail":"Mask Sara's identity and require consent before revealing it."},{"key":"B","label":"Soon after launch","detail":"Keep exposing Sara's identity until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep showing anonymous authors' names to signed-in users."}],"rec":"A","recWhy":"Mask identities before sending them to either app and reveal only with consent. Mable restricts full-name discovery and profile contact information, supporting this privacy fix before launch.","sources":[{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"Today Sara's anonymous post exposes her name and user ID in signed-in feed, list and detail reads. Only public reads mask her identity; both apps use the revealing signed-in service."},{"id":"LA-Q13","q":"Sara is an external locum pharmacist with an ABN and no pharmacy membership. Her talent post is hidden or outdated, or her verification or AHPRA eligibility lapses. Tom can still retrieve it. Fix before launch?","context":"Tom should not discover hidden posts or rely on candidates whose eligibility has changed.","gap":"TB-03","type":"code","options":[{"key":"A","label":"Before launch","detail":"Apply hiding and current eligibility checks wherever Tom reads posts."},{"key":"B","label":"Soon after launch","detail":"Keep inconsistent access until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep hidden or ineligible posts available through other views."}],"rec":"A","recWhy":"Apply hiding and current eligibility checks everywhere before launch. Nursa removes ineligible clinicians from visibility; Sara's old card should not remain accessible through another view.","sources":[{"name":"Nursa","url":"https://nursa.com/facility/capabilities/background-checks"}],"current":"Today feeds hide Sara's moderated or past-dated posts, but list and detail reads bypass hiding. Revoked Verified status or lapsed AHPRA does not hide posts; cards show saved register status. Posts from paused workers also stay listed."},{"id":"LA-Q14","q":"Tom owns Tom's Pharmacy in Parramatta. He searches for a locum, but his app downloads every talent post before filtering. The service also checks every post before splitting results into pages. Fix before launch?","context":"Tom's search can become slow as the talent board grows.","gap":"TB-04","type":"code","options":[{"key":"A","label":"Before launch","detail":"Filter before downloading so Tom receives only relevant results."},{"key":"B","label":"Soon after launch","detail":"Monitor a small board and improve filtering within the first month."},{"key":"C","label":"Not needed","detail":"Keep downloading all posts and filtering in Tom's app."}],"rec":"B","recWhy":"Soon after launch is reasonable only for a deliberately small, monitored board; launch volume has not been measured. Relief Buddy and Upwork offer structured search. Set a measured trigger for replacing full-feed downloads.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-find-a-shift"}],"current":"Today Tom's web or mobile app downloads every feed page through shared app code, then filters locally. The service checks each post's visibility before splitting results into pages. It cannot filter by distance from Tom's pharmacy or by rate before sending results."},{"id":"LA-Q15","q":"Grace is a region admin for the banner group including Tom's Pharmacy. She tries to request a booking from a talent card. Mobile and web use different rules for who may do this. Fix before launch?","context":"Hiring permissions should be consistent whichever app Grace uses.","gap":"TB-07","type":"code","options":[{"key":"A","label":"Before launch","detail":"Enforce one hiring policy and give Grace consistent controls."},{"key":"B","label":"Soon after launch","detail":"Keep different app rules until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep web and mobile booking controls inconsistent."}],"rec":"A","recWhy":"Choose one hiring-role policy, enforce it in the shared service and mirror it in both apps. Track the wrong route, duplicate data loading and inflated view counts as separate cleanup.","sources":[],"current":"Today mobile lets every non-worker role request bookings, while web limits roles and admin status. Grace encounters these different rules; the shared service must enforce the final permission policy regardless of either app's controls."},{"id":"LA-L04","q":"Tom uses a screen reader on the talent board. He reaches the heart button on Sara's card, but it has no name, so it is read out only as 'button'. Fix before launch?","context":"Unnamed buttons fail basic accessibility checks and confuse new owners.","gap":"","type":"code","options":[{"key":"A","label":"Before launch","detail":"The heart gets a name and a tooltip."},{"key":"B","label":"Soon after launch","detail":"Launch as is; add the label within the first month."},{"key":"C","label":"Not needed","detail":"The heart stays unnamed."}],"rec":"A","recWhy":"A one-line label. It also helps sighted owners until TB-Q08 decides what the heart should do.","sources":[],"current":"Today on web, the heart on each talent card is an icon with no label or tooltip. Testers could not tell whether it saves, likes or favourites Sara."}]},{"id":"LA-S4","name":"Availability fixes","why":"Matching that reaches the right, verified people.","questions":[{"id":"LA-Q16","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She copies her calendar into a talent post, then removes Saturday from her calendar. Tom still sees Saturday on the post. Fix before launch?","context":"Tom can approach Sara for a date she has already removed from her live availability.","gap":"AV-01","type":"code","options":[{"key":"A","label":"Before launch","detail":"Keep Sara's advertised dates current or clearly remove the copied calendar."},{"key":"B","label":"Soon after launch","detail":"Keep stale copies until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep talent-post dates independent of later calendar changes."}],"rec":"A","recWhy":"Update the copied dates or clearly remove the separate copy before launch. A post silently advertising availability Sara removed is misleading.","sources":[],"current":"Today Sara has two menu items, Set Availability and Publish Availability. Either app copies her calendar into the talent-post form once; later calendar changes do not update it. Testers saved weekly slots, yet Tom's view of her card still said 'No dates shared yet'."},{"id":"LA-Q17","q":"Sara is an unverified external locum pharmacist with an ABN and no pharmacy membership. She can get match emails for Tom's new public shifts, but not shifts widened to public later. Fix before launch?","context":"Matching messages should reach eligible workers whenever a shift becomes public.","gap":"AV-04","type":"code","options":[{"key":"A","label":"Before launch","detail":"Notify eligible workers on public release and exclude unverified Sara."},{"key":"B","label":"Soon after launch","detail":"Keep missed releases and unverified recipients until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep alerts only for new public posts without verification filtering."}],"rec":"A","recWhy":"Send messages when shifts become public and exclude unverified recipients. Instawork widens outreach in stages; credential checks support alerting eligible workers rather than people unable to act.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/2062210-selecting-pros-for-your-shift"}],"current":"Today Sara can receive availability-match messages when Tom posts directly to public, but not when a shift later becomes public. Both apps use recipients checked for active account, role, travel and availability, without checking Verified status."},{"id":"LA-Q18","q":"Sara is a verified external locum pharmacist with an ABN and no pharmacy membership. She sends availability directly to the service, bypassing app checks. Reversed times, invalid weekdays, incomplete repeats, past dates and duplicates are not properly rejected. Fix before launch?","context":"Invalid availability can produce misleading matches even when the app forms perform some checks.","gap":"AV-05","type":"code","options":[{"key":"A","label":"Before launch","detail":"Reject Sara's invalid availability in the shared service."},{"key":"B","label":"Soon after launch","detail":"Keep accepting malformed direct submissions until a release within the first month."},{"key":"C","label":"Not needed","detail":"Keep relying on checks in the app forms alone."}],"rec":"A","recWhy":"Validate availability in the service before launch. App checks already exist, but direct submissions bypass them; this fixes correctness rather than creating a new owner policy.","sources":[],"current":"Today both apps check Sara's time order and repeat fields. Direct submissions bypass those checks: the service lacks checks for time order, weekdays from 0 to 6, repeat requirements, past dates and duplicates."}]}]}]}</script>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'launch-grill-v1';
  const rt = window.claude && window.claude.use ? window.claude : null;
  const content = document.getElementById('content');
  const nav = document.getElementById('area-nav');
  const byId = id => document.getElementById(id);
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
  let data;
  try {
    data = JSON.parse(byId('grill-data').textContent);
    if (!data || !Array.isArray(data.areas) || !Array.isArray(data.carried)) throw new Error('Expected areas and carried lists.');
  } catch (error) {
    content.innerHTML = '<div class="fatal" role="alert">The questionnaire could not load. Check the embedded JSON data.</div>';
    byId('save-status').textContent = 'Not saved: questionnaire data unavailable';
    byId('save-status').classList.add('error');
    return;
  }

  const questions = [];
  const questionMap = new Map();
  data.areas.forEach((area, areaIndex) => {
    area.steps.forEach((step, stepIndex) => {
      step.questions.forEach(q => {
        const entry = { q, area, step, areaIndex, stepIndex };
        questions.push(entry);
        questionMap.set(q.id, entry);
      });
    });
  });
  const blank = () => ({ choice: null, other: '', note: '', status: '', updatedAt: '' });
  let answers = Object.create(null);
  let position = { area: data.areas[0]?.id || 'review', step: 0 };
  let serverDb = null;
  let ready = false;
  let readOnly = false;
  let localError = '';
  let loadError = '';
  let savedAt = '';
  const jobs = new Map();
  const errors = new Map();
  const localOnly = new Set();

  // Ties retain the current version, so a late snapshot cannot undo an edit.
  function mergeAnswers(current, incoming) {
    const merged = Object.assign(Object.create(null), current);
    for (const [id, answer] of Object.entries(incoming)) {
      const previous = merged[id];
      if (!previous || Date.parse(answer.updatedAt) > Date.parse(previous.updatedAt)) merged[id] = { ...answer };
    }
    return merged;
  }

  function validateAnswer(id, value) {
    const entry = questionMap.get(id);
    if (!entry) throw new Error('Unknown question: ' + id);
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Invalid answer: ' + id);
    if (!(value.choice === null || value.choice === 'OTHER' || entry.q.options.some(o => o.key === value.choice))) throw new Error('Invalid choice: ' + id);
    if (typeof value.other !== 'string' || typeof value.note !== 'string') throw new Error('Invalid text fields: ' + id);
    if (!['', 'answered', 'later', 'skip'].includes(value.status)) throw new Error('Invalid status: ' + id);
    if (typeof value.updatedAt !== 'string' || !/^\d{4}-\d{2}-\d{2}T/.test(value.updatedAt) || !Number.isFinite(Date.parse(value.updatedAt))) throw new Error('Invalid updatedAt: ' + id);
    return { choice: value.choice, other: value.other, note: value.note, status: value.status, updatedAt: value.updatedAt };
  }

  function validateAnswers(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Expected an answers object.');
    const valid = Object.create(null);
    for (const [id, answer] of Object.entries(value)) valid[id] = validateAnswer(id, answer);
    return valid;
  }

  function readLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const stored = JSON.parse(raw);
      answers = validateAnswers(stored.answers);
      if (stored.position && typeof stored.position.area === 'string' && Number.isInteger(stored.position.step)) position = stored.position;
      Object.keys(answers).forEach(id => localOnly.add(id));
    } catch (error) {
      localError = error.name === 'SecurityError' ? 'device storage blocked' : 'saved device data unavailable';
    }
  }

  function mirrorLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers, position }));
      localError = '';
    } catch (error) {
      localError = error.name === 'QuotaExceededError' ? 'device storage full' : 'device storage blocked';
    }
    updateSaveStatus();
  }

  function updateSaveStatus() {
    const pill = byId('save-status');
    const problem = readOnly ? 'read-only' : localError || errors.values().next().value || loadError;
    const pending = [...jobs.values()].some(job => job.timer !== null || job.inFlight || job.due);
    let label;
    if (problem) label = 'Not saved: ' + problem;
    else if (pending && (!ready || serverDb)) label = 'Saving...';
    else if (!serverDb || localOnly.size) label = 'Saved on this device only';
    else label = 'Saved ' + new Date(savedAt || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    if (pill.textContent !== label) pill.textContent = label;
    pill.classList.toggle('error', Boolean(problem));
    pill.title = problem ? 'Your edits remain in this session. Device storage and server saves are handled separately.' : 'Device storage is mirrored on every edit. Server saves are used when available.';
    byId('retry-save').hidden = readOnly || !(errors.size || localError);
  }

  function queueSave(id) {
    localOnly.add(id);
    if (readOnly || (ready && !serverDb)) { updateSaveStatus(); return; }
    let job = jobs.get(id);
    if (!job) {
      job = { latest: null, timer: null, due: false, inFlight: false };
      jobs.set(id, job);
    }
    job.latest = { ...answers[id] };
    job.due = false;
    clearTimeout(job.timer);
    job.timer = setTimeout(() => {
      job.timer = null;
      job.due = true;
      flushSave(id);
    }, 800);
    updateSaveStatus();
  }

  async function flushSave(id) {
    const job = jobs.get(id);
    if (!job || !ready || !serverDb || readOnly || job.inFlight || !job.due) return;
    const payload = { ...job.latest };
    job.due = false;
    job.inFlight = true;
    updateSaveStatus();
    let success = false;
    try {
      for (let attempt = 0; ; attempt++) {
        if (readOnly) return;
        try {
          await serverDb.doc('answers/' + id).set(payload);
          success = true;
          break;
        } catch (error) {
          if (error.code === 'invalid_argument') {
            readOnly = true;
            for (const queued of jobs.values()) { clearTimeout(queued.timer); queued.timer = null; queued.due = false; }
            throw error;
          }
          if (error.code === 'unavailable' && attempt === 0) {
            await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 1000));
            continue;
          }
          throw error;
        }
      }
      errors.delete(id);
      savedAt = new Date().toISOString();
      if (answers[id]?.updatedAt === payload.updatedAt) localOnly.delete(id);
    } catch (error) {
      errors.set(id, error.code === 'invalid_argument' ? 'read-only' : String(error.code || 'server save failed'));
    } finally {
      job.inFlight = false;
      if (success && job.latest.updatedAt === payload.updatedAt) {
        clearTimeout(job.timer);
        jobs.delete(id);
      }
      updateSaveStatus();
      // A newer edit waits for its own debounce and never overlaps this write.
      if (jobs.has(id) && job.due && !readOnly) flushSave(id);
    }
  }

  function editAnswer(id, patch) {
    const previous = answers[id] || blank();
    const timestamp = Math.max(Date.now(), (Date.parse(previous.updatedAt) || 0) + 1);
    answers[id] = { ...previous, ...patch, updatedAt: new Date(timestamp).toISOString() };
    mirrorLocal();
    queueSave(id);
    refreshMetrics();
    syncQuestion(id);
  }

  function isAnswered(q) {
    const answer = answers[q.id];
    return Boolean(answer && answer.status === 'answered' && answer.choice && (answer.choice !== 'OTHER' || answer.other.trim()));
  }

  function answerLabel(q) {
    const answer = answers[q.id];
    if (!answer?.choice) return 'No choice yet';
    if (answer.choice === 'OTHER') return answer.other.trim() ? 'Other: ' + answer.other.trim() : 'Other — add your answer';
    const option = q.options.find(o => o.key === answer.choice);
    if (option?.key === 'KEEP') return option.label;
    return option ? option.key + ': ' + option.label : 'No choice yet';
  }

  function statusLabel(q) {
    const answer = answers[q.id];
    if (answer?.status === 'later') return 'Ask me later';
    if (answer?.status === 'skip') return 'Skipped';
    if (isAnswered(q)) return 'Answered';
    return q.required === false ? 'Optional · unanswered' : 'Required · unanswered';
  }

  function safeURL(value) {
    try {
      const url = new URL(value);
      return ['https:', 'http:'].includes(url.protocol) ? url.href : null;
    } catch (_) { return null; }
  }

  function questionHTML(q) {
    const e = escapeHTML;
    const answer = answers[q.id] || blank();
    const id = e(q.id);
    const options = [...q.options.filter(o => o.key === 'KEEP'), ...q.options.filter(o => o.key !== 'KEEP'), { key: 'OTHER', label: 'Other (describe)', detail: 'None of these fit: describe what you want.' }];
    const sources = (q.sources || []).map(source => {
      const url = safeURL(source.url);
      return url ? `<a href="${e(url)}" target="_blank" rel="noopener">${e(source.name)}</a>` : `<span>${e(source.name)}</span>`;
    }).join('');
    const canRecommend = q.options.some(o => o.key === q.rec);
    return `<section class="question" id="card-${id}" aria-labelledby="heading-${id}">
      <div class="chips"><span class="chip id">${id}</span><span class="chip">Gap ${e(q.gap)}</span><span class="chip">${e(q.type)}</span><span class="required-flag" id="flag-${id}" ${isAnswered(q) ? 'hidden' : ''}>${e(statusLabel(q))}</span></div>
      <h3 id="heading-${id}" tabindex="-1">${e(q.q)}</h3>
      <p class="context" id="context-${id}">${e(q.context)}</p>
      <div class="current" id="current-${id}" hidden><span class="current-label">What happens today</span><p class="current-text"></p></div>
      <fieldset aria-describedby="context-${id}"><legend class="sr-only">Choose an answer for ${id}</legend><div class="options">
        ${options.map(option => `<label class="option ${answer.choice === option.key ? 'selected' : ''}" for="choice-${id}-${e(option.key)}"><input type="radio" id="choice-${id}-${e(option.key)}" name="choice-${id}" value="${e(option.key)}" data-question="${id}" data-field="choice" ${answer.choice === option.key ? 'checked' : ''}><span class="option-copy"><span class="option-title">${option.key !== 'OTHER' ? `<span class="option-key">${e(option.key)}</span>` : ''}${e(option.label)}</span><span class="option-detail">${e(option.detail)}</span></span></label>`).join('')}
      </div></fieldset>
      <div class="field" id="other-wrap-${id}" ${answer.choice !== 'OTHER' ? 'hidden' : ''}><label for="other-${id}">Describe your answer</label><textarea id="other-${id}" data-question="${id}" data-field="other" aria-describedby="other-help-${id}" ${answer.choice === 'OTHER' ? 'aria-required="true"' : ''}>${e(answer.other)}</textarea><p class="helper" id="other-help-${id}">Add your answer to complete this question.</p></div>
      <div class="field"><label for="note-${id}">Your note / explanation</label><textarea id="note-${id}" data-question="${id}" data-field="note" placeholder="Optional: what should we know?">${e(answer.note)}</textarea></div>
      <div class="recommendation"><strong>Recommended: ${e(q.rec || 'No recommendation')}</strong><p>${e(q.recWhy)}</p>${sources ? `<div class="source-links" aria-label="Recommendation sources">${sources}</div>` : ''}<button type="button" data-action="recommend" data-id="${id}" ${canRecommend ? '' : 'disabled'}>Use recommendation</button></div>
      <div class="status-field"><label for="status-${id}">Question status</label><select id="status-${id}" data-question="${id}" data-field="status"><option value="" ${answer.status === '' ? 'selected' : ''}>Not answered yet</option><option value="answered" ${answer.status === 'answered' ? 'selected' : ''}>Answered</option><option value="later" ${answer.status === 'later' ? 'selected' : ''}>Ask me later</option><option value="skip" ${answer.status === 'skip' ? 'selected' : ''}>Skip</option></select></div>
    </section>`;
  }

  function syncQuestion(id) {
    const entry = questionMap.get(id);
    const card = byId('card-' + id);
    if (!entry || !card) return;
    const answer = answers[id] || blank();
    card.querySelectorAll('input[type="radio"]').forEach(input => {
      input.checked = input.value === answer.choice;
      input.closest('.option').classList.toggle('selected', input.checked);
    });
    const other = byId('other-' + id);
    byId('other-wrap-' + id).hidden = answer.choice !== 'OTHER';
    other.setAttribute('aria-required', answer.choice === 'OTHER' ? 'true' : 'false');
    if (document.activeElement !== other) other.value = answer.other;
    const note = byId('note-' + id);
    if (document.activeElement !== note) note.value = answer.note;
    byId('status-' + id).value = answer.status;
    const flag = byId('flag-' + id);
    flag.textContent = statusLabel(entry.q);
    flag.hidden = isAnswered(entry.q);
  }

  function renderNav() {
    const e = escapeHTML;
    nav.innerHTML = data.areas.map(area => `<button type="button" class="nav-item" data-area="${e(area.id)}" ${position.area === area.id ? 'aria-current="page"' : ''}><span class="nav-name">${e(area.name)}</span><span class="nav-count" data-area-count="${e(area.id)}"></span></button>`).join('') +
      `<div class="nav-extra"><button type="button" class="nav-item" data-area="carried" ${position.area === 'carried' ? 'aria-current="page"' : ''}><span class="nav-name">Already decided</span><span class="nav-count">${data.carried.length}</span></button><button type="button" class="nav-item" data-area="review" ${position.area === 'review' ? 'aria-current="page"' : ''}><span class="nav-name">Review &amp; export</span></button></div>`;
  }

  function refreshMetrics() {
    const count = questions.filter(entry => isAnswered(entry.q)).length;
    const percent = questions.length ? Math.round(count / questions.length * 100) : 0;
    byId('progress-text').textContent = count + ' / ' + questions.length + ' answered';
    byId('progress-percent').textContent = percent + '%';
    byId('progress-fill').style.width = percent + '%';
    byId('overall-progress').setAttribute('aria-valuenow', percent);
    byId('overall-progress').setAttribute('aria-valuetext', count + ' of ' + questions.length + ' answered');
    nav.querySelectorAll('[data-area-count]').forEach(node => {
      const list = questions.filter(entry => entry.area.id === node.dataset.areaCount);
      node.textContent = list.filter(entry => isAnswered(entry.q)).length + ' / ' + list.length;
    });
  }

  function renderArea(area) {
    const e = escapeHTML;
    const step = area.steps[position.step];
