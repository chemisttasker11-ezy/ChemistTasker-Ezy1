<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap');

    --on-accent: #102b22; --selected: #234b3d; --warning: #f1ce84; --warning-bg: #3d321d;

  }

  --page: #10211e; --surface: #172d28; --soft: #213c35; --ink: #e4f2ed;
  --muted: #adc5bc; --line: #3c5a50; --control-line: #759b8a; --accent: #86dac0; --accent-hover: #a5e8d3;
  --on-accent: #102b22; --selected: #234b3d; --warning: #f1ce84; --warning-bg: #3d321d;

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.6 'Public Sans', sans-serif; }
::selection { color: var(--on-accent); background: var(--accent); }
* { scrollbar-color: var(--line) var(--page); }
button, input, textarea, select { font: inherit; color: inherit; accent-color: var(--accent); caret-color: var(--accent); }
button, select, .option { cursor: pointer; }
button, select { min-height: 44px; }
button { border: 1px solid var(--line); border-radius: 9px; padding: 10px 16px; background: var(--surface); font-weight: 600; line-height: 1.4; transition: background .15s ease; }
button:hover { background: var(--soft); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.primary:hover { background: var(--accent-hover); }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
a { color: var(--accent); text-underline-offset: 4px; overflow-wrap: anywhere; }
a:hover { text-decoration-thickness: 2px; }
h1, h2, h3 { font-family: 'Manrope', sans-serif; line-height: 1.3; letter-spacing: -.025em; text-wrap: balance; }
h1 { font-size: clamp(21px, 3vw, 28px); margin: 0; font-weight: 800; }

p { margin: 0 0 16px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.outer { max-width: 1260px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); padding-block: 0 max(36px, env(safe-area-inset-bottom,0px)); }
.header { position: sticky; top: env(safe-area-inset-top,0px); z-index: 5; background: var(--page); border-bottom: 1px solid var(--line); padding-block: 20px 16px; display: grid; grid-template-columns: 1fr minmax(200px, 360px); gap: 12px 32px; align-items: center; }
.brand { display: flex; gap: 12px; align-items: center; }
.brand-mark { width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); border-radius: 11px; }
.brand-mark svg { width: 23px; height: 23px; }
.header-sub { color: var(--muted); font-size: 13px; }
.progress-copy { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
.progress-copy strong { color: var(--ink); font-weight: 600; }
.meter { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .2s ease; }
.save-line { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.save-pill { background: var(--soft); color: var(--muted); padding: 4px 10px; border-radius: 6px; font-size: 12px; max-width: 100%; overflow-wrap: anywhere; }
.save-pill.error { color: var(--danger); background: var(--danger-bg); }
.save-line button { padding: 7px 12px; font-size: 13px; }
.layout { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 48px; padding-top: 30px; align-items: start; }
.sidebar { position: sticky; top: calc(env(safe-area-inset-top,0px) + 170px); min-width: 0; }
.nav-label { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.nav-list { display: flex; flex-direction: column; gap: 8px; }
.nav-item { text-align: left; background: var(--clear); border-color: var(--clear); display: flex; align-items: center; gap: 10px; padding: 12px; width: 100%; }
.nav-item[aria-current="page"] { color: var(--accent); background: var(--selected); border-color: var(--line); }
.nav-name { min-width: 0; overflow-wrap: anywhere; flex: 1; }
.nav-count { flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-extra { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.sidebar-note { margin: 24px 12px 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
main { min-width: 0; max-width: 790px; }
.area-summary { color: var(--muted); max-width: 65ch; }
.step-heading { margin-block: 28px 22px; border-top: 1px solid var(--line); padding-top: 22px; }
.step-count { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.step-heading h3 { margin-bottom: 7px; }
.step-heading p { color: var(--muted); margin: 0; max-width: 65ch; }
.question { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 28px); margin-bottom: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 11px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
.chip.id { color: var(--accent); font-weight: 700; }
.required-flag { font-size: 12px; color: var(--warning); background: var(--warning-bg); border-radius: 5px; padding: 3px 8px; margin-left: auto; }
.question h3 { font-size: clamp(19px, 2.4vw, 23px); }
.context { color: var(--muted); font-size: 14px; max-width: 65ch; }
.current { background: var(--soft); border-left: 3px solid var(--control-line); border-radius: 8px; padding: 12px 14px; margin: 16px 0 0; font-size: 14px; }
.current-label { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.current-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
fieldset { padding: 0; margin: 22px 0 0; border: 0; min-width: 0; }
.options { display: grid; gap: 10px; }
.option { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--control-line); border-radius: 9px; padding: 14px; min-height: 58px; background: var(--surface); transition: background .15s ease; }

.option.selected { background: var(--selected); border-color: var(--accent); }

.option-title { display: block; font-weight: 600; }
.option-key { display: inline-block; color: var(--accent); font-size: 13px; margin-right: 8px; }
.option-detail { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.field { margin-top: 20px; }
.field > label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
textarea, select { width: 100%; max-width: 100%; border: 1px solid var(--control-line); border-radius: 8px; background: var(--surface); padding: 12px; }
textarea { min-height: 104px; resize: vertical; display: block; line-height: 1.6; }
textarea::placeholder { color: var(--muted); opacity: 1; }
.helper { margin-top: 6px; margin-bottom: 0; color: var(--muted); font-size: 12px; }
.recommendation { border-block: 1px solid var(--line); padding-block: 18px; margin-top: 24px; }
.recommendation strong { color: var(--accent); font-size: 14px; }
.recommendation p { margin: 7px 0 10px; color: var(--muted); font-size: 14px; }
.source-links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; font-size: 13px; }
.source-links a { min-height: 44px; display: inline-flex; align-items: center; }
.recommendation button { font-size: 14px; }
.status-field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); align-items: center; gap: 12px; margin-top: 20px; }
.status-field label { font-size: 14px; font-weight: 600; }
.step-footer { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-block: 4px 24px; }
.footer-count { font-size: 13px; color: var(--muted); }
.step-actions { display: flex; gap: 10px; }
.empty, .decided-item { padding-block: 22px; border-bottom: 1px solid var(--line); }
.decided-item .chip { display: inline-block; margin-bottom: 10px; }
.decided-item p:last-child { color: var(--muted); margin-bottom: 0; white-space: pre-wrap; }
.review-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-block: 24px; }
.review-group { margin-block: 32px; }
.review-group > h3 { margin-bottom: 16px; }
.review-item { padding: 20px 18px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 12px; background: var(--surface); }
.review-item.unanswered { background: var(--warning-bg); }
.review-item h4 { margin: 10px 0; font-size: 16px; font-weight: 600; line-height: 1.5; }
.review-item p { margin-bottom: 8px; font-size: 14px; white-space: pre-wrap; }
.review-item .answer-label { font-weight: 600; }
.review-item .review-status { color: var(--warning); font-size: 12px; margin-left: 8px; }
.review-item button { font-size: 13px; margin-top: 5px; }
.transfer-panel { border-top: 1px solid var(--line); padding-top: 24px; margin-top: 28px; }
.transfer-panel h3 { font-size: 19px; }
.transfer-panel textarea { min-height: 160px; }
.transfer-panel button { margin-top: 12px; }
.message { color: var(--muted); font-size: 14px; margin-top: 12px; white-space: pre-wrap; }
.message.error { color: var(--danger); }
.fatal { padding: 24px; color: var(--danger); background: var(--danger-bg); border-radius: 10px; }
@media (max-width: 760px) {
  .header { grid-template-columns: minmax(0, 1fr); padding-block: 14px 12px; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; flex-basis: 34px; border-radius: 9px; }
  .header-sub { display: none; }
  .save-line { grid-column: 1; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-top: 16px; }
  .sidebar { position: static; }
  .nav-label, .sidebar-note { display: none; }
  .nav-list { flex-direction: row; overflow-x: auto; padding: 4px 3px 10px; gap: 8px; }
  .nav-item { width: auto; flex-shrink: 0; max-width: 280px; padding: 10px 13px; border-color: var(--line); background: var(--surface); }
  .nav-extra { display: contents; }
  .nav-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step-heading { margin-top: 22px; }
  .required-flag { margin-left: 0; }
  .question { border-radius: 11px; }
  .status-field { grid-template-columns: minmax(0, 1fr); gap: 7px; }
  .step-footer { align-items: stretch; }
  .footer-count { width: 100%; }
  .step-actions { width: 100%; }
  .step-actions button { flex: 1; padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

<script id="grill-data" type="application/json">{"title":"Launch Grill","intro":"Answer area by area, top to bottom. Earlier answers unblock later ones, and settled decisions are listed first so you never answer them twice.","carried":[{"id":"D01","label":"When is an outside booking confirmed?","answer":"Acceptance creates a time-limited reservation. Only verified payment confirms it."},{"id":"D02","label":"How long does the pharmacy have to pay?","answer":"Start over 48h away: 24h. 12–48h: 6h. 2–12h: 2h. Under 2h: 30 minutes. Never past shift start."},{"id":"D03","label":"An unpaid reservation expires. Then what?","answer":"Release to the same audience and notify worker and manager. No auto-escalation, no penalty."},{"id":"D04","label":"Who can cancel?","answer":"Owner and authorised managers, with guards. Staff request cover, swap or cancel and stay assigned until approved or replaced."},{"id":"D05","label":"Cancel one date or all?","answer":"One date, selected dates or the whole posting. Other dates and history stay."},{"id":"R01","label":"Who belongs on the internal roster?","answer":"Only employed staff: full-time, part-time, casual. Locums and favourites go through shift offers."},{"id":"R04","label":"Staff swap and cover requests","answer":"Staff can ask for swap or cover. No release until a manager decides or a replacement is fulfilled. Public worker cancels need a reason."},{"id":"R04A","label":"Who allows staff to publish cover?","answer":"The owner sets it per pharmacy, not per worker or role."},{"id":"R04B","label":"Who can staff invite to cover?","answer":"Named eligible colleagues. Widening to favourites or public needs a manager."},{"id":"R04C","label":"When is a replacement fulfilled?","answer":"The target accepts, passes role and conflict checks, and a manager approves the transfer."},{"id":"R04D","label":"Public worker wants to cancel","answer":"Always needs manager approval. Near start, emergency escalation with reason and notices. No self-cancel."},{"id":"R06","label":"Cover opened as a vacancy","answer":"Same shift and slot, shown as needs cover and linked to the vacancy. No duplicate."},{"id":"E01","label":"Audience order","answer":"Staff, favourites, owner chain, organisation, public. Owner may start at a later tier and post anonymously to public."},{"id":"E01A","label":"Do earlier audiences keep access?","answer":"Yes. Wider posting adds viewers. Skipping a notice never hides the shift."},{"id":"E01B","label":"Notification choices","answer":"Keep the existing staff, favourite and chain notice flags. No organisation-wide broadcast."},{"id":"E03","label":"Escalation timing","answer":"Owner picks escalation intervals when posting. Roster publishing never triggers escalation."},{"id":"P02","label":"What drives cancellation policy?","answer":"Where the worker was sourced: favourites, chain, organisation or public. Employment type is kept separate."},{"id":"P04","label":"Who sanctions workers?","answer":"The platform only, case by case, scaled by notice. Managers only report. Owners can face fees."},{"id":"P05","label":"Chain and organisation cancellations","answer":"Handled internally. No-show and repeat-cancellation badges can still apply."},{"id":"P06","label":"Public worker late cancel or no-show","answer":"Notice-based warnings. Serious cases go to platform review, case by case."},{"id":"P07","label":"What drives owner fees?","answer":"Time before shift, for outside confirmed bookings only. Internal roster work is excluded."},{"id":"P08","label":"Notice bands","answer":"Over 7 days, 72h, 24h, 12h, 2h, at or after start."},{"id":"P09","label":"Owner fee type","answer":"A percentage of the frozen agreed wages for the cancelled dates only."},{"id":"FEES","label":"Owner fee table (7 bands)","answer":"Over 7d 0%. 72h–7d 0%. 24–72h 10%. 12–24h 15%. 2–12h 20%. Under 2h 25%. At or after start 30%."},{"id":"P10","label":"Worker incident ladder","answer":"Platform-verified incidents only. 1st warning. 2nd 14 days no applying. 3rd 28 days plus badge. 4th 56 days. 5th permanent after human review. Cap 6 months."},{"id":"P11","label":"Exemptions","answer":"Different waivers for owners, internal workers and public workers, including mutually agreed cancellation."},{"id":"P12","label":"Does a replacement soften consequences?","answer":"It depends on who cancelled and how much time was left."},{"id":"F01","label":"Pharmacy cancels: the money","answer":"Booking fee, any refund or credit, and worker pay stay separate."},{"id":"F04","label":"Payment arrives after expiry","answer":"No rebooking. The pharmacy chooses credit or refund, after approved review."},{"id":"NOPEN","label":"Money penalties for workers?","answer":"None, ever. No fines, deductions or charges on workers for cancelling or no-shows."}],"areas":[{"id":"onboarding","name":"Onboarding","summary":"Sign-up to first shift, for workers and pharmacies.","steps":[{"id":"ON-S1","name":"Worker tracks and gates","why":"Sets what each role must finish before it can browse, apply, confirm and get paid.","questions":[{"id":"ON-Q01","q":"Which sign-up tracks should workers get at launch?","context":"Today there are three tracks on web and mobile: pharmacist, other staff (intern, technician, assistant, student) and Explorer. Other staff share one form.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Three tracks; the other-staff form shows each role's own fields."},{"key":"B","label":"One track per role","detail":"Separate screens for intern, technician, assistant and student."}],"rec":"KEEP","recWhy":"Today already does what A proposed, on web and mobile: three tracks with role-specific fields. Locumate and Locate a Locum also vary documents by role, not the whole flow.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-sign-up-as-a-job-seeker-shift-work-inc-ft-pt"},{"name":"Locate a Locum","url":"https://locatealocum.com/document-checklist"}],"current":"Web and mobile have three tracks: pharmacist, other staff and Explorer. The other-staff form already changes by role: AHPRA for interns, year of study for students, award classification for technicians and assistants."},{"id":"ON-Q02","q":"What can a worker do before they are Verified?","context":"Anyone signed in can browse shift boards. The Verified check only runs when applying to public shifts (ON-01).","gap":"ON-01","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Browse everything after email login; only public applications need Verified."},{"key":"A","label":"Browse everything, gate applying","detail":"See all open shifts; the apply button asks them to finish checks."},{"key":"B","label":"Browse after email and mobile","detail":"Blocks bots and fake sign-ups; new workers can still look around."},{"key":"C","label":"Nothing until Verified","detail":"Strictest. Many workers leave before finishing."}],"rec":"A","recWhy":"Browsing creates little safety risk. Gate every apply, offer acceptance and booking request with role-appropriate checks, while showing an actionable verification checklist.","sources":[],"current":"Login needs an email code. Any signed-in worker can browse every board; only applying to public shifts needs Verified, and the pharmacy's own staff and favourites skip even that."},{"id":"ON-Q03","q":"Where must role-appropriate verification be enforced?","context":"Only public applications check Verified. Direct offers, other audiences, Talent Board requests and internal rostering bypass some or all checks (ON-01).","gap":"ON-01","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Only public applications require Verified."},{"key":"B","label":"Every outside booking","detail":"Check applying, accepting and booking requests."},{"key":"C","label":"B plus internal rostering","detail":"Also check registered roles before assignment."}],"rec":"C","recWhy":"A favourite or employee still needs role-appropriate credentials. For pharmacists and interns, check the current public register before any outside booking or internal assignment.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"Only public applications check Verified. Staff and favourites bypass it; direct offers, other audiences, Talent Board requests and internal assignments lack one consistent role-appropriate gate."},{"id":"ON-Q04","q":"When must a worker's pay details (ABN or TFN, bank, super) be ready?","context":"ABN/TFN readiness is checked only at offer acceptance. TFN payroll details can come later. Workers only learn what's missing when accepting (ON-11).","gap":"ON-11","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Readiness checked at accept only; workers find gaps then."},{"key":"A","label":"Before applying","detail":"Fewer surprises, but more drop-off before the first application."},{"key":"B","label":"Before accepting, shown early","detail":"Today's gate, but the checklist shows on apply and offer screens."},{"key":"C","label":"Before first payout only","detail":"Fastest booking; risk of unpaid or wrongly classified work."}],"rec":"B","recWhy":"The gate itself is right, but workers only learn what is missing at the last step. Airtasker and ShiftKey ask for tax and payment details up front; showing the checklist on apply and offer screens fixes the surprise.","sources":[{"name":"Airtasker","url":"https://support.airtasker.com/hc/en-au/articles/42073609183641-Having-problems-verifying-my-account-what-should-I-do"},{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/essential-tips-for-professionals-using-shiftkey"}],"current":"ABN or TFN readiness is checked only when the worker accepts an offer; TFN payroll details can follow later. Web and mobile show what is missing only in the accept dialog."},{"id":"ON-Q05","q":"What can Explorers (new to pharmacy) do with shifts?","context":"Web shows Explorers the shift boards, but they get no verification check and can never accept. No Explorer payment tab exists (ON-09).","gap":"ON-09","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Explorers see boards and can apply but never accept."},{"key":"A","label":"No shifts; hide the boards","detail":"Explorers use the Talent Board only."},{"key":"B","label":"Unpaid shadowing posts only","detail":"A new post type for observation days."},{"key":"C","label":"Paid shifts after upgrading role","detail":"The upgrade card exists; they then follow that role's checks."}],"rec":"C","recWhy":"Today Explorers can apply to shifts they can never accept, which wastes pharmacies' time. Locumate and Locate a Locum tie shift access to role checks; the existing upgrade card moves Explorers into a real track.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-sign-up-as-a-job-seeker-shift-work-inc-ft-pt"},{"name":"Locate a Locum","url":"https://locatealocum.com/document-checklist"}],"current":"Web shows Explorers the public and community boards and lets them apply with no checks, but they can never accept an offer. Mobile's Explorer shifts tab is a blank placeholder."}]},{"id":"ON-S2","name":"Credentials and expiry","why":"Registration and ID are the trust signal pharmacies pay for.","questions":[{"id":"ON-Q06","q":"How should AHPRA be re-checked after sign-up?","context":"AHPRA status and expiry are copied at verification, then never refreshed for booking. The public register is the authoritative current source (ON-02).","gap":"ON-02","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Trust the saved check indefinitely."},{"key":"A","label":"Daily scan plus acceptance","detail":"Refresh from the register and check again before acceptance."},{"key":"B","label":"Acceptance check only","detail":"Current when booked; no early warning."},{"key":"C","label":"Weekly register scan","detail":"Cheaper, but changes may be a week late."}],"rec":"A","recWhy":"AHPRA says the public register is the accurate source; a displayed expiry can pass during renewal while registration remains current. Refresh status, conditions and type from the register.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"},{"name":"AHPRA renewal","url":"https://www.ahpra.gov.au/Registration/Renewal.aspx"}],"current":"AHPRA status, type and expiry are stored after one lookup. Verified uses the saved flag, and no scheduled or booking-time refresh checks the public register."},{"id":"ON-Q07","q":"If current registration cannot be confirmed, what happens to future bookings?","context":"Nothing happens today because booking paths do not refresh the public register (ON-02).","gap":"ON-02","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep bookings and warn nobody."},{"key":"A","label":"Keep bookings, warn both","detail":"Worker must resolve it before starting."},{"key":"B","label":"Cancel automatically","detail":"Fast, but risks cancelling during renewal."},{"key":"C","label":"Block new; review booked","detail":"Support verifies status and helps both sides."}],"rec":"C","recWhy":"Do not treat a stored expiry alone as a lapse. Block new commitments when the live register cannot confirm eligibility, then review existing bookings and notify both sides.","sources":[{"name":"AHPRA employer obligations","url":"https://www.ahpra.gov.au/News/2015-12-31-obligations-for-employers.aspx"}],"current":"Future bookings remain and Verified stays true because no booking-time or scheduled public-register refresh occurs."},{"id":"ON-Q08","q":"Who must pass an ID check?","context":"ID is only part of Verified for overseas Explorers. ID reading (OCR) already works for everyone.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"ID only for overseas Explorers who skip the mobile check."},{"key":"A","label":"Every worker before first booking","detail":"One check, reused for every pharmacy."},{"key":"C","label":"Pharmacists and ABN workers only","detail":"Skips employed support staff."}],"rec":"A","recWhy":"Today most workers are never ID-checked. Clipboard, Hireup and Relief Buddy check government ID before work; the OCR and the on/off setting already exist, so this is a gate change, not new tooling.","sources":[{"name":"Clipboard","url":"https://www.clipboard.com/for-workers"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360016020691-What-do-I-need-to-register-as-a-Hireup-support-worker"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-change-my-profile-picture"}],"current":"ID is only required for overseas Explorers who skip the mobile check. A setting can add ID to Verified for everyone, but it is off by default; OCR works for all."},{"id":"ON-R01","q":"How long should verification evidence be kept?","context":"Identity and qualification files are collected, but no evidence-specific deletion schedule is documented.","gap":"ON-12","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Retain files without a defined deletion trigger."},{"key":"A","label":"Delete after verification","detail":"Keep result, source and audit dates only."},{"key":"B","label":"Keep seven years","detail":"Higher breach impact; needs legal basis."}],"rec":"A","recWhy":"APP 11 requires destruction or de-identification when information is no longer needed. Set evidence-class schedules and retain only the verification audit record unless law requires more.","sources":[{"name":"OAIC APP 11","url":"https://www.oaic.gov.au/privacy/australian-privacy-principles/australian-privacy-principles-guidelines/chapter-11-app-11-security-of-personal-information"}],"current":"Verification files are stored, but the reviewed code and launch materials define no evidence-specific retention or deletion schedule."}]},{"id":"ON-S3","name":"Insurance and super","why":"Cover and super must be right before money moves.","questions":[{"id":"ON-Q09","q":"Which workers must prove professional indemnity cover?","context":"No insurance field, evidence or expiry gate exists (ON-03).","gap":"ON-03","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Collect no insurance evidence."},{"key":"A","label":"ABN pharmacists only","detail":"Misses practising employee and provisional registrants."},{"key":"B","label":"All practising pharmacists","detail":"General, limited or provisional; own or third-party cover."},{"key":"C","label":"Badge only","detail":"Show cover but never gate bookings."}],"rec":"B","recWhy":"The Pharmacy Board standard applies to practising pharmacists with general, limited or provisional registration, whether cover is personal or provided by an employer. ABN status is not the test.","sources":[{"name":"Pharmacy Board PII standard","url":"https://www.pharmacyboard.gov.au/documents/default.aspx?chksum=VYWldu%2FPTLuLnEzS1inDaQ%3D%3D&dbid=AP&record=WD15%2F19184"}],"current":"No professional indemnity insurance field, evidence, expiry or booking gate exists."},{"id":"ON-Q10","q":"How should super show on ABN contractor terms?","context":"Engagement terms split TFN casual (Award floor) from ABN contractor. ABN terms never mention super.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Keep the existing super warning in ABN terms."},{"key":"B","label":"Say contractor handles own super","detail":"Simple, but may be wrong for some workers."},{"key":"C","label":"Ask counsel first; nothing at launch","detail":"Leaves the question open."}],"rec":"KEEP","recWhy":"Today's notice already says what A proposed and matches the ATO rule that labour-only contractors can be owed super. The premise that ABN terms never mention super is out of date.","sources":[{"name":"ATO","url":"https://www.ato.gov.au/businesses-and-organisations/super-for-employers/work-out-if-you-have-to-pay-super/super-for-independent-contractors"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"}],"current":"ABN terms already carry a super notice, shown on web and mobile: invoicing does not remove super duties, and the pharmacy must check whether super is owed for a labour-only contractor."}]},{"id":"ON-S4","name":"Pharmacy setup","why":"Workers need a real, payable site before they accept.","questions":[{"id":"ON-Q11","q":"What must a pharmacy pass before posting to outside workers?","context":"Pharmacy-verified and ABN-verified flags exist, but posting checks neither. Workers can accept shifts from unverified sites (ON-06).","gap":"ON-06","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"No pharmacy checks before posting to any tier."},{"key":"B","label":"ABN verified for any outside post","detail":"Automatic ABN check only."},{"key":"C","label":"ABN plus admin check before public","detail":"A person reviews the site before public posting."},{"key":"D","label":"B for chain/org, C for public","detail":"ABN for chain and organisation tiers; admin check too for public."}],"rec":"D","recWhy":"Today a fake site can post publicly and be accepted. Locumate activates pharmacy accounts only after review; chain and organisation workers already know the site, public workers do not.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-create-a-pharmacy-account-on-locumate"}],"current":"Posting checks neither the pharmacy's Verified flag nor its ABN check, so any pharmacy can post to every tier, including public."},{"id":"ON-Q12","q":"Which site brief fields are required before the first post?","context":"The pharmacy record holds site details, hours, documents and rates. Software, staffing, parking and arrival steps are not structured fields.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"All brief fields optional; parking and arrival have no field."},{"key":"A","label":"Core: software, staffing, parking, contact","detail":"Each shift copies them and can override."},{"key":"C","label":"Full brief incl. script volume","detail":"Also services and weekday/weekend script volumes."}],"rec":"A","recWhy":"Software and script volume exist but are optional, and parking, contact and arrival are missing. Locumate collects software, services and contacts at setup and Relief Buddy filters by software; core required fields stop most mismatches.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-create-a-pharmacy-account-on-locumate"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-post-a-shift"}],"current":"The pharmacy profile has optional software, services and weekday/weekend script volume; each shift adds optional workload tags and staff-on-shift counts. Nothing is required, and parking, contact and arrival steps have no field."},{"id":"ON-Q13","q":"Should pharmacies save a payment method during setup?","context":"Every booking opens a new Stripe Checkout; no card is stored. Under D02 a shift under 2 hours away leaves 30 minutes to pay (ON-08).","gap":"ON-08","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"One Stripe checkout per booking; no stored card."},{"key":"B","label":"Save card, charge on acceptance","detail":"Confirms in seconds; payment is still verified per D01."},{"key":"C","label":"Saved card for subscribers only","detail":"Others keep one checkout per booking."}],"rec":"B","recWhy":"Today urgent shifts often expire unpaid inside the 30-minute window. Sidekicker requires a card before the first hire and Mable needs payment details before booking.","sources":[{"name":"Sidekicker","url":"https://help.sidekicker.com/en/articles/8320035-how-to-add-a-credit-card"},{"name":"Mable","url":"https://mable.com.au/help_centre/how-do-i-sign-up-as-a-client-on-mable/"}],"current":"Every booking opens a new Stripe Checkout and no card is stored. A shift under 2 hours away leaves 30 minutes to pay (D02)."}]},{"id":"ON-S5","name":"Organisations and devices","why":"How groups join, and whether phone users get the full flow.","questions":[{"id":"ON-Q14","q":"How do organisations (multi-site groups) join?","context":"Only a platform admin can create an organisation. There is no organisation sign-up, and the web create page is not routed (ON-07).","gap":"ON-07","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Platform admin creates every organisation; no self sign-up."},{"key":"B","label":"Self-serve, waits for approval","detail":"New sign-up role plus an admin review queue."},{"key":"C","label":"Self-serve, instant access","detail":"No review; highest risk."}],"rec":"KEEP","recWhy":"Sales-led setup is what Patchwork does and suits the few groups joining at launch. Only the unrouted create page needs deleting, a cleanup (ON-05), not a logic change.","sources":[{"name":"Patchwork","url":"https://patchwork.health/temporary-staffing"}],"current":"Only a platform admin can create an organisation; there is no organisation sign-up role. Organisations then claim or invite pharmacies by email. The web create page exists but is not routed."},{"id":"ON-Q15","q":"Must every onboarding step work on mobile at launch?","context":"Profile tabs match, but the mobile 'add personal profile' flow is broken: pharmacist data is dropped and other staff land on not-found (ON-04).","gap":"ON-04","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Mobile manager add-profile stays broken; other steps unchanged."},{"key":"A","label":"Full parity on web and mobile","detail":"Every step works on both."},{"key":"B","label":"Mobile basics, rest links to web","detail":"Less to build; phone users switch devices."}],"rec":"A","recWhy":"Today managers who upgrade on mobile lose data or hit a dead end. Florence and Staffy run onboarding inside the app with visible progress.","sources":[{"name":"Florence","url":"https://www.florence.co.uk/looking-for-work/registration"},{"name":"Staffy","url":"https://staffy.com/faq"}],"current":"Profile tabs match on both, but mobile's 'add personal profile' for managers is broken: the pharmacist screen sends fields the backend drops, and other-staff roles land on not-found."}]}]},{"id":"posting","name":"Post a shift","summary":"What a pharmacy enters, who sees it, and what it costs.","steps":[{"id":"PO-S1","name":"Shift details","why":"What a worker needs to judge the shift.","questions":[{"id":"PO-Q01","q":"Where should duties, solo work, breaks and parking live?","context":"The wizard covers role, rates, slots, travel and must/nice-to-have. Duties, solo work, breaks and parking are free text at best.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Duties and staffing typed per shift; no breaks or parking."},{"key":"A","label":"Site brief, shift can override","detail":"Entered once per pharmacy, copied into each shift."},{"key":"B","label":"Entered on every shift","detail":"More typing; easy to forget."}],"rec":"A","recWhy":"Today duties and staffing are retyped on every shift and breaks and parking are missing. Locumate and Relief Buddy collect these per posting; a reusable site brief saves retyping and shift overrides keep it accurate.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-post-a-shift"}],"current":"Each shift has optional workload tags (duties) and staff-on-shift counts (shows solo work), entered per shift on web and mobile. Breaks and parking have no field; the pharmacy holds software, services and script volume."},{"id":"PO-R01","q":"Must TFN shifts pass Pharmacy Award checks before posting?","context":"Marketplace posting does not enforce minimum engagement, breaks or all overtime conditions for TFN shifts.","gap":"SH-12","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Post first and rely on later review."},{"key":"A","label":"Block non-compliant posts","detail":"Validate engagement, breaks, penalties and overtime."},{"key":"B","label":"Warn owner only","detail":"Owner can continue despite the warning."}],"rec":"A","recWhy":"The Pharmacy Award includes minimum engagement, breaks, ordinary-hour limits, penalties and overtime. Validate applicable TFN terms before a worker accepts them.","sources":[{"name":"Pharmacy Industry Award","url":"https://awards.fairwork.gov.au/MA000012.html"}],"current":"Posting accepts independent slot durations without a complete Pharmacy Award gate. Engagement calculations flag some rates and long days, but do not cover every applicable rule."},{"id":"PO-Q02","q":"Must every shift state the break length and whether it is paid?","context":"No break field exists. Frozen terms do not mention breaks.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Posted shifts show no break; description text only."},{"key":"A","label":"Yes, required field","detail":"Break minutes plus paid or unpaid."}],"rec":"A","recWhy":"Today workers cannot tell break length or whether it is paid. Qwick states unpaid breaks come off paid hours; without a field, timesheet disputes follow.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5563649"}],"current":"Slots store planned break minutes for rosters, but the posting wizard on web and mobile has no break field and nothing says paid or unpaid. Frozen terms do not mention breaks."}]},{"id":"PO-S2","name":"Rates and costs","why":"Both sides must see the real money before committing.","questions":[{"id":"PO-Q03","q":"How should pay show to workers?","context":"Rates are entered per shift. Super can be flagged, but workers see no GST treatment or whole-shift total.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Hourly rate plus optional super chip; no GST or total."},{"key":"A","label":"Hourly rate, super and GST separate","detail":"Plus a total for the shift."},{"key":"B","label":"One all-in rate","detail":"Simpler, but hides super and GST."}],"rec":"A","recWhy":"Super is already shown when selected. Add an estimated total and clearly state whether GST is included, added or not applicable; confirm tax treatment before launch.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"}],"current":"Workers see the hourly rate. Locum shifts add a '+ Super' chip when the owner ticks 'Super paid on top'; full/part-time shows the super %. No GST line or shift total is shown."},{"id":"PO-Q04","q":"Should the pharmacy see the full cost before posting?","context":"The wizard shows the rate. The booking fee only appears at Stripe checkout.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Owner sees wages only; booking fee appears at checkout."},{"key":"A","label":"Yes: wages, super, fee, GST","detail":"One total before posting."}],"rec":"A","recWhy":"The booking fee first appears at checkout. Show wages, super, platform fee, GST treatment and the payable total prominently before posting and again before payment.","sources":[{"name":"ACCC price displays","url":"https://www.accc.gov.au/business/pricing/price-displays"},{"name":"Locumate pricing","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"}],"current":"The wizard shows the hourly rate and wages per date. Super, GST and the booking fee are not shown; the fee first appears at Stripe checkout."}]},{"id":"PO-S3","name":"Dates, blocks and repeats","why":"Continuity needs differ from filling single days.","questions":[{"id":"PO-Q05","q":"For multi-date posts, how is 'same worker for every date' set?","context":"Slots, recurring dates and a single-user option exist. Workers cannot tell whether a block is all-or-nothing.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Owner's 'One person works every date' switch makes blocks all-or-nothing."},{"key":"B","label":"Always separate dates","detail":"Simpler; no continuity."}],"rec":"KEEP","recWhy":"Today's switch is exactly what Locumate asks when posting multi-day work. The only gap is that worker cards don't say 'all dates required', which is a label fix.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"}],"current":"Owners already tick 'One person works every date' on web and mobile; one worker then takes the whole block and slot picking is hidden. Otherwise each date is a separate slot."},{"id":"PO-Q06","q":"How far ahead can recurring shifts run?","context":"The wizard supports recurring shifts. No horizon limit is set.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Any recurrence end date allowed; no horizon limit."},{"key":"A","label":"Up to 12 weeks","detail":"Repost to extend."},{"key":"B","label":"Up to 6 months","detail":"Fewer reposts."}],"rec":"A","recWhy":"Today a recurrence can run for years, so rates and availability go stale. Hireup's board handles one-off, weekly and fortnightly needs; a 12-week horizon keeps them honest.","sources":[{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/360015006131-The-Job-Board"}],"current":"Recurring slots need weekdays and an end date (defaulting to the start date), but no maximum horizon is enforced on web, mobile or backend."},{"id":"PO-Q07","q":"How should owners repeat a past shift?","context":"No template or duplicate action exists today.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Retype each shift; only the description can be reused."},{"key":"A","label":"'Post again' copies, dates reviewed","detail":"Copy a past shift, check dates, post."},{"key":"B","label":"Saved named templates","detail":"More setup."},{"key":"C","label":"Both","detail":"Most flexible; most to build."}],"rec":"A","recWhy":"Today owners retype every repeat shift. Instawork's book-again copies location and instructions with dates reviewed, and LocumCo+ offers duplication.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/10081823-exploring-the-shift-details-page"},{"name":"LocumCo+","url":"https://locumco.com.au/latest-news/locumco-plus-manage-locum-shifts/"}],"current":"No duplicate, post-again or shift template exists. Owners can only save and reuse a description template per pharmacy and role, on web and mobile."}]},{"id":"PO-S4","name":"Audiences and escalation","why":"Owner-set schedules must actually fire and reach the new audience.","questions":[{"id":"PO-Q08","q":"When a shift escalates, who is told, and when does escalation stop?","context":"Escalation sends nothing. Availability emails only go out when posting straight to public. Any interest ever stops escalation, even if declined (SH-06).","gap":"SH-06","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Silent escalation; any past interest stops it for good."},{"key":"A","label":"Notify each new tier; stop when reserved","detail":"Respects the owner's notice flags."},{"key":"B","label":"Notify at public; stop at interest","detail":"Today's stop rule."},{"key":"C","label":"Owner chooses per shift","detail":"Another setting on the form."}],"rec":"A","recWhy":"Today newly eligible workers are never told, and one declined applicant strands the shift. CareRev cascades openings across teams and Locumate releases on schedule.","sources":[{"name":"CareRev","url":"https://www.carerev.com/solutions/carerev-irp"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"Escalation sends no notices; availability-match emails go out only when a shift is posted straight to public. Auto-escalation stops for good once anyone has shown interest, even if they later declined."},{"id":"PO-Q09","q":"Should escalation pause while an offer waits for an answer?","context":"There is no pause or resume rule tied to pending offers.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Escalation stops at first interest and never resumes."},{"key":"A","label":"Pause; resume on decline or expiry","detail":"No two workers race for one slot."},{"key":"B","label":"Keep escalating","detail":"Faster fill; more let-downs."}],"rec":"A","recWhy":"Today escalation never resumes after a decline or expiry, so the shift can sit unfilled. Instawork prioritises selected workers first, then falls back to others.","sources":[{"name":"Instawork","url":"https://help.instawork.com/en/articles/2062210-selecting-pros-for-your-shift"}],"current":"No pause rule. Auto-escalation stops for good once anyone shows interest, so most shifts with a pending offer never escalate again, even after decline or expiry."},{"id":"PO-Q10","q":"How late may a scheduled escalation fire?","context":"Escalation only runs when someone loads a shift list. No scheduled job exists, so schedules fire late or never (SH-05).","gap":"SH-05","type":"code","options":[{"key":"A","label":"Within 5 minutes","detail":"A scheduled job every few minutes."},{"key":"B","label":"Within 1 minute","detail":"Same job, more often."},{"key":"C","label":"Within 15 minutes","detail":"Cheapest."}],"rec":"A","recWhy":"Reservation expiry already runs every 60 seconds, so a job is cheap. Five minutes is plenty for owner-set intervals. CareRev releases on rules, not page views.","sources":[{"name":"CareRev","url":"https://www.carerev.com/solutions/carerev-irp"}],"current":"Auto-escalation only runs when someone loads a shift list or detail; no scheduled job exists, so due escalations fire late or never, and each request scans every due shift."}]},{"id":"PO-S5","name":"Anonymous and urgent","why":"Privacy and speed without misleading workers.","questions":[{"id":"PO-Q11","q":"On an anonymous public post, what is hidden?","context":"Anonymous posting reuses public redaction. Exactly which fields are hidden is untested (E01B note).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Hide name, street, software, services; show suburb and rate."},{"key":"B","label":"Also hide suburb","detail":"Region only."}],"rec":"KEEP","recWhy":"Today already hides what A proposed and keeps the suburb workers need to judge travel, as Mable does. It also hides software and services, which could identify a small-suburb pharmacy.","sources":[{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"Anonymous posts show 'Anonymous Pharmacy', suburb, state, postcode, script volume and the rate. Name, street, software and services are hidden from everyone except the pharmacy's managers."},{"id":"PO-Q12","q":"When does an anonymous pharmacy's name reach the worker?","context":"Not defined today.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Worker accepts blind; name surfaces only in the reminder email."},{"key":"A","label":"In the agreement preview","detail":"Before the worker accepts."},{"key":"B","label":"After reservation","detail":"Worker accepts blind."},{"key":"C","label":"After payment confirms","detail":"Worker commits blind."}],"rec":"A","recWhy":"Today a worker agrees to work for an unknown business and learns the name by accident in an email. Relief Buddy shows the shift agreement before commitment.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"}],"current":"The worker never sees the name before accepting: the terms dialog omits it and accept notices say 'Shift in <suburb>'. Cards stay anonymous after booking; the 12-hour reminder email names it."},{"id":"PO-Q13","q":"What makes a shift 'urgent'?","context":"The wizard has an urgent flag that the owner sets.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Urgent only when the owner switches it on."},{"key":"A","label":"Owner flag, or auto within 24h","detail":"Any shift starting within 24 hours is urgent."},{"key":"C","label":"Owner flag, or auto within 48h","detail":"Wider net."}],"rec":"A","recWhy":"Today a shift starting tomorrow is not urgent unless the owner remembers. Qwick treats shifts posted within 24 hours as urgent; Mable's Last Minute covers 4 to 48 hours.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5564417"},{"name":"Mable","url":"https://mable.com.au/newsroom/most-frequently-asked-questions-by-mable-clients/"}],"current":"Urgent is only the owner's switch in the wizard (web and mobile); nothing turns on automatically near start time. Workers can filter by urgent."},{"id":"PO-Q14","q":"Should owners be able to add an urgent pay boost?","context":"There is no boost field. The owner can only set the rate.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"No boost; owners raise the rate or add award extra."},{"key":"B","label":"Boost field, shown hourly and total","detail":"A separate visible extra."}],"rec":"KEEP","recWhy":"Raising the rate, or the existing award 'Extra on top', already does the job at launch with no new field. Qwick-style boosts can wait for urgent-fill data.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5564417"}],"current":"No urgent boost. Award-rate (non-pharmacist) shifts have an optional 'Extra on top' per hour, added to the rate and shown as a bonus in terms; pharmacist shifts just set the rate."}]},{"id":"PO-S6","name":"Billing","why":"Billing is live with no trial today.","questions":[{"id":"PO-Q15","q":"When should booking fees start?","context":"Billing went live 2025-06-01 (its comment says 2026) with no trial, so every outside booking needs paid checkout (SH-04).","gap":"SH-04","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Charge every outside booking from day one."},{"key":"B","label":"Free until a set date","detail":"Everyone free until then."},{"key":"C","label":"N-day trial per new pharmacy","detail":"A saved card still confirms bookings."}],"rec":"C","recWhy":"Today the first booking already costs money, a barrier for new pharmacies. Locumate makes registration and posting free and charges only per completed shift.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"}],"current":"Billing went live 2025-06-01 (its comment says 2026) with zero free-trial days, so every outside booking needs a paid checkout today."},{"id":"PO-Q16","q":"Should the booking fee depend on shift length?","context":"The fee is per offer whatever the hours or days: $30/$80, or $15/$40 for subscribers (SH-03).","gap":"SH-03","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Flat fee per offer, whatever the length."},{"key":"B","label":"Per shift day","detail":"Each booked date is one fee."},{"key":"C","label":"Percentage of wages","detail":"With a minimum and maximum."}],"rec":"B","recWhy":"Today a 10-day block costs the same as one day, while a multi-slot shift pays per slot. Locumate charges A$50 per completed shift; per day is simple and fair for blocks.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-pricing-information"},{"name":"Relief Buddy","url":"https://reliefbuddy.com/terms-of-service/"}],"current":"Each paid offer costs $30 (locum) or $80 (full/part-time), whatever the hours. A one-worker block of many dates is one offer and one fee; subscribers are wrongly charged full price."}]}]},{"id":"booking","name":"Apply & book","summary":"How a worker gets from interest to a reserved and paid shift.","steps":[{"id":"BK-S1","name":"Booking modes","why":"Decides whether trusted workers can skip the queue.","questions":[{"id":"BK-Q01","q":"Which ways can a worker get a shift at launch?","context":"Workers express interest and managers send offers. Counter-offers exist. There is no instant book.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Apply-and-offer for outsiders; instant claim for own employees only."},{"key":"B","label":"A plus opt-in instant book","detail":"The owner switches instant book on per shift."}],"rec":"B","recWhy":"Today trusted favourites must wait for an offer even for urgent shifts. Locumate offers first-come instant booking beside applications and ShiftKey auto-accepts eligible bids; opt-in keeps the owner in control.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/how-to-post-a-shift"},{"name":"ShiftKey","url":"https://marketing.production.shiftkey.com/resources/blog/admin-assist-the-convenience-you-want-with-the-control-you-need"}],"current":"Outside workers and favourites apply and the pharmacy sends an offer they confirm; counter-offers exist. Only the pharmacy's own employees can instantly claim its shifts."},{"id":"BK-Q02","q":"Who may instant-book or be auto-accepted?","context":"Favourites exist as pharmacy memberships. No reliability score exists yet.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Instant claim stays limited to the pharmacy's own employees."},{"key":"A","label":"Favourites only","detail":"People the pharmacy already trusts."},{"key":"B","label":"Favourites plus rule-based workers","detail":"For example 5+ completed shifts and no incidents."}],"rec":"A","recWhy":"Today favourites, the people pharmacies trust most, cannot book instantly. ShiftKey and Nursa auto-approve favourites; score thresholds need reliability data you do not have yet.","sources":[{"name":"ShiftKey","url":"https://marketing.production.shiftkey.com/resources/blog/admin-assist-the-convenience-you-want-with-the-control-you-need"},{"name":"Nursa","url":"https://nursa.com/facility/solutions/healthcare-recruitment-software"}],"current":"Only the pharmacy's own employees can claim instantly, limited to roles their employment covers. Favourites (locum/Shift Hero) must apply and accept an offer. No reliability score exists."}]},{"id":"BK-S2","name":"Applicants","why":"What the pharmacy sees when choosing.","questions":[{"id":"BK-Q03","q":"How should applicants be ordered for the pharmacy?","context":"No ranking rule is defined.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Unsorted applicant list with no explanation."},{"key":"A","label":"Favourites, reliability, then apply time","detail":"Order explained on screen."},{"key":"B","label":"Apply time only","detail":"First come, first shown."},{"key":"C","label":"Pharmacy sorts","detail":"No default."}],"rec":"A","recWhy":"Today favourites can sit below strangers. Mable explains its ranking (location, response speed, feedback), and favourites first matches Locumate's preferred locums.","sources":[{"name":"Mable","url":"https://mable.com.au/help_centre/how-support-workers-are-ranked-in-mable-search-results/"},{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/locumate-december-2024-release-notes"}],"current":"No ranking rule: applicants come back unsorted (in practice roughly apply order) on web and mobile, with no explanation."},{"id":"BK-Q04","q":"What should the pharmacy see on each applicant?","context":"Applicant cards and a reveal action exist.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Profile and badges; name on reveal; contact after booking."},{"key":"A","label":"Role, AHPRA, reviews, reliability, rate","detail":"Contact details wait for a booking."},{"key":"B","label":"Same plus full contact details","detail":"Easier to go off-platform."}],"rec":"A","recWhy":"Contact is already held back correctly, but reviews and reliability are missing. ShiftPosts shows profiles and ratings before booking and ShiftKey lets facilities review credentials.","sources":[{"name":"ShiftPosts","url":"https://shiftposts.com/"},{"name":"ShiftKey","url":"https://www.shiftkey.com/facilities/facility-quick-start-guide"}],"current":"Before reveal: photo, bio, role, skills, Verified/AHPRA badges, suburb, travel and rate preference. Reveal adds the name; contact details and CV come only after booking. No reviews or reliability shown."}]},{"id":"BK-S3","name":"Offers and expiry (D06)","why":"What happens when an offer is not answered.","questions":[{"id":"BK-Q05","q":"How long does an offer stay open?","context":"Offers expire after a flat 48 hours, not capped at shift start, and expiry is only applied when someone looks (SH-07).","gap":"SH-07","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Flat 48-hour offers that can outlive the shift."},{"key":"A","label":"48 hours, capped at start","detail":"Simple fix."},{"key":"B","label":"Scale with lead time, like D02","detail":"24h / 6h / 2h / 30 min, capped at start."}],"rec":"B","recWhy":"Today an urgent offer can stay 'pending' after the shift has started. One timing model for offers and payments is easier to explain, and Qwick shows offers do not hold a place for long.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"}],"current":"Offers expire a flat 48 hours after sending, not capped at shift start, and expiry is applied only when someone opens the offer list or tries to accept."},{"id":"BK-Q06","q":"When an offer is declined or expires, what happens to the shift?","context":"Decline and expiry exist, but no fallback rule is chosen (D06).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Shift stays open; owner told on decline only."},{"key":"A","label":"Reopen to same audience, tell manager","detail":"Matches D03."},{"key":"B","label":"Back to manager to pick","detail":"Shift waits for a person."},{"key":"C","label":"Auto-offer the next applicant","detail":"Fast, but may pick someone unwanted."}],"rec":"A","recWhy":"Today expiry is silent, so the manager may wait on a dead offer. Reopening to the same audience and telling the manager in both cases matches D03; ShiftKey reopens shifts immediately too.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"A decline notifies the owner and the shift stays open to the same audience. An expired offer changes status silently; nobody is told and nothing offers the next applicant."},{"id":"BK-Q07","q":"Can a pharmacy offer one shift to several workers at once?","context":"The backend already permits several offers for one slot; first acceptance reserves it and later acceptances fail.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Several offers allowed; first to accept wins, rest expire."},{"key":"A","label":"One at a time","detail":"Slow for urgent shifts."}],"rec":"KEEP","recWhy":"The backend already works like Qwick and Hireup: several offers, the first acceptance reserves the slot, and the others expire and are told once payment confirms.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5561345"},{"name":"Hireup","url":"https://help.hireup.com.au/hc/en-us/articles/13502083241103-Booking-Requests-For-Clients"}],"current":"The backend lets a manager send offers for one slot to several workers; the first to accept reserves it, later ones get 'already reserved', and the rest expire once the booking confirms."}]},{"id":"BK-S4","name":"Counter-offers","why":"Negotiation must end in a clear booking.","questions":[{"id":"BK-Q08","q":"What can a worker counter?","context":"Counter-offers exist, but which fields can be countered is not set.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Counter rate and times per slot, plus a travel request."},{"key":"A","label":"Rate only","detail":"Simplest."},{"key":"B","label":"Rate and times","detail":"Covers most real requests."}],"rec":"KEEP","recWhy":"Today already covers rate and times like Relief Buddy. Travel is only a yes/no request, not a negotiated allowance, so it adds no dispute risk.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/request-change-request-and-apply-adjusting-shift-rate-or-times"},{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4799126-how-to-negotiate-a-shift-rate-in-the-app"}],"current":"Workers can counter the rate (negotiable shifts) and start/end times (flexible shifts) per slot, and tick 'request travel', on web and mobile."},{"id":"BK-Q09","q":"If the pharmacy accepts a counter-offer, is the worker booked?","context":"For outside workers, acceptance leads into the D01 reservation.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Worker confirms the countered offer and accepts terms once."},{"key":"A","label":"Yes, straight to reservation","detail":"The worker already proposed these terms."}],"rec":"KEEP","recWhy":"The confirm step is where the worker accepts the frozen engagement terms (and contractor status for ABN), which the legal notes and P09 disclosure rely on. Skipping it would book without recorded consent.","sources":[{"name":"Locate a Locum","url":"https://help.locatealocum.com/en/articles/4799126-how-to-negotiate-a-shift-rate-in-the-app"}],"current":"No. Accepting a counter-offer creates a new offer with the countered terms, which the worker must confirm and accept the engagement terms for before any reservation."}]},{"id":"BK-S5","name":"Conflicts and requirements","why":"No double booking, no unqualified bookings.","questions":[{"id":"BK-Q10","q":"When a worker is booked, what happens to their overlapping applications?","context":"No conflict withdrawal exists today.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Overlapping applications stay open after a booking."},{"key":"A","label":"Withdraw overlapping, keep the rest","detail":"Automatic, with a notice."},{"key":"B","label":"Keep them; block at accept","detail":"Pharmacies may pick a worker who can't come."}],"rec":"A","recWhy":"Today pharmacies can pick a worker who is already booked elsewhere. ShiftKey cancels conflicting bids, and Relief Buddy withdraws overlaps while keeping the rest.","sources":[{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/essential-tips-for-professionals-using-shiftkey"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/can-i-apply-to-multiple-shifts-at-the-same-time"}],"current":"Nothing withdraws a booked worker's other applications; overlapping interests and offers stay open."},{"id":"BK-Q11","q":"Can a worker hold a reservation that overlaps another booking or roster shift?","context":"Reservations have no assignment, so roster conflict checks may miss them.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Overlaps allowed at accept and at payment."},{"key":"A","label":"No; block at accept","detail":"Recheck again before payment confirms."},{"key":"B","label":"Yes until paid","detail":"Risk of two paid bookings at once."}],"rec":"A","recWhy":"Today a worker can hold two paid bookings at once. ShiftKey and Relief Buddy block conflicts; checking at accept and again at payment closes the race.","sources":[{"name":"ShiftKey","url":"https://www.shiftkey.com/resources/blog/essential-tips-for-professionals-using-shiftkey"},{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/can-i-apply-to-multiple-shifts-at-the-same-time"}],"current":"Not checked: accepting an offer never looks at the worker's other bookings, reservations or roster shifts, so overlapping reservations and paid bookings are both possible."},{"id":"BK-Q12","q":"Should must-have requirements block applying?","context":"Posts have must-have and nice-to-have fields. They do not gate applications.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Must-haves stay advisory; pharmacy filters by hand."},{"key":"A","label":"Must-haves block; nice-to-haves rank","detail":"Missing must-have hides the apply button."}],"rec":"A","recWhy":"Today workers missing a must-have can still apply, so pharmacies filter by hand. Relief Buddy filters out workers missing required skills and CareRev requires credentials before claiming.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/how-do-i-post-a-shift"},{"name":"CareRev","url":"https://www.carerev.com/professionals/faq"}],"current":"Must-have and nice-to-have lists show on the post but are never checked when applying or accepting, on web or mobile."}]},{"id":"BK-S6","name":"Reservation screen","why":"Workers must know when a booking becomes binding.","questions":[{"id":"BK-Q13","q":"Should reservations show a live payment countdown?","context":"Both sides already see reserved-not-confirmed wording and the pay-by time; neither sees a live countdown.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Show the state and exact deadline."},{"key":"A","label":"Add live countdown","detail":"Show remaining time to both sides."},{"key":"B","label":"Show as booked","detail":"Misleading if payment fails."}],"rec":"A","recWhy":"The existing wording and deadline are accurate. A countdown makes urgency easier to scan, but it is a local usability choice rather than verified competitor practice.","sources":[],"current":"Worker's slot shows 'Waiting for owner payment' and the notice says 'reserved, not yet confirmed' with the pay-by time. Managers see 'Awaiting payment' and 'Reservation expires <time>'. 'Confirmed' only after payment."},{"id":"BK-Q14","q":"Can a worker drop a reservation before payment without an incident?","context":"Unpaid reservations expire under D03. Worker withdrawal before payment has no rule.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Worker cannot drop a reservation; it is paid or expires."},{"key":"A","label":"Yes, no incident","detail":"Nothing is confirmed yet."},{"key":"B","label":"Free for 15 minutes, then counts","detail":"Covers accidental taps only."},{"key":"C","label":"Counts as a cancellation","detail":"Treats a reservation like a booking."}],"rec":"A","recWhy":"Today a worker who can no longer come must wait for expiry, holding the slot. Nothing is confirmed until the pharmacy pays (D01), so releasing it is not a cancellation; Qwick lets accidental acceptances go.","sources":[{"name":"Qwick","url":"https://support.qwick.com/en/articles/5560641"}],"current":"No worker withdraw action exists for a reservation; it only ends when the pharmacy pays or the reservation expires (D03)."},{"id":"BK-R01","q":"What happens after booking payment fails?","context":"The reservation remains until its deadline; no explicit retry, extension or immediate-release rule is stated.","gap":"SH-13","type":"decision","options":[{"key":"KEEP","label":"Retry until deadline","detail":"Same reservation and original deadline."},{"key":"A","label":"Release immediately","detail":"One failed attempt loses the worker."},{"key":"B","label":"Extend once","detail":"Failure grants extra reservation time."}],"rec":"KEEP","recWhy":"Keep D02 and D03 deterministic: payment failure does not confirm or extend the booking, but the pharmacy may retry before the existing deadline.","sources":[],"current":"A failed or cancelled checkout does not confirm the assignment. The reservation remains available for another checkout attempt until its original payment deadline."}]}]},{"id":"agreement","name":"Agreements & changes","summary":"What both sides sign, and what happens when terms change.","steps":[{"id":"AG-S1","name":"What gets accepted","why":"Fees and rules only hold if they were shown before acceptance.","questions":[{"id":"AG-Q01","q":"What must the worker see before accepting?","context":"Frozen terms hold pay and engagement type, but no cancellation table, platform terms version or pharmacy acceptance (SH-09).","gap":"SH-09","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Pay, times and legal notices only before accepting."},{"key":"A","label":"Pay, times, breaks, duties, site, cancellation","detail":"Plus the platform terms version."}],"rec":"A","recWhy":"Today the cancellation table is never disclosed, so P09 fees cannot be charged. Relief Buddy previews conduct and cancellation terms; Locate a Locum requires terms acceptance first.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"},{"name":"Locate a Locum","url":"https://locatealocum.com/content/terms/"}],"current":"The accept dialog (web and mobile) shows pay type, award basis, dates, times, final rate and legal notices. It has no breaks, duties, site details, cancellation table or visible terms version."},{"id":"AG-Q02","q":"Does the pharmacy accept the same agreement?","context":"Only the worker accepts terms today.","gap":"SH-09","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Worker-only acceptance; pharmacy never agrees the terms."},{"key":"A","label":"Yes, when it sends or approves","detail":"Logged with time and terms version."}],"rec":"A","recWhy":"Today the pharmacy never agrees the owner fee table that binds it. Relief Buddy sends both parties the agreement.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"}],"current":"Only the worker accepts: terms are frozen with the worker's id and time. The pharmacy never records acceptance."},{"id":"AG-Q03","q":"Should both sides get a PDF copy of the agreement?","context":"No PDF or emailed copy exists.","gap":"","type":"decision","options":[{"key":"A","label":"Emailed PDF once confirmed","detail":"Also downloadable in the app."},{"key":"B","label":"In-app view only","detail":"Less to build."}],"rec":"A","recWhy":"Relief Buddy emails both parties a PDF after acceptance. LocumCo sends formal confirmation with contract terms.","sources":[{"name":"Relief Buddy","url":"https://knowledgebase.reliefbuddy.com/what-is-a-shift-agreement"},{"name":"LocumCo","url":"https://locumco.com.au/candidates/locums/"}],"current":"Not built yet."}]},{"id":"AG-S2","name":"Contractor or employee","why":"The engagement type drives tax, super and pay.","questions":[{"id":"AG-Q04","q":"How is employee versus contractor status decided?","context":"The pharmacy currently labels each locum shift TFN employee or ABN contractor, and the worker must match.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Pharmacy chooses ABN or TFN."},{"key":"A","label":"Both parties attest","detail":"Still risks choosing the wrong legal status."},{"key":"B","label":"Relationship test first","detail":"Assess the real relationship; ABN never decides alone."}],"rec":"B","recWhy":"Fair Work applies a whole-of-relationship test for many businesses. An ABN or contract label does not decide status, and sham contracting creates serious risk.","sources":[{"name":"Fair Work independent contractors","url":"https://www.fairwork.gov.au/find-help-for/independent-contractors/independent-contractors"}],"current":"The pharmacy picks 'Paid as' Contractor (ABN) or Employee (TFN) per locum shift on web and mobile. Terms follow it, and acceptance is blocked if the worker's profile type differs."}]},{"id":"AG-S3","name":"Changes after booking (D09)","why":"Stops silent changes to agreed terms.","questions":[{"id":"AG-Q05","q":"Which changes after booking need the worker's new consent?","context":"Managers can still change rate, role, payment type, description and travel on accepted shifts. Frozen terms keep the old values (SH-08).","gap":"SH-08","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Edits allowed with a notice only; no re-consent."},{"key":"A","label":"Rate, date, times, role, site, travel","detail":"Notes and parking: notice only."},{"key":"B","label":"Rate and date only","detail":"Other changes are notices."}],"rec":"A","recWhy":"Today the card and the agreed terms can disagree. Locumate requires the locum's agreement before changing accepted details, and Mable sends updated agreements.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"},{"name":"Mable","url":"https://mable.com.au/help_centre/agreements-how-it-works/"}],"current":"After acceptance managers can still change rate, role, payment type, description and travel; only slots lock. Engaged workers get an 'updated' notice, and frozen terms keep the old values."},{"id":"AG-Q06","q":"Until the worker answers a change, which terms apply?","context":"No change-request flow exists.","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Card shows new values; frozen terms keep old ones."},{"key":"A","label":"Old terms stay","detail":"New terms apply only after consent."},{"key":"B","label":"New terms apply","detail":"Worker can decline afterwards."}],"rec":"A","recWhy":"Today nobody can tell which terms apply. Locumate and Mable both wait for the other party's agreement before a change counts.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"},{"name":"Mable","url":"https://mable.com.au/help_centre/agreements-how-it-works/"}],"current":"No change-request flow: edits apply to the shift at once while the worker's frozen terms keep the old values, so the two can disagree."},{"id":"AG-Q07","q":"If the worker rejects the change, what happens?","context":"No rule exists.","gap":"","type":"decision","options":[{"key":"A","label":"Keep old terms, or pharmacy cancels","detail":"A cancel counts as pharmacy-initiated; owner fee bands apply."},{"key":"B","label":"Mutual cancel, no fee","detail":"No incident, no owner fee."}],"rec":"A","recWhy":"Locumate helps cancel when a locum can't meet changed requirements. The change came from the pharmacy, so the worker gets no incident.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"}],"current":"Not built yet."},{"id":"AG-Q08","q":"Until re-consent is built, lock key fields after the first acceptance?","context":"Slots lock once anyone engages, but rate, role, payment type and travel stay editable (SH-08).","gap":"SH-08","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Key fields stay editable after acceptance, notice only."},{"key":"A","label":"Lock rate, role, payment, travel","detail":"To change them, cancel and repost."},{"key":"B","label":"Allow, with re-consent","detail":"Needs AG-Q05 built first."}],"rec":"A","recWhy":"Today cards and frozen terms disagree after an edit. Locking is the smallest safe step until re-consent exists; Locumate routes accepted-shift changes through the locum's agreement.","sources":[{"name":"Locumate","url":"https://support.locumate.com.au/portal/en/kb/articles/pharmacy-procedure-for-amending-shift-details-after-locum-accepts-shift"}],"current":"Slots lock once anyone has engaged, but rate, role, payment type, description and travel stay editable, with only an update notice."}]},{"id":"AG-S4","name":"Notices and reminders (D07, D12)","why":"The right people hear about changes, nobody gets stale reminders.","questions":[{"id":"AG-Q09","q":"Who is told when a shift is cancelled, covered or replaced?","context":"Existing notices are per feature. No recipient list is agreed (D07).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Each feature keeps choosing its own recipients."},{"key":"A","label":"Affected workers, owner, shift's managers","detail":"Only people who must act."},{"key":"B","label":"Plus organisation admins","detail":"Wider oversight."},{"key":"C","label":"Plus anyone watching","detail":"Risks leaking names."}],"rec":"A","recWhy":"Today edits reach every past applicant, which leaks activity and adds noise. Telling only the people who must act keeps names private; ShiftKey sends recovery notices only to the groups the facility sets.","sources":[{"name":"ShiftKey","url":"https://help.shiftkey.com/s/article/Cancellation-Recovery---FAQ-for-Facilities"}],"current":"Each feature picks its own recipients: shift edits notify everyone who applied, countered or got an offer. Booked outside shifts cannot be cancelled yet, so no cancel notice exists."},{"id":"AG-Q10","q":"Which channels carry those notices?","context":"In-app, push and email exist. Channel per event is not set (D07).","gap":"","type":"decision","options":[{"key":"KEEP","label":"Keep current logic","detail":"Each feature keeps choosing its own channels."},{"key":"A","label":"In-app and push; email for money/cancel","detail":"Email only when it matters."},{"key":"B","label":"Email everything","detail":"Inbox noise."},{"key":"C","label":"In-app only","detail":"Easy to miss."}],"rec":"A","recWhy":"Today there is no rule, so some money and cancel events may lack a durable email and reminders lack push
