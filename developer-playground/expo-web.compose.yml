services:
  expo_web:
    image: node:22-alpine
    working_dir: /app
    restart: "no"
    env_file:
      - ./env/mobile.dev.env
    environment:
      CT_SHARED_CORE_SKIP_PREPARE: "1"
      EXPO_PUBLIC_API_URL: "http://localhost:8000/api"
      EXPO_PUBLIC_WS_URL: "ws://localhost:8000"
      EXPO_NO_TELEMETRY: "1"
    command: ["sh", "-c", "npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund && npx expo start --web --port 8082 --host lan --clear"]
    ports:
      - "8082:8082"
    networks:
      - chemisttasker_network
    volumes:
      - ./frontend_mobile:/app
      - ./scripts:/scripts
      - ./shared-core:/shared-core
      - expo_web_node_modules:/app/node_modules
    depends_on:
      shared_core_prepare:
        condition: service_completed_successfully
      web:
        condition: service_healthy

volumes:
  expo_web_node_modules:
