<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChemistTasker · Local playground</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#24332f;background:#f3f5f1;--green:#176852;--muted:#66766f;--line:#dce3dc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,select{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5aa47;outline-offset:3px}button{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;color:inherit}button:hover{border-color:var(--green);background:#f0f7f1}a{color:var(--green)}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#143e32;color:#fff;padding:30px 22px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:750;letter-spacing:-.5px}.brand span{color:#b5dba7}.side p{color:#b6cbbf;font-size:13px;line-height:1.6}.side nav{display:grid;gap:8px;margin:35px 0}.side nav button{text-align:left;background:transparent;border-color:transparent;color:#c4d6cd;padding:14px}.side nav button.active{background:#e2edbd;color:#193d2e;font-weight:650}.side .local{border-top:1px solid #466357;padding-top:24px;margin-top:50px}.badge{display:inline-flex;border-radius:6px;padding:4px 8px;background:#eef2ed;font-size:11px;line-height:1.5;font-weight:650;letter-spacing:.2px}.verified{background:#e0f1e5;color:#1f6a3d}.pending,.email_pending,.terms_pending,.onboarding_draft{background:#fff0ce;color:#865c10}.inactive,.rejected,.expired{background:#fbe4df;color:#9c4337}main{padding:34px 40px;max-width:1650px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase}h1{font-size:34px;letter-spacing:-1.3px;margin:8px 0 10px}h2{font-size:20px;letter-spacing:-.5px}h3{font-size:16px}.muted{color:var(--muted);line-height:1.6}.hero{background:#e3eacb;border:1px solid #d3dfb8;border-radius:18px;padding:27px 30px;margin:24px 0;display:flex;gap:30px;align-items:center;justify-content:space-between}.hero h2{font-size:25px;margin:0 0 8px}.hero p{max-width:680px;margin:0;font-size:14px;line-height:1.7}.hero .number{font-size:56px;font-weight:750;letter-spacing:-3px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.stat strong{display:block;font-size:28px;margin-bottom:6px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 12px}.toolbar input{min-width:230px;flex:2}input,select{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#24332f}select{max-width:230px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;min-width:0}.person{display:flex;gap:13px;align-items:center;margin-bottom:17px}.person img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#e5e9e1}.person strong{display:block;line-height:1.45}.small{font-size:12px}.tagline{display:flex;flex-wrap:wrap;gap:5px;min-height:26px}.card .email{display:block;overflow-wrap:anywhere;color:var(--muted);font-size:11px;margin:13px 0}.actions{display:flex;gap:7px;margin-top:15px}.actions button,.actions a{font-size:12px;flex:1}.actions a{text-align:center;border-radius:9px;padding:10px 14px;text-decoration:none}.actions{flex-wrap:wrap}.open-account{flex-basis:100%!important}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#245b43;color:white}.section-head{display:flex;justify-content:space-between;align-items:center;margin-top:30px}.pagination{display:flex;justify-content:center;gap:16px;align-items:center;margin:24px}.notice{padding:14px 18px;border-radius:10px;background:#e9eee6;font-size:12px;color:#55645c;line-height:1.7;margin:20px 0}.network details{margin:14px 0;background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.network summary{cursor:pointer;font-weight:650}.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding-top:18px}.branch{text-align:left;padding:16px}.branch strong{display:block;margin-bottom:5px}.empty{text-align:center;padding:60px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:18px;padding:28px;width:min(620px,95vw);max-height:88vh;color:inherit}dialog::backdrop{background:#163d3280;backdrop-filter:blur(3px)}dialog .close{float:right}.fields{display:grid;grid-template-columns:130px 1fr;gap:14px;margin:25px 0;font-size:13px}.fields dt{color:var(--muted)}.fields dd{margin:0;overflow-wrap:anywhere}.pill-links{display:flex;flex-wrap:wrap;gap:8px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#173f32;color:white;padding:13px 24px;border-radius:10px;z-index:10;display:none}.cover{width:100%;aspect-ratio:2.6;object-fit:cover;border-radius:10px}.scenario{border-left:4px solid #97b276}.instructions{line-height:1.8;font-size:14px}.instructions code{background:#e8eee4;padding:3px 6px;border-radius:4px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:12px}footer{font-size:11px;color:var(--muted);margin-top:30px;line-height:1.7}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;padding:18px}.side nav{display:flex;margin:15px 0 0;overflow:auto}.side .local,.side>p{display:none}main{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.hero{padding:22px}.hero .number{display:none}h1{font-size:28px}}@media(max-width:500px){.top{flex-direction:column}.toolbar>*{width:100%;max-width:none}.fields{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">chemist<span>tasker</span></div><p>LOCAL TEST ENVIRONMENT</p><nav aria-label="Main"><button data-view="overview" class="active">◈ &nbsp; Overview</button><button data-view="people">◉ &nbsp; People & access</button><button data-view="network">⌘ &nbsp; Pharmacy network</button><button data-view="scenarios">↔ &nbsp; Test scenarios</button><button data-view="guide">☷ &nbsp; Getting started</button></nav><div class="local"><span class="badge verified">● &nbsp; Synthetic data</span><p>Real app models.<br>Fictional people and businesses.<br>Ready for your next PR.</p></div></aside><main><div class="top"><div><div class="eyebrow">Your development workspace</div><h1 id="heading">A community to test with.</h1><div class="muted small">Explore the relationships. Pick a person. Test the journey.</div></div><div><label class="small" for="target">Open app</label> <select id="target"><option value="http://localhost:3000">Local main · :3000</option></select></div></div><div id="content"></div><footer id="foot"></footer></main></div><dialog id="detail"><button class="close" id="close-dialog" aria-label="Close account details">✕</button><div id="detail-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="data.js"></script><script>
const D=window.PLAYGROUND, $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=new Map(D.users.map(u=>[u.id,u])),P=new Map(D.pharmacies.map(p=>[p.id,p]));let view='overview',page=0,filters={q:'',role:'',employment:'',status:'',pharmacy:'',special:''};
const label=s=>String(s||'').replaceAll('_',' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const badge=(s,text)=>`<span class="badge ${esc(s)}">${esc(text||label(s))}</span>`;
const talentLabel={public:'Public Talent',internal_only:'Internal calendar only',pending:'Public access pending',explorer_post:'Explorer post only'};
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Copied to clipboard')}catch{toast('Clipboard unavailable. Select and copy the displayed text.')}}
function options(values,current){return values.map(x=>`<option value="${esc(x)}" ${x===current?'selected':''}>${esc(label(x))}</option>`).join('')}
function openButton(u){return u.status==='inactive'?'<span class="small muted">Inactive account · login disabled</span>':`<a class="primary open-account" data-open="${u.id}" href="${openHref(u.id,'main')}" target="_blank" rel="noopener">Open web logged in ↗</a><a class="open-account" href="${openHref(u.id,'expo')}" target="_blank" rel="noopener">Open Expo web logged in ↗</a>`}
function openHref(id,target='main'){return `open-user.html?user=${encodeURIComponent(id)}&target=${target}`}
function card(u){return `<article class="card"><div class="person"><img src="${esc(u.photo)}" alt="AI portrait of fictional ${esc(u.name)}" loading="lazy"><div><strong>${esc(u.name)}</strong><span class="small muted">${esc(label(u.subtype||u.role))}</span></div></div><div class="tagline">${badge(u.status)}${u.employment?badge('',label(u.employment)):''}${u.admin.length?badge('','Admin'):''}${u.content.length?badge('',u.content[0]):''}${u.talent_access&&u.talent_access!=='none'?badge('',talentLabel[u.talent_access]||label(u.talent_access)):''}</div><span class="email">${esc(u.email)}</span><div class="small muted">${esc(u.location)} · ${u.pharmacies.length} pharmacies</div><div class="actions"><button data-user="${u.id}">View account</button><button data-copy="${esc(u.email)}" class="primary">Copy email</button>${openButton(u)}</div></article>`}
function stats(){return `<div class="stats"><div class="stat"><strong>${D.users.length}</strong><span>Test accounts · all with portraits</span></div><div class="stat"><strong>${D.pharmacies.length}</strong><span>Pharmacies · 8 staff + owner each</span></div><div class="stat"><strong>${D.organizations.length}</strong><span>Organisations · 10 / 15 / 20 sites</span></div><div class="stat"><strong>${D.counts['client_profile.Shift']}</strong><span>Shifts · offers, cover & rosters</span></div></div>`}
function navigate(v){view=v;page=0;render()}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#heading').textContent={overview:'A community to test with.',people:'Find your next test account.',network:'See how everyone connects.',scenarios:'Put the journeys to work.',guide:'Your playground, ready to use.'}[view];
 if(view==='overview')$('#content').innerHTML=`<section class="hero"><div><div class="eyebrow">Built for realistic testing</div><h2>One playground. Many perspectives.</h2><p>Independent owners, connected chains, regional organisations and the people who keep them running. Move between roles to check the same change from every side.</p><div class="actions"><button class="primary" data-view="people">Explore people →</button><button data-view="network">View network</button></div></div><div class="number">71<span style="display:block;font-size:12px;letter-spacing:1px">PHARMACIES</span></div></section>${stats()}<div class="section-head"><h2>Start with a familiar journey</h2><button data-view="people">All accounts →</button></div><div class="grid">${['owner.independent.01','owner.chain.01','pharmacist.locum.01','content.admin'].map(k=>card(D.users.find(u=>u.key===k))).join('')}</div><div class="notice">Shared local password: <strong>${esc(D.password)}</strong> <button data-copy="${esc(D.password)}">Copy password</button><br>Open web or Expo web logged in launches the selected account in a new tab. Tabs on the same localhost share the latest account.<br>Pending, rejected, inactive and expired profiles are intentional test cases. Some accounts are expected to be blocked from particular actions.</div><div class="grid"><section class="card"><img class="cover" src="assets/content-1.jpg" alt="AI-generated pharmacy team"><h3>Everyday team activity</h3><p class="small muted">Team chats, availability, shift offers, leave requests, draft and paid invoices, community posts, reactions and polls.</p></section><section class="card"><img class="cover" src="assets/content-4.jpg" alt="Demo marketplace equipment"><h3>Two sides of a marketplace</h3><p class="small muted">Switch between seller and buyer. Explore enquiries, proposed terms, reservations, completions and cancellations.</p><button data-view="scenarios">Explore scenarios →</button></section></div>`;
 if(view==='people'){const filtered=D.users.filter(u=>(!filters.q||[u.name,u.email,u.location,u.organization,...u.pharmacies.map(id=>P.get(id)?.name)].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.role||u.role===filters.role||u.subtype===filters.role)&&(!filters.employment||u.employment===filters.employment)&&(!filters.status||u.status===filters.status)&&(!filters.pharmacy||u.pharmacies.includes(+filters.pharmacy))&&(!filters.special||(filters.special==='Content team'?u.content.length:filters.special==='Pharmacy admins'?u.admin.length:u.role==='ORG_STAFF')));
 $('#content').innerHTML=`<div class="toolbar"><input id="search" aria-label="Search people" placeholder="Search name, email, pharmacy or suburb…" value="${esc(filters.q)}"><select id="role" aria-label="Role"><option value="">Every role</option>${options([...new Set(D.users.flatMap(u=>[u.role,u.subtype]).filter(Boolean))],filters.role)}</select><select id="employment" aria-label="Employment"><option value="">Every employment type</option>${options(['FULL_TIME','PART_TIME','CASUAL','LOCUM','SHIFT_HERO'],filters.employment)}</select></div><div class="toolbar"><select id="status" aria-label="Status"><option value="">Every account state</option>${options([...new Set(D.users.map(u=>u.status))],filters.status)}</select><select id="pharmacy" aria-label="Pharmacy"><option value="">All pharmacies</option>${D.pharmacies.map(p=>`<option value="${p.id}" ${+filters.pharmacy===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="special" aria-label="Team"><option value="">All teams</option>${options(['Content team','Pharmacy admins','Organisation team'],filters.special)}</select><button id="clear">Clear filters</button></div><p class="small muted">${filtered.length} matching accounts · showing ${filtered.length?page*24+1:0}–${Math.min((page+1)*24,filtered.length)}</p><div class="grid">${filtered.slice(page*24,(page+1)*24).map(card).join('')||'<div class="empty">No matching people. Try clearing a filter.</div>'}</div><div class="pagination"><button id="prev" ${page===0?'disabled':''}>← Previous</button><span class="small">Page ${page+1} / ${Math.max(1,Math.ceil(filtered.length/24))}</span><button id="next" ${(page+1)*24>=filtered.length?'disabled':''}>Next →</button></div>`;
 $('#search').addEventListener('input',e=>{const pos=e.target.selectionStart;filters.q=e.target.value;page=0;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});['role','employment','status','pharmacy','special'].forEach(k=>$('#'+k).onchange=e=>{filters[k]=e.target.value;page=0;render()});$('#clear').onclick=()=>{Object.keys(filters).forEach(k=>filters[k]='');page=0;render()};$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};}
 if(view==='network'){let groups=[['Independent pharmacies',D.pharmacies.filter(p=>p.kind==='Independent')],...D.users.filter(u=>u.key.startsWith('owner.chain.')).map(u=>[u.name+' · Owner group',D.pharmacies.filter(p=>p.owner===u.id)]),...D.organizations.map(o=>[o.name,D.pharmacies.filter(p=>p.organization===o.id)])];$('#content').innerHTML=stats()+`<p class="muted">Expand a group, then select a pharmacy to see its owner, team and test accounts. Owner groups include connected, partially connected and unconnected stores.</p><div class="network">${groups.map(([name,ps],i)=>`<details ${i===0?'open':''}><summary>${esc(name)} <span class="badge">${ps.length} pharmacies</span></summary><div class="branches">${ps.map(p=>`<button class="branch" data-pharmacy="${p.id}"><strong>${esc(p.name)}</strong><span class="small muted">${esc(p.location)}<br>Owner: ${esc(U.get(p.owner).name)}<br>${esc(p.chain||'No explicit chain connection')}</span><div style="margin-top:9px">${badge(p.verified?'verified':'pending',p.verified?'Verified premises':'Unverified premises')} ${badge('',D.users.filter(u=>u.pharmacies.includes(p.id)).length+' accounts')}</div></button>`).join('')}</div></details>`).join('')}</div>`;}
 if(view==='scenarios')$('#content').innerHTML=`<div class="notice">Select either participant to get their credentials. Use separate browser profiles to test both sides simultaneously. All accounts use the local main checkout and preview database.</div><div class="grid">${[['Verification gates','Filter pending, rejected, email pending, expired or inactive accounts to check access and onboarding.','people'],['Staff permissions','Compare owner, manager, roster manager and communication manager at the same pharmacy.','network'],['Editorial workflow','content.admin manages the team; ten writers and ten publishers cover Blog, News and all six hubs. Draft, scheduled and archived articles are included.','people'],['Roster and finance','Check open shifts, pending offers, assigned work, leave decisions, availability and sample invoices.','network']].map(([title,desc,v])=>`<article class="card scenario"><h3>${title}</h3><p class="small muted">${desc}</p><button data-view="${v}">Find accounts →</button></article>`).join('')}</div><h2>Marketplace conversations</h2><div class="grid">${D.scenarios.map(s=>`<article class="card scenario">${badge('',s.state)}<h3>${esc(s.name)}</h3><div class="small muted">${esc(s.area)} · Record ${esc(s.record)}</div><div class="actions">${s.users.map((id,i)=>`<button data-user="${id}">${i?'Buyer':'Seller'}: ${esc(U.get(id).name)}</button>`).join('')}</div></article>`).join('')}</div>`;
 if(view==='guide')$('#content').innerHTML=`<section class="card instructions" style="margin-top:25px"><h2>Open the app as any test user</h2><ol><li>Choose a test account.</li><li>Find a person and open their account details.</li><li>Click <strong>Open web logged in</strong> or <strong>Open Expo web logged in</strong> to launch that person in a new app tab automatically. Start Expo web on port 8082 first.</li><li>Use a separate browser profile for simultaneous roles: tabs on the same localhost share the latest account. Manual email/password login is also available.</li></ol><h2>Restart and refresh</h2><p>From the checkout root, run <code>.\\developer-playground\\start.ps1</code>. To refresh seeded fixtures, run <code>..\\tmp\\ezy-backend-venv\\Scripts\\python.exe .\\developer-playground\\seed.py</code>. Refreshing preserves unrelated test records and restores fixture values.</p><p>The script runs migrations against the local preview database. Back up before testing incompatible schema changes.</p><h2>What the state means</h2><p>Verified means seeded onboarding and identity flags. Pending / rejected refer to verification. Email pending accounts have unverified email. Inactive accounts cannot log in. Expired pharmacist accounts have a past AHPRA expiry date. Terms pending accounts have not accepted marketplace terms. Membership invitations have separate accepted, pending, rejected and left states.</p><h2>Fixture coverage</h2><table><tbody>${Object.entries(D.counts).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join('')}</tbody></table><h2>Local data notes</h2>${D.notes.map(n=>`<p>${esc(n)}</p>`).join('')}<p>AI photos are synthetic and reused across accounts. They are matched to the planned role and name group. No real identity documents, registration numbers, tax numbers or bank details are used.</p><a href="README.md">Read setup and limitations</a></section>`;
 $('#foot').textContent='Seed snapshot: '+new Date(D.generated).toLocaleString()+' · All data is fictional · Directory is a snapshot; reseed to refresh it.';
}
function showUser(id){const u=U.get(+id);if(!u)return;$('#detail-body').innerHTML=`<div class="person" style="padding-right:35px"><img src="${esc(u.photo)}" alt="Synthetic portrait"><div><h2>${esc(u.name)}</h2>${badge(u.status)}</div></div><dl class="fields"><dt>Login email</dt><dd>${esc(u.email)}</dd><dt>Password</dt><dd><code>${esc(D.password)}</code></dd><dt>Role / category</dt><dd>${esc(label(u.role))} / ${esc(label(u.subtype))}</dd><dt>Employment</dt><dd>${esc(label(u.employment)||'Not applicable')}</dd><dt>Permissions</dt><dd>${esc([...u.admin,...u.content].map(label).join(', ')||'Standard member')}</dd><dt>Organisation</dt><dd>${esc(u.organization||'See linked pharmacies')}</dd><dt>Uniform</dt><dd>${esc(label(u.uniform))}</dd><dt>Test state</dt><dd>${esc(label(u.status))}${u.status==='inactive'?' — login intentionally disabled':''}</dd></dl><div class="actions"><button data-copy="${esc(u.email)}">Copy email</button><button data-copy="${esc(D.password)}">Copy password</button><a class="primary" style="padding:10px;border-radius:9px;text-decoration:none" href="${$('#target').value}/login" target="_blank" rel="noopener">Open login ↗</a></div><div class="actions">${openButton(u)}</div><p class="small muted">Opens a new tab already signed in. Other app tabs on the same localhost share this account. Use separate browser profiles for simultaneous users.</p><h3>Linked pharmacies</h3><div class="pill-links">${u.pharmacies.map(id=>`<button data-pharmacy="${id}">${esc(P.get(id).name)}</button>`).join('')||'<p class="small muted">No direct pharmacy membership.</p>'}</div>`;$('#detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-user],[data-copy],[data-pharmacy]');if(!b)return;if(b.dataset.view)navigate(b.dataset.view);if(b.dataset.user)showUser(b.dataset.user);if(b.dataset.copy)copy(b.dataset.copy);if(b.dataset.pharmacy){$('#detail').close();Object.keys(filters).forEach(k=>filters[k]='');filters.pharmacy=b.dataset.pharmacy;navigate('people')}});$('#close-dialog').onclick=()=>$('#detail').close();$('#target').onchange=()=>document.querySelectorAll('[data-open]').forEach(a=>a.href=openHref(a.dataset.open));render();
</script></body></html>
